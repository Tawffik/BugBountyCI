name: "🔍 Reconnaissance Pipeline"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target domain (e.g., example.com)"
        required: true
        type: string
  workflow_call:
    inputs:
      target:
        description: "Target domain"
        required: true
        type: string

jobs:
  recon:
    name: "🌐 Full Reconnaissance"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
      
      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: "📦 Install Dependencies"
        run: |
          pip install requests pyyaml
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: "🛠️ Install Recon Tools"
        run: |
          # Install Go
          wget https://go.dev/dl/go1.21.6.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.21.6.linux-amd64.tar.gz
          export PATH=$PATH:/usr/local/go/bin
          
          # Install subfinder
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          
          # Install httpx
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          
          # Install amass
          go install -v github.com/owasp-amass/amass/v3/...@master
          
          echo "$HOME/go/bin" >> $GITHUB_PATH
      
      - name: "🌐 Subdomain Enumeration"
        run: |
          python modules/recon/01_subdomain.py ${{ inputs.target }} results/recon
      
      - name: "🌍 Live Probing"
        run: |
          python modules/recon/02_live_probe.py results/recon/all_subs.txt results/recon
      
      - name: "👻 Ghost Layer: Temporal Recon"
        run: |
          python modules/recon/03_temporal.py ${{ inputs.target }} results/ghost
      
      - name: "👻 Ghost Layer: Parameter Mining"
        run: |
          python modules/recon/04_param_ghost.py results/ghost/all_temporal_urls.txt ${{ inputs.target }} results/ghost
      
      - name: "👻 Ghost Layer: JS Deep Mining"
        run: |
          # First collect URLs with katana/gau
          cat results/recon/live.txt | httpx -silent | katana -silent -json > results/urls.txt 2>/dev/null || true
          python modules/recon/05_js_deep.py results/urls.txt results/js
      
      - name: "📤 Upload Results"
        uses: actions/upload-artifact@v4
        with:
          name: recon-results-${{ github.run_id }}
          path: results/
          retention-days: 30
