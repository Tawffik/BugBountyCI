#!/usr/bin/env bash
###############################################################################
#  security-audit.sh â€“ Security Auditing Framework (Hardened v2.0)
#
#  Usage:
#    chmod +x security-audit.sh
#    ./security-audit.sh
#     (you will be prompted for the target repo path)
#
#  Output:
#    ./audit-results/
#      reports/          â†’ Markdown, SARIF, HTML
#      findings/         â†’ raw JSON findings (redacted matches)
#      ai-reports/       â†’ AI-enriched findings (if API key set)
#
#  Dependencies:
#    - bash >= 4.0
#    - git
#    - python3 (standard library only â€” no pip install needed)
#
#  Environment variables (optional):
#    ANTHROPIC_API_KEY   â†’ enables AI enrichment via Anthropic
#    OPENROUTER_API_KEY  â†’ enables AI enrichment via OpenRouter
#    AI_MODEL            â†’ override model (must be in ALLOWED_MODELS)
#    MAX_COMMITS         â†’ git history depth cap (default: 500)
#    KEEP_FINDINGS=1     â†’ skip cleanup of findings dir on exit
###############################################################################
set -euo pipefail
IFS=$'\n\t'

# ---- Color helpers ----
RED='\033[0;31m'; GREEN='\033[0;32m'; YELLOW='\033[1;33m'; CYAN='\033[0;36m'
BOLD='\033[1m'; NC='\033[0m'
info()  { >&2 echo -e "${CYAN}[INFO]${NC}  $*"; }
ok()    { >&2 echo -e "${GREEN}[OK]${NC}    $*"; }
warn()  { >&2 echo -e "${YELLOW}[WARN]${NC}  $*"; }
err()   { >&2 echo -e "${RED}[ERROR]${NC} $*"; }

# ---- Config ----
# FIX C1: API keys read from environment only â€” never passed as argv
AI_ANTHROPIC_KEY="${ANTHROPIC_API_KEY:-}"
AI_OPENROUTER_KEY="${OPENROUTER_API_KEY:-}"

# FIX H2: Allowlist for accepted model identifiers
readonly ALLOWED_MODELS=(
    "claude-sonnet-4-20250514"
    "claude-haiku-4-5-20251001"
    "claude-opus-4-20250514"
)
AI_MODEL="${AI_MODEL:-claude-sonnet-4-20250514}"

OUTDIR=""
SCAN_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)   # FIX L5: canonical scan start time

usage() {
    cat <<EOF
Usage: $(basename "$0") [options]

Options:
  -p, --path PATH        Target repository path (default: prompt)
  -o, --output DIR       Output directory (default: ./audit-results)
  -m, --model MODEL      AI model name (default: claude-sonnet-4-20250514)
  -h, --help             Show this help

WARNING: The output directory will contain sensitive findings.
         Do NOT commit it to version control or share publicly.

If --path is not given, you will be prompted interactively.
EOF
    exit 0
}

while [[ $# -gt 0 ]]; do
    case "$1" in
        -p|--path)     TARGET_REPO="$2"; shift 2 ;;
        -o|--output)   OUTDIR="$2"; shift 2 ;;
        -m|--model)    AI_MODEL="$2"; shift 2 ;;
        -h|--help)     usage ;;
        *)             err "Unknown option: $1"; usage ;;
    esac
done

# FIX H2: Validate model against allowlist
_model_ok=0
for _m in "${ALLOWED_MODELS[@]}"; do
    [[ "$_m" == "$AI_MODEL" ]] && { _model_ok=1; break; }
done
if [[ $_model_ok -eq 0 ]]; then
    err "Invalid model '$AI_MODEL'. Allowed: ${ALLOWED_MODELS[*]}"
    exit 1
fi

# ---- Interactive prompt ----
if [[ -z "${TARGET_REPO:-}" ]]; then
    echo -n "${BOLD}Enter target repository path: ${NC}"
    read -r TARGET_REPO
    if [[ -z "$TARGET_REPO" ]]; then
        err "No path provided. Exiting."
        exit 1
    fi
fi

# FIX C3: Canonicalize and validate path â€” reject traversal and symlinks
TARGET_REPO=$(realpath --canonicalize-existing "$TARGET_REPO" 2>/dev/null) \
    || { err "Path does not exist or cannot be resolved: '$TARGET_REPO'"; exit 1; }

if [[ ! -d "$TARGET_REPO" ]]; then
    err "Not a directory: '$TARGET_REPO'"
    exit 1
fi

if [[ -L "$TARGET_REPO" ]]; then
    err "TARGET_REPO '$TARGET_REPO' is a symlink â€” refusing to scan symlink targets."
    exit 1
fi

PROJECT_ROOT="$TARGET_REPO"
export PROJECT_ROOT

OUTDIR="${OUTDIR:-./audit-results}"

# FIX H6: Check OUTDIR is not a symlink before creating it
if [[ -L "$OUTDIR" ]]; then
    err "Output directory '$OUTDIR' is a symlink â€” refusing to write."
    exit 1
fi

mkdir -p "$OUTDIR"/{reports,findings,ai-reports}

# FIX INFO: Auto-create .gitignore warning in output dir
{
    echo "# Auto-generated by security-audit.sh"
    echo "# This directory contains SENSITIVE FINDINGS â€” do not commit."
    echo "*"
} > "$OUTDIR/.gitignore"

# FIX L2: Cleanup trap â€” remove partial findings on unexpected exit
_tmpfiles=()
cleanup() {
    for _f in "${_tmpfiles[@]:-}"; do
        [[ -f "$_f" ]] && rm -f "$_f"
    done
    if [[ "${KEEP_FINDINGS:-}" != "1" && -d "$OUTDIR/findings" ]]; then
        : # Keep findings by default; set KEEP_FINDINGS=0 to remove
    fi
}
trap cleanup EXIT

info "Target:     ${BOLD}$PROJECT_ROOT${NC}"
info "Output:     ${BOLD}$OUTDIR${NC}"
info "Scan start: ${BOLD}$SCAN_START${NC}"

