    md.append("")
    md.append(str(ai_data['ai_analysis'])[:8000])
    md.append("")

if secrets:
    md.append("## Secrets Found (Regex)")
    md.append("")
    md.append("| # | ID | Severity | File | Line | Match (redacted) |")
    md.append("|---|-----|----------|------|------|-------|")
    for i, s in enumerate(secrets[:50], 1):
        md.append(f"| {i} | {s['id']} | {s['severity']} | {s['file']} | {s['line']} | `{s['match'][:50]}` |")
    if len(secrets) > 50:
        md.append(f"| ... | ... | ... | ... | ... | *{len(secrets)-50} more findings* |")
    md.append("")

if sensitive:
    md.append("## Sensitive Files")
    md.append("")
