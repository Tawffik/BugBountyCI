import json, os, sys
from datetime import datetime, timezone   # FIX L4: timezone-aware

secrets_file   = sys.argv[1]
sens_file      = sys.argv[2]
git_file       = sys.argv[3]
misconfig_file = sys.argv[4]
ai_file        = sys.argv[5]
report_md      = sys.argv[6]
report_sarif   = sys.argv[7]
report_html    = sys.argv[8]
target         = sys.argv[9]
scan_start     = sys.argv[10]   # FIX L5: canonical start time from bash

def load_json(path):
    if os.path.exists(path) and os.path.getsize(path) > 0:
        try:
            return json.load(open(path))
        except Exception:
            return []
    return []

secrets    = load_json(secrets_file)
sensitive  = load_json(sens_file)
git_secrets= load_json(git_file)
misconfigs = load_json(misconfig_file)
ai_data    = {}
if os.path.exists(ai_file) and os.path.getsize(ai_file) > 0:
