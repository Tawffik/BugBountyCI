    except Exception:
        ai_data = {}

scan_time      = datetime.now().strftime('%Y-%m-%d %H:%M:%S')
total_findings = len(secrets) + len(sensitive) + len(git_secrets) + len(misconfigs)

def severity_score(s):
    return {'CRITICAL': 4, 'HIGH': 3, 'MEDIUM': 2, 'LOW': 1, 'INFO': 0}.get(s, 0)

def severity_color(s):
    return {'CRITICAL': '#e74c3c', 'HIGH': '#e67e22', 'MEDIUM': '#f1c40f', 'LOW': '#3498db', 'INFO': '#95a5a6'}.get(s, '#95a5a6')

critical_count = sum(1 for f in secrets + misconfigs if f.get('severity') == 'CRITICAL')
high_count     = sum(1 for f in secrets + misconfigs if f.get('severity') == 'HIGH')

