# ===================== MAIN =====================
main() {
    local REQ_CMDS=("git" "python3" "basename" "dirname" "mktemp" "sort" "uniq" "realpath")
    for cmd in "${REQ_CMDS[@]}"; do
        if ! command -v "$cmd" &>/dev/null; then
            err "Required command '$cmd' not found. Please install it."
            exit 1
        fi
    done

    # FIX C2: Write regex JSON to a temp file â€” not passed as argv
    local REGEX_TMP
    REGEX_TMP=$(mktemp)
    _tmpfiles+=("$REGEX_TMP")
    printf '%s' "$SECRETS_REGEX" > "$REGEX_TMP"
    chmod 600 "$REGEX_TMP"

    local SECRETS_FILE="$OUTDIR/findings/secrets-regex.json"
    local SECRETS_SUMMARY="$OUTDIR/findings/secrets-summary.json"
    local MISCONFIG_FILE="$OUTDIR/findings/misconfig-findings.json"
    local FINAL_REPORT="$OUTDIR/reports/audit-report.md"
    local SARIF_FILE="$OUTDIR/reports/audit-report.sarif"
    local HTML_FILE="$OUTDIR/reports/audit-report.html"
    local GIT_SECRETS_FILE="$OUTDIR/findings/secrets-git.json"

    rm -f "$SECRETS_FILE" "$SECRETS_SUMMARY" "$MISCONFIG_FILE"

    # ----------------------------------------------------------
    # PHASE 1 â€” Secrets Scan (Regex)
    # ----------------------------------------------------------
    info "Phase 1/6: Secrets scan (regex-based) ..."
    python3 - "$PROJECT_ROOT" "$SECRETS_FILE" "$REGEX_TMP" <<'PYEOF'
import json, os, re, sys

root = sys.argv[1]
out  = sys.argv[2]
regex_file = sys.argv[3]   # FIX C2: read from file, not argv string

with open(regex_file) as _rf:
    raw_regex = _rf.read()

try:
    patterns = [
        json.loads(line)
        for line in raw_regex.strip().splitlines()
        if line.strip() and not line.startswith('#') and line.strip() != 'SREGEX'
    ]
except json.JSONDecodeError as e:
    print(f"JSON decode error in secrets regex: {e}", file=sys.stderr)
    sys.exit(1)

# FIX C4: Helper to redact secret matches â€” never store raw secrets
def redact(s, keep=4):
    s = str(s)
    if len(s) <= keep * 2:
        return '*' * len(s)
    return s[:keep] + '*' * (len(s) - keep * 2) + s[-keep:]

findings = []
compiled = []
for p in patterns:
    try:
        compiled.append((p, re.compile(p['regex'])))
    except re.error as e:
        print(f"Regex compile error for {p['id']}: {e}", file=sys.stderr)
        continue

MAX_LINE_LEN  = 2000   # FIX C4: ReDoS mitigation
MAX_FILE_BYTES = 1_048_576  # FIX M1: 1 MB per file cap
MAX_FILES     = 50_000  # FIX M1: total file cap
file_count    = 0

SKIP_DIRS = {'node_modules', '.git', '__pycache__', 'venv', '.venv', 'vendor', 'dist', 'build', '.terraform', '.serverless'}
SKIP_EXTS = {'.png','.jpg','.jpeg','.gif','.ico','.woff','.woff2','.ttf','.eot','.pdf',
             '.zip','.tar','.gz','.bz2','.7z','.rar','.exe','.dll','.so','.dylib',
             '.bin','.dat','.class','.pyc','.o','.a','.lib','.obj','.map',
             '.min.js','.min.css'}

for dirpath, dirnames, filenames in os.walk(root):
    if file_count >= MAX_FILES:
        print(f"WARN: MAX_FILES ({MAX_FILES}) reached, stopping early", file=sys.stderr)
        break
    dirnames[:] = [
        d for d in dirnames
        if d not in SKIP_DIRS and (not d.startswith('.') or d == '.github')
    ]
    for fn in filenames:
        if file_count >= MAX_FILES:
            break
        ext = os.path.splitext(fn)[1].lower()
        if ext in SKIP_EXTS:
            continue
        fpath = os.path.join(dirpath, fn)
        try:
            with open(fpath, 'r', errors='ignore') as f:
                content = f.read(MAX_FILE_BYTES)  # FIX M1: cap read size
        except Exception:
            continue
        file_count += 1
        for lineno, line in enumerate(content.splitlines(), 1):
            if len(line) > MAX_LINE_LEN:  # FIX C4: skip oversized lines
                continue
            for p, pat in compiled:
                for m in pat.finditer(line):
                    findings.append({
                        'id':          p['id'],
                        'name':        p['name'],
                        'severity':    p['severity'],
                        'file':        os.path.relpath(fpath, root),
                        'line':        lineno,
                        'match':       redact(m.group()),  # FIX H3: redacted
                        'description': p.get('description', '')
                    })

with open(out, 'w') as f:
    json.dump(findings, f, indent=2)

print(f"Found {len(findings)} secret matches across {file_count} files")
PYEOF

    # ----------------------------------------------------------
    # PHASE 2 â€” Secrets Scan (Sensitive Files)
    # ----------------------------------------------------------
    info "Phase 2/6: Sensitive file scan ..."
    python3 - "$PROJECT_ROOT" "$SECRETS_SUMMARY" <<'PYEOF'
import json, os, re, sys

root = sys.argv[1]
# FIX M2: Removed lock files from HIGH â€” they are intentional commits
# Lock files downgraded to INFO
sensitive_files_high = [
    r'\.env$', r'\.env\.\w+$', r'\.env\.local$', r'\.env\.production$', r'\.env\.dev$',
    r'credentials?\.(?:json|ini|conf)$',
    r'secret\.\w+$', r'\.secret$', r'secrets?\.\w+$',
    r'\.git-credentials$', r'\.netrc$', r'\.aws/config$', r'\.aws/credentials$',
    r'\.kube/config$', r'kubeconfig$',
    r'id_rsa$', r'id_dsa$', r'id_ecdsa$', r'id_ed25519$',
    r'authorized_keys$',
    r'.*\.jks$', r'.*\.p12$', r'.*\.pfx$', r'.*\.pem$', r'.*\.key$',
    r'.*\.crt$', r'.*\.cert$', r'.*\.cer$',
    r'terraform\.tfstate$', r'terraform\.tfvars$',
    r'\.sops\.\w+$', r'\.age\.\w+$',
]
sensitive_files_info = [
    r'Pipfile\.lock$', r'poetry\.lock$',
    r'package-lock\.json$', r'yarn\.lock$', r'pnpm-lock\.yaml$',
    r'Gemfile\.lock$', r'Cargo\.lock$', r'composer\.lock$',
    r'Makefile$', r'docker-compose\.yml$', r'docker-compose\.yaml$',
    r'Dockerfile$', r'Dockerfile\.\w+$',
]

def make_findings(patterns, severity):
    return [(re.compile(p), severity) for p in patterns]

compiled_h = make_findings(sensitive_files_high, 'HIGH')
compiled_i = make_findings(sensitive_files_info, 'INFO')
all_compiled = compiled_h + compiled_i

findings = []
SKIP_DIRS = {'node_modules', '.git', '__pycache__', 'venv', '.venv', 'vendor', 'dist', 'build'}

for dirpath, dirnames, filenames in os.walk(root):
    dirnames[:] = [d for d in dirnames if not d.startswith('.') or d == '.github']
    dirnames[:] = [d for d in dirnames if d not in SKIP_DIRS]
    for fn in filenames:
        fpath = os.path.join(dirpath, fn)
        rel   = os.path.relpath(fpath, root)
        for pat, sev in all_compiled:
            if pat.search(fn) or pat.search(rel):
                findings.append({
                    'id':          'sensitive-file',
                    'name':        'Sensitive File Present',
                    'severity':    sev,
                    'file':        rel,
                    'description': f'Matched pattern: {pat.pattern}'
                })
                break

with open(sys.argv[2], 'w') as f:
    json.dump(findings, f, indent=2)

print(f"Found {len(findings)} sensitive files")
PYEOF

    # ----------------------------------------------------------
    # PHASE 3 â€” Secrets Scan (Git History)
    # ----------------------------------------------------------
    info "Phase 3/6: Git history scan (commits) ..."
    python3 - "$PROJECT_ROOT" "$GIT_SECRETS_FILE" <<'PYEOF'
import json, os, re, subprocess, sys

# FIX C4: Helper to redact secret matches
def redact(s, keep=4):
    s = str(s)
    if len(s) <= keep * 2:
        return '*' * len(s)
    return s[:keep] + '*' * (len(s) - keep * 2) + s[-keep:]

sr  = sys.argv[1]
out = sys.argv[2]

try:
    res = subprocess.run(
        ['git', 'log', '--oneline', '--reverse'],
        cwd=sr, capture_output=True, text=True, timeout=30
    )
    if res.returncode != 0:
        print(f"No git history found: {res.stderr.strip()}", file=sys.stderr)
        with open(out, 'w') as f: json.dump([], f)
        sys.exit(0)
    commits = [l.split()[0] for l in res.stdout.strip().splitlines() if l.strip()]
except Exception as e:
    print(f"Git log error: {e}", file=sys.stderr)
    with open(out, 'w') as f: json.dump([], f)
    sys.exit(0)

if not commits:
    print("No commits found")
    with open(out, 'w') as f: json.dump([], f)
    sys.exit(0)

# FIX H4: Cap to most recent MAX_COMMITS
MAX_COMMITS = int(os.environ.get('MAX_COMMITS', '500'))
if len(commits) > MAX_COMMITS:
    print(f"WARN: Capping git history to last {MAX_COMMITS} of {len(commits)} commits", file=sys.stderr)
    commits = commits[-MAX_COMMITS:]

MAX_LINE_LEN   = 2000     # FIX C4: ReDoS mitigation
MAX_DIFF_BYTES = 500_000  # FIX H4: cap diff output per commit

secret_pats = [
    re.compile(r'(?:AKIA|ASIA)[0-9A-Z]{16}'),
    re.compile(r'ghp_[0-9a-zA-Z]{36}'),
    re.compile(r'glpat-[0-9a-zA-Z_-]{20,}'),
    re.compile(r'xox[baprs]-[0-9a-zA-Z-]{10,}'),
    re.compile(r'-----BEGIN\s?(?:RSA|DSA|EC|OPENSSH|PGP)?\s?PRIVATE KEY-----'),
    re.compile(r"(?i)(?:password|secret|token|key|credential).{0,10}[:=]\s*['\"][^'\"]{8,}['\"]"),
    re.compile(r'Authorization:\s*(?:Bearer|Basic)\s+[A-Za-z0-9+/=_-]{20,}'),
    re.compile(r'https?://[^:]+:[^@]+@'),
]

findings = []
for ch in commits:
    try:
        d = subprocess.run(
            ['git', 'show', ch, '--format=', '--diff-filter=A', '-U0'],
            cwd=sr, capture_output=True, text=True, timeout=5
        ).stdout[:MAX_DIFF_BYTES]   # FIX H4: hard cap
    except subprocess.TimeoutExpired:
        print(f"WARN: Timeout on commit {ch}, skipping", file=sys.stderr)  # FIX M4: no more NameError
        continue
    if not d.strip():
        continue

    for pat in secret_pats:
        for m in pat.finditer(d):
            if len(m.group()) > MAX_LINE_LEN:  # FIX C4
                continue
            context_line = ''
            for line in d.splitlines():
                if len(line) <= MAX_LINE_LEN and m.group() in line:
                    context_line = line.strip()[:120]
                    break
            findings.append({
                'commit':   ch,
                'pattern':  pat.pattern[:60],
