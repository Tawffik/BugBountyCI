# MARKDOWN
# ========================
def html_escape(s):
    return str(s).replace('&','&amp;').replace('<','&lt;').replace('>','&gt;').replace('"','&quot;')

md = []
md.append("# Security Audit Report")
md.append("")
md.append(f"**Target:** `{target}`")
md.append(f"**Scan Start:** {scan_start}")
md.append(f"**Report Generated:** {scan_time}")
md.append(f"**Total Findings:** {total_findings}")
