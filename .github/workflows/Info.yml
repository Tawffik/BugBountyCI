def add_rule(rule_id, name, desc, sev):
    if rule_id not in sarif_rules:
        sarif_rules[rule_id] = {
            'id': rule_id,
            'name': name,
            'shortDescription': {'text': desc},
            'fullDescription': {'text': desc},
            'defaultConfiguration': {'level': 'error' if sev in ('CRITICAL','HIGH') else 'warning'},
            'properties': {'security-severity': str(severity_score(sev))}
        }

for s in secrets:
    add_rule(s['id'], s['name'], s['description'], s['severity'])
    sarif_results.append({
        'ruleId': s['id'],
        'message': {'text': f"Match: {s['match'][:80]}"},
        'level': 'error' if s['severity'] in ('CRITICAL','HIGH') else 'warning',
        'locations': [{
            'physicalLocation': {
                'artifactLocation': {'uri': s['file']},
                'region': {'startLine': s['line'], 'snippet': {'text': s['match'][:80]}}
            }
        }]
    })

for m in misconfigs:
    add_rule(m['id'], m['name'], m.get('description',''), m['severity'])
    sarif_results.append({
        'ruleId': m['id'],
        'message': {'text': m.get('description','') + f" - {m['match'][:80]}"},
        'level': 'error' if m['severity'] in ('CRITICAL','HIGH') else 'warning',
        'locations': [{
            'physicalLocation': {
                'artifactLocation': {'uri': m['file']},
                'region': {'startLine': m['line'], 'snippet': {'text': m['match'][:80]}}
            }
        }]
    })

