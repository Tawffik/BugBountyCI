import json, os, re, sys

root = sys.argv[1]
out  = sys.argv[2]
findings = []

MAX_LINE_LEN   = 2000   # FIX C4: ReDoS mitigation
MAX_FILE_BYTES = 1_048_576

# FIX M6: Config-only extensions for noisy patterns (debug mode etc.)
CONFIG_EXTS = {'.env', '.cfg', '.ini', '.conf', '.config', '.yaml', '.yml', '.toml', '.properties'}

misconfig_patterns = [
    {
        'id': 'debug-enabled', 'name': 'Debug Mode Enabled', 'severity': 'HIGH',
        'desc': 'Debug mode should be disabled in production',
        'regex': r'(?i)(?:APP_DEBUG\s*[=:]\s*(?:true|1|enabled)|FLASK_DEBUG\s*[=:]\s*1)',
        'config_only': True   # FIX M6: restrict to config files
    },
    {
        'id': 'hardcoded-host', 'name': 'Hardcoded Internal Host', 'severity': 'LOW',
        'desc': 'Hardcoded host/port detected',
        'regex': r'(?i)(?:host|server|endpoint)\s*[=:]\s*["\'](?:https?://|)(?:localhost|127\.0\.0\.1|0\.0\.0\.0)["\']',
        'config_only': False
    },
    {
        'id': 'ssl-verify-disabled', 'name': 'SSL Verification Disabled', 'severity': 'CRITICAL',
        'desc': 'SSL verification explicitly disabled',
        'regex': r'(?i)(?:ssl_verify|verify_ssl|ssl_check)\s*[=:]\s*(?:false|0|no|off|disabled)',
        'config_only': False
    },
    {
        'id': 'insecure-cipher', 'name': 'Insecure Cipher/Protocol', 'severity': 'HIGH',
        'desc': 'Insecure SSL/TLS configuration',
        'regex': r'(?i)(?:TLSv1\.0|TLSv1\.1|SSLv3|SSLv2|RC4|3DES|EXPORT\d+)',
        'config_only': False
    },
    {
        'id': 'wildcard-cors', 'name': 'Wildcard CORS', 'severity': 'MEDIUM',
        'desc': 'CORS allows all origins',
        'regex': r'(?i)Access-Control-Allow-Origin\s*[=:]\s*["\']\*["\']',
        'config_only': False
    },
    {
        'id': 'loose-permissions', 'name': 'Loose File Permissions', 'severity': 'MEDIUM',
        'desc': 'Files with 777 or 666 permissions',
        'regex': r'(?i)(?:chmod|umask)\s*(?:777|666|0777|0666)',
        'config_only': False
    },
    {
        'id': 'hardcoded-admin-creds', 'name': 'Hardcoded Admin Credentials', 'severity': 'CRITICAL',
        'desc': 'Default/hardcoded credentials found',
        'regex': r'(?i)(?:admin|root)\s*[=:]\s*["\'](?:admin|root|test|password|123456|P@ssw0rd)["\']',
        'config_only': False
    },
    {
        'id': 'insecure-session', 'name': 'Insecure Session Config', 'severity': 'HIGH',
        'desc': 'Insecure session settings',
        'regex': r'(?i)SESSION_COOKIE_(?:HTTPONLY|SECURE|SAMESITE)\s*[=:]\s*(?:false|0|None|null)',
        'config_only': True
    },
]

SKIP_DIRS = {'node_modules', '.git', '__pycache__', 'venv', '.venv', 'vendor', 'dist', 'build'}
SKIP_EXTS = {'.png','.jpg','.jpeg','.gif','.ico','.woff','.woff2','.ttf','.eot','.pdf',
             '.zip','.tar','.gz','.bz2','.7z','.rar','.exe','.dll','.so','.dylib',
             '.bin','.dat','.class','.pyc','.o','.a','.lib','.obj','.map'}

for pat in misconfig_patterns:
    cp = re.compile(pat['regex'])
    for dirpath, dirnames, filenames in os.walk(root):
        dirnames[:] = [d for d in dirnames if not d.startswith('.') or d == '.github']
        dirnames[:] = [d for d in dirnames if d not in SKIP_DIRS]
        for fn in filenames:
            ext = os.path.splitext(fn)[1].lower()
            if ext in SKIP_EXTS:
                continue
            # FIX M6: restrict debug/session patterns to config files only
            if pat.get('config_only') and ext not in CONFIG_EXTS:
                continue
            fpath = os.path.join(dirpath, fn)
            try:
                with open(fpath, 'r', errors='ignore') as f:
                    content = f.read(MAX_FILE_BYTES)
            except Exception:
                continue
            for lineno, line in enumerate(content.splitlines(), 1):
                if len(line) > MAX_LINE_LEN:  # FIX C4
                    continue
                if cp.search(line):
                    findings.append({
                        'id':          pat['id'],
                        'name':        pat['name'],
                        'severity':    pat['severity'],
                        'file':        os.path.relpath(fpath, root),
                        'line':        lineno,
                        'match':       line.strip()[:100],
                        'description': pat['desc']
                    })

# ---- 4b: CI/CD Audit ----
github_dir = os.path.join(root, '.github', 'workflows')
if os.path.isdir(github_dir):
    for fn in sorted(os.listdir(github_dir)):
        if not fn.endswith(('.yml', '.yaml')):
            continue
        fpath = os.path.join(github_dir, fn)
        try:
            with open(fpath, 'r') as f:
                lines = f.readlines()
        except Exception:
            continue
        for lineno, line in enumerate(lines, 1):
            if len(line) > MAX_LINE_LEN:  # FIX C4
                continue
            stripped = line.strip()
            if re.match(r'^\s*-\s+uses:\s+[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+@(?:main|master|latest)\s*$', stripped):
                action = stripped.split('uses:')[1].strip() if 'uses:' in stripped else ''
                findings.append({
                    'id': 'unpinned-action', 'name': 'Unpinned GitHub Action',
                    'severity': 'MEDIUM',
                    'file': os.path.join('.github/workflows', fn),
                    'line': lineno, 'match': stripped[:100],
                    'description': f'Action "{action}" uses a floating tag'
                })
            if re.search(r'privileged\s*:\s*true', stripped):
                findings.append({
                    'id': 'privileged-container', 'name': 'Privileged Container Mode',
                    'severity': 'HIGH',
                    'file': os.path.join('.github/workflows', fn),
                    'line': lineno, 'match': stripped[:100],
                    'description': 'Container running in privileged mode'
                })
            if re.search(r'write-all', stripped) or re.search(r'contents:\s*write', stripped):
                findings.append({
                    'id': 'overly-permissive-token', 'name': 'Overly Permissive GITHUB_TOKEN',
                    'severity': 'MEDIUM',
                    'file': os.path.join('.github/workflows', fn),
                    'line': lineno, 'match': stripped[:100],
                    'description': 'GITHUB_TOKEN has excessive write permissions'
                })

with open(out, 'w') as f:
    json.dump(findings, f, indent=2)

print(f"Found {len(findings)} misconfiguration findings")
