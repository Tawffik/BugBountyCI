    echo ""
    if [[ -n "$AI_ANTHROPIC_KEY" || -n "$AI_OPENROUTER_KEY" ]]; then
        echo -e "    ${CYAN}AI Analysis:${NC} $OUTDIR/ai-reports/ai-enriched.json"
    fi
    echo ""
}

main "$@"
