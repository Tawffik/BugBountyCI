# ===================== MAIN =====================
main() {
    local REQ_FILES=("git" "python3" "basename" "dirname" "mktemp" "sort" "uniq")
    for cmd in "${REQ_FILES[@]}"; do
        if ! command -v "$cmd" &>/dev/null; then
            err "Required command '$cmd' not found. Please install it."
            exit 1
        fi
    done

    local SECRETS_FILE="$OUTDIR"/findings/secrets-regex.json
    local SECRETS_SUMMARY="$OUTDIR"/findings/secrets-summary.json
    local MISCONFIG_FILE="$OUTDIR"/findings/misconfig-findings.json
    local FINAL_REPORT="$OUTDIR"/reports/audit-report.md
    local SARIF_FILE="$OUTDIR"/reports/audit-report.sarif
    local HTML_FILE="$OUTDIR"/reports/audit-report.html

    rm -f "$SECRETS_FILE" "$SECRETS_SUMMARY" "$MISCONFIG_FILE"

    # ----------------------------------------------------------
    # PHASE 1 — Secrets Scan (Regex)
    # ----------------------------------------------------------
    info "Phase 1/6: Secrets scan (regex-based) ..."
    python3 - "$PROJECT_ROOT" "$SECRETS_FILE" "$SECRETS_REGEX" <<'PYEOF'
import json, os, re, sys

root = sys.argv[1]
out = sys.argv[2]
raw_regex = sys.argv[3]

try:
    patterns = [json.loads(line) for line in raw_regex.strip().splitlines() if line.strip() and not line.startswith('#') and line.strip() != 'SREGEX']
except json.JSONDecodeError as e:
    print(f"JSON decode error in secrets regex: {e}", file=sys.stderr)
    sys.exit(1)

findings = []
compiled = []
for p in patterns:
    try:
        compiled.append((p, re.compile(p['regex'])))
    except re.error as e:
        print(f"Regex compile error for {p['id']}: {e}", file=sys.stderr)
        continue

for dirpath, dirnames, filenames in os.walk(root):
    # Skip hidden dirs (but NOT .github)
    dirnames[:] = [d for d in dirnames if not (d.startswith('.') and d != '.github')]
    # Skip node_modules, .git, __pycache__, etc.
    for skip in ('node_modules','.git','__pycache__','venv','.venv','vendor','dist','build','.terraform','.serverless'):
        if skip in dirnames:
            dirnames.remove(skip)
    for fn in filenames:
        fpath = os.path.join(dirpath, fn)
        # Skip binary-ish extensions
        ext = os.path.splitext(fn)[1].lower()
        if ext in ('.png','.jpg','.jpeg','.gif','.ico','.woff','.woff2','.ttf','.eot','.pdf','.zip','.tar','.gz','.bz2','.7z','.rar','.exe','.dll','.so','.dylib','.bin','.dat','.class','.pyc','.o','.a','.lib','.obj','.min.js','.min.css','.map'):
            continue
        try:
            with open(fpath,'r',errors='ignore') as f:
                content = f.read()
        except Exception:
            continue
        for lineno, line in enumerate(content.splitlines(),1):
            for p, pat in compiled:
                for m in pat.finditer(line):
                    findings.append({
                        'id': p['id'],
                        'name': p['name'],
                        'severity': p['severity'],
                        'file': os.path.relpath(fpath, root),
                        'line': lineno,
                        'match': m.group()[:80],
                        'description': p.get('description','')
                    })

with open(out,'w') as f:
    json.dump(findings, f, indent=2)

print(f"Found {len(findings)} secret matches")
PYEOF

    # ----------------------------------------------------------
    # PHASE 2 — Secrets Scan (Sensitive Files)
    # ----------------------------------------------------------
    info "Phase 2/6: Sensitive file scan ..."
    python3 - "$PROJECT_ROOT" "$SECRETS_SUMMARY" <<'PYEOF'
import json, os, re, sys

root = sys.argv[1]
sensitive_files = [
    r'\.env$', r'\.env\.\w+$', r'\.env\.local$', r'\.env\.production$', r'\.env\.dev$',
    r'credentials?\.(?:json|ini|conf)$', r'config\.(?:json|yaml|yml|ini|conf)$',
    r'secret\.\w+$', r'\.secret$', r'secrets?\.\w+$',
    r'\.git-credentials$', r'\.gitconfig$', r'\.netrc$', r'\.aws/config$', r'\.aws/credentials$',
    r'\.kube/config$', r'kubeconfig$', r'kubectl\.\w+$',
    r'docker-compose\.override\.\w+$', r'docker-compose\.\w+$',
    r'Dockerfile$', r'Dockerfile\.\w+$',
    r'Makefile$', r'docker-compose\.yml$', r'docker-compose\.yaml$',
    r'id_rsa$', r'id_dsa$', r'id_ecdsa$', r'id_ed25519$',
    r'known_hosts$', r'authorized_keys$',
    r'Pipfile$', r'Pipfile\.lock$', r'poetry\.lock$',
    r'package-lock\.json$', r'yarn\.lock$', r'pnpm-lock\.yaml$',
    r'Gemfile\.lock$', r'Cargo\.lock$', r'composer\.lock$',
    r'.*\.jks$', r'.*\.p12$', r'.*\.pfx$', r'.*\.pem$', r'.*\.key$',
    r'.*\.crt$', r'.*\.cert$', r'.*\.cer$', r'.*\.p7b$', r'.*\.p7c$',
    r'iaas\.json$', r'terraform\.tfstate$', r'terraform\.tfvars$',
    r'\.sops\.\w+$', r'\.age\.\w+$',
]

compiled_patterns = [re.compile(p) for p in sensitive_files]
findings = []

for dirpath, dirnames, filenames in os.walk(root):
    dirnames[:] = [d for d in dirnames if not d.startswith('.') or d == '.github']
    dirnames[:] = [d for d in dirnames if d not in ('node_modules','.git','__pycache__','venv','.venv','vendor','dist','build')]
    for fn in filenames:
        fpath = os.path.join(dirpath, fn)
        rel = os.path.relpath(fpath, root)
        for pat in compiled_patterns:
            if pat.search(fn) or pat.search(rel):
                findings.append({
                    'id': 'sensitive-file',
                    'name': 'Sensitive File Present',
                    'severity': 'HIGH',
                    'file': rel,
                    'description': f'File matched sensitive file pattern: {pat.pattern}'
                })
                break

with open(sys.argv[2], 'w') as f:
    json.dump(findings, f, indent=2)

print(f"Found {len(findings)} sensitive files")
PYEOF

    # ----------------------------------------------------------
    # PHASE 3 — Secrets Scan (Git History)
    # ----------------------------------------------------------
    info "Phase 3/6: Git history scan (commits) ..."
    python3 - "$PROJECT_ROOT" "$OUTDIR"/findings/secrets-git.json <<'PYEOF'
import json, os, re, subprocess, sys

sr = sys.argv[1]
out = sys.argv[2]

try:
    res = subprocess.run(['git','log','--oneline','--reverse'],cwd=sr,capture_output=True,text=True,timeout=30)
    if res.returncode != 0:
        print(f"No git history found: {res.stderr.strip()}", file=sys.stderr)
        with open(out,'w') as f: json.dump([],f)
        sys.exit(0)
    commits = [l.split()[0] for l in res.stdout.strip().splitlines() if l.strip()]
except Exception as e:
    print(f"Git log error: {e}", file=sys.stderr)
    with open(out,'w') as f: json.dump([],f)
    sys.exit(0)

if not commits:
    print("No commits found")
    with open(out,'w') as f: json.dump([],f)
    sys.exit(0)

# Regex patterns for secrets in diffs
secret_pats = [
    re.compile(r'(?:AKIA|ASIA)[0-9A-Z]{16}'),
    re.compile(r'ghp_[0-9a-zA-Z]{36}'),
    re.compile(r'glpat-[0-9a-zA-Z_-]{20,}'),
    re.compile(r'xox[baprs]-[0-9a-zA-Z-]{10,}'),
    re.compile(r'-----BEGIN\s?(?:RSA|DSA|EC|OPENSSH|PGP)?\s?PRIVATE KEY-----'),
    re.compile(r'(?i)(?:password|secret|token|key|credential).{0,10}[:=]\s*[''"][^''"]{8,}[''"]'),
    re.compile(r'Authorization:\s*(?:Bearer|Basic)\s+[A-Za-z0-9+/=_-]{20,}'),
    re.compile(r'https?://[^:]+:[^@]+@'),
]

findings = []
for ch in commits:
    # Use git show instead of git diff to handle first commit properly
    try:
        d = subprocess.run(['git','show',ch,'--format=','--',':!.git'],cwd=sr,capture_output=True,text=True,timeout=5).stdout
    except subprocess.TimeoutExpired:
        warn(f"Timeout on commit {ch}, skipping")
        continue
    if not d.strip():
        continue

    for pat in secret_pats:
        for m in pat.finditer(d):
            # Find the file context - show which file had the match
            context_line = ''
            for line in d.splitlines():
                if m.group() in line:
                    context_line = line.strip()[:120]
                    break
            findings.append({
                'commit': ch,
                'pattern': pat.pattern[:60],
                'match': m.group()[:80],
                'context': context_line,
                'severity': 'CRITICAL' if 'PRIVATE KEY' in pat.pattern or 'AKIA' in pat.pattern else 'HIGH'
            })

with open(out,'w') as f:
    json.dump(findings, f, indent=2)

print(f"Scanned {len(commits)} commits, found {len(findings)} secrets in git history")
PYEOF

    # ----------------------------------------------------------
    # PHASE 4 — Misconfig Scan
    # ----------------------------------------------------------
    info "Phase 4/6: Misconfiguration scan ..."
    python3 - "$PROJECT_ROOT" "$MISCONFIG_FILE" <<'PYEOF'
import json, os, re, sys

root = sys.argv[1]
out = sys.argv[2]
findings = []

# ---- 4a: Code Patterns ----
misconfig_patterns = [
    # Debug/Verbose enabled
    {'id':'debug-enabled','name':'Debug Mode Enabled','severity':'HIGH','desc':'Debug mode should be disabled in production','regex':r'(?i)(?:debug\s*[=:]\s*(?:true|1|enabled|yes)|APP_DEBUG\s*[=:]\s*(?:true|1|enabled)|FLASK_DEBUG\s*[=:]\s*1|DEBUG\s*=\s*True)'},
    # Hardcoded hosts/IPs
    {'id':'hardcoded-host','name':'Hardcoded Host','severity':'LOW','desc':'Hardcoded host/port detected','regex':r'(?i)(?:host|server|endpoint)\s*[=:]\s*["\'](?:https?://|)(?:localhost|127\.0\.0\.1|0\.0\.0\.0|192\.168\.\d+\.\d+|10\.\d+\.\d+\.\d+|172\.1[6-9]\.\d+\.\d+|172\.2\d+\.\d+\.\d+|172\.3[0-1]\.\d+\.\d+)["\']'},
    # Disable SSL/TLS verification
    {'id':'ssl-verify-disabled','name':'SSL Verification Disabled','severity':'CRITICAL','desc':'SSL verification explicitly disabled','regex':r'(?i)(?:ssl_verify|verify_ssl|ssl_check|SSL_CERT_FILE)\s*[=:]\s*(?:false|0|no|off|disabled)'},
    # Insecure cipher
    {'id':'insecure-cipher','name':'Insecure Cipher/Protocol','severity':'HIGH','desc':'Insecure SSL/TLS configuration','regex':r'(?i)(?:TLSv1\.0|TLSv1\.1|SSLv3|SSLv2|RC4|MD5|DES|3DES|CBC_MD5|NULL_CIPHER|EXPORT\d+)'},
    # Wildcard CORS
    {'id':'wildcard-cors','name':'Wildcard CORS','severity':'MEDIUM','desc':'CORS allows all origins','regex':r'(?i)(?:Access-Control-Allow-Origin)\s*[=:]\s*["\']\*["\']'},
    # Loose file permissions
    {'id':'loose-permissions','name':'Loose File Permissions','severity':'MEDIUM','desc':'Files with 777 or 666 permissions','regex':r'(?i)(?:chmod|umask)\s*(?:777|666|0777|0666)'},
    # Hardcoded admin credentials
    {'id':'hardcoded-admin-creds','name':'Hardcoded Admin Credentials','severity':'CRITICAL','desc':'Default/hardcoded credentials found','regex':r'(?i)(?:admin|root|sa)\s*[=:]\s*["\'](?:(?:admin|root|sa|test|password|123456|P@ssw0rd)["\'])'],
    # Session configuration
    {'id':'insecure-session','name':'Insecure Session Config','severity':'HIGH','desc':'Insecure session settings','regex':r'(?i)(?:SESSION_COOKIE_HTTPONLY|SESSION_COOKIE_SECURE|SESSION_COOKIE_SAMESITE)\s*[=:]\s*(?:false|0|None|null)'},
]

for pat in misconfig_patterns:
    cp = re.compile(pat['regex'])
    for dirpath, dirnames, filenames in os.walk(root):
        dirnames[:] = [d for d in dirnames if not d.startswith('.') or d == '.github']
        dirnames[:] = [d for d in dirnames if d not in ('node_modules','.git','__pycache__','venv','.venv','vendor','dist','build')]
        for fn in filenames:
            ext = os.path.splitext(fn)[1].lower()
            if ext in ('.png','.jpg','.jpeg','.gif','.ico','.woff','.woff2','.ttf','.eot','.pdf','.zip','.tar','.gz','.bz2','.7z','.rar','.exe','.dll','.so','.dylib','.bin','.dat','.class','.pyc','.o','.a','.lib','.obj','.map'):
                continue
            fpath = os.path.join(dirpath, fn)
            try:
                with open(fpath,'r',errors='ignore') as f:
                    content = f.read()
            except Exception:
                continue
            for lineno, line in enumerate(content.splitlines(), 1):
                if cp.search(line):
                    findings.append({
                        'id': pat['id'],
                        'name': pat['name'],
                        'severity': pat['severity'],
                        'file': os.path.relpath(fpath, root),
                        'line': lineno,
                        'match': line.strip()[:100],
                        'description': pat['desc']
                    })

# ---- 4b: CI/CD Audit ----
# Look for workflow files
github_dir = os.path.join(root, '.github', 'workflows')
if os.path.isdir(github_dir):
    for fn in sorted(os.listdir(github_dir)):
        if not fn.endswith(('.yml','.yaml')):
            continue
        fpath = os.path.join(github_dir, fn)
        try:
            with open(fpath,'r') as f:
                lines = f.readlines()
        except Exception:
            continue
        for lineno, line in enumerate(lines, 1):
            stripped = line.strip()
            # Unpinned action at major version tag (main/master/latest)
            if re.match(r'^\s*-\s+uses:\s+[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+@(?:main|master|latest)\s*$', stripped):
                action = stripped.split('uses:')[1].strip() if 'uses:' in stripped else ''
                findings.append({
                    'id': 'unpinned-action',
                    'name': 'Unpinned GitHub Action',
                    'severity': 'MEDIUM',
                    'file': os.path.join('.github/workflows', fn),
                    'line': lineno,
                    'match': stripped[:100],
                    'description': f'Action "{action}" uses a floating tag instead of a pinned version'
                })
            # Privileged mode in container
            if re.search(r'privileged\s*:\s*true', stripped):
                findings.append({
                    'id': 'privileged-container',
                    'name': 'Privileged Container Mode',
                    'severity': 'HIGH',
                    'file': os.path.join('.github/workflows', fn),
                    'line': lineno,
                    'match': stripped[:100],
                    'description': 'Container running in privileged mode'
                })
            # Write permission on GITHUB_TOKEN
            if re.search(r'write-all', stripped) or re.search(r'contents:\s*write', stripped):
                findings.append({
                    'id': 'overly-permissive-token',
                    'name': 'Overly Permissive GITHUB_TOKEN',
                    'severity': 'MEDIUM',
                    'file': os.path.join('.github/workflows', fn),
                    'line': lineno,
                    'match': stripped[:100],
                    'description': 'GITHUB_TOKEN has excessive write permissions'
                })
            # Hardcoded secret in workflow
            if re.search(r'(?i)env\.\w+_SECRET\s*[:=]\s*["\'][^"\']{10,}["\']', stripped):
                findings.append({
                    'id': 'hardcoded-secret-workflow',
                    'name': 'Hardcoded Secret in Workflow',
                    'severity': 'CRITICAL',
                    'file': os.path.join('.github/workflows', fn),
                    'line': lineno,
                    'match': stripped[:100],
                    'description': 'Potential hardcoded secret in CI/CD workflow'
                })

with open(out,'w') as f:
    json.dump(findings, f, indent=2)

print(f"Found {len(findings)} misconfiguration findings")
