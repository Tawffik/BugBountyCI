.warn-banner {{ background: #3d2b1f; border: 1px solid #f0883e; border-radius: 6px; padding: 12px 18px; margin: 16px 0; color: #f0883e; font-size: 0.9em; }}
.summary-cards {{ display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }}
.card {{ background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; text-align: center; }}
.card .number {{ font-size: 2.5em; font-weight: bold; }}
.card .label {{ font-size: 0.9em; color: #8b949e; margin-top: 5px; }}
.critical {{ color: #e74c3c; }} .high {{ color: #e67e22; }} .medium {{ color: #f1c40f; }} .low {{ color: #3498db; }}
table {{ width: 100%; border-collapse: collapse; margin: 15px 0; }}
th, td {{ padding: 10px 12px; text-align: left; border-bottom: 1px solid #30363d; font-size: 0.9em; }}
th {{ background: #161b22; color: #58a6ff; font-weight: 600; }}
tr:hover {{ background: #1c2128; }}
.code {{ font-family: monospace; font-size: 0.85em; background: #1c2128; padding: 2px 6px; border-radius: 3px; word-break: break-all; }}
.ai-section {{ background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 25px; margin: 20px 0; line-height: 1.8; white-space: pre-wrap; }}
footer {{ text-align: center; margin-top: 40px; padding: 20px; color: #8b949e; font-size: 0.8em; border-top: 1px solid #30363d; }}
.severity-badge {{ display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.8em; font-weight: 600; }}
</style>
</head>
<body>
<div class="container">
<h1>Security Audit Report</h1>
<div class="warn-banner">WARNING: This report contains sensitive security findings. Do not share publicly or commit to version control.</div>
<p><strong>Target:</strong> {html_escape(target)}</p>
<p><strong>Scan Start:</strong> {html_escape(scan_start)}</p>
<p><strong>Report Generated:</strong> {html_escape(scan_time)}</p>
<p><strong>Total Findings:</strong> {total_findings}</p>

<div class="summary-cards">
<div class="card"><div class="number critical">{critical_count}</div><div class="label">Critical</div></div>
<div class="card"><div class="number high">{high_count}</div><div class="label">High</div></div>
<div class="card"><div class="number">{len(secrets)}</div><div class="label">Secrets</div></div>
<div class="card"><div class="number">{len(misconfigs)}</div><div class="label">Misconfigs</div></div>
</div>
""")

if ai_data and ai_data.get('ai_analysis'):
    html_parts.append(f'<h2>AI Analysis</h2><div class="ai-section">{html_escape(str(ai_data["ai_analysis"])[:8000])}</div>')

# FIX M3: html_escape applied to ALL dynamic values consistently
if secrets:
    html_parts.append('<h2>Secrets Found (Regex) â€” matches are redacted</h2>')
    html_parts.append('<table><tr><th>#</th><th>ID</th><th>Severity</th><th>File</th><th>Line</th><th>Match (redacted)</th></tr>')
    for i, s in enumerate(secrets[:50], 1):
        html_parts.append(
            f'<tr><td>{i}</td>'
            f'<td>{html_escape(s["id"])}</td>'
            f'<td><span class="severity-badge" style="background:{html_escape(severity_color(s["severity"]))}20;color:{html_escape(severity_color(s["severity"]))}">{html_escape(s["severity"])}</span></td>'
            f'<td class="code">{html_escape(s["file"])}</td>'
            f'<td>{html_escape(str(s["line"]))}</td>'
            f'<td class="code">{html_escape(s["match"][:50])}</td></tr>'
        )
    html_parts.append('</table>')
    if len(secrets) > 50:
        html_parts.append(f'<p><em>... {len(secrets)-50} more findings</em></p>')

if misconfigs:
    html_parts.append('<h2>Misconfigurations</h2>')
    html_parts.append('<table><tr><th>#</th><th>ID</th><th>Severity</th><th>File</th><th>Line</th><th>Description</th></tr>')
    for i, m in enumerate(misconfigs[:50], 1):
        html_parts.append(
            f'<tr><td>{i}</td>'
            f'<td>{html_escape(m["id"])}</td>'
            f'<td><span class="severity-badge" style="background:{html_escape(severity_color(m["severity"]))}20;color:{html_escape(severity_color(m["severity"]))}">{html_escape(m["severity"])}</span></td>'
            f'<td class="code">{html_escape(m["file"])}</td>'
            f'<td>{html_escape(str(m["line"]))}</td>'
            f'<td>{html_escape(m.get("description",""))}</td></tr>'
        )
    html_parts.append('</table>')
    if len(misconfigs) > 50:
        html_parts.append(f'<p><em>... {len(misconfigs)-50} more findings</em></p>')

html_parts.append('<footer>Generated by Security Audit Framework v2.0 (Hardened)</footer>')
html_parts.append('</div></body></html>')

with open(report_html, 'w') as f:
    f.write('\n'.join(html_parts))

print(f"Markdown: {report_md}")
print(f"SARIF:    {report_sarif}")
print(f"HTML:     {report_html}")
print(f"Total findings: {total_findings}")
PYEOF

    # ---- Final Summary ----
    echo ""
    echo -e "${GREEN}${BOLD}========================================${NC}"
    echo -e "${GREEN}${BOLD}   AUDIT COMPLETE${NC}"
    echo -e "${GREEN}${BOLD}========================================${NC}"
    echo ""
    echo -e "  ${BOLD}Reports:${NC}"
    echo -e "    ${CYAN}Markdown:${NC}  $FINAL_REPORT"
    echo -e "    ${CYAN}SARIF:${NC}     $SARIF_FILE"
    echo -e "    ${CYAN}HTML:${NC}      $HTML_FILE"
    echo ""
    echo -e "  ${BOLD}Raw Findings:${NC}"
    echo -e "    ${CYAN}Secrets:${NC}     $OUTDIR/findings/secrets-regex.json"
    echo -e "    ${CYAN}Sensitive:${NC}   $OUTDIR/findings/secrets-summary.json"
    echo -e "    ${CYAN}Git History:${NC} $GIT_SECRETS_FILE"
    echo -e "    ${CYAN}Misconfigs:${NC}  $OUTDIR/findings/misconfig-findings.json"
    echo ""
    if [[ -n "$AI_ANTHROPIC_KEY" || -n "$AI_OPENROUTER_KEY" ]]; then
        echo -e "    ${CYAN}AI Analysis:${NC} $OUTDIR/ai-reports/ai-enriched.json"
    fi
    echo ""
    echo -e "  ${YELLOW}${BOLD}REMINDER:${NC} Output directory contains sensitive data."
    echo -e "  ${YELLOW}A .gitignore was added to prevent accidental commits.${NC}"
    echo ""
}

main "$@"
