name: Restore Zero Track Pipeline
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore full workflow + apply root-cause fixes
        run: |
          set -euo pipefail
          git show 4e4b579:.github/workflows/zero-track-hunter.yml > .github/workflows/zero-track-hunter.yml
          test -s .github/workflows/zero-track-hunter.yml
          echo "Restored lines: $(wc -l < .github/workflows/zero-track-hunter.yml)"
          python3 scripts/apply_root_fixes.py

      - name: Commit restored pipeline
        run: |
          git config user.name "zero-track-bot"
          git config user.email "zero-track-bot@users.noreply.github.com"
          git add .github/workflows/zero-track-hunter.yml
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix(pipeline): restore full workflow + uro all.txt safety + asnmap DIRECT"
            git push
          fi
