name: Restore Zero Track Pipeline
on:
  workflow_dispatch:

# Needs secret WORKFLOW_PAT = classic PAT with scopes: repo + workflow
# (GITHUB_TOKEN cannot push to .github/workflows/)
permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check WORKFLOW_PAT
        run: |
          if [ -z "${{ secrets.WORKFLOW_PAT }}" ]; then
            echo "::error::Add repository secret WORKFLOW_PAT (classic PAT: repo + workflow scopes)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Restore full workflow + root-cause fixes
        run: |
          set -euo pipefail
          git show 4e4b579:.github/workflows/zero-track-hunter.yml > .github/workflows/zero-track-hunter.yml
          test -s .github/workflows/zero-track-hunter.yml
          echo "Restored lines: $(wc -l < .github/workflows/zero-track-hunter.yml)"
          python3 scripts/apply_root_fixes.py
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zero-track-hunter.yml')); print('YAML OK')"

      - name: Commit and push
        run: |
          git config user.name "zero-track-bot"
          git config user.email "zero-track-bot@users.noreply.github.com"
          git add .github/workflows/zero-track-hunter.yml
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix(pipeline): full Zero Track + uro/asnmap/classify fixes"
            git push origin main
          fi
