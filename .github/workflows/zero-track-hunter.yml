name: Restore Zero Track Pipeline
on:
  workflow_dispatch:

# GITHUB_TOKEN cannot push to .github/workflows/* without "workflows" permission.
# Create a classic PAT with scopes: repo + workflow
# Add it as repository secret: WORKFLOW_PAT
permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check WORKFLOW_PAT secret
        run: |
          if [ -z "${{ secrets.WORKFLOW_PAT }}" ]; then
            echo "::error::Missing secret WORKFLOW_PAT"
            echo "Create a classic PAT with scopes: repo + workflow"
            echo "Repo Settings → Secrets and variables → Actions → New secret → WORKFLOW_PAT"
            echo "Then re-run this workflow."
            exit 1
          fi
          echo "WORKFLOW_PAT is set"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Restore full workflow + apply root-cause fixes
        run: |
          set -euo pipefail
          git show 4e4b579:.github/workflows/zero-track-hunter.yml > .github/workflows/zero-track-hunter.yml
          test -s .github/workflows/zero-track-hunter.yml
          echo "Restored lines: $(wc -l < .github/workflows/zero-track-hunter.yml)"
          python3 scripts/apply_root_fixes.py
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zero-track-hunter.yml')); print('YAML OK')"

      - name: Commit and push restored pipeline
        run: |
          git config user.name "zero-track-bot"
          git config user.email "zero-track-bot@users.noreply.github.com"
          git add .github/workflows/zero-track-hunter.yml
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix(pipeline): restore full workflow + uro all.txt safety + asnmap DIRECT + classify"
            git push origin main
          fi
