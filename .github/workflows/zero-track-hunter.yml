name: Restore Zero Track Pipeline
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore full workflow from last good commit + root-cause fixes
        run: |
          set -euo pipefail
          git show 4e4b579:.github/workflows/zero-track-hunter.yml > .github/workflows/zero-track-hunter.yml
          test -s .github/workflows/zero-track-hunter.yml
          wc -l .github/workflows/zero-track-hunter.yml

          python3 << 'PY'
          from pathlib import Path
          p = Path(".github/workflows/zero-track-hunter.yml")
          c = p.read_text()

          old_uro = '''          echo "🔄 Merging..."
          cat "$RD"/urls/*.txt 2>/dev/null | sort -u > /tmp/urls_merged.txt
          # Last-resort seed: if every passive/active URL source failed (superdrug
          # regression: 549→0), at least put live host roots into all.txt so JS
          # discovery and downstream param hunting are not totally starved.
          # Always add prioritized host roots (additive) so active surface is never missing
          SEED_LIST="$RD/live/expensive_targets.txt"
          [ -s "$SEED_LIST" ] || SEED_LIST="$RD/live/scan_order.txt"
          [ -s "$SEED_LIST" ] || SEED_LIST="$RD/live/live.txt"
          if [ -s "$SEED_LIST" ]; then
            while IFS= read -r h; do
              h="$(echo "$h" | tr -d '\\r' | xargs)"; [ -z "$h" ] && continue
              echo "$h" >> /tmp/urls_merged.txt
              echo "${h}/" >> /tmp/urls_merged.txt
              echo "${h}/robots.txt" >> /tmp/urls_merged.txt
              echo "${h}/sitemap.xml" >> /tmp/urls_merged.txt
              echo "${h}/.well-known/security.txt" >> /tmp/urls_merged.txt
            done < "$SEED_LIST"
          fi
          sort -u -o /tmp/urls_merged.txt /tmp/urls_merged.txt 2>/dev/null || true
          merged_n=$(wc -l < /tmp/urls_merged.txt 2>/dev/null || echo 0)
          echo "ℹ️ Merged URL candidates before uro: $merged_n"
          timeout 90 uro < /tmp/urls_merged.txt > "$RD/urls/all.txt" 2>/dev/null || cp /tmp/urls_merged.txt "$RD/urls/all.txt"
          echo "✅ Total URLs: $(wc -l < "$RD/urls/all.txt")"'''

          new_uro = r'''          echo "🔄 Merging..."
          : > /tmp/urls_merged.txt
          for src in wayback wayback_js gau katana hakrawler urlscan otx html_extract robots_sitemap; do
            f="$RD/urls/${src}.txt"
            [ -s "$f" ] && cat "$f" >> /tmp/urls_merged.txt
          done
          SEED_LIST="$RD/live/expensive_targets.txt"
          [ -s "$SEED_LIST" ] || SEED_LIST="$RD/live/scan_order.txt"
          [ -s "$SEED_LIST" ] || SEED_LIST="$RD/live/live.txt"
          if [ -s "$SEED_LIST" ]; then
            while IFS= read -r h; do
              h="$(echo "$h" | tr -d '\r' | xargs)"; [ -z "$h" ] && continue
              echo "$h" >> /tmp/urls_merged.txt
              echo "${h}/" >> /tmp/urls_merged.txt
              echo "${h}/robots.txt" >> /tmp/urls_merged.txt
              echo "${h}/sitemap.xml" >> /tmp/urls_merged.txt
              echo "${h}/.well-known/security.txt" >> /tmp/urls_merged.txt
            done < "$SEED_LIST"
          fi
          sort -u -o /tmp/urls_merged.txt /tmp/urls_merged.txt 2>/dev/null || true
          merged_n=$(wc -l < /tmp/urls_merged.txt 2>/dev/null || echo 0)
          echo "ℹ️ Merged URL candidates before uro: $merged_n"
          : > /tmp/urls_uro.txt
          timeout 90 uro < /tmp/urls_merged.txt > /tmp/urls_uro.txt 2>/dev/null || true
          if [ -s /tmp/urls_uro.txt ]; then
            cp /tmp/urls_uro.txt "$RD/urls/all.txt"
            echo "✅ Total URLs after uro: $(wc -l < "$RD/urls/all.txt") (from $merged_n merged)"
          else
            cp /tmp/urls_merged.txt "$RD/urls/all.txt"
            echo "⚠️ uro empty — keeping $merged_n merged URLs in all.txt"
          fi
          if [ ! -s "$RD/urls/all.txt" ] && [ -s /tmp/urls_merged.txt ]; then
            cp /tmp/urls_merged.txt "$RD/urls/all.txt"
            echo "⚠️ Safety restore all.txt from merge"
          fi
          echo "✅ Final all.txt: $(wc -l < "$RD/urls/all.txt" 2>/dev/null || echo 0) URLs"'''

          if old_uro not in c:
              raise SystemExit("uro block not found in restored file")
          c = c.replace(old_uro, new_uro)

          old_asn = '''          if [ -n "${{ env.PDCP_API_KEY }}" ] && command -v asnmap >/dev/null; then
            export PDCP_API_KEY="${{ env.PDCP_API_KEY }}"
            # Find IP ranges owned by the org behind this domain - this can surface
            # servers/services that have NO subdomain or DNS record pointing to them
            # at all, which nothing else in this pipeline would ever find.
            timeout 60 proxychains4 -q asnmap -d "${{ env.TARGET }}" -silent -o /tmp/asn_cidrs.txt 2>>"$RD/logs/asnmap.log" || true
            attempt=1
            while [ ! -s /tmp/asn_cidrs.txt ] && [ "$attempt" -le 2 ]; do
              echo "⚠️ asnmap attempt $attempt returned nothing with no error logged - forcing a fresh Tor circuit and retrying (attempt $((attempt+1))/3)..."
              sudo pkill -HUP -x tor 2>/dev/null || true
              sleep 8
              timeout 60 proxychains4 -q asnmap -d "${{ env.TARGET }}" -silent -o /tmp/asn_cidrs.txt 2>>"$RD/logs/asnmap.log" || true
              attempt=$((attempt + 1))
            done
            if [ -s /tmp/asn_cidrs.txt ]; then
              timeout 120 proxychains4 -q naabu -l /tmp/asn_cidrs.txt -top-ports 100 -exclude-cdn -silent -rate 1000 -c 25 2>>"$RD/logs/naabu.log" | awk -F: '{print "https://"$1":"$2}' > "$RD/subdomains/asn_ips.txt" || true
              echo "asnmap" > "$RD/meta/asn_source.txt"
            else
              reason="asnmap produced zero output across 3 attempts (including 2 fresh-circuit retries) with no error ever logged in logs/asnmap.log - this is the same flaky-Tor-circuit signature seen elsewhere (single lightweight requests succeed, this tool's request(s) don't), not a config problem, since PDCP_API_KEY is set and asnmap is installed."
              echo "$reason" > "$RD/meta/asn_skipped_reason.txt"
              echo "⚠️ $reason"
            fi'''

          new_asn = r'''          if [ -n "${{ env.PDCP_API_KEY }}" ] && command -v asnmap >/dev/null; then
            export PDCP_API_KEY="${{ env.PDCP_API_KEY }}"
            : > /tmp/asn_cidrs.txt
            echo "🔍 asnmap DIRECT (no Tor)..."
            timeout 45 asnmap -d "${{ env.TARGET }}" -silent -o /tmp/asn_cidrs.txt 2>>"$RD/logs/asnmap.log" || true
            if [ ! -s /tmp/asn_cidrs.txt ]; then
              echo "⚠️ asnmap DIRECT empty - one Tor retry..."
              timeout 60 proxychains4 -q asnmap -d "${{ env.TARGET }}" -silent -o /tmp/asn_cidrs.txt 2>>"$RD/logs/asnmap.log" || true
            fi
            if [ -s /tmp/asn_cidrs.txt ]; then
              timeout 120 naabu -l /tmp/asn_cidrs.txt -top-ports 100 -exclude-cdn -silent -rate 1000 -c 25 2>>"$RD/logs/naabu.log" | awk -F: '{print "https://"$1":"$2}' > "$RD/subdomains/asn_ips.txt" || true
              if [ ! -s "$RD/subdomains/asn_ips.txt" ]; then
                timeout 120 proxychains4 -q naabu -l /tmp/asn_cidrs.txt -top-ports 100 -exclude-cdn -silent -rate 1000 -c 25 2>>"$RD/logs/naabu.log" | awk -F: '{print "https://"$1":"$2}' > "$RD/subdomains/asn_ips.txt" || true
              fi
              echo "asnmap" > "$RD/meta/asn_source.txt"
              echo "✅ asnmap CIDRs: $(wc -l < /tmp/asn_cidrs.txt) → candidates: $(wc -l < "$RD/subdomains/asn_ips.txt")"
            else
              reason="asnmap produced zero on DIRECT and Tor - check PDCP_API_KEY / logs/asnmap.log"
              echo "$reason" > "$RD/meta/asn_skipped_reason.txt"
              echo "⚠️ $reason"
            fi'''

          if old_asn not in c:
              raise SystemExit("asnmap block not found")
          c = c.replace(old_asn, new_asn)
          p.write_text(c)
          print("patched uro + asnmap OK")
          PY

          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zero-track-hunter.yml')); print('YAML OK')"

      - name: Commit restored pipeline
        run: |
          git config user.name "zero-track-bot"
          git config user.email "zero-track-bot@users.noreply.github.com"
          git add .github/workflows/zero-track-hunter.yml
          git status
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(pipeline): restore full workflow + stop uro wiping all.txt + asnmap DIRECT"
            git push
          fi
