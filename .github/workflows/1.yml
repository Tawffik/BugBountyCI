name: "Subdomain Monitor"

on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:
    inputs:
      domain:
        description: 'Target Domain'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Restore Tool Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-v2

      - name: Install Tools (if cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest

      - name: Update PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Set Domain
        run: |
          DOMAIN="${{ github.event.inputs.domain || secrets.TARGET_DOMAIN }}"

          if [ -z "$DOMAIN" ]; then
            echo "DOMAIN is empty"
            exit 1
          fi

          echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV

          mkdir -p "results/$DOMAIN"

          touch "results/$DOMAIN/prev.txt"
          touch /tmp/live.txt

      - name: Enumerate Subdomains
        run: |
          subfinder -d "$DOMAIN" -all -silent \
            -o /tmp/subs.txt 2>/dev/null || true

          dnsx -l /tmp/subs.txt -silent -a \
            -o /tmp/resolved.txt 2>/dev/null || \
            cp /tmp/subs.txt /tmp/resolved.txt

          sort -u /tmp/resolved.txt -o /tmp/resolved.txt

      - name: HTTP Probe
        run: |
          httpx -l /tmp/resolved.txt \
            -silent \
            -status-code \
            -title \
            -tech-detect \
            -threads 50 \
            -timeout 8 \
            -o /tmp/live.txt 2>/dev/null || true

      - name: Diff Against Previous Run
        run: |
          comm -23 \
            <(sort /tmp/resolved.txt) \
            <(sort "results/$DOMAIN/prev.txt") \
            > /tmp/new_subs.txt

          comm -23 \
            <(sort "results/$DOMAIN/prev.txt") \
            <(sort /tmp/resolved.txt) \
            > /tmp/removed_subs.txt

          NEW=$(wc -l < /tmp/new_subs.txt)
          REMOVED=$(wc -l < /tmp/removed_subs.txt)

          echo "NEW=$NEW" >> $GITHUB_ENV
          echo "REMOVED=$REMOVED" >> $GITHUB_ENV

          echo "New subdomains ($NEW):"
          cat /tmp/new_subs.txt || echo "None"

          echo "Removed subdomains ($REMOVED):"
          cat /tmp/removed_subs.txt || echo "None"

      - name: Save Results & Commit
        run: |
          cp /tmp/resolved.txt "results/$DOMAIN/subdomains.txt"

          cp /tmp/resolved.txt "results/$DOMAIN/prev.txt"

          [ -f /tmp/live.txt ] && \
            cp /tmp/live.txt "results/$DOMAIN/live.txt" || true

          [ -f /tmp/new_subs.txt ] && \
            cp /tmp/new_subs.txt "results/$DOMAIN/new.txt" || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "results/$DOMAIN/"

          git diff --staged --quiet || \
            git commit -m "Recon Update [$DOMAIN] $(date -u +'%Y-%m-%d %H:%M')"

          git push || true

      - name: Discord — Only on Changes
        if: env.NEW != '0' || env.REMOVED != '0'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          TOTAL=$(wc -l < /tmp/resolved.txt)
          LIVE=$(wc -l < /tmp/live.txt)

          NEW_LIST=$(head -10 /tmp/new_subs.txt | \
            awk '{print "• "$0}' | tr '\n' '\n' || echo "None")

          [ -z "$NEW_LIST" ] && NEW_LIST="None"

          jq -n \
            --arg d "$DOMAIN" \
            --arg t "$TOTAL" \
            --arg l "$LIVE" \
            --arg n "$NEW" \
            --arg r "$REMOVED" \
            --arg nl "$NEW_LIST" \
            '{
              username: "SubMonitor",
              embeds: [{
                title: ("⚠️ Subdomain Change: " + $d),
                color: 16744192,
                fields: [
                  {name:"🌐 Total", value:$t, inline:true},
                  {name:"✅ Live", value:$l, inline:true},
                  {name:"🆕 New", value:$n, inline:true},
                  {name:"❌ Removed", value:$r, inline:true},
                  {name:"New Subdomains", value:$nl, inline:false}
                ]
              }]
            }' | curl -s -X POST "$WEBHOOK" \
                -H "Content-Type: application/json" \
                -d @- || true
