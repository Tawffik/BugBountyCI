name: "Subdomain Monitor"

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      domain:
        description: 'Target Domain'
        required: true
        default: ''

permissions:
  contents: write   # FIXED: needed for git commit

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - يستخدم : actions/checkout@v4
        مع :
          الرمز المميز : $ { { secrets.GITHUB_TOKEN } }

      - يستخدم : actions/setup-go@v5
        مع :
          إصدار Go : '1.22'
          التخزين المؤقت : خطأ

      - الاسم : ذاكرة التخزين المؤقت لأداة الاستعادة
        المعرّف : ذاكرة التخزين المؤقت
        يستخدم : actions/cache@v4
        مع :
          المسار : ~/go/bin
          المفتاح : go-tools-$ { { runner.os } } -v2

      - الاسم : تثبيت الأدوات (في حالة عدم وجودها في ذاكرة التخزين المؤقت)
        إذا كانت قيمة ` steps.cache.outputs.cache-hit` لا تساوي 'true'
        تشغيل : |
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest

      # تم الإصلاح: يتم تحديث المسار دائمًا
      - الاسم : تحديث المسار
        تشغيل : echo "$HOME/go/bin" >> $GITHUB_PATH

      - الاسم : تعيين النطاق
        تشغيل : |
          DOMAIN="${{ github.event.inputs.domain || secrets.TARGET_DOMAIN }}"
          echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV
          mkdir -p "results/$DOMAIN"
          # إنشاء ملف prev.txt إذا لم يكن موجودًا بعد
          touch "results/$DOMAIN/prev.txt"

      - الاسم : تعداد النطاقات الفرعية
        تشغيل : |
          subfinder -d "$DOMAIN" -all -silent -o /tmp/subs.txt 2>/dev/null || true
          dnsx -l /tmp/subs.txt -silent -a -o /tmp/resolved.txt 2>/dev/null || \
            cp /tmp/subs.txt /tmp/resolved.txt
          sort -u /tmp/resolved.txt -o /tmp/resolved.txt

      - الاسم : مسبار HTTP
        تشغيل : |
          httpx -l /tmp/resolved.txt \
            -صامت -رمز الحالة -العنوان -الكشف التقني
            -threads 50 -timeout 8 \
            -o /tmp/live.txt 2>/dev/null || true

      # تم الإصلاح: يعمل diff لأن prev.txt موجود في المستودع
      - الاسم : الفرق مع الجولة السابقة
        تشغيل : |
          comm -23 \
            <(sort /tmp/resolved.txt) \
            <(sort "results/$DOMAIN/prev.txt") \
            > /tmp/new_subs.txt

          comm -23 \
            <(sort "results/$DOMAIN/prev.txt") \
            <(sort /tmp/resolved.txt) \
            > /tmp/removed_subs.txt

          NEW=$(wc -l < ​​/tmp/new_subs.txt)
          تمت إزالته=$(wc -l < ​​/tmp/removed_subs.txt)
          echo "NEW=$NEW" >> $GITHUB_ENV
          echo "REMOVED=$REMOVED" >> $GITHUB_ENV

          echo "النطاقات الفرعية الجديدة ($NEW):"
          cat /tmp/new_subs.txt || echo "لا شيء"
          echo "تمت إزالة النطاقات الفرعية ($REMOVED):"
          cat /tmp/removed_subs.txt || echo "لا يوجد"

      - الاسم : حفظ النتائج والالتزام بها
        تشغيل : |
          cp /tmp/resolved.txt "results/$DOMAIN/subdomains.txt"
          cp /tmp/resolved.txt "results/$DOMAIN/prev.txt"
          cp /tmp/live.txt "results/$DOMAIN/live.txt"
          cp /tmp/new_subs.txt "results/$DOMAIN/new.txt"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "results/$DOMAIN/"
          git diff --staged --quiet || git commit -m "Recon Update [$DOMAIN] $(date -u +'%Y-%m-%d %H:%M')"
          git push || true

      - name: Discord — Only on Changes
        if: env.NEW != '0' || env.REMOVED != '0'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          TOTAL=$(wc -l < /tmp/resolved.txt)
          LIVE=$(wc -l < /tmp/live.txt)
          NEW_LIST=$(head -10 /tmp/new_subs.txt | awk '{print "• "$0}' | tr '\n' '\n' || echo "None")
          [ -z "$NEW_LIST" ] && NEW_LIST="None"

          jq -n \
            --arg d "$DOMAIN" \
            --arg t "$TOTAL" \
            --arg l "$LIVE" \
            --arg n "$NEW" \
            --arg r "$REMOVED" \
            --arg nl "$NEW_LIST" \
            '{
              username: "SubMonitor",
              embeds: [{
                title: ("⚠️ Subdomain Change: " + $d),
                color: 16744192,
                fields: [
                  {name:"🌐 Total",   value:$t,  inline:true},
                  {name:"✅ Live",    value:$l,  inline:true},
                  {name:"🆕 New",    value:$n,  inline:true},
                  {name:"❌ Removed", value:$r,  inline:true},
                  {name:"New Subdomains", value:$nl, inline:false}
                ]
              }]
            }' | curl -s -X POST "$WEBHOOK" \
                   -H "Content-Type: application/json" \
                   -d @- || true
