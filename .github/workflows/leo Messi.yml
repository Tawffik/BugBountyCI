name: "🎯 Leo Messi - AI Autonomous Hunter ULTIMATE v4"
on:
  workflow_dispatch:
    inputs:
      target: {required: true, type: string}
      hunting_mode: {required: false, default: "normal", type: choice, options: [light, normal, aggressive]}
      discord_notify: {type: boolean, default: true}
      waf_bypass: {type: boolean, default: true}
      headless_crawl: {type: boolean, default: true}
      oob_detection: {type: boolean, default: true}
  workflow_call:
    inputs:
      target: {required: true, type: string}
      hunting_mode: {required: false, default: "normal", type: string}
      discord_notify: {required: false, default: true, type: boolean}
      waf_bypass: {required: false, default: true, type: boolean}
      headless_crawl: {required: false, default: true, type: boolean}
      oob_detection: {required: false, default: true, type: boolean}
    secrets:
      DISCORD_WEBHOOK: {required: false}
      ANTHROPIC_API_KEY: {required: false}
      OPENROUTER_API_KEY: {required: false}
      GROQ_API_KEY: {required: false}
      GEMINI_API_KEY: {required: false}
      OPENAI_API_KEY: {required: false}
      PDCP_API_KEY: {required: false}
      AUTH_COOKIE: {required: false}
      AUTH_HEADER: {required: false}
      TWOCAPTCHA_API_KEY: {required: false}
      INTERACTSH_URL: {required: false}

permissions: {contents: read, actions: write, id-token: write}

env:
  TARGET: ${{ inputs.target }}
  HUNTING_MODE: ${{ inputs.hunting_mode || 'normal' }}
  TID: ${{ github.run_id }}-${{ github.run_number }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK || '' }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
  PDCP_API_KEY: ${{ secrets.PDCP_API_KEY || '' }}
  AUTH_COOKIE: ${{ secrets.AUTH_COOKIE || '' }}
  AUTH_HEADER: ${{ secrets.AUTH_HEADER || '' }}
  TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY || '' }}
  INTERACTSH_URL: ${{ secrets.INTERACTSH_URL || 'oast.fun' }}
  WAF_BYPASS: ${{ inputs.waf_bypass || 'true' }}
  HEADLESS_CRAWL: ${{ inputs.headless_crawl || 'true' }}
  OOB_DETECTION: ${{ inputs.oob_detection || 'true' }}
  PYTHONUNBUFFERED: "1"
  RD: "results/${{ github.run_id }}-${{ github.run_number }}"
  UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"

jobs:
  scan:
    name: "🐐 Leo Messi - ${{ inputs.target }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5 with {go-version: "1.22", cache: true}
      - uses: actions/setup-python@v5 with {python-version: "3.11"}

      # ─── PHASE 0: SETUP ───
      - name: "⚡ Setup"
        continue-on-error: true
        timeout-minutes: 12
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential curl wget git jq unzip xvfb libpcap-dev tor proxychains4 nmap hydra medusa sqlmap whatweb wkhtmltopdf 2>/dev/null
          sudo systemctl enable --now tor 2>/dev/null || true; sleep 3
          sudo bash -c 'cat > /etc/proxychains4.conf << "EOF"\nstrict_chain\nproxy_dns\ntcp_read_time_out 15000\ntcp_connect_time_out 8000\n[ProxyList]\nsocks4 127.0.0.1 9050\nsocks5 127.0.0.1 9050\nEOF'
          pip3 install -q --upgrade pip && pip3 install -q requests aiohttp beautifulsoup4 lxml playwright httpx colorama tqdm pyyaml crypto faker fake-useragent bs4 2>/dev/null
          playwright install chromium 2>/dev/null || true
          for tool in github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest github.com/tomnomnom/assetfinder@latest github.com/tomnomnom/waybackurls@latest github.com/tomnomnom/gf@latest github.com/tomnomnom/unfurl@latest github.com/projectdiscovery/httpx/cmd/httpx@latest github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest github.com/projectdiscovery/katana/cmd/katana@latest github.com/projectdiscovery/naabu/v2/cmd/naabu@latest github.com/lc/gau/v2/cmd/gau@latest github.com/hakluke/hakrawler@latest github.com/hakluke/hakrevdns@latest github.com/ffuf/ffuf/v2@latest github.com/sensepost/gowitness@latest; do go install $tool 2>/dev/null || true; done
          [ ! -d "/opt/NoSQLMap" ] && git clone --quiet https://github.com/codingo/NoSQLMap.git /opt/NoSQLMap && pip3 install -q -r /opt/NoSQLMap/requirements.txt 2>/dev/null || true
          echo "tor_ip=$(curl -s --socks5 127.0.0.1:9050 https://api.ipify.org 2>/dev/null || echo 'none')" >> "$GITHUB_OUTPUT"
          echo "/root/go/bin" >> "$GITHUB_PATH" && echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: "📁 Dirs + KB"
        continue-on-error: true
        run: |
          mkdir -p "$RD"/{subdomains,live,urls,js,fuzzing,nuclei,cors,files,ai_agent,dns,cloud,brute,evidence,diff,custom_nuclei,oob,api,spa,race,mass_assignment,screenshots,triage,knowledge,logs}
          mkdir -p "$RD"/ai_agent/{injection,xxe,graphql,idor,chain,debate}
          python3 -c "
import sqlite3,os
os.makedirs('$RD/knowledge',exist_ok=True)
c=sqlite3.connect('$RD/knowledge/hunter.db')
c.execute('CREATE TABLE IF NOT EXISTS findings(id INTEGER PRIMARY KEY AUTOINCREMENT,run_id TEXT,target TEXT,finding_type TEXT,url TEXT,severity TEXT,parameter TEXT,payload TEXT,poc TEXT,remediation TEXT,timestamp DATETIME DEFAULT CURRENT_TIMESTAMP,verified INTEGER DEFAULT 0)')
c.execute('CREATE TABLE IF NOT EXISTS endpoints(id INTEGER PRIMARY KEY AUTOINCREMENT,target TEXT,url TEXT UNIQUE,method TEXT,params TEXT,tech TEXT,first_seen DATETIME DEFAULT CURRENT_TIMESTAMP,last_seen DATETIME DEFAULT CURRENT_TIMESTAMP)')
c.commit(); c.close()
print('KB initialized')"

      # ─── PHASE 1: RECON ───
      - name: "🌐 Phase 1: Subdomain Enumeration"
        continue-on-error: true
        timeout-minutes: 20
        run: |
          PATH="/root/go/bin:$HOME/go/bin:$PATH"
          subfinder -d "$TARGET" -silent -all -o "$RD/subdomains/subfinder.txt" 2>>"$RD/logs/subfinder.log" || true
          assetfinder --subs-only "$TARGET" > "$RD/subdomains/assetfinder.txt" 2>>"$RD/logs/assetfinder.log" || true
          curl -s --max-time 30 "https://crt.sh/?q=%25.${TARGET}&output=json" 2>/dev/null | jq -r '.[].name_value' 2>/dev/null | sed 's/*\.//g' | sort -u > "$RD/subdomains/crtsh.txt" || true
          curl -s --max-time 15 "https://api.hackertarget.com/hostsearch/?q=${TARGET}" 2>/dev/null | cut -d, -f1 | sort -u > "$RD/subdomains/hackertarget.txt" || true
          gau --subs "$TARGET" 2>/dev/null | unfurl -u domains | sort -u > "$RD/subdomains/gau_subs.txt" || true
          crobat -s "$TARGET" 2>/dev/null > "$RD/subdomains/crobat.txt" || true
          [ "$HUNTING_MODE" = "aggressive" ] && [ -s "$RD/subdomains/subfinder.txt" ] && alterx -l "$RD/subdomains/subfinder.txt" -silent 2>/dev/null | dnsx -silent -a -resp-only -t 200 2>/dev/null | awk '{print $1}' | sort -u > "$RD/subdomains/permutations.txt" || true
          cat "$RD/subdomains/"*.txt 2>/dev/null | grep -iE "\.${TARGET}$|^${TARGET}$" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]' | sort -u > "$RD/subdomains/all_subs.txt"
          echo "subs=$(wc -l < "$RD/subdomains/all_subs.txt")" >> "$GITHUB_OUTPUT"

      - name: "🌐 DNS Resolution"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          PATH="/root/go/bin:$HOME/go/bin:$PATH"
          [ -s "$RD/subdomains/all_subs.txt" ] && dnsx -l "$RD/subdomains/all_subs.txt" -silent -a -resp -t 200 2>>"$RD/logs/dnsx.log" | awk '{print $1}' | sort -u > "$RD/subdomains/resolved.txt" || true
          [ -s "$RD/subdomains/resolved.txt" ] && cat "$RD/subdomains/resolved.txt" | hakrevdns -d "$TARGET" 2>/dev/null | sort -u > "$RD/dns/reverse_dns.txt" || true
          echo "resolved=$(wc -l < "$RD/subdomains/resolved.txt")" >> "$GITHUB_OUTPUT"

      # ─── PHASE 2: SURFACE ───
      - name: "🟢 Phase 2: Live Probing + WAF Bypass"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          PATH="/root/go/bin:$HOME/go/bin:$PATH"
          INPUT="$RD/subdomains/resolved.txt"; [ -s "$INPUT" ] || { echo "$TARGET" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          A=(); [ -n "$AUTH_COOKIE" ] && A+=(-H "Cookie: $AUTH_COOKIE"); [ -n "$AUTH_HEADER" ] && A+=(-H "$AUTH_HEADER")
          if [ "$WAF_BYPASS" = "true" ] && command -v proxychains4 &>/dev/null; then
            proxychains4 -f /etc/proxychains4.conf httpx -l "$INPUT" -silent -status-code -title -web-server -tech-detect -ip -cname -cdn -H "User-Agent: $UA" "${A[@]}" -threads 50 -rate-limit 60 -timeout 15 -retries 2 -json -o "$RD/live/live.json" 2>>"$RD/logs/httpx.log" || true
          else
            httpx -l "$INPUT" -silent -status-code -title -web-server -tech-detect -ip -cname -cdn -H "User-Agent: $UA" "${A[@]}" -threads 100 -rate-limit 150 -timeout 10 -retries 1 -json -o "$RD/live/live.json" 2>>"$RD/logs/httpx.log" || true
          fi
          jq -r '.url // .input' "$RD/live/live.json" 2>/dev/null | grep -v '^\s*$' > "$RD/live/live.txt"
          jq -r '.tech[]?' "$RD/live/live.json" 2>/dev/null | sort -u > "$RD/live/tech_detected.txt"
          echo "live=$(wc -l < "$RD/live/live.txt")" >> "$GITHUB_OUTPUT"

      - name: "🔓 Port Scan"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          PATH="/root/go/bin:$HOME/go/bin:$PATH"
          INPUT="$RD/subdomains/resolved.txt"; [ -s "$INPUT" ] || { echo "$TARGET" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          PORTS="80,443,8080,8443"; [ "$HUNTING_MODE" = "normal" ] && PORTS="80,443,8080,8443,3000,5000,8000,9000"; [ "$HUNTING_MODE" = "aggressive" ] && PORTS="-top-ports 500"
          sudo naabu -l "$INPUT" -p "$PORTS" -exclude-cdn -silent -rate 1000 -c 25 -o "$RD/live/ports.txt" 2>>"$RD/logs/naabu.log" || true

      - name: "📸 Screenshots"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          PATH="/root/go/bin:$HOME/go/bin:$PATH"
          [ -s "$RD/live/live.txt" ] && head -25 "$RD/live/live.txt" > /tmp/gow.txt && timeout 240 gowitness scan file -f /tmp/gow.txt -s "$RD/screenshots" --write-csv --write-csv-file "$RD/screenshots/index.csv" -t 6 --timeout 12 --disable-db 2>>"$RD/logs/gowitness.log" || true

      # ─── PHASE 3: ASSETS ───
      - name: "📜 Phase 3: URL Collection"
        continue-on-error: true
        timeout-minutes: 20
        run: |
          PATH="/root/go/bin:$HOME/go/bin:$PATH"
          INPUT="$RD/live/live.txt"; [ -s "$INPUT" ] || { echo "https://$TARGET" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          cat "$INPUT" | waybackurls > "$RD/urls/wayback.txt" 2>>"$RD/logs/wayback.log" || true
          gau "$TARGET" --subs --o "$RD/urls/gau.txt" 2>>"$RD/logs/gau.log" || true
          A=(); [ -n "$AUTH_COOKIE" ] && A+=(-H "Cookie: $AUTH_COOKIE"); [ -n "$AUTH_HEADER" ] && A+=(-H "$AUTH_HEADER")
          [ -s "$RD/live/live.txt" ] && katana -list "$RD/live/live.txt" -H "User-Agent: $UA" "${A[@]}" -silent -depth 2 -jc -d 3 -aff -kf all -o "$RD/urls/katana.txt" 2>>"$RD/logs/katana.log" || true
          cat "$RD"/urls/*.txt 2>/dev/null | sort -u > "$RD/urls/all_urls.txt"
          command -v gf &>/dev/null && for p in xss sqli ssrf lfi ssti idor redirect debug; do gf "$p" < "$RD/urls/all_urls.txt" 2>/dev/null | sed "s/^/[$p] /" >> "$RD/urls/gf_categorized.txt" || true; done
          echo "urls=$(wc -l < "$RD/urls/all_urls.txt")" >> "$GITHUB_OUTPUT"

      - name: "📦 JS Analysis + Secrets"
        continue-on-error: true
        timeout-minutes: 12
        run: |
          PATH="/root/go/bin:$HOME/go/bin:$PATH"
          [ -s "$RD/urls/all_urls.txt" ] && grep -iE '\.js(\?|#|$)' "$RD/urls/all_urls.txt" | sort -u | head -200 > "$RD/js/js_files.txt"
          [ -s "$RD/js/js_files.txt" ] && httpx -l "$RD/js/js_files.txt" -silent -H "User-Agent: $UA" -timeout 8 -threads 30 -sr -srd "$RD/js/bodies" > /dev/null 2>>"$RD/logs/js_download.log" || true
          grep -rhIoE '(api|v[0-9]+|graphql|rest|swagger|openapi)/[a-zA-Z0-9_/?=&%-]{3,80}' "$RD/js/bodies" 2>/dev/null | sort -u > "$RD/js/api_endpoints.txt" || true
          grep -rhIoE '["'"'"']?(api[_-]?key|apikey|secret|token|jwt|bearer|password|passwd)["'"'"']?\s*[:=]\s*["'"'"'][^"'"'"']{6,80}["'"'"']' "$RD/js/bodies" 2>/dev/null | sort -u > "$RD/js/secrets.txt" || true
          grep -E '/[0-9]+([/?]|$)|[?&](id|user_id|uid|account_id|profile_id|order_id|pid|cid)=[0-9]+' "$RD/urls/all_urls.txt" 2>/dev/null | sort -u > "$RD/js/idor_candidates.txt" || true

      - name: "🔌 API + Admin Discovery"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          INPUT="$RD/live/live.txt"; [ -s "$INPUT" ] || { echo "https://$TARGET" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          for path in "/swagger.json" "/v2/api-docs" "/v3/api-docs" "/openapi.json" "/api/docs" "/graphql" "/graphiql" "/v1/graphql" "/playground"; do
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              for p in "$path"; do
                s=$(curl -sk -o /tmp/_body -w "%{http_code}" --max-time 5 -X POST -H "Content-Type: application/json" -d '{"query":"{__typename}"}' "${host}${p}" 2>/dev/null || echo "000")
                [ "$s" = "200" ] && grep -qiE '(swagger|openapi|"data"|"paths")' /tmp/_body 2>/dev/null && echo "[$s] ${host}${p}" >> "$RD/js/swagger_graphql.txt"
              done
            done < "$INPUT"
          done
          echo "/admin /administrator /panel /login /wp-admin /dashboard /backend /portal /api" > /tmp/admin_paths.txt
          httpx -l "$INPUT" -path /tmp/admin_paths.txt -mc 200,301,302,401,403 -H "User-Agent: $UA" -threads 50 -rate-limit 150 -timeout 6 -silent -o "$RD/js/admin.txt" 2>>"$RD/logs/admin.log" || true

      - name: "🕷️ Headless Crawl (SPA)"
        if: ${{ env.HEADLESS_CRAWL == 'true' }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python3 << 'PYEOF'
          import json,os,time
          rd=os.environ["RD"]; target=os.environ["TARGET"]
          try:
              from playwright.sync_api import sync_playwright
          except: print("No playwright"); exit(0)
          live=os.path.join(rd,"live","live.txt")
          urls=[l.strip() for l in open(live) if l.strip()][:8] if os.path.exists(live) else [f"https://{target}"]
          all_api=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--no-sandbox","--disable-setuid-sandbox","--disable-gpu","--window-size=1920,1080"])
              ctx=browser.new_context(user_agent=os.environ.get("UA","Mozilla/5.0"),viewport={"width":1920,"height":1080},ignore_https_errors=True)
              if os.environ.get("AUTH_COOKIE"): ctx.add_cookies([{"name":os.environ["AUTH_COOKIE"].split("=")[0],"value":os.environ["AUTH_COOKIE"].split("=")[1] if "=" in os.environ["AUTH_COOKIE"] else os.environ["AUTH_COOKIE"],"domain":target,"path":"/"}])
              page=ctx.new_page()
              def on_req(r):
                  if any(k in r.url for k in ["/api/","/graphql","/rest/","/v1/","/v2/","ajax","json"]): all_api.append({"url":r.url,"method":r.method})
              page.on("request",on_req)
              for url in urls:
                  try:
                      page.goto(url,wait_until="domcontentloaded",timeout=30000); page.wait_for_load_state("networkidle",timeout=15000)
                      for _ in range(5): page.evaluate("window.scrollTo(0,document.body.scrollHeight)"); time.sleep(1)
                      for btn in page.query_selector_all("button, a[href]:not([href='#'])"):
                          try: btn.click(timeout=2000); page.wait_for_timeout(800)
                          except: pass
                  except Exception as e: print(f"  ⚠️ {str(e)[:50]}")
              browser.close()
          os.makedirs(os.path.join(rd,"api"),exist_ok=True)
          with open(os.path.join(rd,"api","spa_apis.json"),"w") as f: json.dump(all_api,f,indent=2)
          with open(os.path.join(rd,"api","spa_endpoints.txt"),"w") as f: f.write("\n".join(sorted(set(a["url"] for a in all_api))))
          print(f"✅ SPA crawl: {len(all_api)} API calls")
          PYEOF

      - name: "🎭 Extended Recon"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          BN="$(echo "$TARGET" | sed -E 's/\.(com|net|org|io|ch|co|dev|app)(\.[a-z]{2})?$//' | sed -E 's/.*\.//')"
          [ -n "${{ secrets.GITHUB_TOKEN }}" ] && for q in "${TARGET} password" "${TARGET} api_key" "${TARGET} secret" "${TARGET} .env"; do curl -s --max-time 10 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/search/code?q=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$q" 2>/dev/null)" 2>/dev/null | jq -r '.items[]? | "\(.repository.full_name) :: \(.path)"' 2>/dev/null >> "$RD/js/github_recon.txt" || true; sleep 2; done
          for suf in "" "-backup" "-assets" "-media" "-dev" "-staging" "-files" "-data" "-public" "-uploads"; do
            for dom in "s3.amazonaws.com" "storage.googleapis.com" "blob.core.windows.net"; do
              c=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 5 "https://${BN}${suf}.${dom}/" 2>/dev/null || echo "000")
              [ "$c" = "200" ] || [ "$c" = "403" ] && echo "${dom}: ${BN}${suf} [$c]" >> "$RD/live/cloud_buckets.txt"
            done
          done

      - name: "🔎 Fuzzing (ffuf)"
        continue-on-error: true
        timeout-minutes: 20
        run: |
          PATH="/root/go/bin:$HOME/go/bin:$PATH"
          curl -sL --max-time 15 "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt" -o /tmp/fuzz.txt 2>/dev/null || true
          [ -s /tmp/fuzz.txt ] && [ -s "$RD/live/live.txt" ] && head -5 "$RD/live/live.txt" | while IFS= read -r host; do
            host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
            timeout 180 ffuf -w /tmp/fuzz.txt -u "${host}/FUZZ" -H "User-Agent: $UA" -mc 200,204,301,302,307,401,403 -ac -t 30 -rate 80 -timeout 5 -of json -o /tmp/fout.json -s 2>>"$RD/logs/ffuf.log" || true
            jq -r '.results[]? | "\(.url) [\(.status)] \(.length)B"' /tmp/fout.json 2>/dev/null >> "$RD/fuzzing/discovered.txt" || true
            rm -f /tmp/fout.json
          done
          sort -u -o "$RD/fuzzing/discovered.txt" "$RD/fuzzing/discovered.txt" 2>/dev/null

      # ─── PHASE 4: VULN SCAN ───
      - name: "☢️ Nuclei Scan"
        continue-on-error: true
        timeout-minutes: 90
        run: |
          PATH="/root/go/bin:$HOME/go/bin:$PATH"
          INPUT="$RD/live/live.txt"; [ -s "$INPUT" ] || { echo "https://$TARGET" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          A=(); [ -n "$AUTH_COOKIE" ] && A+=(-H "Cookie: $AUTH_COOKIE"); [ -n "$AUTH_HEADER" ] && A+=(-H "$AUTH_HEADER")
          C="-H 'User-Agent: $UA' ${A[@]} -mhe 150 -rl 40 -c 15 -timeout 10 -retries 1 -stats -si 60"
          for sev in critical,high,medium; do eval nuclei -l "$INPUT" -severity $sev $C -jsonl -o "$RD/nuclei/findings_1.jsonl" 2>>"$RD/logs/nuclei.log" || true; done
          eval nuclei -l "$INPUT" -as $C -jsonl -o "$RD/nuclei/findings_2.jsonl" 2>>"$RD/logs/nuclei.log" || true
          eval nuclei -l "$INPUT" -tags exposure,panel,config,default-login,exposed-panels $C -jsonl -o "$RD/nuclei/findings_3.jsonl" 2>>"$RD/logs/nuclei.log" || true
          eval nuclei -l "$INPUT" -tags cve,rce,sqli,lfi,ssrf,xss $C -jsonl -o "$RD/nuclei/findings_4.jsonl" 2>>"$RD/logs/nuclei.log" || true
          cat "$RD/nuclei/findings_"*.jsonl 2>/dev/null | python3 -c "import sys,json; [print(l.strip()) for l in sys.stdin if l.strip() and (lambda x:json.loads(x) if x else None)(None) is None]" 2>/dev/null > "$RD/nuclei/findings.jsonl" || cat "$RD/nuclei/findings_"*.jsonl 2>/dev/null > "$RD/nuclei/findings.jsonl"

      - name: "🔓 CORS + Sensitive Files"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          INPUT="$RD/live/live.txt"; [ -s "$INPUT" ] || { echo "https://$TARGET" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          for origin in "https://evil.com" "null" "https://evil.$TARGET"; do
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              resp=$(curl -s -I -H "Origin: $origin" --max-time 6 "$host" 2>/dev/null || echo "")
              acao=$(echo "$resp" | grep -i 'access-control-allow-origin' | head -1 | sed 's/.*:[[:space:]]*//' | xargs)
              acac=$(echo "$resp" | grep -i 'access-control-allow-credentials' | head -1 | sed 's/.*:[[:space:]]*//' | xargs)
              [ "$acao" = "$origin" ] && [ "$acac" = "true" ] && echo "[CORS] $host allows $origin + credentials" >> "$RD/cors/vulnerable.txt"
            done < "$INPUT"
          done
          for path in "/.env" "/.git/config" "/wp-config.php" "/config.json" "/credentials.json" "/phpinfo.php" "/Dockerfile" "/.aws/credentials" "/backup.sql" "/actuator/env"; do
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              s=$(curl -sk -o /tmp/sb --max-time 5 -w "%{http_code}" -H "User-Agent: $UA" "${host}${path}" 2>/dev/null || echo "000")
