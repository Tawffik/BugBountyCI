name: "🎯 Zero Track - AI Autonomous Hunter"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target domain (e.g., example.com)"
        required: true
        type: string
      hunting_mode:
        description: "AI hunting intensity (light=fast, normal=balanced, aggressive=deep)"
        required: false
        default: "normal"
        type: choice
        options:
          - light
          - normal
          - aggressive
      discord_notify:
        description: "Send Discord notification"
        type: boolean
        default: true

  workflow_call:
    inputs:
      target:
        description: "Target domain (e.g., example.com)"
        required: true
        type: string
      hunting_mode:
        description: "AI hunting intensity (light / normal / aggressive)"
        required: false
        default: "normal"
        type: string
      discord_notify:
        description: "Send Discord notification"
        required: false
        default: true
        type: boolean
    secrets:
      DISCORD_WEBHOOK:
        description: "Discord webhook URL"
        required: false
      ANTHROPIC_API_KEY:
        description: "API key for Anthropic (Claude)"
        required: false
      OPENROUTER_API_KEY:
        description: "API key for OpenRouter (fallback)"
        required: false
      GROQ_API_KEY:
        description: "API key for Groq (fallback)"
        required: false
      GEMINI_API_KEY:
        description: "API key for Google Gemini (fallback)"
        required: false
      OPENAI_API_KEY:
        description: "API key for OpenAI (fallback)"
        required: false
      PDCP_API_KEY:
        description: "ProjectDiscovery Cloud Platform key (optional, enables ASN/CIDR discovery via asnmap)"
        required: false
      AUTH_COOKIE:
        description: "Optional session cookie (e.g. 'session=abc123') to scan authenticated pages"
        required: false
      AUTH_HEADER:
        description: "Optional auth header (e.g. 'Authorization: Bearer xyz') to scan authenticated pages"
        required: false
      TWOCAPTCHA_API_KEY:
        description: "2Captcha API key for brute-force captcha solving (optional)"
        required: false
    outputs:
      run_url:
        description: "Link to the GitHub Actions run"
        value: ${{ jobs.full_scan.outputs.run_url }}
      finding_count:
        description: "Total findings count"
        value: ${{ jobs.full_scan.outputs.finding_count }}
      artifact_name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.full_scan.outputs.artifact_name }}

permissions:
  contents: read
  actions: write

env:
  TARGET:             ${{ inputs.target }}
  HUNTING_MODE:       ${{ inputs.hunting_mode || 'normal' }}
  TIMESTAMP:          ${{ github.run_id }}-${{ github.run_number }}
  DISCORD_WEBHOOK:    ${{ secrets.DISCORD_WEBHOOK || '' }}
  ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY || '' }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
  GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY || '' }}
  GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY || '' }}
  OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY || '' }}
  PDCP_API_KEY:       ${{ secrets.PDCP_API_KEY || '' }}
  AUTH_COOKIE:        ${{ secrets.AUTH_COOKIE || '' }}
  AUTH_HEADER:         ${{ secrets.AUTH_HEADER || '' }}
  TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY || '' }}
  INTERACTSH_URL:     ${{ secrets.INTERACTSH_URL || '' }}
  PYTHONUNBUFFERED:   "1"
  ANTHROPIC_MODEL_NAME:  "claude-sonnet-4-6"
  OPENROUTER_MODEL_NAME:      "anthropic/claude-sonnet-4"
  OPENROUTER_FREE_MODEL_NAME: "meta-llama/llama-3.3-70b-instruct:free"
  GROQ_MODEL_NAME:       "llama3-70b-8192"
  GEMINI_MODEL_NAME:     "gemini-2.5-flash"
  OPENAI_MODEL_NAME:     "gpt-5.5"
  SCAN_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

defaults:
  run:
    shell: bash

jobs:
  full_scan:
    name: "🛡️ Full Autonomous Scan - ${{ inputs.target }}"
    runs-on: ubuntu-latest
    timeout-minutes: 380
    outputs:
      run_url:       "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      finding_count: ${{ steps.count_findings.outputs.finding_count }}
      artifact_name: "results-${{ env.TIMESTAMP }}-${{ env.TARGET }}"

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🔒 Verify Target Is In Authorized Scope"
        continue-on-error: true
        env:
          TARGET_INPUT: ${{ inputs.target }}
        run: |
          target="$(echo "${TARGET_INPUT}" | xargs)"
          if [[ ! -f "scope.txt" ]]; then
            echo "⚠️ No scope.txt found — allowing any target (open scope mode)"
            echo "✅ Target authorized: $target"
            exit 0
          fi
          target_lower="$(echo "$target" | tr '[:upper:]' '[:lower:]')"
          matched=0
          while IFS= read -r raw_line; do
            line="${raw_line%%#*}"; line="$(echo "$line" | xargs)"
            [[ -z "$line" ]] && continue
            ll="$(echo "$line" | tr '[:upper:]' '[:lower:]')"
            if [[ "$ll" == "$target_lower" ]]; then matched=1; break; fi
            if [[ "$ll" == \*.* ]]; then
              base="${ll:2}"
              if [[ "$target_lower" == *".$base" ]]; then matched=1; break; fi
            fi
          done < scope.txt
          if [[ "$matched" != "1" ]]; then
            echo "⚠️ '$target' not in scope.txt — running anyway (open scope mode)"
          fi
          echo "✅ Target authorized: $target"

      - name: "✅ Environment Validation"
        run: |
          FAILED=0
          target="$(echo "${{ inputs.target }}" | xargs)"
          if [ -z "$target" ]; then
            echo "❌ CRITICAL: target input is empty. Every later step would silently run against nothing."
            FAILED=1
          else
            target="$(echo "$target" | tr '[:upper:]' '[:lower:]')"
            echo "TARGET=$target" >> "$GITHUB_ENV"
            echo "✅ target (normalized to lowercase) = $target"
          fi
          if [ -z "${{ env.ANTHROPIC_API_KEY }}${{ env.OPENROUTER_API_KEY }}${{ env.GROQ_API_KEY }}${{ env.GEMINI_API_KEY }}${{ env.OPENAI_API_KEY }}" ]; then
            echo "⚠️ No AI provider API key is configured at all - all 6 AI Agent phases will be skipped/empty. Add at least GROQ_API_KEY or GEMINI_API_KEY (both free) in repo secrets for AI analysis to run."
          else
            echo "✅ At least one AI provider key is configured"
          fi
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "ℹ️ GITHUB_TOKEN not available - GitHub secret-search recon step will be skipped"
          else
            echo "✅ GITHUB_TOKEN available for GitHub recon"
          fi
          if [ "$FAILED" = "1" ]; then
            echo "::error::Environment validation failed - see above. Stopping before wasting any further job time."
            exit 1
          fi

      - name: "⚡ Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📦 Install System Dependencies"
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq git curl wget unzip jq dnsutils libpcap-dev build-essential ripgrep hydra medusa proxychains4 tor
          echo "✅ Added hydra, medusa, proxychains4, tor for brute force & anonymity"

      - name: "🩺 Target Health Check"
        continue-on-error: true
        timeout-minutes: 2
        run: |
          target="${{ env.TARGET }}"
          if getent hosts "$target" >/dev/null 2>&1 || dig +short "$target" 2>/dev/null | grep -q .; then
            echo "✅ DNS resolves for $target"
          else
            echo "⚠️ WARNING: '$target' does not resolve via DNS right now."
            echo "⚠️ The scan will continue, but most steps may come back empty."
          fi
          code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 8 "https://${target}" 2>/dev/null || echo "000")
          echo "ℹ️ HTTPS probe status for https://${target}: $code"

      - name: "🗄️ Cache Go Toolchain"
        id: tool_cache
        uses: actions/cache@v4
        with:
          path: /tmp/toolbin
          key: go-toolbin-v8-hunter-with-brute

      - name: "📦 Install Go Tools"
        continue-on-error: true
        run: |
          mkdir -p /tmp/toolbin
          export GOBIN=/tmp/toolbin
          export PATH="/tmp/toolbin:$PATH"
          echo "/tmp/toolbin" >> "$GITHUB_PATH"
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@v2.6.6 || echo "⚠️ subfinder install failed"
          go install github.com/projectdiscovery/httpx/cmd/httpx@v1.6.8 || echo "⚠️ httpx install failed"
          go install github.com/projectdiscovery/katana/cmd/katana@v1.1.0 || echo "⚠️ katana install failed"
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.8.0 || echo "⚠️ nuclei install failed"
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@v1.2.1 || echo "⚠️ dnsx install failed"
          go install github.com/tomnomnom/assetfinder@v0.1.1 || echo "⚠️ assetfinder install failed"
          go install github.com/tomnomnom/waybackurls@v0.1.0 || echo "⚠️ waybackurls install failed"
          go install github.com/lc/gau/v2/cmd/gau@v2.2.4 || echo "⚠️ gau install failed"
          go install github.com/tomnomnom/gf@v0.0.0-20200618134122-dcd4c361f9f5 || echo "⚠️ gf install failed"
          go install github.com/projectdiscovery/alterx/cmd/alterx@v0.1.0 || echo "⚠️ alterx install failed"
          go install github.com/projectdiscovery/naabu/v2/cmd/naabu@v2.6.1 || echo "⚠️ naabu install failed"
          go install github.com/ffuf/ffuf/v2@v2.1.0 || echo "⚠️ ffuf install failed"
          go install github.com/sensepost/gowitness@v3.0.5 || echo "⚠️ gowitness install failed"
          go install github.com/projectdiscovery/asnmap/cmd/asnmap@latest || echo "⚠️ asnmap install failed"
          mkdir -p /tmp/toolbin/.gf
          git clone --depth 1 https://github.com/1ndianl33t/Gf-Patterns.git /tmp/gf-patterns 2>/dev/null || true
          cp /tmp/gf-patterns/*.json /tmp/toolbin/.gf/ 2>/dev/null || true
          cp -r /tmp/toolbin/.gf ~/.gf/ 2>/dev/null || true
          echo "✅ Go tools installation step finished"

      - name: "📦 Install Python Packages & Security Tools"
        continue-on-error: true
        run: |
          pip3 install -q --upgrade pip && pip3 install -q requests httpx uro markdown 2captcha-python
          # CloudFail - Cloudflare origin detection
          git clone --depth 1 https://github.com/anmolksachan/CloudFail.git /tmp/CloudFail 2>/dev/null || true
          # CloakQuest3r - Cloud IP discovery
          git clone --depth 1 https://github.com/spyboy-productions/CloakQuest3r.git /tmp/CloakQuest3r 2>/dev/null || true
          # sqlmap - SQL injection automation
          git clone --depth 1 https://github.com/sqlmapproject/sqlmap.git /tmp/sqlmap 2>/dev/null || true
          # NoSQLMap - NoSQL injection
          git clone --depth 1 https://github.com/codingo/NoSQLMap.git /tmp/NoSQLMap 2>/dev/null || true
          cd /tmp/NoSQLMap && python3 setup.py install --user 2>/dev/null || true
          # patator - multi-protocol brute forcer
          git clone --depth 1 https://github.com/lanjelot/patator.git /tmp/patator 2>/dev/null || true
          pip3 install -q /tmp/patator 2>/dev/null || true
          # impersonate - requests impersonating real browsers
          pip3 install -q requests-impersonate 2>/dev/null || true
          echo "✅ Added CloudFail, CloakQuest3r, sqlmap, NoSQLMap, patator, 2captcha-python, requests-impersonate"

      - name: "✅ Verify Tools"
        continue-on-error: true
        run: |
          export PATH="/tmp/toolbin:$PATH"
          for tool in subfinder httpx katana nuclei dnsx assetfinder waybackurls gau gf uro alterx naabu ffuf gowitness asnmap hydra medusa proxychains4 patator sqlmap; do
            command -v "$tool" >/dev/null && echo "✅ $tool" || echo "⚠️ $tool missing"
          done
          python3 -c "from requests_impersonate import Session; print('✅ requests-impersonate')" 2>/dev/null || echo "⚠️ requests-impersonate check failed"
          python3 -c "from twocaptcha import TwoCaptcha; print('✅ 2captcha-python')" 2>/dev/null || echo "⚠️ 2captcha-python check failed"

      - name: "📦 Update Nuclei Templates"
        continue-on-error: true
        run: |
          export PATH="/tmp/toolbin:$PATH"
          nuclei -update-templates 2>&1 | tail -2 || true

      - name: "📂 Create Results Directory"
        continue-on-error: true
        run: |
          mkdir -p "results/${{ env.TIMESTAMP }}"/{subdomains,live,urls,js,graphql,nuclei,cors,files,ai,ai_agent,logs,cloud,brute,evidence}
          mkdir -p .previous_snapshot

      - name: "🗄️ Restore Previous Scan Snapshot (Diff Mode)"
        id: snapshot_restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .previous_snapshot
          key: snapshot-${{ env.TARGET }}

      - name: "🌐 Subdomain Enumeration"
        continue-on-error: true
        timeout-minutes: 20
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          TARGET="${{ env.TARGET }}"
          echo "🔍 Subfinder..."
          subfinder -d "$TARGET" -silent -all -o "$RD/subdomains/subfinder.txt" 2>>"$RD/logs/subfinder.log" || true
          echo "🔍 Assetfinder..."
          assetfinder --subs-only "$TARGET" > "$RD/subdomains/assetfinder.txt" 2>>"$RD/logs/assetfinder.log" || true
          echo "🔍 crt.sh..."
          curl -s --max-time 30 "https://crt.sh/?q=%25.${TARGET}&output=json" | jq -r '.[].name_value' 2>/dev/null | tr ',' '\n' | sed 's/^\*\.//' | sort -u > "$RD/subdomains/crtsh.txt" 2>/dev/null || true

          echo "🩺 Checking for wildcard DNS..."
          WILD_TOKEN="wildcheck$RANDOM$RANDOM"
          WILDCARD_IP=$(dnsx -silent -a -resp-only <<< "${WILD_TOKEN}.${TARGET}" 2>/dev/null | head -1)
          if [ -n "$WILDCARD_IP" ]; then
            echo "⚠️ Wildcard DNS detected on *.${TARGET} (resolves to $WILDCARD_IP) - a plain brute-force would falsely 'confirm' every word tried, so it's skipped. Passive sources + permutations (filtered by content, not just resolution) are used instead."
          else
            echo "🔍 DNS Brute-force (capped at 4 minutes so it can never starve the merge/resolve steps below)..."
            curl -sL --max-time 20 "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/subdomains-top1million-5000.txt" -o /tmp/dns_list.txt 2>/dev/null || true
            [ -s /tmp/dns_list.txt ] && timeout 240 bash -c "sed \"s/\\\$/.${TARGET}/\" /tmp/dns_list.txt | dnsx -silent -a -cname -resp -t 200 | awk '{print \$1}'" > "$RD/subdomains/dns_brute.txt" 2>>"$RD/logs/dnsx.log" || true
          fi

          echo "🔄 Merging passive sources..."
          cat "$RD"/subdomains/*.txt 2>/dev/null | tr -d '\r' | sed 's/^\*\.//' | grep -iE "\.${TARGET}\$|^${TARGET}\$" | tr '[:upper:]' '[:lower:]' | sort -u > /tmp/raw_subs.txt

          echo "✅ Resolving merged list..."
          [ -s /tmp/raw_subs.txt ] && timeout 240 bash -c 'dnsx -silent -l /tmp/raw_subs.txt -resp -a -t 200 | awk "{print \$1}" | sort -u' > "$RD/subdomains/resolved.txt" 2>>"$RD/logs/dnsx.log" || touch "$RD/subdomains/resolved.txt"
          cut -d' ' -f1 "$RD/subdomains/resolved.txt" | sort -u -o "$RD/subdomains/resolved.txt"

          echo "🧬 Generating smart permutations..."
          if [ -s "$RD/subdomains/resolved.txt" ] && command -v alterx >/dev/null; then
            timeout 180 bash -c "alterx -l \"$RD/subdomains/resolved.txt\" -silent | dnsx -silent -resp -a -t 200 | awk '{print \$1}' | sort -u" > "$RD/subdomains/permutations_resolved.txt" 2>>"$RD/logs/alterx.log" || touch "$RD/subdomains/permutations_resolved.txt"
          else
            touch "$RD/subdomains/permutations_resolved.txt"
          fi
          cat "$RD/subdomains/resolved.txt" "$RD/subdomains/permutations_resolved.txt" 2>/dev/null | grep -v '^\s*$' | sort -u > "$RD/subdomains/all_subs.txt"
          echo "✅ Total subdomains: $(wc -l < "$RD/subdomains/all_subs.txt" 2>/dev/null || echo 0)"

      - name: "🌐 ASN/CIDR Discovery"
        continue-on-error: true
        timeout-minutes: 5
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          : > "$RD/subdomains/asn_ips.txt"
          if [ -z "${{ env.PDCP_API_KEY }}" ]; then
            echo "ℹ️ PDCP_API_KEY not set - skipping ASN/CIDR discovery"
          elif ! command -v asnmap >/dev/null; then
            echo "⚠️ asnmap not installed, skipping"
          else
            export PDCP_API_KEY="${{ env.PDCP_API_KEY }}"
            timeout 60 asnmap -d "${{ env.TARGET }}" -silent -o /tmp/asn_cidrs.txt 2>>"$RD/logs/asnmap.log" || true
            if [ -s /tmp/asn_cidrs.txt ]; then
              timeout 120 naabu -l /tmp/asn_cidrs.txt -top-ports 100 -exclude-cdn -silent -rate 1000 -c 25 2>>"$RD/logs/naabu.log" | awk -F: '{print "https://"$1":"$2}' > "$RD/subdomains/asn_ips.txt" || true
            fi
          fi
          echo "✅ ASN-derived live candidates: $(wc -l < "$RD/subdomains/asn_ips.txt" 2>/dev/null || echo 0)"

      - name: "🏚️ Subdomain Takeover Check"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          ulimit -n 65535 2>/dev/null || ulimit -n 8192 2>/dev/null || true
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/subdomains/all_subs.txt"
          [ -s "$INPUT" ] || { echo "${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          nuclei -l "$INPUT" -tags takeover -H "User-Agent: $SCAN_USER_AGENT" -mhe 150 -rl 50 -c 10 -silent -jsonl -o "$RD/nuclei/takeover.jsonl" 2>>"$RD/logs/takeover.log" || true

      - name: "🌩️ Cloud Origin Discovery (CloudFail + CloakQuest3r)"
        continue-on-error: true
        timeout-minutes: 8
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          mkdir -p "$RD/cloud"
          echo "🔍 Running CloudFail (passive mode)..."
          python3 /tmp/CloudFail/cloudfail.py -t "${{ env.TARGET }}" --passive-only 2>>"$RD/logs/cloud.log" > "$RD/cloud/cloudfail.txt" || true
          echo "🔍 Running CloakQuest3r..."
          python3 /tmp/CloakQuest3r/cloakquest3r.py "${{ env.TARGET }}" > "$RD/cloud/cloakquest.txt" 2>>"$RD/logs/cloud.log" || true
          echo "✅ Cloud origin discovery completed"

      - name: "🌍 Live Host Probing & Fingerprinting"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/subdomains/all_subs.txt"
          [ -s "$INPUT" ] || { echo "${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          if [ -s "$RD/subdomains/asn_ips.txt" ]; then
            cat "$RD/subdomains/asn_ips.txt" >> "$INPUT"
          fi
          AUTH_ARGS=()
          [ -n "${{ env.AUTH_COOKIE }}" ] && AUTH_ARGS+=(-H "Cookie: ${{ env.AUTH_COOKIE }}")
          [ -n "${{ env.AUTH_HEADER }}" ] && AUTH_ARGS+=(-H "${{ env.AUTH_HEADER }}")
          httpx -l "$INPUT" -silent -status-code -title -web-server -ip -cdn -follow-redirects -H "User-Agent: $SCAN_USER_AGENT" "${AUTH_ARGS[@]}" -threads 100 -rate-limit 150 -timeout 10 -json -o "$RD/live/live.json" 2>>"$RD/logs/httpx.log" || true
          jq -r '.url // .input' "$RD/live/live.json" 2>/dev/null | grep -v '^\s*$' > "$RD/live/live.txt" || true
          jq -r 'select(.cdn_name != null) | "\(.url) -> \(.cdn_name)"' "$RD/live/live.json" > "$RD/live/waf.txt" 2>/dev/null || true
          httpx -l "$RD/live/live.txt" -silent -tech-detect -H "User-Agent: $SCAN_USER_AGENT" "${AUTH_ARGS[@]}" -json -o "$RD/live/tech.json" 2>>"$RD/logs/fingerprint.log" || true
          echo "✅ Live hosts: $(wc -l < "$RD/live/live.txt")"

      - name: "🔓 Port Scanning with naabu"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/subdomains/all_subs.txt"
          [ -s "$INPUT" ] || { echo "${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          if command -v naabu >/dev/null; then
            sudo "$(command -v naabu)" -l "$INPUT" -top-ports 100 -exclude-cdn -silent -rate 1000 -c 25 -o "$RD/live/ports.txt" 2>>"$RD/logs/naabu.log" || true
            echo "✅ Open host:port pairs: $(wc -l < "$RD/live/ports.txt" 2>/dev/null || echo 0)"
            awk -F: '$2!=80 && $2!=443 {print}' "$RD/live/ports.txt" 2>/dev/null > /tmp/nonstd_ports.txt
            if [ -s /tmp/nonstd_ports.txt ]; then
              httpx -l /tmp/nonstd_ports.txt -silent -status-code -title -H "User-Agent: $SCAN_USER_AGENT" -timeout 8 -o "$RD/live/nonstandard_live.txt" 2>>"$RD/logs/httpx.log" || true
              echo "✅ Live services on non-standard ports: $(wc -l < "$RD/live/nonstandard_live.txt" 2>/dev/null || echo 0)"
              awk '{print $1}' "$RD/live/nonstandard_live.txt" 2>/dev/null >> "$RD/live/live.txt"
              sort -u -o "$RD/live/live.txt" "$RD/live/live.txt"
            fi
          else
            echo "⚠️ naabu not available, skipping port scan"
          fi

      - name: "📜 URL Collection"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/subdomains/all_subs.txt"
          [ -s "$INPUT" ] || { echo "${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          AUTH_ARGS=()
          [ -n "${{ env.AUTH_COOKIE }}" ] && AUTH_ARGS+=(-H "Cookie: ${{ env.AUTH_COOKIE }}")
          [ -n "${{ env.AUTH_HEADER }}" ] && AUTH_ARGS+=(-H "${{ env.AUTH_HEADER }}")
          echo "🔍 Wayback..."
          cat "$INPUT" | waybackurls > "$RD/urls/wayback.txt" 2>>"$RD/logs/wayback.log" || true
          echo "🔍 Gau..."
          gau "${{ env.TARGET }}" --subs --o "$RD/urls/gau.txt" 2>>"$RD/logs/gau.log" || true
          echo "🔍 Katana..."
          [ -s "$RD/live/live.txt" ] && katana -list "$RD/live/live.txt" -H "User-Agent: $SCAN_USER_AGENT" "${AUTH_ARGS[@]}" -silent -depth 2 -jc -d 3 -o "$RD/urls/katana.txt" 2>>"$RD/logs/katana.log" || true
          echo "🔍 robots.txt / sitemap.xml..."
          : > "$RD/urls/robots_sitemap.txt"
          if [ -s "$RD/live/live.txt" ]; then
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              curl -sk --max-time 6 -H "User-Agent: $SCAN_USER_AGENT" "${host}/robots.txt" 2>/dev/null | grep -iE '^(dis)?allow:' | sed -E 's/^[^:]*:[ \t]*//' | grep -v '^\s*$' | sed "s#^#${host}#" >> "$RD/urls/robots_sitemap.txt"
              curl -sk --max-time 6 -H "User-Agent: $SCAN_USER_AGENT" "${host}/sitemap.xml" 2>/dev/null | grep -oE '<loc>[^<]+</loc>' | sed -E 's/<\/?loc>//g' >> "$RD/urls/robots_sitemap.txt"
            done < <(head -20 "$RD/live/live.txt")
          fi
          echo "🔄 Merging..."
          cat "$RD"/urls/*.txt 2>/dev/null | sort -u > /tmp/urls_merged.txt
          timeout 90 uro < /tmp/urls_merged.txt > "$RD/urls/all.txt" 2>/dev/null || cp /tmp/urls_merged.txt "$RD/urls/all.txt"
          echo "✅ Total URLs: $(wc -l < "$RD/urls/all.txt")"

          echo "🎯 Categorizing URLs by vulnerability-relevant parameters (gf patterns)..."
          : > "$RD/urls/gf_categorized.txt"
          if [ -s "$RD/urls/all.txt" ] && command -v gf >/dev/null; then
            for pat in xss sqli ssrf lfi ssti idor redirect; do
              timeout 30 gf "$pat" < "$RD/urls/all.txt" 2>/dev/null | sed "s/^/[$pat] /" >> "$RD/urls/gf_categorized.txt" || true
            done
            sort -u -o "$RD/urls/gf_categorized.txt" "$RD/urls/gf_categorized.txt"
          fi
          echo "✅ gf-categorized candidates: $(wc -l < "$RD/urls/gf_categorized.txt" 2>/dev/null || echo 0)"

      - name: "📦 JavaScript Analysis"
        continue-on-error: true
        timeout-minutes: 12
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/urls/all.txt"
          if [ -s "$INPUT" ]; then
            grep -iE '\.js(\?|#|$)' "$INPUT" | sort -u | head -200 > "$RD/js/files.txt"
            echo "✅ JS files found: $(wc -l < "$RD/js/files.txt" 2>/dev/null || echo 0)"
            if [ -s "$RD/js/files.txt" ]; then
              echo "⬇️ Downloading JS file contents for analysis..."
              httpx -l "$RD/js/files.txt" -silent -H "User-Agent: $SCAN_USER_AGENT" -timeout 8 -threads 30 -sr -srd "$RD/js/bodies" > /dev/null 2>>"$RD/logs/js_download.log" || true
              grep -rhIoE '(api|v[0-9]+|graphql|rest)/[a-zA-Z0-9_/?=&%-]{3,80}' "$RD/js/bodies" 2>/dev/null | sort -u > "$RD/js/api_endpoints.txt" || true
              grep -rhIoE '["'"'"']?(api[_-]?key|apikey|secret|token|jwt|bearer)["'"'"']?\s*[:=]\s*["'"'"'][^"'"'"']{6,80}["'"'"']' "$RD/js/bodies" 2>/dev/null | sort -u > "$RD/js/secrets.txt" || true
            fi
            echo "✅ API endpoints (from JS content): $(wc -l < "$RD/js/api_endpoints.txt" 2>/dev/null || echo 0) | Secrets: $(wc -l < "$RD/js/secrets.txt" 2>/dev/null || echo 0)"
          fi
          grep -iEo '/[0-9]+([/?][^ ]*)?$|[?&](id|user_id|uid|account_id|profile_id|order_id)=[0-9]+' "$INPUT" 2>/dev/null | sort -u > "$RD/js/idor_candidates.txt" || true
          echo "✅ IDOR candidates: $(wc -l < "$RD/js/idor_candidates.txt" 2>/dev/null || echo 0)"

      - name: "🕵️ Extended Recon (GitHub / VHosts / Cloud Storage)"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          TARGET="${{ env.TARGET }}"
          BASE_NAME="$(echo "$TARGET" | sed -E 's/\.(com|net|org|io|ch|co|dev|app)(\.[a-z]{2})?$//' | sed -E 's/.*\.//')"

          echo "🔍 GitHub code search for leaked secrets mentioning ${TARGET}..."
          : > "$RD/js/github_recon.txt"
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            for q in "${TARGET} password" "${TARGET} api_key" "${TARGET} secret"; do
              curl -s --max-time 10 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/search/code?q=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$q")" \
                2>/dev/null | jq -r '.items[]? | "\(.repository.full_name) :: \(.path)"' 2>/dev/null >> "$RD/js/github_recon.txt" || true
              sleep 3
            done
            sort -u -o "$RD/js/github_recon.txt" "$RD/js/github_recon.txt"
            echo "✅ GitHub recon hits: $(wc -l < "$RD/js/github_recon.txt" 2>/dev/null || echo 0)"
          else
            echo "⚠️ GITHUB_TOKEN not available, skipping GitHub recon"
          fi

          echo "🔍 Virtual host discovery on shared IPs..."
          : > "$RD/live/vhosts.txt"
          if [ -s "$RD/live/live.txt" ]; then
            IPS=$(dnsx -silent -l "$RD/live/live.txt" -resp-only -a 2>/dev/null | awk '{print $1}' | sort -u | head -5)
            for ip in $IPS; do
              [ -z "$ip" ] && continue
              base_len=$(curl -sk --max-time 6 -H "Host: nonexistent-$RANDOM.$TARGET" -H "User-Agent: $SCAN_USER_AGENT" -o /tmp/vhost_base -w "%{http_code}" "https://$ip/" 2>/dev/null || echo "000")
              blen=$(wc -c < /tmp/vhost_base 2>/dev/null || echo 0)
              for vh in dev staging admin internal test api-internal vpn preprod uat qa; do
                rlen=$(curl -sk --max-time 6 -H "Host: ${vh}.${TARGET}" -H "User-Agent: $SCAN_USER_AGENT" -o /tmp/vhost_test -w "%{http_code}" "https://$ip/" 2>/dev/null || echo "000")
                tlen=$(wc -c < /tmp/vhost_test 2>/dev/null || echo 0)
                diff=$(( tlen > blen ? tlen - blen : blen - tlen ))
                if [ "$blen" -gt 0 ] && [ "$diff" -gt 50 ]; then
                  echo "${vh}.${TARGET} on ${ip} (response differs from baseline by ${diff} bytes)" >> "$RD/live/vhosts.txt"
                fi
              done
            done
          fi
          echo "✅ Candidate hidden vhosts: $(wc -l < "$RD/live/vhosts.txt" 2>/dev/null || echo 0)"

          echo "🔍 Cloud storage bucket enumeration..."
          : > "$RD/live/cloud_buckets.txt"
          if [ -n "$BASE_NAME" ]; then
            for suffix in "" "-backup" "-assets" "-media" "-dev" "-staging" "-files" "-data" "-public" "-uploads" "-static" "-logs"; do
              bname="${BASE_NAME}${suffix}"
              s3_code=$(curl -sk --max-time 6 -o /dev/null -w "%{http_code}" "https://${bname}.s3.amazonaws.com/" 2>/dev/null || echo "000")
              [ "$s3_code" = "200" ] || [ "$s3_code" = "403" ] && echo "S3: https://${bname}.s3.amazonaws.com/ [HTTP $s3_code]" >> "$RD/live/cloud_buckets.txt"
              gcs_code=$(curl -sk --max-time 6 -o /dev/null -w "%{http_code}" "https://storage.googleapis.com/${bname}/" 2>/dev/null || echo "000")
              [ "$gcs_code" = "200" ] || [ "$gcs_code" = "403" ] && echo "GCS: https://storage.googleapis.com/${bname}/ [HTTP $gcs_code]" >> "$RD/live/cloud_buckets.txt"
            done
          fi
          echo "✅ Candidate cloud buckets found: $(wc -l < "$RD/live/cloud_buckets.txt" 2>/dev/null || echo 0)"

      - name: "🔎 Content Discovery Fuzzing"
        continue-on-error: true
        timeout-minutes: 25
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          mkdir -p "$RD/fuzzing"
          curl -sL --max-time 15 "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt" -o /tmp/content_wordlist.txt 2>/dev/null || true
          : > "$RD/fuzzing/discovered.txt"
          if [ -s /tmp/content_wordlist.txt ] && [ -s "$RD/live/live.txt" ] && command -v ffuf >/dev/null; then
            HOST_COUNT=$(head -8 "$RD/live/live.txt" | wc -l); HOST_COUNT=${HOST_COUNT:-1}
            PER_HOST_SECS=$(( (25 * 60 - 90) / HOST_COUNT ))
            [ "$PER_HOST_SECS" -lt 30 ] && PER_HOST_SECS=30
            echo "⏱️ ~${PER_HOST_SECS}s guaranteed per host ($HOST_COUNT hosts)"
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              timeout "$PER_HOST_SECS" ffuf -w /tmp/content_wordlist.txt -u "${host}/FUZZ" -H "User-Agent: $SCAN_USER_AGENT" \
                -mc 200,204,301,302,307,401,403 -ac -t 30 -rate 80 -timeout 5 -of json -o /tmp/ffuf_out.json -s 2>>"$RD/logs/ffuf.log" || true
              jq -r '.results[]? | "\(.url) [\(.status)] \(.length) bytes"' /tmp/ffuf_out.json 2>/dev/null >> "$RD/fuzzing/discovered.txt" || true
              rm -f /tmp/ffuf_out.json
            done < <(head -8 "$RD/live/live.txt")
            sort -u -o "$RD/fuzzing/discovered.txt" "$RD/fuzzing/discovered.txt"
          fi
          echo "✅ Content discovery hits: $(wc -l < "$RD/fuzzing/discovered.txt" 2>/dev/null || echo 0)"

      - name: "🔌 API Discovery"
        continue-on-error: true
        timeout-minutes: 12
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/live/live.txt"
          [ -s "$INPUT" ] || { echo "https://${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          : > "$RD/js/swagger.txt"
          for path in "/swagger.json" "/v2/api-docs" "/v3/api-docs" "/openapi.json" "/api/docs" "/swagger-ui.html"; do
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              s=$(curl -sk -o /tmp/body.txt -w "%{http_code}" --max-time 5 "${host}${path}" 2>/dev/null || echo "000")
              [ "$s" = "200" ] && grep -qiE '(swagger|openapi|"paths")' /tmp/body.txt 2>/dev/null && echo "[$s] ${host}${path}" >> "$RD/js/swagger.txt"
            done < "$INPUT"
          done
          : > "$RD/js/graphql.txt"
          for path in "/graphql" "/graphiql" "/v1/graphql" "/api/graphql" "/playground"; do
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              s=$(curl -sk -o /tmp/gql.txt -w "%{http_code}" --max-time 5 -X POST -H "Content-Type: application/json" -d '{"query":"{__typename}"}' "${host}${path}" 2>/dev/null || echo "000")
              [ "$s" = "200" ] && grep -qiE '("data"|"errors")' /tmp/gql.txt 2>/dev/null && echo "[$s] ${host}${path}" >> "$RD/js/graphql.txt"
            done < "$INPUT"
          done
          echo "/admin /administrator /panel /cpanel /login /wp-admin /dashboard /backend /portal" | tr ' ' '\n' > /tmp/admin_paths.txt
          httpx -l "$INPUT" -path /tmp/admin_paths.txt -mc 200,301,302,401,403 -H "User-Agent: $SCAN_USER_AGENT" -threads 50 -rate-limit 150 -timeout 6 -silent -o "$RD/js/admin.txt" 2>>"$RD/logs/admin.log" || true
          if [ -s "$RD/js/admin.txt" ]; then sed -i '1i # CANDIDATE paths only (status-code match) - verify manually, not confirmed findings' "$RD/js/admin.txt"; fi
          echo "✅ Swagger: $(wc -l < "$RD/js/swagger.txt" 2>/dev/null || echo 0) | GraphQL: $(wc -l < "$RD/js/graphql.txt" 2>/dev/null || echo 0) | Admin: $(wc -l < "$RD/js/admin.txt" 2>/dev/null || echo 0)"

      - name: "🛡️ Security Analysis (CORS + Sensitive Files)"
        continue-on-error: true
        timeout-minutes: 12
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/live/live.txt"
          [ -s "$INPUT" ] || { echo "https://${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          : > "$RD/cors/vulnerable.txt"
          for origin in "https://evil.com" "null" "https://evil.${{ env.TARGET }}"; do
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              resp=$(curl -s -I -H "Origin: $origin" --max-time 6 "$host" 2>/dev/null || echo "")
              acao=$(echo "$resp" | grep -i 'access-control-allow-origin' | head -1 | sed 's/.*://' | xargs 2>/dev/null || echo "")
              acac=$(echo "$resp" | grep -i 'access-control-allow-credentials' | head -1 | sed 's/.*://' | xargs 2>/dev/null || echo "")
              [ "$acao" = "$origin" ] && [ "$acac" = "true" ] && echo "[CORS-CRITICAL] $host origin=$origin" >> "$RD/cors/vulnerable.txt"
            done < "$INPUT"
          done
          declare -A BASE_LEN
          while IFS= read -r host; do
            host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
            curl -sk --max-time 5 -o /tmp/base_body -w "%{http_code}" "${host}/__not_a_real_path_xyz123" > /tmp/base_status 2>/dev/null || true
            BASE_LEN["$host"]=$(wc -c < /tmp/base_body 2>/dev/null || echo 0)
          done < "$INPUT"
          : > "$RD/files/sensitive.txt"
          for path in "/.env" "/.git/config" "/wp-config.php" "/config.json" "/credentials.json" "/phpinfo.php" "/info.php" "/Dockerfile" "/.aws/credentials" "/backup.sql"; do
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              status=$(curl -sk -o /tmp/resp_body --max-time 5 -w "%{http_code}" "${host}${path}" 2>/dev/null || echo "000")
              [ "$status" != "200" ] && continue
              blen="${BASE_LEN[$host]:-0}"; rlen=$(wc -c < /tmp/resp_body 2>/dev/null || echo 0)
              diff=$(( rlen > blen ? rlen - blen : blen - rlen ))
              [ "$blen" -gt 0 ] && [ "$diff" -lt 30 ] && continue
              grep -qE '(DB_PASSWORD|aws_access_key|client_secret|APP_SECRET|mysql_connect\(|define\(.DB_)' /tmp/resp_body && echo "[SENSITIVE] ${host}${path}" >> "$RD/files/sensitive.txt"
            done < "$INPUT"
          done
          echo "✅ CORS: $(wc -l < "$RD/cors/vulnerable.txt" 2>/dev/null || echo 0) | Sensitive: $(wc -l < "$RD/files/sensitive.txt" 2>/dev/null || echo 0)"

      - name: "📸 Screenshots"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          mkdir -p "$RD/screenshots"
          if [ -s "$RD/live/live.txt" ] && command -v gowitness >/dev/null; then
            head -25 "$RD/live/live.txt" > /tmp/screenshot_targets.txt
            timeout 600 gowitness scan file -f /tmp/screenshot_targets.txt \
              -s "$RD/screenshots" --write-csv --write-csv-file "$RD/screenshots/index.csv" \
              -t 10 --timeout 15 --disable-db 2>>"$RD/logs/gowitness.log" || true
          fi
          echo "✅ Screenshots captured: $(find "$RD/screenshots" -iname '*.png' 2>/dev/null | wc -l)"

      - name: "☢️ Nuclei Vulnerability Scan"
        continue-on-error: true
        timeout-minutes: 100
        run: |
          ulimit -n 65535 2>/dev/null || ulimit -n 8192 2>/dev/null || true
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/live/live.txt"
          [ -s "$INPUT" ] || { echo "https://${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          AUTH_ARGS=()
          [ -n "${{ env.AUTH_COOKIE }}" ] && AUTH_ARGS+=(-H "Cookie: ${{ env.AUTH_COOKIE }}")
          [ -n "${{ env.AUTH_HEADER }}" ] && AUTH_ARGS+=(-H "${{ env.AUTH_HEADER }}")
          nuclei -l "$INPUT" -severity critical,high,medium -H "User-Agent: $SCAN_USER_AGENT" "${AUTH_ARGS[@]}" -mhe 150 -rl 40 -c 15 -timeout 10 -retries 1 -stats -si 30 -jsonl -o "$RD/nuclei/findings.jsonl" 2>>"$RD/logs/nuclei.log" || true
          if [ -s "$RD/live/tech.json" ]; then
            nuclei -l "$INPUT" -as -H "User-Agent: $SCAN_USER_AGENT" "${AUTH_ARGS[@]}" -mhe 150 -rl 40 -c 15 -timeout 10 -retries 1 -jsonl -o "$RD/nuclei/findings_tech.jsonl" 2>>"$RD/logs/nuclei.log" || true
            cat "$RD/nuclei/findings_tech.jsonl" 2>/dev/null >> "$RD/nuclei/findings.jsonl" || true
          fi
          nuclei -l "$INPUT" -tags exposure,panel,config,default-login,exposed-panels -H "User-Agent: $SCAN_USER_AGENT" "${AUTH_ARGS[@]}" -mhe 150 -rl 40 -c 15 -timeout 10 -retries 1 -jsonl -o "$RD/nuclei/findings_exposure.jsonl" 2>>"$RD/logs/nuclei.log" || true
          cat "$RD/nuclei/findings_exposure.jsonl" 2>/dev/null >> "$RD/nuclei/findings.jsonl" || true
          if [ -s "$RD/nuclei/findings.jsonl" ]; then
            python3 << 'PYEOF2' || true
          import json, os
          p=os.path.join("results", os.environ.get("TIMESTAMP",""), "nuclei", "findings.jsonl")
          valid=[]
          with open(p) as f:
              for line in f:
                  line=line.strip()
                  if not line: continue
                  try:
                      json.loads(line); valid.append(line)
                  except Exception:
                      pass
          with open(p,"w") as f:
              f.write("\n".join(valid) + ("\n" if valid else ""))
          print(f"🧹 findings.jsonl validated: {len(valid)} clean line(s)")
          PYEOF2
          fi
          echo "✅ Nuclei findings: $(wc -l < "$RD/nuclei/findings.jsonl" 2>/dev/null || echo 0)"

