                  print(f"✅ Report ({len(text)} chars) via {p['name']}"); ok=True; break
              except Exception as e: print(f"⚠️ {p['name']}: {e}"); continue
          if not ok: print("❌ All providers failed for report")
          PYEOF

      - name: "🔢 Count Total Findings"
        id: count_findings
        if: always()
        continue-on-error: true
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INJECT=$(grep -cE '\[(XSS|SSTI|SQLi|LFI|SSRF|Command|Redirect|NoSQLi)\]' "$RD/ai_agent/injection_findings.txt" 2>/dev/null || true); INJECT=${INJECT:-0}
          XXE=$(grep -c '\[XXE\]' "$RD/ai_agent/xxe_findings.txt" 2>/dev/null || true); XXE=${XXE:-0}
          GQL=$(grep -c '\[GRAPHQL' "$RD/ai_agent/graphql_findings.txt" 2>/dev/null || true); GQL=${GQL:-0}
          IDOR=$(grep -c '\[IDOR\]' "$RD/ai_agent/idor_findings.txt" 2>/dev/null || true); IDOR=${IDOR:-0}
          NUCLEI=$(wc -l < "$RD/nuclei/findings.jsonl" 2>/dev/null || true); NUCLEI=${NUCLEI:-0}
          SENS=$(wc -l < "$RD/files/sensitive.txt" 2>/dev/null || true); SENS=${SENS:-0}
          CORS=$(wc -l < "$RD/cors/vulnerable.txt" 2>/dev/null || true); CORS=${CORS:-0}
          BRUTE=$(ls "$RD/ai_agent/brute"/*.txt 2>/dev/null | wc -l || echo 0)
          TOTAL=$(( INJECT + XXE + GQL + IDOR + NUCLEI + SENS + CORS + BRUTE ))
          echo "finding_count=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "🔢 Total confirmed findings: $TOTAL"

      - name: "🆚 Diff Against Previous Scan"
        continue-on-error: true
        timeout-minutes: 3
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          mkdir -p "$RD/diff" .previous_snapshot
          diff_section() {
            label="$1"; old="$2"; new="$3"
            touch "$old" "$new"
            new_items=$(comm -13 <(sort -u "$old") <(sort -u "$new") 2>/dev/null)
            gone_items=$(comm -23 <(sort -u "$old") <(sort -u "$new") 2>/dev/null)
            new_count=$(echo -n "$new_items" | grep -c . || true); new_count=${new_count:-0}
            gone_count=$(echo -n "$gone_items" | grep -c . || true); gone_count=${gone_count:-0}
            {
              echo "## $label"
              if [ -s ".previous_snapshot/${label}.txt" ] || [ -s "$old" ]; then
                echo "🆕 New since last scan ($new_count):"
                [ -n "$new_items" ] && echo "$new_items" | sed 's/^/- /' || echo "- (none)"
                echo ""
                echo "🗑️ Gone since last scan ($gone_count):"
                [ -n "$gone_items" ] && echo "$gone_items" | sed 's/^/- /' || echo "- (none)"
              else
                echo "_No previous snapshot for this target yet - this is the baseline run._"
              fi
              echo ""
            } >> "$RD/diff/diff.md"
          }
          echo "# 🆚 Diff vs Previous Scan of ${{ env.TARGET }}" > "$RD/diff/diff.md"
          echo "" >> "$RD/diff/diff.md"
          diff_section "Subdomains" ".previous_snapshot/subdomains.txt" "$RD/subdomains/all_subs.txt"
          diff_section "Live_Hosts" ".previous_snapshot/live.txt" "$RD/live/live.txt"
          diff_section "URLs" ".previous_snapshot/urls.txt" "$RD/urls/all.txt"
          echo "✅ Diff report written to diff/diff.md"

      - name: "💾 Save Current Scan Snapshot"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          mkdir -p .previous_snapshot
          cp "$RD/subdomains/all_subs.txt" .previous_snapshot/subdomains.txt 2>/dev/null || touch .previous_snapshot/subdomains.txt
          cp "$RD/live/live.txt" .previous_snapshot/live.txt 2>/dev/null || touch .previous_snapshot/live.txt
          cp "$RD/urls/all.txt" .previous_snapshot/urls.txt 2>/dev/null || touch .previous_snapshot/urls.txt
          gh cache delete "snapshot-${{ env.TARGET }}" 2>/dev/null || true

      - name: "💾 Save Snapshot Cache"
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .previous_snapshot
          key: snapshot-${{ env.TARGET }}

      - name: "📋 Triage & Prioritization"
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 << 'PYEOF'
          import json, os, glob

          rd = "results/" + os.environ.get("TIMESTAMP", "")
          SEV_RANK = {"critical": 5, "high": 4, "medium": 3, "low": 2, "info": 1, "unknown": 0}

          def rl(path):
              try:
                  with open(os.path.join(rd, path)) as f:
                      return [l.strip() for l in f if l.strip()]
              except Exception:
                  return []

          confirmed = []

          for line in rl("nuclei/findings.jsonl"):
              try:
                  j = json.loads(line)
                  sev = j.get("info", {}).get("severity", "unknown").lower()
                  name = j.get("info", {}).get("name", j.get("template-id", "unknown"))
                  host = j.get("host", j.get("matched-at", ""))
                  confirmed.append((SEV_RANK.get(sev, 0), sev, "Nuclei", f"{name} @ {host}"))
              except Exception:
                  continue

          for l in rl("ai_agent/injection_findings.txt"):
              sev = "high" if any(k in l for k in ["SQLi", "SSTI", "RCE", "Command"]) else "medium"
              confirmed.append((SEV_RANK[sev], sev, "Injection", l))
          for l in rl("ai_agent/xxe_findings.txt"):
              if l.startswith("[XXE]"): confirmed.append((SEV_RANK["high"], "high", "XXE", l))
          for l in rl("ai_agent/idor_findings.txt"):
              if l.startswith("[IDOR]"): confirmed.append((SEV_RANK["medium"], "medium", "IDOR", l))
          for l in rl("ai_agent/graphql_findings.txt"):
              if l.startswith("[GRAPHQL"): confirmed.append((SEV_RANK["medium"], "medium", "GraphQL", l))
          for l in rl("cors/vulnerable.txt"):
              confirmed.append((SEV_RANK["medium"], "medium", "CORS", l))
          for l in rl("files/sensitive.txt"):
              confirmed.append((SEV_RANK["high"], "high", "Sensitive File", l))
          for l in rl("nuclei/takeover.jsonl"):
              confirmed.append((SEV_RANK["high"], "high", "Subdomain Takeover", l[:200]))

          confirmed.sort(key=lambda x: -x[0])

          leads = []
          for l in rl("js/github_recon.txt"): leads.append(("GitHub Exposure", l))
          for l in rl("live/vhosts.txt"): leads.append(("Hidden VHost", l))
          for l in rl("live/cloud_buckets.txt"): leads.append(("Cloud Bucket", l))
          for l in rl("fuzzing/discovered.txt"): leads.append(("Content Discovery", l))
          for l in rl("js/admin.txt"):
              if not l.startswith("#"): leads.append(("Admin Path Candidate", l))

          lines = [f"# 🎯 Triage & Prioritization\n"]
          lines.append(f"**{len(confirmed)} confirmed findings** (sorted by severity) · **{len(leads)} recon leads** for manual review\n")
          lines.append("---\n\n## 🔴 Confirmed Findings\n")
          if confirmed:
              for rank, sev, cat, detail in confirmed:
                  badge = {"critical":"🟣 CRITICAL","high":"🔴 HIGH","medium":"🟠 MEDIUM","low":"🟡 LOW"}.get(sev, "⚪ INFO")
                  lines.append(f"- **[{badge}]** `{cat}` — {detail[:200]}")
          else:
              lines.append("_None this run._")
          lines.append("\n---\n\n## 🟡 Recon Leads (not confirmed - verify manually)\n")
          if leads:
              for cat, detail in leads:
                  lines.append(f"- `{cat}` — {detail[:200]}")
          else:
              lines.append("_None this run._")

          os.makedirs(os.path.join(rd, "triage"), exist_ok=True)
          with open(os.path.join(rd, "triage", "triage.md"), "w") as f:
              f.write("\n".join(lines))
          print(f"✅ Triage completed")
          PYEOF

      - name: "📄 Professional Report Export"
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 << 'PYEOF'
          import os, datetime
          try:
              import markdown as md
          except ImportError:
              md = None

          rd = "results/" + os.environ.get("TIMESTAMP", "")
          target = os.environ.get("TARGET", "")

          def rf(path):
              try:
                  with open(os.path.join(rd, path)) as f: return f.read()
              except Exception: return ""

          sections = []
          triage = rf("triage/triage.md")
          if triage: sections.append(triage)
          report = rf("ai/security_report.md")
          if report: sections.append(report)
          diff = rf("diff/diff.md")
          if diff: sections.append(diff)

          combined_md = "\n\n---\n\n".join(sections) if sections else "# No data collected this run."

          if md:
              body_html = md.markdown(combined_md, extensions=["tables", "fenced_code"])
          else:
              body_html = "<pre>" + combined_md.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;") + "</pre>"

          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <title>Security Report - {target}</title>
          <style>
            body {{ font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 40px 24px; color: #1a1a2e; line-height: 1.6; background: #fafafa; }}
            h1 {{ border-bottom: 3px solid #e63946; padding-bottom: 10px; }}
            h2 {{ border-bottom: 1px solid #ddd; padding-bottom: 6px; margin-top: 36px; }}
            code {{ background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }}
            pre {{ background: #1e1e2e; color: #e0e0e0; padding: 16px; border-radius: 8px; overflow-x: auto; }}
            table {{ border-collapse: collapse; width: 100%; margin: 16px 0; }}
            th, td {{ border: 1px solid #ddd; padding: 8px 12px; text-align: left; }}
            th {{ background: #f0f0f0; }}
            .header-bar {{ background: #1a1a2e; color: white; padding: 20px 24px; border-radius: 8px; margin-bottom: 24px; }}
            .header-bar h1 {{ border: none; margin: 0; color: white; }}
            .header-bar p {{ margin: 6px 0 0; opacity: 0.8; }}
            li {{ margin: 4px 0; }}
          </style>
          </head>
          <body>
          <div class="header-bar">
            <h1>🛡️ Security Assessment Report</h1>
            <p>Target: <strong>{target}</strong> &nbsp;|&nbsp; Generated: {datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')}</p>
          </div>
          {body_html}
          </body>
          </html>"""

          os.makedirs(os.path.join(rd, "report"), exist_ok=True)
          with open(os.path.join(rd, "report", "final_report.html"), "w") as f:
              f.write(html)
          print(f"✅ Professional HTML report generated")
          PYEOF

      - name: "📦 Upload Toolchain Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ env.TIMESTAMP }}
          path: /tmp/toolbin/
          retention-days: 7
          if-no-files-found: ignore

      - name: "📤 Upload Results Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ env.TIMESTAMP }}-${{ env.TARGET }}
          path: results/${{ env.TIMESTAMP }}/
          retention-days: 30

      - name: "📣 Discord Notification"
        if: ${{ always() && inputs.discord_notify == true && env.DISCORD_WEBHOOK != '' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          SUBS=$(wc -l < "$RD/subdomains/all_subs.txt" 2>/dev/null || true); SUBS=${SUBS:-0}
          LIVE=$(wc -l < "$RD/live/live.txt" 2>/dev/null || true); LIVE=${LIVE:-0}
          INJECT=$(grep -cE '\[(XSS|SSTI|SQLi|LFI|SSRF|Command|Redirect|NoSQLi)\]' "$RD/ai_agent/injection_findings.txt" 2>/dev/null || true); INJECT=${INJECT:-0}
          XXE=$(grep -c '\[XXE\]' "$RD/ai_agent/xxe_findings.txt" 2>/dev/null || true); XXE=${XXE:-0}
          GQL=$(grep -c '\[GRAPHQL' "$RD/ai_agent/graphql_findings.txt" 2>/dev/null || true); GQL=${GQL:-0}
          IDOR=$(grep -c '\[IDOR\]' "$RD/ai_agent/idor_findings.txt" 2>/dev/null || true); IDOR=${IDOR:-0}
          NUCLEI=$(wc -l < "$RD/nuclei/findings.jsonl" 2>/dev/null || true); NUCLEI=${NUCLEI:-0}
          SENS=$(wc -l < "$RD/files/sensitive.txt" 2>/dev/null || true); SENS=${SENS:-0}
          CORS=$(wc -l < "$RD/cors/vulnerable.txt" 2>/dev/null || true); CORS=${CORS:-0}
          TOTAL_AGENT=$(( INJECT + XXE + GQL + IDOR ))
          BRUTE=$(ls "$RD/ai_agent/brute"/*.txt 2>/dev/null | wc -l || echo 0)

          COLOR=5814783; TITLE="✅ Scan Complete"
          if [ "$TOTAL_AGENT" -gt 0 ] || [ "$SENS" -gt 0 ] || [ "$CORS" -gt 0 ] || [ "$BRUTE" -gt 0 ]; then
            COLOR=15158332; TITLE="🚨 Vulnerabilities Found"
          elif [ "$NUCLEI" -gt 5 ]; then
            COLOR=16744192; TITLE="🔶 Findings Require Review"
          fi

          jq -n \
            --arg t "${{ env.TARGET }}" \
            --arg title "$TITLE" \
            --arg subs "$SUBS" \
            --arg live "$LIVE" \
            --arg inject "$INJECT" \
            --arg xxe "$XXE" \
            --arg gql "$GQL" \
            --arg idor "$IDOR" \
            --arg nuclei "$NUCLEI" \
            --arg sens "$SENS" \
            --arg cors "$CORS" \
            --arg brute "$BRUTE" \
            --arg run "${{ github.run_number }}" \
            --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson color "$COLOR" \
          '{
            username:"🎯 BugHunter AI",
            embeds:[{
              title:($title+": "+$t), color:$color, url:$url,
              fields:[
                {name:"🌐 Recon", value:("Subs: **"+$subs+"** | Live: **"+$live+"**"), inline:false},
                {name:"🧠 AI Agent", value:("Injections: **"+$inject+"** | XXE: **"+$xxe+"** | GraphQL: **"+$gql+"** | IDOR: **"+$idor+"**"), inline:false},
                {name:"🔓 Scanner", value:("Nuclei: **"+$nuclei+"** | Secrets: **"+$sens+"** | CORS: **"+$cors+"** | Brute: **"+$brute+"**"), inline:false},
                {name:"🔗 Results", value:("[View Run]("+$url+")"), inline:true}
              ],
              footer:{text:("Run #"+$run+" | Mode: ${{ env.HUNTING_MODE }} | AI Autonomous Hunter")}
            }]
          }' | curl -s -X POST "${{ env.DISCORD_WEBHOOK }}" -H "Content-Type: application/json" -d @- || true
