          if os.environ.get("OPENROUTER_API_KEY",""): providers.append({"name":"OpenRouter","url":"https://openrouter.ai/api/v1/chat/completions","headers":{"Authorization":f"Bearer {os.environ['OPENROUTER_API_KEY']}","content-type":"application/json"},"body_tpl":lambda p:json.dumps({"model":os.environ.get("OPENROUTER_MODEL_NAME","anthropic/claude-sonnet-4"),"max_tokens":8192,"messages":[{"role":"user","content":p}]}).encode(),"extract":lambda r:r["choices"][0]["message"]["content"]})
          if os.environ.get("OPENROUTER_API_KEY",""): providers.append({"name":"OpenRouter (free)","url":"https://openrouter.ai/api/v1/chat/completions","headers":{"Authorization":f"Bearer {os.environ['OPENROUTER_API_KEY']}","content-type":"application/json"},"body_tpl":lambda p:json.dumps({"model":os.environ.get("OPENROUTER_FREE_MODEL_NAME","meta-llama/llama-3.3-70b-instruct:free"),"max_tokens":8192,"messages":[{"role":"user","content":p}]}).encode(),"extract":lambda r:r["choices"][0]["message"]["content"]})
          if os.environ.get("GROQ_API_KEY",""): providers.append({"name":"Groq","url":"https://api.groq.com/openai/v1/chat/completions","headers":{"Authorization":f"Bearer {os.environ['GROQ_API_KEY']}","content-type":"application/json"},"body_tpl":lambda p:json.dumps({"model":os.environ.get("GROQ_MODEL_NAME","llama3-70b-8192"),"max_tokens":8192,"messages":[{"role":"user","content":p}]}).encode(),"extract":lambda r:r["choices"][0]["message"]["content"]})
          if os.environ.get("GEMINI_API_KEY",""): providers.append({"name":"Gemini","url":f"https://generativelanguage.googleapis.com/v1beta/models/{os.environ.get('GEMINI_MODEL_NAME','gemini-2.5-flash')}:generateContent?key={os.environ['GEMINI_API_KEY']}","headers":{"content-type":"application/json"},"body_tpl":lambda p:json.dumps({"contents":[{"parts":[{"text":p}]}],"generationConfig":{"maxOutputTokens":8192}}).encode(),"extract":lambda r:r["candidates"][0]["content"]["parts"][0]["text"]})
          if os.environ.get("OPENAI_API_KEY",""): providers.append({"name":"OpenAI","url":"https://api.openai.com/v1/chat/completions","headers":{"Authorization":f"Bearer {os.environ['OPENAI_API_KEY']}","content-type":"application/json"},"body_tpl":lambda p:json.dumps({"model":os.environ.get("OPENAI_MODEL_NAME","gpt-5.5"),"max_tokens":8192,"messages":[{"role":"user","content":p}]}).encode(),"extract":lambda r:r["choices"][0]["message"]["content"]})
          def rf(path,cap=3000):
              try:
                  with open(os.path.join(rd,path)) as f: return f.read()[:cap]
              except: return "N/A"
          inj=rf("ai_agent/injection_findings.json",3000); xxe=rf("ai_agent/xxe_findings.txt"); gql=rf("ai_agent/graphql_findings.txt"); idor=rf("ai_agent/idor_findings.txt"); chain=rf("ai_agent/chained_analysis.json",2000); nuc=rf("nuclei/findings.jsonl",2000); cors=rf("cors/vulnerable.txt"); sens=rf("files/sensitive.txt"); tako=rf("nuclei/takeover.jsonl",1000)
          core=[inj,xxe,gql,idor,nuc,cors,sens]
          has=any(v.strip() not in ("N/A","","No XXE findings","No GraphQL findings","No IDOR findings") for v in core)
