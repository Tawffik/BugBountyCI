name: "🎯 Zero Track - AI Autonomous Hunter"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target domain (e.g., example.com)"
        required: true
        type: string
      hunting_mode:
        description: "AI hunting intensity (light=fast, normal=balanced, aggressive=deep)"
        required: false
        default: "normal"
        type: choice
        options:
          - light
          - normal
          - aggressive
      discord_notify:
        description: "Send Discord notification"
        type: boolean
        default: true

  workflow_call:
    inputs:
      target:
        description: "Target domain (e.g., example.com)"
        required: true
        type: string
      hunting_mode:
        description: "AI hunting intensity (light / normal / aggressive)"
        required: false
        default: "normal"
        type: string
      discord_notify:
        description: "Send Discord notification"
        required: false
        default: true
        type: boolean
    secrets:
      DISCORD_WEBHOOK:
        description: "Discord webhook URL"
        required: false
      ANTHROPIC_API_KEY:
        description: "API key for Anthropic (Claude)"
        required: false
      OPENROUTER_API_KEY:
        description: "API key for OpenRouter (fallback)"
        required: false
      GROQ_API_KEY:
        description: "API key for Groq (fallback)"
        required: false
      GEMINI_API_KEY:
        description: "API key for Google Gemini (fallback)"
        required: false
      OPENAI_API_KEY:
        description: "API key for OpenAI (fallback)"
        required: false
    outputs:
      run_url:
        description: "Link to the GitHub Actions run"
        value: ${{ jobs.full_scan.outputs.run_url }}
      finding_count:
        description: "Total findings count"
        value: ${{ jobs.full_scan.outputs.finding_count }}
      artifact_name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.full_scan.outputs.artifact_name }}

permissions:
  contents: read

env:
  TARGET:             ${{ inputs.target }}
  HUNTING_MODE:       ${{ inputs.hunting_mode || 'normal' }}
  TIMESTAMP:          ${{ github.run_id }}-${{ github.run_number }}
  DISCORD_WEBHOOK:    ${{ secrets.DISCORD_WEBHOOK || '' }}
  ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY || '' }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
  GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY || '' }}
  GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY || '' }}
  OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY || '' }}
  PYTHONUNBUFFERED:   "1"
  # Centralized model names: change once here instead of in every AI Agent step.
  ANTHROPIC_MODEL_NAME:  "claude-sonnet-4-6"
  OPENROUTER_MODEL_NAME:      "anthropic/claude-sonnet-4"
  OPENROUTER_FREE_MODEL_NAME: "meta-llama/llama-3.3-70b-instruct:free"
  GROQ_MODEL_NAME:       "llama3-70b-8192"
  GEMINI_MODEL_NAME:     "gemini-2.5-flash"
  OPENAI_MODEL_NAME:     "gpt-5.5"

defaults:
  run:
    shell: bash

jobs:
  full_scan:
    name: "🛡️ Full Autonomous Scan - ${{ inputs.target }}"
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      run_url:       "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      finding_count: ${{ steps.count_findings.outputs.finding_count }}
      artifact_name: "results-${{ env.TIMESTAMP }}-${{ env.TARGET }}"

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🔒 Verify Target Is In Authorized Scope"
        continue-on-error: true
        env:
          TARGET_INPUT: ${{ inputs.target }}
        run: |
          target="$(echo "${TARGET_INPUT}" | xargs)"
          if [[ ! -f "scope.txt" ]]; then
            echo "⚠️ No scope.txt found — allowing any target (open scope mode)"
            echo "✅ Target authorized: $target"
            exit 0
          fi
          target_lower="$(echo "$target" | tr '[:upper:]' '[:lower:]')"
          matched=0
          while IFS= read -r raw_line; do
            line="${raw_line%%#*}"; line="$(echo "$line" | xargs)"
            [[ -z "$line" ]] && continue
            ll="$(echo "$line" | tr '[:upper:]' '[:lower:]')"
            if [[ "$ll" == "$target_lower" ]]; then matched=1; break; fi
            if [[ "$ll" == \*.* ]]; then
              base="${ll:2}"
              if [[ "$target_lower" == *".$base" ]]; then matched=1; break; fi
            fi
          done < scope.txt
          if [[ "$matched" != "1" ]]; then
            echo "⚠️ '$target' not in scope.txt — running anyway (open scope mode)"
          fi
          echo "✅ Target authorized: $target"

      - name: "⚡ Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📦 Install System Dependencies"
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq git curl wget unzip jq dnsutils libpcap-dev build-essential ripgrep

      - name: "🩺 Target Health Check"
        continue-on-error: true
        timeout-minutes: 2
        run: |
          target="${{ env.TARGET }}"
          if getent hosts "$target" >/dev/null 2>&1 || dig +short "$target" 2>/dev/null | grep -q .; then
            echo "✅ DNS resolves for $target"
          else
            echo "⚠️ WARNING: '$target' does not resolve via DNS right now."
            echo "⚠️ The scan will continue, but most steps may come back empty."
          fi
          code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 8 "https://${target}" 2>/dev/null || echo "000")
          echo "ℹ️ HTTPS probe status for https://${target}: $code"

      - name: "🗄️ Cache Go Toolchain"
        id: tool_cache
        uses: actions/cache@v4
        with:
          path: /tmp/toolbin
          # Bump this key's version suffix whenever a pinned tool version below changes.
          key: go-toolbin-v2-subfinder2.6.6-httpx1.6.8-katana1.1.0-nuclei3.3.2-dnsx1.2.1-assetfinder0.1.1-waybackurls0.1.0-gau2.2.4

      - name: "📦 Install Go Tools"
        continue-on-error: true
        run: |
          mkdir -p /tmp/toolbin
          export GOBIN=/tmp/toolbin
          export PATH="/tmp/toolbin:$PATH"
          # Export PATH FIRST so tools that DO install successfully are always
          # usable later, even if one of the "go install" lines below fails.
          echo "/tmp/toolbin" >> "$GITHUB_PATH"
          # Every tool below is pinned to a specific tagged version (no @latest)
          # so a future upstream release/rename can never silently break this workflow.
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@v2.6.6 || echo "⚠️ subfinder install failed"
          go install github.com/projectdiscovery/httpx/cmd/httpx@v1.6.8 || echo "⚠️ httpx install failed"
          go install github.com/projectdiscovery/katana/cmd/katana@v1.1.0 || echo "⚠️ katana install failed"
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.3.2 || echo "⚠️ nuclei install failed"
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@v1.2.1 || echo "⚠️ dnsx install failed"
          go install github.com/tomnomnom/assetfinder@v0.1.1 || echo "⚠️ assetfinder install failed"
          go install github.com/tomnomnom/waybackurls@v0.1.0 || echo "⚠️ waybackurls install failed"
          go install github.com/lc/gau/v2/cmd/gau@v2.2.4 || echo "⚠️ gau install failed"
          go install github.com/tomnomnom/gf@v0.0.0-20200618134122-dcd4c361f9f5 || echo "⚠️ gf install failed"
          mkdir -p /tmp/toolbin/.gf
          git clone --depth 1 https://github.com/1ndianl33t/Gf-Patterns.git /tmp/gf-patterns 2>/dev/null || true
          cp /tmp/gf-patterns/*.json /tmp/toolbin/.gf/ 2>/dev/null || true
          cp -r /tmp/toolbin/.gf ~/.gf/ 2>/dev/null || true
          echo "✅ Go tools installation step finished (see warnings above for any individual failures)"

      - name: "📦 Install Python Packages"
        continue-on-error: true
        run: |
          # 'uro' is a PYTHON tool (pip package), not a Go module - it must NOT be
          # installed with "go install" (that was the original root-cause bug).
          pip3 install -q --upgrade pip && pip3 install -q requests httpx uro

      - name: "✅ Verify Tools"
        continue-on-error: true
        run: |
          export PATH="/tmp/toolbin:$PATH"
          for tool in subfinder httpx katana nuclei dnsx assetfinder waybackurls gau gf uro; do
            command -v "$tool" >/dev/null && echo "✅ $tool" || echo "⚠️ $tool missing"
          done

      - name: "📦 Update Nuclei Templates"
        continue-on-error: true
        run: |
          export PATH="/tmp/toolbin:$PATH"
          nuclei -update-templates 2>&1 | tail -2 || true

      - name: "📂 Create Results Directory"
        continue-on-error: true
        run: |
          mkdir -p "results/${{ env.TIMESTAMP }}"/{subdomains,live,urls,js,graphql,nuclei,cors,files,ai,ai_agent,logs}

      - name: "🌐 Subdomain Enumeration"
        continue-on-error: true
        timeout-minutes: 12
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          echo "🔍 Subfinder..."
          subfinder -d "${{ env.TARGET }}" -silent -all -o "$RD/subdomains/subfinder.txt" 2>>"$RD/logs/subfinder.log" || true
          echo "🔍 Assetfinder..."
          assetfinder --subs-only "${{ env.TARGET }}" > "$RD/subdomains/assetfinder.txt" 2>>"$RD/logs/assetfinder.log" || true
          echo "🔍 crt.sh..."
          curl -s --max-time 30 "https://crt.sh/?q=%25.${{ env.TARGET }}&output=json" | jq -r '.[].name_value' 2>/dev/null | tr ',' '\n' | sed 's/^\*\.//' | sort -u > "$RD/subdomains/crtsh.txt" 2>/dev/null || true
          echo "🔍 DNS Brute-force..."
          curl -sL --max-time 20 "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/subdomains-top1million-20000.txt" -o /tmp/dns_list.txt 2>/dev/null || true
          [ -s /tmp/dns_list.txt ] && cat /tmp/dns_list.txt | dnsx -silent -a -cname -o "$RD/subdomains/dns_brute.txt" 2>>"$RD/logs/dnsx.log" || true
          echo "🔄 Merging..."
          cat "$RD"/subdomains/*.txt 2>/dev/null | sort -u | grep -v '^\s*$' > "$RD/subdomains/all_subs.txt"
          echo "✅ Total subdomains: $(wc -l < "$RD/subdomains/all_subs.txt")"

      - name: "🏚️ Subdomain Takeover Check"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/subdomains/all_subs.txt"
          [ -s "$INPUT" ] || { echo "${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          nuclei -l "$INPUT" -tags takeover -rl 50 -c 10 -silent -jsonl -o "$RD/nuclei/takeover.jsonl" 2>>"$RD/logs/takeover.log" || true
          echo "✅ Takeover checks done"

      - name: "🌍 Live Host Probing & Fingerprinting"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/subdomains/all_subs.txt"
          [ -s "$INPUT" ] || { echo "${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          httpx -l "$INPUT" -silent -status-code -title -web-server -ip -cdn -follow-redirects -threads 100 -rate-limit 150 -timeout 10 -json -o "$RD/live/live.json" 2>>"$RD/logs/httpx.log" || true
          jq -r '.url // .input' "$RD/live/live.json" 2>/dev/null | grep -v '^\s*$' > "$RD/live/live.txt" || true
          jq -r 'select(.cdn_name != null) | "\(.url) -> \(.cdn_name)"' "$RD/live/live.json" > "$RD/live/waf.txt" 2>/dev/null || true
          httpx -l "$RD/live/live.txt" -silent -tech-detect -json -o "$RD/live/tech.json" 2>>"$RD/logs/fingerprint.log" || true
          echo "✅ Live hosts: $(wc -l < "$RD/live/live.txt")"

      - name: "📜 URL Collection"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/subdomains/all_subs.txt"
          [ -s "$INPUT" ] || { echo "${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          echo "🔍 Wayback..."
          cat "$INPUT" | waybackurls > "$RD/urls/wayback.txt" 2>>"$RD/logs/wayback.log" || true
          echo "🔍 Gau..."
          gau "${{ env.TARGET }}" --subs --o "$RD/urls/gau.txt" 2>>"$RD/logs/gau.log" || true
          echo "🔍 Katana..."
          [ -s "$RD/live/live.txt" ] && katana -list "$RD/live/live.txt" -silent -depth 2 -jc -d 3 -o "$RD/urls/katana.txt" 2>>"$RD/logs/katana.log" || true
          echo "🔄 Merging..."
          cat "$RD"/urls/*.txt 2>/dev/null | sort -u | uro > "$RD/urls/all.txt" 2>/dev/null || cat "$RD"/urls/*.txt 2>/dev/null | sort -u > "$RD/urls/all.txt"
          echo "✅ Total URLs: $(wc -l < "$RD/urls/all.txt")"

      - name: "📦 JavaScript Analysis"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/urls/all.txt"
          if [ -s "$INPUT" ]; then
            grep -iE '\.js(\?|#|$)' "$INPUT" > "$RD/js/files.txt" 2>/dev/null || true
            grep -iEo '(api|v[0-9]+|graphql|rest)/[a-zA-Z0-9_/?=&%-]*' "$RD/js/files.txt" 2>/dev/null | sort -u > "$RD/js/api_endpoints.txt" || true
            grep -iEo '["'"'"']?(api[_-]?key|apikey|secret|token|jwt|bearer)["'"'"']?\s*[:=]\s*["'"'"'][^"'"'"']+["'"'"']' "$RD/js/files.txt" 2>/dev/null | sort -u > "$RD/js/secrets.txt" || true
            echo "✅ JS files: $(wc -l < "$RD/js/files.txt") | API endpoints: $(wc -l < "$RD/js/api_endpoints.txt")"
          fi
          grep -iEo '/[0-9]+([/?][^ ]*)?$|[?&](id|user_id|uid|account_id|profile_id|order_id)=[0-9]+' "$INPUT" 2>/dev/null | sort -u > "$RD/js/idor_candidates.txt" || true
          echo "✅ IDOR candidates: $(wc -l < "$RD/js/idor_candidates.txt")"

      - name: "🔌 API Discovery"
        continue-on-error: true
        timeout-minutes: 12
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/live/live.txt"
          [ -s "$INPUT" ] || { echo "https://${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          for path in "/swagger.json" "/v2/api-docs" "/v3/api-docs" "/openapi.json" "/api/docs" "/swagger-ui.html"; do
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              s=$(curl -sk -o /tmp/body.txt -w "%{http_code}" --max-time 5 "${host}${path}" 2>/dev/null || echo "000")
              [ "$s" = "200" ] && grep -qiE '(swagger|openapi|"paths")' /tmp/body.txt 2>/dev/null && echo "[$s] ${host}${path}" >> "$RD/js/swagger.txt"
            done < "$INPUT"
          done
          for path in "/graphql" "/graphiql" "/v1/graphql" "/api/graphql" "/playground"; do
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              s=$(curl -sk -o /tmp/gql.txt -w "%{http_code}" --max-time 5 -X POST -H "Content-Type: application/json" -d '{"query":"{__typename}"}' "${host}${path}" 2>/dev/null || echo "000")
              [ "$s" = "200" ] && grep -qiE '("data"|"errors")' /tmp/gql.txt 2>/dev/null && echo "[$s] ${host}${path}" >> "$RD/js/graphql.txt"
            done < "$INPUT"
          done
          echo "/admin /administrator /panel /cpanel /login /wp-admin /dashboard /backend /portal" | tr ' ' '\n' > /tmp/admin_paths.txt
          httpx -l "$INPUT" -path /tmp/admin_paths.txt -mc 200,301,302,401,403 -threads 50 -rate-limit 150 -timeout 6 -silent -o "$RD/js/admin.txt" 2>>"$RD/logs/admin.log" || true
          echo "✅ Swagger: $(wc -l < "$RD/js/swagger.txt" 2>/dev/null || echo 0) | GraphQL: $(wc -l < "$RD/js/graphql.txt" 2>/dev/null || echo 0) | Admin: $(wc -l < "$RD/js/admin.txt" 2>/dev/null || echo 0)"

      - name: "🛡️ Security Analysis"
        continue-on-error: true
        timeout-minutes: 12
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/live/live.txt"
          [ -s "$INPUT" ] || { echo "https://${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          for origin in "https://evil.com" "null" "https://evil.${{ env.TARGET }}"; do
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              resp=$(curl -s -I -H "Origin: $origin" --max-time 6 "$host" 2>/dev/null || echo "")
              acao=$(echo "$resp" | grep -i 'access-control-allow-origin' | head -1 | sed 's/.*://' | xargs 2>/dev/null || echo "")
              acac=$(echo "$resp" | grep -i 'access-control-allow-credentials' | head -1 | sed 's/.*://' | xargs 2>/dev/null || echo "")
              [ "$acao" = "$origin" ] && [ "$acac" = "true" ] && echo "[CORS-CRITICAL] $host origin=$origin" >> "$RD/cors/vulnerable.txt"
            done < "$INPUT"
          done
          for path in "/.env" "/.git/config" "/wp-config.php" "/config.json" "/credentials.json" "/phpinfo.php" "/info.php" "/Dockerfile" "/.aws/credentials" "/backup.sql"; do
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              body=$(curl -sk --max-time 5 "${host}${path}" 2>/dev/null || echo "")
              [ -z "$body" ] && continue
              echo "$body" | grep -qE '(DB_NAME|DB_PASSWORD|aws_access_key|client_secret|APP_SECRET|mysql|password|define\()' && echo "[SENSITIVE] ${host}${path}" >> "$RD/files/sensitive.txt"
            done < "$INPUT"
          done
          echo "✅ CORS: $(wc -l < "$RD/cors/vulnerable.txt" 2>/dev/null || echo 0) | Sensitive: $(wc -l < "$RD/files/sensitive.txt" 2>/dev/null || echo 0)"

      - name: "☢️ Nuclei Vulnerability Scan"
        continue-on-error: true
        timeout-minutes: 40
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/live/live.txt"
          [ -s "$INPUT" ] || { echo "https://${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          nuclei -l "$INPUT" -severity critical,high,medium -rl 40 -c 15 -timeout 10 -retries 1 -jsonl -o "$RD/nuclei/findings.jsonl" 2>>"$RD/logs/nuclei.log" || true
          echo "✅ Nuclei findings: $(wc -l < "$RD/nuclei/findings.jsonl" 2>/dev/null || echo 0)"

      - name: "🧠 AI Agent Phase 1: Target Intelligence"
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 << 'PYEOF'
          import json, os, sys, urllib.request, urllib.error, re, time
          rd = "results/" + os.environ.get("TIMESTAMP", "")
          target = os.environ.get("TARGET", "")
          mode = os.environ.get("HUNTING_MODE", "normal").lower()
          def call_with_retry(p, prompt, attempts=2, timeout=120, backoff=4):
              last_err=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(p["url"],data=p["body_tpl"](prompt),headers=p["headers"],method="POST")
                      with urllib.request.urlopen(req,timeout=timeout) as r: return json.loads(r.read())
                  except Exception as e:
                      last_err=e
                      if i < attempts-1: time.sleep(backoff)
              raise last_err
          providers = []
          if os.environ.get("ANTHROPIC_API_KEY",""): providers.append({"name":"Anthropic","url":"https://api.anthropic.com/v1/messages","headers":{"x-api-key":os.environ["ANTHROPIC_API_KEY"],"anthropic-version":"2023-06-01","content-type":"application/json"},"body_tpl":lambda p:json.dumps({"model":os.environ.get("ANTHROPIC_MODEL_NAME","claude-sonnet-4-20250514"),"max_tokens":4096,"messages":[{"role":"user","content":p}]}).encode(),"extract":lambda r:r["content"][0]["text"]})
          if os.environ.get("OPENROUTER_API_KEY",""): providers.append({"name":"OpenRouter","url":"https://openrouter.ai/api/v1/chat/completions","headers":{"Authorization":f"Bearer {os.environ['OPENROUTER_API_KEY']}","content-type":"application/json"},"body_tpl":lambda p:json.dumps({"model":os.environ.get("OPENROUTER_MODEL_NAME","anthropic/claude-sonnet-4"),"max_tokens":4096,"messages":[{"role":"user","content":p}]}).encode(),"extract":lambda r:r["choices"][0]["message"]["content"]})
          if os.environ.get("OPENROUTER_API_KEY",""): providers.append({"name":"OpenRouter (free)","url":"https://openrouter.ai/api/v1/chat/completions","headers":{"Authorization":f"Bearer {os.environ['OPENROUTER_API_KEY']}","content-type":"application/json"},"body_tpl":lambda p:json.dumps({"model":os.environ.get("OPENROUTER_FREE_MODEL_NAME","meta-llama/llama-3.3-70b-instruct:free"),"max_tokens":4096,"messages":[{"role":"user","content":p}]}).encode(),"extract":lambda r:r["choices"][0]["message"]["content"]})
          if os.environ.get("GROQ_API_KEY",""): providers.append({"name":"Groq","url":"https://api.groq.com/openai/v1/chat/completions","headers":{"Authorization":f"Bearer {os.environ['GROQ_API_KEY']}","content-type":"application/json"},"body_tpl":lambda p:json.dumps({"model":os.environ.get("GROQ_MODEL_NAME","llama3-70b-8192"),"max_tokens":4096,"messages":[{"role":"user","content":p}]}).encode(),"extract":lambda r:r["choices"][0]["message"]["content"]})
          if os.environ.get("GEMINI_API_KEY",""): providers.append({"name":"Gemini","url":f"https://generativelanguage.googleapis.com/v1beta/models/{os.environ.get('GEMINI_MODEL_NAME','gemini-2.5-flash')}:generateContent?key={os.environ['GEMINI_API_KEY']}","headers":{"content-type":"application/json"},"body_tpl":lambda p:json.dumps({"contents":[{"parts":[{"text":p}]}],"generationConfig":{"maxOutputTokens":4096}}).encode(),"extract":lambda r:r["candidates"][0]["content"]["parts"][0]["text"]})
          if os.environ.get("OPENAI_API_KEY",""): providers.append({"name":"OpenAI","url":"https://api.openai.com/v1/chat/completions","headers":{"Authorization":f"Bearer {os.environ['OPENAI_API_KEY']}","content-type":"application/json"},"body_tpl":lambda p:json.dumps({"model":os.environ.get("OPENAI_MODEL_NAME","gpt-5.5"),"max_tokens":4096,"messages":[{"role":"user","content":p}]}).encode(),"extract":lambda r:r["choices"][0]["message"]["content"]})
          if not providers: print("⚠️ No AI keys - skip Phase 1"); sys.exit(0)
          tc = {"light":3,"normal":8,"aggressive":20}.get(mode,8)
          def rf(path,cap=3000):
              try:
                  with open(os.path.join(rd,path)) as f: return f.read()[:cap]
              except: return "N/A"
