      - name: "🧬 AI Agent Phase 6: Chain Analysis"
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 << 'PYEOF'
          import json, os, sys, urllib.request, urllib.error, re, time
          rd="results/"+os.environ.get("TIMESTAMP",""); target=os.environ.get("TARGET","")
          def call_with_retry(p, prompt, attempts=2, timeout=120, backoff=4):
              # Capture the ACTUAL response body on failure, not just the generic
              # "HTTP Error 400: Bad Request" - the body almost always contains the
              # real reason (invalid model, low credit balance, bad API key, etc.)
              # and without it we're debugging blind.
              last_err=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(p["url"],data=p["body_tpl"](prompt),headers=p["headers"],method="POST")
                      with urllib.request.urlopen(req,timeout=timeout) as r: return json.loads(r.read())
                  except urllib.error.HTTPError as e:
                      try: body_preview=e.read(400).decode(errors="ignore")
                      except Exception: body_preview=""
                      last_err=Exception(f"HTTP {e.code} -> {body_preview}")
                      if i < attempts-1:
                          # Respect Retry-After on 429s instead of always using the
                          # same short backoff - rate limits often need real time to clear.
                          wait=backoff
                          if e.code==429:
                              try: wait=min(int(e.headers.get("Retry-After",backoff)),30)
                              except Exception: wait=backoff
                          time.sleep(wait)
                  except Exception as e:
                      last_err=e
                      if i < attempts-1: time.sleep(backoff)
              raise last_err
