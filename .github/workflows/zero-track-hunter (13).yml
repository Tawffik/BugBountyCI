                  return f"[XXE] {u} | /etc/passwd leaked (confirmed structure)"
              # Also fire a BLIND/OOB variant: the in-band check above only catches
              # XXE where file content gets reflected back in the response - most
              # real-world cases don't reflect anything at all (the entity is
              # resolved server-side, nothing comes back), so that check alone
              # would silently miss them. This relies on a genuine outbound
