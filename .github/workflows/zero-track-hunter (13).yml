      - name: "🔢 Count Total Findings"
        id: count_findings
        if: always()
        continue-on-error: true
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          # NOTE: "grep -c PATTERN file || echo 0" is broken when there are zero matches:
          # grep -c still prints "0" to stdout but exits with status 1 (its "no match"
          # convention), so the "|| echo 0" ALSO fires, producing two lines ("0\n0") and
          # breaking the arithmetic below. Using "|| true" (prints nothing) plus a
          # ${VAR:-0} default (only used when the file is genuinely missing) avoids this.
          INJECT=$(grep -cE '\[(XSS|SSTI|SQLi|LFI|SSRF|Command|Redirect)\]' "$RD/ai_agent/injection_findings.txt" 2>/dev/null || true); INJECT=${INJECT:-0}
          XXE=$(grep -c '\[XXE\]' "$RD/ai_agent/xxe_findings.txt" 2>/dev/null || true); XXE=${XXE:-0}
          GQL=$(grep -c '\[GRAPHQL' "$RD/ai_agent/graphql_findings.txt" 2>/dev/null || true); GQL=${GQL:-0}
          IDOR=$(grep -c '\[IDOR\]' "$RD/ai_agent/idor_findings.txt" 2>/dev/null || true); IDOR=${IDOR:-0}
          NUCLEI=$(wc -l < "$RD/nuclei/findings.jsonl" 2>/dev/null || true); NUCLEI=${NUCLEI:-0}
          SENS=$(wc -l < "$RD/files/sensitive.txt" 2>/dev/null || true); SENS=${SENS:-0}
          CORS=$(wc -l < "$RD/cors/vulnerable.txt" 2>/dev/null || true); CORS=${CORS:-0}
          TOTAL=$(( INJECT + XXE + GQL + IDOR + NUCLEI + SENS + CORS ))
          GH=$(wc -l < "$RD/js/github_recon.txt" 2>/dev/null || true); GH=${GH:-0}
          VH=$(wc -l < "$RD/live/vhosts.txt" 2>/dev/null || true); VH=${VH:-0}
          BUCKETS=$(wc -l < "$RD/live/cloud_buckets.txt" 2>/dev/null || true); BUCKETS=${BUCKETS:-0}
          FUZZ=$(wc -l < "$RD/fuzzing/discovered.txt" 2>/dev/null || true); FUZZ=${FUZZ:-0}
          CLOUD=$(( $(wc -l < "$RD/cloud/cloudfail.txt" 2>/dev/null || echo 0) + $(wc -l < "$RD/cloud/cloakquest.txt" 2>/dev/null || echo 0) ))
          LEADS=$(( GH + VH + BUCKETS + FUZZ + CLOUD ))
          echo "finding_count=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "🔢 Total confirmed findings: $TOTAL"
          echo "🔎 Additional recon leads for manual review (not confirmed vulns): $LEADS (GitHub:$GH, VHosts:$VH, Buckets:$BUCKETS, Fuzzing:$FUZZ, CloudOrigin:$CLOUD)"

      - name: "🆚 Diff Against Previous Scan"
        continue-on-error: true
        timeout-minutes: 3
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          mkdir -p "$RD/diff" .previous_snapshot
          diff_section() {
            label="$1"; old="$2"; new="$3"
            touch "$old" "$new"
            new_items=$(comm -13 <(sort -u "$old") <(sort -u "$new") 2>/dev/null)
            gone_items=$(comm -23 <(sort -u "$old") <(sort -u "$new") 2>/dev/null)
            new_count=$(echo -n "$new_items" | grep -c . || true); new_count=${new_count:-0}
            gone_count=$(echo -n "$gone_items" | grep -c . || true); gone_count=${gone_count:-0}
            {
              echo "## $label"
              if [ -s ".previous_snapshot/${label}.txt" ] || [ -s "$old" ]; then
                echo "🆕 New since last scan ($new_count):"
                [ -n "$new_items" ] && echo "$new_items" | sed 's/^/- /' || echo "- (none)"
                echo ""
                echo "🗑️ Gone since last scan ($gone_count):"
                [ -n "$gone_items" ] && echo "$gone_items" | sed 's/^/- /' || echo "- (none)"
              else
                echo "_No previous snapshot for this target yet - this is the baseline run._"
              fi
              echo ""
            } >> "$RD/diff/diff.md"
          }
          echo "# 🆚 Diff vs Previous Scan of ${{ env.TARGET }}" > "$RD/diff/diff.md"
          echo "" >> "$RD/diff/diff.md"
          diff_section "Subdomains" ".previous_snapshot/subdomains.txt" "$RD/subdomains/all_subs.txt"
          diff_section "Live_Hosts" ".previous_snapshot/live.txt" "$RD/live/live.txt"
          diff_section "URLs" ".previous_snapshot/urls.txt" "$RD/urls/all.txt"
          echo "✅ Diff report written to diff/diff.md"

          # Snapshot the counts BEFORE the next step overwrites .previous_snapshot/
          # with this run's own data - this is what lets Pipeline Health Report
          # (which runs after that overwrite) still compare against what came
          # before, so a silent collapse gets flagged automatically the run it
          # happens, instead of only being noticed months later by manually
          # diffing zip files by hand.
          mkdir -p "$RD/meta"
          python3 - << 'PYEOF'
          import json, os
          def cnt(path):
              try:
                  with open(path) as f: return sum(1 for l in f if l.strip())
              except Exception: return None  # None = "no previous run", not "was zero"
          prev = {
              "subdomains": cnt(".previous_snapshot/subdomains.txt"),
              "live_hosts": cnt(".previous_snapshot/live.txt"),
              "urls": cnt(".previous_snapshot/urls.txt"),
              "asn_ips": cnt(".previous_snapshot/asn_ips.txt"),
          }
          rd = "results/" + os.environ.get("TIMESTAMP", "")
          with open(os.path.join(rd, "meta", "previous_run_counts.json"), "w") as f:
              json.dump(prev, f)
          PYEOF

      - name: "💾 Save Current Scan Snapshot"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          mkdir -p .previous_snapshot
          cp "$RD/subdomains/all_subs.txt" .previous_snapshot/subdomains.txt 2>/dev/null || touch .previous_snapshot/subdomains.txt
          cp "$RD/live/live.txt" .previous_snapshot/live.txt 2>/dev/null || touch .previous_snapshot/live.txt
          cp "$RD/urls/all.txt" .previous_snapshot/urls.txt 2>/dev/null || touch .previous_snapshot/urls.txt
          cp "$RD/subdomains/asn_ips.txt" .previous_snapshot/asn_ips.txt 2>/dev/null || touch .previous_snapshot/asn_ips.txt
          # Cache entries are immutable once saved, so this run's snapshot needs the old
          # one deleted first, otherwise the save below would just be silently skipped
          # and future diffs would keep comparing against a stale, outdated baseline.
          gh cache delete "snapshot-${{ env.TARGET }}" 2>/dev/null || true

      - name: "💾 Save Snapshot Cache"
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .previous_snapshot
          key: snapshot-${{ env.TARGET }}

      - name: "🏥 Pipeline Health Report"
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          python3 << 'PYEOF'
          import json, os, re

          rd = "results/" + os.environ.get("TIMESTAMP", "")

          def count(path):
              try:
                  with open(os.path.join(rd, path)) as f:
                      return sum(1 for l in f if l.strip())
              except Exception:
                  return 0

          def text(path):
              try:
                  with open(os.path.join(rd, path)) as f:
                      return f.read()
              except Exception:
                  return ""

          def nuclei_error_rate():
              last = None
              try:
                  with open(os.path.join(rd, "logs", "nuclei.log")) as f:
                      for line in f:
                          line = line.strip()
                          if line.startswith("{") and '"requests"' in line:
                              try: last = json.loads(line)
                              except Exception: pass
              except Exception:
                  pass
              if not last:
                  return None
              req = int(last.get("requests", 0) or 0)
              err = int(last.get("errors", 0) or 0)
              if req == 0:
                  return None
              return round(100 * err / req, 1)

          counts = {
              "resolved": count("subdomains/resolved.txt"),
              "permutations": count("subdomains/permutations_resolved.txt"),
              "all_subs": count("subdomains/all_subs.txt"),
              "live": count("live/live.txt"),
              "urls": count("urls/all.txt"),
              "js_files": count("js/files.txt"),
              "js_discovered": count("js/files_discovered.txt"),
              "nuclei_findings": count("nuclei/findings.jsonl"),
          }
          try:
              with open("/tmp/raw_subs.txt") as f:
                  counts["raw_candidates"] = sum(1 for l in f if l.strip())
          except Exception:
              counts["raw_candidates"] = 0

          counts["asn_ips"] = count("subdomains/asn_ips.txt")

          rows = []
          flags = []

          def row(label, val, prior=None):
              status = "✅"
              if prior is not None and prior > 0 and val == 0:
                  status = "🔴"
              rows.append((status, label, val))
              return status

          row("Raw candidate names (subfinder+assetfinder+crt.sh+brute)", counts["raw_candidates"])
          s2 = row("DNS-confirmed subdomains", counts["resolved"], prior=counts["raw_candidates"])
          row("Permutation-discovered subdomains", counts["permutations"])
          row("Total confirmed subdomains", counts["all_subs"], prior=counts["raw_candidates"])
          s5 = row("Live hosts (httpx)", counts["live"], prior=counts["all_subs"])
          s6 = row("Collected URLs", counts["urls"], prior=counts["live"])
          row("JS files analyzed (round 1, crawled)", counts["js_files"])
          row("JS files found via recursive discovery (round 2)", counts["js_discovered"])
          row("Nuclei findings", counts["nuclei_findings"])
          asn_source = text("meta/asn_source.txt").strip() or "none"
          row(f"ASN/CIDR-derived candidates (source: {asn_source})", counts["asn_ips"])

          asn_skip = text("meta/asn_skipped_reason.txt").strip()
          if asn_skip:
              flags.append(f"ℹ️ **ASN/CIDR discovery degraded**: {asn_skip}")

          if s2 == "🔴":
              flags.append("🔴 **DNS resolution collapse**: candidates existed but none resolved. Historically caused by a dnsx `-l <file>` hang (fixed by switching to stdin piping) - if this fires again, check `logs/dnsx.log` for a NEW cause, don't assume it's the same one.")
          if s5 == "🔴":
              flags.append("🔴 **0 live hosts despite confirmed subdomains**: almost certainly the target/WAF blocking this runner's IP, not a real 'no live hosts' result. See `meta/scan_health_warning.txt`.")
          if s6 == "🔴":
              flags.append("🔴 **0 URLs despite live hosts**: katana/gau/wayback all produced nothing even though hosts responded - check `logs/*.log` for crawler-specific errors.")

          # --- Cloud origin tools: did they actually run, or crash/get skipped? ---
          # Historically: CloudFail silently "not installed" after an upstream rewrite
          # changed its entry point; CloakQuest3r crashed with EOFError on an
          # interactive prompt with no stdin in CI. Both failure modes look
          # identical from outside (an empty or near-empty output file) unless we
          # actually look at what's in there.
          cf = text("cloud/cloudfail.txt"); cq = text("cloud/cloakquest.txt")
          if not cf.strip():
              flags.append("⚠️ **CloudFail produced nothing** - either not installed (upstream may have changed its CLI entry point again) or genuinely found no origin IP. Check `logs/cloud.log`.")
          if not cq.strip():
              flags.append("⚠️ **CloakQuest3r produced nothing** - either not installed, or its output was filtered out entirely as banner/prompt noise (see the noise-filter in the Cloud Origin Discovery step) rather than a real finding.")

          def tail(path, n=5):
              try:
                  with open(os.path.join(rd, path)) as f:
                      return [l.strip() for l in f if l.strip()][-n:]
              except Exception:
                  return []

          # --- Which AI provider actually served this run? ---
          # Checking attack_plan.json is just a non-empty STRING isn't enough - the
          # failure fallback still writes a valid-looking but content-empty stub
          # ({"high_value_targets": [], "attack_plan": []}), which would pass a bare
          # truthiness check even though every provider actually failed. Use the
          # unambiguous marker file instead.
          ai_provider = text("meta/ai_provider_used.txt").strip()
          if ai_provider and not ai_provider.startswith("NONE"):
              flags.append(f"ℹ️ AI Agent Phase 1 produced a plan via **{ai_provider}** (paid providers failing over to a free one is normal and expected, not itself a bug).")
          else:
              errs = tail("logs/ai_providers.log", 6)
              detail = (" Errors seen: " + " | ".join(errs)) if errs else " (no ai_providers.log captured - check the raw Action log for this run.)"
              flags.append(f"🔴 **Every configured AI provider failed** (including the zero-config GitHub Models fallback) - AI-driven phases ran with no plan.{detail}")

          # --- Are the tools this pipeline depends on actually present right now? ---
          # CloudFail's silent-clone-failure history is exactly why this matters - a
          # tool can be missing with zero visible error anywhere else in the run.
          missing_tools = [t for t in ["nikto", "wpscan", "gowitness", "nuclei", "subfinder", "httpx", "dnsx", "katana"]
                            if os.system(f"command -v {t} >/dev/null 2>&1") != 0]
          if missing_tools:
              install_errs = tail("logs/tool_install.log", 8)
              detail = (" Install log tail: " + " | ".join(install_errs)) if install_errs else " (no tool_install.log captured)"
              flags.append(f"🔴 **Missing tool(s): {', '.join(missing_tools)}** - any step depending on these silently has nothing to work with.{detail}")

          err_rate = nuclei_error_rate()
          if err_rate is not None and err_rate > 40:
              flags.append(f"⚠️ **Nuclei error rate is {err_rate}%** - findings from this run are likely incomplete (requests are failing, not necessarily 'no vulnerabilities').")

          # --- Regression vs the last run against this same target ---
          # This is the single highest-leverage check here: a metric that was fine
          # last time and has now collapsed is a NEW, previously-unseen bug - worth
          # surfacing immediately rather than only being noticed whenever someone
          # next happens to manually compare two runs' artifacts by hand.
          prev_path = os.path.join(rd, "meta", "previous_run_counts.json")
          if os.path.exists(prev_path):
              try:
                  prev = json.load(open(prev_path))
              except Exception:
                  prev = {}
              regress_map = [("subdomains", counts["all_subs"], "Total confirmed subdomains"),
                             ("live_hosts", counts["live"], "Live hosts"),
                             ("urls", counts["urls"], "Collected URLs"),
                             ("asn_ips", counts["asn_ips"], "ASN/CIDR-derived candidates")]
              for key, cur_val, label in regress_map:
                  prev_val = prev.get(key)
                  if prev_val is not None and prev_val >= 3 and cur_val == 0:
                      flags.append(f"📉 **REGRESSION**: {label} was {prev_val} on the previous run against this same target and is 0 now. This is very likely a NEW bug introduced since then, not normal run-to-run variance - worth investigating before trusting this run's results.")

          verdict = "🟢 HEALTHY"
          red_count = sum(1 for f in flags if f.startswith("🔴") or f.startswith("📉"))
          warn_count = sum(1 for f in flags if f.startswith("⚠️"))
          if red_count > 0:
              verdict = "🔴 BROKEN - one or more pipeline stages produced nothing when they should have"
          elif warn_count > 0:
              verdict = "🟡 DEGRADED - see flags below, results may be incomplete"

          lines = ["# 🏥 Pipeline Health Report", "", f"## Overall: {verdict}", "",
                   "This is the funnel of what actually made it through each stage. A 🔴 means",
                   "a stage produced nothing despite the previous stage having data - that is a",
                   "pipeline/network problem, not evidence the target is clean.", "",
                   "| | Stage | Count |", "|---|---|---|"]
          for status, label, val in rows:
              lines.append(f"| {status} | {label} | {val} |")
          lines.append("")
          if flags:
              lines.append("## Flags")
              for f in flags:
                  lines.append(f"- {f}")
          else:
              lines.append("_No anomalies detected in the funnel._")

          report = "\n".join(lines)
          os.makedirs(os.path.join(rd, "meta"), exist_ok=True)
          with open(os.path.join(rd, "meta", "pipeline_health.md"), "w") as f:
              f.write(report)

          # Post directly to the GitHub Actions run summary page - visible immediately,
          # no artifact download/unzip/upload round-trip needed to see it.
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write(report + "\n")

          print(report)
          PYEOF

      - name: "📋 Triage & Prioritization"
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 << 'PYEOF'
          import json, os, glob

          rd = "results/" + os.environ.get("TIMESTAMP", "")
          SEV_RANK = {"critical": 5, "high": 4, "medium": 3, "low": 2, "info": 1, "unknown": 0}

          def rl(path):
              try:
                  with open(os.path.join(rd, path)) as f:
                      return [l.strip() for l in f if l.strip()]
              except Exception:
                  return []

          confirmed = []  # (severity_rank, severity_label, category, detail)

          # Nuclei - has real severity info in each JSONL line
          for line in rl("nuclei/findings.jsonl"):
              try:
                  j = json.loads(line)
                  sev = j.get("info", {}).get("severity", "unknown").lower()
                  name = j.get("info", {}).get("name", j.get("template-id", "unknown"))
                  host = j.get("host", j.get("matched-at", ""))
                  confirmed.append((SEV_RANK.get(sev, 0), sev, "Nuclei", f"{name} @ {host}"))
              except Exception:
                  continue

          # Our own confirmed-with-evidence categories (baseline-compared, non-guessed)
          for l in rl("ai_agent/injection_findings.txt"):
              sev = "high" if any(k in l for k in ["SQLi", "SSTI", "RCE", "Command"]) else "medium"
              confirmed.append((SEV_RANK[sev], sev, "Injection", l))
          for l in rl("ai_agent/xxe_findings.txt"):
              if l.startswith("[XXE]"): confirmed.append((SEV_RANK["high"], "high", "XXE", l))
          for l in rl("ai_agent/oob_findings.txt"):
              if l.startswith("[OOB"): confirmed.append((SEV_RANK["high"], "high", "Blind/OOB", l))
          for l in rl("nuclei/nikto_findings.txt"):
              confirmed.append((SEV_RANK["low"], "low", "Nikto", l))
          for l in rl("files/cms_findings.txt"):
              confirmed.append((SEV_RANK["medium"], "medium", "CMS", l))
          for l in rl("ai_agent/idor_findings.txt"):
              if l.startswith("[IDOR]"): confirmed.append((SEV_RANK["medium"], "medium", "IDOR", l))
          for l in rl("ai_agent/graphql_findings.txt"):
              if l.startswith("[GRAPHQL"): confirmed.append((SEV_RANK["medium"], "medium", "GraphQL", l))
          for l in rl("cors/vulnerable.txt"):
              confirmed.append((SEV_RANK["medium"], "medium", "CORS", l))
          for l in rl("files/sensitive.txt"):
              confirmed.append((SEV_RANK["high"], "high", "Sensitive File", l))
          for l in rl("nuclei/takeover.jsonl"):
              confirmed.append((SEV_RANK["high"], "high", "Subdomain Takeover", l[:200]))

          confirmed.sort(key=lambda x: -x[0])

          # Recon leads - NOT confirmed vulnerabilities, just worth a human looking at
          leads = []
          for l in rl("js/github_recon.txt"): leads.append(("GitHub Exposure", l))
          for l in rl("live/vhosts.txt"): leads.append(("Hidden VHost", l))
          for l in rl("live/cloud_buckets.txt"): leads.append(("Cloud Bucket", l))
          for l in rl("fuzzing/discovered.txt"): leads.append(("Content Discovery", l))
          for l in rl("cloud/cloudfail.txt"): leads.append(("Cloud Origin (CloudFail)", l))
          for l in rl("cloud/cloakquest.txt"): leads.append(("Cloud Origin (CloakQuest3r)", l))
          for l in rl("js/admin.txt"):
              if not l.startswith("#"): leads.append(("Admin Path Candidate", l))

          lines = [f"# 🎯 Triage & Prioritization\n"]
          lines.append(f"**{len(confirmed)} confirmed findings** (sorted by severity) · **{len(leads)} recon leads** for manual review\n")
          lines.append("---\n\n## 🔴 Confirmed Findings\n")
          if confirmed:
              for rank, sev, cat, detail in confirmed:
                  badge = {"critical":"🟣 CRITICAL","high":"🔴 HIGH","medium":"🟠 MEDIUM","low":"🟡 LOW"}.get(sev, "⚪ INFO")
                  lines.append(f"- **[{badge}]** `{cat}` — {detail[:200]}")
          else:
              lines.append("_None this run._")
          lines.append("\n---\n\n## 🟡 Recon Leads (not confirmed - verify manually)\n")
          if leads:
              for cat, detail in leads:
                  lines.append(f"- `{cat}` — {detail[:200]}")
          else:
              lines.append("_None this run._")

          os.makedirs(os.path.join(rd, "triage"), exist_ok=True)
          with open(os.path.join(rd, "triage", "triage.md"), "w") as f:
              f.write("\n".join(lines))
          print(f"✅ Triage: {len(confirmed)} confirmed (sorted), {len(leads)} recon leads -> triage/triage.md")
          PYEOF

      - name: "🔑 Manual Follow-up Commands (credential/SQLi candidates)"
        continue-on-error: true
        timeout-minutes: 3
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          mkdir -p "$RD/manual_followup"
          OUT="$RD/manual_followup/commands.md"
          {
            echo "# 🔑 Manual Follow-up Commands"
            echo ""
            echo "> ⚠️ **These commands are NOT executed by this workflow.** They are generated"
            echo "> from recon results as a starting point for a human operator to review and"
            echo "> run manually, only against targets you have explicit written authorization"
            echo "> to test, with rate limits appropriate to that authorization (e.g. a bug"
            echo "> bounty program's rules of engagement). Credential brute-forcing and"
            echo "> automated SQLi exploitation are not run unattended here on purpose - a"
            echo "> human needs to be the one deciding whether, how hard, and against what to"
            echo "> run them."
            echo ""
            echo "## Candidate login / admin panels (from recon)"
            if [ -s "$RD/js/admin.txt" ]; then
              grep -v '^#' "$RD/js/admin.txt" | while IFS= read -r line; do
                url=$(echo "$line" | awk '{print $1}')
                [ -z "$url" ] && continue
                echo ""
                echo "\`$url\`"
                echo '```'
                echo "hydra -L users.txt -P passwords.txt -f -t 4 -W 30 \\"
                echo "  $(echo "$url" | sed -E 's#^https?://##') https-post-form \\"
                echo "  \"/PATH:username=^USER^&password=^PASS^:Invalid\" # <-- edit PATH/form-fields/failure-string for this target first"
                echo '```'
              done
            else
              echo "_None found this run._"
            fi
            echo ""
            echo "## Candidate SQLi URLs (from recon tagging + confirmed Phase-2 hits)"
            found_sqli=0
            if [ -s "$RD/ai_agent/injection_findings.txt" ]; then
              while IFS= read -r line; do
                echo "$line" | grep -qi '\[SQLi\]' || continue
                url=$(echo "$line" | grep -oE 'https?://[^ ]+' | head -1)
                [ -z "$url" ] && continue
                found_sqli=1
                echo ""
                echo "\`$url\` — confirmed reflected/error-based signal during automated testing:"
                echo '```'
                echo "sqlmap -u \"$url\" --batch --level=2 --risk=1 --random-agent"
                echo '```'
              done < "$RD/ai_agent/injection_findings.txt"
            fi
            if [ -s "$RD/urls/gf_categorized.txt" ]; then
              while IFS= read -r line; do
                echo "$line" | grep -qi '\[sqli\]' || continue
                url=$(echo "$line" | grep -oE 'https?://[^ ]+' | head -1)
                [ -z "$url" ] && continue
                found_sqli=1
                echo ""
                echo "\`$url\` — parameter shape suggests it's worth testing (not confirmed):"
                echo '```'
                echo "sqlmap -u \"$url\" --batch --level=1 --risk=1 --random-agent"
                echo '```'
              done < "$RD/urls/gf_categorized.txt"
            fi
            [ "$found_sqli" = "0" ] && echo "_None found this run._"
            echo ""
            echo "## Tooling"
            echo "None of hydra / medusa / sqlmap / NoSQLMap / patator are installed by this"
            echo "workflow. If you decide to follow up manually: \`apt install hydra medusa\`,"
            echo "\`pip install sqlmap\` (or \`git clone https://github.com/sqlmapproject/sqlmap\`),"
            echo "\`pip install nosqlmap\`, or \`apt install patator\` on your own machine/authorized"
            echo "testing environment - not inside this unattended CI pipeline."
          } > "$OUT"
          echo "✅ Manual follow-up commands written to manual_followup/commands.md"

      - name: "📄 Professional Report Export"
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 << 'PYEOF'
          import os, datetime
          try:
              import markdown as md
          except ImportError:
              md = None

          rd = "results/" + os.environ.get("TIMESTAMP", "")
          target = os.environ.get("TARGET", "")

          def rf(path):
              try:
                  with open(os.path.join(rd, path)) as f: return f.read()
              except Exception: return ""

          sections = []
          health = rf("meta/pipeline_health.md")
          if health: sections.append(health)
          triage = rf("triage/triage.md")
          if triage: sections.append(triage)
          report = rf("ai/security_report.md")
          if report: sections.append(report)
          diff = rf("diff/diff.md")
          if diff: sections.append(diff)

          combined_md = "\n\n---\n\n".join(sections) if sections else "# No data collected this run."

          if md:
              body_html = md.markdown(combined_md, extensions=["tables", "fenced_code"])
          else:
              # Graceful fallback if the markdown package failed to install for any
              # reason - still ships a readable (if unstyled) report rather than nothing.
              body_html = "<pre>" + combined_md.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;") + "</pre>"

          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <title>Security Report - {target}</title>
          <style>
            body {{ font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 40px 24px; color: #1a1a2e; line-height: 1.6; background: #fafafa; }}
            h1 {{ border-bottom: 3px solid #e63946; padding-bottom: 10px; }}
            h2 {{ border-bottom: 1px solid #ddd; padding-bottom: 6px; margin-top: 36px; }}
            code {{ background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }}
            pre {{ background: #1e1e2e; color: #e0e0e0; padding: 16px; border-radius: 8px; overflow-x: auto; }}
            table {{ border-collapse: collapse; width: 100%; margin: 16px 0; }}
            th, td {{ border: 1px solid #ddd; padding: 8px 12px; text-align: left; }}
            th {{ background: #f0f0f0; }}
            .header-bar {{ background: #1a1a2e; color: white; padding: 20px 24px; border-radius: 8px; margin-bottom: 24px; }}
            .header-bar h1 {{ border: none; margin: 0; color: white; }}
            .header-bar p {{ margin: 6px 0 0; opacity: 0.8; }}
            li {{ margin: 4px 0; }}
          </style>
          </head>
          <body>
          <div class="header-bar">
            <h1>🛡️ Security Assessment Report</h1>
            <p>Target: <strong>{target}</strong> &nbsp;|&nbsp; Generated: {datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}</p>
          </div>
          {body_html}
          </body>
          </html>"""

          os.makedirs(os.path.join(rd, "report"), exist_ok=True)
          with open(os.path.join(rd, "report", "final_report.html"), "w") as f:
              f.write(html)
          print(f"✅ Professional HTML report -> report/final_report.html ({len(html)} bytes)")
          PYEOF

      - name: "📦 Upload Toolchain Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ env.TIMESTAMP }}
          path: /tmp/toolbin/
          retention-days: 7
          if-no-files-found: ignore

      - name: "📤 Upload Results Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ env.TIMESTAMP }}-${{ env.TARGET }}
          path: results/${{ env.TIMESTAMP }}/
          retention-days: 30

      - name: "📣 Discord Notification"
        if: ${{ always() && inputs.discord_notify == true && env.DISCORD_WEBHOOK != '' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          SUBS=$(wc -l < "$RD/subdomains/all_subs.txt" 2>/dev/null || true); SUBS=${SUBS:-0}
          LIVE=$(wc -l < "$RD/live/live.txt" 2>/dev/null || true); LIVE=${LIVE:-0}
          INJECT=$(grep -cE '\[(XSS|SSTI|SQLi|LFI|SSRF|Command|Redirect)\]' "$RD/ai_agent/injection_findings.txt" 2>/dev/null || true); INJECT=${INJECT:-0}
          XXE=$(grep -c '\[XXE\]' "$RD/ai_agent/xxe_findings.txt" 2>/dev/null || true); XXE=${XXE:-0}
          GQL=$(grep -c '\[GRAPHQL' "$RD/ai_agent/graphql_findings.txt" 2>/dev/null || true); GQL=${GQL:-0}
          IDOR=$(grep -c '\[IDOR\]' "$RD/ai_agent/idor_findings.txt" 2>/dev/null || true); IDOR=${IDOR:-0}
          NUCLEI=$(wc -l < "$RD/nuclei/findings.jsonl" 2>/dev/null || true); NUCLEI=${NUCLEI:-0}
          SENS=$(wc -l < "$RD/files/sensitive.txt" 2>/dev/null || true); SENS=${SENS:-0}
          CORS=$(wc -l < "$RD/cors/vulnerable.txt" 2>/dev/null || true); CORS=${CORS:-0}
          TOTAL_AGENT=$(( INJECT + XXE + GQL + IDOR ))

          COLOR=5814783; TITLE="✅ Scan Complete"
          if [ "$TOTAL_AGENT" -gt 0 ] || [ "$SENS" -gt 0 ] || [ "$CORS" -gt 0 ]; then
            COLOR=15158332; TITLE="🚨 Vulnerabilities Found"
          elif [ "$NUCLEI" -gt 5 ]; then
            COLOR=16744192; TITLE="🔶 Findings Require Review"
          fi

          jq -n \
            --arg t "${{ env.TARGET }}" \
            --arg title "$TITLE" \
            --arg subs "$SUBS" \
            --arg live "$LIVE" \
            --arg inject "$INJECT" \
            --arg xxe "$XXE" \
            --arg gql "$GQL" \
            --arg idor "$IDOR" \
            --arg nuclei "$NUCLEI" \
            --arg sens "$SENS" \
            --arg cors "$CORS" \
            --arg run "${{ github.run_number }}" \
            --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson color "$COLOR" \
          '{
            username:"🎯 BugHunter AI",
            embeds:[{
              title:($title+": "+$t), color:$color, url:$url,
              fields:[
                {name:"🌐 Recon", value:("Subs: **"+$subs+"** | Live: **"+$live+"**"), inline:false},
                {name:"🧠 AI Agent", value:("Injections: **"+$inject+"** | XXE: **"+$xxe+"** | GraphQL: **"+$gql+"** | IDOR: **"+$idor+"**"), inline:false},
                {name:"🔓 Scanner", value:("Nuclei: **"+$nuclei+"** | Secrets: **"+$sens+"** | CORS: **"+$cors+"**"), inline:false},
                {name:"🔗 Results", value:("[View Run]("+$url+")"), inline:true}
              ],
              footer:{text:("Run #"+$run+" | Mode: ${{ env.HUNTING_MODE }} | AI Autonomous Hunter")}
            }]
          }' | curl -s -X POST "${{ env.DISCORD_WEBHOOK }}" -H "Content-Type: application/json" -d @- || true
