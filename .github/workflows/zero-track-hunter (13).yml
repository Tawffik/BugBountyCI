      - name: "🩹 Nikto Scan"
        continue-on-error: true
        timeout-minutes: 18
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          : > "$RD/nuclei/nikto_findings.txt"
          if ! command -v nikto >/dev/null 2>&1; then
            echo "⚠️ nikto not installed, skipping"
          elif [ -s "$RD/live/live.txt" ]; then
            mode="${HUNTING_MODE:-normal}"
            budget=$({ [ "$mode" = "light" ] && echo 150; } || { [ "$mode" = "aggressive" ] && echo 800; } || echo 350)
            total=$(wc -l < "$RD/live/live.txt")
            per_host=90
            i=0
            SECONDS=0
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              if [ "$SECONDS" -ge "$budget" ]; then
                echo "⏱️ Time budget ($budget s) reached after $i/$total host(s) - stopping here rather than an arbitrary fixed count, whatever was left is skipped for this run"
                break
              fi
              i=$((i+1))
              # -Format json doesn't exist in this nikto build and -Format xml fails
              # with a DTD read error - -Format csv also has a real bug where a Perl
              # internal reference (SCALAR(0x...)) leaks into a field and corrupts the
              # row. Plain txt is the one format confirmed clean, parsed below with a
              # regex tested against real output rather than assumed.
              timeout "$per_host" nikto -h "$host" -Format txt -output /tmp/nikto_one.txt -ask no -nointeractive >/dev/null 2>>"$RD/logs/nikto.log" || true
              if [ -s /tmp/nikto_one.txt ]; then
                grep -E '^\+ (GET|POST|HEAD) ' /tmp/nikto_one.txt | sed "s#^#[$host] #" >> "$RD/nuclei/nikto_findings.txt" || true
              fi
              rm -f /tmp/nikto_one.txt
            done < "$RD/live/live.txt"
          fi
          echo "✅ Nikto findings: $(wc -l < "$RD/nuclei/nikto_findings.txt" 2>/dev/null || echo 0) (from $i/$total host(s) - time-budget driven, not a fixed count)"

      - name: "🔭 OOB Setup (Interactsh)"
        continue-on-error: true
        timeout-minutes: 2
        run: |
          # Out-of-band confirmation for BLIND vulnerabilities (blind SSRF, blind
          # XXE, blind command injection) - the one class of proof our payload
          # list genuinely could not provide before: those bugs cause zero visible
          # response difference, so a canned "does the response change" check can
          # never catch them. A real network callback to a unique, single-use
          # subdomain is close to zero-false-positive evidence - nothing legitimate
          # should ever be reaching out to this address, so if it does, it's proof.
          # Uses the official prebuilt interactsh-client binary (pinned release,
          # verified downloadable+runnable) rather than hand-rolling the
          # registration/crypto protocol ourselves.
          mkdir -p /tmp/oob
          curl -sL --max-time 30 -o /tmp/oob/client.zip \
            "https://github.com/projectdiscovery/interactsh/releases/download/v1.3.1/interactsh-client_1.3.1_linux_amd64.zip" || true
          if [ -s /tmp/oob/client.zip ]; then
            unzip -oq /tmp/oob/client.zip -d /tmp/oob 2>/dev/null || true
          fi
          if [ -x /tmp/oob/interactsh-client ]; then
            nohup /tmp/oob/interactsh-client -ps -psf /tmp/oob/payload.txt -sf /tmp/oob/session.json \
              -json -o /tmp/oob/interactions.jsonl -duc > /tmp/oob/client.log 2>&1 &
            echo $! > /tmp/oob/pid
            for _ in $(seq 1 10); do
              [ -s /tmp/oob/payload.txt ] && break
              sleep 1
            done
          fi
          if [ -s /tmp/oob/payload.txt ]; then
            OOB_DOMAIN="$(head -1 /tmp/oob/payload.txt | tr -d '\r\n')"
            echo "OOB_DOMAIN=$OOB_DOMAIN" >> "$GITHUB_ENV"
            echo "✅ OOB listener ready: $OOB_DOMAIN"
          else
            echo "⚠️ Could not register an OOB session (public interactsh servers may be unreachable from this runner) - blind-vuln payloads will be skipped this run"
          fi

