              # (e.g. the word "sql" appearing naturally on a normal homepage).
              key = (url, param)
              with _baseline_lock:
                  if key in _baseline_cache: return _baseline_cache[key]
              sep = "&" if "?" in url else "?"
              burl = f"{url}{sep}{param}=zzqq99912"
              t0 = time.time()
              try:
                  req = urllib.request.Request(burl, headers=REQ_HEADERS)
                  resp = urllib.request.urlopen(req, timeout=8)
                  body = resp.read(50000).decode(errors="ignore"); st = resp.status
              except urllib.error.HTTPError as e:
                  body = e.read(20000).decode(errors="ignore"); st = e.code
              except Exception:
                  body, st = "", 0
              result = (st, body, time.time()-t0)
              with _baseline_lock:
                  _baseline_cache[key] = result
              return result
          def save_evidence(category,url,method,base_status,base_snippet,test_status,test_snippet,reason):
              # Read-only proof artifact: exactly what we sent and what came back,
              # before and after the payload, so a human can verify the finding
              # without needing to re-run anything against the target themselves.
              os.makedirs(os.path.join(rd,"evidence",category),exist_ok=True)
              fid=hashlib.md5(url.encode()).hexdigest()[:10]
              record={"url":url,"method":method,"reason":reason,
                      "baseline":{"status":base_status,"snippet":base_snippet[:1200]},
                      "test":{"status":test_status,"snippet":test_snippet[:1200]}}
              with open(os.path.join(rd,"evidence",category,f"{fid}.json"),"w") as f: json.dump(record,f,indent=2)
          def tst(url,param,payload,vc):
              enc=urllib.parse.quote(payload); sep="&" if "?" in url else "?"
              tu=f"{url}{sep}{param}={enc}"
              base_st, base_body, base_elapsed = get_baseline(url, param)
              t0=time.time()
              try:
                  req=urllib.request.Request(tu,headers=REQ_HEADERS)
                  resp=urllib.request.urlopen(req,timeout=15); body=resp.read(50000).decode(errors="ignore"); st=resp.status
              except urllib.error.HTTPError as e: body=e.read(20000).decode(errors="ignore"); st=e.code
              except: return None
              elapsed=time.time()-t0
              ind=[]
              if vc=="XSS":
                  # Require the RAW (unescaped) payload to reflect back, and that it
                  # wasn't already present in the baseline response.
                  if payload in body and payload not in base_body: ind.append("XSS reflected unescaped")
              if vc=="SSTI":
                  # "49" (7*7) is common in normal pages, so only count it if it's absent
                  # from the baseline AND the raw template syntax wasn't just echoed back
                  # verbatim (which would mean the engine did NOT evaluate it).
                  if "49" in body and "49" not in base_body and payload not in body: ind.append("SSTI evaluated (7*7=49)")
                  if "config" in body.lower() and "config" not in base_body.lower(): ind.append("SSTI config leak")
              if vc=="LFI":
                  # Match the actual /etc/passwd structure, not just the word "root:".
                  if re.search(r'root:.*:0:0:',body) and not re.search(r'root:.*:0:0:',base_body): ind.append("LFI confirmed (passwd structure)")
              if vc=="SSRF" and "ami-id" in body and "ami-id" not in base_body: ind.append("SSRF (cloud metadata)")
              if vc=="SQLi":
                  if any(k in payload.upper() for k in ["SLEEP","WAITFOR"]):
                      # Time-based blind SQLi: a single slow response could just be
                      # network jitter. Confirm by re-firing the SAME injection point
                      # with a SLEEP(0) control payload - a real time-based SQLi should
                      # snap back to a normal, fast response when the sleep is zero.
                      if elapsed-base_elapsed>4:
                          ctrl_payload=re.sub(r'SLEEP\(\d+\)','SLEEP(0)',payload,flags=re.I)
                          ctrl_url=f"{url}{sep}{param}={urllib.parse.quote(ctrl_payload)}"
                          try:
                              tc0=time.time()
                              creq=urllib.request.Request(ctrl_url,headers={"User-Agent":"Mozilla/5.0"})
                              urllib.request.urlopen(creq,timeout=15).read(1000)
                              ctrl_elapsed=time.time()-tc0
                          except Exception: ctrl_elapsed=elapsed
                          if ctrl_elapsed<elapsed-3: ind.append(f"SQLi time-based CONFIRMED (SLEEP:{elapsed-base_elapsed:.1f}s vs SLEEP(0):{ctrl_elapsed:.1f}s)")
                  else:
                      sql_err=re.search(r'(sql syntax|mysql_fetch|ORA-\d{5}|SQLSTATE|unclosed quotation)',body,re.I)
                      base_err=re.search(r'(sql syntax|mysql_fetch|ORA-\d{5}|SQLSTATE|unclosed quotation)',base_body,re.I)
                      if sql_err and not base_err: ind.append("SQL error (payload-triggered)")
              if vc=="Command_Injection":
                  if "ping" in payload and elapsed-base_elapsed>2: ind.append(f"CMDi time-based (+{elapsed-base_elapsed:.1f}s)")
                  if re.search(r'uid=\d+\(',body) and not re.search(r'uid=\d+\(',base_body): ind.append("RCE (id output)")
              if ind:
                  save_evidence(vc,tu,"GET",base_st,base_body,st,body,"; ".join(ind))
                  return {"url":tu,"vuln_class":vc,"payload":payload,"status":st,"indicators":ind}
              return None
          mt={"light":100,"normal":300,"aggressive":500}.get(mode,300); ts=ts[:mt]
          print(f"🧪 Testing {len(ts)} combos (mode:{mode})...")
          with concurrent.futures.ThreadPoolExecutor(max_workers=30) as ex:
              fs={ex.submit(tst,u,p,pl,vc):(u,p,pl,vc) for u,p,pl,vc in ts}
              for f in concurrent.futures.as_completed(fs):
                  r=f.result()
                  if r: fnd.append(r)
          with open(os.path.join(rd,"ai_agent","injection_findings.json"),"w") as f: json.dump(fnd,f,indent=2)
          with open(os.path.join(rd,"ai_agent","injection_findings.txt"),"w") as f:
              for fn in fnd: f.write(f"[{fn['vuln_class']}] {fn['url']}\n   Payload: {fn['payload']}\n   Indicators: {', '.join(fn['indicators'])}\n\n")
          tp={}
          for fn in fnd: tp[fn['vuln_class']]=tp.get(fn['vuln_class'],0)+1
          print(f"✅ Injection findings: {len(fnd)}")
          for t,c in sorted(tp.items()): print(f"   {t}: {c}")
          PYEOF

