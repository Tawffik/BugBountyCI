      - name: "🔄 AI Agent Phase 5: IDOR Testing"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python3 << 'PYEOF'
          import json, os, re, urllib.request, urllib.error, concurrent.futures, hashlib
          rd="results/"+os.environ.get("TIMESTAMP",""); fnd=[]; pts=[]
          try:
              with open(os.path.join(rd,"js","idor_candidates.txt")) as f:
                  for l in f:
                      l=l.strip()
                      # IMPORTANT: keep the FULL url as the template and store the exact
                      # matched substring (e.g. "/123" or "id=123") so it can actually be
                      # substituted later. Previously the id substring was stripped out of
                      # the template, so base.replace(orig,tid) never matched anything and
                      # every "test" silently re-requested the same broken url.
                      for n in re.findall(r'/(\d+)',l): pts.append((l, f"/{n}", n))
                      for p,v in re.findall(r'[?&](\w+)=(\d+)',l): pts.append((l, f"{p}={v}", v))
          except: pass
          REQ_HEADERS = {"User-Agent": os.environ.get("SCAN_USER_AGENT","Mozilla/5.0")}
          if os.environ.get("AUTH_COOKIE"): REQ_HEADERS["Cookie"] = os.environ["AUTH_COOKIE"]
          if os.environ.get("AUTH_HEADER") and ":" in os.environ["AUTH_HEADER"]:
              _hn, _hv = os.environ["AUTH_HEADER"].split(":", 1); REQ_HEADERS[_hn.strip()] = _hv.strip()
          def fetch(url):
              try:
                  req=urllib.request.Request(url,headers=REQ_HEADERS)
                  resp=urllib.request.urlopen(req,timeout=8); return resp.status, resp.read(50000).decode(errors="ignore")
              except: return None, None
          def save_evidence(category,url,method,base_status,base_snippet,test_status,test_snippet,reason):
              os.makedirs(os.path.join(rd,"evidence",category),exist_ok=True)
              fid=hashlib.md5(url.encode()).hexdigest()[:10]
              record={"url":url,"method":method,"reason":reason,
                      "baseline":{"status":base_status,"snippet":(base_snippet or "")[:1200]},
                      "test":{"status":test_status,"snippet":(test_snippet or "")[:1200]}}
              with open(os.path.join(rd,"evidence",category,f"{fid}.json"),"w") as f: json.dump(record,f,indent=2)
          def t(url_template, orig_substr, orig_val):
              # Baseline: response for an id that's very unlikely to exist, so we can tell
              # a real per-record response apart from a generic "not found"/error template.
              is_path = orig_substr.startswith("/")
              pname = None if is_path else orig_substr.split("=")[0]
              def build(tid):
                  new_substr = f"/{tid}" if is_path else f"{pname}={tid}"
                  return url_template.replace(orig_substr, new_substr, 1)
              base_st, base_body = fetch(build("839217463"))
              for tid in ["1","2","100","9999","0","-1"]:
                  if tid==orig_val: continue
                  url=build(tid)
                  st, body = fetch(url)
                  if st is None: continue
                  if st==200 and body and len(body)>100:
                      # Skip if it looks like the same generic page the baseline got back
                      if base_body is not None and abs(len(body)-len(base_body)) < max(30, 0.1*len(base_body)):
                          continue
                      save_evidence("IDOR",url,"GET",base_st,base_body,st,body,f"response for id={tid} differs meaningfully from not-found baseline (own record id was {orig_val})")
                      return f"[IDOR] {url} | Status:{st} | Body:{len(body)} chars"
              return None
          pts=list(set(pts))[:30]
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
              fs={ex.submit(t,tpl,sub,val):(tpl,sub,val) for tpl,sub,val in pts}
              for f in concurrent.futures.as_completed(fs):
                  r=f.result()
                  if r: fnd.append(r)
          with open(os.path.join(rd,"ai_agent","idor_findings.txt"),"w") as f: f.write("\n".join(fnd) if fnd else "No IDOR findings\n")
          print(f"✅ IDOR: {len(fnd)} findings")
          PYEOF

