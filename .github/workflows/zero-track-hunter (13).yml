          inj=rf("ai_agent/injection_findings.json",3000); xxe=rf("ai_agent/xxe_findings.txt"); gql=rf("ai_agent/graphql_findings.txt"); idor=rf("ai_agent/idor_findings.txt"); chain=rf("ai_agent/chained_analysis.json",2000); nuc=rf("nuclei/findings.jsonl",2000); cors=rf("cors/vulnerable.txt"); sens=rf("files/sensitive.txt"); tako=rf("nuclei/takeover.jsonl",1000); oob=rf("ai_agent/oob_findings.txt")
          core=[inj,xxe,gql,idor,nuc,cors,sens]
