name: "🎯 Zero Track - AI Autonomous Hunter"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target domain (e.g., example.com)"
        required: true
        type: string
      hunting_mode:
        description: "AI hunting intensity (light=fast, normal=balanced, aggressive=deep)"
        required: false
        default: "normal"
        type: choice
        options:
          - light
          - normal
          - aggressive
      discord_notify:
        description: "Send Discord notification"
        type: boolean
        default: true

  workflow_call:
    inputs:
      target:
        description: "Target domain (e.g., example.com)"
        required: true
        type: string
      hunting_mode:
        description: "AI hunting intensity (light / normal / aggressive)"
        required: false
        default: "normal"
        type: string
      discord_notify:
        description: "Send Discord notification"
        required: false
        default: true
        type: boolean
    secrets:
      DISCORD_WEBHOOK:
        description: "Discord webhook URL"
        required: false
      ANTHROPIC_API_KEY:
        description: "API key for Anthropic (Claude)"
        required: false
      OPENROUTER_API_KEY:
        description: "API key for OpenRouter (fallback)"
        required: false
      GROQ_API_KEY:
        description: "API key for Groq (fallback)"
        required: false
      GEMINI_API_KEY:
        description: "API key for Google Gemini (fallback)"
        required: false
      OPENAI_API_KEY:
        description: "API key for OpenAI (fallback)"
        required: false
      PDCP_API_KEY:
        description: "ProjectDiscovery Cloud Platform key (optional, enables ASN/CIDR discovery via asnmap)"
        required: false
      AUTH_COOKIE:
        description: "Optional session cookie (e.g. 'session=abc123') to scan authenticated pages"
        required: false
      AUTH_HEADER:
        description: "Optional auth header (e.g. 'Authorization: Bearer xyz') to scan authenticated pages"
        required: false
    outputs:
      run_url:
        description: "Link to the GitHub Actions run"
        value: ${{ jobs.full_scan.outputs.run_url }}
      finding_count:
        description: "Total findings count"
        value: ${{ jobs.full_scan.outputs.finding_count }}
      artifact_name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.full_scan.outputs.artifact_name }}

permissions:
  contents: read
  actions: write
  models: read

env:
  TARGET:             ${{ inputs.target }}
  HUNTING_MODE:       ${{ inputs.hunting_mode || 'normal' }}
  TIMESTAMP:          ${{ github.run_id }}-${{ github.run_number }}
  DISCORD_WEBHOOK:    ${{ secrets.DISCORD_WEBHOOK || '' }}
  ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY || '' }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
  GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY || '' }}
  GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY || '' }}
  OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY || '' }}
  # GitHub Models needs NO separate secret - it authenticates with the Action's
  # own token, as long as "permissions: models: read" is granted below. This is
  # a genuinely zero-setup free provider for anyone already running this in Actions.
  GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
  CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_API_KEY || '' }}
  # tokenrouter.com - an OpenAI-compatible multi-provider gateway (same schema
  # family as OpenRouter/TokenRouter.io/.me). Not independently verified against
  # the live api.tokenrouter.com endpoint from this project's dev environment -
  # the base URL and model ID below come directly from the account's own
  # dashboard (Base URL field, and the model picker's autocomplete list), so
  # confirm the first real run succeeds before relying on it.
  TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY || '' }}
  PDCP_API_KEY:       ${{ secrets.PDCP_API_KEY || '' }}
  AUTH_COOKIE:        ${{ secrets.AUTH_COOKIE || '' }}
  AUTH_HEADER:         ${{ secrets.AUTH_HEADER || '' }}
  PYTHONUNBUFFERED:   "1"
  # Centralized model names: change once here instead of in every AI Agent step.
  ANTHROPIC_MODEL_NAME:  "claude-sonnet-5"
  OPENROUTER_MODEL_NAME:      "anthropic/claude-sonnet-5"
  OPENROUTER_FREE_MODEL_NAME: "deepseek/deepseek-r1:free"
  GROQ_MODEL_NAME:       "openai/gpt-oss-120b"
  GEMINI_MODEL_NAME:     "gemini-2.5-flash"
  OPENAI_MODEL_NAME:     "gpt-5.5"
  GITHUB_MODELS_MODEL_NAME: "openai/gpt-4.1"
  # Cerebras' free-tier catalog is known to reshuffle its model list more often
  # than the others - if this one starts failing, check console.cerebras.ai for
  # the current lineup rather than assuming the workflow itself broke.
  CEREBRAS_MODEL_NAME: "gpt-oss-120b"
  TOKENROUTER_MODEL_NAME: "moonshotai/kimi-k3-free"
  # A realistic browser UA cuts down on trivial "this is obviously a scanner"
  # WAF blocking - the default nuclei/httpx/katana UAs are an easy tell.
  SCAN_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

defaults:
  run:
    shell: bash

jobs:
  full_scan:
    name: "🛡️ Full Autonomous Scan - ${{ inputs.target }}"
    runs-on: ubuntu-latest
    timeout-minutes: 358
    outputs:
      run_url:       "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      finding_count: ${{ steps.count_findings.outputs.finding_count }}
      artifact_name: "results-${{ env.TIMESTAMP }}-${{ env.TARGET }}"

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🔒 Verify Target Is In Authorized Scope"
        # NOTE: continue-on-error was REMOVED on purpose. This step actively sends
        # exploit payloads (SQLi/XSS/SSTI/SSRF/etc.) further down the pipeline, so an
        # "authorization" check that can never actually stop the job is not a real
        # control - it previously always printed a warning and ran anyway either way.
        env:
          TARGET_INPUT: ${{ inputs.target }}
        run: |
          target="$(echo "${TARGET_INPUT}" | xargs)"
          if [[ ! -f "scope.txt" ]]; then
            echo "⚠️ No scope.txt found in repo — allowing any target (open scope mode)."
            echo "   Add a scope.txt (one domain or *.domain per line) to enforce an allow-list."
            echo "✅ Target authorized: $target"
            exit 0
          fi
          target_lower="$(echo "$target" | tr '[:upper:]' '[:lower:]')"
          matched=0
          while IFS= read -r raw_line; do
            line="${raw_line%%#*}"; line="$(echo "$line" | xargs)"
            [[ -z "$line" ]] && continue
            ll="$(echo "$line" | tr '[:upper:]' '[:lower:]')"
            if [[ "$ll" == "$target_lower" ]]; then matched=1; break; fi
            if [[ "$ll" == \*.* ]]; then
              base="${ll:2}"
              if [[ "$target_lower" == *".$base" ]]; then matched=1; break; fi
            fi
          done < scope.txt
          if [[ "$matched" != "1" ]]; then
            echo "::error::'$target' is NOT listed in scope.txt. Refusing to run active/exploit steps against an unauthorized target."
            echo "   Add '$target' (or '*.$target') to scope.txt if this target is actually authorized, then re-run."
            exit 1
          fi
          echo "✅ Target authorized: $target (matched scope.txt)"

      - name: "✅ Environment Validation"
        env:
          # Passed via env: (not interpolated directly into the script text below) so a
          # target value containing shell metacharacters (`$(...)`, backticks, etc.)
          # can never be executed as code on the runner - it's just an inert string.
          TARGET_INPUT: ${{ inputs.target }}
        run: |
          FAILED=0
          target="$(echo "${TARGET_INPUT}" | xargs)"
          if [ -z "$target" ]; then
            echo "❌ CRITICAL: target input is empty. Every later step would silently run against nothing."
            FAILED=1
          else
            # DNS is case-insensitive, but our grep-based subdomain filter is not.
            # If the user types "Capital.com", subfinder/assetfinder still return
            # lowercase names ("www.capital.com"), and a case-sensitive filter
            # would then reject EVERY real result. Normalize once, here, so every
            # later step's ${{ env.TARGET }} is already safe to use.
            target="$(echo "$target" | tr '[:upper:]' '[:lower:]')"
            echo "TARGET=$target" >> "$GITHUB_ENV"
            echo "✅ target (normalized to lowercase) = $target"
          fi
          if [ -z "${{ env.ANTHROPIC_API_KEY }}${{ env.OPENROUTER_API_KEY }}${{ env.GROQ_API_KEY }}${{ env.GEMINI_API_KEY }}${{ env.OPENAI_API_KEY }}" ]; then
            echo "⚠️ No AI provider API key is configured at all - all 6 AI Agent phases will be skipped/empty. Add at least GROQ_API_KEY or GEMINI_API_KEY (both free) in repo secrets for AI analysis to run."
          else
            echo "✅ At least one AI provider key is configured"
          fi
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "ℹ️ GITHUB_TOKEN not available - GitHub secret-search recon step will be skipped"
          else
            echo "✅ GITHUB_TOKEN available for GitHub recon"
          fi
          if [ "$FAILED" = "1" ]; then
            echo "::error::Environment validation failed - see above. Stopping before wasting any further job time."
            exit 1
          fi

      - name: "⚡ Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📦 Install System Dependencies"
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq git curl wget unzip jq dnsutils libpcap-dev build-essential ripgrep nikto ruby-full
          # WPScan (best-effort - gracefully skipped by the CMS Fingerprint step if this
          # fails; requires rubygems.org, which is NOT reachable from the sandbox this
          # workflow was developed/tested in, so this exact install command itself was
          # not empirically verified there - it should work fine on a normal GitHub
          # Actions runner with standard internet access)
          sudo gem install wpscan 2>/dev/null || echo "⚠️ wpscan gem install failed/skipped - CMS Fingerprint step will fall back to its lightweight built-in checks only"

      - name: "🩺 Target Health Check"
        continue-on-error: true
        timeout-minutes: 2
        run: |
          target="${{ env.TARGET }}"
          if getent hosts "$target" >/dev/null 2>&1 || dig +short "$target" 2>/dev/null | grep -q .; then
            echo "✅ DNS resolves for $target"
          else
            echo "⚠️ WARNING: '$target' does not resolve via DNS right now."
            echo "⚠️ The scan will continue, but most steps may come back empty."
          fi
          code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 8 "https://${target}" 2>/dev/null || echo "000")
          code="${code: -3}"  # curl -w already prints 000 on failure AND exits non-zero, so the || echo "000" fallback doubles it to 000000 - truncate to be safe either way
          echo "ℹ️ HTTPS probe status for https://${target}: $code"

      - name: "🗄️ Cache Go Toolchain"
        id: tool_cache
        uses: actions/cache@v4
        with:
          path: /tmp/toolbin
          # Bump this key's version suffix whenever a pinned tool version below changes.
          key: go-toolbin-v7-subfinder2.6.6-httpx1.6.8-katana1.1.0-nuclei3.8.0-dnsx1.2.1-assetfinder0.1.1-waybackurls0.1.0-gau2.2.4-alterx0.1.0-naabu2.6.1-ffuf2.1.0-gowitness3.0.5-asnmap

      - name: "📦 Install Go Tools"
        continue-on-error: true
        run: |
          mkdir -p /tmp/toolbin
          export GOBIN=/tmp/toolbin
          export PATH="/tmp/toolbin:$PATH"
          # Export PATH FIRST so tools that DO install successfully are always
          # usable later, even if one of the "go install" lines below fails.
          echo "/tmp/toolbin" >> "$GITHUB_PATH"
          : > /tmp/tool_install.log
          # Every tool below is pinned to a specific tagged version (no @latest)
          # so a future upstream release/rename can never silently break this workflow.
          # Real stderr is captured to /tmp/tool_install.log (copied into the results
          # artifact once it exists a few steps later) instead of being thrown away -
          # a silent "install failed" with zero detail is exactly what hid why
          # gowitness ended up unavailable on a real run with no way to diagnose it.
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@v2.6.6 2>>/tmp/tool_install.log || echo "⚠️ subfinder install failed"
          go install github.com/projectdiscovery/httpx/cmd/httpx@v1.6.8 2>>/tmp/tool_install.log || echo "⚠️ httpx install failed"
          go install github.com/projectdiscovery/katana/cmd/katana@v1.1.0 2>>/tmp/tool_install.log || echo "⚠️ katana install failed"
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.8.0 2>>/tmp/tool_install.log || echo "⚠️ nuclei install failed"
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@v1.2.1 2>>/tmp/tool_install.log || echo "⚠️ dnsx install failed"
          go install github.com/tomnomnom/assetfinder@v0.1.1 2>>/tmp/tool_install.log || echo "⚠️ assetfinder install failed"
          go install github.com/tomnomnom/waybackurls@v0.1.0 2>>/tmp/tool_install.log || echo "⚠️ waybackurls install failed"
          go install github.com/lc/gau/v2/cmd/gau@v2.2.4 2>>/tmp/tool_install.log || echo "⚠️ gau install failed"
          go install github.com/tomnomnom/gf@v0.0.0-20200618134122-dcd4c361f9f5 2>>/tmp/tool_install.log || echo "⚠️ gf install failed"
          go install github.com/projectdiscovery/alterx/cmd/alterx@v0.1.0 2>>/tmp/tool_install.log || echo "⚠️ alterx install failed"
          go install github.com/projectdiscovery/naabu/v2/cmd/naabu@v2.6.1 2>>/tmp/tool_install.log || echo "⚠️ naabu install failed"
          go install github.com/ffuf/ffuf/v2@v2.1.0 2>>/tmp/tool_install.log || echo "⚠️ ffuf install failed"
          go install github.com/sensepost/gowitness@v3.0.5 2>>/tmp/tool_install.log || echo "⚠️ gowitness install failed"
          go install github.com/projectdiscovery/asnmap/cmd/asnmap@latest 2>>/tmp/tool_install.log || echo "⚠️ asnmap install failed"
          mkdir -p /tmp/toolbin/.gf
          git clone --depth 1 https://github.com/1ndianl33t/Gf-Patterns.git /tmp/gf-patterns 2>/dev/null || true
          cp /tmp/gf-patterns/*.json /tmp/toolbin/.gf/ 2>/dev/null || true
          cp -r /tmp/toolbin/.gf ~/.gf/ 2>/dev/null || true
          echo "✅ Go tools installation step finished (see warnings above for any individual failures)"

      - name: "📦 Install Python Packages"
        continue-on-error: true
        run: |
          # 'uro' is a PYTHON tool (pip package), not a Go module - it must NOT be
          # installed with "go install" (that was the original root-cause bug).
          pip3 install -q --upgrade pip && pip3 install -q requests httpx uro markdown
          # Cloud-origin discovery tools (find the real origin IP behind a CDN/WAF).
          # Ported over from the older hunter.yml variant - unlike that file's other
          # extras (hydra/medusa/patator/sqlmap/NoSQLMap), these two are actually
          # invoked below and feed real output into the triage report.
          git clone --depth 1 https://github.com/anmolksachan/CloudFail.git /tmp/CloudFail 2>/dev/null || true
          git clone --depth 1 https://github.com/spyboy-productions/CloakQuest3r.git /tmp/CloakQuest3r 2>/dev/null || true
          pip3 install -q -r /tmp/CloudFail/requirements.txt 2>/dev/null || true
          pip3 install -q -r /tmp/CloakQuest3r/requirements.txt 2>/dev/null || true

      - name: "✅ Verify Tools"
        continue-on-error: true
        run: |
          export PATH="/tmp/toolbin:$PATH"
          : > /tmp/tools_verified.txt
          for tool in subfinder httpx katana nuclei dnsx assetfinder waybackurls gau gf uro alterx naabu ffuf gowitness asnmap; do
            if command -v "$tool" >/dev/null; then
              echo "✅ $tool"; echo "✅ $tool" >> /tmp/tools_verified.txt
            else
              echo "⚠️ $tool missing"; echo "⚠️ $tool missing" >> /tmp/tools_verified.txt
            fi
          done

      - name: "🔄 Check For Newer Tool Versions"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          mkdir -p "$RD/meta"
          python3 << 'PYEOF'
          import json, os, time, urllib.request

          # repo, currently-pinned tag (must be kept in sync with the "Install Go
          # Tools" step above by hand - deliberately NOT auto-applied, see note below)
          TOOLS = [
              ("subfinder", "projectdiscovery/subfinder", "v2.6.6"),
              ("httpx",     "projectdiscovery/httpx",     "v1.6.8"),
              ("katana",    "projectdiscovery/katana",    "v1.1.0"),
              ("nuclei",    "projectdiscovery/nuclei",    "v3.8.0"),
              ("dnsx",      "projectdiscovery/dnsx",      "v1.2.1"),
              ("gau",       "lc/gau",                     "v2.2.4"),
              ("alterx",    "projectdiscovery/alterx",    "v0.1.0"),
              ("naabu",     "projectdiscovery/naabu",     "v2.6.1"),
              ("ffuf",      "ffuf/ffuf",                  "v2.1.0"),
              ("gowitness", "sensepost/gowitness",         "v3.0.5"),
          ]

          def norm(v):
              v = v.lstrip("vV")
              out = []
              for part in v.split("."):
                  digits = ""
                  for ch in part:
                      if ch.isdigit(): digits += ch
                      else: break
                  out.append(int(digits) if digits else 0)
              return tuple(out)

          token = os.environ.get("GH_TOKEN", "")
          rows = []
          for name, repo, pinned in TOOLS:
              try:
                  req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases/latest")
                  req.add_header("Accept", "application/vnd.github+json")
                  if token:
                      req.add_header("Authorization", f"Bearer {token}")
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      # strict=False: some release bodies contain raw control
                      # characters that make the default strict parser raise
                      # JSONDecodeError even though the response is otherwise fine.
                      data = json.loads(resp.read().decode("utf-8", "replace"), strict=False)
                  latest = data.get("tag_name")
                  if not latest:
                      rows.append((name, pinned, "?", data.get("message", "no tag_name in response")))
                  else:
                      outdated = norm(latest) > norm(pinned)
                      rows.append((name, pinned, latest, "OUTDATED" if outdated else "current"))
              except Exception as e:
                  rows.append((name, pinned, "?", f"check failed: {e}"))
              time.sleep(0.5)  # be polite even though we're authenticated

          lines = ["# 🔄 Tool Version Check", "",
                   "This is informational only - pinned versions in \"Install Go Tools\" are",
                   "NOT changed automatically. A future upstream release can rename flags or",
                   "change output schemas (this has happened before), so version bumps are",
                   "applied by hand after a quick manual smoke-test, not auto-merged blindly.",
                   "", "| Tool | Pinned | Latest | Status |", "|---|---|---|---|"]
          any_outdated = False
          for name, pinned, latest, status in rows:
              if status == "OUTDATED": any_outdated = True
              lines.append(f"| {name} | {pinned} | {latest} | {status} |")
          if any_outdated:
              lines.append("")
              lines.append("⬆️ One or more tools have a newer release available - review the")
              lines.append("changelog before bumping the pinned version in the workflow.")

          rd = "results/" + os.environ.get("TIMESTAMP", "")
          os.makedirs(os.path.join(rd, "meta"), exist_ok=True)
          with open(os.path.join(rd, "meta", "tool_versions.md"), "w") as f:
              f.write("\n".join(lines))
          print("\n".join(lines))
          PYEOF

      - name: "📦 Update Nuclei Templates"
        continue-on-error: true
        run: |
          export PATH="/tmp/toolbin:$PATH"
          nuclei -update-templates 2>&1 | tail -2 || true

      - name: "📂 Create Results Directory"
        continue-on-error: true
        run: |
          mkdir -p "results/${{ env.TIMESTAMP }}"/{subdomains,live,urls,js,graphql,nuclei,cors,files,ai,ai_agent,logs,cloud}
          mkdir -p .previous_snapshot
          # The comment near the tool-install step claimed this gets copied in "a few
          # steps later" but that copy was never actually written - meaning the log
          # was silently lost to /tmp every run, exactly the kind of gap that hid why
          # gowitness ended up unavailable with zero way to diagnose it after the fact.
          cp /tmp/tool_install.log "results/${{ env.TIMESTAMP }}/logs/tool_install.log" 2>/dev/null || true

      - name: "🔭 OOB Setup (Interactsh)"
        continue-on-error: true
        timeout-minutes: 2
        run: |
          # Out-of-band confirmation for BLIND vulnerabilities (SSRF, blind XXE,
          # blind command injection) that produce no visible difference in the
          # HTTP response - the only real proof for these is an external network
          # callback. Uses the official prebuilt interactsh-client release binary
          # (pinned version, verified to run correctly) rather than hand-rolling
          # the registration/crypto protocol ourselves.
          mkdir -p /tmp/oob
          curl -sL --max-time 30 -o /tmp/oob/client.zip \
            "https://github.com/projectdiscovery/interactsh/releases/download/v1.3.1/interactsh-client_1.3.1_linux_amd64.zip" || true
          if [ -s /tmp/oob/client.zip ]; then
            unzip -oq /tmp/oob/client.zip -d /tmp/oob 2>/dev/null || true
          fi
          if [ -x /tmp/oob/interactsh-client ]; then
            nohup /tmp/oob/interactsh-client -ps -psf /tmp/oob/payload.txt -sf /tmp/oob/session.json \
              -json -o /tmp/oob/interactions.jsonl -poll-interval 10 \
              > /tmp/oob/client.log 2>&1 &
            echo $! > /tmp/oob/pid
            for _ in 1 2 3 4 5 6; do
              [ -s /tmp/oob/payload.txt ] && break
              sleep 2
            done
            if [ -s /tmp/oob/payload.txt ]; then
              OOB_DOMAIN=$(head -1 /tmp/oob/payload.txt | tr -d '\r\n')
              echo "OOB_DOMAIN=$OOB_DOMAIN" >> "$GITHUB_ENV"
              echo "✅ OOB domain ready: $OOB_DOMAIN"
            else
              echo "⚠️ OOB registration didn't complete in time (public server may be unreachable from this runner) - blind-vuln payloads will skip the OOB variant this run"
              echo "OOB_DOMAIN=" >> "$GITHUB_ENV"
            fi
          else
            echo "⚠️ interactsh-client binary not available - skipping OOB setup"
            echo "OOB_DOMAIN=" >> "$GITHUB_ENV"
          fi

      - name: "🗄️ Restore Previous Scan Snapshot (Diff Mode)"
        id: snapshot_restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .previous_snapshot
          key: snapshot-${{ env.TARGET }}

      - name: "🌐 Subdomain Enumeration"
        continue-on-error: true
        timeout-minutes: 18
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          TARGET="${{ env.TARGET }}"
          echo "🔍 Subfinder..."
          subfinder -d "$TARGET" -silent -all -o "$RD/subdomains/subfinder.txt" 2>>"$RD/logs/subfinder.log" || true
          echo "🔍 Assetfinder..."
          assetfinder --subs-only "$TARGET" > "$RD/subdomains/assetfinder.txt" 2>>"$RD/logs/assetfinder.log" || true
          echo "🔍 crt.sh..."
          curl -s --max-time 30 "https://crt.sh/?q=%25.${TARGET}&output=json" | jq -r '.[].name_value' 2>/dev/null | tr ',' '\n' | sed 's/^\*\.//' | sort -u > "$RD/subdomains/crtsh.txt" 2>/dev/null || true

          echo "🩺 Checking for wildcard DNS..."
          WILD_TOKEN="wildcheck$RANDOM$RANDOM"
          WILDCARD_IP=$(dnsx -silent -a -resp-only <<< "${WILD_TOKEN}.${TARGET}" 2>/dev/null | head -1)
          if [ -n "$WILDCARD_IP" ]; then
            echo "⚠️ Wildcard DNS detected on *.${TARGET} (resolves to $WILDCARD_IP) - a plain brute-force would falsely 'confirm' every word tried, so it's skipped. Passive sources + permutations (filtered by content, not just resolution) are used instead."
          else
            echo "🔍 DNS Brute-force (capped at 4 minutes so it can never starve the merge/resolve steps below)..."
            curl -sL --max-time 20 "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/subdomains-top1million-5000.txt" -o /tmp/dns_list.txt 2>/dev/null || true
            # BUGFIX 1: the wordlist has bare words ("www", "mail"...) - they must have
            # the target domain appended before being fed to dnsx, otherwise dnsx is
            # asked to resolve just "www" (not "www.target.com"), which can never
            # succeed. This previously made DNS brute-force silently useless.
            # BUGFIX 2: a real run showed this step alone taking 21+ minutes with a
            # 20K wordlist, blowing the whole 15-minute step timeout and killing the
            # script before it ever reached the merge/resolve/alterx code below -
            # meaning all_subs.txt never got created at all. "timeout 240" guarantees
            # this can never happen again, no matter how slow DNS resolution is.
            [ -s /tmp/dns_list.txt ] && timeout 240 bash -c "sed \"s/\\\$/.${TARGET}/\" /tmp/dns_list.txt | dnsx -silent -a -cname -resp -t 200 | awk '{print \$1}'" > "$RD/subdomains/dns_brute.txt" 2>>"$RD/logs/dnsx.log" || true
          fi

          echo "🔄 Merging passive sources..."
          cat "$RD"/subdomains/*.txt 2>/dev/null | tr -d '\r' | sed 's/^\*\.//' | grep -iE "\.${TARGET}\$|^${TARGET}\$" | tr '[:upper:]' '[:lower:]' | sort -u > /tmp/raw_subs.txt

          echo "✅ Resolving merged list (drops dead/decommissioned names from crt.sh etc.)..."
          [ -s /tmp/raw_subs.txt ] && timeout 240 bash -c 'cat /tmp/raw_subs.txt | dnsx -silent -resp -a -t 200 | awk "{print \$1}" | sort -u' > "$RD/subdomains/resolved.txt" 2>>"$RD/logs/dnsx.log" || touch "$RD/subdomains/resolved.txt"
          # BUGFIX: "-resp-only" strips the hostname entirely and prints ONLY the
          # resolved IP (confirmed against ProjectDiscovery's own documented example
          # output) - meaning every downstream step was silently testing bare IP
          # addresses instead of real hostnames. "-resp" keeps "host [ip]" so col 1
          # (extracted below via awk) is the actual hostname we need.
          cut -d' ' -f1 "$RD/subdomains/resolved.txt" | sort -u -o "$RD/subdomains/resolved.txt"

          echo "🧬 Generating smart permutations (alterx) from confirmed hosts..."
          if [ -s "$RD/subdomains/resolved.txt" ] && command -v alterx >/dev/null; then
            timeout 180 bash -c "alterx -l \"$RD/subdomains/resolved.txt\" -silent | dnsx -silent -resp -a -t 200 | awk '{print \$1}' | sort -u" > "$RD/subdomains/permutations_resolved.txt" 2>>"$RD/logs/alterx.log" || touch "$RD/subdomains/permutations_resolved.txt"
            echo "   +$(wc -l < "$RD/subdomains/permutations_resolved.txt" 2>/dev/null || echo 0) new hosts found via permutation"
          else
            touch "$RD/subdomains/permutations_resolved.txt"
          fi
          cat "$RD/subdomains/resolved.txt" "$RD/subdomains/permutations_resolved.txt" 2>/dev/null | grep -v '^\s*$' | sort -u > "$RD/subdomains/all_subs.txt"
          echo "✅ Total subdomains: $(wc -l < "$RD/subdomains/all_subs.txt" 2>/dev/null || echo 0) (confirmed live via DNS resolution)"
          if [ ! -s "$RD/subdomains/all_subs.txt" ]; then
            raw_count=$(wc -l < /tmp/raw_subs.txt 2>/dev/null || echo 0)
            echo "::warning::0 confirmed subdomains even though $raw_count raw candidate(s) were merged - DNS resolution itself returned nothing usable. This is the earliest and most fundamental point of failure; every later '0 findings' in this run traces back to here, not to the target actually being clean."
            mkdir -p "$RD/meta"
            echo "0 subdomains were DNS-confirmed even though $raw_count raw candidate name(s) existed before resolution. This is almost certainly a resolver/tooling failure, not evidence the target has no subdomains - do NOT treat a clean-looking report below as confirmation of security." > "$RD/meta/scan_health_warning.txt"
          fi

      - name: "🌐 ASN/CIDR Discovery"
        continue-on-error: true
        timeout-minutes: 5
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          : > "$RD/subdomains/asn_ips.txt"
          mkdir -p "$RD/meta"
          if [ -n "${{ env.PDCP_API_KEY }}" ] && command -v asnmap >/dev/null; then
            export PDCP_API_KEY="${{ env.PDCP_API_KEY }}"
            # Find IP ranges owned by the org behind this domain - this can surface
            # servers/services that have NO subdomain or DNS record pointing to them
            # at all, which nothing else in this pipeline would ever find.
            timeout 60 asnmap -d "${{ env.TARGET }}" -silent -o /tmp/asn_cidrs.txt 2>>"$RD/logs/asnmap.log" || true
            if [ -s /tmp/asn_cidrs.txt ]; then
              timeout 120 naabu -l /tmp/asn_cidrs.txt -top-ports 100 -exclude-cdn -silent -rate 1000 -c 25 2>>"$RD/logs/naabu.log" | awk -F: '{print "https://"$1":"$2}' > "$RD/subdomains/asn_ips.txt" || true
              echo "asnmap" > "$RD/meta/asn_source.txt"
            fi
          else
            if [ -z "${{ env.PDCP_API_KEY }}" ]; then
              reason="PDCP_API_KEY not set - asnmap requires a free ProjectDiscovery Cloud account (https://cloud.projectdiscovery.io). This is a CONFIGURATION gap, not a target/code issue - add the secret to get org-wide IP range discovery."
            else
              reason="asnmap failed to install this run - check the tool-install log."
            fi
            echo "$reason" > "$RD/meta/asn_skipped_reason.txt"
            echo "ℹ️ $reason"
            echo "   Falling back to BGPView's free public API (keyless, no signup needed) for basic coverage..."
            python3 << 'PYEOF'
            import os, json, socket, urllib.request

            rd = "results/" + os.environ.get("TIMESTAMP", "")
            target = os.environ.get("TARGET", "")
            prefixes = set()
            try:
                ip = socket.gethostbyname(target)
                req = urllib.request.Request(f"https://api.bgpview.io/ip/{ip}",
                                              headers={"User-Agent": "Mozilla/5.0"})
                with urllib.request.urlopen(req, timeout=10) as resp:
                    data = json.loads(resp.read().decode("utf-8", "replace"))
                # BGPView's schema per public docs/examples: {"data": {"prefixes": [{"prefix": "x.x.x.x/y", ...}, ...]}}
                # Written defensively in case the real shape differs slightly - log
                # the raw response rather than crash if these keys aren't there.
                for p in (data.get("data") or {}).get("prefixes", []):
                    pfx = p.get("prefix")
                    if pfx:
                        prefixes.add(pfx)
                if not prefixes:
                    with open(os.path.join(rd, "logs", "bgpview.log"), "w") as f:
                        f.write("No prefixes extracted - raw response follows:\n" + json.dumps(data)[:2000])
            except Exception as e:
                with open(os.path.join(rd, "logs", "bgpview.log"), "w") as f:
                    f.write(f"BGPView lookup failed: {e}")

            with open("/tmp/bgpview_cidrs.txt", "w") as f:
                f.write("\n".join(prefixes))
            print(f"BGPView: {len(prefixes)} CIDR range(s) found" if prefixes else "BGPView: no usable data")
          PYEOF
            if [ -s /tmp/bgpview_cidrs.txt ]; then
              timeout 120 naabu -l /tmp/bgpview_cidrs.txt -top-ports 100 -exclude-cdn -silent -rate 1000 -c 25 2>>"$RD/logs/naabu.log" | awk -F: '{print "https://"$1":"$2}' > "$RD/subdomains/asn_ips.txt" || true
              echo "bgpview (free fallback - less complete than asnmap)" > "$RD/meta/asn_source.txt"
            fi
          fi
          echo "✅ ASN-derived live candidates: $(wc -l < "$RD/subdomains/asn_ips.txt" 2>/dev/null || echo 0) (source: $(cat "$RD/meta/asn_source.txt" 2>/dev/null || echo none))"

      - name: "🏚️ Subdomain Takeover Check"
        continue-on-error: true
        timeout-minutes: 8
        run: |
          ulimit -n 65535 2>/dev/null || ulimit -n 8192 2>/dev/null || true
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/subdomains/all_subs.txt"
          [ -s "$INPUT" ] || { echo "${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          nuclei -l "$INPUT" -tags takeover -H "User-Agent: $SCAN_USER_AGENT" -mhe 150 -rl 50 -c 10 -silent -jsonl -o "$RD/nuclei/takeover.jsonl" 2>>"$RD/logs/takeover.log" || true
          echo "✅ Takeover checks done"

      - name: "🌍 Live Host Probing & Fingerprinting"
        continue-on-error: true
        timeout-minutes: 12
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/subdomains/all_subs.txt"
          [ -s "$INPUT" ] || { echo "${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          PROBE_INPUT="$INPUT"
          if [ -s "$RD/subdomains/asn_ips.txt" ]; then
            # Confirmed on a real run: a legitimate large CIDR block can produce tens
            # of thousands of IP candidates (137,011 on one actual run) - appending
            # those into all_subs.txt itself would permanently contaminate the file
            # every OTHER step treats as "the confirmed subdomain list" (Port
            # Scanning, URL Collection, Fuzzing, the Diff feature, and the Pipeline
            # Health funnel's own count), and would blow this step's time budget
            # trying to probe all of them instead of the real subdomains that
            # actually matter. Build a separate, capped list just for this probe.
            PROBE_INPUT="/tmp/probe_input.txt"
            cat "$INPUT" "$RD/subdomains/asn_ips.txt" 2>/dev/null | awk '!seen[$0]++' | head -2000 > "$PROBE_INPUT"
            asn_kept=$(($(wc -l < "$PROBE_INPUT") - $(wc -l < "$INPUT")))
            echo "ℹ️ Added up to $asn_kept ASN/CIDR-derived candidate(s) to this probe only (all_subs.txt itself is left untouched)"
          fi
          # Optional authenticated scanning: if a session cookie/auth header secret is
          # configured, every probe below carries it too, so status codes/fingerprints
          # reflect what a LOGGED-IN user would see, not just the public surface.
          AUTH_ARGS=()
          [ -n "${{ env.AUTH_COOKIE }}" ] && AUTH_ARGS+=(-H "Cookie: ${{ env.AUTH_COOKIE }}")
          [ -n "${{ env.AUTH_HEADER }}" ] && AUTH_ARGS+=(-H "${{ env.AUTH_HEADER }}")
          httpx -l "$PROBE_INPUT" -silent -status-code -title -web-server -ip -cdn -follow-redirects -H "User-Agent: $SCAN_USER_AGENT" "${AUTH_ARGS[@]}" -threads 100 -rate-limit 150 -timeout 10 -json -o "$RD/live/live.json" 2>>"$RD/logs/httpx.log" || true
          jq -r '.url // .input' "$RD/live/live.json" 2>/dev/null | grep -v '^\s*$' > "$RD/live/live.txt" || true
          jq -r 'select(.cdn_name != null) | "\(.url) -> \(.cdn_name)"' "$RD/live/live.json" > "$RD/live/waf.txt" 2>/dev/null || true
          httpx -l "$RD/live/live.txt" -silent -tech-detect -H "User-Agent: $SCAN_USER_AGENT" "${AUTH_ARGS[@]}" -json -o "$RD/live/tech.json" 2>>"$RD/logs/fingerprint.log" || true
          echo "✅ Live hosts: $(wc -l < "$RD/live/live.txt")"
          live_count=$(wc -l < "$RD/live/live.txt" 2>/dev/null || echo 0)
          input_count=$(wc -l < "$INPUT" 2>/dev/null || echo 0)
          if [ "$live_count" -eq 0 ] && [ "$input_count" -gt 0 ] && [ ! -s "$RD/meta/scan_health_warning.txt" ]; then
            echo "::warning::0 live hosts found despite $input_count candidate(s) in the input ($INPUT) - this is NOT a normal clean-scan result. Confirmed causes seen in real runs: a discovery tool silently losing hosts upstream, or the target/WAF blocking this runner's IP. Check $RD/logs/httpx.log (even if empty - that itself is a clue) before trusting any downstream '0 findings' from this run."
            echo "⚠️ 0 LIVE HOSTS FROM $input_count CANDIDATE(S) - flagging for manual review, see logs/httpx.log" >> "$RD/logs/httpx.log"
            mkdir -p "$RD/meta"
            diag_status=$(curl -sk -o /dev/null --max-time 12 -w "%{http_code}" "https://${{ env.TARGET }}/" 2>>/tmp/diag_curl.log || echo "000")
            diag_status="${diag_status: -3}"
            diag_note="Direct diagnostic probe to https://${{ env.TARGET }}/ returned status $diag_status."
            if [ "$diag_status" = "000" ]; then
              diag_note="$diag_note This runner could not complete a TLS/TCP connection at all - strong signal of network-level blocking (WAF/firewall dropping this IP range), not a normal 'site has no findings' result."
            elif [ "$diag_status" = "403" ] || [ "$diag_status" = "429" ]; then
              diag_note="$diag_note A $diag_status here is a classic WAF/rate-limit block signature - the target is very likely reachable for normal users but actively blocking this runner."
            fi
            echo "0 live hosts found despite $input_count candidate(s) - the target may be blocking/rate-limiting this runner's IP rather than genuinely having no findings. Do NOT treat a clean-looking report below as confirmation of security. $diag_note" > "$RD/meta/scan_health_warning.txt"
          fi

      - name: "🔓 Port Scanning"
        continue-on-error: true
        timeout-minutes: 12
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/subdomains/all_subs.txt"
          [ -s "$INPUT" ] || { echo "${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          # Everything so far only ever checked 80/443. Admin panels, dev/staging
          # services, and internal tools are very commonly left open on non-standard
          # ports that nothing above would ever touch - naabu finds those.
          if command -v naabu >/dev/null; then
            sudo "$(command -v naabu)" -l "$INPUT" -top-ports 100 -exclude-cdn -silent -rate 1000 -c 25 -o "$RD/live/ports.txt" 2>>"$RD/logs/naabu.log" || true
            echo "✅ Open host:port pairs: $(wc -l < "$RD/live/ports.txt" 2>/dev/null || echo 0)"
            awk -F: '$2!=80 && $2!=443 {print}' "$RD/live/ports.txt" 2>/dev/null > /tmp/nonstd_ports.txt
            if [ -s /tmp/nonstd_ports.txt ]; then
              httpx -l /tmp/nonstd_ports.txt -silent -status-code -title -H "User-Agent: $SCAN_USER_AGENT" -timeout 8 -o "$RD/live/nonstandard_live.txt" 2>>"$RD/logs/httpx.log" || true
              echo "✅ Live services on non-standard ports: $(wc -l < "$RD/live/nonstandard_live.txt" 2>/dev/null || echo 0)"
              # Merge into live.txt so every later phase (nuclei, API discovery, JS
              # analysis...) automatically picks these up too, not just this step.
              awk '{print $1}' "$RD/live/nonstandard_live.txt" 2>/dev/null >> "$RD/live/live.txt"
              sort -u -o "$RD/live/live.txt" "$RD/live/live.txt"
            fi
          else
            echo "⚠️ naabu not available, skipping port scan"
          fi

      - name: "📜 URL Collection"
        continue-on-error: true
        timeout-minutes: 12
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/subdomains/all_subs.txt"
          [ -s "$INPUT" ] || { echo "${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          AUTH_ARGS=()
          [ -n "${{ env.AUTH_COOKIE }}" ] && AUTH_ARGS+=(-H "Cookie: ${{ env.AUTH_COOKIE }}")
          [ -n "${{ env.AUTH_HEADER }}" ] && AUTH_ARGS+=(-H "${{ env.AUTH_HEADER }}")
          echo "🔍 Wayback..."
          cat "$INPUT" | waybackurls > "$RD/urls/wayback.txt" 2>>"$RD/logs/wayback.log" || true
          echo "🔍 Gau..."
          gau "${{ env.TARGET }}" --subs --o "$RD/urls/gau.txt" 2>>"$RD/logs/gau.log" || true
          echo "🔍 Katana..."
          [ -s "$RD/live/live.txt" ] && katana -list "$RD/live/live.txt" -H "User-Agent: $SCAN_USER_AGENT" "${AUTH_ARGS[@]}" -silent -depth 2 -jc -d 3 -o "$RD/urls/katana.txt" 2>>"$RD/logs/katana.log" || true
          echo "🔍 robots.txt / sitemap.xml (cheap, often lists paths the owner didn't want indexed)..."
          : > "$RD/urls/robots_sitemap.txt"
          if [ -s "$RD/live/live.txt" ]; then
            mode="${HUNTING_MODE:-normal}"
            budget=$({ [ "$mode" = "light" ] && echo 90; } || { [ "$mode" = "aggressive" ] && echo 400; } || echo 200)
            total=$(wc -l < "$RD/live/live.txt")
            i=0
            SECONDS=0
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              if [ "$SECONDS" -ge "$budget" ]; then
                echo "⏱️ robots.txt/sitemap.xml: time budget reached after $i/$total host(s)"
                break
              fi
              i=$((i+1))
              curl -sk --max-time 6 -H "User-Agent: $SCAN_USER_AGENT" "${host}/robots.txt" 2>/dev/null | grep -iE '^(dis)?allow:' | sed -E 's/^[^:]*:[ \t]*//' | grep -v '^\s*$' | sed "s#^#${host}#" >> "$RD/urls/robots_sitemap.txt"
              curl -sk --max-time 6 -H "User-Agent: $SCAN_USER_AGENT" "${host}/sitemap.xml" 2>/dev/null | grep -oE '<loc>[^<]+</loc>' | sed -E 's/<\/?loc>//g' >> "$RD/urls/robots_sitemap.txt"
            done < "$RD/live/live.txt"
          fi
          echo "🔄 Merging..."
          cat "$RD"/urls/*.txt 2>/dev/null | sort -u > /tmp/urls_merged.txt
          timeout 90 uro < /tmp/urls_merged.txt > "$RD/urls/all.txt" 2>/dev/null || cp /tmp/urls_merged.txt "$RD/urls/all.txt"
          echo "✅ Total URLs: $(wc -l < "$RD/urls/all.txt")"

          echo "🎯 Categorizing URLs by vulnerability-relevant parameters (gf patterns)..."
          : > "$RD/urls/gf_categorized.txt"
          if [ -s "$RD/urls/all.txt" ] && command -v gf >/dev/null; then
            for pat in xss sqli ssrf lfi ssti idor redirect; do
              timeout 30 gf "$pat" < "$RD/urls/all.txt" 2>/dev/null | sed "s/^/[$pat] /" >> "$RD/urls/gf_categorized.txt" || true
            done
            sort -u -o "$RD/urls/gf_categorized.txt" "$RD/urls/gf_categorized.txt"
          fi
          echo "✅ gf-categorized candidates: $(wc -l < "$RD/urls/gf_categorized.txt" 2>/dev/null || echo 0)"

      - name: "📦 JavaScript Analysis"
        continue-on-error: true
        timeout-minutes: 12
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/urls/all.txt"
          mode="${HUNTING_MODE:-normal}"
          cap=$({ [ "$mode" = "light" ] && echo 100; } || { [ "$mode" = "aggressive" ] && echo 500; } || echo 200)
          if [ -s "$INPUT" ]; then
            grep -iE '\.js(\?|#|$)' "$INPUT" | sort -u | head -"$cap" > "$RD/js/files.txt"
            echo "✅ JS files found (round 1, crawled URLs): $(wc -l < "$RD/js/files.txt" 2>/dev/null || echo 0)"
            if [ -s "$RD/js/files.txt" ]; then
              echo "⬇️ Downloading JS file contents for analysis (endpoints/secrets live INSIDE the file, not in its URL)..."
              httpx -l "$RD/js/files.txt" -silent -H "User-Agent: $SCAN_USER_AGENT" -timeout 8 -threads 30 -sr -srd "$RD/js/bodies" > /dev/null 2>>"$RD/logs/js_download.log" || true

              # Round 2: a plain URL crawl only ever finds JS files that appear as an
              # actual <script src=...> in some crawled HTML page. In any modern
              # bundled app (webpack/vite/etc.) most of the real JS - lazy-loaded
              # chunks, dynamically-imported modules - is only ever referenced as a
              # STRING INSIDE another JS file, never as an HTML tag, so the crawler
              # never sees it and it was completely invisible before. This re-fetches
              # each already-known file directly (so we have a reliable url<->body
              # mapping to resolve relative paths against, rather than guessing at
              # httpx's internal -srd file layout) and follows any further in-scope
              # .js references it finds - one level deep, capped, to stay bounded.
              python3 << 'PYEOF'
              import os, re, urllib.request
              from urllib.parse import urljoin, urlparse
              rd = "results/" + os.environ.get("TIMESTAMP", "")
              target = os.environ.get("TARGET", "")
              ua = os.environ.get("SCAN_USER_AGENT", "Mozilla/5.0")
              cap = int(os.environ.get("JS_ROUND2_CAP", "80"))

              def in_scope(url):
                  host = urlparse(url).hostname or ""
                  return host == target or host.endswith("." + target)

              known = set()
              try:
                  with open(os.path.join(rd, "js", "files.txt")) as f:
                      known = {l.strip() for l in f if l.strip()}
              except Exception:
                  pass

              discovered = set()
              for url in list(known)[:cap]:
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": ua})
                      body = urllib.request.urlopen(req, timeout=8).read(500000).decode("utf-8", "replace")
                  except Exception:
                      continue
                  for ref in re.findall(r'["\'`]([^"\'`\s]+\.js)["\'`]', body):
                      resolved = urljoin(url, ref)
                      if resolved in known or resolved in discovered:
                          continue
                      if not in_scope(resolved):
                          continue  # third-party CDN/analytics JS - not our target, skip
                      discovered.add(resolved)

              discovered = list(discovered)[:cap]
              with open(os.path.join(rd, "js", "files_discovered.txt"), "w") as f:
                  f.write("\n".join(discovered))
              print(f"🔗 JS files found (round 2, referenced FROM other JS - chunks/dynamic imports): {len(discovered)}")
          PYEOF
              if [ -s "$RD/js/files_discovered.txt" ]; then
                httpx -l "$RD/js/files_discovered.txt" -silent -H "User-Agent: $SCAN_USER_AGENT" -timeout 8 -threads 30 -sr -srd "$RD/js/bodies" > /dev/null 2>>"$RD/logs/js_download.log" || true
                cat "$RD/js/files_discovered.txt" >> "$RD/js/files.txt"
              fi

              # Search the ACTUAL downloaded JS content, not the URL strings - the old
              # version grepped the list of .js URLs themselves, which essentially never
              # contain "api/" or "secret=" as literal text, so it never found anything real.
              grep -rhIioE '(api|v[0-9]+|graphql|rest)/[a-zA-Z0-9_/?=&%-]{3,80}' "$RD/js/bodies" 2>/dev/null | sort -u > "$RD/js/api_endpoints.txt" || true

              : > "$RD/js/secrets.txt"
              # Generic key=value form (apiKey/token/secret/jwt/bearer)
              grep -rhIioE '["'"'"']?(api[_-]?key|apikey|secret|token|jwt|bearer)["'"'"']?\s*[:=]\s*["'"'"'][^"'"'"']{6,80}["'"'"']' "$RD/js/bodies" 2>/dev/null | sort -u >> "$RD/js/secrets.txt" || true
              # Concrete real-world key formats a generic key=value regex can't catch
              # (no "secret"/"token" label anywhere near them at all)
              grep -rhIoE 'AKIA[0-9A-Z]{16}' "$RD/js/bodies" 2>/dev/null | sed 's/^/[AWS Key] /' | sort -u >> "$RD/js/secrets.txt" || true
              grep -rhIoE 'AIza[0-9A-Za-z_-]{35}' "$RD/js/bodies" 2>/dev/null | sed 's/^/[Google API Key] /' | sort -u >> "$RD/js/secrets.txt" || true
              grep -rhIoE 'hooks\.slack\.com/services/T[A-Za-z0-9_]+/B[A-Za-z0-9_]+/[A-Za-z0-9_]+' "$RD/js/bodies" 2>/dev/null | sed 's/^/[Slack Webhook] /' | sort -u >> "$RD/js/secrets.txt" || true
              grep -rhIoE '[sp]k_live_[A-Za-z0-9]{16,}' "$RD/js/bodies" 2>/dev/null | sed 's/^/[Stripe Key] /' | sort -u >> "$RD/js/secrets.txt" || true
              grep -rhIoE 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' "$RD/js/bodies" 2>/dev/null | sed 's/^/[JWT] /' | sort -u >> "$RD/js/secrets.txt" || true
              grep -rhIolE -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' "$RD/js/bodies" 2>/dev/null | sed 's/^/[Private Key file] /' | sort -u >> "$RD/js/secrets.txt" || true
            fi
            echo "✅ API endpoints (from JS content): $(wc -l < "$RD/js/api_endpoints.txt" 2>/dev/null || echo 0) | Secrets: $(wc -l < "$RD/js/secrets.txt" 2>/dev/null || echo 0) | Total JS files analyzed: $(sort -u "$RD/js/files.txt" 2>/dev/null | wc -l || echo 0)"
          fi
          grep -iEo '/[0-9]+([/?][^ ]*)?$|[?&](id|user_id|uid|account_id|profile_id|order_id)=[0-9]+' "$INPUT" 2>/dev/null | sort -u > "$RD/js/idor_candidates.txt" || true
          echo "✅ IDOR candidates: $(wc -l < "$RD/js/idor_candidates.txt" 2>/dev/null || echo 0)"

      - name: "🕵️ Extended Recon (GitHub / VHosts / Cloud Storage)"
        continue-on-error: true
        timeout-minutes: 8
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          TARGET="${{ env.TARGET }}"
          BASE_NAME="$(echo "$TARGET" | sed -E 's/\.(com|net|org|io|ch|co|dev|app)(\.[a-z]{2})?$//' | sed -E 's/.*\.//')"

          echo "🔍 GitHub code search for leaked secrets mentioning ${TARGET}..."
          : > "$RD/js/github_recon.txt"
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            for q in "${TARGET} password" "${TARGET} api_key" "${TARGET} secret"; do
              curl -s --max-time 10 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/search/code?q=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$q")" \
                2>/dev/null | jq -r '.items[]? | "\(.repository.full_name) :: \(.path)"' 2>/dev/null >> "$RD/js/github_recon.txt" || true
              sleep 3  # stay well under the search API's rate limit
            done
            sort -u -o "$RD/js/github_recon.txt" "$RD/js/github_recon.txt"
            echo "✅ GitHub recon hits (repo/file references only, not fetched): $(wc -l < "$RD/js/github_recon.txt" 2>/dev/null || echo 0)"
          else
            echo "⚠️ GITHUB_TOKEN not available, skipping GitHub recon"
          fi

          echo "🔍 Virtual host discovery on shared IPs..."
          : > "$RD/live/vhosts.txt"
          if [ -s "$RD/live/live.txt" ]; then
            # Resolve real IPs directly via dnsx rather than relying on an assumed
            # httpx JSON field name - httpx's "host" field is actually the hostname
            # (echoed input), not the IP, so this must not be guessed from live.json.
            IPS=$(cat "$RD/live/live.txt" | dnsx -silent -resp-only -a 2>/dev/null | awk '{print $1}' | sort -u | head -5)
            for ip in $IPS; do
              [ -z "$ip" ] && continue
              base_status=$(curl -sk --max-time 6 -H "Host: nonexistent-$RANDOM.$TARGET" -H "User-Agent: $SCAN_USER_AGENT" -o /tmp/vhost_base -w "%{http_code}" "https://$ip/" 2>/dev/null || echo "000")
              base_status="${base_status: -3}"  # curl -w already prints 000 on failure AND exits non-zero, so the || echo "000" fallback doubles it to 000000 - truncate to be safe either way
              blen=$(wc -c < /tmp/vhost_base 2>/dev/null || echo 0)
              for vh in dev staging admin internal test api-internal vpn preprod uat qa; do
                test_status=$(curl -sk --max-time 6 -H "Host: ${vh}.${TARGET}" -H "User-Agent: $SCAN_USER_AGENT" -o /tmp/vhost_test -w "%{http_code}" "https://$ip/" 2>/dev/null || echo "000")
                test_status="${test_status: -3}"  # curl -w already prints 000 on failure AND exits non-zero, so the || echo "000" fallback doubles it to 000000 - truncate to be safe either way
                tlen=$(wc -c < /tmp/vhost_test 2>/dev/null || echo 0)
                diff=$(( tlen > blen ? tlen - blen : blen - tlen ))
                # Previously the captured status codes (base_status/test_status) were
                # thrown away and only byte-length was compared - so a vhost returning
                # the SAME length but a DIFFERENT status (e.g. 200 vs 403, a very common
                # "this vhost exists but you're not authorized" signal) was silently
                # missed. Flag on either signal now.
                if { [ "$blen" -gt 0 ] && [ "$diff" -gt 50 ]; } || [ "$test_status" != "$base_status" ]; then
                  echo "${vh}.${TARGET} on ${ip} (status ${base_status}->${test_status}, body differs by ${diff} bytes)" >> "$RD/live/vhosts.txt"
                fi
              done
            done
          fi
          echo "✅ Candidate hidden vhosts: $(wc -l < "$RD/live/vhosts.txt" 2>/dev/null || echo 0)"

          echo "🔍 Cloud storage bucket enumeration (existence check only, read-only)..."
          : > "$RD/live/cloud_buckets.txt"
          if [ -n "$BASE_NAME" ]; then
            for suffix in "" "-backup" "-assets" "-media" "-dev" "-staging" "-files" "-data" "-public" "-uploads" "-static" "-logs"; do
              bname="${BASE_NAME}${suffix}"
              s3_code=$(curl -sk --max-time 6 -o /dev/null -w "%{http_code}" "https://${bname}.s3.amazonaws.com/" 2>/dev/null || echo "000")
              s3_code="${s3_code: -3}"  # curl -w already prints 000 on failure AND exits non-zero, so the || echo "000" fallback doubles it to 000000 - truncate to be safe either way
              [ "$s3_code" = "200" ] || [ "$s3_code" = "403" ] && echo "S3: https://${bname}.s3.amazonaws.com/ [HTTP $s3_code]" >> "$RD/live/cloud_buckets.txt"
              gcs_code=$(curl -sk --max-time 6 -o /dev/null -w "%{http_code}" "https://storage.googleapis.com/${bname}/" 2>/dev/null || echo "000")
              gcs_code="${gcs_code: -3}"  # curl -w already prints 000 on failure AND exits non-zero, so the || echo "000" fallback doubles it to 000000 - truncate to be safe either way
              [ "$gcs_code" = "200" ] || [ "$gcs_code" = "403" ] && echo "GCS: https://storage.googleapis.com/${bname}/ [HTTP $gcs_code]" >> "$RD/live/cloud_buckets.txt"
            done
          fi
          echo "✅ Candidate cloud buckets found: $(wc -l < "$RD/live/cloud_buckets.txt" 2>/dev/null || echo 0)"

      - name: "🌩️ Cloud Origin Discovery (CloudFail + CloakQuest3r)"
        continue-on-error: true
        timeout-minutes: 8
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          : > "$RD/cloud/cloudfail.txt"
          : > "$RD/cloud/cloakquest.txt"
          if [ -f /tmp/CloudFail/cloudfail.py ]; then
            python3 /tmp/CloudFail/cloudfail.py -t "${{ env.TARGET }}" --passive-only >> "$RD/cloud/cloudfail.txt" 2>>"$RD/logs/cloud.log" || true
          else
            echo "⚠️ CloudFail not installed, skipping"
          fi
          if [ -f /tmp/CloakQuest3r/cloakquest3r.py ]; then
            echo "no" | timeout 120 python3 /tmp/CloakQuest3r/cloakquest3r.py "${{ env.TARGET }}" 2>>"$RD/logs/cloud.log" \
              | grep -E '([0-9]{1,3}\.){3}[0-9]{1,3}|[Cc]loudflare|subdomain' \
              | grep -viE 'twitter|discord|github\.com/spyboy|blog|created by|uncover the true|checking if the|scanning for|do you have a custom' >> "$RD/cloud/cloakquest.txt" || true
          else
            echo "⚠️ CloakQuest3r not installed, skipping"
          fi
          echo "✅ Cloud origin discovery completed (results/${{ env.TIMESTAMP }}/cloud/*.txt)"

      - name: "🔎 Content Discovery Fuzzing"
        continue-on-error: true
        timeout-minutes: 20
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          mkdir -p "$RD/fuzzing"
          curl -sL --max-time 15 "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt" -o /tmp/content_wordlist.txt 2>/dev/null || true
          : > "$RD/fuzzing/discovered.txt"
          if [ -s /tmp/content_wordlist.txt ] && [ -s "$RD/live/live.txt" ] && command -v ffuf >/dev/null; then
            mode="${HUNTING_MODE:-normal}"
            budget=$({ [ "$mode" = "light" ] && echo 300; } || { [ "$mode" = "aggressive" ] && echo 1400; } || echo 700)
            total=$(wc -l < "$RD/live/live.txt")
            per_host=90
            i=0
            SECONDS=0
            echo "⏱️ Time-budget driven (${budget}s total, ~${per_host}s cap per host) across $total discovered live host(s) - not a fixed count"
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              if [ "$SECONDS" -ge "$budget" ]; then
                echo "⏱️ Time budget reached after $i/$total host(s) - stopping here rather than an arbitrary fixed count"
                break
              fi
              i=$((i+1))
              # -ac (autocalibrate) has ffuf learn what a generic "not found" response
              # looks like for THIS host and filter it out automatically, instead of
              # every wordlist hit that lands on a custom 404 page looking like a find.
              timeout "$per_host" ffuf -w /tmp/content_wordlist.txt -u "${host}/FUZZ" -H "User-Agent: $SCAN_USER_AGENT" \
                -mc 200,204,301,302,307,401,403 -ac -t 30 -rate 80 -timeout 5 -of json -o /tmp/ffuf_out.json -s 2>>"$RD/logs/ffuf.log" || true
              jq -r '.results[]? | "\(.url) [\(.status)] \(.length) bytes"' /tmp/ffuf_out.json 2>/dev/null >> "$RD/fuzzing/discovered.txt" || true
              rm -f /tmp/ffuf_out.json
            done < "$RD/live/live.txt"
            sort -u -o "$RD/fuzzing/discovered.txt" "$RD/fuzzing/discovered.txt"
          fi
          echo "✅ Content discovery hits: $(wc -l < "$RD/fuzzing/discovered.txt" 2>/dev/null || echo 0) (from $i/$total host(s))"

      - name: "🔌 API Discovery"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/live/live.txt"
          [ -s "$INPUT" ] || { echo "https://${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          : > "$RD/js/swagger.txt"
          for path in "/swagger.json" "/v2/api-docs" "/v3/api-docs" "/openapi.json" "/api/docs" "/swagger-ui.html"; do
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              s=$(curl -sk -o /tmp/body.txt -w "%{http_code}" --max-time 5 "${host}${path}" 2>/dev/null || echo "000")
              s="${s: -3}"  # curl -w already prints 000 on failure AND exits non-zero, so the || echo "000" fallback doubles it to 000000 - truncate to be safe either way
              [ "$s" = "200" ] && grep -qiE '(swagger|openapi|"paths")' /tmp/body.txt 2>/dev/null && echo "[$s] ${host}${path}" >> "$RD/js/swagger.txt"
            done < "$INPUT"
          done
          : > "$RD/js/graphql.txt"
          for path in "/graphql" "/graphiql" "/v1/graphql" "/api/graphql" "/playground"; do
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              s=$(curl -sk -o /tmp/gql.txt -w "%{http_code}" --max-time 5 -X POST -H "Content-Type: application/json" -d '{"query":"{__typename}"}' "${host}${path}" 2>/dev/null || echo "000")
              s="${s: -3}"  # curl -w already prints 000 on failure AND exits non-zero, so the || echo "000" fallback doubles it to 000000 - truncate to be safe either way
              [ "$s" = "200" ] && grep -qiE '("data"|"errors")' /tmp/gql.txt 2>/dev/null && echo "[$s] ${host}${path}" >> "$RD/js/graphql.txt"
            done < "$INPUT"
          done
          echo "/admin /administrator /panel /cpanel /login /wp-admin /dashboard /backend /portal" | tr ' ' '\n' > /tmp/admin_paths.txt
          httpx -l "$INPUT" -path /tmp/admin_paths.txt -mc 200,301,302,401,403 -H "User-Agent: $SCAN_USER_AGENT" -threads 50 -rate-limit 150 -timeout 6 -silent -o "$RD/js/admin.txt" 2>>"$RD/logs/admin.log" || true
          # NOTE: entries below only matched an expected status code (200/301/302/401/403) -
          # they are candidate paths to check manually, NOT confirmed admin panels.
          if [ -s "$RD/js/admin.txt" ]; then sed -i '1i # CANDIDATE paths only (status-code match) - verify manually, not confirmed findings' "$RD/js/admin.txt"; fi
          echo "✅ Swagger: $(wc -l < "$RD/js/swagger.txt" 2>/dev/null || echo 0) | GraphQL: $(wc -l < "$RD/js/graphql.txt" 2>/dev/null || echo 0) | Admin: $(wc -l < "$RD/js/admin.txt" 2>/dev/null || echo 0)"

      - name: "🛡️ Security Analysis"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/live/live.txt"
          [ -s "$INPUT" ] || { echo "https://${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          : > "$RD/cors/vulnerable.txt"
          for origin in "https://evil.com" "null" "https://evil.${{ env.TARGET }}"; do
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              resp=$(curl -s -I -H "Origin: $origin" --max-time 6 "$host" 2>/dev/null || echo "")
              acao=$(echo "$resp" | grep -i 'access-control-allow-origin' | head -1 | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '\r' | xargs 2>/dev/null || echo "")
              acac=$(echo "$resp" | grep -i 'access-control-allow-credentials' | head -1 | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '\r' | xargs 2>/dev/null || echo "")
              [ "$acao" = "$origin" ] && [ "$acac" = "true" ] && echo "[CORS-CRITICAL] $host origin=$origin" >> "$RD/cors/vulnerable.txt"
            done < "$INPUT"
          done
          declare -A BASE_LEN BASE_STATUS
          while IFS= read -r host; do
            host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
            bstatus=$(curl -sk --max-time 5 -o /tmp/base_body -w "%{http_code}" "${host}/__not_a_real_path_xyz123" 2>/dev/null || echo "000")
            bstatus="${bstatus: -3}"  # curl -w already prints 000 on failure AND exits non-zero, so the || echo "000" fallback doubles it to 000000 - truncate to be safe either way
            BASE_STATUS["$host"]="$bstatus"
            BASE_LEN["$host"]=$(wc -c < /tmp/base_body 2>/dev/null || echo 0)
          done < "$INPUT"
          : > "$RD/files/sensitive.txt"
          for path in "/.env" "/.git/config" "/wp-config.php" "/config.json" "/credentials.json" "/phpinfo.php" "/info.php" "/Dockerfile" "/.aws/credentials" "/backup.sql"; do
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              status=$(curl -sk -o /tmp/resp_body --max-time 5 -w "%{http_code}" "${host}${path}" 2>/dev/null || echo "000")
              status="${status: -3}"  # curl -w already prints 000 on failure AND exits non-zero, so the || echo "000" fallback doubles it to 000000 - truncate to be safe either way
              [ "$status" != "200" ] && continue
              blen="${BASE_LEN[$host]:-0}"; bstatus="${BASE_STATUS[$host]:-000}"; rlen=$(wc -c < /tmp/resp_body 2>/dev/null || echo 0)
              diff=$(( rlen > blen ? rlen - blen : blen - rlen ))
              # The length-similarity "probably just the generic page" heuristic only makes
              # sense when the BASELINE itself came back 200 (i.e. this host serves a
              # custom "soft 404" for everything, so length is the only signal available).
              # If the baseline was a real error status (404/403/...) and this path came
              # back 200, that status flip is already a strong signal on its own - a short
              # genuine secret file must never be thrown away just for being small.
              if [ "$bstatus" = "200" ] && [ "$blen" -gt 0 ] && [ "$diff" -lt 30 ]; then continue; fi
              grep -qE '(DB_PASSWORD|aws_access_key|client_secret|APP_SECRET|mysql_connect\(|define\(.DB_)' /tmp/resp_body && echo "[SENSITIVE] ${host}${path} (status ${bstatus}->${status})" >> "$RD/files/sensitive.txt"
            done < "$INPUT"
          done
          echo "✅ CORS: $(wc -l < "$RD/cors/vulnerable.txt" 2>/dev/null || echo 0) | Sensitive: $(wc -l < "$RD/files/sensitive.txt" 2>/dev/null || echo 0)"

      - name: "🔌 CMS Fingerprint (WordPress)"
        continue-on-error: true
        timeout-minutes: 8
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          : > "$RD/files/cms_findings.txt"
          if ! grep -qi 'wordpress' "$RD/live/tech.json" 2>/dev/null; then
            echo "ℹ️ No WordPress detected via tech-detect, skipping CMS checks"
          else
            jq -r 'select(.tech!=null) | select(.tech[] | test("(?i)wordpress")) | .url' "$RD/live/tech.json" 2>/dev/null | sort -u > /tmp/wp_hosts.txt
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue

              body=$(curl -sk --max-time 6 "$host/readme.html" 2>/dev/null || echo "")
              ver=$(echo "$body" | grep -oE 'Version [0-9]+(\.[0-9]+)+' | head -1)
              [ -n "$ver" ] && echo "[WP-Version] ${host}/readme.html -> $ver" >> "$RD/files/cms_findings.txt"

              users_json=$(curl -sk --max-time 6 "$host/wp-json/wp/v2/users" 2>/dev/null || echo "")
              if echo "$users_json" | python3 -c "import json,sys; json.load(sys.stdin)" >/dev/null 2>&1; then
                echo "$users_json" | python3 -c "
          import json, sys
          try:
              for u in json.load(sys.stdin):
                  print(f\"[WP-User-Enum] {u.get('slug','?')} (id={u.get('id','?')})\")
          except Exception:
              pass
          " 2>/dev/null | sed "s#^#${host}: #" >> "$RD/files/cms_findings.txt"
              fi

              xr=$(curl -sk --max-time 6 "$host/xmlrpc.php" 2>/dev/null || echo "")
              echo "$xr" | grep -qi "XML-RPC server accepts POST" && echo "[WP-XMLRPC] ${host}/xmlrpc.php -> enabled (pingback SSRF/brute-force amplification risk)" >> "$RD/files/cms_findings.txt"
            done < /tmp/wp_hosts.txt

            # Best-effort WPScan pass for deeper plugin/theme/CVE enumeration, IF it's
            # installed. NOTE: this specific invocation could not be installed or
            # empirically tested from this environment (rubygems.org - where the
            # wpscan gem and its dependencies come from - isn't reachable from this
            # sandbox, the same class of restriction that blocked building httpx's Go
            # toolchain earlier in this project). Flags below match the official
            # WPScan CLI docs, cross-checked across several independent sources, but
            # verify the real output shape on the first actual run before trusting it -
            # exactly the kind of assumption that turned out wrong for Nikto's
            # -Format json/xml/csv earlier.
            if command -v wpscan >/dev/null 2>&1; then
              first_wp_host="$(head -1 /tmp/wp_hosts.txt 2>/dev/null)"
              if [ -n "$first_wp_host" ]; then
                token_args=()
                [ -n "${WPSCAN_API_TOKEN:-}" ] && token_args=(--api-token "$WPSCAN_API_TOKEN")
                timeout 180 wpscan --url "$first_wp_host" --enumerate vp,vt,u --random-user-agent \
                  --format json --output /tmp/wpscan_out.json "${token_args[@]}" >/dev/null 2>>"$RD/logs/wpscan.log" || true
                if [ -s /tmp/wpscan_out.json ]; then
                  python3 -c "
          import json
          try:
              d = json.load(open('/tmp/wpscan_out.json'))
              ver = (d.get('version') or {}).get('number')
              if ver: print(f'[WP-Version-Confirmed] {ver}')
              for name, p in (d.get('plugins') or {}).items():
                  vulns = p.get('vulnerabilities') or []
                  if vulns:
                      print(f'[WP-Vulnerable-Plugin] {name}: {vulns[0].get(\"title\",\"?\")}')
          except Exception as e:
              print(f'⚠️ Could not parse wpscan output: {e}')
          " >> "$RD/files/cms_findings.txt" 2>/dev/null || true
                fi
              fi
            else
              echo "ℹ️ wpscan not installed, relying on the lightweight checks above only"
            fi
          fi
          echo "✅ CMS findings: $(wc -l < "$RD/files/cms_findings.txt" 2>/dev/null || echo 0)"

      - name: "📸 Screenshots"
        continue-on-error: true
        timeout-minutes: 18
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          mkdir -p "$RD/screenshots"
          if [ -s "$RD/live/live.txt" ] && command -v gowitness >/dev/null; then
            mode="${HUNTING_MODE:-normal}"
            budget=$({ [ "$mode" = "light" ] && echo 240; } || { [ "$mode" = "aggressive" ] && echo 900; } || echo 500)
            total=$(wc -l < "$RD/live/live.txt")
            # No arbitrary cap on which hosts get in - gowitness is a batch tool with
            # its own internal concurrency, so it works through however many were
            # actually found (all $total of them); the time budget below (which
            # scales with mode) bounds the total work, not a fixed host count that
            # would silently ignore most of a large real result set.
            cp "$RD/live/live.txt" /tmp/screenshot_targets.txt
            timeout "$budget" gowitness scan file -f /tmp/screenshot_targets.txt \
              -s "$RD/screenshots" --write-csv --write-csv-file "$RD/screenshots/index.csv" \
              -t 15 --timeout 15 --disable-db 2>>"$RD/logs/gowitness.log" || true
            echo "ℹ️ Attempted screenshots for $total discovered live host(s) within a ${budget}s budget"
          fi
          echo "✅ Screenshots captured: $(find "$RD/screenshots" -iname '*.png' 2>/dev/null | wc -l)"

      - name: "☢️ Nuclei Vulnerability Scan"
        continue-on-error: true
        timeout-minutes: 75
        run: |
          # Nuclei opens one file handle per template while loading its (6000+)
          # template set, and we run 3 passes in this same step - the runner's
          # default ulimit (often 1024) gets exhausted, causing thousands of
          # templates to silently fail with "too many open files" (confirmed in
          # a real run's log: 70,000+ such errors). Raise it before nuclei runs.
          ulimit -n 65535 2>/dev/null || ulimit -n 8192 2>/dev/null || true
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/live/live.txt"
          [ -s "$INPUT" ] || { echo "https://${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          AUTH_ARGS=()
          [ -n "${{ env.AUTH_COOKIE }}" ] && AUTH_ARGS+=(-H "Cookie: ${{ env.AUTH_COOKIE }}")
          [ -n "${{ env.AUTH_HEADER }}" ] && AUTH_ARGS+=(-H "${{ env.AUTH_HEADER }}")
          nuclei -l "$INPUT" -severity critical,high,medium -H "User-Agent: $SCAN_USER_AGENT" "${AUTH_ARGS[@]}" -mhe 150 -rl 40 -c 15 -timeout 10 -retries 1 -stats -si 30 -jsonl -o "$RD/nuclei/findings.jsonl" 2>>"$RD/logs/nuclei.log" || true
          # Complement the broad severity-based pass with a tech-aware pass: nuclei's
          # -as (automatic-scan) reads the detected tech stack and only runs templates
          # relevant to it (e.g. WordPress-specific checks only if WordPress was
          # actually detected) - catches tech-specific issues the broad pass's template
          # selection might not prioritize, without wasting time on irrelevant checks.
          if [ -s "$RD/live/tech.json" ]; then
            nuclei -l "$INPUT" -as -H "User-Agent: $SCAN_USER_AGENT" "${AUTH_ARGS[@]}" -mhe 150 -rl 40 -c 15 -timeout 10 -retries 1 -jsonl -o "$RD/nuclei/findings_tech.jsonl" 2>>"$RD/logs/nuclei.log" || true
            cat "$RD/nuclei/findings_tech.jsonl" 2>/dev/null >> "$RD/nuclei/findings.jsonl" || true
          fi
          # The severity filter above skips info/low templates entirely - but that's
          # exactly where "exposed .git", "exposed admin panel", "default credentials
          # page" live in nuclei-templates. Those are high recon value even though
          # their official severity is low, so run them as their own unrestricted-
          # severity pass instead of losing them to the severity filter.
          nuclei -l "$INPUT" -tags exposure,panel,config,default-login,exposed-panels -H "User-Agent: $SCAN_USER_AGENT" "${AUTH_ARGS[@]}" -mhe 150 -rl 40 -c 15 -timeout 10 -retries 1 -jsonl -o "$RD/nuclei/findings_exposure.jsonl" 2>>"$RD/logs/nuclei.log" || true
