          if os.environ.get("TOKENROUTER_API_KEY",""): providers.append({"name":"TokenRouter","url":"https://api.tokenrouter.com/v1/chat/completions","headers":{"Authorization":f"Bearer {os.environ['TOKENROUTER_API_KEY']}","content-type":"application/json"},"body_tpl":lambda p:json.dumps({"model":os.environ.get("TOKENROUTER_MODEL_NAME","moonshotai/kimi-k3-free"),"max_tokens":8192,"messages":[{"role":"user","content":p}]}).encode(),"extract":lambda r:r["choices"][0]["message"]["content"]})
          def rf(path,cap=3000):
