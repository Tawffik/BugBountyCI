# DEPRECATED (2026-10-09): Subdomain Monitor is migrating to Tawffik/VulnRadar
# (docs/SUBDOMAIN_MONITOR_AND_NUCLEI.md). Do not expand this workflow.
# Prefer VulnRadar targets/*.yaml + pipeline/monitor baseline.
# This file remains temporarily for historical runs / manual use until VulnRadar monitor workflow ships.

name: "Subdomain Monitor"

on:
  # Schedule disabled until reliability is proven.
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      domain:
        description: 'Optional single domain override (leave empty to scan all targets in targets-bb.txt)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: subdomain-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: sengi-standard-2-ubuntu-2404
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Restore Tool Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-submon-${{ runner.os }}-v4

      - name: Install Tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@v2.6.6
          go install github.com/projectdiscovery/httpx/cmd/httpx@v1.6.8
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@v1.2.1
          go install github.com/PentestPad/subzy@latest
          echo "Tools installed"

      - name: Update PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Resolve target inventory
        id: targets
        env:
          INPUT_DOMAIN: ${{ github.event.inputs.domain }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/submon
          TARGETS_FILE=/tmp/submon/targets.txt
          : > "$TARGETS_FILE"

          is_valid_domain() {
            local d="$1"
            [[ -z "$d" ]] && return 1
            [[ "$d" =~ [[:space:]/\\\$\`\;\|\&\<\>\(\)\{\}\[\]\'\"\*] ]] && return 1
            [[ "$d" =~ ^https?:// ]] && return 1
            [[ "$d" =~ ^[0-9.]+$ ]] && return 1
            [[ "$d" =~ ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)*[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]] || return 1
            return 0
          }

          normalize_domain() {
            echo "$1" | tr '[:upper:]' '[:lower:]' | sed 's/^\*\.//' | xargs
          }

          add_target() {
            local raw="$1"
            local d
            d=$(normalize_domain "$raw")
            if ! is_valid_domain "$d"; then
              echo "::warning::Rejecting malformed target: '$raw'"
              return 0
            fi
            if ! grep -qxF "$d" "$TARGETS_FILE" 2>/dev/null; then
              echo "$d" >> "$TARGETS_FILE"
            fi
          }

          if [[ -n "${INPUT_DOMAIN:-}" ]]; then
            echo "Mode: single-target override"
            add_target "$INPUT_DOMAIN"
          elif [[ -f targets-bb.txt ]]; then
            echo "Mode: bug bounty inventory from targets-bb.txt"
            while IFS= read -r line || [[ -n "$line" ]]; do
              line=$(echo "$line" | sed 's/#.*//' | xargs)
              [[ -z "$line" ]] && continue
              add_target "$line"
            done < targets-bb.txt
          else
            echo "::error::targets-bb.txt not found. Create it at repo root with one domain per line."
            exit 1
          fi

          COUNT=$(wc -l < "$TARGETS_FILE" | tr -d ' ')
          if [[ "$COUNT" -eq 0 ]]; then
            echo "::error::No valid targets. Add domains to targets-bb.txt or pass a domain override."
            exit 1
          fi

          echo "Authorized targets ($COUNT):"
          cat "$TARGETS_FILE"
          echo "TARGET_COUNT=$COUNT" >> "$GITHUB_ENV"
          echo "TARGETS_FILE=$TARGETS_FILE" >> "$GITHUB_ENV"

      - name: Scan all targets
        id: scan
        run: |
          set -uo pipefail
          TARGETS_FILE="${TARGETS_FILE:-/tmp/submon/targets.txt}"
          RUN_TS=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          RUN_DIR=/tmp/submon/run
          mkdir -p "$RUN_DIR" results
          AGG_SUMMARY="$RUN_DIR/aggregate.md"
          AGG_JSON="$RUN_DIR/aggregate.json"
          echo "[]" > "$AGG_JSON"

          COMPLETED=0
          INCOMPLETE=0
          TOTAL_NEW=0
          TOTAL_REMOVED=0
          TOTAL_TAKEOVERS=0
          BASELINES=0

          is_valid_domain() {
            local d="$1"
            [[ -z "$d" ]] && return 1
            [[ "$d" =~ [[:space:]/\\\$\`\;\|\&\<\>\(\)\{\}\[\]\'\"\*] ]] && return 1
            [[ "$d" =~ ^https?:// ]] && return 1
            [[ "$d" =~ ^[0-9.]+$ ]] && return 1
            [[ "$d" =~ ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)*[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]] || return 1
            return 0
          }

          process_target() {
            local DOMAIN="$1"
            local TDIR="/tmp/submon/${DOMAIN}"
            local RDIR="results/${DOMAIN}"
            local STATUS="COMPLETE"
            local REASON=""
            local DISCOVERY_OK=0
            local DNS_OK=0
            local HTTP_OK=0
            local TAKEOVER_OK=0
            local IS_BASELINE=0
            local NEW=0
            local REMOVED=0
            local TAKEOVERS=0
            local TOTAL=0
            local LIVE=0
            local RESOLVED_COUNT=0

            echo ""
            echo "======== TARGET: $DOMAIN ========"
            mkdir -p "$TDIR" "$RDIR"
            [[ -f "$RDIR/prev.txt" ]] || touch "$RDIR/prev.txt"
            PREV_COUNT=$(wc -l < "$RDIR/prev.txt" | tr -d ' ' || echo 0)

            set +e
            subfinder -d "$DOMAIN" -all -silent -o "$TDIR/subs_raw.txt" 2>"$TDIR/subfinder.err"
            SF_RC=$?
            set +e

            if [[ $SF_RC -ne 0 ]]; then
              STATUS="INCOMPLETE"
              REASON="subfinder exit code $SF_RC"
              echo "::warning::[$DOMAIN] discovery failed: $REASON"
            else
              grep -iE "^([a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?\.)+${DOMAIN}$" \
                "$TDIR/subs_raw.txt" 2>/dev/null \
                | tr '[:upper:]' '[:lower:]' | sort -u > "$TDIR/subs.txt" || true
              echo "$DOMAIN" >> "$TDIR/subs.txt"
              sort -u "$TDIR/subs.txt" -o "$TDIR/subs.txt"
              DISCOVERY_OK=1
              echo "[$DOMAIN] discovery OK: $(wc -l < "$TDIR/subs.txt") candidates"
            fi

            if [[ "$STATUS" == "INCOMPLETE" ]]; then
              {
                echo "# Recon Summary: $DOMAIN"
                echo "Last Updated: $RUN_TS"
                echo "Status: INCOMPLETE"
                echo "Reason: $REASON"
                echo "Previous trusted baseline count: $PREV_COUNT"
                echo ""
                echo "Trusted baseline was NOT overwritten."
              } > "$RDIR/summary.md"
              [[ -f "$TDIR/subs_raw.txt" ]] && cp "$TDIR/subs_raw.txt" "$RDIR/subs_raw_failed.txt" 2>/dev/null || true
              INCOMPLETE=$((INCOMPLETE + 1))
              jq --arg d "$DOMAIN" --arg s "$STATUS" --arg r "$REASON" --argjson p "$PREV_COUNT" \
                '. + [{"domain":$d,"status":$s,"reason":$r,"prev":$p,"new":0,"removed":0,"takeovers":0,"baseline":false}]' \
                "$AGG_JSON" > "$AGG_JSON.tmp" && mv "$AGG_JSON.tmp" "$AGG_JSON"
              return 0
            fi

            set +e
            if [[ -s "$TDIR/subs.txt" ]]; then
              dnsx -l "$TDIR/subs.txt" -silent -a -resp -o "$TDIR/resolved_raw.txt" 2>"$TDIR/dnsx.err"
              DNS_RC=$?
              # dnsx -resp may print "host [ip]"; keep hostname only
              if [[ -f "$TDIR/resolved_raw.txt" ]]; then
                awk '{print $1}' "$TDIR/resolved_raw.txt" | sed 's/\.$//' | sort -u > "$TDIR/resolved.txt"
              else
                : > "$TDIR/resolved.txt"
              fi
            else
              : > "$TDIR/resolved.txt"
              DNS_RC=0
            fi
            set +e

            RESOLVED_PRE=$(wc -l < "$TDIR/resolved.txt" 2>/dev/null | tr -d ' ' || echo 0)
            # No fallback to discovery list. DNS failure or zero-from-nonempty discovery = incomplete.
            if [[ $DNS_RC -ne 0 ]]; then
              STATUS="INCOMPLETE"
              REASON="dnsx exit code $DNS_RC"
              DNS_OK=0
              echo "::warning::[$DOMAIN] DNS incomplete: $REASON"
            elif [[ "$RESOLVED_PRE" -eq 0 && -s "$TDIR/subs.txt" ]]; then
              STATUS="INCOMPLETE"
              REASON="dnsx returned 0 resolved hosts from $(wc -l < "$TDIR/subs.txt" | tr -d ' ') discovery candidates (no fallback)"
              DNS_OK=0
              echo "::warning::[$DOMAIN] DNS incomplete: $REASON"
            else
              sort -u "$TDIR/resolved.txt" -o "$TDIR/resolved.txt" 2>/dev/null || true
              DNS_OK=1
            fi

            if [[ "$STATUS" == "INCOMPLETE" ]]; then
              {
                echo "# Recon Summary: $DOMAIN"
                echo "Last Updated: $RUN_TS"
                echo "Status: INCOMPLETE"
                echo "Reason: $REASON"
                echo "Previous trusted baseline count: $PREV_COUNT"
                echo ""
                echo "Trusted baseline was NOT overwritten."
              } > "$RDIR/summary.md"
              INCOMPLETE=$((INCOMPLETE + 1))
              jq --arg d "$DOMAIN" --arg s "$STATUS" --arg r "$REASON" --argjson p "$PREV_COUNT" \
                '. + [{"domain":$d,"status":$s,"reason":$r,"prev":$p,"new":0,"removed":0,"takeovers":0,"baseline":false}]' \
                "$AGG_JSON" > "$AGG_JSON.tmp" && mv "$AGG_JSON.tmp" "$AGG_JSON"
              return 0
            fi

            RESOLVED_COUNT=$(wc -l < "$TDIR/resolved.txt" | tr -d ' ' || echo 0)
            TOTAL=$RESOLVED_COUNT

            if [[ "$PREV_COUNT" -gt 20 ]] && [[ "$RESOLVED_COUNT" -eq 0 ]]; then
              STATUS="INCOMPLETE"
              REASON="suspicious empty result (prev=$PREV_COUNT, current=0)"
              echo "::warning::[$DOMAIN] $REASON — preserving baseline"
              {
                echo "# Recon Summary: $DOMAIN"
                echo "Last Updated: $RUN_TS"
                echo "Status: INCOMPLETE"
                echo "Reason: $REASON"
                echo "Previous trusted baseline count: $PREV_COUNT"
                echo ""
                echo "Trusted baseline was NOT overwritten."
              } > "$RDIR/summary.md"
              INCOMPLETE=$((INCOMPLETE + 1))
              jq --arg d "$DOMAIN" --arg s "$STATUS" --arg r "$REASON" --argjson p "$PREV_COUNT" \
                '. + [{"domain":$d,"status":$s,"reason":$r,"prev":$p,"new":0,"removed":0,"takeovers":0,"baseline":false}]' \
                "$AGG_JSON" > "$AGG_JSON.tmp" && mv "$AGG_JSON.tmp" "$AGG_JSON"
              return 0
            fi

            set +e
            if [[ -s "$TDIR/resolved.txt" ]]; then
              httpx -l "$TDIR/resolved.txt" \
                -silent -status-code -title -tech-detect \
                -threads 30 -timeout 8 -json \
                -o "$TDIR/live_raw.json" 2>"$TDIR/httpx.err"
              HX_RC=$?
            else
              : > "$TDIR/live_raw.json"
              HX_RC=0
            fi
            set +e

            if [[ $HX_RC -ne 0 ]]; then
              HTTP_OK=0
              echo "::warning::[$DOMAIN] httpx exited $HX_RC"
              touch "$TDIR/live_hosts.txt" "$TDIR/live.txt"
              # When resolved hosts exist, HTTP is health-bearing
              if [[ "$RESOLVED_COUNT" -gt 0 ]]; then
                STATUS="INCOMPLETE"
                REASON="httpx exit code $HX_RC"
                echo "::warning::[$DOMAIN] HTTP incomplete: $REASON — baseline will not be updated"
              fi
            else
              HTTP_OK=1
              jq -r 'select(.url != null) | .url' "$TDIR/live_raw.json" 2>/dev/null \
                | sort -u > "$TDIR/live_hosts.txt" || true
              jq -r 'select(.url != null) | [.url, (.status_code|tostring), (.title // "")] | @tsv' \
                "$TDIR/live_raw.json" 2>/dev/null | sort > "$TDIR/live.txt" || true
            fi
            LIVE=$(wc -l < "$TDIR/live_hosts.txt" 2>/dev/null | tr -d ' ' || echo 0)

            set +e
            if [[ -s "$TDIR/resolved.txt" ]]; then
              subzy run \
                --targets "$TDIR/resolved.txt" \
                --concurrency 15 \
                --hide_fails \
                --verify_ssl \
                --output "$TDIR/subzy_raw.json" 2>"$TDIR/subzy.err"
              SZ_RC=$?
            else
              : > "$TDIR/subzy_raw.json"
              SZ_RC=0
            fi
            set +e

            if [[ $SZ_RC -ne 0 ]]; then
              TAKEOVER_OK=0
              echo "::warning::[$DOMAIN] subzy exited $SZ_RC"
              : > "$TDIR/takeovers.txt"
              # When resolved hosts exist, takeover is health-bearing
              if [[ "$RESOLVED_COUNT" -gt 0 ]]; then
                STATUS="INCOMPLETE"
                REASON="subzy exit code $SZ_RC"
                echo "::warning::[$DOMAIN] Takeover incomplete: $REASON — baseline will not be updated"
              fi
            else
              TAKEOVER_OK=1
              if [[ -s "$TDIR/subzy_raw.json" ]]; then
                if jq -e 'type == "array"' "$TDIR/subzy_raw.json" >/dev/null 2>&1; then
                  jq -r '.[] | select(.vulnerable == true) | "[TAKEOVER] \(.subdomain) => \(.service)"' \
                    "$TDIR/subzy_raw.json" > "$TDIR/takeovers.txt" 2>/dev/null || true
                else
                  grep -s '.' "$TDIR/subzy_raw.json" \
                    | jq -r 'select(.vulnerable == true) | "[TAKEOVER] \(.subdomain) => \(.service)"' \
                    > "$TDIR/takeovers.txt" 2>/dev/null || true
                fi
              else
                : > "$TDIR/takeovers.txt"
              fi
            fi
            TAKEOVERS=$(wc -l < "$TDIR/takeovers.txt" 2>/dev/null | tr -d ' ' || echo 0)

            # ---- TRUSTED BASELINE GATE ----
            # Only proceed to update prev.txt when all required stages are healthy.
            # DNS/HTTP/Takeover incompleteness already set STATUS=INCOMPLETE above when resolved>0.
            if [[ "$STATUS" == "INCOMPLETE" ]]; then
              {
                echo "# Recon Summary: $DOMAIN"
                echo "Last Updated: $RUN_TS"
                echo "Status: INCOMPLETE"
                echo "Reason: $REASON"
                echo "Previous trusted baseline count: $PREV_COUNT"
                echo "Discovery OK: $DISCOVERY_OK | DNS OK: $DNS_OK | HTTP OK: $HTTP_OK | Takeover OK: $TAKEOVER_OK"
                echo ""
                echo "Trusted baseline was NOT overwritten."
              } > "$RDIR/summary.md"
              # Preserve any partial evidence without touching prev.txt
              [[ -f "$TDIR/resolved.txt" ]] && cp "$TDIR/resolved.txt" "$RDIR/resolved_incomplete.txt" 2>/dev/null || true
              [[ -f "$TDIR/live_hosts.txt" ]] && cp "$TDIR/live_hosts.txt" "$RDIR/live_hosts_incomplete.txt" 2>/dev/null || true
              [[ -f "$TDIR/takeovers.txt" ]] && cp "$TDIR/takeovers.txt" "$RDIR/takeovers_incomplete.txt" 2>/dev/null || true
              INCOMPLETE=$((INCOMPLETE + 1))
              jq --arg d "$DOMAIN" --arg s "$STATUS" --arg r "$REASON" --argjson p "$PREV_COUNT" \
                --argjson n 0 --argjson rm 0 --argjson tk 0 \
                --argjson dok "$DISCOVERY_OK" --argjson dnok "$DNS_OK" --argjson hok "$HTTP_OK" --argjson tok "$TAKEOVER_OK" \
                '. + [{"domain":$d,"status":$s,"reason":$r,"prev":$p,"new":$n,"removed":$rm,"takeovers":$tk,"baseline":false,"discovery_ok":$dok,"dns_ok":$dnok,"http_ok":$hok,"takeover_ok":$tok}]' \
                "$AGG_JSON" > "$AGG_JSON.tmp" && mv "$AGG_JSON.tmp" "$AGG_JSON"
              echo "[$DOMAIN] INCOMPLETE reason=$REASON — prev.txt preserved"
              return 0
            fi

            sort -u "$TDIR/resolved.txt" -o "$TDIR/resolved.txt"
            sort -u "$RDIR/prev.txt" -o "$RDIR/prev.txt" 2>/dev/null || true

            if [[ "$PREV_COUNT" -eq 0 ]]; then
              IS_BASELINE=1
              NEW=0
              REMOVED=0
              : > "$TDIR/new_subs.txt"
              : > "$TDIR/removed_subs.txt"
              echo "[$DOMAIN] FIRST BASELINE ($RESOLVED_COUNT assets)"
            else
              sort "$TDIR/resolved.txt" -o "$TDIR/resolved_sorted.txt"
              sort "$RDIR/prev.txt" -o "$TDIR/prev_sorted.txt"
              comm -23 "$TDIR/resolved_sorted.txt" "$TDIR/prev_sorted.txt" > "$TDIR/new_subs.txt"
              comm -23 "$TDIR/prev_sorted.txt" "$TDIR/resolved_sorted.txt" > "$TDIR/removed_subs.txt"
              NEW=$(wc -l < "$TDIR/new_subs.txt" | tr -d ' ')
              REMOVED=$(wc -l < "$TDIR/removed_subs.txt" | tr -d ' ')
            fi

            # Trusted write — only reached when STATUS is still COMPLETE
            cp "$TDIR/resolved.txt"     "$RDIR/subdomains.txt"
            cp "$TDIR/resolved.txt"     "$RDIR/prev.txt"
            cp "$TDIR/live_hosts.txt"   "$RDIR/live_hosts.txt" 2>/dev/null || touch "$RDIR/live_hosts.txt"
            cp "$TDIR/live.txt"         "$RDIR/live.txt"       2>/dev/null || touch "$RDIR/live.txt"
            cp "$TDIR/new_subs.txt"     "$RDIR/new.txt"
            cp "$TDIR/removed_subs.txt" "$RDIR/removed.txt" 2>/dev/null || touch "$RDIR/removed.txt"
            cp "$TDIR/takeovers.txt"    "$RDIR/takeovers.txt"

            {
              echo "# Recon Summary: $DOMAIN"
              echo "Last Updated: $RUN_TS"
              echo "Status: COMPLETE"
              if [[ "$IS_BASELINE" -eq 1 ]]; then
                echo "Mode: FIRST BASELINE"
              fi
              echo ""
              echo "| Metric | Count |"
              echo "|--------|-------|"
              echo "| Total Subdomains | $TOTAL |"
              echo "| Live Hosts | $LIVE |"
              echo "| New (this run) | $NEW |"
              echo "| Removed | $REMOVED |"
              echo "| Confirmed Takeovers | $TAKEOVERS |"
              echo ""
              echo "Discovery OK: $DISCOVERY_OK | DNS OK: $DNS_OK | HTTP OK: $HTTP_OK | Takeover OK: $TAKEOVER_OK"
              echo "Baseline updated: YES"
            } > "$RDIR/summary.md"

            COMPLETED=$((COMPLETED + 1))
            TOTAL_NEW=$((TOTAL_NEW + NEW))
            TOTAL_REMOVED=$((TOTAL_REMOVED + REMOVED))
            TOTAL_TAKEOVERS=$((TOTAL_TAKEOVERS + TAKEOVERS))
            [[ "$IS_BASELINE" -eq 1 ]] && BASELINES=$((BASELINES + 1))

            jq --arg d "$DOMAIN" --arg s "COMPLETE" --arg r "" \
              --argjson p "$PREV_COUNT" --argjson n "$NEW" --argjson rm "$REMOVED" \
              --argjson tk "$TAKEOVERS" --argjson t "$TOTAL" --argjson l "$LIVE" \
              --argjson b "$IS_BASELINE" \
              '. + [{"domain":$d,"status":$s,"reason":$r,"prev":$p,"new":$n,"removed":$rm,"takeovers":$tk,"total":$t,"live":$l,"baseline":($b==1)}]' \
              "$AGG_JSON" > "$AGG_JSON.tmp" && mv "$AGG_JSON.tmp" "$AGG_JSON"

            echo "[$DOMAIN] COMPLETE total=$TOTAL live=$LIVE new=$NEW removed=$REMOVED takeovers=$TAKEOVERS baseline=$IS_BASELINE"
          }

          set +e
          while IFS= read -r DOMAIN || [[ -n "$DOMAIN" ]]; do
            DOMAIN=$(echo "$DOMAIN" | xargs)
            [[ -z "$DOMAIN" ]] && continue
            if ! is_valid_domain "$DOMAIN"; then
              echo "::warning::Skipping invalid domain: $DOMAIN"
              continue
            fi
            # Never let a single target abort the whole run (set -e must stay off)
            set +e
            process_target "$DOMAIN"
            PT_RC=$?
            if [[ $PT_RC -ne 0 ]]; then
              echo "::error::Unexpected failure processing $DOMAIN (rc=$PT_RC) — continuing"
              INCOMPLETE=$((INCOMPLETE + 1))
            fi
            set +e
          done < "$TARGETS_FILE"

          {
            echo "# Subdomain Monitor Run"
            echo "Timestamp: $RUN_TS"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Targets scanned | $TARGET_COUNT |"
            echo "| Completed | $COMPLETED |"
            echo "| Incomplete | $INCOMPLETE |"
            echo "| Baselines | $BASELINES |"
            echo "| New assets | $TOTAL_NEW |"
            echo "| Removed | $TOTAL_REMOVED |"
            echo "| Takeovers | $TOTAL_TAKEOVERS |"
            echo ""
            echo "## Per-target"
            jq -r '.[] | "- **\(.domain)**: \(.status)" + (if .status=="INCOMPLETE" then " — \(.reason)" else " (new=\(.new) removed=\(.removed) takeovers=\(.takeovers))" end)' "$AGG_JSON"
          } > "$AGG_SUMMARY"
          cp "$AGG_SUMMARY" results/submon_run_summary.md

          echo "COMPLETED=$COMPLETED" >> "$GITHUB_ENV"
          echo "INCOMPLETE=$INCOMPLETE" >> "$GITHUB_ENV"
          echo "TOTAL_NEW=$TOTAL_NEW" >> "$GITHUB_ENV"
          echo "TOTAL_REMOVED=$TOTAL_REMOVED" >> "$GITHUB_ENV"
          echo "TOTAL_TAKEOVERS=$TOTAL_TAKEOVERS" >> "$GITHUB_ENV"
          echo "BASELINES=$BASELINES" >> "$GITHUB_ENV"
          echo "RUN_TS=$RUN_TS" >> "$GITHUB_ENV"

          cp "$AGG_JSON" /tmp/submon/aggregate.json
          cp "$AGG_SUMMARY" /tmp/submon/aggregate.md

          echo "==== RUN COMPLETE ===="
          cat "$AGG_SUMMARY"

      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ || true
          if git diff --staged --quiet; then
            echo "No repository changes to commit"
          else
            git commit -m "Subdomain Monitor update $(date -u +'%Y-%m-%d %H:%M')"
            git push || echo "::warning::git push failed (non-fatal)"
          fi

      - name: Discord notification
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -uo pipefail
          if [[ -z "${WEBHOOK:-}" ]]; then
            echo "DISCORD_WEBHOOK not set — skipping notification"
            echo "Results are still in results/<domain>/ and results/submon_run_summary.md"
            exit 0
          fi

          AGG=/tmp/submon/aggregate.json
          if [[ ! -f "$AGG" ]]; then
            # Fallback minimal alert if scan step crashed before aggregate
            jq -n \
              --arg title "Subdomain Monitor — no aggregate data" \
              --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --arg sha "${{ github.sha }}" \
            '{
              username: "SubMonitor",
              embeds: [{
                title: $title,
                color: 15158332,
                description: ("Check Actions logs: " + $url),
                fields: [{name:"Commit", value:$sha, inline:false}]
              }]
            }' | curl -s -X POST "$WEBHOOK" -H "Content-Type: application/json" -d @- || true
            exit 0
          fi

          COMPLETED="${COMPLETED:-0}"
          INCOMPLETE="${INCOMPLETE:-0}"
          TOTAL_NEW="${TOTAL_NEW:-0}"
          TOTAL_REMOVED="${TOTAL_REMOVED:-0}"
          TOTAL_TAKEOVERS="${TOTAL_TAKEOVERS:-0}"
          BASELINES="${BASELINES:-0}"
          TARGET_COUNT="${TARGET_COUNT:-0}"
          RUN_TS="${RUN_TS:-unknown}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Full per-target lines (trim to Discord field limit ~1024)
          PER_TARGET=$(jq -r '
            .[] |
            if .status == "INCOMPLETE" then
              "❌ \(.domain): INCOMPLETE — \(.reason)"
            elif .baseline == true then
              "📌 \(.domain): BASELINE total=\(.total // 0) live=\(.live // 0)"
            elif (.new > 0 or .removed > 0 or .takeovers > 0) then
              "🔔 \(.domain): new=\(.new) removed=\(.removed) takeovers=\(.takeovers) live=\(.live // 0)"
            else
              "✅ \(.domain): no change (total=\(.total // 0) live=\(.live // 0))"
            end
          ' "$AGG" 2>/dev/null | head -c 900)
          [[ -z "$PER_TARGET" ]] && PER_TARGET="(no per-target data)"

          NEW_DETAIL=$(jq -r '
            [.[] | select(.new > 0)] |
            if length == 0 then "None"
            else map("• \(.domain): +\(.new)") | join("\n")
            end
          ' "$AGG" 2>/dev/null | head -c 500)
          [[ -z "$NEW_DETAIL" ]] && NEW_DETAIL="None"

          TAKEOVER_DETAIL=$(jq -r '
            [.[] | select(.takeovers > 0)] |
            if length == 0 then "None"
            else map("• \(.domain): \(.takeovers)") | join("\n")
            end
          ' "$AGG" 2>/dev/null | head -c 400)
          [[ -z "$TAKEOVER_DETAIL" ]] && TAKEOVER_DETAIL="None"

          INCOMPLETE_LIST=$(jq -r '
            [.[] | select(.status=="INCOMPLETE")] |
            if length == 0 then "None"
            else map("• \(.domain): \(.reason)") | join("\n")
            end
          ' "$AGG" 2>/dev/null | head -c 500)
          [[ -z "$INCOMPLETE_LIST" ]] && INCOMPLETE_LIST="None"

          COLOR=5814783
          [[ "$TOTAL_TAKEOVERS" != "0" ]] && COLOR=15158332
          [[ "$INCOMPLETE" != "0" ]] && COLOR=16776960
          [[ "$BASELINES" != "0" && "$TOTAL_NEW" == "0" && "$TOTAL_REMOVED" == "0" ]] && COLOR=3447003

          # Always notify when we have aggregate (even pure baselines / no-change)
          # so you can see the run outcome without opening Actions every time.
          DESC="Targets **${TARGET_COUNT}** · Done **${COMPLETED}** · Incomplete **${INCOMPLETE}** · Baselines **${BASELINES}**"
          DESC="${DESC}\nNew **${TOTAL_NEW}** · Removed **${TOTAL_REMOVED}** · Takeovers **${TOTAL_TAKEOVERS}**"
          DESC="${DESC}\n[Open Actions run](${RUN_URL})"

          jq -n \
            --arg title "Subdomain Monitor" \
            --arg desc "$DESC" \
            --arg ts "$RUN_TS" \
            --arg pt "$PER_TARGET" \
            --arg nd "$NEW_DETAIL" \
            --arg td "$TAKEOVER_DETAIL" \
            --arg il "$INCOMPLETE_LIST" \
            --arg url "$RUN_URL" \
            --argjson color "$COLOR" \
          '{
            username: "SubMonitor",
            content: null,
            embeds: [{
              title: $title,
              description: $desc,
              color: $color,
              fields: [
                {name: "Per-target status", value: $pt, inline: false},
                {name: "New assets", value: $nd, inline: false},
                {name: "Takeovers", value: $td, inline: false},
                {name: "Incomplete", value: $il, inline: false},
                {name: "Timestamp", value: $ts, inline: true},
                {name: "Run", value: $url, inline: false}
              ]
            }]
          }' | curl -s -X POST "$WEBHOOK" \
               -H "Content-Type: application/json" \
               -d @- || echo "::warning::Discord notify failed"

          echo "Discord payload sent (targets=$TARGET_COUNT completed=$COMPLETED incomplete=$INCOMPLETE)"
