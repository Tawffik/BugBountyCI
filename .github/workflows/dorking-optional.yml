name: Optional Dorking (RRP-4)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Domain or org string for dork substitution (TARGET)"
        required: true
        type: string
      max_results:
        description: "Max results per dork"
        required: false
        default: "5"
        type: string
      sources:
        description: "Comma sources: github,bing (google scraping often blocked on GHA)"
        required: false
        default: "github"
        type: string

permissions:
  contents: read

jobs:
  dorking:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal deps
        run: |
          pip install -q requests beautifulsoup4

      - name: Run dorking engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          mkdir -p results/dorking
          # Prefer repo token; operators may set a PAT secret named GITHUB_PAT for higher code-search quota
          TOKEN="${{ secrets.BBCI_GH_TOKEN }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.WORKFLOW_PAT }}"; fi
          if [ -z "$TOKEN" ]; then TOKEN="${GITHUB_TOKEN}"; fi
          # Contract runner (provider status + LEAD only; never auto-Hunter)
          python3 scripts/run_dorking_optional.py \
            --target "$TARGET" \
            --output results/dorking \
            --token "$TOKEN" \
            --max-per-query "${{ inputs.max_results }}" || true
          # Legacy engine kept as secondary optional pass (github source only)
          if [ -f docs/dorking_engine.py ]; then
            python3 docs/dorking_engine.py \
              --target "$TARGET" \
              --dorks docs/dorks_rrp4_minimal.txt \
              --output results/dorking/legacy \
              --delay 2 \
              --max-results "${{ inputs.max_results }}" \
              --sources "github" \
              --github-token "$TOKEN" || true
          fi
          echo "Dorking finished (non-fatal empty OK). See results/dorking/summary.json"

      - name: Upload dorking artifact
        uses: actions/upload-artifact@v4
        with:
          name: dorking-${{ inputs.target }}
          path: results/dorking/
          if-no-files-found: warn
