#!/usr/bin/env bash
set -euo pipefail
IFS=$'\n\t'

TARGET_REPO=""
if [[ $# -gt 0 && "$1" != --* ]]; then
    TARGET_REPO="$1"
    shift
fi

if [[ -z "$TARGET_REPO" ]]; then
    echo ""
    echo "╔══════════════════════════════════════════════════════╗"
    echo "║  🛡️  GitHub Actions Security Auditing Framework   ║"
    echo "╠══════════════════════════════════════════════════════╣"
    echo "║  أدخل المسار الكامل للمجلد المراد فحصه:              ║"
    echo "╚══════════════════════════════════════════════════════╝"
    echo ""
    read -r TARGET_REPO
    if [[ -z "$TARGET_REPO" ]]; then TARGET_REPO="."; fi
fi

if [[ "$TARGET_REPO" == "." ]]; then TARGET_REPO="$(pwd)"; fi
if [[ "$TARGET_REPO" != /* ]]; then
    if [[ -d "$TARGET_REPO" ]]; then TARGET_REPO="$(cd "$TARGET_REPO" && pwd)"; else echo "❌ المسار غير صحيح"; exit 1; fi
fi
if [[ ! -d "$TARGET_REPO" ]]; then echo "❌ المسار غير موجود"; exit 1; fi

REPO_NAME=$(basename "$TARGET_REPO")
echo ""
echo "╔══════════════════════════════════════════════════════╗"
echo "║  🛡️  بدء الفحص الأمني الشامل                        ║"
echo "╠══════════════════════════════════════════════════════╣"
echo "║  الهدف: $REPO_NAME                                   "
echo "║  المسار: $TARGET_REPO                                "
echo "║  التاريخ: $(date '+%Y-%m-%d %H:%M:%S')               "
echo "╚══════════════════════════════════════════════════════╝"
echo ""

RED='\033[0;31m'; GREEN='\033[0;32m'; YELLOW='\033[1;33m'; BLUE='\033[0;34m'; CYAN='\033[0;36m'; MAGENTA='\033[0;35m'; BOLD='\033[1m'; NC='\033[0m'
log_info() { echo -e "${BLUE}[INFO]${NC}  $1"; }
log_ok() { echo -e "${GREEN}[OK]${NC}    $1"; }
log_warn() { echo -e "${YELLOW}[WARN]${NC}  $1"; }
log_error() { echo -e "${RED}[ERROR]${NC} $1"; }
log_step() { echo -e "\n${CYAN}━━━ $1 ━━━${NC}"; }
log_header() { echo -e "\n${MAGENTA}${BOLD}═══ $1 ═══${NC}\n"; }

FINDINGS_DIR="$TARGET_REPO/.security-findings"; REPORT_DIR="$TARGET_REPO/security-reports"; SARIF_DIR="$TARGET_REPO/sarif-outputs"
mkdir -p "$FINDINGS_DIR" "$REPORT_DIR" "$SARIF_DIR"
mkdir -p "$FINDINGS_DIR/wordlists" "$FINDINGS_DIR/ai-enriched"
LOG_FILE="$FINDINGS_DIR/audit-$(date +%Y%m%d-%H%M%S).log"
exec > >(tee -a "$LOG_FILE") 2>&1

log_header "🚀 بدء التشغيل"

install_tools() {
    log_header "📦 PART 1: TOOL INSTALLATION"
    for cmd in git curl python3 jq; do
        if ! command -v "$cmd" &>/dev/null; then log_error "$cmd not installed"; exit 1; fi
        log_ok "$cmd found"
    done
}

