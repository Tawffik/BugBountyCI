run_secrets_scan() {
    log_header "🔑 PART 3: SECRETS SCAN"
    local wd="$FINDINGS_DIR/wordlists"
    
    # Regex scan
    log_step "Regex secret scanning"
    python3 -c "
import json, os, re
sr='$PROJECT_ROOT'; rf='$wd/secrets-regex.json'; of='$FINDINGS_DIR/secrets-regex.json'
with open(rf) as f: p=json.load(f)['patterns']
sk={'.git','node_modules','venv','__pycache__','.terraform','.serverless','dist','build','vendor','third_party','.security-findings','security-reports','sarif-outputs'}
sx={'.pyc','.pyo','.so','.dll','.dylib','.exe','.class','.o','.a','.lib','.obj','.jpg','.jpeg','.png','.gif','.ico','.svg','.woff','.woff2','.ttf','.eot','.mp4','.mp3','.avi','.mov','.pdf','.zip','.tar','.gz','.bz2','.7z','.rar','.min.js','.min.css'}
fs=[]
for rt,dr,fl in os.walk(sr):
    dr[:]=[d for d in dr if d not in sk and not d.startswith('.')]
    for fn in fl:
        fp=os.path.join(rt,fn); rp=os.path.relpath(fp,sr)
        if os.path.splitext(fn)[1].lower() in sx: continue
        try:
            if os.path.getsize(fp)>1048576: continue
        except: continue
        try:
            with open(fp,'r',errors='ignore') as f: ct=f.read()
        except: continue
        ln=ct.split('\n')
        for pat in p:
            try: rx=re.compile(pat['regex'],re.I)
            except: continue
            for i,line in enumerate(ln,1):
                m=rx.findall(line)
                if m:
                    for mm in m[:2]:
                        ms=mm if isinstance(mm,str) else str(mm)
                        if len(ms)>300: ms=ms[:150]+'...[truncated]'
                        fs.append({'tool':'regex','file':rp,'line':i,'content':ms,'type':pat['id'],'category':'secrets','severity':pat['severity'],'description':pat['description'],'confidence':0.85})
with open(of,'w') as f: json.dump({'tool':'regex','findings':fs},f)
print(f'  Regex: {len(fs)} findings')
"
    
    # Sensitive files
    log_step "Sensitive files scan"
    python3 -c "
import json, os
sr='$PROJECT_ROOT'; lf='$wd/sensitive-files.txt'; of='$FINDINGS_DIR/sens-files.json'
with open(lf) as f:
    raw=[l.strip() for l in f if l.strip() and not l.startswith('#')]
ex=[x for x in raw if not x.startswith('*') and not x.endswith('*')]
pw=[x[:-1] for x in raw if x.endswith('*') and not x.startswith('*')]
sw=[x[1:] for x in raw if x.startswith('*') and not x.endswith('*')]
bw=[x[1:-1] for x in raw if x.startswith('*') and x.endswith('*')]
sk={'.git','node_modules','venv','__pycache__','.security-findings','security-reports','sarif-outputs'}
fs=[]
for rt,dr,fl in os.walk(sr):
    dr[:]=[d for d in dr if d not in sk and not d.startswith('.')]
    for fn in fl:
        rp=os.path.relpath(os.path.join(rt,fn),sr)
        if fn in ex:
            fs.append({'tool':'sens-files','file':rp,'line':0,'content':fn,'type':'sensitive-file','category':'info-disclosure','severity':'HIGH','description':f'Sensitive file: {fn}'}); continue
        for x in pw:
            if fn.startswith(x):
                fs.append({'tool':'sens-files','file':rp,'line':0,'content':fn,'type':'sensitive-file','category':'info-disclosure','severity':'HIGH','description':f'Sensitive file: {fn}'}); break
        for x in sw:
            if fn.endswith(x):
                fs.append({'tool':'sens-files','file':rp,'line':0,'content':fn,'type':'sensitive-file','category':'info-disclosure','severity':'MEDIUM','description':f'Sensitive ext: {fn}'}); break
with open(of,'w') as f: json.dump({'tool':'sens-files','findings':fs},f)
print(f'  Files: {len(fs)} findings')
"
    
    # Internal disclosure
    log_step "Internal disclosure scan"
    python3 -c "
import json, os, re
sr='$PROJECT_ROOT'; pf='$wd/internal-patterns.json'; of='$FINDINGS_DIR/internal.json'
with open(pf) as f: pats=json.load(f)['patterns']
sk={'.git','node_modules','venv','__pycache__','.security-findings','security-reports','sarif-outputs'}
sx={'.pyc','.pyo','.so','.dll','.exe','.class','.o','.a','.jpg','.png','.gif','.ico','.svg','.woff','.ttf','.eot','.mp4','.mp3','.avi','.mov','.pdf','.zip','.tar','.gz','.bz2','.7z','.rar','.min.js','.min.css'}
fs=[]
for rt,dr,fl in os.walk(sr):
    dr[:]=[d for d in dr if d not in sk and not d.startswith('.')]
    for fn in fl:
        fp=os.path.join(rt,fn); rp=os.path.relpath(fp,sr)
        if os.path.splitext(fn)[1].lower() in sx: continue
        try:
            if os.path.getsize(fp)>524288: continue
        except: continue
        try:
            with open(fp,'r',errors='ignore') as f: ct=f.read()
        except: continue
        ln=ct.split('\n')
        for pat in pats:
            try: rx=re.compile(pat['regex'],re.I)
            except: continue
            for i,line in enumerate(ln,1):
                m=rx.findall(line)
                if m:
                    for mm in m[:2]:
                        ms=mm if isinstance(mm,str) else str(mm)
                        fs.append({'tool':'internal','file':rp,'line':i,'content':ms[:200],'type':pat['type'],'category':'info-disclosure','severity':pat['severity'],'description':pat['description']})
with open(of,'w') as f: json.dump({'tool':'internal','findings':fs},f)
print(f'  Internal: {len(fs)} findings')
"
    
    # Git history
    log_step "Git history scan"
    python3 -c "
import json, os, re, subprocess
sr='$PROJECT_ROOT'; of='$FINDINGS_DIR/git-history.json'
try:
    r=subprocess.run(['git','log','--oneline','-100','--format=%H %s'],cwd=sr,capture_output=True,text=True,timeout=30)
    commits=[l.split(' ',1) for l in r.stdout.strip().split('\n') if l]
except:
    with open(of,'w') as f: json.dump({'tool':'git','findings':[]},f)
    print('  Git: skipped (not a git repo)'); exit(0)
rf='$wd/secrets-regex.json'
with open(rf) as f: pats=json.load(f)['patterns']
fs=[]
for ch,cm in commits[:20]:
    try:
        d=subprocess.run(['git','diff',f'{ch}^..'+ch,'--',':!.git'],cwd=sr,capture_output=True,text=True,timeout=5).stdout
        for pat in pats:
            try: rx=re.compile(pat['regex'],re.I)
            except: continue
            m=rx.findall(d)
            for mm in m[:3]:
                ms=mm if isinstance(mm,str) else str(mm)
                if len(ms)>200: ms=ms[:100]+'...'
                fs.append({'tool':'git','file':'commit:'+ch[:8],'line':0,'content':ms,'type':pat['id'],'category':'secrets','severity':pat['severity'],'description':'Secret in git history '+ch[:8],'commit':ch[:8],'commit_message':cm[:80]})
    except: continue
with open(of,'w') as f: json.dump({'tool':'git','findings':fs},f)
print(f'  Git: {len(fs)} findings')
"
    
    # Consolidate
    log_step "Consolidating secrets"
    python3 -c "
import json
fs=[]; tools=set()
for f in ['$FINDINGS_DIR/secrets-regex.json','$FINDINGS_DIR/sens-files.json','$FINDINGS_DIR/internal.json','$FINDINGS_DIR/git-history.json']:
    try:
        with open(f) as fh: d=json.load(fh)
        tools.add(d.get('tool','?'));
        for x in d.get('findings',[]): fs.append(x)
    except: pass
with open('$FINDINGS_DIR/secrets-findings.json','w') as f: json.dump({'tool':'secrets','source_tools':list(tools),'total_raw':len(fs),'findings':fs},f)
print(f'  Total secrets: {len(fs)} findings')
"
    log_ok "Secrets scan complete"
}

run_misconfig_scan() {
    log_header "⚙️ PART 4: MISCONFIGURATION SCAN"
    
    python3 -c "
import json, os, re
sr='$PROJECT_ROOT'; of='$FINDINGS_DIR/misconfig-code.json'
sk={'.git','node_modules','venv','__pycache__','.security-findings','security-reports','sarif-outputs'}
sx={'.pyc','.pyo','.so','.dll','.exe','.class','.o','.a','.min.js','.min.css','.map','.jpg','.png','.gif','.pdf','.zip','.tar','.gz','.bz2','.7z','.rar','.woff','.ttf'}
checks=[
    ('debug-mode','HIGH','Debug mode enabled',[r'(?i)DEBUG\s*=\s*(?:True|true|1)',r'APP_DEBUG\s*=\s*(?:True|true|1)',r'RAILS_ENV\s*=\s*[\"\']development[\"\']']),
    ('debug-func','LOW','Debug function left in code',[r'console\.log\(',r'dump\(',r'dd\(',r'var_dump\(']),
    ('hardcoded-pass','HIGH','Hardcoded password',[r'(?i)(?:password|passwd|pwd|secret)\s*[=:]\s*[\"\'][^\"\']{6,}[\"\']']),
    ('cors-wildcard','MEDIUM','CORS wildcard',[r'Access-Control-Allow-Origin\s*:\s*\*',r'access-control-allow-origin\s*:\s*\*']),
    ('default-cred','HIGH','Default credentials',[r'(?i)(?:user|username|login)\s*[=:]\s*[\"\'](?:admin|root|test|guest|user)[\"\']']),
    ('todo-sensitive','LOW','TODO with sensitive info',[r'(?i)(?:TODO|FIXME|HACK|XXX)\s*:?.*(?:password|secret|key|token|credential|auth|security)']),
]
fs=[]
for rt,dr,fl in os.walk(sr):
    dr[:]=[d for d in dr if d not in sk and not d.startswith('.')]
    for fn in fl:
        fp=os.path.join(rt,fn); rp=os.path.relpath(fp,sr)
        if os.path.splitext(fn)[1].lower() in sx: continue
        try:
