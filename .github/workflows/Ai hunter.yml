name: "🎯 Zero Track Trigger - AI Autonomous Hunter"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target domain (e.g., example.com)"
        required: true
        type: string
      hunting_mode:
        description: "Hunting intensity"
        type: choice
        options: [light, normal, aggressive]
        default: "normal"
      auto_exploitation:
        description: "Enable safe automated exploitation attempts"
        type: boolean
        default: false
      # ... (باقي الـ inputs القديمة مع إضافات)

  workflow_call:
    inputs:
      target: { required: true, type: string }
      hunting_mode: { type: string, default: "normal" }
      auto_exploitation: { type: boolean, default: false }
      # ... باقي الـ inputs

env:
  TARGET: ${{ inputs.target }}
  HUNTING_MODE: ${{ inputs.hunting_mode }}
  TIMESTAMP: ${{ github.run_id }}-${{ github.run_number }}-${{ inputs.target }}
  RESULTS_DIR: results/output-${{ github.run_id }}-${{ github.run_number }}-${{ inputs.target }}

