name: 🧨 Vulnerability Scanner (Enhanced)

on:
  schedule:
    - cron: '0 6 * * 1'   # كل إثنين الصبح 6 AM
  workflow_dispatch:
    inputs:
      domain:
        description: 'Target Domain'
        required: true
      severity:
        description: 'Min Severity (critical/high/medium/low)'
        required: false
        default: 'medium'
      scan_type:
        description: 'Scan Type (full/quick/cve-only)'
        required: false
        default: 'full'

jobs:
  vuln-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ─────────────────────────────────────────────
      # 1. Checkout
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. Install All Tools
      # ─────────────────────────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Tools
        run: |
          # ProjectDiscovery Suite
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install github.com/projectdiscovery/naabu/v2/cmd/naabu@latest
          go install github.com/projectdiscovery/katana/cmd/katana@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          
          echo "$HOME/go/bin" >> $GITHUB_PATH
          
          # Update Nuclei templates
          nuclei -update-templates -silent 2>/dev/null || true

      # ─────────────────────────────────────────────
      # 3. Setup Domain & Severity
      # ─────────────────────────────────────────────
      - name: Setup Variables
        id: vars
        run: |
          DOMAIN="${{ github.event.inputs.domain || secrets.TARGET_DOMAIN }}"
          SEVERITY="${{ github.event.inputs.severity || 'medium' }}"
          SCAN_TYPE="${{ github.event.inputs.scan_type || 'full' }}"
          
          echo "DOMAIN=$DOMAIN"     >> $GITHUB_ENV
          echo "SEVERITY=$SEVERITY" >> $GITHUB_ENV
          echo "SCAN_TYPE=$SCAN_TYPE" >> $GITHUB_ENV
          
          mkdir -p /tmp/scan/$DOMAIN

      # ─────────────────────────────────────────────
      # 4. Subdomain Enumeration
      # ─────────────────────────────────────────────
      - name: Step 1/6 — Subfinder
        run: |
          echo "🔍 Enumerating subdomains for ${{ env.DOMAIN }}..."
          subfinder \
            -d ${{ env.DOMAIN }} \
            -all -recursive -silent \
            -o /tmp/scan/${{ env.DOMAIN }}/subdomains_raw.txt 2>/dev/null || true
          
          sort -u /tmp/scan/${{ env.DOMAIN }}/subdomains_raw.txt \
               -o /tmp/scan/${{ env.DOMAIN }}/subdomains.txt
          
          TOTAL=$(wc -l < /tmp/scan/${{ env.DOMAIN }}/subdomains.txt)
          echo "✅ Found $TOTAL subdomains"
          echo "SUBDOMAIN_COUNT=$TOTAL" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 5. DNS Resolution
      # ─────────────────────────────────────────────
      - name: Step 2/6 — DNS Resolution
        run: |
          cat /tmp/scan/${{ env.DOMAIN }}/subdomains.txt \
            | dnsx -silent -a -resp \
            -o /tmp/scan/${{ env.DOMAIN }}/dns_resolved.txt 2>/dev/null || \
            cp /tmp/scan/${{ env.DOMAIN }}/subdomains.txt \
               /tmp/scan/${{ env.DOMAIN }}/dns_resolved.txt

      # ─────────────────────────────────────────────
      # 6. Live Host Check + Fingerprint
      # ─────────────────────────────────────────────
      - name: Step 3/6 — HTTPx Fingerprint
        run: |
          cat /tmp/scan/${{ env.DOMAIN }}/subdomains.txt | httpx \
            -silent \
            -status-code \
            -title \
            -tech-detect \
            -cdn \
            -ip \
            -cname \
            -threads 100 \
            -o /tmp/scan/${{ env.DOMAIN }}/live_hosts.txt 2>/dev/null || true
          
          # Extract just URLs for Nuclei
          cat /tmp/scan/${{ env.DOMAIN }}/live_hosts.txt \
            | awk '{print $1}' \
            > /tmp/scan/${{ env.DOMAIN }}/live_urls.txt
          
          LIVE=$(wc -l < /tmp/scan/${{ env.DOMAIN }}/live_urls.txt)
          echo "✅ Live hosts: $LIVE"
          echo "LIVE_COUNT=$LIVE" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 7. Port Scan (Quick - Top Ports)
      # ─────────────────────────────────────────────
      - name: Step 4/6 — Naabu Port Scan
        run: |
          PORTS="80,443,8080,8443,8000,8008,3000,3001,9000,9090,4443,7443,5000,5001"
          
          if [ "${{ env.SCAN_TYPE }}" == "full" ]; then
            PORTS="80,443,8080,8443,8000,8008,3000,3001,9000,9090,4443,7443,5000,5001,8888,8889,8181,9999,10000"
          fi
          
          cat /tmp/scan/${{ env.DOMAIN }}/subdomains.txt | naabu \
            -p "$PORTS" \
            -silent \
            -o /tmp/scan/${{ env.DOMAIN }}/open_ports.txt \
            -c 50 2>/dev/null || true
          
          PORTS_COUNT=$(wc -l < /tmp/scan/${{ env.DOMAIN }}/open_ports.txt 2>/dev/null || echo 0)
          echo "✅ Open ports found: $PORTS_COUNT"
          echo "PORTS_COUNT=$PORTS_COUNT" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 8. URL Crawl with Katana
      # ─────────────────────────────────────────────
      - name: Step 5/6 — Katana URL Crawl
        run: |
          if [ -s /tmp/scan/${{ env.DOMAIN }}/live_urls.txt ]; then
            katana \
              -list /tmp/scan/${{ env.DOMAIN }}/live_urls.txt \
              -d 2 \
              -jc \
              -silent \
              -o /tmp/scan/${{ env.DOMAIN }}/crawled_urls.txt \
              -timeout 15 \
              -c 20 2>/dev/null || true
            
            CRAWLED=$(wc -l < /tmp/scan/${{ env.DOMAIN }}/crawled_urls.txt 2>/dev/null || echo 0)
            echo "✅ Crawled URLs: $CRAWLED"
            echo "CRAWLED_COUNT=$CRAWLED" >> $GITHUB_ENV
            
            # Combine live + crawled for Nuclei
            cat /tmp/scan/${{ env.DOMAIN }}/live_urls.txt \
                /tmp/scan/${{ env.DOMAIN }}/crawled_urls.txt \
                | sort -u \
                > /tmp/scan/${{ env.DOMAIN }}/all_targets.txt
          else
            cp /tmp/scan/${{ env.DOMAIN }}/live_urls.txt \
               /tmp/scan/${{ env.DOMAIN }}/all_targets.txt
          fi

      # ─────────────────────────────────────────────
      # 9. Nuclei Vulnerability Scan
      # ─────────────────────────────────────────────
      - name: Step 6/6 — Nuclei Scan
        run: |
          SEVERITY="${{ env.SEVERITY }}"
          
          # Map severity to nuclei format
          case "$SEVERITY" in
            critical) SEV_FLAG="critical" ;;
            high)     SEV_FLAG="critical,high" ;;
            medium)   SEV_FLAG="critical,high,medium" ;;
            low)      SEV_FLAG="critical,high,medium,low" ;;
            *)        SEV_FLAG="critical,high,medium" ;;
          esac
          
          # Choose templates based on scan type
          TEMPLATE_FLAGS="-t cves/ -t vulnerabilities/ -t exposures/ -t misconfiguration/ -t takeovers/"
          
          if [ "${{ env.SCAN_TYPE }}" == "cve-only" ]; then
            TEMPLATE_FLAGS="-t cves/"
          elif [ "${{ env.SCAN_TYPE }}" == "quick" ]; then
            TEMPLATE_FLAGS="-t cves/ -t exposures/ -t misconfiguration/"
          fi
          
          # Run Nuclei
          nuclei \
            -list /tmp/scan/${{ env.DOMAIN }}/all_targets.txt \
            $TEMPLATE_FLAGS \
            -s "$SEV_FLAG" \
            -silent \
            -j \
            -o /tmp/scan/${{ env.DOMAIN }}/nuclei_raw.json \
            -c 30 \
            -timeout 10 \
            -rl 100 2>/dev/null || true
          
          # Convert to readable txt
          if [ -s /tmp/scan/${{ env.DOMAIN }}/nuclei_raw.json ]; then
            cat /tmp/scan/${{ env.DOMAIN }}/nuclei_raw.json | \
              jq -r '
                "[\(.info.severity | ascii_upcase)] \(.info.name)\n" +
                "  URL: \(.matched-at)\n" +
                "  Template: \(.template-id)\n" +
                "  CVE: \(.info.classification["cve-id"]? // "N/A")\n" +
                "─────────────────────────────────"
              ' > /tmp/scan/${{ env.DOMAIN }}/nuclei_results.txt 2>/dev/null || true
          fi
          
          VULN_COUNT=$(cat /tmp/scan/${{ env.DOMAIN }}/nuclei_raw.json 2>/dev/null | wc -l || echo 0)
          CRIT_COUNT=$(cat /tmp/scan/${{ env.DOMAIN }}/nuclei_raw.json 2>/dev/null | jq -r 'select(.info.severity=="critical")' | jq -s length 2>/dev/null || echo 0)
          HIGH_COUNT=$(cat /tmp/scan/${{ env.DOMAIN }}/nuclei_raw.json 2>/dev/null | jq -r 'select(.info.severity=="high")' | jq -s length 2>/dev/null || echo 0)
          MED_COUNT=$(cat /tmp/scan/${{ env.DOMAIN }}/nuclei_raw.json 2>/dev/null  | jq -r 'select(.info.severity=="medium")' | jq -s length 2>/dev/null || echo 0)
          
          echo "VULN_COUNT=$VULN_COUNT" >> $GITHUB_ENV
          echo "CRIT_COUNT=$CRIT_COUNT" >> $GITHUB_ENV
          echo "HIGH_COUNT=$HIGH_COUNT" >> $GITHUB_ENV
          echo "MED_COUNT=$MED_COUNT"   >> $GITHUB_ENV
          
          echo "✅ Vulnerabilities found: $VULN_COUNT (Critical:$CRIT_COUNT High:$HIGH_COUNT Med:$MED_COUNT)"

      # ─────────────────────────────────────────────
      # 10. Discord — Summary Report
      # ─────────────────────────────────────────────
      - name: Discord Summary
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # Color based on severity
          COLOR=3066993   # Green
          [ "${{ env.HIGH_COUNT }}" -gt 0 ] && COLOR=16776960
          [ "${{ env.CRIT_COUNT }}" -gt 0 ] && COLOR=15158332

          PAYLOAD=$(jq -n \
            --arg domain   "${{ env.DOMAIN }}" \
            --arg subs     "${{ env.SUBDOMAIN_COUNT }}" \
            --arg live     "${{ env.LIVE_COUNT }}" \
            --arg ports    "${{ env.PORTS_COUNT }}" \
            --arg crawled  "${{ env.CRAWLED_COUNT }}" \
            --arg total    "${{ env.VULN_COUNT }}" \
            --arg crit     "${{ env.CRIT_COUNT }}" \
            --arg high     "${{ env.HIGH_COUNT }}" \
            --arg med      "${{ env.MED_COUNT }}" \
            --arg run_url  "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson color "$COLOR" \
            '{
              username: "🧨 VulnBot",
              embeds: [{
                title: ("🔍 Scan Report: " + $domain),
                color: $color,
                fields: [
                  { name: "🌐 Subdomains",    value: $subs,    inline: true },
                  { name: "✅ Live Hosts",    value: $live,    inline: true },
                  { name: "🔌 Open Ports",    value: $ports,   inline: true },
                  { name: "🔗 Crawled URLs",  value: $crawled, inline: true },
                  { name: "🎯 Total Vulns",   value: $total,   inline: true },
                  { name: "🚨 Critical",      value: $crit,    inline: true },
                  { name: "🔴 High",          value: $high,    inline: true },
                  { name: "🟠 Medium",        value: $med,     inline: true },
                  { name: "📋 Full Report",   value: ("[View Run](" + $run_url + ")"), inline: false }
                ],
                footer: { text: "BugBountyCI • GitHub Actions" },
                timestamp: now | todate
              }]
            }')
          
          curl -s -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true

      # ─────────────────────────────────────────────
      # 11. Discord — Per-Vulnerability Alerts
      # ─────────────────────────────────────────────
      - name: Discord Per-Vuln Alerts
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ ! -s /tmp/scan/${{ env.DOMAIN }}/nuclei_raw.json ]; then
            echo "No vulnerabilities to report"
            exit 0
          fi
          
          # Send top 20 findings to avoid spam
          cat /tmp/scan/${{ env.DOMAIN }}/nuclei_raw.json | head -20 | while IFS= read -r line; do
            SEVERITY=$(echo "$line" | jq -r '.info.severity // "unknown"')
            NAME=$(echo "$line" | jq -r '.info.name // "Unknown"')
            URL=$(echo "$line" | jq -r '."matched-at" // "N/A"')
            TEMPLATE=$(echo "$line" | jq -r '."template-id" // "N/A"')
            CVE=$(echo "$line" | jq -r '.info.classification["cve-id"]? // "N/A"')
            DESC=$(echo "$line" | jq -r '.info.description // "No description"' | cut -c1-200)
            
            # Color per severity
            case "$SEVERITY" in
              critical) COLOR=15158332; ICON="🚨" ;;
              high)     COLOR=15105570; ICON="🔴" ;;
              medium)   COLOR=16776960; ICON="🟠" ;;
              low)      COLOR=3066993;  ICON="🟡" ;;
              *)        COLOR=9807270;  ICON="⚪" ;;
            esac
            
            PAYLOAD=$(jq -n \
              --arg icon     "$ICON" \
              --arg severity "$SEVERITY" \
              --arg name     "$NAME" \
              --arg url      "$URL" \
              --arg template "$TEMPLATE" \
              --arg cve      "$CVE" \
              --arg desc     "$DESC" \
              --arg domain   "${{ env.DOMAIN }}" \
              --argjson color "$COLOR" \
              '{
                username: "🧨 VulnBot",
                embeds: [{
                  title: (($icon + " [") + ($severity | ascii_upcase) + "] " + $name),
                  color: $color,
                  fields: [
                    { name: "🎯 Target",    value: $domain,   inline: true  },
                    { name: "🔗 URL",       value: $url,      inline: false },
                    { name: "📄 Template",  value: $template, inline: true  },
                    { name: "🛡️ CVE",      value: $cve,      inline: true  },
                    { name: "📝 Description", value: $desc,   inline: false }
                  ],
                  footer: { text: "BugBountyCI • GitHub Actions" },
                  timestamp: now | todate
                }]
              }')
            
            curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" || true
            
            sleep 0.5  # Rate limit protection
          done

      # ─────────────────────────────────────────────
      # 12. Telegram Notification
      # ─────────────────────────────────────────────
      - name: Telegram Notification
        if: always() && env.CRIT_COUNT != '0' || env.HIGH_COUNT != '0'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then exit 0; fi
          
          MSG="🧨 *Vuln Scan: \`${{ env.DOMAIN }}\`*
          
          🚨 Critical: ${{ env.CRIT_COUNT }}
          🔴 High: ${{ env.HIGH_COUNT }}
          🟠 Medium: ${{ env.MED_COUNT }}
          🌐 Live: ${{ env.LIVE_COUNT }} / ${{ env.SUBDOMAIN_COUNT }} subs
          
          [View Full Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          
          curl -s "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "parse_mode=Markdown" \
            -d "text=$MSG" || true

      # ─────────────────────────────────────────────
      # 13. Upload All Artifacts
      # ─────────────────────────────────────────────
      - name: Upload Scan Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vuln-scan-${{ env.DOMAIN }}-${{ github.run_number }}
          path: /tmp/scan/${{ env.DOMAIN }}/
          retention-days: 90
