name: publish-sra-full
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-sra-full.yml'
      - 'docs/fl0.txt'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          fetch-depth: 1
      - name: Reconstruct and force-push security-research-agent
        env:
          TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib
          parts=[]
          n=0
          while pathlib.Path(f"docs/fl{n}.txt").exists():
              parts.append(pathlib.Path(f"docs/fl{n}.txt").read_text().strip())
              n+=1
          print("parts", n, "chars", sum(len(p) for p in parts))
          if n < 10:
              raise SystemExit(f"too few parts: {n}")
          data=base64.b64decode("".join(parts))
          pathlib.Path("/tmp/sra.tgz").write_bytes(data)
          print("tarball", len(data))
          PY
          rm -rf /tmp/sra_out && mkdir -p /tmp/sra_out
          tar xzf /tmp/sra.tgz -C /tmp/sra_out
          cd /tmp/sra_out
          sed -i 's|OWNER/security-research-agent|Tawffik/security-research-agent|g' README.md || true
          ls -la
          find . -type f | head -50
          git init -b main
          git config user.name "Tawffik"
          git config user.email "150173255+Tawffik@users.noreply.github.com"
          git add -A
          git commit -m "Initial import: full security-research-agent from zip"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/Tawffik/security-research-agent.git"
          git push -u origin main --force
          echo "Published https://github.com/Tawffik/security-research-agent"
