name: "🔍 Dorking Recon"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target domain or org (e.g., example.com)"
        required: true
        type: string
      dorks_file:
        description: "Path to dorks list file inside the repo"
        required: false
        default: "dorks_list.txt"
        type: string
      delay:
        description: "Delay between dorks (seconds)"
        required: false
        default: "3"
        type: string
      max_results:
        description: "Max results per dork"
        required: false
        default: "10"
        type: string
      sources:
        description: "Search sources priority (comma-separated)"
        required: false
        default: "google,bing,github"
        type: string

env:
  TARGET: ${{ inputs.target }}
  DORKS_FILE: ${{ inputs.dorks_file }}
  DELAY: ${{ inputs.delay }}
  MAX_RESULTS: ${{ inputs.max_results }}
  SOURCES: ${{ inputs.sources }}

jobs:
  dorking:
    name: "🔍 Dorking Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "📥 Checkout repo"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📦 Install dependencies"
        run: |
          pip install -q googlesearch-python requests beautifulsoup4

      - name: "🔍 Run Dorking Engine"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
        run: |
          mkdir -p results/dorking
          python3 dorking_engine.py \
            --target "$TARGET" \
            --dorks "$DORKS_FILE" \
            --output results/dorking \
            --delay "$DELAY" \
            --max-results "$MAX_RESULTS" \
            --sources "$SOURCES"

      - name: "📤 Upload Results Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dorking-${{ env.TARGET }}-${{ github.run_id }}
          path: results/dorking/
          retention-days: 30

      - name: "📝 Job Summary"
        if: always()
        run: |
          echo "## 🔍 Dorking Recon: ${{ env.TARGET }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f results/dorking/report.md ]; then
            cat results/dorking/report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No report generated." >> $GITHUB_STEP_SUMMARY
          fi
