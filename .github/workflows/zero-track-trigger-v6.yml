              print("OpenRouter triage complete")
          except urllib.error.HTTPError as e:
              print("OpenRouter HTTP error " + str(e.code) + ": " + e.read().decode(errors="ignore")[:500], file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print("OpenRouter error: " + str(e), file=sys.stderr)
