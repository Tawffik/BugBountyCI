      - name: "📤 Upload AI Triage Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-triage-${{ env.TIMESTAMP }}
          path: ${{ needs.setup.outputs.results_dir }}/ai/
          retention-days: 30

  # ============================================================
  # STAGE 9: AI-Powered Full Security Report
  # ============================================================

  ai_report:
    name: "📋 AI Security Report"
    needs: [setup, ai_triage]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event.inputs.ai_report == 'true' }}
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "📥 Download AI Triage"
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ env.TIMESTAMP }}"
          merge-multiple: true
          path: ${{ needs.setup.outputs.results_dir }}/
        continue-on-error: true

      - name: "📋 Generate Full Bug Report"
        id: claude_report
        if: ${{ needs.setup.outputs.anthropic_key_set == 'true' }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET: ${{ needs.setup.outputs.target }}
          RD: ${{ needs.setup.outputs.results_dir }}
        run: |
          cat > /tmp/ai_report.py <<'PYEOF'
          import datetime, json, os, sys, urllib.request, urllib.error

          def read_capped(*paths, cap=6000, default=""):
              chunks = []
              for p in paths:
                  try:
                      with open(p, "r", errors="ignore") as f:
                          chunks.append(f.read())
                  except OSError:
                      continue
              text = "\n".join(chunks).strip()
              return text[:cap] if text else default

          def count_lines(path):
              try:
                  with open(path) as f:
                      return sum(1 for _ in f)
              except OSError:
                  return 0

          api_key = os.environ.get("ANTHROPIC_API_KEY")
          target = os.environ.get("TARGET", "unknown-target")
          rd = os.environ.get("RD")

          if not api_key or not rd:
              print("Missing ANTHROPIC_API_KEY or RD, skipping", file=sys.stderr)
              sys.exit(0)

          triage = read_capped(os.path.join(rd, "ai", "claude_triage.md"),
                                os.path.join(rd, "ai", "openrouter_triage.md"),
                                cap=4000, default="No triage available")
          nuclei = read_capped(os.path.join(rd, "nuclei", "nuclei_findings.json"), cap=2000)
          sensitive = read_capped(os.path.join(rd, "files", "sensitive_files.txt"), cap=1000)
          live = count_lines(os.path.join(rd, "live", "live_hosts.txt"))
          subs = count_lines(os.path.join(rd, "subdomains", "all_subdomains.txt"))
          scan_date = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")

          prompt = (
              "You are writing a professional bug bounty report for: " + target + "\n"
              "Scan date: " + scan_date + "\n"
              "Live hosts: " + str(live) + " | Subdomains: " + str(subs) + "\n\n"
              "Based on this AI triage:\n" + triage + "\n\n"
              "And these raw findings:\n"
              "Nuclei: " + nuclei + "\n"
              "Sensitive files: " + sensitive + "\n\n"
              "Write a COMPLETE professional bug bounty report with:\n"
              "# Executive Summary\n"
              "# Scope & Methodology\n"
              "# Findings\n"
              "Only include a finding here if it is CONFIRMED with real evidence "
              "(a verified content signature, a re-verified DNS record, an actual "
              "listed object, a matched Nuclei template, etc.) - never include "
              "something because it merely 'looks suspicious' or matched a loose "
              "pattern. If you are not genuinely confident a finding is real, leave "
              "it out entirely rather than including it with hedging language like "
              "'possible' or 'requires verification'. For EACH confirmed finding, "
              "format it exactly as a submission-ready block using these field "
              "names (matching HackerOne/Bugcrowd submission forms, so it can be "
              "pasted directly into a report):\n"
              "## [Severity] Title\n"
              "**Weakness/Type:**\n"
              "**Affected Asset (URL):**\n"
              "**Severity:** Critical/High/Medium/Low\n"
              "**CVSS 3.1 Vector & Score (estimate):**\n"
              "**Summary:** (1-2 sentences)\n"
              "**Steps to Reproduce:** (numbered list)\n"
              "**Proof of Concept:** (exact curl command or request/response)\n"
              "**Impact:** (what a real attacker gains)\n"
              "**Suggested Remediation:**\n"
              "---\n"
              "# Statistics table (subdomains, live hosts, critical/high/medium counts, "
              "new-since-last-run counts)\n"
              "# Recommendations (top 5 immediate actions)\n\n"
              "If, after this filter, there are zero confirmed findings, write "
              "'No confirmed findings this run.' under # Findings and stop there - "
              "do not invent something to fill the section."
          )

          payload = json.dumps({
              "model": "claude-opus-4-8",
              "max_tokens": 8192,
              "messages": [{"role": "user", "content": prompt}],
          }).encode()

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=payload,
              headers={
                  "x-api-key": api_key,
                  "anthropic-version": "2023-06-01",
                  "content-type": "application/json",
              },
              method="POST",
          )

          os.makedirs(os.path.join(rd, "ai"), exist_ok=True)

          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  result = json.loads(r.read())
              report = result["content"][0]["text"]
              with open(os.path.join(rd, "ai", "security_report.md"), "w") as f:
                  f.write(report)
              print("Security report generated, length: " + str(len(report)))
          except urllib.error.HTTPError as e:
              print("Report HTTP error " + str(e.code) + ": " + e.read().decode(errors="ignore")[:500], file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print("Report generation failed: " + str(e), file=sys.stderr)
              sys.exit(1)
          PYEOF
          python3 /tmp/ai_report.py

      - name: "📋 Generate Full Bug Report (OpenRouter Fallback)"
        id: openrouter_report
        if: ${{ always() && needs.setup.outputs.openrouter_key_set == 'true' && steps.claude_report.outcome != 'success' }}
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TARGET: ${{ needs.setup.outputs.target }}
          RD: ${{ needs.setup.outputs.results_dir }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/ai_report_or.py <<'PYEOF'
          import datetime, json, os, sys, urllib.request, urllib.error

          def read_capped(*paths, cap=5000, default=""):
              chunks = []
              for p in paths:
                  try:
                      with open(p, "r", errors="ignore") as f:
                          chunks.append(f.read())
                  except OSError:
                      continue
              text = "\n".join(chunks).strip()
              return text[:cap] if text else default

          api_key = os.environ.get("OPENROUTER_API_KEY")
          target = os.environ.get("TARGET", "unknown-target")
          rd = os.environ.get("RD")
          repo = os.environ.get("REPO", "")

          if not api_key or not rd:
              print("Missing OPENROUTER_API_KEY or RD, skipping", file=sys.stderr)
              sys.exit(0)

          triage = read_capped(os.path.join(rd, "ai", "claude_triage.md"),
                                os.path.join(rd, "ai", "openrouter_triage.md"),
                                cap=4000, default="No triage available")
          nuclei = read_capped(os.path.join(rd, "nuclei", "nuclei_findings.json"), cap=2000)
          sensitive = read_capped(os.path.join(rd, "files", "sensitive_files.txt"), cap=1000)
          scan_date = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")

          prompt = (
              "You are writing a professional bug bounty report for: " + target + "\n"
              "Scan date: " + scan_date + "\n\n"
              "Based on this triage:\n" + triage + "\n\n"
              "Raw findings - Nuclei: " + nuclei + "\nSensitive files: " + sensitive + "\n\n"
              "Write a complete report with: Executive Summary, Scope & Methodology, "
              "Findings (only include a finding if genuinely confirmed by real "
              "evidence - if there is any doubt, leave it out entirely rather than "
              "hedging; for each confirmed finding use: Weakness/Type, Affected "
              "Asset, Severity, Summary, Steps to Reproduce, Proof of Concept, "
              "Impact, Suggested Remediation), a statistics table, and top-5 "
              "recommendations. If nothing is confirmed, write 'No confirmed "
              "findings this run.'"
          )

          payload = json.dumps({
              "model": "anthropic/claude-opus-4-5",
              "max_tokens": 8192,
              "messages": [{"role": "user", "content": prompt}],
          }).encode()

          req = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=payload,
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Content-Type": "application/json",
                  "HTTP-Referer": "https://github.com/" + repo,
                  "X-Title": "BugBountyCI",
              },
              method="POST",
          )

          os.makedirs(os.path.join(rd, "ai"), exist_ok=True)

          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  result = json.loads(r.read())
              report = result["choices"][0]["message"]["content"]
              with open(os.path.join(rd, "ai", "security_report.md"), "w") as f:
                  f.write(report)
              print("OpenRouter report generated, length: " + str(len(report)))
          except urllib.error.HTTPError as e:
              print("OpenRouter report HTTP error " + str(e.code) + ": " + e.read().decode(errors="ignore")[:500], file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print("OpenRouter report generation failed: " + str(e), file=sys.stderr)
              sys.exit(1)
          PYEOF
          python3 /tmp/ai_report_or.py

      - name: "📋 Generate Full Bug Report (Groq Fallback)"
        id: groq_report
        if: ${{ always() && needs.setup.outputs.groq_key_set == 'true' && steps.claude_report.outcome != 'success' && steps.openrouter_report.outcome != 'success' }}
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TARGET: ${{ needs.setup.outputs.target }}
          RD: ${{ needs.setup.outputs.results_dir }}
        run: |
          cat > /tmp/ai_report_groq.py <<'PYEOF'
          import datetime, json, os, sys, urllib.request, urllib.error

          def read_capped(*paths, cap=4000, default=""):
              chunks = []
