      - name: "💾 Commit AI Report to Results"
        continue-on-error: true
        run: |
          RD="${{ needs.setup.outputs.results_dir }}"
          TARGET="${{ needs.setup.outputs.target }}"

          if [ -f "$RD/ai/security_report.md" ]; then
            mkdir -p "results/$TARGET"
            cp "$RD/ai/security_report.md" \
              "results/$TARGET/ai_report_$(date +%Y%m%d_%H%M).md"
            cp "$RD/ai/claude_triage.md" \
              "results/$TARGET/ai_triage_$(date +%Y%m%d_%H%M).md" 2>/dev/null || true

            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "results/$TARGET/"
            git diff --staged --quiet || \
              git commit -m "AI Report [$TARGET] $(date -u +'%Y-%m-%d %H:%M')"
            git push || true
            echo "✅ AI report committed to repo"
          fi

      - name: "📤 Upload Report Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-report-${{ env.TIMESTAMP }}
          path: ${{ needs.setup.outputs.results_dir }}/ai/
          retention-days: 30

  # ============================================================
  # STAGE 10: Discord Final Report
  # ============================================================

  discord_notify:
    name: "📣 Discord Notification"
    needs: [setup, security_analysis, ai_triage, ai_report, subdomain_takeover, diff_previous_run]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event.inputs.discord_notify == 'true' }}
    timeout-minutes: 5

    steps:
      - name: "📥 Download All Artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ env.TIMESTAMP }}"
          merge-multiple: true
          path: ${{ needs.setup.outputs.results_dir }}/
        continue-on-error: true

      - name: "📣 Send Discord Report"
        run: |
          TARGET="${{ needs.setup.outputs.target }}"
          RD="${{ needs.setup.outputs.results_dir }}"

          SUBS=$(wc -l < "$RD/subdomains/all_subdomains.txt"  2>/dev/null || echo 0)
          LIVE=$(wc -l < "$RD/live/live_hosts.txt"            2>/dev/null || echo 0)
          NUCLEI=$(wc -l < "$RD/nuclei/nuclei_findings.json"  2>/dev/null || echo 0)
          SENS=$(wc -l  < "$RD/files/sensitive_files.txt"     2>/dev/null || echo 0)
          CORS=$(wc -l  < "$RD/cors/cors_vulnerable.txt"      2>/dev/null || echo 0)
          JS=$(wc -l    < "$RD/js/js_secrets.txt"             2>/dev/null || echo 0)
          ADMIN=$(wc -l < "$RD/admin/admin_panels.txt"        2>/dev/null || echo 0)
          GQL=$(wc -l   < "$RD/graphql/graphql_active.txt"    2>/dev/null || echo 0)
          TAKEOVER=$(wc -l < "$RD/takeover/takeover_findings.txt" 2>/dev/null || echo 0)
          NEW_SUBS=$(wc -l < "$RD/diff/new_subdomains.txt"    2>/dev/null || echo 0)
          NEW_LIVE=$(wc -l < "$RD/diff/new_live_hosts.txt"    2>/dev/null || echo 0)
          OPEN_BUCKETS=$(wc -l < "$RD/cloud/open_buckets.txt" 2>/dev/null || echo 0)
          AI_DONE=$([ -f "$RD/ai/security_report.md" ] && echo "✅ Done" || echo "⏭️ Skipped")

          AI_SUMMARY=$(head -15 "$RD/ai/claude_triage.md" 2>/dev/null \
            | grep -v "^#" | grep -v "^$" | head -5 \
            | sed 's/^/> /' || echo "No AI summary available")
          [ -z "$AI_SUMMARY" ] && AI_SUMMARY="No AI summary available"

          # Priority is now driven by the highest-confidence finding classes
          # (takeover, open buckets, sensitive files/secrets) rather than raw
          # nuclei count, so the title actually reflects urgency.
          COLOR=5814783
          TITLE_PREFIX="🎯 Scan Complete"
          if [ "$SENS" -gt 0 ] || [ "$JS" -gt 0 ] || [ "$NEW_SUBS" -gt 0 ] || [ "$NEW_LIVE" -gt 0 ]; then
            COLOR=16744192
            TITLE_PREFIX="🔶 Scan Complete (new activity)"
          fi
          if [ "$CORS" -gt 0 ] || [ "$NUCLEI" -gt 5 ]; then
            COLOR=15158332
            TITLE_PREFIX="🚨 Scan Complete (review needed)"
          fi
          if [ "$TAKEOVER" -gt 0 ] || [ "$OPEN_BUCKETS" -gt 0 ]; then
            COLOR=15158332
            TITLE_PREFIX="🚨🚨 URGENT - High-confidence findings"
          fi

          jq -n \
            --arg t       "$TARGET" \
            --arg titlepx "$TITLE_PREFIX" \
            --arg subs    "$SUBS" \
            --arg live    "$LIVE" \
            --arg nuclei  "$NUCLEI" \
            --arg sens    "$SENS" \
            --arg cors    "$CORS" \
            --arg js      "$JS" \
            --arg admin   "$ADMIN" \
            --arg gql     "$GQL" \
            --arg takeover "$TAKEOVER" \
            --arg newsubs  "$NEW_SUBS" \
            --arg newlive  "$NEW_LIVE" \
            --arg buckets  "$OPEN_BUCKETS" \
            --arg ai      "$AI_DONE" \
            --arg aisum   "$AI_SUMMARY" \
            --arg run     "${{ github.run_number }}" \
            --arg url     "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson color "$COLOR" \
          '{
            username: "🤖 BugBountyCI",
            embeds: [{
              title: ($titlepx + ": " + $t),
              color: $color,
              url: $url,
              fields: [
                {name:"🆕 New Since Last Run",
                 value:("New subs: **"+$newsubs+"** | New live: **"+$newlive+"**"),
                 inline:false},
                {name:"🌐 Recon",
                 value:("Subs: **"+$subs+"** | Live: **"+$live+"**"),
                 inline:false},
                {name:"🔓 Findings",
                 value:("Nuclei: **"+$nuclei+"** | Sensitive: **"+$sens+"** | CORS: **"+$cors+"** | JS Secrets: **"+$js+"**"),
                 inline:false},
                {name:"🏚️ High-Confidence",
                 value:("Takeover: **"+$takeover+"** | Open Buckets: **"+$buckets+"**"),
                 inline:false},
                {name:"🎯 Targets",
                 value:("Admin Panels: **"+$admin+"** | GraphQL: **"+$gql+"**"),
                 inline:false},
                {name:"🤖 AI Report",
                 value:$ai,
                 inline:true},
                {name:"🔗 Full Results",
                 value:("[View Run]("+$url+")"),
                 inline:true},
                {name:"🧠 AI Summary",
                 value:$aisum,
                 inline:false}
              ],
              footer: {text: ("Run #"+$run+" | BugBountyCI")}
            }]
          }' | curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
                 -H "Content-Type: application/json" \
                 -d @- || true
