      - name: "🤖 Gemini AI Triage (Final Fallback)"
        id: gemini_triage
        if: ${{ always() && needs.setup.outputs.gemini_key_set == 'true' && (github.event.inputs.ai_provider == 'gemini' || (github.event.inputs.ai_provider == 'both' && steps.claude_triage.outcome != 'success' && steps.openrouter_triage.outcome != 'success' && steps.groq_triage.outcome != 'success')) }}
