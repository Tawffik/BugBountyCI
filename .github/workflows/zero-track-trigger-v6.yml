                                os.path.join(rd, "nuclei", "nuclei_findings.txt"))
          sensitive = read_capped(os.path.join(rd, "files", "sensitive_files.txt"), cap=2000)
          cors = read_capped(os.path.join(rd, "cors", "cors_vulnerable.txt"), cap=1000)
          js_secrets = read_capped(os.path.join(rd, "api", "js_secrets.txt"), cap=2000)

          prompt = (
