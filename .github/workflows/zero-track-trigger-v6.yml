              "hedging; for each confirmed finding use: Weakness/Type, Affected "
              "Asset, Severity, Summary, Steps to Reproduce, Proof of Concept, "
              "Impact, Suggested Remediation), a statistics table, and top-5 "
              "recommendations. If nothing is confirmed, write 'No confirmed "
              "findings this run.'"
          )

          payload = json.dumps({
              "model": "llama-3.3-70b-versatile",
              "max_tokens": 8192,
              "messages": [{"role": "user", "content": prompt}],
          }).encode()

          req = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=payload,
              headers={
                  "Authorization": "Bearer " + api_key,
