name: 🕵️ JS & Secrets Scanner

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Target Domain'
        required: true
  schedule:
    - cron: '0 9 * * 3'   # كل أربع الصبح

jobs:
  js-secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go & Node
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Tools
        run: |
          # ProjectDiscovery
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/katana/cmd/katana@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          
          # Secret scanners
          go install github.com/gitleaks/gitleaks/v8@latest
          
          # GF for pattern matching  
          go install github.com/tomnomnom/gf@latest
          go install github.com/tomnomnom/anew@latest
          go install github.com/tomnomnom/qsreplace@latest
          
          echo "$HOME/go/bin" >> $GITHUB_PATH
          
          # Install GF patterns
          mkdir -p ~/.gf
          git clone --depth 1 https://github.com/1ndianl33t/Gf-Patterns ~/.gf-patterns 2>/dev/null || true
          cp ~/.gf-patterns/*.json ~/.gf/ 2>/dev/null || true
          
          nuclei -update-templates -silent 2>/dev/null || true

      - name: Set Domain
        run: |
          DOMAIN="${{ github.event.inputs.domain || secrets.TARGET_DOMAIN }}"
          echo "DOMAIN=$DOMAIN" >> $GITHUB_ENV
          mkdir -p /tmp/js-scan/$DOMAIN

      # ─────────────────────────────────────────────
      # Enumerate & get live hosts
      # ─────────────────────────────────────────────
      - name: Enumerate Subdomains
        run: |
          subfinder -d ${{ env.DOMAIN }} -all -silent \
            -o /tmp/js-scan/${{ env.DOMAIN }}/subs.txt 2>/dev/null || true

      - name: Get Live Hosts
        run: |
          cat /tmp/js-scan/${{ env.DOMAIN }}/subs.txt | httpx \
            -silent -status-code -threads 80 \
            -o /tmp/js-scan/${{ env.DOMAIN }}/live.txt 2>/dev/null || true
          
          awk '{print $1}' /tmp/js-scan/${{ env.DOMAIN }}/live.txt \
            > /tmp/js-scan/${{ env.DOMAIN }}/live_urls.txt

      # ─────────────────────────────────────────────
      # Crawl & Extract JS Files
      # ─────────────────────────────────────────────
      - name: Katana JS Crawl
        run: |
          katana \
            -list /tmp/js-scan/${{ env.DOMAIN }}/live_urls.txt \
            -d 3 -jc -jsl \
            -silent \
            -o /tmp/js-scan/${{ env.DOMAIN }}/all_urls.txt \
            -timeout 20 -c 30 2>/dev/null || true
          
          # Filter JS files
          grep -E "\.js($|\?)" /tmp/js-scan/${{ env.DOMAIN }}/all_urls.txt \
            | sort -u \
            > /tmp/js-scan/${{ env.DOMAIN }}/js_files.txt || true
          
          JS_COUNT=$(wc -l < /tmp/js-scan/${{ env.DOMAIN }}/js_files.txt)
          echo "JS_COUNT=$JS_COUNT" >> $GITHUB_ENV
          echo "✅ Found $JS_COUNT JS files"

      # ─────────────────────────────────────────────
      # Extract Endpoints & Parameters from JS
      # ─────────────────────────────────────────────
      - name: Extract from JS Files
        run: |
          > /tmp/js-scan/${{ env.DOMAIN }}/endpoints.txt
          > /tmp/js-scan/${{ env.DOMAIN }}/secrets_raw.txt
          
          while IFS= read -r js_url; do
            CONTENT=$(curl -sk --max-time 10 "$js_url" 2>/dev/null || true)
            
            # Extract API endpoints
            echo "$CONTENT" | grep -oE '(\/api\/[a-zA-Z0-9_/.-]+)' | \
              anew /tmp/js-scan/${{ env.DOMAIN }}/endpoints.txt 2>/dev/null || true
            
            # Extract potential secrets (patterns)
            echo "$CONTENT" | grep -oE \
              '(api[_-]?key|apikey|secret|password|token|auth|bearer|aws_|s3_)["\s:=]+[A-Za-z0-9+/]{16,}' \
              >> /tmp/js-scan/${{ env.DOMAIN }}/secrets_raw.txt 2>/dev/null || true
            
          done < /tmp/js-scan/${{ env.DOMAIN }}/js_files.txt
          
          sort -u /tmp/js-scan/${{ env.DOMAIN }}/secrets_raw.txt \
               -o /tmp/js-scan/${{ env.DOMAIN }}/secrets_raw.txt

      # ─────────────────────────────────────────────
      # GF Pattern Matching for Dangerous Params
      # ─────────────────────────────────────────────
      - name: GF Pattern Analysis
        run: |
          if [ -s /tmp/js-scan/${{ env.DOMAIN }}/all_urls.txt ]; then
            # Find SSRF-prone parameters
            cat /tmp/js-scan/${{ env.DOMAIN }}/all_urls.txt | \
              gf ssrf > /tmp/js-scan/${{ env.DOMAIN }}/gf_ssrf.txt 2>/dev/null || true
            
            # Find redirect parameters
            cat /tmp/js-scan/${{ env.DOMAIN }}/all_urls.txt | \
              gf redirect > /tmp/js-scan/${{ env.DOMAIN }}/gf_redirect.txt 2>/dev/null || true
            
            # Find XSS-prone parameters
            cat /tmp/js-scan/${{ env.DOMAIN }}/all_urls.txt | \
              gf xss > /tmp/js-scan/${{ env.DOMAIN }}/gf_xss.txt 2>/dev/null || true
            
            # Find SQLi-prone parameters
            cat /tmp/js-scan/${{ env.DOMAIN }}/all_urls.txt | \
              gf sqli > /tmp/js-scan/${{ env.DOMAIN }}/gf_sqli.txt 2>/dev/null || true
            
            # Find LFI-prone parameters
            cat /tmp/js-scan/${{ env.DOMAIN }}/all_urls.txt | \
              gf lfi > /tmp/js-scan/${{ env.DOMAIN }}/gf_lfi.txt 2>/dev/null || true
            
            SSRF_COUNT=$(wc -l < /tmp/js-scan/${{ env.DOMAIN }}/gf_ssrf.txt 2>/dev/null || echo 0)
            XSS_COUNT=$(wc -l < /tmp/js-scan/${{ env.DOMAIN }}/gf_xss.txt 2>/dev/null || echo 0)
            SQLI_COUNT=$(wc -l < /tmp/js-scan/${{ env.DOMAIN }}/gf_sqli.txt 2>/dev/null || echo 0)
            REDIR_COUNT=$(wc -l < /tmp/js-scan/${{ env.DOMAIN }}/gf_redirect.txt 2>/dev/null || echo 0)
            LFI_COUNT=$(wc -l < /tmp/js-scan/${{ env.DOMAIN }}/gf_lfi.txt 2>/dev/null || echo 0)
            
            echo "SSRF_COUNT=$SSRF_COUNT"   >> $GITHUB_ENV
            echo "XSS_COUNT=$XSS_COUNT"     >> $GITHUB_ENV
            echo "SQLI_COUNT=$SQLI_COUNT"   >> $GITHUB_ENV
            echo "REDIR_COUNT=$REDIR_COUNT" >> $GITHUB_ENV
            echo "LFI_COUNT=$LFI_COUNT"     >> $GITHUB_ENV
          fi

      # ─────────────────────────────────────────────
      # Nuclei — Exposed Secrets / Tokens Scan
      # ─────────────────────────────────────────────
      - name: Nuclei Secrets Scan
        run: |
          if [ -s /tmp/js-scan/${{ env.DOMAIN }}/live_urls.txt ]; then
            nuclei \
              -list /tmp/js-scan/${{ env.DOMAIN }}/live_urls.txt \
              -t exposures/ \
              -t token-spray/ \
              -silent -j \
              -o /tmp/js-scan/${{ env.DOMAIN }}/nuclei_secrets.json \
              -c 20 -timeout 10 2>/dev/null || true
            
            SECRET_COUNT=$(wc -l < /tmp/js-scan/${{ env.DOMAIN }}/nuclei_secrets.json 2>/dev/null || echo 0)
            echo "SECRET_COUNT=$SECRET_COUNT" >> $GITHUB_ENV
          fi

      # ─────────────────────────────────────────────
      # Discord Report
      # ─────────────────────────────────────────────
      - name: Discord Report
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          TOTAL_GF=$(( \
            ${SSRF_COUNT:-0} + ${XSS_COUNT:-0} + \
            ${SQLI_COUNT:-0} + ${REDIR_COUNT:-0} + ${LFI_COUNT:-0} \
          ))
          
          COLOR=3066993
          [ "$TOTAL_GF" -gt 0 ] && COLOR=16776960
          [ "${SECRET_COUNT:-0}" -gt 0 ] && COLOR=15158332
          
          PAYLOAD=$(jq -n \
            --arg domain    "${{ env.DOMAIN }}" \
            --arg js        "${JS_COUNT:-0}" \
            --arg secrets   "${SECRET_COUNT:-0}" \
            --arg ssrf      "${SSRF_COUNT:-0}" \
            --arg xss       "${XSS_COUNT:-0}" \
            --arg sqli      "${SQLI_COUNT:-0}" \
            --arg redirect  "${REDIR_COUNT:-0}" \
            --arg lfi       "${LFI_COUNT:-0}" \
            --arg run_url   "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson color "$COLOR" \
            '{
              username: "🕵️ JSBot",
              embeds: [{
                title: ("🕵️ JS & Secrets Report: " + $domain),
                color: $color,
                fields: [
                  { name: "📜 JS Files",        value: $js,       inline: true },
                  { name: "🔑 Exposed Secrets", value: $secrets,  inline: true },
                  { name: "🔥 SSRF Params",     value: $ssrf,     inline: true },
                  { name: "💉 XSS Params",      value: $xss,      inline: true },
                  { name: "💾 SQLi Params",     value: $sqli,     inline: true },
                  { name: "🔄 Redirect Params", value: $redirect, inline: true },
                  { name: "📂 LFI Params",      value: $lfi,      inline: true },
                  { name: "📋 Report",          value: ("[View Run](" + $run_url + ")"), inline: false }
                ],
                footer: { text: "BugBountyCI • GitHub Actions" },
                timestamp: now | todate
              }]
            }')
          
          curl -s -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: js-secrets-${{ env.DOMAIN }}-${{ github.run_number }}
          path: /tmp/js-scan/${{ env.DOMAIN }}/
          retention-days: 60
