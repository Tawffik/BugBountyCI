name: "BugBountyCI Recon Pipeline"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target domain (e.g., datacamp.com)"
        required: true
        type: string
      mode:
        description: "Scan mode"
        type: choice
        options:
          - full
          - quick
          - subdomains-only
          - scanning-only
        default: "full"

concurrency:
  group: bugbounty-${{ github.event.inputs.target }}
  cancel-in-progress: false

env:
  TARGET: ${{ github.event.inputs.target }}
  RESULTS_DIR: "results/${{ github.event.inputs.target }}"
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

defaults:
  run:
    shell: bash

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cache Go Tools
        id: cache-go
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/go/pkg/mod
            ~/.cache/nuclei
          key: ${{ runner.os }}-go-tools-${{ hashFiles('.github/.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Install Core Tools
        if: steps.cache-go.outputs.cache-hit != 'true'
        run: |
          export GOPATH=$HOME/go
          export PATH=$PATH:$HOME/go/bin
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/projectdiscovery/katana/cmd/katana@latest
          go install github.com/lc/gau/v2/cmd/gau@latest
          go install github.com/tomnomnom/anew@latest
          go install github.com/tomnomnom/gf@latest
          git clone --depth 1 https://github.com/1ndianl33t/Gf-Patterns /tmp/gfp
          mkdir -p ~/.gf && cp /tmp/gfp/*.json ~/.gf/ 2>/dev/null || true
          nuclei -update-templates -silent
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Create Directories
        run: |
          mkdir -p ${{ env.RESULTS_DIR }}/{subdomains,live,urls,js,findings,reports}

  recon:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    ريس :
      - يستخدم : actions/checkout@v4

      - الاسم : تعداد النطاقات الفرعية
        تشغيل : |
          export PATH=$HOME/go/bin:$PATH
          subfinder -d ${{ env.TARGET }} -all -silent > /tmp/subs_raw.txt
          dnsx -silent -a -l /tmp/subs_raw.txt > /tmp/resolved.txt
          sort -u /tmp/resolved.txt > ${{ env.RESULTS_DIR }}/subdomains/all_subs.txt

      - الاسم : فحص HTTP
        تشغيل : |
          export PATH=$HOME/go/bin:$PATH
          httpx -l ${{ env.RESULTS_DIR }}/subdomains/all_subs.txt \
            -صامت -رمز الحالة -العنوان -الكشف التقني
            -متابعة-إعادة-التوجيه -عدد-الخيوط 50 -مهلة 10 -عدد-محاولات-1
            -o ${{ env.RESULTS_DIR }}/live/live_hosts.txt
          awk '{print $1}' ${{ env.RESULTS_DIR }}/live/live_hosts.txt \
            > ${{ env.RESULTS_DIR }}/live/urls.txt

      - name: URL Collection
        run: |
          export PATH=$HOME/go/bin:$PATH
          gau --threads 5 ${{ env.TARGET }} > /tmp/gau_urls.txt 2>/dev/null || true
          if [ -s ${{ env.RESULTS_DIR }}/live/urls.txt ]; then
            head -20 ${{ env.RESULTS_DIR }}/live/urls.txt | \
              katana -silent -jc -d 2 -c 20 -timeout 10 \
              -o /tmp/katana_urls.txt 2>/dev/null || true
          fi
          cat /tmp/gau_urls.txt /tmp/katana_urls.txt 2>/dev/null | \
            sort -u > ${{ env.RESULTS_DIR }}/urls/all_urls.txt
          grep -vE '\.(png|jpg|jpeg|gif|svg|woff|css|mp4|webp|ico)$' \
            ${{ env.RESULTS_DIR }}/urls/all_urls.txt \
            > ${{ env.RESULTS_DIR }}/urls/clean_urls.txt

      - name: High-Value Endpoints
        run: |
          grep -iE '(admin|dashboard|graphql|swagger|api/v|firebase|auth|login|oauth|jwt|token|debug|dev|test|staging|internal|\.env|\.git|config|health|metrics|jenkins|phpmyadmin|wp-admin|upload|download|redirect|proxy)' \
            ${{ env.RESULTS_DIR }}/urls/clean_urls.txt \
            > ${{ env.RESULTS_DIR }}/urls/high_value.txt || true

      - name: Upload Recon Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recon-${{ env.TARGET }}
          path: ${{ env.RESULTS_DIR }}/
          retention-days: 30
          if-no-files-found: warn
