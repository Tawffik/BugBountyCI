name: "BugBountyCI Recon Pipeline"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target domain (e.g. example.com)"
        required: true
        type: string
      mode:
        description: "Scan mode"
        required: true
        type: choice
        options: [full, quick, subdomains-only]
        default: full

concurrency:
  group: bugbounty-${{ github.event.inputs.target }}
  cancel-in-progress: false

env:
  TARGET: ${{ github.event.inputs.target }}
  MODE: ${{ github.event.inputs.mode }}

defaults:
  run:
    shell: bash

jobs:

  # ── STAGE 1: RECON ────────────────────────────────────────
  recon:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    outputs:
      subdomain_count: ${{ steps.merge.outputs.count }}
      live_count: ${{ steps.probe.outputs.count }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      # FIXED: Cache restored HERE, in the job that needs it
      - name: Restore Go Tool Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-v2
          restore-keys: go-tools-${{ runner.os }}-

      - name: Install Tools (if cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/projectdiscovery/katana/cmd/katana@latest
          go install github.com/lc/gau/v2/cmd/gau@latest
          go install github.com/tomnomnom/anew@latest
          go install github.com/tomnomnom/gf@latest
          git clone --depth 1 https://github.com/1ndianl33t/Gf-Patterns /tmp/gfp 2>/dev/null || true
          mkdir -p ~/.gf && cp /tmp/gfp/*.json ~/.gf/ 2>/dev/null || true

      # FIXED: PATH updated ALWAYS, not just on cache miss
      - name: Update PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Subdomain Enumeration
        run: |
          mkdir -p /tmp/recon/subdomains

          subfinder -d "$TARGET" -all -silent \
            -o /tmp/recon/subdomains/subfinder.txt 2>/dev/null || true

          # crt.sh
          curl -s "https://crt.sh/?q=%25.$TARGET&output=json" 2>/dev/null \
            | jq -r '.[].name_value' 2>/dev/null \
            | sed 's/\*\.//g' \
            | grep -iE "\.${TARGET}$" \
            | sort -u > /tmp/recon/subdomains/crtsh.txt || true

          echo "subfinder: $(wc -l < /tmp/recon/subdomains/subfinder.txt 2>/dev/null || echo 0)"
          echo "crtsh: $(wc -l < /tmp/recon/subdomains/crtsh.txt 2>/dev/null || echo 0)"

      - name: Merge & Validate Subdomains
        id: merge
        run: |
          cat /tmp/recon/subdomains/*.txt 2>/dev/null \
            | grep -iE "\.${TARGET}$" \
            | sort -u > /tmp/recon/all_subs.txt

          # DNS validation — FIXED: pass actual subdomains, not wordlist
          dnsx -l /tmp/recon/all_subs.txt -silent -a \
            -o /tmp/recon/resolved.txt 2>/dev/null || \
            cp /tmp/recon/all_subs.txt /tmp/recon/resolved.txt

          COUNT=$(wc -l < /tmp/recon/resolved.txt)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Resolved: $COUNT"

      - name: HTTP Probe
        id: probe
        run: |
          mkdir -p /tmp/recon/live
          INPUT=/tmp/recon/resolved.txt
          [ ! -s "$INPUT" ] && echo "$TARGET" > "$INPUT"

          httpx -l "$INPUT" \
            -silent \
            -status-code -title -tech-detect \
            -follow-redirects -max-redirects 3 \
            -threads 50 -timeout 8 -retries 1 \
            -o /tmp/recon/live/live_hosts.txt \
            -json -j /tmp/recon/live/live.json \
            2>/dev/null || true

          # Extract clean URLs only
          jq -r '.url' /tmp/recon/live/live.json 2>/dev/null \
            | sort -u > /tmp/recon/live/urls.txt || \
            grep -oE 'https?://[^ ]+' /tmp/recon/live/live_hosts.txt \
            | sort -u > /tmp/recon/live/urls.txt

          COUNT=$(wc -l < /tmp/recon/live/urls.txt)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Live: $COUNT"

      - name: URL Collection
        if: env.MODE != 'subdomains-only'
        run: |
          mkdir -p /tmp/recon/urls

          # GAU
          gau "$TARGET" --subs \
            --blacklist png,jpg,jpeg,gif,svg,woff,woff2,css,mp4,webp,ico,ttf,eot \
            --o /tmp/recon/urls/gau.txt 2>/dev/null || true

          # Katana — FIXED: use -list flag, not stdin pipe
          if [ -s /tmp/recon/live/urls.txt ]; then
            katana \
              -list /tmp/recon/live/urls.txt \
              -silent -jc \
              -depth 3 \
              -concurrency 20 \
              -timeout 10 \
              -ef css,svg,png,jpg,gif,ico,woff,ttf \
              -o /tmp/recon/urls/katana.txt \
              2>/dev/null || true
          fi

          # Merge
          cat /tmp/recon/urls/*.txt 2>/dev/null \
            | grep -iE "^https?://" \
            | grep -vE '\.(png|jpg|jpeg|gif|svg|woff|woff2|css|mp4|webp|ico|ttf|eot)$' \
            | sort -u \
            > /tmp/recon/urls/all_urls.txt

          echo "URLs: $(wc -l < /tmp/recon/urls/all_urls.txt)"

      - name: High-Value Endpoint Extraction
        if: env.MODE != 'subdomains-only'
        run: |
          # FIXED: extract full URLs, not just keywords
          grep -iE \
            '(admin|dashboard|graphql|swagger|/api/v[0-9]|firebase|/auth/|/oauth|/jwt|/token|/debug|/dev/|/test/|/staging|/internal|\.env|\.git|/config|/health|/metrics|jenkins|phpmyadmin|wp-admin|/upload|/download|/redirect|/proxy|/backup|actuator)' \
            /tmp/recon/urls/all_urls.txt \
            > /tmp/recon/urls/high_value.txt 2>/dev/null || true

          # Separate by category
          grep -iE '(graphql|gql|graphiql)' /tmp/recon/urls/all_urls.txt \
            > /tmp/recon/urls/graphql.txt 2>/dev/null || true
          grep -iE '(swagger|openapi|api-docs)' /tmp/recon/urls/all_urls.txt \
            > /tmp/recon/urls/swagger.txt 2>/dev/null || true
          grep -iE '(firebase|firebaseio|firebaseapp)' /tmp/recon/urls/all_urls.txt \
            > /tmp/recon/urls/firebase.txt 2>/dev/null || true

          echo "High-value: $(wc -l < /tmp/recon/urls/high_value.txt)"
          echo "GraphQL: $(wc -l < /tmp/recon/urls/graphql.txt)"
          echo "Swagger: $(wc -l < /tmp/recon/urls/swagger.txt)"

      - name: Upload Recon Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recon-${{ env.TARGET }}-${{ github.run_id }}
          path: /tmp/recon/
          retention-days: 30
          if-no-files-found: warn

  # ── STAGE 2: NUCLEI (skipped in subdomains-only mode) ─────
  nuclei-scan:
    needs: recon
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    if: ${{ github.event.inputs.mode != 'subdomains-only' }}

    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      # FIXED: Nuclei template cache
      - name: Restore Nuclei Templates
        uses: actions/cache@v4
        with:
          path: ~/.local/nuclei-templates
          key: nuclei-templates-weekly-${{ github.run_id }}
          restore-keys: nuclei-templates-weekly-

      # FIXED: Go tools cache restored HERE
      - name: Restore Go Tool Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-v2

      - name: Install Nuclei (if cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest

      - name: Update PATH
        run: |
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Update Nuclei Templates
        run: |
          nuclei -update-templates -ud ~/.local/nuclei-templates -silent 2>/dev/null || true

      - name: Download Recon Artifacts
        uses: actions/download-artifact@v4
        with:
          name: recon-${{ env.TARGET }}-${{ github.run_id }}
          path: /tmp/recon/

      - name: Prepare Scan Targets
        run: |
          cat \
            /tmp/recon/live/urls.txt \
            /tmp/recon/urls/high_value.txt \
            2>/dev/null | sort -u > /tmp/scan_targets.txt

          echo "Scan targets: $(wc -l < /tmp/scan_targets.txt)"

          if [ ! -s /tmp/scan_targets.txt ]; then
            echo "https://$TARGET" > /tmp/scan_targets.txt
          fi

      - name: Nuclei — Exposure & Misconfiguration
        continue-on-error: true
        run: |
          mkdir -p /tmp/findings

          nuclei \
            -list /tmp/scan_targets.txt \
            -ud ~/.local/nuclei-templates \
            -tags "exposure,misconfig,config,token,secret,panel,takeover" \
            -severity "critical,high" \
            -rl 50 \
            -c 10 \
            -timeout 8 \
            -retries 1 \
            -silent \
            -json \
            -o /tmp/findings/exposures.json \
            2>/dev/null || true

          echo "Exposures: $(wc -l < /tmp/findings/exposures.json 2>/dev/null || echo 0)"

      - name: Nuclei — Subdomain Takeover
        continue-on-error: true
        run: |
          nuclei \
            -list /tmp/recon/resolved.txt \
            -ud ~/.local/nuclei-templates \
            -tags "takeover,dns" \
            -severity "critical,high,medium" \
            -rl 30 -c 10 \
            -silent -json \
            -o /tmp/findings/takeovers.json \
            2>/dev/null || true

          echo "Takeovers: $(wc -l < /tmp/findings/takeovers.json 2>/dev/null || echo 0)"

      - name: Extract Priority Findings
        run: |
          cat /tmp/findings/*.json 2>/dev/null \
            | jq -r 'select(.info.severity == "critical" or .info.severity == "high") |
                "[" + (.info.severity | ascii_upcase) + "] " + .info.name + " → " + .host' \
            | sort -u > /tmp/findings/priority.txt 2>/dev/null || true

          echo "Priority findings:"
          cat /tmp/findings/priority.txt 2>/dev/null || echo "None"

      - name: Upload Findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findings-${{ env.TARGET }}-${{ github.run_id }}
          path: /tmp/findings/
          retention-days: 30
          if-no-files-found: warn

  # ── STAGE 3: JS ANALYSIS ──────────────────────────────────
  js-analysis:
    needs: recon
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    if: ${{ github.event.inputs.mode == 'full' }}

    steps:
      - name: Download Recon Artifacts
        uses: actions/download-artifact@v4
        with:
          name: recon-${{ env.TARGET }}-${{ github.run_id }}
          path: /tmp/recon/

      - name: Extract JS URLs
        run: |
          mkdir -p /tmp/js/content
          grep -iE '\.js($|\?)' /tmp/recon/urls/all_urls.txt 2>/dev/null \
            | grep -v '\.min\.js' \
            | sort -u > /tmp/js/js_urls.txt || true
          echo "JS URLs: $(wc -l < /tmp/js/js_urls.txt)"

      # FIXED: Download actual JS content, then analyze
      - name: Download & Analyze JS Content
        run: |
          head -150 /tmp/js/js_urls.txt 2>/dev/null | while IFS= read -r url; do
            [ -z "$url" ] && continue
            fname=$(echo "$url" | md5sum | cut -d' ' -f1).js
            curl -skL --max-time 10 "$url" \
              -o "/tmp/js/content/${fname}" 2>/dev/null || true
          done

          # Combine all content
          cat /tmp/js/content/*.js 2>/dev/null > /tmp/js/all_content.txt || true
          echo "Content size: $(wc -c < /tmp/js/all_content.txt 2>/dev/null || echo 0) bytes"

      - name: Secret Detection on JS Content
        run: |
          # FIXED: grep on actual content
          grep -Eoi \
            "(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z\-_]{35}|sk_live_[0-9a-z]{24}|sk_test_[0-9a-z]{24}|SG\.[a-zA-Z0-9_\-]{22,}|[a-zA-Z0-9_\-]{32,}\.apps\.googleusercontent\.com)" \
            /tmp/js/all_content.txt 2>/dev/null \
            | sort -u > /tmp/js/secrets.txt || true

          # API endpoints from JS
          grep -Eoi '"(/api/[a-zA-Z0-9/_\-?=&%]{3,80})"' \
            /tmp/js/all_content.txt 2>/dev/null \
            | tr -d '"' | sort -u > /tmp/js/api_endpoints.txt || true

          echo "Secrets found: $(wc -l < /tmp/js/secrets.txt)"
          echo "API endpoints: $(wc -l < /tmp/js/api_endpoints.txt)"

      - name: Upload JS Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-${{ env.TARGET }}-${{ github.run_id }}
          path: /tmp/js/
          retention-days: 30
          if-no-files-found: warn

  # ── STAGE 4: DISCORD NOTIFY ───────────────────────────────
  discord-notify:
    needs: [recon, nuclei-scan, js-analysis]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - name: Download Recon
        uses: actions/download-artifact@v4
        with:
          name: recon-${{ env.TARGET }}-${{ github.run_id }}
          path: /tmp/recon/
        continue-on-error: true

      - name: Download Findings
        uses: actions/download-artifact@v4
        with:
          name: findings-${{ env.TARGET }}-${{ github.run_id }}
          path: /tmp/findings/
        continue-on-error: true

      - name: Download JS Results
        uses: actions/download-artifact@v4
        with:
          name: js-${{ env.TARGET }}-${{ github.run_id }}
          path: /tmp/js/
        continue-on-error: true

      - name: Build & Send Discord Report
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          SUBS=$(wc -l < /tmp/recon/resolved.txt 2>/dev/null || echo 0)
          LIVE=$(wc -l < /tmp/recon/live/urls.txt 2>/dev/null || echo 0)
          HV=$(wc -l < /tmp/recon/urls/high_value.txt 2>/dev/null || echo 0)
          GRAPHQL=$(wc -l < /tmp/recon/urls/graphql.txt 2>/dev/null || echo 0)
          SWAGGER=$(wc -l < /tmp/recon/urls/swagger.txt 2>/dev/null || echo 0)
          SEC=$(wc -l < /tmp/js/secrets.txt 2>/dev/null || echo 0)
          PRIORITY=$(wc -l < /tmp/findings/priority.txt 2>/dev/null || echo 0)

          # Color based on findings
          COLOR=5814783  # blue default
          [ "$PRIORITY" -gt 0 ] && COLOR=15158332  # red
          [ "$PRIORITY" -eq 0 ] && [ "$SEC" -gt 0 ] && COLOR=16744192  # orange

          # Top 10 priority findings
          TOP=$(head -10 /tmp/findings/priority.txt 2>/dev/null \
            | sed 's/"/\\"/g' \
            | awk '{print "• "$0}' \
            | tr '\n' '\n' || echo "None")
          [ -z "$TOP" ] && TOP="None"

          jq -n \
            --arg target "$TARGET" \
            --arg subs "$SUBS" \
            --arg live "$LIVE" \
            --arg hv "$HV" \
            --arg gql "$GRAPHQL" \
            --arg sw "$SWAGGER" \
            --arg sec "$SEC" \
            --arg priority "$PRIORITY" \
            --arg top "$TOP" \
            --arg run "${{ github.run_number }}" \
            --argjson color "$COLOR" \
            '{
              username: "BugBountyCI",
              embeds: [{
                title: ("Recon: " + $target),
                color: $color,
                fields: [
                  {name: "📊 Recon",
                   value: ("Subs: **"+$subs+"** | Live: **"+$live+"** | High-Value: **"+$hv+"**"),
                   inline: false},
                  {name: "🎯 APIs",
                   value: ("GraphQL: **"+$gql+"** | Swagger: **"+$sw+"**"),
                   inline: false},
                  {name: ("🚨 Priority Findings ("+$priority+")"),
                   value: $top,
                   inline: false},
                  {name: ("🔑 JS Secrets ("+$sec+")"),
                   value: (if ($sec|tonumber) > 0 then "⚠️ Check artifact" else "None" end),
                   inline: false}
                ],
                footer: {text: ("Run #"+$run)}
              }]
            }' | curl -s -X POST "$WEBHOOK" \
                   -H "Content-Type: application/json" \
                   -d @- || صحيح
