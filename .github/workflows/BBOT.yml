name: BBOT Recon

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Target Domain"
        required: true

jobs:
  recon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install BBOT
        run: |
          python3 -m pip install --upgrade pip
          pip install bbot

      - name: Run BBOT Scan
        run: |
          mkdir -p output
          bbot -t "${{ github.event.inputs.domain }}" \
          -f subdomain-enum web-basic \
          -o output

      - name: Zip Results
        run: |
          zip -r results.zip output

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bbot-results
          path: results.zip

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"content\":\"✅ BBOT scan finished for: ${{ github.event.inputs.domain }}\"}" \
          $DISCORD_WEBHOOK
