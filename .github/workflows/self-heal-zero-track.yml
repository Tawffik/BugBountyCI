name: self-heal-zero-track-workflow
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/_payload/**"
      - "scripts/assemble_workflow.py"
      - ".github/workflows/self-heal-zero-track.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - name: Assemble and restore zero-track-hunter.yml
        run: |
          set -euo pipefail
          python3 scripts/assemble_workflow.py
          SIZE=$(wc -c < .github/workflows/zero-track-hunter.yml)
          echo "assembled size=$SIZE"
          test "$SIZE" -gt 100000
          grep -q "record_probe" .github/workflows/zero-track-hunter.yml
          grep -q "PROBE_CAP" .github/workflows/zero-track-hunter.yml
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zero-track-hunter.yml')); print('YAML_OK')"
          git config user.name "Tawffik"
          git config user.email "150173255+Tawffik@users.noreply.github.com"
          git add .github/workflows/zero-track-hunter.yml
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix(workflow): restore zero-track-hunter.yml via payload assemble (always-record PROBE_CAP=48)"
            git push origin HEAD:${{ github.ref_name }}
          fi
