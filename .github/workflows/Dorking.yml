name: Dork Intelligence Hunter (Single-File)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Target domain (e.g. example.com)'
        required: true
      organization:
        description: 'Organization name (optional)'
        required: false
      keywords:
        description: 'Additional keywords, comma-separated'
        required: false
      output_format:
        description: 'Report formats (json,csv,md)'
        required: false
        default: 'json,md'
      enable_ai:
        description: 'Enable AI triage if API key present'
        required: false
        default: 'true'

jobs:
  dork-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml rich pandas openai

      - name: Write self-contained scanner script
        run: |
          cat > dork_hunter.py << 'PYEOF'
          #!/usr/bin/env python3
          import os, json, csv, sys, logging, hashlib
          from datetime import datetime
          from collections import Counter
          from typing import List, Dict, Optional, Tuple
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          from rich.console import Console
          from rich.logging import RichHandler

          # ------------------------------------------------------------------
          # Logging
          logging.basicConfig(level=logging.INFO, format="%(message)s",
                              handlers=[RichHandler(rich_tracebacks=True)])
          log = logging.getLogger("dork_hunter")
          console = Console()

          # ------------------------------------------------------------------
          # Dork Templates (embedded, no YAML files needed)
          DORKS = {
              "google": [
                  "site:{domain} filetype:env",
                  "site:{domain} filetype:json",
                  "site:{domain} filetype:sql",
                  "site:{domain} intitle:\"index of\"",
                  "site:{domain} inurl:.git",
                  "site:{domain} filetype:log",
                  "site:{domain} filetype:bak",
                  "site:{domain} filetype:conf",
                  "site:{domain} filetype:yaml",
                  "site:{domain} filetype:xml",
                  "site:{domain} filetype:ini",
                  "site:{domain} filetype:cfg",
                  "site:{domain} ext:swp",
                  "site:{domain} ext:old",
                  "site:{domain} \"password\"",
                  "site:{domain} \"secret\"",
                  "site:{domain} \"API_KEY\"",
                  "site:{domain} \"token\"",
                  "site:{domain} \"TODO\" \"FIXME\""
              ],
              "github": [
                  "{domain} filename:.env",
                  "{domain} filename:.npmrc",
                  "{domain} filename:id_rsa",
                  "{domain} filename:credentials",
                  "{domain} filename:config",
                  "{domain} filename:.git-credentials",
                  "{domain} filename:.s3cfg",
                  "{domain} org:{organization}"
              ],
              "cloud": [
                  "site:{domain} \"s3.amazonaws.com\"",
                  "site:{domain} \"storage.googleapis.com\"",
                  "site:{domain} \"blob.core.windows.net\"",
                  "site:{domain} \"cloudfront.net\"",
                  "site:{domain} inurl:aws",
                  "site:{domain} inurl:azure",
                  "site:{domain} inurl:gcp"
              ],
              "sensitive": [
                  "site:{domain} inurl:wp-content",
                  "site:{domain} inurl:admin",
                  "site:{domain} inurl:phpinfo",
                  "site:{domain} inurl:server-status",
                  "site:{domain} \"Index of\" \"backup\"",
                  "site:{domain} \"Index of\" \"dump\"",
                  "site:{domain} \"Index of\" \"private\"",
                  "site:{domain} \"Index of\" \"secret\""
              ]
          }

          # ------------------------------------------------------------------
          # Dork Generator
          class DorkGenerator:
              def generate(self, domain: str, organization: str = "", keywords: str = "") -> List[Dict[str, str]]:
                  queries = []
                  for source, templates in DORKS.items():
                      for tpl in templates:
                          q = tpl.replace("{domain}", domain)
                          if organization:
                              q = q.replace("{organization}", organization)
                          if "{keywords}" in q:
                              if keywords:
                                  q = q.replace("{keywords}", keywords)
                              else:
                                  continue
                          queries.append({"query": q, "source": source})
                  return queries

          # ------------------------------------------------------------------
          # Search Adapters
          class SearchSession:
              def __init__(self):
                  retries = Retry(total=3, backoff_factor=1,
                                  status_forcelist=[429, 500, 502, 503, 504])
                  adapter = HTTPAdapter(max_retries=retries)
                  self.session = requests.Session()
                  self.session.mount("https://", adapter)
                  self.session.mount("http://", adapter)

          se = SearchSession().session

          def google_search(query: str, api_key: str, cx: str) -> List[Dict]:
              url = "https://www.googleapis.com/customsearch/v1"
              params = {"key": api_key, "cx": cx, "q": query, "num": 10}
              try:
                  resp = se.get(url, params=params, timeout=15)
                  resp.raise_for_status()
                  data = resp.json()
              except Exception as e:
                  log.error(f"Google: {e}")
                  return []
              results = []
              for item in data.get("items", []):
                  results.append(_norm(item.get("link"), item.get("title",""), "google", query))
              return results

          def bing_search(query: str, api_key: str) -> List[Dict]:
              url = "https://api.bing.microsoft.com/v7.0/search"
              headers = {"Ocp-Apim-Subscription-Key": api_key}
              params = {"q": query, "count": 10}
              try:
                  resp = se.get(url, headers=headers, params=params, timeout=15)
                  resp.raise_for_status()
                  data = resp.json()
              except Exception as e:
                  log.error(f"Bing: {e}")
                  return []
              results = []
              for item in data.get("webPages", {}).get("value", []):
                  results.append(_norm(item.get("url"), item.get("name",""), "bing", query))
              return results

          def brave_search(query: str, api_key: str) -> List[Dict]:
              url = "https://api.search.brave.com/res/v1/web/search"
              headers = {"Accept": "application/json", "X-Subscription-Token": api_key}
              params = {"q": query, "count": 10}
              try:
                  resp = se.get(url, headers=headers, params=params, timeout=15)
                  resp.raise_for_status()
                  data = resp.json()
              except Exception as e:
                  log.error(f"Brave: {e}")
                  return []
              results = []
              for item in data.get("web", {}).get("results", []):
                  results.append(_norm(item.get("url"), item.get("title",""), "brave", query))
              return results

          def github_search_code(query: str, token: str) -> List[Dict]:
              url = "https://api.github.com/search/code"
              headers = {"Authorization": f"token {token}",
                         "Accept": "application/vnd.github.v3+json"}
              params = {"q": query, "per_page": 30}
              try:
                  resp = se.get(url, headers=headers, params=params, timeout=20)
                  resp.raise_for_status()
                  data = resp.json()
              except Exception as e:
                  log.error(f"GitHub: {e}")
                  return []
              results = []
              for item in data.get("items", []):
                  results.append(_norm(item["html_url"],
                                       f"{item['repository']['full_name']}/{item['name']}",
                                       "github", query))
              return results

          def _norm(url, title, source, query):
              return {
                  "url": url,
                  "title": title,
                  "source": source,
                  "query": query,
                  "category": "",
                  "severity": "",
                  "confidence": "",
                  "timestamp": datetime.utcnow().isoformat()
              }

          # ------------------------------------------------------------------
          # Classifier
          def classify(result: Dict, use_ai: bool = False, openai_key: Optional[str] = None) -> Dict:
              result = _rule_classify(result)
              if use_ai and openai_key:
                  try:
                      import openai as ai
                      ai.api_key = openai_key
                      prompt = (
                          "Classify this security finding from a dork scan. "
                          "Provide: category (Sensitive Files, Repository Exposure, Cloud Exposure, "
                          "Technology Discovery, Information Disclosure), severity (High,Medium,Low,Info), "
                          "confidence (0-1), and a short (max 50 words) explanation. "
                          "Return ONLY valid JSON: {\"category\":\"...\",\"severity\":\"...\",\"confidence\":0.X,\"explanation\":\"...\"}\n\n"
                          f"URL: {result['url']}\nTitle: {result.get('title','')}\nSource: {result.get('source','')}\nQuery: {result.get('query','')}"
                      )
                      resp = ai.ChatCompletion.create(
                          model="gpt-3.5-turbo", messages=[{"role":"user","content":prompt}],
                          temperature=0.2, max_tokens=150
                      )
                      data = json.loads(resp.choices[0].message.content.strip())
                      result["category"] = data.get("category", result["category"])
                      result["severity"] = data.get("severity", result["severity"])
                      result["confidence"] = data.get("confidence", result["confidence"])
                      result["ai_summary"] = data.get("explanation", "")
                  except Exception as e:
                      log.warning(f"AI classification failed: {e}")
              return result

          def _rule_classify(r: Dict) -> Dict:
              url = r.get("url","").lower()
              sensitive_exts = [".env",".git",".bak",".sql",".log",".conf",".yaml",
                                ".json",".xml",".ini",".cfg",".swp",".old",".pem"]
              if any(ext in url for ext in sensitive_exts):
                  r["category"] = "Sensitive Files"; r["severity"] = "High"; r["confidence"] = 0.9
                  return r
              if ".git/" in url or "github.com" in url or "/src/" in url:
                  r["category"] = "Repository Exposure"; r["severity"] = "High"; r["confidence"] = 0.8
                  return r
              cloud_inds = ["s3.amazonaws.com","storage.googleapis.com","blob.core.windows.net",
                            "cloudfront.net","aws","azure","gcp","bucket"]
              if any(ind in url for ind in cloud_inds):
                  r["category"] = "Cloud Exposure"; r["severity"] = "Medium"; r["confidence"] = 0.75
                  return r
              tech_inds = ["wp-content","phpinfo","server-status","admin","login","dashboard",
                           "drupal","joomla","web.config"]
              if any(ind in url for ind in tech_inds):
                  r["category"] = "Technology Discovery"; r["severity"] = "Low"; r["confidence"] = 0.7
                  return r
              info_inds = ["email","doc","pdf","xls","csv","readme","changelog","backup","dump"]
              if any(ind in url for ind in info_inds):
                  r["category"] = "Information Disclosure"; r["severity"] = "Low"; r["confidence"] = 0.6
                  return r
              r["category"] = "Information Disclosure"; r["severity"] = "Info"; r["confidence"] = 0.5
              return r

          # ------------------------------------------------------------------
          # Deduplication & Reporting
          def dedup(findings: List[Dict]) -> List[Dict]:
              seen = set(); unique = []
              for f in findings:
                  u = f["url"].rstrip("/")
                  if u and u not in seen:
                      seen.add(u); unique.append(f)
              return unique

          def write_reports(findings: List[Dict], domain: str, stats: Dict,
                            output_dir: str = "reports", previous_findings: Optional[List[Dict]] = None,
                            formats: List[str] = ["json","md"]):
              os.makedirs(output_dir, exist_ok=True)
              if "json" in formats:
                  with open(os.path.join(output_dir,"results.json"),"w") as f:
                      json.dump(findings, f, indent=2, ensure_ascii=False)
              if "csv" in formats:
                  if findings:
                      with open(os.path.join(output_dir,"results.csv"),"w",newline="") as f:
                          writer = csv.DictWriter(f, fieldnames=findings[0].keys())
                          writer.writeheader(); writer.writerows(findings)
              if "md" in formats:
                  with open(os.path.join(output_dir,"report.md"),"w") as f:
                      f.write(f"# Dork Intelligence Report\n\n**Target:** {domain}\n")
                      f.write(f"**Date:** {datetime.now().strftime('%Y-%m-%d %H:%M')}\n\n")
                      if previous_findings is not None:
                          prev_urls = {p["url"].rstrip("/") for p in previous_findings}
                          new = [x for x in findings if x["url"].rstrip("/") not in prev_urls]
                          f.write("## 🆕 New Discoveries\n\n")
                          if new:
                              f.write("| URL | Category | Severity |\n|---|---|---|\n")
                              for item in new:
                                  f.write(f"| {item['url']} | {item['category']} | {item['severity']} |\n")
                          else:
                              f.write("No new findings.\n")
                          f.write("\n")
                      high = [x for x in findings if x.get("severity") == "High"]
                      f.write("## 🔴 High Priority Findings\n\n")
                      if high:
                          f.write("| URL | Category | Confidence |\n|---|---|---|\n")
                          for item in high:
                              f.write(f"| {item['url']} | {item['category']} | {item['confidence']} |\n")
                      else:
                          f.write("No high priority findings.\n")
                      f.write("\n## 📋 All Discoveries\n\n")
                      f.write("| URL | Category | Severity | Confidence | Source | Query |\n|---|---|---|---|---|---|\n")
                      for item in findings:
                          f.write(f"| {item['url']} | {item['category']} | {item['severity']} | "
                                  f"{item['confidence']} | {item['source']} | {item['query']} |\n")
                      f.write("\n## 📊 Statistics\n\n")
                      for k,v in stats.items():
                          f.write(f"- **{k}**: {v}\n")
              log.info(f"Reports written to {output_dir}/")

          # ------------------------------------------------------------------
          # Main execution
          def main():
              domain = os.getenv("DOMAIN")
              if not domain:
                  log.error("DOMAIN env var required"); sys.exit(1)
              org = os.getenv("ORGANIZATION","")
              keywords = os.getenv("KEYWORDS","")
              formats = os.getenv("OUTPUT_FORMAT","json,md").lower().split(",")
              use_ai = os.getenv("ENABLE_AI","true").strip().lower() == "true"

              google_key = os.getenv("GOOGLE_API_KEY")
              google_cx = os.getenv("GOOGLE_CX")
              bing_key = os.getenv("BING_API_KEY")
              brave_key = os.getenv("BRAVE_API_KEY")
              github_token = os.getenv("GITHUB_TOKEN")
              openai_key = os.getenv("OPENAI_API_KEY")

              # Generate dorks
              dg = DorkGenerator()
              queries = dg.generate(domain, org, keywords)
              log.info(f"Generated {len(queries)} dork queries.")

              # Execute searches
              all_findings = []
              for d in queries:
                  src = d["source"]
                  q = d["query"]
                  log.info(f"[{src}] {q}")
                  if src == "google" and google_key and google_cx:
                      res = google_search(q, google_key, google_cx)
                  elif src == "bing" and bing_key:
                      res = bing_search(q, bing_key)
                  elif src == "brave" and brave_key:
                      res = brave_search(q, brave_key)
                  elif src == "github" and github_token:
                      res = github_search_code(q, github_token)
                  else:
                      log.warning(f"Skipping {src} – missing credentials")
                      res = []
                  all_findings.extend(res)
                  log.info(f"  -> {len(res)} results")

              if not all_findings:
                  log.warning("No results found."); sys.exit(0)

              # Classify
              classified = [classify(f, use_ai=use_ai, openai_key=openai_key) for f in all_findings]

              # Deduplicate
              unique = dedup(classified)
              log.info(f"Dedup: {len(classified)} -> {len(unique)}")

              # Historical comparison (attempt to load previous artifact if any)
              previous = None
              prev_path = os.getenv("PREVIOUS_REPORT")
              if prev_path and os.path.isfile(prev_path):
                  try:
                      with open(prev_path) as pf:
                          previous = json.load(pf)
                      prev_urls = {p["url"].rstrip("/") for p in previous}
                      new = [f for f in unique if f["url"].rstrip("/") not in prev_urls]
                      log.info(f"Historical: {len(new)} new findings.")
                  except Exception:
                      previous = None

              stats = {
                  "Total dorks": len(queries),
                  "Raw results": len(all_findings),
                  "Unique findings": len(unique),
                  "Categories": dict(Counter(f["category"] for f in unique)),
                  "Severity": dict(Counter(f["severity"] for f in unique))
              }

              write_reports(unique, domain, stats, "reports", previous, formats)
              console.print("\n[bold green]✓ Dork Intelligence Hunter complete.[/bold green]")
              console.print(f"Unique findings: {len(unique)}")
              for cat,cnt in stats["Categories"].items():
                  console.print(f"  {cat}: {cnt}")

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Run Dork Intelligence Hunter
        env:
          DOMAIN: ${{ inputs.domain }}
          ORGANIZATION: ${{ inputs.organization }}
          KEYWORDS: ${{ inputs.keywords }}
          OUTPUT_FORMAT: ${{ inputs.output_format }}
          ENABLE_AI: ${{ inputs.enable_ai }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PREVIOUS_REPORT: previous/results.json   # Will be downloaded if available
        run: python dork_hunter.py

      - name: Download previous artifact for comparison (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dork-results
          path: previous/

      - name: Upload reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dork-results
          path: reports/
          retention-days: 30
