# ============================================================
# Zero Track Trigger - Information Disclosure Hunter
# Detection-only. Finds leaked files, secrets, schemas, and
# verbose banners. Does not inject, exploit, or brute force.
# ============================================================

name: "🔍 Zero Track Trigger - Info Disclosure Hunter"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target domain (e.g., example.com)"
        required: true
        type: string
      subdomain_enum:
        description: "Enable subdomain enumeration"
        type: boolean
        default: true
      js_secrets_scan:
        description: "Scan JS files for secrets/JWTs"
        type: boolean
        default: true
      nuclei_exposures:
        description: "Run nuclei exposure/config/backup/token templates"
        type: boolean
        default: true
      ai_analysis:
        description: "Enable AI-powered triage"
        type: boolean
        default: true
      ai_provider:
        description: "AI provider ('both' = auto waterfall through whichever keys are set: anthropic -> openrouter -> groq -> gemini)"
        type: choice
        options:
          - both
          - anthropic
          - openrouter
          - groq
          - gemini
        default: "both"
      discord_notify:
        description: "Send Discord notification"
        type: boolean
        default: true

env:
  TARGET: ${{ github.event.inputs.target }}
  TIMESTAMP: ${{ github.run_id }}-${{ github.run_number }}
  RESULTS_DIR: results/infodisc-${{ github.run_id }}-${{ github.run_number }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: infodisc-${{ github.event.inputs.target }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:

  # ============================================================
  # STAGE 1: Setup
  # ============================================================

  setup:
    name: "🛠️ Setup & Dependencies"
    runs-on: ubuntu-latest
    outputs:
      results_dir: ${{ steps.set_output.outputs.results_dir }}
      target: ${{ steps.set_output.outputs.target }}
      anthropic_key_set: ${{ steps.check_secrets.outputs.anthropic_key_set }}
      openrouter_key_set: ${{ steps.check_secrets.outputs.openrouter_key_set }}
      groq_key_set: ${{ steps.check_secrets.outputs.groq_key_set }}
      gemini_key_set: ${{ steps.check_secrets.outputs.gemini_key_set }}
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🔒 Verify Target Is In Authorized Scope"
        run: |
          TARGET="${{ github.event.inputs.target }}"
          SCOPE_FILE="scope.txt"

          if [ ! -f "$SCOPE_FILE" ]; then
            echo "⚠️  No scope.txt found at repo root - skipping scope check."
            echo "⚠️  Create a scope.txt (one allowed domain or *.domain.com per line)"
            echo "⚠️  to restrict which targets this workflow is allowed to run against."
            exit 0
          fi

          MATCH=0
          while IFS= read -r line; do
            line=$(echo "$line" | tr -d '\r' | sed 's/#.*//' | xargs)
            [ -z "$line" ] && continue
            if [ "$line" = "$TARGET" ]; then
              MATCH=1
              break
            fi
            case "$line" in
              \*.*)
                BASE="${line#\*.}"
                if [ "$TARGET" = "$BASE" ] || [[ "$TARGET" == *".$BASE" ]]; then
                  MATCH=1
                  break
                fi
                ;;
            esac
          done < "$SCOPE_FILE"

          if [ "$MATCH" != "1" ]; then
            echo "❌ '$TARGET' is NOT listed in scope.txt. Refusing to run."
            exit 1
          fi
          echo "✅ '$TARGET' is authorized per scope.txt"

      - name: "🔑 Check Available Secrets"
        id: check_secrets
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "anthropic_key_set=true" >> "$GITHUB_OUTPUT"
          else
            echo "anthropic_key_set=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "openrouter_key_set=true" >> "$GITHUB_OUTPUT"
          else
            echo "openrouter_key_set=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "groq_key_set=true" >> "$GITHUB_OUTPUT"
          else
            echo "groq_key_set=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "gemini_key_set=true" >> "$GITHUB_OUTPUT"
          else
            echo "gemini_key_set=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "📂 Create Results Directory Structure"
        run: |
          mkdir -p "${{ env.RESULTS_DIR }}"/{subdomains,live,urls,js,exposures,cloud,ai,logs}

      - name: "⚡ Setup Go Environment"
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: "🐍 Setup Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📦 Install System Dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl wget unzip jq build-essential 2>&1 | tail -5
          echo "✅ System dependencies installed"

      - name: "📦 Build Go Tools Once (pinned versions)"
        run: |
          mkdir -p /tmp/toolbin
          export GOBIN=/tmp/toolbin
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@v2.6.6 2>&1 || true
          go install github.com/projectdiscovery/httpx/cmd/httpx@v1.6.8 2>&1 || true
          go install github.com/projectdiscovery/katana/cmd/katana@v1.1.0 2>&1 || true
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.3.2 2>&1 || true
          go install github.com/tomnomnom/assetfinder@latest 2>&1 || true
          go install github.com/tomnomnom/waybackurls@latest 2>&1 || true
          go install github.com/lc/gau/v2/cmd/gau@latest 2>&1 || true
          ls -la /tmp/toolbin
          echo "✅ Tools built once at /tmp/toolbin"

      - name: "📦 Update Nuclei Templates Once"
        run: |
          export PATH=/tmp/toolbin:$PATH
          nuclei -update-templates 2>&1 | tail -3 || true
          cp -r ~/.local/nuclei-templates /tmp/toolbin/nuclei-templates 2>/dev/null || \
          cp -r ~/nuclei-templates /tmp/toolbin/nuclei-templates 2>/dev/null || true
          echo "✅ Nuclei templates updated"

      - name: "📦 Package Toolchain Artifact"
        run: |
          tar -czf /tmp/toolchain.tar.gz -C /tmp toolbin
          ls -lh /tmp/toolchain.tar.gz

      - name: "📤 Upload Toolchain Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ env.TIMESTAMP }}
          path: /tmp/toolchain.tar.gz
          retention-days: 1

      - name: "🔧 Set Output Variables"
        id: set_output
        run: |
          echo "results_dir=${{ env.RESULTS_DIR }}" >> "$GITHUB_OUTPUT"
          echo "target=${{ env.TARGET }}" >> "$GITHUB_OUTPUT"

  # ============================================================
  # STAGE 2: Subdomain Enumeration (wider surface = more to check)
  # ============================================================

  subdomain_enum:
    name: "🌐 Subdomain Enumeration"
    needs: [setup]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.subdomain_enum == 'true' }}
    steps:
      - name: "📂 Create Result Directories"
        run: mkdir -p "${{ needs.setup.outputs.results_dir }}"/{subdomains,logs}

      - name: "📥 Download Toolchain"
        uses: actions/download-artifact@v4
        with:
          name: toolchain-${{ env.TIMESTAMP }}
          path: /tmp/

      - name: "📦 Unpack Toolchain"
        run: |
          tar -xzf /tmp/toolchain.tar.gz -C /tmp
          echo "/tmp/toolbin" >> "$GITHUB_PATH"

      - name: "🔍 Passive Subdomain Enumeration"
        continue-on-error: true
        run: |
          subfinder -d "${{ needs.setup.outputs.target }}" -silent -all \
            -o "${{ needs.setup.outputs.results_dir }}/subdomains/subfinder.txt" \
            2>>"${{ needs.setup.outputs.results_dir }}/logs/subfinder.log" || true
          assetfinder --subs-only "${{ needs.setup.outputs.target }}" \
            > "${{ needs.setup.outputs.results_dir }}/subdomains/assetfinder.txt" \
            2>>"${{ needs.setup.outputs.results_dir }}/logs/assetfinder.log" || true
          echo "✅ Passive enumeration completed"

      - name: "🔍 Certificate Transparency (crt.sh)"
        continue-on-error: true
        run: |
          TARGET="${{ needs.setup.outputs.target }}"
          curl -s --max-time 30 "https://crt.sh/?q=%25.${TARGET}&output=json" \
            -o /tmp/crtsh.json 2>>"${{ needs.setup.outputs.results_dir }}/logs/crtsh.log" || true
          if [ -s /tmp/crtsh.json ]; then
            jq -r '.[].name_value' /tmp/crtsh.json 2>/dev/null \
              | tr ',' '\n' \
              | sed 's/^\*\.//' \
              | grep -iE "(^|\.)$(echo "$TARGET" | sed 's/\./\\./g')\$" \
              | sort -u \
              > "${{ needs.setup.outputs.results_dir }}/subdomains/crtsh.txt" 2>/dev/null || true
          fi
          echo "✅ crt.sh names: $(wc -l < "${{ needs.setup.outputs.results_dir }}/subdomains/crtsh.txt" 2>/dev/null || echo 0)"

      - name: "🔄 Merge & Deduplicate"
        continue-on-error: true
        run: |
          cat "${{ needs.setup.outputs.results_dir }}"/subdomains/*.txt 2>/dev/null \
            | sort -u | (grep -v '^\s*$' || true) \
            > "${{ needs.setup.outputs.results_dir }}/subdomains/all_subdomains.txt"
          echo "✅ Total unique subdomains: $(wc -l < "${{ needs.setup.outputs.results_dir }}/subdomains/all_subdomains.txt" 2>/dev/null || echo 0)"

      - name: "📤 Upload Subdomain Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subdomains-${{ env.TIMESTAMP }}
          path: ${{ needs.setup.outputs.results_dir }}/subdomains/
          retention-days: 14

  # ============================================================
  # STAGE 3: Live Host Probing
  # ============================================================

  httpx_probe:
    name: "🌍 Live Host Probing"
    needs: [setup, subdomain_enum]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: "📂 Create Result Directories"
        run: mkdir -p "${{ needs.setup.outputs.results_dir }}"/{live,logs}

      - name: "📥 Download Toolchain"
        uses: actions/download-artifact@v4
        with:
          name: toolchain-${{ env.TIMESTAMP }}
          path: /tmp/

      - name: "📦 Unpack Toolchain"
        run: |
          tar -xzf /tmp/toolchain.tar.gz -C /tmp
          echo "/tmp/toolbin" >> "$GITHUB_PATH"

      - name: "📥 Download Subdomain Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: subdomains-${{ env.TIMESTAMP }}
          path: ${{ needs.setup.outputs.results_dir }}/subdomains/
        continue-on-error: true

      - name: "🌐 HTTPX - Live Host Probing"
        continue-on-error: true
        timeout-minutes: 30
        run: |
          INPUT_FILE="${{ needs.setup.outputs.results_dir }}/subdomains/all_subdomains.txt"
          if [ ! -f "$INPUT_FILE" ] || [ ! -s "$INPUT_FILE" ]; then
            echo "${{ needs.setup.outputs.target }}" > /tmp/single_target.txt
            INPUT_FILE=/tmp/single_target.txt
          fi
          httpx -l "$INPUT_FILE" \
            -silent -status-code -content-length -content-type -title \
            -web-server -ip -cname -location -cdn \
            -follow-redirects -max-redirects 5 \
            -threads 100 -rate-limit 150 -timeout 10 -retries 3 \
            -json \
            -o "${{ needs.setup.outputs.results_dir }}/live/live_hosts.json" \
            2>>"${{ needs.setup.outputs.results_dir }}/logs/httpx.log"

          # httpx's -j/-json flag only toggles JSON mode for whatever -o
          # writes - it is not a second "write JSON here too" option. Derive
          # the plain host list every other step expects (one URL per line)
          # from the JSON with jq.
          if [ -s "${{ needs.setup.outputs.results_dir }}/live/live_hosts.json" ]; then
            jq -r '.url // .input' "${{ needs.setup.outputs.results_dir }}/live/live_hosts.json" 2>/dev/null \
              | (grep -v '^\s*$' || true) \
              > "${{ needs.setup.outputs.results_dir }}/live/live_hosts.txt" || true
          else
            : > "${{ needs.setup.outputs.results_dir }}/live/live_hosts.txt"
          fi
          echo "✅ Live hosts: $(wc -l < "${{ needs.setup.outputs.results_dir }}/live/live_hosts.txt" 2>/dev/null || echo 0)"

          # -server header is captured above; also pull a quick summary of
          # verbose Server/X-Powered-By banners, since an exact version
          # string (e.g. "Apache/2.4.29 (Ubuntu)") is itself an information
          # disclosure finding that helps an attacker target known CVEs.
          if [ -s "${{ needs.setup.outputs.results_dir }}/live/live_hosts.json" ]; then
            jq -r 'select(.webserver != null and (.webserver | test("[0-9]"))) | "\(.url) -> \(.webserver)"' \
              "${{ needs.setup.outputs.results_dir }}/live/live_hosts.json" \
              > "${{ needs.setup.outputs.results_dir }}/live/verbose_server_banners.txt" 2>/dev/null || true
            echo "✅ Verbose server banners: $(wc -l < "${{ needs.setup.outputs.results_dir }}/live/verbose_server_banners.txt" 2>/dev/null || echo 0)"
          fi

      - name: "📤 Upload Live Host Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-hosts-${{ env.TIMESTAMP }}
          path: ${{ needs.setup.outputs.results_dir }}/live/
          retention-days: 14

  # ============================================================
  # STAGE 4: URL Collection (needed to find .map, docs, backups)
  # ============================================================

  url_collection:
    name: "📜 URL Collection"
    needs: [setup, subdomain_enum, httpx_probe]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: "📂 Create Result Directories"
        run: mkdir -p "${{ needs.setup.outputs.results_dir }}"/{urls,logs}

      - name: "📥 Download Toolchain"
        uses: actions/download-artifact@v4
        with:
          name: toolchain-${{ env.TIMESTAMP }}
          path: /tmp/

      - name: "📦 Unpack Toolchain"
        run: |
          tar -xzf /tmp/toolchain.tar.gz -C /tmp
          echo "/tmp/toolbin" >> "$GITHUB_PATH"

      - name: "📥 Download Subdomain Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: subdomains-${{ env.TIMESTAMP }}
          path: ${{ needs.setup.outputs.results_dir }}/subdomains/
        continue-on-error: true

      - name: "📥 Download Live Host Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: live-hosts-${{ env.TIMESTAMP }}
          path: ${{ needs.setup.outputs.results_dir }}/live/
        continue-on-error: true

      - name: "📜 Wayback + Gau URL Collection"
        continue-on-error: true
        timeout-minutes: 35
        run: |
          INPUT_FILE="${{ needs.setup.outputs.results_dir }}/subdomains/all_subdomains.txt"
          if [ ! -f "$INPUT_FILE" ] || [ ! -s "$INPUT_FILE" ]; then
            echo "${{ needs.setup.outputs.target }}" > /tmp/single_target.txt
            INPUT_FILE=/tmp/single_target.txt
          fi
          # waybackurls makes one request per host to the archive.org CDX API,
          # which can take several seconds each - capping the list keeps this
          # step bounded on large targets instead of running past its timeout.
          head -200 "$INPUT_FILE" | waybackurls \
            > "${{ needs.setup.outputs.results_dir }}/urls/wayback_urls.txt" \
            2>>"${{ needs.setup.outputs.results_dir }}/logs/wayback.log" || true
          gau "${{ needs.setup.outputs.target }}" --subs \
            --o "${{ needs.setup.outputs.results_dir }}/urls/gau_urls.txt" \
            2>>"${{ needs.setup.outputs.results_dir }}/logs/gau.log" || true
          echo "✅ Wayback+Gau URLs collected"

      - name: "📜 Katana Crawling"
        continue-on-error: true
        timeout-minutes: 30
        run: |
          INPUT_FILE="${{ needs.setup.outputs.results_dir }}/live/live_hosts.txt"
          if [ ! -f "$INPUT_FILE" ] || [ ! -s "$INPUT_FILE" ]; then
            echo "https://${{ needs.setup.outputs.target }}" > /tmp/live_fallback.txt
            INPUT_FILE=/tmp/live_fallback.txt
          fi
          katana -list "$INPUT_FILE" -silent -depth 3 -jc -kf -d 5 \
            -o "${{ needs.setup.outputs.results_dir }}/urls/katana_urls.txt" \
            2>>"${{ needs.setup.outputs.results_dir }}/logs/katana.log" || true
          echo "✅ Katana URLs: $(wc -l < "${{ needs.setup.outputs.results_dir }}/urls/katana_urls.txt" 2>/dev/null || echo 0)"

      - name: "🔄 Merge & Deduplicate All URLs"
        continue-on-error: true
        run: |
          cat "${{ needs.setup.outputs.results_dir }}"/urls/*.txt 2>/dev/null \
            | sort -u | (grep -v '^\s*$' || true) \
            > "${{ needs.setup.outputs.results_dir }}/urls/all_urls.txt"
          echo "✅ Total unique URLs: $(wc -l < "${{ needs.setup.outputs.results_dir }}/urls/all_urls.txt" 2>/dev/null || echo 0)"

      - name: "📤 Upload URL Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urls-${{ env.TIMESTAMP }}
          path: ${{ needs.setup.outputs.results_dir }}/urls/
          retention-days: 14

  # ============================================================
  # STAGE 5: Information Disclosure Scan (the core job)
  # ============================================================

  exposure_scan:
    name: "🔓 Information Disclosure Scan"
    needs: [setup, httpx_probe, url_collection]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    timeout-minutes: 90
    steps:
      - name: "📂 Create Result Directories"
        run: mkdir -p "${{ needs.setup.outputs.results_dir }}"/{exposures,cloud,logs}

      - name: "📥 Download Toolchain"
        uses: actions/download-artifact@v4
        with:
          name: toolchain-${{ env.TIMESTAMP }}
          path: /tmp/

      - name: "📦 Unpack Toolchain"
        run: |
          tar -xzf /tmp/toolchain.tar.gz -C /tmp
          echo "/tmp/toolbin" >> "$GITHUB_PATH"
          mkdir -p ~/.local/nuclei-templates
          cp -r /tmp/toolbin/nuclei-templates/* ~/.local/nuclei-templates/ 2>/dev/null || true

      - name: "📥 Download Live Host Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: live-hosts-${{ env.TIMESTAMP }}
          path: ${{ needs.setup.outputs.results_dir }}/live/
        continue-on-error: true

      - name: "📥 Download URL Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: urls-${{ env.TIMESTAMP }}
          path: ${{ needs.setup.outputs.results_dir }}/urls/
        continue-on-error: true

      - name: "☢️ Nuclei Exposure Templates (config/backup/token/exposure tags)"
        if: ${{ github.event.inputs.nuclei_exposures == 'true' }}
        continue-on-error: true
        timeout-minutes: 45
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " ☢️  NUCLEI - Information Disclosure Templates"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          # Restricted to nuclei's own information-disclosure template
          # categories - it never runs injection, RCE, or auth-bypass tags.
          INPUT_FILE="${{ needs.setup.outputs.results_dir }}/live/live_hosts.txt"
          if [ ! -f "$INPUT_FILE" ] || [ ! -s "$INPUT_FILE" ]; then
            echo "https://${{ needs.setup.outputs.target }}" > /tmp/nuclei_fallback.txt
            INPUT_FILE=/tmp/nuclei_fallback.txt
          fi
          nuclei -l "$INPUT_FILE" \
            -tags exposure,config,backup,token,exposures,logs,files \
            -rate-limit 100 -bulk-size 25 -concurrency 25 \
            -timeout 10 -retries 1 -silent -jsonl \
            -o "${{ needs.setup.outputs.results_dir }}/exposures/nuclei_exposures.json" \
            2>>"${{ needs.setup.outputs.results_dir }}/logs/nuclei.log" || true
          COUNT=$(wc -l < "${{ needs.setup.outputs.results_dir }}/exposures/nuclei_exposures.json" 2>/dev/null || echo 0)
          echo "✅ Nuclei exposure findings: $COUNT"
          if [ -s "${{ needs.setup.outputs.results_dir }}/exposures/nuclei_exposures.json" ]; then
            jq -r '"[\(.info.severity // "unknown")] \(.info.name // "?") -> \(.["matched-at"] // .host // "?")"' \
              "${{ needs.setup.outputs.results_dir }}/exposures/nuclei_exposures.json" \
              > "${{ needs.setup.outputs.results_dir }}/exposures/nuclei_exposures.txt" 2>/dev/null || true
          fi

      - name: "🛡️ Sensitive Files Discovery"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " 🛡️  SENSITIVE FILES DISCOVERY (httpx -paths)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat > /tmp/sensitive_paths.txt <<'EOF'
          /.env
          /.env.local
          /.env.production
          /.git/config
          /.git/HEAD
          /.htaccess
          /.htpasswd
          /config.php
          /config.json
          /config.yaml
          /config.yml
          /database.yml
          /database.json
          /db.php
          /wp-config.php
          /wp-config.bak
          /.aws/credentials
          /.aws/config
          /.npmrc
          /composer.json
          /composer.lock
          /package.json
          /package-lock.json
          /yarn.lock
          /Dockerfile
          /docker-compose.yml
          /docker-compose.yaml
          /nginx.conf
          /server-status
          /server-info
          /phpinfo.php
          /info.php
          /client_secret.json
          /credentials.json
          /.gitlab-ci.yml
          /terraform.tfstate
          /.well-known/security.txt
          /web.config
          /appsettings.json
          /application.properties
          /application.yml
          /.DS_Store
          /backup.sql
          /backup.zip
          /dump.sql
          /site.zip
          /www.zip
          EOF

          INPUT_FILE="${{ needs.setup.outputs.results_dir }}/live/live_hosts.txt"
          if [ ! -f "$INPUT_FILE" ] || [ ! -s "$INPUT_FILE" ]; then
            echo "https://${{ needs.setup.outputs.target }}" > /tmp/live_sens.txt
            INPUT_FILE=/tmp/live_sens.txt
          fi

          httpx -l "$INPUT_FILE" \
            -paths /tmp/sensitive_paths.txt \
            -mc 200 -threads 50 -rate-limit 150 -timeout 6 \
            -content-length -silent \
            -o /tmp/sensitive_raw.txt \
            2>>"${{ needs.setup.outputs.results_dir }}/logs/sensitive.log" || true

          cat > /tmp/verify_sensitive.py <<'PYEOF'
          import os, re, sys, urllib.request, urllib.error

          rd = os.environ.get("RD")
          raw_path = "/tmp/sensitive_raw.txt"
          confirmed_path = os.path.join(rd, "exposures", "sensitive_files.txt")
          unverified_path = os.path.join(rd, "exposures", "sensitive_files_unverified_candidates.txt")

          SIGNATURES = {
              "/.env": re.compile(r"^[A-Z0-9_]+\s*=", re.MULTILINE),
              "/.env.local": re.compile(r"^[A-Z0-9_]+\s*=", re.MULTILINE),
              "/.env.production": re.compile(r"^[A-Z0-9_]+\s*=", re.MULTILINE),
              "/.git/config": re.compile(r"\[core\]|\[remote"),
              "/.git/HEAD": re.compile(r"ref:\s*refs/"),
              "/wp-config.php": re.compile(r"DB_NAME|DB_PASSWORD|define\("),
              "/.htpasswd": re.compile(r"^[\w.\-]+:\$?\w"),
              "/.aws/credentials": re.compile(r"aws_access_key_id"),
              "/.aws/config": re.compile(r"\[profile|region\s*="),
              "/credentials.json": re.compile(r'"client_id"|"private_key"|"client_secret"'),
              "/client_secret.json": re.compile(r'"client_id"|"private_key"|"client_secret"'),
              "/docker-compose.yml": re.compile(r"^\s*services:", re.MULTILINE),
              "/docker-compose.yaml": re.compile(r"^\s*services:", re.MULTILINE),
              "/terraform.tfstate": re.compile(r'"terraform_version"'),
              "/database.yml": re.compile(r"adapter:|password:|database:"),
              "/database.json": re.compile(r'"password"|"database"|"host"'),
              "/composer.json": re.compile(r'"require"|"name"\s*:'),
              "/package.json": re.compile(r'"name"\s*:.*"version"\s*:', re.DOTALL),
              "/nginx.conf": re.compile(r"server\s*\{|location\s"),
              "/appsettings.json": re.compile(r'"ConnectionStrings"|"Logging"'),
              "/application.properties": re.compile(r"spring\.|server\.port|datasource"),
              "/application.yml": re.compile(r"spring:|datasource:"),
              "/web.config": re.compile(r"<configuration>|<connectionStrings>"),
          }

          def is_html_error_page(body):
              return bool(re.search(r"<!DOCTYPE|<html|<head|<body", body, re.IGNORECASE))

          def read_candidates(path):
              out = []
              try:
                  with open(path) as f:
                      for line in f:
                          line = line.strip()
                          if not line:
                              continue
                          m = re.match(r"^(\S+)", line)
                          if m:
                              out.append(m.group(1))
              except OSError:
                  pass
              return out

          candidates = read_candidates(raw_path)
          confirmed = []
          unverified = []

          for url in candidates[:300]:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=8) as r:
                      body = r.read(200_000).decode(errors="ignore")
              except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, OSError):
                  unverified.append(url + " | could not re-fetch to verify")
                  continue

              sig = None
              for known_path, pattern in SIGNATURES.items():
                  if url.endswith(known_path):
                      sig = pattern
                      break

              if sig is not None:
                  if sig.search(body):
                      confirmed.append(url + " | content signature matched")
                  else:
                      unverified.append(url + " | expected content signature NOT found (likely false positive)")
              else:
                  if not is_html_error_page(body) and len(body.strip()) > 20:
                      unverified.append(url + " | no strict signature check available - manual review required")
                  else:
                      unverified.append(url + " | looks like a generic HTML/error page (false positive)")

          with open(confirmed_path, "w") as f:
              f.write("\n".join(confirmed) + ("\n" if confirmed else ""))
          with open(unverified_path, "w") as f:
              f.write("\n".join(unverified) + ("\n" if unverified else ""))

          print("Confirmed sensitive files: " + str(len(confirmed)))
          print("Unverified/rejected candidates: " + str(len(unverified)))
          PYEOF
          RD="${{ needs.setup.outputs.results_dir }}" python3 /tmp/verify_sensitive.py

          echo "✅ Confirmed sensitive files: $(wc -l < "${{ needs.setup.outputs.results_dir }}/exposures/sensitive_files.txt" 2>/dev/null || echo 0)"

      - name: "🗺️ Source Map (.js.map) Exposure Check"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " 🗺️  SOURCE MAP EXPOSURE CHECK"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          # A public .js.map effectively unminifies and hands over the
          # original source (variable names, comments, sometimes internal
          # paths) - a classic and often-overlooked information disclosure.
          URL_FILE="${{ needs.setup.outputs.results_dir }}/urls/all_urls.txt"
          : > /tmp/map_candidates.txt
          if [ -f "$URL_FILE" ] && [ -s "$URL_FILE" ]; then
            grep -iE '\.js\.map(\?|#|$)' "$URL_FILE" | sort -u > /tmp/map_candidates.txt || true
            # also derive candidates from plain .js URLs (file.js -> file.js.map)
            grep -iE '\.js(\?|#|$)' "$URL_FILE" | sed 's/\.js\(.*\)$/.js.map/' | sort -u >> /tmp/map_candidates.txt || true
            sort -u -o /tmp/map_candidates.txt /tmp/map_candidates.txt
          fi
          if [ -s /tmp/map_candidates.txt ]; then
            httpx -l /tmp/map_candidates.txt \
              -mc 200 -threads 50 -rate-limit 150 -timeout 6 \
              -content-length -silent \
              -o "${{ needs.setup.outputs.results_dir }}/exposures/exposed_sourcemaps.txt" \
              2>>"${{ needs.setup.outputs.results_dir }}/logs/sourcemaps.log" || true
          fi
          echo "✅ Exposed source maps: $(wc -l < "${{ needs.setup.outputs.results_dir }}/exposures/exposed_sourcemaps.txt" 2>/dev/null || echo 0)"

      - name: "📖 API Docs / Swagger / OpenAPI Exposure"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " 📖 SWAGGER / OPENAPI DOCS EXPOSURE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat > /tmp/docs_paths.txt <<'EOF'
          /swagger.json
          /swagger/v1/swagger.json
          /api/swagger.json
          /swagger-ui.html
          /v2/api-docs
          /v3/api-docs
          /openapi.json
          /api/docs
          /docs
          /api/documentation
          /graphql
          /graphiql
          /.well-known/openapi.json
          EOF
          INPUT_FILE="${{ needs.setup.outputs.results_dir }}/live/live_hosts.txt"
          if [ ! -f "$INPUT_FILE" ] || [ ! -s "$INPUT_FILE" ]; then
            echo "https://${{ needs.setup.outputs.target }}" > /tmp/live_docs.txt
            INPUT_FILE=/tmp/live_docs.txt
          fi
          httpx -l "$INPUT_FILE" \
            -paths /tmp/docs_paths.txt \
            -mc 200 -threads 50 -rate-limit 150 -timeout 6 \
            -silent \
            -o "${{ needs.setup.outputs.results_dir }}/exposures/api_docs_exposed.txt" \
            2>>"${{ needs.setup.outputs.results_dir }}/logs/docs.log" || true
          echo "✅ Exposed docs endpoints: $(wc -l < "${{ needs.setup.outputs.results_dir }}/exposures/api_docs_exposed.txt" 2>/dev/null || echo 0)"

      - name: "🕵️ GraphQL Schema Introspection"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " 🕵️  GRAPHQL INTROSPECTION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          INPUT_FILE="${{ needs.setup.outputs.results_dir }}/live/live_hosts.txt"
          if [ ! -f "$INPUT_FILE" ] || [ ! -s "$INPUT_FILE" ]; then
            echo "https://${{ needs.setup.outputs.target }}" > /tmp/live_gql.txt
            INPUT_FILE=/tmp/live_gql.txt
          fi
          GRAPHQL_PATHS=("/graphql" "/api/graphql" "/v1/graphql" "/query" "/graphql/console")
          while IFS= read -r host; do
            host=$(echo "$host" | tr -d '\r' | grep -v '^\s*$' || true)
            [ -z "$host" ] && continue
            for path in "${GRAPHQL_PATHS[@]}"; do
              url="${host}${path}"
              status=$(curl -sk -o /tmp/gql_body.txt -w "%{http_code}" --max-time 5 \
                -X POST -H "Content-Type: application/json" \
                -d '{"query":"{__schema{queryType{name} types{name}}}"}' "$url" 2>/dev/null || echo "000")
              if [ "$status" = "200" ] && grep -qiE '"__schema"|"types"' /tmp/gql_body.txt 2>/dev/null; then
                echo "[SCHEMA-EXPOSED] $url" >> "${{ needs.setup.outputs.results_dir }}/exposures/graphql_introspection.txt"
                safe_name=$(echo "$url" | sed 's/[^a-zA-Z0-9]/_/g' | cut -c1-80)
                cp /tmp/gql_body.txt "${{ needs.setup.outputs.results_dir }}/exposures/graphql_schema_${safe_name}.json" 2>/dev/null || true
              fi
              sleep 0.05
            done
          done < "$INPUT_FILE"
          echo "✅ GraphQL schemas exposed: $(wc -l < "${{ needs.setup.outputs.results_dir }}/exposures/graphql_introspection.txt" 2>/dev/null || echo 0)"

      - name: "📁 Directory Listing Check"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " 📁 DIRECTORY LISTING CHECK"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          COMMON_DIRS=("/uploads/" "/files/" "/backup/" "/assets/" "/static/" "/media/" "/images/" "/docs/" "/data/" "/tmp/" "/log/" "/logs/")
          INPUT_FILE="${{ needs.setup.outputs.results_dir }}/live/live_hosts.txt"
          if [ ! -f "$INPUT_FILE" ] || [ ! -s "$INPUT_FILE" ]; then
            echo "https://${{ needs.setup.outputs.target }}" > /tmp/live_dirs.txt
            INPUT_FILE=/tmp/live_dirs.txt
          fi
          head -15 "$INPUT_FILE" | while IFS= read -r host; do
            host=$(echo "$host" | tr -d '\r' | grep -v '^\s*$' || true)
            [ -z "$host" ] && continue
            for path in "${COMMON_DIRS[@]}"; do
              url="${host}${path}"
              body=$(curl -sk --max-time 5 "$url" 2>/dev/null || echo "")
              if echo "$body" | grep -qiE '<title>Index of|Index of /[a-zA-Z0-9_/.-]*</title|Directory listing for'; then
                echo "[LISTING] $url" >> "${{ needs.setup.outputs.results_dir }}/exposures/directory_listing.txt"
              fi
              sleep 0.05
            done
          done
          echo "✅ Directory listings found: $(wc -l < "${{ needs.setup.outputs.results_dir }}/exposures/directory_listing.txt" 2>/dev/null || echo 0)"

      - name: "🐞 Debug/Verbose Endpoint Check"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " 🐞 DEBUG / VERBOSE ENDPOINT CHECK"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat > /tmp/debug_paths.txt <<'EOF'
          /debug
          /_debug
          /console
          /trace
          /actuator
          /actuator/env
          /actuator/health
          /actuator/beans
          /actuator/configprops
          /elmah.axd
          /_profiler
          /debug/default/view
          /__debug__
          EOF
          INPUT_FILE="${{ needs.setup.outputs.results_dir }}/live/live_hosts.txt"
          if [ ! -f "$INPUT_FILE" ] || [ ! -s "$INPUT_FILE" ]; then
            echo "https://${{ needs.setup.outputs.target }}" > /tmp/live_debug.txt
            INPUT_FILE=/tmp/live_debug.txt
          fi
          httpx -l "$INPUT_FILE" \
            -paths /tmp/debug_paths.txt \
            -mc 200 -threads 50 -rate-limit 150 -timeout 6 \
            -silent \
            -o "${{ needs.setup.outputs.results_dir }}/exposures/debug_endpoints.txt" \
            2>>"${{ needs.setup.outputs.results_dir }}/logs/debug.log" || true
          echo "✅ Debug endpoints exposed: $(wc -l < "${{ needs.setup.outputs.results_dir }}/exposures/debug_endpoints.txt" 2>/dev/null || echo 0)"

      - name: "☁️ Cloud Bucket Discovery + Public Listing Check"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " ☁️  CLOUD BUCKET DISCOVERY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          URL_FILE="${{ needs.setup.outputs.results_dir }}/urls/all_urls.txt"
          if [ -f "$URL_FILE" ] && [ -s "$URL_FILE" ]; then
            grep -iE '(s3\.amazonaws\.com|s3-[a-z0-9-]+\.amazonaws\.com|\.s3\.)' "$URL_FILE" \
              | sort -u > "${{ needs.setup.outputs.results_dir }}/cloud/aws_buckets.txt" 2>/dev/null || true
            grep -iE '(storage\.googleapis\.com|\.storage\.google)' "$URL_FILE" \
              | sort -u > "${{ needs.setup.outputs.results_dir }}/cloud/gcp_buckets.txt" 2>/dev/null || true
            grep -iE '(blob\.core\.windows\.net)' "$URL_FILE" \
              | sort -u > "${{ needs.setup.outputs.results_dir }}/cloud/azure_buckets.txt" 2>/dev/null || true
          fi
          : > "${{ needs.setup.outputs.results_dir }}/cloud/open_buckets.txt"
          for f in aws_buckets.txt gcp_buckets.txt azure_buckets.txt; do
            path="${{ needs.setup.outputs.results_dir }}/cloud/$f"
            [ -f "$path" ] && [ -s "$path" ] || continue
            while IFS= read -r bucket_url; do
              bucket_url=$(echo "$bucket_url" | tr -d '\r' | grep -v '^\s*$' || true)
              [ -z "$bucket_url" ] && continue
              root=$(echo "$bucket_url" | grep -oE '^[a-zA-Z]+://[^/]+' || true)
              [ -z "$root" ] && root="https://$bucket_url"
              resp=$(curl -sk --max-time 6 -w "\n%{http_code}" "$root" 2>/dev/null || echo -e "\n000")
              status=$(echo "$resp" | tail -1)
              body=$(echo "$resp" | sed '$d')
              [ "$status" != "200" ] && { sleep 0.05; continue; }
              if echo "$body" | grep -qiE 'AccessDenied|<Error>|"error"'; then
                sleep 0.05
                continue
              fi
              if echo "$body" | grep -qE '<Key>[^<]+</Key>' || echo "$body" | grep -qE '"items"\s*:\s*\['; then
                echo "[OPEN-LISTING-WITH-OBJECTS] $root" >> "${{ needs.setup.outputs.results_dir }}/cloud/open_buckets.txt"
              fi
              sleep 0.05
            done < "$path"
          done
          echo "✅ Confirmed publicly listable buckets (with real objects): $(wc -l < "${{ needs.setup.outputs.results_dir }}/cloud/open_buckets.txt" 2>/dev/null || echo 0)"

      - name: "📤 Upload Exposure Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exposures-${{ env.TIMESTAMP }}
          path: |
            ${{ needs.setup.outputs.results_dir }}/exposures/
            ${{ needs.setup.outputs.results_dir }}/cloud/
          retention-days: 14

  # ============================================================
  # STAGE 6: JS Secrets & JWT Disclosure
  # ============================================================

  js_secrets_scan:
    name: "🔑 JS Secrets & JWT Disclosure"
    needs: [setup, url_collection]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event.inputs.js_secrets_scan == 'true' }}
    timeout-minutes: 20
    steps:
      - name: "📂 Create Result Directories"
        run: mkdir -p "${{ needs.setup.outputs.results_dir }}"/{js,logs}

      - name: "📥 Download URL Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: urls-${{ env.TIMESTAMP }}
          path: ${{ needs.setup.outputs.results_dir }}/urls/
        continue-on-error: true

      - name: "📦 Extract JS File List"
        run: |
          URL_FILE="${{ needs.setup.outputs.results_dir }}/urls/all_urls.txt"
          if [ -f "$URL_FILE" ] && [ -s "$URL_FILE" ]; then
            grep -iE '\.js(\?|#|$)' "$URL_FILE" \
              > "${{ needs.setup.outputs.results_dir }}/js/js_files.txt" 2>/dev/null || true
          fi
          echo "✅ JS files found: $(wc -l < "${{ needs.setup.outputs.results_dir }}/js/js_files.txt" 2>/dev/null || echo 0)"

      - name: "🔑 Fetch JS Content and Scan for Secrets + JWTs"
        continue-on-error: true
        timeout-minutes: 15
        env:
          RD: ${{ needs.setup.outputs.results_dir }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " 🔑 JS SECRETS + JWT DISCLOSURE SCAN"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          # Fetches up to 50 already-discovered JS files (read-only GET,
          # same as loading the page in a browser) and pattern-matches for
          # leaked API keys/tokens and embedded JWTs. JWT payloads are
          # base64-decoded for inspection only - no signature verification,
          # no secret cracking, nothing is sent anywhere.
          cat > /tmp/js_secrets_scan.py <<'PYEOF'
          import base64, json, os, re, urllib.request, urllib.error

          rd = os.environ.get("RD")
          js_file = os.path.join(rd, "js", "js_files.txt")

          urls = []
          try:
              with open(js_file) as f:
                  urls = [l.strip() for l in f if l.strip()][:50]
          except OSError:
              pass

          secret_patterns = {
              "AWS Access Key": re.compile(r"AKIA[0-9A-Z]{16}"),
              "Google API Key": re.compile(r"AIza[0-9A-Za-z_-]{35}"),
              "Slack Token": re.compile(r"xox[baprs]-[0-9A-Za-z-]{10,}"),
              "Generic API Key/Secret": re.compile(
                  r"(?i)(api[_-]?key|apikey|secret|access[_-]?token|client[_-]?secret)"
                  r"[\"']?\s*[:=]\s*[\"']([A-Za-z0-9_\-\.]{16,})[\"']"
              ),
              "Private Key Block": re.compile(r"-----BEGIN (RSA |EC )?PRIVATE KEY-----"),
          }
          jwt_re = re.compile(r"eyJ[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}")

          def b64decode(seg):
              pad = "=" * (-len(seg) % 4)
              try:
                  return json.loads(base64.urlsafe_b64decode(seg + pad))
              except Exception:
                  return None

          secret_findings = []
          jwt_findings = []
          seen_jwt = set()

          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=8) as r:
                      body = r.read(2_000_000).decode(errors="ignore")
              except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, OSError):
                  continue

              for label, pattern in secret_patterns.items():
                  for m in pattern.finditer(body):
                      snippet = m.group(0)
                      if len(snippet) > 60:
                          snippet = snippet[:60] + "..."
                      secret_findings.append(url + " | " + label + " | " + snippet)

              for m in jwt_re.finditer(body):
                  token = m.group(0)
                  if token in seen_jwt:
                      continue
                  seen_jwt.add(token)
                  parts = token.split(".")
                  header = b64decode(parts[0])
                  payload = b64decode(parts[1]) if len(parts) > 1 else None
                  flags = []
                  if header and str(header.get("alg", "")).lower() == "none":
                      flags.append("alg=none accepted")
                  if payload:
                      sensitive_keys = {"password", "secret", "ssn", "credit_card", "api_key", "email"}
                      hit = sensitive_keys & set(k.lower() for k in payload.keys())
                      if hit:
                          flags.append("sensitive claim(s): " + ", ".join(sorted(hit)))
                  status = ", ".join(flags) if flags else "structure only, no obvious sensitive claim"
                  jwt_findings.append(url + " | alg=" + str(header.get("alg") if header else "?") + " | " + status)

          with open(os.path.join(rd, "js", "js_secrets.txt"), "w") as f:
              f.write("\n".join(secret_findings) + ("\n" if secret_findings else ""))
          with open(os.path.join(rd, "js", "jwt_findings.txt"), "w") as f:
              f.write("\n".join(jwt_findings) + ("\n" if jwt_findings else ""))

          print("Secrets found: " + str(len(secret_findings)))
          print("JWTs found: " + str(len(jwt_findings)))
          PYEOF
          python3 /tmp/js_secrets_scan.py
          echo "✅ JS secrets: $(wc -l < "$RD/js/js_secrets.txt" 2>/dev/null || echo 0)"
          echo "✅ JWT findings: $(wc -l < "$RD/js/jwt_findings.txt" 2>/dev/null || echo 0)"

      - name: "📤 Upload JS Secrets Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-secrets-${{ env.TIMESTAMP }}
          path: ${{ needs.setup.outputs.results_dir }}/js/
          retention-days: 14

  # ============================================================
  # STAGE 7: AI Triage (information disclosure focused)
  # ============================================================

  ai_triage:
    name: "🤖 AI Triage"
    needs: [setup, exposure_scan, js_secrets_scan]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event.inputs.ai_analysis == 'true' }}
    timeout-minutes: 20
    steps:
      - name: "📥 Download All Artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ env.TIMESTAMP }}"
          merge-multiple: true
          path: ${{ needs.setup.outputs.results_dir }}/
        continue-on-error: true

      - name: "📂 Create AI Output Directory"
        run: mkdir -p "${{ needs.setup.outputs.results_dir }}/ai"

      - name: "🤖 Claude AI Triage"
        id: claude_triage
        if: ${{ needs.setup.outputs.anthropic_key_set == 'true' && (github.event.inputs.ai_provider == 'anthropic' || github.event.inputs.ai_provider == 'both') }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET: ${{ needs.setup.outputs.target }}
          RD: ${{ needs.setup.outputs.results_dir }}
        run: |
          # NOTE: the Python source below sits between a QUOTED heredoc
          # delimiter ('PYEOF'). Quoting the delimiter tells bash NOT to
          # expand anything inside it (no $VAR, no template expressions), so
          # nothing here can be misread by bash or the YAML parser. All
          # dynamic values come in purely through the env: block above and
          # are read in Python via os.environ - never interpolated into the
          # source text itself.
          cat > /tmp/ai_triage.py <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error

          def read_capped(*paths, cap=6000, default="No data found"):
              chunks = []
              for p in paths:
                  try:
                      with open(p, "r", errors="ignore") as f:
                          chunks.append(f.read())
                  except OSError:
                      continue
              text = "\n".join(chunks).strip()
              return text[:cap] if text else default

          api_key = os.environ.get("ANTHROPIC_API_KEY")
          target = os.environ.get("TARGET", "unknown-target")
          rd = os.environ.get("RD")

          if not api_key or not rd:
              print("Missing ANTHROPIC_API_KEY or RD, skipping", file=sys.stderr)
              sys.exit(0)

          nuclei_exp = read_capped(os.path.join(rd, "exposures", "nuclei_exposures.txt"), cap=4000)
          sensitive = read_capped(os.path.join(rd, "exposures", "sensitive_files.txt"), cap=3000)
          sourcemaps = read_capped(os.path.join(rd, "exposures", "exposed_sourcemaps.txt"), cap=2000)
          api_docs = read_capped(os.path.join(rd, "exposures", "api_docs_exposed.txt"), cap=2000)
          graphql = read_capped(os.path.join(rd, "exposures", "graphql_introspection.txt"), cap=1500)
          dir_listing = read_capped(os.path.join(rd, "exposures", "directory_listing.txt"), cap=1500)
          debug_eps = read_capped(os.path.join(rd, "exposures", "debug_endpoints.txt"), cap=1500)
          open_buckets = read_capped(os.path.join(rd, "cloud", "open_buckets.txt"), cap=1500)
          js_secrets = read_capped(os.path.join(rd, "js", "js_secrets.txt"), cap=3000)
          jwt_findings = read_capped(os.path.join(rd, "js", "jwt_findings.txt"), cap=2000)
          banners = read_capped(os.path.join(rd, "live", "verbose_server_banners.txt"), cap=1500)

          prompt = (
              "You are a senior bug bounty hunter specializing exclusively in "
              "INFORMATION DISCLOSURE vulnerabilities, analyzing scan results for: "
              + target + "\n\n"
              "Scope note: every item below came from passive/read-only checks "
              "(no injection, no auth bypass, no brute force). Your job is purely "
              "triage and severity classification of what was already found.\n\n"
              "=== NUCLEI EXPOSURE TEMPLATES ===\n" + nuclei_exp + "\n\n"
              "=== SENSITIVE FILES ===\n" + sensitive + "\n\n"
              "=== EXPOSED SOURCE MAPS ===\n" + sourcemaps + "\n\n"
              "=== EXPOSED API DOCS/SWAGGER/GRAPHQL PLAYGROUND ===\n" + api_docs + "\n\n"
              "=== GRAPHQL SCHEMA INTROSPECTION ===\n" + graphql + "\n\n"
              "=== DIRECTORY LISTINGS ===\n" + dir_listing + "\n\n"
              "=== DEBUG/VERBOSE ENDPOINTS ===\n" + debug_eps + "\n\n"
              "=== PUBLICLY LISTABLE CLOUD BUCKETS ===\n" + open_buckets + "\n\n"
              "=== JS SECRETS/API KEYS ===\n" + js_secrets + "\n\n"
              "=== JWT DISCLOSURE FINDINGS ===\n" + jwt_findings + "\n\n"
              "=== VERBOSE SERVER/TECH BANNERS ===\n" + banners + "\n\n"
              "TASK - be strict, this report goes straight to a human who is "
              "tired of chasing false positives:\n"
              "1. For each item above, first decide: is this a REAL, confirmed "
              "exposure, or could it plausibly be a default page, an "
              "already-mitigated issue, or a loose pattern match? If there is "
              "ANY real doubt, DO NOT include it at all - do not hedge it in "
              "with 'possible' or a question mark. Silence beats a wrong finding.\n"
              "2. For everything that survives step 1, classify by DATA "
              "SENSITIVITY, not generic severity: (a) credentials/keys/private "
              "keys - CRITICAL, (b) PII or business data (source code, internal "
              "docs, DB dumps) - HIGH, (c) infra/tech fingerprint (versions, "
              "stack traces, verbose banners) - MEDIUM, (d) purely cosmetic/no "
              "real leak - LOW/INFO.\n"
              "3. For each CRITICAL/HIGH item that survives step 1: exact curl "
              "command to re-verify, and a one-line description of the worst "
              "realistic impact.\n"
              "4. TOP 3 to report first.\n"
              "5. If NOTHING survives step 1, say so plainly: 'No confirmed "
              "findings this run.' Do not manufacture something to fill space.\n"
              "Format as structured markdown. Be specific, concise, no hedging."
          )

          payload = json.dumps({
              "model": "claude-opus-4-8",
              "max_tokens": 4096,
              "messages": [{"role": "user", "content": prompt}],
          }).encode()

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=payload,
              headers={
                  "x-api-key": api_key,
                  "anthropic-version": "2023-06-01",
                  "content-type": "application/json",
              },
              method="POST",
          )

          os.makedirs(os.path.join(rd, "ai"), exist_ok=True)

          try:
              with urllib.request.urlopen(req, timeout=90) as r:
                  result = json.loads(r.read())
              analysis = result["content"][0]["text"]
              with open(os.path.join(rd, "ai", "claude_triage.md"), "w") as f:
                  f.write("# Information Disclosure Triage Report\n")
                  f.write("Target: " + target + "\n\n")
                  f.write(analysis)
              print("Claude triage complete")
          except urllib.error.HTTPError as e:
              print("Claude API HTTP error " + str(e.code) + ": " + e.read().decode(errors="ignore")[:500], file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print("Claude API error: " + str(e), file=sys.stderr)
              sys.exit(1)
          PYEOF
          python3 /tmp/ai_triage.py

      - name: "🤖 OpenRouter AI Triage (Fallback)"
        id: openrouter_triage
        if: ${{ always() && needs.setup.outputs.openrouter_key_set == 'true' && (github.event.inputs.ai_provider == 'openrouter' || (github.event.inputs.ai_provider == 'both' && steps.claude_triage.outcome != 'success')) }}
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TARGET: ${{ needs.setup.outputs.target }}
          RD: ${{ needs.setup.outputs.results_dir }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/ai_triage_or.py <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error

          def read_capped(*paths, cap=3000, default="No data"):
              chunks = []
