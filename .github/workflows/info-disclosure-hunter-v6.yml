          retention-days: 30

  # ============================================================
  # STAGE 8: AI Report (submission-ready)
  # ============================================================

  ai_report:
    name: "📋 AI Security Report"
    needs: [setup, ai_triage]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event.inputs.ai_analysis == 'true' }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "📥 Download AI Triage"
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ env.TIMESTAMP }}"
          merge-multiple: true
          path: ${{ needs.setup.outputs.results_dir }}/
        continue-on-error: true

      - name: "📋 Generate Full Report"
        id: claude_report
        if: ${{ needs.setup.outputs.anthropic_key_set == 'true' }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET: ${{ needs.setup.outputs.target }}
          RD: ${{ needs.setup.outputs.results_dir }}
        run: |
          cat > /tmp/ai_report.py <<'PYEOF'
          import datetime, json, os, sys, urllib.request, urllib.error

          def read_capped(*paths, cap=5000, default=""):
              chunks = []
              for p in paths:
                  try:
                      with open(p, "r", errors="ignore") as f:
                          chunks.append(f.read())
                  except OSError:
                      continue
              text = "\n".join(chunks).strip()
              return text[:cap] if text else default

          api_key = os.environ.get("ANTHROPIC_API_KEY")
          target = os.environ.get("TARGET", "unknown-target")
          rd = os.environ.get("RD")

          if not api_key or not rd:
              print("Missing ANTHROPIC_API_KEY or RD, skipping", file=sys.stderr)
              sys.exit(0)

          triage = read_capped(os.path.join(rd, "ai", "claude_triage.md"),
                                os.path.join(rd, "ai", "openrouter_triage.md"),
                                cap=4000, default="No triage available")
          scan_date = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")

          prompt = (
              "You are writing a professional INFORMATION DISCLOSURE bug bounty "
              "report for: " + target + "\nScan date: " + scan_date + "\n\n"
              "Based on this triage:\n" + triage + "\n\n"
              "Write a complete report with:\n"
              "# Executive Summary\n"
              "# Scope & Methodology (note: passive/read-only checks only)\n"
              "# Findings\n"
              "Only include a finding here if it is CONFIRMED with real evidence "
              "(verified content signature, re-verified DNS, an actual listed "
              "object, matched Nuclei template, etc.) - never because it merely "
              "looks suspicious. If you are not genuinely confident, leave it out "
              "entirely rather than hedging with 'possible' or 'requires "
              "verification'. For EACH confirmed finding, use this exact "
              "submission-ready block (HackerOne/Bugcrowd style):\n"
              "## [Severity] Title\n"
              "**Weakness/Type:** Information Disclosure - <subtype>\n"
              "**Affected Asset (URL):**\n"
              "**Severity:**\n"
              "**Summary:**\n"
              "**Steps to Reproduce:**\n"
              "**Proof of Concept:** (curl command / raw response snippet)\n"
              "**Data Exposed:** (be specific about what data class is exposed)\n"
              "**Impact:**\n"
              "**Suggested Remediation:**\n"
              "---\n"
              "# Recommendations (top 5 immediate actions)\n\n"
              "If zero findings survive this filter, write 'No confirmed findings "
              "this run.' under # Findings and stop there. Do not fabricate "
              "response bodies you were not given."
          )

          payload = json.dumps({
              "model": "claude-opus-4-8",
              "max_tokens": 8192,
              "messages": [{"role": "user", "content": prompt}],
          }).encode()

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=payload,
              headers={
                  "x-api-key": api_key,
                  "anthropic-version": "2023-06-01",
                  "content-type": "application/json",
              },
              method="POST",
          )

          os.makedirs(os.path.join(rd, "ai"), exist_ok=True)

          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  result = json.loads(r.read())
              report = result["content"][0]["text"]
              with open(os.path.join(rd, "ai", "security_report.md"), "w") as f:
                  f.write(report)
              print("Report generated, length: " + str(len(report)))
          except urllib.error.HTTPError as e:
              print("Report HTTP error " + str(e.code) + ": " + e.read().decode(errors="ignore")[:500], file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print("Report generation failed: " + str(e), file=sys.stderr)
              sys.exit(1)
          PYEOF
          python3 /tmp/ai_report.py

      - name: "📋 Generate Full Report (OpenRouter Fallback)"
        id: openrouter_report
        if: ${{ always() && needs.setup.outputs.openrouter_key_set == 'true' && steps.claude_report.outcome != 'success' }}
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TARGET: ${{ needs.setup.outputs.target }}
          RD: ${{ needs.setup.outputs.results_dir }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/ai_report_or.py <<'PYEOF'
          import datetime, json, os, sys, urllib.request, urllib.error

          def read_capped(*paths, cap=4000, default=""):
              chunks = []
              for p in paths:
                  try:
                      with open(p, "r", errors="ignore") as f:
                          chunks.append(f.read())
                  except OSError:
                      continue
              text = "\n".join(chunks).strip()
              return text[:cap] if text else default

          api_key = os.environ.get("OPENROUTER_API_KEY")
          target = os.environ.get("TARGET", "unknown-target")
          rd = os.environ.get("RD")
          repo = os.environ.get("REPO", "")

          if not api_key or not rd:
              print("Missing OPENROUTER_API_KEY or RD, skipping", file=sys.stderr)
              sys.exit(0)

          triage = read_capped(os.path.join(rd, "ai", "claude_triage.md"),
                                os.path.join(rd, "ai", "openrouter_triage.md"),
                                default="No triage available")
          scan_date = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")

          prompt = (
              "You are writing a professional INFORMATION DISCLOSURE bug bounty "
              "report for: " + target + "\nScan date: " + scan_date + "\n\n"
              "Based on this triage:\n" + triage + "\n\n"
              "Write a complete report with: Executive Summary, Scope & Methodology "
              "(note: passive/read-only checks only), Findings (only include a finding "
              "if genuinely confirmed by real evidence - if there is any doubt, leave it "
              "out entirely rather than hedging; for each confirmed finding use: "
              "Weakness/Type - Information Disclosure subtype, Affected Asset, Severity, "
              "Summary, Steps to Reproduce, Proof of Concept, Data Exposed, Impact, "
              "Suggested Remediation), and top-5 recommendations. If nothing is "
              "confirmed, write 'No confirmed findings this run.'"
          )

          payload = json.dumps({
              "model": "anthropic/claude-opus-4-5",
              "max_tokens": 8192,
              "messages": [{"role": "user", "content": prompt}],
          }).encode()

          req = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=payload,
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Content-Type": "application/json",
                  "HTTP-Referer": "https://github.com/" + repo,
                  "X-Title": "InfoDiscHunter",
              },
              method="POST",
          )

          os.makedirs(os.path.join(rd, "ai"), exist_ok=True)

          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  result = json.loads(r.read())
              report = result["choices"][0]["message"]["content"]
              with open(os.path.join(rd, "ai", "security_report.md"), "w") as f:
                  f.write(report)
              print("OpenRouter report generated, length: " + str(len(report)))
          except urllib.error.HTTPError as e:
              print("OpenRouter report HTTP error " + str(e.code) + ": " + e.read().decode(errors="ignore")[:500], file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print("OpenRouter report generation failed: " + str(e), file=sys.stderr)
              sys.exit(1)
          PYEOF
          python3 /tmp/ai_report_or.py

      - name: "📋 Generate Full Report (Groq Fallback)"
        id: groq_report
        if: ${{ always() && needs.setup.outputs.groq_key_set == 'true' && steps.claude_report.outcome != 'success' && steps.openrouter_report.outcome != 'success' }}
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TARGET: ${{ needs.setup.outputs.target }}
          RD: ${{ needs.setup.outputs.results_dir }}
        run: |
          cat > /tmp/ai_report_groq.py <<'PYEOF'
          import datetime, json, os, sys, urllib.request, urllib.error

          def read_capped(*paths, cap=4000, default=""):
              chunks = []
              for p in paths:
                  try:
                      with open(p, "r", errors="ignore") as f:
                          chunks.append(f.read())
                  except OSError:
                      continue
              text = "\n".join(chunks).strip()
              return text[:cap] if text else default

          api_key = os.environ.get("GROQ_API_KEY")
          target = os.environ.get("TARGET", "unknown-target")
          rd = os.environ.get("RD")

          if not api_key or not rd:
              print("Missing GROQ_API_KEY or RD, skipping", file=sys.stderr)
              sys.exit(0)

          triage = read_capped(os.path.join(rd, "ai", "claude_triage.md"),
                                os.path.join(rd, "ai", "openrouter_triage.md"),
                                default="No triage available")
          scan_date = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")

          prompt = (
              "You are writing a professional INFORMATION DISCLOSURE bug bounty "
              "report for: " + target + "\nScan date: " + scan_date + "\n\n"
              "Based on this triage:\n" + triage + "\n\n"
              "Write a complete report with: Executive Summary, Scope & Methodology "
              "(note: passive/read-only checks only), Findings (only include a finding "
              "if genuinely confirmed by real evidence - if there is any doubt, leave it "
              "out entirely rather than hedging; for each confirmed finding use: "
              "Weakness/Type - Information Disclosure subtype, Affected Asset, Severity, "
              "Summary, Steps to Reproduce, Proof of Concept, Data Exposed, Impact, "
              "Suggested Remediation), and top-5 recommendations. If nothing is "
              "confirmed, write 'No confirmed findings this run.'"
          )

          payload = json.dumps({
              "model": "llama-3.3-70b-versatile",
              "max_tokens": 8192,
              "messages": [{"role": "user", "content": prompt}],
          }).encode()

          req = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=payload,
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          os.makedirs(os.path.join(rd, "ai"), exist_ok=True)

          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  result = json.loads(r.read())
              report = result["choices"][0]["message"]["content"]
              with open(os.path.join(rd, "ai", "security_report.md"), "w") as f:
                  f.write(report)
              print("Groq report generated, length: " + str(len(report)))
          except urllib.error.HTTPError as e:
              print("Groq report HTTP error " + str(e.code) + ": " + e.read().decode(errors="ignore")[:500], file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print("Groq report generation failed: " + str(e), file=sys.stderr)
              sys.exit(1)
          PYEOF
          python3 /tmp/ai_report_groq.py

      - name: "📋 Generate Full Report (Gemini Final Fallback)"
        if: ${{ always() && needs.setup.outputs.gemini_key_set == 'true' && steps.claude_report.outcome != 'success' && steps.openrouter_report.outcome != 'success' && steps.groq_report.outcome != 'success' }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET: ${{ needs.setup.outputs.target }}
          RD: ${{ needs.setup.outputs.results_dir }}
        run: |
          cat > /tmp/ai_report_gemini.py <<'PYEOF'
          import datetime, json, os, sys, urllib.request, urllib.error

          def read_capped(*paths, cap=4000, default=""):
              chunks = []
              for p in paths:
                  try:
                      with open(p, "r", errors="ignore") as f:
                          chunks.append(f.read())
                  except OSError:
                      continue
              text = "\n".join(chunks).strip()
              return text[:cap] if text else default

          api_key = os.environ.get("GEMINI_API_KEY")
          target = os.environ.get("TARGET", "unknown-target")
          rd = os.environ.get("RD")

          if not api_key or not rd:
              print("Missing GEMINI_API_KEY or RD, skipping", file=sys.stderr)
              sys.exit(0)

          triage = read_capped(os.path.join(rd, "ai", "claude_triage.md"),
                                os.path.join(rd, "ai", "openrouter_triage.md"),
                                default="No triage available")
          scan_date = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")

          prompt = (
              "You are writing a professional INFORMATION DISCLOSURE bug bounty "
              "report for: " + target + "\nScan date: " + scan_date + "\n\n"
              "Based on this triage:\n" + triage + "\n\n"
              "Write a complete report with: Executive Summary, Scope & Methodology "
              "(note: passive/read-only checks only), Findings (only include a finding "
              "if genuinely confirmed by real evidence - if there is any doubt, leave it "
              "out entirely rather than hedging; for each confirmed finding use: "
              "Weakness/Type - Information Disclosure subtype, Affected Asset, Severity, "
              "Summary, Steps to Reproduce, Proof of Concept, Data Exposed, Impact, "
              "Suggested Remediation), and top-5 recommendations. If nothing is "
              "confirmed, write 'No confirmed findings this run.'"
          )

          payload = json.dumps({
              "model": "gemini-2.5-flash",
              "max_tokens": 8192,
              "messages": [{"role": "user", "content": prompt}],
          }).encode()

          req = urllib.request.Request(
              "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions",
              data=payload,
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          os.makedirs(os.path.join(rd, "ai"), exist_ok=True)

          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  result = json.loads(r.read())
              report = result["choices"][0]["message"]["content"]
              with open(os.path.join(rd, "ai", "security_report.md"), "w") as f:
                  f.write(report)
