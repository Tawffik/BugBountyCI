              "NUCLEI EXPOSURES: " + nuclei_exp + "\n"
              "JS SECRETS: " + js_secrets + "\n\n"
              "Classify by data sensitivity (credentials > PII/source > infra "
              "fingerprint), filter false positives, give top 3 to report first. "
              "Format as markdown."
          )

          payload = json.dumps({
              "model": "anthropic/claude-3.5-sonnet",
              "max_tokens": 4096,
              "messages": [{"role": "user", "content": prompt}],
          }).encode()

          req = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=payload,
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Content-Type": "application/json",
                  "HTTP-Referer": "https://github.com/" + repo,
                  "X-Title": "InfoDiscHunter",
              },
              method="POST",
          )

          os.makedirs(os.path.join(rd, "ai"), exist_ok=True)

          try:
              with urllib.request.urlopen(req, timeout=90) as r:
                  result = json.loads(r.read())
              analysis = result["choices"][0]["message"]["content"]
              with open(os.path.join(rd, "ai", "openrouter_triage.md"), "w") as f:
                  f.write("# Information Disclosure Triage Report (OpenRouter)\n\n")
                  f.write(analysis)
              print("OpenRouter triage complete")
          except urllib.error.HTTPError as e:
              print("OpenRouter HTTP error " + str(e.code) + ": " + e.read().decode(errors="ignore")[:500], file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print("OpenRouter error: " + str(e), file=sys.stderr)
              sys.exit(1)
          PYEOF
          python3 /tmp/ai_triage_or.py

      - name: "🤖 Groq AI Triage (Fallback)"
        id: groq_triage
        if: ${{ always() && needs.setup.outputs.groq_key_set == 'true' && (github.event.inputs.ai_provider == 'groq' || (github.event.inputs.ai_provider == 'both' && steps.claude_triage.outcome != 'success' && steps.openrouter_triage.outcome != 'success')) }}
        continue-on-error: true
