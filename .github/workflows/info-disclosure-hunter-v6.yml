                  f.write("# Groq AI Triage Report (free-tier fallback)\n\n")
                  f.write(analysis)
              print("Groq triage complete")
          except urllib.error.HTTPError as e:
              print("Groq HTTP error " + str(e.code) + ": " + e.read().decode(errors="ignore")[:500], file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print("Groq error: " + str(e), file=sys.stderr)
              sys.exit(1)
          PYEOF
          python3 /tmp/ai_triage_groq.py

      - name: "🤖 Gemini AI Triage (Final Fallback)"
        id: gemini_triage
        if: ${{ always() && needs.setup.outputs.gemini_key_set == 'true' && (github.event.inputs.ai_provider == 'gemini' || (github.event.inputs.ai_provider == 'both' && steps.claude_triage.outcome != 'success' && steps.openrouter_triage.outcome != 'success' && steps.groq_triage.outcome != 'success')) }}
