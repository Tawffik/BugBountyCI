          except urllib.error.HTTPError as e:
              print("Gemini report HTTP error " + str(e.code) + ": " + e.read().decode(errors="ignore")[:500], file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print("Gemini report generation failed: " + str(e), file=sys.stderr)
              sys.exit(1)
          PYEOF
          python3 /tmp/ai_report_gemini.py

      - name: "💾 Commit Report to Results"
        continue-on-error: true
        run: |
          RD="${{ needs.setup.outputs.results_dir }}"
          TARGET="${{ needs.setup.outputs.target }}"
          if [ -f "$RD/ai/security_report.md" ]; then
            mkdir -p "results/infodisc/$TARGET"
            cp "$RD/ai/security_report.md" \
              "results/infodisc/$TARGET/report_$(date +%Y%m%d_%H%M).md"
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "results/infodisc/$TARGET/"
            git diff --staged --quiet || \
              git commit -m "Info Disclosure Report [$TARGET] $(date -u +'%Y-%m-%d %H:%M')"
            git push || true
            echo "✅ Report committed to repo"
          fi

      - name: "📤 Upload Report Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-report-${{ env.TIMESTAMP }}
          path: ${{ needs.setup.outputs.results_dir }}/ai/
          retention-days: 30

  # ============================================================
  # STAGE 9: Discord Notification
  # ============================================================

  discord_notify:
    name: "📣 Discord Notification"
    needs: [setup, exposure_scan, js_secrets_scan, ai_triage, ai_report]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event.inputs.discord_notify == 'true' }}
    timeout-minutes: 5
    steps:
      - name: "📥 Download All Artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ env.TIMESTAMP }}"
          merge-multiple: true
          path: ${{ needs.setup.outputs.results_dir }}/
        continue-on-error: true

      - name: "📣 Send Discord Report"
        run: |
          TARGET="${{ needs.setup.outputs.target }}"
          RD="${{ needs.setup.outputs.results_dir }}"

          SENS=$(wc -l < "$RD/exposures/sensitive_files.txt" 2>/dev/null || echo 0)
          NUCLEI_EXP=$(wc -l < "$RD/exposures/nuclei_exposures.txt" 2>/dev/null || echo 0)
          MAPS=$(wc -l < "$RD/exposures/exposed_sourcemaps.txt" 2>/dev/null || echo 0)
          DOCS=$(wc -l < "$RD/exposures/api_docs_exposed.txt" 2>/dev/null || echo 0)
          GQL=$(wc -l < "$RD/exposures/graphql_introspection.txt" 2>/dev/null || echo 0)
          LISTING=$(wc -l < "$RD/exposures/directory_listing.txt" 2>/dev/null || echo 0)
          DEBUG=$(wc -l < "$RD/exposures/debug_endpoints.txt" 2>/dev/null || echo 0)
          BUCKETS=$(wc -l < "$RD/cloud/open_buckets.txt" 2>/dev/null || echo 0)
          JS_SECRETS=$(wc -l < "$RD/js/js_secrets.txt" 2>/dev/null || echo 0)
          JWT=$(wc -l < "$RD/js/jwt_findings.txt" 2>/dev/null || echo 0)
          AI_DONE=$([ -f "$RD/ai/security_report.md" ] && echo "✅ Done" || echo "⏭️ Skipped")

          AI_SUMMARY=$(head -15 "$RD/ai/claude_triage.md" 2>/dev/null \
            | grep -v "^#" | grep -v "^$" | head -5 \
            | sed 's/^/> /' || echo "No AI summary available")
          [ -z "$AI_SUMMARY" ] && AI_SUMMARY="No AI summary available"

          COLOR=5814783
          TITLE_PREFIX="🔍 Info Disclosure Scan Complete"
          if [ "$MAPS" -gt 0 ] || [ "$DOCS" -gt 0 ] || [ "$LISTING" -gt 0 ] || [ "$DEBUG" -gt 0 ]; then
            COLOR=16744192
            TITLE_PREFIX="🔶 Info Disclosure Scan (findings to review)"
          fi
          if [ "$SENS" -gt 0 ] || [ "$JS_SECRETS" -gt 0 ] || [ "$BUCKETS" -gt 0 ]; then
            COLOR=15158332
            TITLE_PREFIX="🚨 Info Disclosure Scan (high-confidence leak)"
          fi

          jq -n \
            --arg t        "$TARGET" \
            --arg titlepx  "$TITLE_PREFIX" \
            --arg sens     "$SENS" \
            --arg nuclei   "$NUCLEI_EXP" \
            --arg maps     "$MAPS" \
            --arg docs     "$DOCS" \
            --arg gql      "$GQL" \
            --arg listing  "$LISTING" \
            --arg debug    "$DEBUG" \
            --arg buckets  "$BUCKETS" \
            --arg jssecrets "$JS_SECRETS" \
            --arg jwt      "$JWT" \
            --arg ai       "$AI_DONE" \
            --arg aisum    "$AI_SUMMARY" \
            --arg run      "${{ github.run_number }}" \
            --arg url      "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson color "$COLOR" \
          '{
            username: "🔍 InfoDiscHunter",
            embeds: [{
              title: ($titlepx + ": " + $t),
              color: $color,
              url: $url,
              fields: [
                {name:"🛡️ Sensitive Files & Secrets",
                 value:("Files: **"+$sens+"** | JS Secrets: **"+$jssecrets+"** | JWTs: **"+$jwt+"**"),
                 inline:false},
                {name:"☢️ Nuclei Exposure Templates",
                 value:("Findings: **"+$nuclei+"**"),
                 inline:false},
                {name:"📖 Docs / Schema Leaks",
                 value:("Source Maps: **"+$maps+"** | API Docs: **"+$docs+"** | GraphQL Schema: **"+$gql+"**"),
                 inline:false},
                {name:"📁 Server Misconfig",
                 value:("Dir Listing: **"+$listing+"** | Debug Endpoints: **"+$debug+"** | Open Buckets: **"+$buckets+"**"),
                 inline:false},
                {name:"🤖 AI Report",
                 value:$ai,
                 inline:true},
                {name:"🔗 Full Results",
                 value:("[View Run]("+$url+")"),
                 inline:true},
                {name:"🧠 AI Summary",
                 value:$aisum,
                 inline:false}
              ],
              footer: {text: ("Run #"+$run+" | InfoDiscHunter")}
            }]
          }' | curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
                 -H "Content-Type: application/json" \
                 -d @- || true
