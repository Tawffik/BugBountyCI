name: Apply Pipeline Fixes
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check WORKFLOW_PAT
        run: |
          if [ -z "${{ secrets.WORKFLOW_PAT }}" ]; then
            echo "::error::Missing WORKFLOW_PAT secret"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Add chaos (PDCP)
        run: |
          set -euo pipefail
          python3 scripts/add_chaos.py
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/zero-track-hunter.yml')); print('YAML OK')"
          grep -n chaos .github/workflows/zero-track-hunter.yml | head -12

      - name: Commit if changed
        run: |
          git config user.name "zero-track-bot"
          git config user.email "zero-track-bot@users.noreply.github.com"
          git add .github/workflows/zero-track-hunter.yml
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "feat(recon): chaos passive subs via existing PDCP_API_KEY"
            git push origin HEAD
          fi
