name: Dork Intelligence Hunter (Final)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Target domain (e.g. example.com)'
        required: true
      organization:
        description: 'Organization name (optional)'
        required: false
      keywords:
        description: 'Additional keywords, comma-separated'
        required: false
      output_format:
        description: 'Report formats (json,csv,md)'
        required: false
        default: 'json,md'
      enable_ai:
        description: 'Enable AI triage'
        required: false
        default: 'true'
      ai_provider:
        description: 'AI Provider (gemini / openrouter / openai)'
        required: false
        default: 'gemini'
      openrouter_model:
        description: 'OpenRouter model id (use a :free one — check openrouter.ai/models, list rotates)'
        required: false
        default: 'openrouter/free'

jobs:
  dork-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Pinned so a silent upstream release doesn't break the job.
        # openai>=1.0 client style is used everywhere below (the old
        # ChatCompletion.create interface was removed upstream).
        run: |
          pip install \
            "requests==2.32.3" \
            "pyyaml==6.0.2" \
            "rich==13.9.4" \
            "pandas==2.2.3" \
            "openai==1.54.4" \
            "google-generativeai==0.8.3"

      # Moved BEFORE the run step -- otherwise PREVIOUS_REPORT never exists
      # when the script runs and the "new findings" diff is always empty.
      - name: Download previous artifact (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dork-results
          path: previous/

      - name: Write self-contained scanner script
        run: |
          cat > dork_hunter.py << 'PYEOF'
          #!/usr/bin/env python3
          import os, json, csv, sys, logging
          from datetime import datetime, timezone
          from collections import Counter
          from typing import List, Dict, Optional
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          from rich.console import Console
          from rich.logging import RichHandler

          logging.basicConfig(level=logging.INFO, format="%(message)s",
                              handlers=[RichHandler(rich_tracebacks=True)])
          log = logging.getLogger("dork_hunter")
          console = Console()

          # ------------------------------------------------------------------
          # Comprehensive Dork Templates (Google, Brave compatible)
          # NOTE: Bing Web Search API was fully retired by Microsoft on
          # 11 Aug 2025 -- all v7 endpoints now return HTTP 410 Gone, even
          # for previously valid keys. bing_search() is kept below (disabled
          # by default) only as a stub in case you point it at a replacement
          # (e.g. SerpApi's Bing endpoint, or Azure "Grounding with Bing").
          DORKS = [
              # Sensitive Files
              "site:{domain} filetype:env",
              "site:{domain} filetype:env inurl:.env",
              "site:{domain} filetype:sql",
              "site:{domain} filetype:log inurl:log",
              "site:{domain} filetype:json",
              "site:{domain} filetype:ini inurl:wp-config.php",
              "site:{domain} filetype:json inurl:credentials",
              "site:{domain} filetype:xml",
              "site:{domain} filetype:cfg",
              "site:{domain} ext:swp",
              "site:{domain} ext:old",
              "site:{domain} \"password\"",
              "site:{domain} \"secret\"",
              "site:{domain} \"API_KEY\"",
              "site:{domain} \"token\"",
              "site:{domain} \"DB_PASSWORD\"",
              "site:{domain} \"AWS_ACCESS_KEY_ID\"",
              "site:{domain} intext:\"api_key\" filetype:env",
              "site:{domain} intext:\"password\" filetype:log",
              "site:{domain} intext:\"username\" filetype:log",
              "site:{domain} filetype:sql \"password\"",
              # Directories & Indexing
              "site:{domain} intitle:\"index of\"",
              "site:{domain} inurl:admin",
              "site:{domain} inurl:/backup",
              "site:{domain} inurl:wp-",
              "site:{domain} inurl:/phpinfo.php",
              "site:{domain} intitle:\"index of\" \".git\"",
              "site:{domain} inurl:.git",
              "site:{domain} inurl:\"/.git/config\"",
              # Cloud & Backup
              "site:{domain} \"s3.amazonaws.com\"",
              "site:{domain} \"storage.googleapis.com\"",
              "site:{domain} \"blob.core.windows.net\"",
              "site:{domain} \"cloudfront.net\"",
              "site:{domain} inurl:aws",
              "site:{domain} inurl:azure",
              "site:{domain} inurl:gcp",
              "site:{domain} filetype:bak inurl:backup",
              "site:{domain} filetype:zip inurl:backup",
              "site:{domain} filetype:tgz inurl:backup",
              "site:{domain} filetype:sql inurl:dump",
              "site:{domain} filetype:bak inurl:db",
              # Technology Discovery
              "site:{domain} intitle:\"Apache2 Ubuntu Default Page: It works\"",
              "site:{domain} intitle:\"Index of /\" \"Apache Server\"",
              "site:{domain} intitle:\"Welcome to nginx\"",
              # Emails & Contacts
              "site:{domain} intext:\"email\"",
              "site:{domain} inurl:\"contact\" intext:\"@{domain}\" -www.{domain}",
              "site:{domain} filetype:xls inurl:\"email\"",
              # Less-common / higher-signal (most basic dork scripts skip these)
              "site:{domain} ext:map inurl:.js.map",
              "site:{domain} inurl:swagger.json",
              "site:{domain} inurl:swagger-ui.html",
              "site:{domain} inurl:openapi.json",
              "site:{domain} filetype:json inurl:postman_collection",
              "site:{domain} intext:\"apiKey\" \"firebaseio.com\"",
              "site:{domain} filetype:tfstate",
              "site:{domain} inurl:\"terraform.tfstate\"",
              "site:{domain} inurl:\".gitlab-ci.yml\"",
              "site:{domain} inurl:Jenkinsfile",
              "site:{domain} intitle:\"Grafana\"",
              "site:{domain} intitle:\"Kibana\"",
              "site:{domain} inurl:\"/v2/_catalog\"",
              "site:{domain} intitle:\"Jupyter Notebook\"",
              "site:{domain} filetype:yml inurl:docker-compose",
              "site:{domain} inurl:\".well-known/security.txt\"",
          ]

          # Passive OSINT sources that most basic dork scripts skip.
          # Both are free, keyless, and widen the attack surface beyond what
          # search-engine dorking alone can see.
          def crtsh_subdomains(domain):
              """Certificate Transparency log lookup -- free, no API key."""
              url = f"https://crt.sh/?q=%25.{domain}&output=json"
              try:
                  resp = se.get(url, timeout=20)
                  resp.raise_for_status()
                  data = resp.json()
              except Exception as e:
                  log.error(f"crt.sh: {e}"); return []
              names = set()
              for entry in data:
                  for n in entry.get("name_value", "").split("\n"):
                      n = n.strip().lstrip("*.")
                      if n and domain in n:
                          names.add(n)
              return [_norm(f"https://{n}", n, "crtsh", f"cert-transparency:{domain}") for n in names]

          def wayback_paths(domain, limit=500):
              """Historical URLs indexed by the Wayback Machine -- free, no API key.
              Surfaces old/forgotten paths that may still be live or still leak data."""
              url = "https://web.archive.org/cdx/search/cdx"
              params = {
                  "url": f"{domain}/*",
                  "output": "json",
                  "collapse": "urlkey",
                  "limit": str(limit),
                  "filter": "statuscode:200",
              }
              try:
                  resp = se.get(url, params=params, timeout=25)
                  resp.raise_for_status()
                  rows = resp.json()
              except Exception as e:
                  log.error(f"Wayback: {e}"); return []
              if not rows or len(rows) < 2:
                  return []
              header, entries = rows[0], rows[1:]
              idx = header.index("original")
              return [_norm(e[idx], "", "wayback", f"wayback:{domain}") for e in entries]

          # GitHub Code Search dorks (separate because query format differs)
          GITHUB_DORKS = [
              "{domain} filename:.env",
              "{domain} filename:.npmrc",
              "{domain} filename:id_rsa",
              "{domain} filename:credentials",
              "{domain} filename:config",
              "{domain} filename:.git-credentials",
              "{domain} filename:.s3cfg",
              "{domain} org:{organization}",
          ]

          class DorkGenerator:
              def generate(self, domain, org="", keywords=""):
                  queries = []
                  for tpl in DORKS:
                      q = tpl.replace("{domain}", domain)
                      if org: q = q.replace("{organization}", org)
                      if "{keywords}" in q:
                          if keywords: q = q.replace("{keywords}", keywords)
                          else: continue
                      queries.append({"query": q, "sources": ["google", "brave"]})
                  for tpl in GITHUB_DORKS:
                      q = tpl.replace("{domain}", domain)
                      if org: q = q.replace("{organization}", org)
                      if "{keywords}" in q:
                          if keywords: q = q.replace("{keywords}", keywords)
                          else: continue
                      # skip the org dork entirely if no org was supplied
                      if "org:" in q and not org:
                          continue
                      queries.append({"query": q, "sources": ["github"]})
                  return queries

          # ---------- Search Adapters ----------
          class SearchSession:
              def __init__(self):
                  retries = Retry(total=3, backoff_factor=1,
                                  status_forcelist=[429, 500, 502, 503, 504])
                  adapter = HTTPAdapter(max_retries=retries)
                  self.session = requests.Session()
                  self.session.mount("https://", adapter)
                  self.session.mount("http://", adapter)

          se = SearchSession().session

          def google_search(query, api_key, cx):
              url = "https://www.googleapis.com/customsearch/v1"
              params = {"key": api_key, "cx": cx, "q": query, "num": 10}
              try:
                  resp = se.get(url, params=params, timeout=15)
                  resp.raise_for_status()
                  data = resp.json()
              except Exception as e:
                  log.error(f"Google: {e}"); return []
              results = []
              for item in data.get("items", []):
                  results.append(_norm(item.get("link"), item.get("title", ""), "google", query))
              return results

          def bing_search(query, api_key):
              # DEPRECATED: Microsoft retired all Bing Search API v7 endpoints
              # on 11 Aug 2025 (HTTP 410 Gone). Point this at a replacement
              # (e.g. SerpApi) if you need this source; left as a safe no-op
              # so the rest of the pipeline keeps working.
              log.warning("bing_search skipped: Bing Search API v7 was retired by "
                          "Microsoft on 2025-08-11 and no longer returns data.")
              return []

          def brave_search(query, api_key):
              url = "https://api.search.brave.com/res/v1/web/search"
              headers = {"Accept": "application/json", "X-Subscription-Token": api_key}
              params = {"q": query, "count": 10}
              try:
                  resp = se.get(url, headers=headers, params=params, timeout=15)
                  resp.raise_for_status()
                  data = resp.json()
              except Exception as e:
                  log.error(f"Brave: {e}"); return []
              results = []
              for item in data.get("web", {}).get("results", []):
                  results.append(_norm(item.get("url"), item.get("title", ""), "brave", query))
              return results

          def github_search_code(query, token):
              url = "https://api.github.com/search/code"
              headers = {"Authorization": f"token {token}",
                         "Accept": "application/vnd.github.v3+json"}
              params = {"q": query, "per_page": 30}
              try:
                  resp = se.get(url, headers=headers, params=params, timeout=20)
                  resp.raise_for_status()
                  data = resp.json()
              except Exception as e:
                  log.error(f"GitHub: {e}"); return []
              results = []
              for item in data.get("items", []):
                  results.append(_norm(item["html_url"],
                                       f"{item['repository']['full_name']}/{item['name']}",
                                       "github", query))
              return results

          def _norm(url, title, source, query):
              return {
                  "url": url,
                  "title": title,
                  "source": source,
                  "query": query,
                  "category": "",
                  "severity": "",
                  "confidence": "",
                  "ai_summary": "",
                  "timestamp": datetime.now(timezone.utc).isoformat(),
              }

          # ---------- Enhanced Classification ----------
          def _is_example_or_template(url, title):
              """Identify harmless example/template files."""
              combined = (url + " " + title).lower()
              indicators = [
                  ".example", ".template", ".sample", ".dist", ".default",
                  "example", "template", "sample", "dummy", "placeholder",
                  "_example", "_sample", ".env.example", "credentials.example",
                  "/docs/", "/examples/", "example_", "template_"
              ]
              return any(ind in combined for ind in indicators)

          def classify(result, use_ai, provider, api_key):
              result = _rule_classify(result)
              if use_ai and api_key:
                  try:
                      result = classify_with_ai(result, provider, api_key)
                  except Exception as e:
                      log.warning(f"AI classification failed ({provider}): {e}")
              return result

          def _extract_json(raw: str) -> dict:
              """Robustly pull a JSON object out of a model response that may be
              wrapped in markdown fences or have stray leading/trailing text."""
              raw = raw.strip()
              if "```" in raw:
                  parts = raw.split("```")
                  # take the fenced block, drop a leading language tag like 'json'
                  raw = parts[1] if len(parts) > 1 else raw
                  raw = raw.replace("json", "", 1).strip() if raw.lower().startswith("json") else raw
              start, end = raw.find("{"), raw.rfind("}")
              if start != -1 and end != -1:
                  raw = raw[start:end + 1]
              return json.loads(raw)

          def classify_with_ai(result, provider, api_key):
              prompt = (
                  "Classify this security finding from a dork scan. "
                  "Respond with a single JSON object only, no prose, no markdown fences: "
                  "{\"category\":\"Sensitive Files|Repository Exposure|Cloud Exposure|"
                  "Technology Discovery|Information Disclosure\", \"severity\":\"High|Medium|Low|Info\", "
                  "\"confidence\":0.X, \"explanation\":\"short reason\"}\n\n"
                  f"URL: {result['url']}\nTitle: {result.get('title','')}\n"
                  f"Source: {result.get('source','')}\nQuery: {result.get('query','')}"
              )

              if provider == "openai":
                  from openai import OpenAI
                  client = OpenAI(api_key=api_key)
                  completion = client.chat.completions.create(
                      model="gpt-4o-mini",
                      messages=[{"role": "user", "content": prompt}],
                      temperature=0.2,
                      max_tokens=150,
                  )
                  data = _extract_json(completion.choices[0].message.content)

              elif provider == "openrouter":
                  from openai import OpenAI
                  client = OpenAI(
                      base_url="https://openrouter.ai/api/v1",
                      api_key=api_key,
                  )
                  # "openrouter/free" is OpenRouter's own auto-router: it picks
                  # a live zero-cost model for you, so the workflow doesn't
                  # break when a specific :free model gets delisted (this
                  # happens often -- OpenRouter's free lineup rotates weekly).
                  # You can pin a specific one via the openrouter_model input,
                  # e.g. "deepseek/deepseek-chat-v3-0324:free" -- just verify
                  # it's still listed at https://openrouter.ai/models?max_price=0
                  model_id = os.getenv("OPENROUTER_MODEL", "openrouter/free")
                  completion = client.chat.completions.create(
                      model=model_id,
                      messages=[{"role": "user", "content": prompt}],
                      temperature=0.2,
                      max_tokens=150,
                  )
                  data = _extract_json(completion.choices[0].message.content)

              elif provider == "gemini":
                  import google.generativeai as genai
                  genai.configure(api_key=api_key)
                  # gemini-2.5-flash-lite currently has the most generous free
                  # tier (highest RPM/RPD of the free-eligible models). Falls
                  # back to gemini-2.5-flash if Flash-Lite isn't available on
                  # your account/region.
                  try:
                      model = genai.GenerativeModel("gemini-2.5-flash-lite")
                      response = model.generate_content(prompt)
                  except Exception:
                      model = genai.GenerativeModel("gemini-2.5-flash")
                      response = model.generate_content(prompt)
                  data = _extract_json(response.text)

              else:
                  return result

              result["category"] = data.get("category", result["category"])
              result["severity"] = data.get("severity", result["severity"])
              result["confidence"] = data.get("confidence", result["confidence"])
              result["ai_summary"] = data.get("explanation", "")
              return result

          def _rule_classify(r):
              url = r.get("url", "").lower()
              title = r.get("title", "").lower()
              if _is_example_or_template(url, title):
                  r["category"] = "Information Disclosure"
                  r["severity"] = "Info"
                  r["confidence"] = 0.3
                  return r

              if any(e in url for e in [".env", ".git", ".bak", ".sql", ".log", ".conf", ".yaml",
                                        ".json", ".xml", ".ini", ".cfg", ".swp", ".old", ".pem"]):
                  r["category"] = "Sensitive Files"; r["severity"] = "High"; r["confidence"] = 0.9
                  return r
              if ".git/" in url or "github.com" in url or "/src/" in url:
                  r["category"] = "Repository Exposure"; r["severity"] = "High"; r["confidence"] = 0.8
                  return r
              if any(i in url for i in ["s3.amazonaws.com", "storage.googleapis.com", "blob.core.windows.net",
                                        "cloudfront.net", "aws", "azure", "gcp", "bucket"]):
                  r["category"] = "Cloud Exposure"; r["severity"] = "Medium"; r["confidence"] = 0.75
                  return r
              if any(i in url for i in ["wp-content", "phpinfo", "server-status", "admin", "login", "dashboard",
                                        "drupal", "joomla", "web.config"]):
                  r["category"] = "Technology Discovery"; r["severity"] = "Low"; r["confidence"] = 0.7
                  return r
              if any(i in url for i in ["email", "doc", "pdf", "xls", "csv", "readme", "changelog", "backup", "dump"]):
                  r["category"] = "Information Disclosure"; r["severity"] = "Low"; r["confidence"] = 0.6
                  return r
              r["category"] = "Information Disclosure"; r["severity"] = "Info"; r["confidence"] = 0.5
              return r

          # ---------- Dedup & Reports ----------
          def dedup(findings):
              seen, unique = set(), []
              for f in findings:
                  u = (f.get("url") or "").rstrip("/")
                  if u and u not in seen:
                      seen.add(u); unique.append(f)
              return unique

          def write_reports(findings, domain, stats, output_dir="reports", previous=None, formats=("json", "md")):
              os.makedirs(output_dir, exist_ok=True)

              if "json" in formats:
                  with open(os.path.join(output_dir, "results.json"), "w") as f:
                      json.dump(findings, f, indent=2, ensure_ascii=False)

              if "csv" in formats and findings:
                  # Union of keys across all rows -- a single row's key set is
                  # not guaranteed to be complete (e.g. ai_summary).
                  fieldnames = sorted({k for row in findings for k in row.keys()})
                  with open(os.path.join(output_dir, "results.csv"), "w", newline="") as f:
                      writer = csv.DictWriter(f, fieldnames=fieldnames, extrasaction="ignore")
                      writer.writeheader(); writer.writerows(findings)

              if "md" in formats:
                  with open(os.path.join(output_dir, "report.md"), "w") as f:
                      f.write(f"# Dork Intelligence Report\n\n**Target:** {domain}\n"
                              f"**Date:** {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}\n\n")
                      if previous:
                          prev_urls = {p["url"].rstrip("/") for p in previous if p.get("url")}
                          new = [x for x in findings if x["url"].rstrip("/") not in prev_urls]
                          f.write("## New Discoveries\n\n")
                          if new:
                              f.write("| URL | Category | Severity |\n|---|---|---|\n")
                              for item in new:
                                  f.write(f"| {item['url']} | {item['category']} | {item['severity']} |\n")
                          else:
                              f.write("No new findings.\n")
                          f.write("\n")
                      high = [x for x in findings if x.get("severity") == "High"]
                      f.write("## High Priority Findings\n\n")
                      if high:
                          f.write("| URL | Category | Confidence |\n|---|---|---|\n")
                          for item in high:
                              f.write(f"| {item['url']} | {item['category']} | {item['confidence']} |\n")
                      else:
                          f.write("No high priority findings.\n")
                      f.write("\n## All Discoveries\n\n")
                      f.write("| URL | Category | Severity | Confidence | Source | Query |\n|---|---|---|---|---|---|\n")
                      for item in findings:
                          f.write(f"| {item['url']} | {item['category']} | {item['severity']} | "
                                  f"{item['confidence']} | {item['source']} | {item['query']} |\n")
                      f.write("\n## Statistics\n\n")
                      for k, v in stats.items():
                          f.write(f"- **{k}**: {v}\n")

          def main():
              domain = os.getenv("DOMAIN")
              if not domain: log.error("DOMAIN required"); sys.exit(1)
              org = os.getenv("ORGANIZATION", "")
              keywords = os.getenv("KEYWORDS", "")
              formats = os.getenv("OUTPUT_FORMAT", "json,md").lower().split(",")
              use_ai = os.getenv("ENABLE_AI", "true").strip().lower() == "true"
              ai_provider = os.getenv("AI_PROVIDER", "openai").strip().lower()
              ai_key = os.getenv(f"{ai_provider.upper()}_API_KEY") if ai_provider in ["openai", "openrouter", "gemini"] else None

              google_key = os.getenv("GOOGLE_API_KEY"); google_cx = os.getenv("GOOGLE_CX")
              bing_key = os.getenv("BING_API_KEY"); brave_key = os.getenv("BRAVE_API_KEY")
              github_token = os.getenv("GITHUB_TOKEN")

              dg = DorkGenerator()
              queries = dg.generate(domain, org, keywords)
              log.info(f"Generated {len(queries)} dork groups.")

              all_findings = []

              # Passive OSINT sweep -- free, keyless, runs regardless of which
              # search API keys are configured.
              log.info("Running crt.sh certificate-transparency lookup...")
              all_findings.extend(crtsh_subdomains(domain))
              log.info("Running Wayback Machine historical URL sweep...")
              all_findings.extend(wayback_paths(domain))

              for d in queries:
                  q = d["query"]
                  sources = d["sources"]
                  log.info(f"Trying: {q} via {sources}")
                  for src in sources:
                      if src == "google" and google_key and google_cx:
                          res = google_search(q, google_key, google_cx)
                      elif src == "bing" and bing_key:
                          res = bing_search(q, bing_key)
                      elif src == "brave" and brave_key:
                          res = brave_search(q, brave_key)
                      elif src == "github" and github_token:
                          res = github_search_code(q, github_token)
                      else:
                          continue
                      all_findings.extend(res)
                      log.info(f"  [{src}] -> {len(res)} results")

              if not all_findings:
                  log.warning("No results found."); sys.exit(0)

              classified = [classify(f, use_ai, ai_provider, ai_key) for f in all_findings]
              unique = dedup(classified)
              log.info(f"Dedup: {len(classified)} -> {len(unique)}")

              previous = None
              prev_path = os.getenv("PREVIOUS_REPORT")
              if prev_path and os.path.isfile(prev_path):
                  try:
                      with open(prev_path) as pf: previous = json.load(pf)
                      prev_urls = {p["url"].rstrip("/") for p in previous if p.get("url")}
                      new = [f for f in unique if f["url"].rstrip("/") not in prev_urls]
                      log.info(f"Historical: {len(new)} new.")
                  except Exception as e:
                      log.warning(f"Could not read previous report: {e}")
                      previous = None

              stats = {
                  "Total dorks attempted": len(queries),
                  "Raw results collected": len(all_findings),
                  "Unique findings after dedup": len(unique),
                  "Categories": dict(Counter(f["category"] for f in unique)),
                  "Severity counts": dict(Counter(f["severity"] for f in unique))
              }
              write_reports(unique, domain, stats, "reports", previous, formats)
              console.print(f"\n[bold green]Done. Unique: {len(unique)}[/bold green]")
              for cat, cnt in stats["Categories"].items():
                  console.print(f"  {cat}: {cnt}")

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Run Dork Intelligence Hunter
        env:
          DOMAIN: ${{ inputs.domain }}
          ORGANIZATION: ${{ inputs.organization }}
          KEYWORDS: ${{ inputs.keywords }}
          OUTPUT_FORMAT: ${{ inputs.output_format }}
          ENABLE_AI: ${{ inputs.enable_ai }}
          AI_PROVIDER: ${{ inputs.ai_provider }}
          OPENROUTER_MODEL: ${{ inputs.openrouter_model }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PREVIOUS_REPORT: previous/results.json
        run: python dork_hunter.py

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: dork-results
          path: reports/
          retention-days: 30
