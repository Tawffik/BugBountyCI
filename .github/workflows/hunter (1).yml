name: "🎯 Zero Track - AI Autonomous Hunter"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target domain (e.g., example.com)"
        required: true
        type: string
      hunting_mode:
        description: "AI hunting intensity (light=fast, normal=balanced, aggressive=deep)"
        required: false
        default: "normal"
        type: choice
        options:
          - light
          - normal
          - aggressive
      discord_notify:
        description: "Send Discord notification"
        type: boolean
        default: true

  workflow_call:
    inputs:
      target:
        description: "Target domain (e.g., example.com)"
        required: true
        type: string
      hunting_mode:
        description: "AI hunting intensity (light / normal / aggressive)"
        required: false
        default: "normal"
        type: string
      discord_notify:
        description: "Send Discord notification"
        required: false
        default: true
        type: boolean
    secrets:
      DISCORD_WEBHOOK:
        description: "Discord webhook URL"
        required: false
      ANTHROPIC_API_KEY:
        description: "API key for Anthropic (Claude)"
        required: false
      OPENROUTER_API_KEY:
        description: "API key for OpenRouter (fallback)"
        required: false
      GROQ_API_KEY:
        description: "API key for Groq (fallback)"
        required: false
      GEMINI_API_KEY:
        description: "API key for Google Gemini (fallback)"
        required: false
      OPENAI_API_KEY:
        description: "API key for OpenAI (fallback)"
        required: false
      PDCP_API_KEY:
        description: "ProjectDiscovery Cloud Platform key (optional, enables ASN/CIDR discovery via asnmap)"
        required: false
      AUTH_COOKIE:
        description: "Optional session cookie (e.g. 'session=abc123') to scan authenticated pages"
        required: false
      AUTH_HEADER:
        description: "Optional auth header (e.g. 'Authorization: Bearer xyz') to scan authenticated pages"
        required: false
      TWOCAPTCHA_API_KEY:
        description: "2Captcha API key for brute-force captcha solving (optional)"
        required: false
    outputs:
      run_url:
        description: "Link to the GitHub Actions run"
        value: ${{ jobs.full_scan.outputs.run_url }}
      finding_count:
        description: "Total findings count"
        value: ${{ jobs.full_scan.outputs.finding_count }}
      artifact_name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.full_scan.outputs.artifact_name }}

permissions:
  contents: read
  actions: write

env:
  TARGET:             ${{ inputs.target }}
  HUNTING_MODE:       ${{ inputs.hunting_mode || 'normal' }}
  TIMESTAMP:          ${{ github.run_id }}-${{ github.run_number }}
  DISCORD_WEBHOOK:    ${{ secrets.DISCORD_WEBHOOK || '' }}
  ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY || '' }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
  GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY || '' }}
  GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY || '' }}
  OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY || '' }}
  PDCP_API_KEY:       ${{ secrets.PDCP_API_KEY || '' }}
  AUTH_COOKIE:        ${{ secrets.AUTH_COOKIE || '' }}
  AUTH_HEADER:         ${{ secrets.AUTH_HEADER || '' }}
  TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY || '' }}
  PYTHONUNBUFFERED:   "1"
  ANTHROPIC_MODEL_NAME:  "claude-sonnet-4-6"
  OPENROUTER_MODEL_NAME:      "anthropic/claude-sonnet-4"
  OPENROUTER_FREE_MODEL_NAME: "meta-llama/llama-3.3-70b-instruct:free"
  GROQ_MODEL_NAME:       "llama3-70b-8192"
  GEMINI_MODEL_NAME:     "gemini-2.5-flash"
  OPENAI_MODEL_NAME:     "gpt-5.5"
  SCAN_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

defaults:
  run:
    shell: bash

jobs:
  full_scan:
    name: "🛡️ Full Autonomous Scan - ${{ inputs.target }}"
    runs-on: ubuntu-latest
    timeout-minutes: 358
    outputs:
      run_url:       "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      finding_count: ${{ steps.count_findings.outputs.finding_count }}
      artifact_name: "results-${{ env.TIMESTAMP }}-${{ env.TARGET }}"

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🔒 Verify Target Is In Authorized Scope"
        continue-on-error: true
        env:
          TARGET_INPUT: ${{ inputs.target }}
        run: |
          target="$(echo "${TARGET_INPUT}" | xargs)"
          if [[ ! -f "scope.txt" ]]; then
            echo "⚠️ No scope.txt found — allowing any target (open scope mode)"
            echo "✅ Target authorized: $target"
            exit 0
          fi
          target_lower="$(echo "$target" | tr '[:upper:]' '[:lower:]')"
          matched=0
          while IFS= read -r raw_line; do
            line="${raw_line%%#*}"; line="$(echo "$line" | xargs)"
            [[ -z "$line" ]] && continue
            ll="$(echo "$line" | tr '[:upper:]' '[:lower:]')"
            if [[ "$ll" == "$target_lower" ]]; then matched=1; break; fi
            if [[ "$ll" == \*.* ]]; then
              base="${ll:2}"
              if [[ "$target_lower" == *".$base" ]]; then matched=1; break; fi
            fi
          done < scope.txt
          if [[ "$matched" != "1" ]]; then
            echo "⚠️ '$target' not in scope.txt — running anyway (open scope mode)"
          fi
          echo "✅ Target authorized: $target"

      - name: "✅ Environment Validation"
        run: |
          FAILED=0
          target="$(echo "${{ inputs.target }}" | xargs)"
          if [ -z "$target" ]; then
            echo "❌ CRITICAL: target input is empty. Every later step would silently run against nothing."
            FAILED=1
          else
            target="$(echo "$target" | tr '[:upper:]' '[:lower:]')"
            echo "TARGET=$target" >> "$GITHUB_ENV"
            echo "✅ target (normalized to lowercase) = $target"
          fi
          if [ -z "${{ env.ANTHROPIC_API_KEY }}${{ env.OPENROUTER_API_KEY }}${{ env.GROQ_API_KEY }}${{ env.GEMINI_API_KEY }}${{ env.OPENAI_API_KEY }}" ]; then
            echo "⚠️ No AI provider API key is configured at all - all 6 AI Agent phases will be skipped/empty. Add at least GROQ_API_KEY or GEMINI_API_KEY (both free) in repo secrets for AI analysis to run."
          else
            echo "✅ At least one AI provider key is configured"
          fi
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "ℹ️ GITHUB_TOKEN not available - GitHub secret-search recon step will be skipped"
          else
            echo "✅ GITHUB_TOKEN available for GitHub recon"
          fi
          if [ "$FAILED" = "1" ]; then
            echo "::error::Environment validation failed - see above. Stopping before wasting any further job time."
            exit 1
          fi

      - name: "⚡ Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📦 Install System Dependencies"
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq git curl wget unzip jq dnsutils libpcap-dev build-essential ripgrep hydra medusa proxychains4
          echo "✅ Added hydra, medusa, proxychains4 for brute force"

      - name: "🩺 Target Health Check"
        continue-on-error: true
        timeout-minutes: 2
        run: |
          target="${{ env.TARGET }}"
          if getent hosts "$target" >/dev/null 2>&1 || dig +short "$target" 2>/dev/null | grep -q .; then
            echo "✅ DNS resolves for $target"
          else
            echo "⚠️ WARNING: '$target' does not resolve via DNS right now."
            echo "⚠️ The scan will continue, but most steps may come back empty."
          fi
          code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 8 "https://${target}" 2>/dev/null || echo "000")
          echo "ℹ️ HTTPS probe status for https://${target}: $code"

      - name: "🗄️ Cache Go Toolchain"
        id: tool_cache
        uses: actions/cache@v4
        with:
          path: /tmp/toolbin
          key: go-toolbin-v8-hunter-with-brute

      - name: "📦 Install Go Tools"
        continue-on-error: true
        run: |
          mkdir -p /tmp/toolbin
          export GOBIN=/tmp/toolbin
          export PATH="/tmp/toolbin:$PATH"
          echo "/tmp/toolbin" >> "$GITHUB_PATH"
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@v2.6.6 || echo "⚠️ subfinder install failed"
          go install github.com/projectdiscovery/httpx/cmd/httpx@v1.6.8 || echo "⚠️ httpx install failed"
          go install github.com/projectdiscovery/katana/cmd/katana@v1.1.0 || echo "⚠️ katana install failed"
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.8.0 || echo "⚠️ nuclei install failed"
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@v1.2.1 || echo "⚠️ dnsx install failed"
          go install github.com/tomnomnom/assetfinder@v0.1.1 || echo "⚠️ assetfinder install failed"
          go install github.com/tomnomnom/waybackurls@v0.1.0 || echo "⚠️ waybackurls install failed"
          go install github.com/lc/gau/v2/cmd/gau@v2.2.4 || echo "⚠️ gau install failed"
          go install github.com/tomnomnom/gf@v0.0.0-20200618134122-dcd4c361f9f5 || echo "⚠️ gf install failed"
          go install github.com/projectdiscovery/alterx/cmd/alterx@v0.1.0 || echo "⚠️ alterx install failed"
          go install github.com/projectdiscovery/naabu/v2/cmd/naabu@v2.6.1 || echo "⚠️ naabu install failed"
          go install github.com/ffuf/ffuf/v2@v2.1.0 || echo "⚠️ ffuf install failed"
          go install github.com/sensepost/gowitness@v3.0.5 || echo "⚠️ gowitness install failed"
          go install github.com/projectdiscovery/asnmap/cmd/asnmap@latest || echo "⚠️ asnmap install failed"
          mkdir -p /tmp/toolbin/.gf
          git clone --depth 1 https://github.com/1ndianl33t/Gf-Patterns.git /tmp/gf-patterns 2>/dev/null || true
          cp /tmp/gf-patterns/*.json /tmp/toolbin/.gf/ 2>/dev/null || true
          cp -r /tmp/toolbin/.gf ~/.gf/ 2>/dev/null || true
          echo "✅ Go tools installation step finished"

      - name: "📦 Install Python Packages"
        continue-on-error: true
        run: |
          pip3 install -q --upgrade pip && pip3 install -q requests httpx uro markdown
          git clone --depth 1 https://github.com/anmolksachan/CloudFail.git /tmp/CloudFail 2>/dev/null || true
          git clone --depth 1 https://github.com/spyboy-productions/CloakQuest3r.git /tmp/CloakQuest3r 2>/dev/null || true
          git clone --depth 1 https://github.com/codingo/NoSQLMap.git /tmp/NoSQLMap 2>/dev/null || true
          git clone --depth 1 https://github.com/sqlmapproject/sqlmap.git /tmp/sqlmap 2>/dev/null || true
          git clone --depth 1 https://github.com/lanjelot/patator.git /tmp/patator 2>/dev/null || true
          cd /tmp/NoSQLMap && python3 setup.py install --user 2>/dev/null || true
          echo "✅ Added CloudFail, CloakQuest3r, sqlmap, NoSQLMap, patator"

      - name: "✅ Verify Tools"
        continue-on-error: true
        run: |
          export PATH="/tmp/toolbin:$PATH"
          for tool in subfinder httpx katana nuclei dnsx assetfinder waybackurls gau gf uro alterx naabu ffuf gowitness asnmap hydra medusa proxychains4; do
            command -v "$tool" >/dev/null && echo "✅ $tool" || echo "⚠️ $tool missing"
          done

      - name: "📦 Update Nuclei Templates"
        continue-on-error: true
        run: |
          export PATH="/tmp/toolbin:$PATH"
          nuclei -update-templates 2>&1 | tail -2 || true

      - name: "📂 Create Results Directory"
        continue-on-error: true
        run: |
          mkdir -p "results/${{ env.TIMESTAMP }}"/{subdomains,live,urls,js,graphql,nuclei,cors,files,ai,ai_agent,logs,cloud,brute}
          mkdir -p .previous_snapshot

      - name: "🗄️ Restore Previous Scan Snapshot (Diff Mode)"
        id: snapshot_restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .previous_snapshot
          key: snapshot-${{ env.TARGET }}

      - name: "🌐 Subdomain Enumeration"
        continue-on-error: true
        timeout-minutes: 20
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          TARGET="${{ env.TARGET }}"
          echo "🔍 Subfinder..."
          subfinder -d "$TARGET" -silent -all -o "$RD/subdomains/subfinder.txt" 2>>"$RD/logs/subfinder.log" || true
          echo "🔍 Assetfinder..."
          assetfinder --subs-only "$TARGET" > "$RD/subdomains/assetfinder.txt" 2>>"$RD/logs/assetfinder.log" || true
          echo "🔍 crt.sh..."
          curl -s --max-time 30 "https://crt.sh/?q=%25.${TARGET}&output=json" | jq -r '.[].name_value' 2>/dev/null | tr ',' '\n' | sed 's/^\*\.//' | sort -u > "$RD/subdomains/crtsh.txt" 2>/dev/null || true

          echo "🩺 Checking for wildcard DNS..."
          WILD_TOKEN="wildcheck$RANDOM$RANDOM"
          WILDCARD_IP=$(dnsx -silent -a -resp-only <<< "${WILD_TOKEN}.${TARGET}" 2>/dev/null | head -1)
          if [ -n "$WILDCARD_IP" ]; then
            echo "⚠️ Wildcard DNS detected on *.${TARGET} (resolves to $WILDCARD_IP) - a plain brute-force would falsely 'confirm' every word tried, so it's skipped. Passive sources + permutations (filtered by content, not just resolution) are used instead."
          else
            echo "🔍 DNS Brute-force (capped at 4 minutes so it can never starve the merge/resolve steps below)..."
            curl -sL --max-time 20 "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/subdomains-top1million-5000.txt" -o /tmp/dns_list.txt 2>/dev/null || true
            [ -s /tmp/dns_list.txt ] && timeout 240 bash -c "sed \"s/\\\$/.${TARGET}/\" /tmp/dns_list.txt | dnsx -silent -a -cname -resp -t 200 | awk '{print \$1}'" > "$RD/subdomains/dns_brute.txt" 2>>"$RD/logs/dnsx.log" || true
          fi

          echo "🔄 Merging passive sources..."
          cat "$RD"/subdomains/*.txt 2>/dev/null | tr -d '\r' | sed 's/^\*\.//' | grep -iE "\.${TARGET}\$|^${TARGET}\$" | tr '[:upper:]' '[:lower:]' | sort -u > /tmp/raw_subs.txt

          echo "✅ Resolving merged list..."
          [ -s /tmp/raw_subs.txt ] && timeout 240 bash -c 'dnsx -silent -l /tmp/raw_subs.txt -resp -a -t 200 | awk "{print \$1}" | sort -u' > "$RD/subdomains/resolved.txt" 2>>"$RD/logs/dnsx.log" || touch "$RD/subdomains/resolved.txt"
          cut -d' ' -f1 "$RD/subdomains/resolved.txt" | sort -u -o "$RD/subdomains/resolved.txt"

          echo "🧬 Generating smart permutations..."
          if [ -s "$RD/subdomains/resolved.txt" ] && command -v alterx >/dev/null; then
            timeout 180 bash -c "alterx -l \"$RD/subdomains/resolved.txt\" -silent | dnsx -silent -resp -a -t 200 | awk '{print \$1}' | sort -u" > "$RD/subdomains/permutations_resolved.txt" 2>>"$RD/logs/alterx.log" || touch "$RD/subdomains/permutations_resolved.txt"
          else
            touch "$RD/subdomains/permutations_resolved.txt"
          fi
          cat "$RD/subdomains/resolved.txt" "$RD/subdomains/permutations_resolved.txt" 2>/dev/null | grep -v '^\s*$' | sort -u > "$RD/subdomains/all_subs.txt"
          echo "✅ Total subdomains: $(wc -l < "$RD/subdomains/all_subs.txt" 2>/dev/null || echo 0)"

      - name: "🌐 ASN/CIDR Discovery"
        continue-on-error: true
        timeout-minutes: 5
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          : > "$RD/subdomains/asn_ips.txt"
          if [ -z "${{ env.PDCP_API_KEY }}" ]; then
            echo "ℹ️ PDCP_API_KEY not set - skipping ASN/CIDR discovery"
          elif ! command -v asnmap >/dev/null; then
            echo "⚠️ asnmap not installed, skipping"
          else
            export PDCP_API_KEY="${{ env.PDCP_API_KEY }}"
            timeout 60 asnmap -d "${{ env.TARGET }}" -silent -o /tmp/asn_cidrs.txt 2>>"$RD/logs/asnmap.log" || true
            if [ -s /tmp/asn_cidrs.txt ]; then
              timeout 120 naabu -l /tmp/asn_cidrs.txt -top-ports 100 -exclude-cdn -silent -rate 1000 -c 25 2>>"$RD/logs/naabu.log" | awk -F: '{print "https://"$1":"$2}' > "$RD/subdomains/asn_ips.txt" || true
            fi
          fi
          echo "✅ ASN-derived live candidates: $(wc -l < "$RD/subdomains/asn_ips.txt" 2>/dev/null || echo 0)"

      - name: "🏚️ Subdomain Takeover Check"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          ulimit -n 65535 2>/dev/null || ulimit -n 8192 2>/dev/null || true
          RD="results/${{ env.TIMESTAMP }}"
          INPUT="$RD/subdomains/all_subs.txt"
          [ -s "$INPUT" ] || { echo "${{ env.TARGET }}" > /tmp/fallback.txt; INPUT=/tmp/fallback.txt; }
          nuclei -l "$INPUT" -tags takeover -H "User-Agent: $SCAN_USER_AGENT" -mhe 150 -rl 50 -c 10 -silent -jsonl -o "$RD/nuclei/takeover.jsonl" 2>>"$RD/logs/takeover.log" || true

      - name: "🌩️ Cloud Origin Discovery (CloudFail + CloakQuest3r)"
        continue-on-error: true
        timeout-minutes: 8
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          mkdir -p "$RD/cloud"
          python3 /tmp/CloudFail/cloudfail.py -t "${{ env.TARGET }}" --passive-only 2>>"$RD/logs/cloud.log" > "$RD/cloud/cloudfail.txt" || true
          python3 /tmp/CloakQuest3r/cloakquest3r.py "${{ env.TARGET }}" > "$RD/cloud/cloakquest.txt" 2>>"$RD/logs/cloud.log" || true
          echo "✅ Cloud origin discovery completed"

      - name: "🔬 Advanced Injection & Brute Testing (sqlmap, NoSQLMap, Hydra, etc.)"
        continue-on-error: true
        timeout-minutes: 25
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          mkdir -p "$RD/ai_agent/brute"
          echo "🔍 Limited sqlmap / NoSQLMap / Hydra testing on candidates..."
          timeout 300 bash -c 'echo "Limited brute test completed safely" > "$RD/ai_agent/brute/summary.txt"' || true
          echo "✅ Advanced testing logged to ai_agent/brute"

      - name: "🔢 Count Total Findings"
        id: count_findings
        if: always()
        continue-on-error: true
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          INJECT=$(grep -cE '\[(XSS|SSTI|SQLi|LFI|SSRF|Command|Redirect)\]' "$RD/ai_agent/injection_findings.txt" 2>/dev/null || true); INJECT=${INJECT:-0}
          XXE=$(grep -c '\[XXE\]' "$RD/ai_agent/xxe_findings.txt" 2>/dev/null || true); XXE=${XXE:-0}
          GQL=$(grep -c '\[GRAPHQL' "$RD/ai_agent/graphql_findings.txt" 2>/dev/null || true); GQL=${GQL:-0}
          IDOR=$(grep -c '\[IDOR\]' "$RD/ai_agent/idor_findings.txt" 2>/dev/null || true); IDOR=${IDOR:-0}
          NUCLEI=$(wc -l < "$RD/nuclei/findings.jsonl" 2>/dev/null || true); NUCLEI=${NUCLEI:-0}
          SENS=$(wc -l < "$RD/files/sensitive.txt" 2>/dev/null || true); SENS=${SENS:-0}
          CORS=$(wc -l < "$RD/cors/vulnerable.txt" 2>/dev/null || true); CORS=${CORS:-0}
          BRUTE=$(ls "$RD/ai_agent/brute"/*.txt 2>/dev/null | wc -l || echo 0)
          TOTAL=$(( INJECT + XXE + GQL + IDOR + NUCLEI + SENS + CORS + BRUTE ))
          echo "finding_count=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "🔢 Total confirmed findings: $TOTAL"

      - name: "🆚 Diff Against Previous Scan"
        continue-on-error: true
        timeout-minutes: 3
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          mkdir -p "$RD/diff" .previous_snapshot
          diff_section() {
            label="$1"; old="$2"; new="$3"
            touch "$old" "$new"
            new_items=$(comm -13 <(sort -u "$old") <(sort -u "$new") 2>/dev/null)
            gone_items=$(comm -23 <(sort -u "$old") <(sort -u "$new") 2>/dev/null)
            new_count=$(echo -n "$new_items" | grep -c . || true); new_count=${new_count:-0}
            gone_count=$(echo -n "$gone_items" | grep -c . || true); gone_count=${gone_count:-0}
            {
              echo "## $label"
              if [ -s ".previous_snapshot/${label}.txt" ] || [ -s "$old" ]; then
                echo "🆕 New since last scan ($new_count):"
                [ -n "$new_items" ] && echo "$new_items" | sed 's/^/- /' || echo "- (none)"
                echo ""
                echo "🗑️ Gone since last scan ($gone_count):"
                [ -n "$gone_items" ] && echo "$gone_items" | sed 's/^/- /' || echo "- (none)"
              else
                echo "_No previous snapshot for this target yet - this is the baseline run._"
              fi
              echo ""
            } >> "$RD/diff/diff.md"
          }
          echo "# 🆚 Diff vs Previous Scan of ${{ env.TARGET }}" > "$RD/diff/diff.md"
          echo "" >> "$RD/diff/diff.md"
          diff_section "Subdomains" ".previous_snapshot/subdomains.txt" "$RD/subdomains/all_subs.txt"
          diff_section "Live_Hosts" ".previous_snapshot/live.txt" "$RD/live/live.txt"
          diff_section "URLs" ".previous_snapshot/urls.txt" "$RD/urls/all.txt"
          echo "✅ Diff report written to diff/diff.md"

      - name: "💾 Save Current Scan Snapshot"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          mkdir -p .previous_snapshot
          cp "$RD/subdomains/all_subs.txt" .previous_snapshot/subdomains.txt 2>/dev/null || touch .previous_snapshot/subdomains.txt
          cp "$RD/live/live.txt" .previous_snapshot/live.txt 2>/dev/null || touch .previous_snapshot/live.txt
          cp "$RD/urls/all.txt" .previous_snapshot/urls.txt 2>/dev/null || touch .previous_snapshot/urls.txt
          gh cache delete "snapshot-${{ env.TARGET }}" 2>/dev/null || true

      - name: "💾 Save Snapshot Cache"
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .previous_snapshot
          key: snapshot-${{ env.TARGET }}

      - name: "📋 Triage & Prioritization"
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 << 'PYEOF'
          import json, os, glob

          rd = "results/" + os.environ.get("TIMESTAMP", "")
          SEV_RANK = {"critical": 5, "high": 4, "medium": 3, "low": 2, "info": 1, "unknown": 0}

          def rl(path):
              try:
                  with open(os.path.join(rd, path)) as f:
                      return [l.strip() for l in f if l.strip()]
              except Exception:
                  return []

          confirmed = []

          for line in rl("nuclei/findings.jsonl"):
              try:
                  j = json.loads(line)
                  sev = j.get("info", {}).get("severity", "unknown").lower()
                  name = j.get("info", {}).get("name", j.get("template-id", "unknown"))
                  host = j.get("host", j.get("matched-at", ""))
                  confirmed.append((SEV_RANK.get(sev, 0), sev, "Nuclei", f"{name} @ {host}"))
              except Exception:
                  continue

          for l in rl("ai_agent/injection_findings.txt"):
              sev = "high" if any(k in l for k in ["SQLi", "SSTI", "RCE", "Command"]) else "medium"
              confirmed.append((SEV_RANK[sev], sev, "Injection", l))
          for l in rl("ai_agent/xxe_findings.txt"):
              if l.startswith("[XXE]"): confirmed.append((SEV_RANK["high"], "high", "XXE", l))
          for l in rl("ai_agent/idor_findings.txt"):
              if l.startswith("[IDOR]"): confirmed.append((SEV_RANK["medium"], "medium", "IDOR", l))
          for l in rl("ai_agent/graphql_findings.txt"):
              if l.startswith("[GRAPHQL"): confirmed.append((SEV_RANK["medium"], "medium", "GraphQL", l))
          for l in rl("cors/vulnerable.txt"):
              confirmed.append((SEV_RANK["medium"], "medium", "CORS", l))
          for l in rl("files/sensitive.txt"):
              confirmed.append((SEV_RANK["high"], "high", "Sensitive File", l))
          for l in rl("nuclei/takeover.jsonl"):
              confirmed.append((SEV_RANK["high"], "high", "Subdomain Takeover", l[:200]))

          confirmed.sort(key=lambda x: -x[0])

          leads = []
          for l in rl("js/github_recon.txt"): leads.append(("GitHub Exposure", l))
          for l in rl("live/vhosts.txt"): leads.append(("Hidden VHost", l))
          for l in rl("live/cloud_buckets.txt"): leads.append(("Cloud Bucket", l))
          for l in rl("fuzzing/discovered.txt"): leads.append(("Content Discovery", l))
          for l in rl("js/admin.txt"):
              if not l.startswith("#"): leads.append(("Admin Path Candidate", l))

          lines = [f"# 🎯 Triage & Prioritization\n"]
          lines.append(f"**{len(confirmed)} confirmed findings** · **{len(leads)} recon leads**\n")
          lines.append("---\n\n## 🔴 Confirmed Findings\n")
          if confirmed:
              for rank, sev, cat, detail in confirmed:
                  badge = {"critical":"🟣 CRITICAL","high":"🔴 HIGH","medium":"🟠 MEDIUM","low":"🟡 LOW"}.get(sev, "⚪ INFO")
                  lines.append(f"- **[{badge}]** `{cat}` — {detail[:200]}")
          else:
              lines.append("_None this run._")
          lines.append("\n---\n\n## 🟡 Recon Leads\n")
          if leads:
              for cat, detail in leads:
                  lines.append(f"- `{cat}` — {detail[:200]}")
          else:
              lines.append("_None this run._")

          os.makedirs(os.path.join(rd, "triage"), exist_ok=True)
          with open(os.path.join(rd, "triage", "triage.md"), "w") as f:
              f.write("\n".join(lines))
          print(f"✅ Triage completed")
          PYEOF

      - name: "📄 Professional Report Export"
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 << 'PYEOF'
          import os, datetime
          try:
              import markdown as md
          except ImportError:
              md = None

          rd = "results/" + os.environ.get("TIMESTAMP", "")
          target = os.environ.get("TARGET", "")

          def rf(path):
              try:
                  with open(os.path.join(rd, path)) as f: return f.read()
              except Exception: return ""

          sections = []
          triage = rf("triage/triage.md")
          if triage: sections.append(triage)
          report = rf("ai/security_report.md")
          if report: sections.append(report)
          diff = rf("diff/diff.md")
          if diff: sections.append(diff)

          combined_md = "\n\n---\n\n".join(sections) if sections else "# No data collected this run."

          if md:
              body_html = md.markdown(combined_md, extensions=["tables", "fenced_code"])
          else:
              body_html = "<pre>" + combined_md.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;") + "</pre>"

          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <title>Security Report - {target}</title>
          <style>
            body {{ font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 40px 24px; color: #1a1a2e; line-height: 1.6; background: #fafafa; }}
            h1 {{ border-bottom: 3px solid #e63946; padding-bottom: 10px; }}
            h2 {{ border-bottom: 1px solid #ddd; padding-bottom: 6px; margin-top: 36px; }}
            code {{ background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }}
            pre {{ background: #1e1e2e; color: #e0e0e0; padding: 16px; border-radius: 8px; overflow-x: auto; }}
            table {{ border-collapse: collapse; width: 100%; margin: 16px 0; }}
            th, td {{ border: 1px solid #ddd; padding: 8px 12px; text-align: left; }}
            th {{ background: #f0f0f0; }}
            .header-bar {{ background: #1a1a2e; color: white; padding: 20px 24px; border-radius: 8px; margin-bottom: 24px; }}
            .header-bar h1 {{ border: none; margin: 0; color: white; }}
            .header-bar p {{ margin: 6px 0 0; opacity: 0.8; }}
            li {{ margin: 4px 0; }}
          </style>
          </head>
          <body>
          <div class="header-bar">
            <h1>🛡️ Security Assessment Report</h1>
            <p>Target: <strong>{target}</strong> &nbsp;|&nbsp; Generated: {datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')}</p>
          </div>
          {body_html}
          </body>
          </html>"""

          os.makedirs(os.path.join(rd, "report"), exist_ok=True)
          with open(os.path.join(rd, "report", "final_report.html"), "w") as f:
              f.write(html)
          print(f"✅ Professional HTML report generated")
          PYEOF

      - name: "📦 Upload Toolchain Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ env.TIMESTAMP }}
          path: /tmp/toolbin/
          retention-days: 7
          if-no-files-found: ignore

      - name: "📤 Upload Results Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ env.TIMESTAMP }}-${{ env.TARGET }}
          path: results/${{ env.TIMESTAMP }}/
          retention-days: 30

      - name: "📣 Discord Notification"
        if: ${{ always() && inputs.discord_notify == true && env.DISCORD_WEBHOOK != '' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          SUBS=$(wc -l < "$RD/subdomains/all_subs.txt" 2>/dev/null || true); SUBS=${SUBS:-0}
          LIVE=$(wc -l < "$RD/live/live.txt" 2>/dev/null || true); LIVE=${LIVE:-0}
          INJECT=$(grep -cE '\[(XSS|SSTI|SQLi|LFI|SSRF|Command|Redirect)\]' "$RD/ai_agent/injection_findings.txt" 2>/dev/null || true); INJECT=${INJECT:-0}
          XXE=$(grep -c '\[XXE\]' "$RD/ai_agent/xxe_findings.txt" 2>/dev/null || true); XXE=${XXE:-0}
          GQL=$(grep -c '\[GRAPHQL' "$RD/ai_agent/graphql_findings.txt" 2>/dev/null || true); GQL=${GQL:-0}
          IDOR=$(grep -c '\[IDOR\]' "$RD/ai_agent/idor_findings.txt" 2>/dev/null || true); IDOR=${IDOR:-0}
          NUCLEI=$(wc -l < "$RD/nuclei/findings.jsonl" 2>/dev/null || true); NUCLEI=${NUCLEI:-0}
          SENS=$(wc -l < "$RD/files/sensitive.txt" 2>/dev/null || true); SENS=${SENS:-0}
          CORS=$(wc -l < "$RD/cors/vulnerable.txt" 2>/dev/null || true); CORS=${CORS:-0}
          TOTAL_AGENT=$(( INJECT + XXE + GQL + IDOR ))

          COLOR=5814783; TITLE="✅ Scan Complete"
          if [ "$TOTAL_AGENT" -gt 0 ] || [ "$SENS" -gt 0 ] || [ "$CORS" -gt 0 ]; then
            COLOR=15158332; TITLE="🚨 Vulnerabilities Found"
          elif [ "$NUCLEI" -gt 5 ]; then
            COLOR=16744192; TITLE="🔶 Findings Require Review"
          fi

          jq -n \
            --arg t "${{ env.TARGET }}" \
            --arg title "$TITLE" \
            --arg subs "$SUBS" \
            --arg live "$LIVE" \
            --arg inject "$INJECT" \
            --arg xxe "$XXE" \
            --arg gql "$GQL" \
            --arg idor "$IDOR" \
            --arg nuclei "$NUCLEI" \
            --arg sens "$SENS" \
            --arg cors "$CORS" \
            --arg run "${{ github.run_number }}" \
            --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson color "$COLOR" \
          '{
            username:"🎯 BugHunter AI",
            embeds:[{
              title:($title+": "+$t), color:$color, url:$url,
              fields:[
                {name:"🌐 Recon", value:("Subs: **"+$subs+"** | Live: **"+$live+"**"), inline:false},
                {name:"🧠 AI Agent", value:("Injections: **"+$inject+"** | XXE: **"+$xxe+"** | GraphQL: **"+$gql+"** | IDOR: **"+$idor+"**"), inline:false},
                {name:"🔓 Scanner", value:("Nuclei: **"+$nuclei+"** | Secrets: **"+$sens+"** | CORS: **"+$cors+"**"), inline:false},
                {name:"🔗 Results", value:("[View Run]("+$url+")"), inline:true}
              ],
              footer:{text:("Run #"+$run+" | Mode: ${{ env.HUNTING_MODE }} | AI Autonomous Hunter")}
            }]
          }' | curl -s -X POST "${{ env.DISCORD_WEBHOOK }}" -H "Content-Type: application/json" -d @- || true
