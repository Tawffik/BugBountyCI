name: "STRIX-TEFA Final Production Workflow"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target domain (e.g., example.com)"
        required: true
        type: string
      simulate:
        description: "Run in simulation mode (uses example.com)"
        default: false
        type: boolean
      hunting_mode:
        description: "Scan intensity (light/normal/aggressive)"
        default: "normal"
        type: choice
        options:
          - light
          - normal
          - aggressive

permissions:
  contents: read
  actions: write

jobs:
  security-scan:
    name: "Security Assessment"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Environment"
        run: |
          TARGET="${{ inputs.target }}"
          if [[ "${{ inputs.simulate }}" == "true" ]]; then
            TARGET="example.com"
            echo "🔵 SIMULATION MODE: Using example.com"
          fi
          echo "TARGET=$TARGET" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%s)" >> $GITHUB_ENV
          mkdir -p results/subdomains results/live results/nuclei results/reports

      - name: "Install System Dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl wget unzip jq dnsutils build-essential

      - name: "Install Go"
        run: |
          wget -q https://go.dev/dl/go1.23.1.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.23.1.linux-amd64.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: "Install Security Tools (with fallback)"
        continue-on-error: true
        run: |
          export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest || true
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest || true
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest || true
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest || true
          go install github.com/tomnomnom/assetfinder@latest || true
          go install github.com/lc/gau/v2/cmd/gau@latest || true
          go install github.com/tomnomnom/waybackurls@latest || true
          pip3 install --quiet uro || true

      - name: "Verify Tools"
        run: |
          export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
          echo "✅ Verifying tools..."
          which subfinder || echo "⚠️ subfinder not found"
          which httpx || echo "⚠️ httpx not found"
          which nuclei || echo "⚠️ nuclei not found"
          which dnsx || echo "⚠️ dnsx not found"

      - name: "Update Nuclei Templates"
        continue-on-error: true
        run: |
          export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
          nuclei -update-templates 2>&1 | head -5

      - name: "Phase 1: Subdomain Enumeration"
        continue-on-error: true
        run: |
          export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
          TARGET="${{ env.TARGET }}"
          echo "🔍 Enumerating subdomains for $TARGET..."

          subfinder -d "$TARGET" -silent -all -o results/subdomains/subfinder.txt 2>/dev/null || true
          assetfinder --subs-only "$TARGET" > results/subdomains/assetfinder.txt 2>/dev/null || true
          curl -s --max-time 30 "https://crt.sh/?q=%25.${TARGET}&output=json" 2>/dev/null | \
            jq -r '.[].name_value' 2>/dev/null | sed 's/^\*\.//' > results/subdomains/crtsh.txt || true

          cat results/subdomains/*.txt 2>/dev/null | sort -u > results/subdomains/all_subs.txt

          if [ -s results/subdomains/all_subs.txt ]; then
            dnsx -silent -a -resp -l results/subdomains/all_subs.txt 2>/dev/null | \
              awk '{print $1}' | sort -u > results/subdomains/resolved.txt
          else
            echo "$TARGET" > results/subdomains/resolved.txt
          fi

          COUNT=$(wc -l < results/subdomains/resolved.txt 2>/dev/null || echo 0)
          echo "✅ Found $COUNT subdomains"

      - name: "Phase 2: DNS Intelligence"
        continue-on-error: true
        run: |
          export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
          INPUT="results/subdomains/resolved.txt"
          [ -s "$INPUT" ] || echo "${{ env.TARGET }}" > "$INPUT"
          dnsx -l "$INPUT" -a -aaaa -cname -mx -txt -ns -jsonl -o results/dns_records.jsonl 2>/dev/null || true

      - name: "Phase 3: Web Fingerprinting"
        continue-on-error: true
        run: |
          export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
          INPUT="results/subdomains/resolved.txt"
          [ -s "$INPUT" ] || echo "${{ env.TARGET }}" > "$INPUT"
          httpx -l "$INPUT" -silent -status-code -title -tech-detect -json -o results/live/live.json 2>/dev/null || true
          jq -r '.url' results/live/live.json 2>/dev/null | sort -u > results/live/live.txt
          COUNT=$(wc -l < results/live/live.txt 2>/dev/null || echo 0)
          echo "✅ Found $COUNT live hosts"

      - name: "Phase 4: URL Collection"
        continue-on-error: true
        run: |
          export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
          INPUT="results/live/live.txt"
          [ -s "$INPUT" ] || echo "https://${{ env.TARGET }}" > "$INPUT"
          cat results/subdomains/resolved.txt 2>/dev/null | waybackurls > results/wayback.txt 2>/dev/null || true
          gau "${{ env.TARGET }}" --subs --o results/gau.txt 2>/dev/null || true
          cat results/wayback.txt results/gau.txt 2>/dev/null | sort -u > results/urls.txt
          COUNT=$(wc -l < results/urls.txt 2>/dev/null || echo 0)
          echo "✅ Collected $COUNT URLs"

      - name: "Phase 5: JavaScript Analysis"
        continue-on-error: true
        run: |
          echo "🔍 Analyzing JavaScript for secrets..."
          grep -iE '\.js' results/urls.txt 2>/dev/null | head -100 > results/js_files.txt || true
          if [ -s results/js_files.txt ]; then
            while read -r url; do
              curl -sk --max-time 5 "$url" 2>/dev/null | \
                grep -Eio 'AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|[sp]k_live_[A-Za-z0-9]{16,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' \
                >> results/secrets.txt 2>/dev/null || true
            done < results/js_files.txt
          fi
          COUNT=$(wc -l < results/secrets.txt 2>/dev/null || echo 0)
          echo "✅ Found $COUNT secrets in JS files"

      - name: "Phase 6: Nuclei Scan"
        continue-on-error: true
        run: |
          export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
          INPUT="results/live/live.txt"
          [ -s "$INPUT" ] || echo "https://${{ env.TARGET }}" > "$INPUT"
          nuclei -l "$INPUT" -severity critical,high,medium -tags exposure,panel,config -jsonl -o results/nuclei/findings.jsonl 2>/dev/null || true
          COUNT=$(wc -l < results/nuclei/findings.jsonl 2>/dev/null || echo 0)
          echo "✅ Found $COUNT vulnerabilities"

      - name: "Phase 7: Subdomain Takeover Check"
        continue-on-error: true
        run: |
          export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
          INPUT="results/subdomains/resolved.txt"
          [ -s "$INPUT" ] || echo "${{ env.TARGET }}" > "$INPUT"
          nuclei -l "$INPUT" -tags takeover -silent -jsonl -o results/nuclei/takeover.jsonl 2>/dev/null || true
          COUNT=$(wc -l < results/nuclei/takeover.jsonl 2>/dev/null || echo 0)
          echo "✅ Found $COUNT potential takeovers"

      - name: "Phase 8: Cloud Asset Discovery"
        continue-on-error: true
        run: |
          TARGET="${{ env.TARGET }}"
          BASE_NAME="$(echo "$TARGET" | sed -E 's/\.[a-z0-9]+$//' | sed -E 's/.*\.//')"
          for suffix in "" "-backup" "-assets" "-media" "-dev" "-staging" "-files" "-data" "-public" "-uploads" "-static" "-logs"; do
            bname="${BASE_NAME}${suffix}"
            s3_code=$(curl -sk --max-time 3 -o /dev/null -w "%{http_code}" "https://${bname}.s3.amazonaws.com/" 2>/dev/null || echo "000")
            s3_code="${s3_code: -3}"
            [ "$s3_code" = "200" ] || [ "$s3_code" = "403" ] && echo "S3: https://${bname}.s3.amazonaws.com/ (HTTP $s3_code)" >> results/cloud_assets.txt
            gcs_code=$(curl -sk --max-time 3 -o /dev/null -w "%{http_code}" "https://storage.googleapis.com/${bname}/" 2>/dev/null || echo "000")
            gcs_code="${gcs_code: -3}"
            [ "$gcs_code" = "200" ] || [ "$gcs_code" = "403" ] && echo "GCS: https://storage.googleapis.com/${bname}/ (HTTP $gcs_code)" >> results/cloud_assets.txt
          done
          echo "✅ Cloud asset check complete"

      - name: "Phase 9: Identity Discovery"
        continue-on-error: true
        run: |
          INPUT="results/live/live.txt"
          [ -s "$INPUT" ] || echo "https://${{ env.TARGET }}" > "$INPUT"
          while IFS= read -r host; do
            host="$(echo "$host" | tr -d '\r' | xargs)"
            [ -z "$host" ] && continue
            for path in "/.well-known/openid-configuration" "/.well-known/oauth-authorization-server"; do
              code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 3 "${host}${path}" 2>/dev/null || echo "000")
              code="${code: -3}"
              [ "$code" = "200" ] && echo "[Identity] ${host}${path}" >> results/identity.txt
            done
          done < "$INPUT"
          COUNT=$(wc -l < results/identity.txt 2>/dev/null || echo 0)
          echo "✅ Found $COUNT identity endpoints"

      - name: "Phase 10: Generate Final Report"
        run: |
          cat << 'EOF' > results/reports/security_report.md
          # 🛡️ STRIX-TEFA Security Assessment Report

          **Target:** ${{ env.TARGET }}
          **Date:** $(date -u)
          **Mode:** ${{ inputs.hunting_mode }}

          ## 📊 Executive Summary

          | Metric | Value |
          |--------|-------|
          | Subdomains Discovered | $(wc -l < results/subdomains/resolved.txt 2>/dev/null || echo 0) |
          | Live Hosts | $(wc -l < results/live/live.txt 2>/dev/null || echo 0) |
          | URLs Collected | $(wc -l < results/urls.txt 2>/dev/null || echo 0) |
          | Secrets Found | $(wc -l < results/secrets.txt 2>/dev/null || echo 0) |
          | Vulnerabilities | $(wc -l < results/nuclei/findings.jsonl 2>/dev/null || echo 0) |
          | Potential Takeovers | $(wc -l < results/nuclei/takeover.jsonl 2>/dev/null || echo 0) |
          | Cloud Assets | $(wc -l < results/cloud_assets.txt 2>/dev/null || echo 0) |
          | Identity Endpoints | $(wc -l < results/identity.txt 2>/dev/null || echo 0) |

          ## 🔴 Critical Findings

          ### Nuclei Vulnerabilities
          $(cat results/nuclei/findings.jsonl 2>/dev/null | jq -r '"- **" + .info.name + "** (" + .info.severity + ") – " + .matched-at' 2>/dev/null | head -20 || echo "No critical findings found")

          ### Subdomain Takeovers
          $(cat results/nuclei/takeover.jsonl 2>/dev/null | jq -r '"- **" + .info.name + "** – " + .matched-at' 2>/dev/null || echo "No takeover issues found")

          ## 🟡 Secrets Exposed
          $(cat results/secrets.txt 2>/dev/null | sed 's/^/- /' | head -20 || echo "No secrets found")

          ## ☁️ Cloud Assets
          $(cat results/cloud_assets.txt 2>/dev/null | sed 's/^/- /' || echo "No cloud assets found")

          ## 🆔 Identity Providers
          $(cat results/identity.txt 2>/dev/null | sed 's/^/- /' || echo "No identity endpoints found")

          ## 🚀 Next Steps
          1. Review and remediate critical vulnerabilities
          2. Rotate any exposed secrets immediately
          3. Secure cloud storage buckets
          4. Harden identity endpoints
          5. Run this scan regularly for continuous monitoring
          EOF

      - name: "Upload Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-results-${{ github.run_id }}
          path: results/
          retention-days: 30

      - name: "Print Summary"
        if: always()
        run: |
          echo "✅ Scan completed successfully!"
          echo "📊 Results uploaded as artifact: strix-results-${{ github.run_id }}"
          echo ""
          echo "📈 Quick Summary:"
          echo "  - Subdomains: $(wc -l < results/subdomains/resolved.txt 2>/dev/null || echo 0)"
          echo "  - Live Hosts: $(wc -l < results/live/live.txt 2>/dev/null || echo 0)"
          echo "  - Vulnerabilities: $(wc -l < results/nuclei/findings.jsonl 2>/dev/null || echo 0)"
          echo "  - Secrets: $(wc -l < results/secrets.txt 2>/dev/null || echo 0)"
