name: apply-asn-soft-fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-zero-track.yml'
      - 'docs/apply_asn_soft_fix.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          fetch-depth: 1
      - name: Apply ASN soft-fix and push
        env:
          TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail
          python3 docs/apply_asn_soft_fix.py
          grep -c 'bgpview (after asnmap empty)' .github/workflows/zero-track-hunter.yml
          grep -c 'ASN variance' .github/workflows/zero-track-hunter.yml
          grep -c 'timeout 90 asnmap' .github/workflows/zero-track-hunter.yml
          grep -c 'Final all.txt' .github/workflows/zero-track-hunter.yml
          git config user.name "Tawffik"
          git config user.email "150173255+Tawffik@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/Tawffik/BugBountyCI.git"
          git add .github/workflows/zero-track-hunter.yml
          if git diff --cached --quiet; then
            echo no changes
          else
            git commit -m "fix(asn): BGPView after asnmap empty; ASN regression not BROKEN; timeout 90s"
            git push origin HEAD:main
          fi
