name: apply-step4-triage-soft
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-zero-track.yml'
      - 'docs/fix_step4_triage_soft.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          fetch-depth: 1
      - name: Apply step4
        env:
          TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail
          python3 docs/fix_step4_triage_soft.py
          grep -c 'IDOR candidate (needs manual verification)' .github/workflows/zero-track-hunter.yml || true
          grep -c 'GraphQL capability (not vuln alone)' .github/workflows/zero-track-hunter.yml || true
          grep -c 'Final all.txt' .github/workflows/zero-track-hunter.yml
          grep -c 'redact_secrets_for_llm' .github/workflows/zero-track-hunter.yml
          git config user.name "Tawffik"
          git config user.email "150173255+Tawffik@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/Tawffik/BugBountyCI.git"
          git add .github/workflows/zero-track-hunter.yml
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "fix: IDOR-CANDIDATE and GraphQL introspection/batching are leads not confirmed"
            git push origin HEAD:main
          fi
