name: restore-zero-track-once
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-zero-track.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore zero-track-hunter.yml from known-good commit
        run: |
          set -euo pipefail
          GOOD=eb17d795a3e76d6148eec55084bac779c115732b
          git show "${GOOD}:.github/workflows/zero-track-hunter.yml" > .github/workflows/zero-track-hunter.yml
          wc -l .github/workflows/zero-track-hunter.yml
          grep -c 'Final all.txt' .github/workflows/zero-track-hunter.yml
          grep -c gospider .github/workflows/zero-track-hunter.yml
          # keep this restore workflow so we can re-run if needed; do not delete yet
          git config user.name "Tawffik"
          git config user.email "150173255+Tawffik@users.noreply.github.com"
          git add .github/workflows/zero-track-hunter.yml
          git status
          if git diff --cached --quiet; then
            echo "already restored"
          else
            git commit -m "fix: restore zero-track-hunter.yml from eb17d79 (undo PLACEHOLDER)"
            git push origin HEAD:main
          fi
