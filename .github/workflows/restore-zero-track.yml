name: apply-scope-fail-closed
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-zero-track.yml'
      - 'docs/apply_scope_fail_closed.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          fetch-depth: 1
      - name: Apply scope fail-closed #1
        env:
          TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail
          python3 docs/apply_scope_fail_closed.py
          grep -c 'scope.txt is missing. Refusing to run' .github/workflows/zero-track-hunter.yml
          grep -c 'Final all.txt' .github/workflows/zero-track-hunter.yml
          grep -c 'bgpview (after asnmap empty)' .github/workflows/zero-track-hunter.yml
          test -f scope.txt.example
          git config user.name "Tawffik"
          git config user.email "150173255+Tawffik@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/Tawffik/BugBountyCI.git"
          git add .github/workflows/zero-track-hunter.yml scope.txt.example docs/apply_scope_fail_closed.py
          if git diff --cached --quiet; then
            echo no changes
          else
            git commit -m "fix(#1): scope fail-closed + target format validation"
            git push origin HEAD:main
          fi
