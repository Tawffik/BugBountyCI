name: apply-step3-ai-scope-urls
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-zero-track.yml'
      - 'docs/fix_step3_ai_scope_urls.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          fetch-depth: 1
      - name: Apply step3
        env:
          TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail
          python3 docs/fix_step3_ai_scope_urls.py
          grep -c 'endpoints_annotated' .github/workflows/zero-track-hunter.yml || true
          grep -c '_url_in_target_scope' .github/workflows/zero-track-hunter.yml || true
          grep -c 'redact_secrets_for_llm' .github/workflows/zero-track-hunter.yml
          grep -c 'Final all.txt' .github/workflows/zero-track-hunter.yml
          git config user.name "Tawffik"
          git config user.email "150173255+Tawffik@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/Tawffik/BugBountyCI.git"
          git add .github/workflows/zero-track-hunter.yml
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "fix(#2+#6): AI target scope filter; AI-infra pure URLs + ep_base"
            git push origin HEAD:main
          fi
