name: apply-step5-findings-inline
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-zero-track.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          fetch-depth: 1
      - name: Apply step5 inline
        env:
          TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path(".github/workflows/zero-track-hunter.yml")
          t = p.read_text()
          assert "Final all.txt" in t and "PLACEHOLDER" not in t
          if "Canonical findings schema" in t:
              print("already"); raise SystemExit(0)
          old = (
              "          confirmed.sort(key=lambda x: -x[0])\n\n"
              "          # Recon leads - NOT confirmed vulnerabilities, just worth a human looking at\n"
              "          leads = []\n"
              '          for l in rl("js/github_recon.txt"): leads.append(("GitHub Exposure", l))'
          )
          new = (
              "          confirmed.sort(key=lambda x: -x[0])\n\n"
              "          # Recon leads - keep leads already added\n"
              "          if not isinstance(leads, list):\n"
              "              leads = []\n"
              '          for l in rl("js/github_recon.txt"): leads.append(("GitHub Exposure", l))'
          )
          if old not in t:
              raise SystemExit("leads block missing")
          t = t.replace(old, new, 1)
          # insert findings write before triage print
          import re
          m = re.search(r'print\(f.Triage: \{len\(confirmed\)\} confirmed.*?triage/triage\.md.\)', t)
          if not m:
              raise SystemExit("triage print missing")
          marker = m.group(0)
          insert = (
              '# Canonical findings schema\n'
              '          import hashlib\n'
              '          findings_path = os.path.join(rd, "triage", "findings.jsonl")\n'
              '          leads_path = os.path.join(rd, "triage", "leads.jsonl")\n'
              '          seen = set()\n'
              '          with open(findings_path, "w") as ff:\n'
              '              for rank, sev, cat, detail in confirmed:\n'
              '                  dedupe_key = hashlib.sha256(f"{cat}|{sev}|{detail}".encode("utf-8", errors="ignore")).hexdigest()[:16]\n'
              '                  if dedupe_key in seen: continue\n'
              '                  seen.add(dedupe_key)\n'
              '                  ff.write(json.dumps({"id": dedupe_key, "source": (cat.split()[0].lower() if cat else "unknown"), "type": cat, "severity": sev, "status": "confirmed", "confidence": "high" if sev in ("critical", "high") else "medium", "evidence": detail[:2000], "dedupe_key": dedupe_key}, ensure_ascii=False) + chr(10))\n'
              '          with open(leads_path, "w") as lf:\n'
              '              for cat, detail in leads:\n'
              '                  dedupe_key = hashlib.sha256(f"lead|{cat}|{detail}".encode("utf-8", errors="ignore")).hexdigest()[:16]\n'
              '                  lf.write(json.dumps({"id": dedupe_key, "source": "recon", "type": cat, "severity": "info", "status": "lead", "confidence": "low", "evidence": detail[:2000], "dedupe_key": dedupe_key}, ensure_ascii=False) + chr(10))\n'
              '          ' + marker + '\n'
              '          print(f"Canonical findings: {len(seen)} -> triage/findings.jsonl")'
          )
          t = t.replace(marker, insert, 1)
          if "id: triage" not in t:
              t = t.replace(
                  'name: "\U0001f4cb Triage & Prioritization"\n        if: always()',
                  'name: "\U0001f4cb Triage & Prioritization"\n        id: triage\n        if: always()',
                  1,
              )
              if "id: triage" not in t:
                  t = t.replace(
                      "Triage & Prioritization\"\n        if: always()",
                      "Triage & Prioritization\"\n        id: triage\n        if: always()",
                      1,
                  )
          hq = "Hunter queue -> triage/hunter_queue.md"
          i = t.find(hq)
          j = t.find("PYEOF", i)
          if i > 0 and "finding_count=$FC" not in t[j:j+500]:
              t = t[:j] + """PYEOF
          if [ -f "results/${{ env.TIMESTAMP }}/triage/findings.jsonl" ]; then
            FC=$(wc -l < "results/${{ env.TIMESTAMP }}/triage/findings.jsonl" | tr -d ' ')
          else
            FC=0
          fi
          echo "finding_count=$FC" >> "$GITHUB_OUTPUT"
          echo "finding_count=$FC (from triage/findings.jsonl)"
""" + t[j+5:]
          t = t.replace(
              "finding_count: ${{ steps.count_findings.outputs.finding_count }}",
              "finding_count: ${{ steps.triage.outputs.finding_count }}",
              1,
          )
          for line in t.splitlines():
              if "IDOR-CANDIDATE" in line and "grep" in line:
                  t = t.replace(line, "          IDOR=0  # candidates are leads in triage", 1)
                  break
          assert "Final all.txt" in t and "Canonical findings" in t
          p.write_text(t)
          print("OK", len(t.splitlines()))
          PY
          grep -c 'Canonical findings' .github/workflows/zero-track-hunter.yml
          grep -c 'id: triage' .github/workflows/zero-track-hunter.yml
          grep -c 'Final all.txt' .github/workflows/zero-track-hunter.yml
          grep -c 'redact_secrets_for_llm' .github/workflows/zero-track-hunter.yml
          git config user.name "Tawffik"
          git config user.email "150173255+Tawffik@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/Tawffik/BugBountyCI.git"
          git add .github/workflows/zero-track-hunter.yml
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "fix(#5): canonical triage/findings.jsonl + leads; finding_count from confirmed only"
            git push origin HEAD:main
          fi
