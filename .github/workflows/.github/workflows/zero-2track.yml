name: "🎯 Zero Track - AI Autonomous Hunter v3 (Parallel Lanes)"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target domain (lowercase, e.g. example.com)"
        required: true
        type: string
      hunting_mode:
        description: "light / normal / aggressive"
        required: false
        default: "normal"
        type: choice
        options: [light, normal, aggressive]
      discord_notify:
        type: boolean
        default: true
      create_github_issue:
        type: boolean
        default: false
      confirm_open_scope:
        description: "Required ONLY when scope.txt is absent — attest authorization"
        type: boolean
        default: false
      enable_waf_bypass:
        type: boolean
        default: false
      enable_git_exposure:
        type: boolean
        default: true
      enable_source_maps:
        type: boolean
        default: true

  workflow_call:
    inputs:
      target:            { required: true, type: string }
      hunting_mode:      { required: false, default: "normal", type: string }
      discord_notify:    { required: false, default: true,  type: boolean }
      create_github_issue: { required: false, default: false, type: boolean }
      confirm_open_scope:  { required: false, default: false, type: boolean }
      enable_waf_bypass:   { required: false, default: false, type: boolean }
      enable_git_exposure: { required: false, default: true,  type: boolean }
      enable_source_maps:  { required: false, default: true,  type: boolean }
    secrets:
      DISCORD_WEBHOOK:        { required: false }
      ANTHROPIC_API_KEY:      { required: false }
      OPENROUTER_API_KEY:     { required: false }
      GROQ_API_KEY:           { required: false }
      GEMINI_API_KEY:         { required: false }
      OPENAI_API_KEY:         { required: false }
      CEREBRAS_API_KEY:       { required: false }
      TOKENROUTER_API_KEY:    { required: false }
      TOR_BRIDGE_LINES:       { required: false }
      PDCP_API_KEY:           { required: false }
      AUTH_COOKIE:            { required: false }
      AUTH_HEADER:            { required: false }
      CHAOS_API_KEY:          { required: false }
      SHODAN_API_KEY:         { required: false }
      SUBFINDER_PROVIDER_CONFIG: { required: false }
    outputs:
      run_url:
        value: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      finding_count:
        value: ${{ jobs.report.outputs.finding_count }}
      artifact_name:
        value: ${{ jobs.report.outputs.artifact_name }}

permissions:
  contents: read

concurrency:
  group: zerotrack-${{ inputs.target }}
  cancel-in-progress: false

env:
  TARGET:             ${{ inputs.target }}
  HUNTING_MODE:       ${{ inputs.hunting_mode || 'normal' }}
  TIMESTAMP:          ${{ github.run_id }}-${{ github.run_number }}
  DISCORD_WEBHOOK:    ${{ secrets.DISCORD_WEBHOOK || '' }}
  ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY || '' }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
  GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY || '' }}
  GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY || '' }}
  OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY || '' }}
  CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_API_KEY || '' }}
  TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY || '' }}
  TOR_BRIDGE_LINES:   ${{ secrets.TOR_BRIDGE_LINES || '' }}
  PDCP_API_KEY:       ${{ secrets.PDCP_API_KEY || '' }}
  AUTH_COOKIE:        ${{ secrets.AUTH_COOKIE || '' }}
  AUTH_HEADER:        ${{ secrets.AUTH_HEADER || '' }}
  CHAOS_API_KEY:      ${{ secrets.CHAOS_API_KEY || '' }}
  SHODAN_API_KEY:     ${{ secrets.SHODAN_API_KEY || '' }}
  SUBFINDER_PROVIDER_CONFIG: ${{ secrets.SUBFINDER_PROVIDER_CONFIG || '' }}
  PYTHONUNBUFFERED:   "1"
  ANTHROPIC_MODEL_NAME:       "claude-sonnet-4-5"
  OPENROUTER_MODEL_NAME:      "openrouter/auto"
  OPENROUTER_FREE_MODEL_NAME: "openrouter/free"
  GROQ_MODEL_NAME:            "llama-3.3-70b-versatile"
  GEMINI_MODEL_NAME:          "gemini-2.5-flash"
  OPENAI_MODEL_NAME:          "gpt-4.1-mini"
  CEREBRAS_MODEL_NAME:        "llama-3.3-70b"
  TOKENROUTER_BASE_URL:       "https://api.tokenrouter.com"
  TOKENROUTER_MODEL_NAME:     "moonshotai/kimi-k2-instruct"
  AI_MAX_TOKENS:              "4000"
  AI_TIMEOUT_SECS:            "120"
  AI_PROVIDER_ORDER:          "anthropic,openrouter,groq,gemini,openai,cerebras,tokenrouter"
  SCAN_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  DISCORD_NOTIFY:      ${{ inputs.discord_notify != false }}
  CREATE_ISSUE:        ${{ inputs.create_github_issue }}
  CONFIRM_OPEN_SCOPE:  ${{ inputs.confirm_open_scope }}
  ENABLE_WAF_BYPASS:   ${{ inputs.enable_waf_bypass }}
  ENABLE_GIT_EXPOSURE: ${{ inputs.enable_git_exposure != false }}
  ENABLE_SOURCE_MAPS:  ${{ inputs.enable_source_maps != false }}

defaults:
  run:
    shell: bash

jobs:
  # ===========================================================================
  # LANE 1 — RECON
  # ===========================================================================
  recon:
    name: "🔍 Recon - ${{ inputs.target }}"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # if: ${{ github.repository == 'YOUR_OWNER/YOUR_REPO' }}   # fork guard
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
      - name: "⚡ Setup Go"
        uses: actions/setup-go@v5
        with: { go-version: "stable", cache: false }
      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: "🔒 Scope Authorization (fail-closed)"
        env:
          TARGET_INPUT: ${{ inputs.target }}
          CONFIRM: ${{ env.CONFIRM_OPEN_SCOPE }}
        run: |
          target="$(echo "${TARGET_INPUT}" | xargs)"
          if [[ ! -f "scope.txt" ]]; then
            if [[ "$CONFIRM" != "true" ]]; then
              echo "::error::No scope.txt AND confirm_open_scope not set. Refusing active scan."
              exit 1
            fi
            echo "⚠️ OPEN SCOPE MODE (explicitly confirmed): $target"; exit 0
          fi
          tl="$(echo "$target" | tr '[:upper:]' '[:lower:]')"; matched=0
          while IFS= read -r raw; do
            l="${raw%%#*}"; l="$(echo "$l" | xargs)"; [[ -z "$l" ]] && continue
            ll="$(echo "$l" | tr '[:upper:]' '[:lower:]')"
            [[ "$ll" == "$tl" ]] && { matched=1; break; }
            if [[ "$ll" == \*.* ]]; then
              b="${ll:2}"
              [[ "$tl" == *".$b" || "$tl" == "$b" ]] && { matched=1; break; }
            fi
          done < scope.txt
          [[ "$matched" != "1" ]] && { echo "::error::'$target' NOT in scope.txt."; exit 1; }
          echo "✅ Authorized: $target"

      - name: "✅ Validate + Hunting Profile"
        run: |
          target="$(echo "${TARGET:-}" | xargs | tr '[:upper:]' '[:lower:]')"
          echo "$target" | grep -qE '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$' \
            || { echo "::error::Bad target: '$target'"; exit 1; }
          echo "TARGET=$target" >> "$GITHUB_ENV"
          RD="results/$TIMESTAMP"; mkdir -p "$RD/meta"
          case "$HUNTING_MODE" in
            light)      p="MODE_KATANA_DEPTH=2|MODE_NUCLEI_TAGS=exposures,misconfig,takeover|MODE_NUCLEI_RL=150|MODE_NUCLEI_CONC=20|MODE_NUCLEI_S1_TIMEOUT=1200|MODE_FFUF_HOSTS=3|MODE_DALFOX_URLS=100|MODE_JS_FILES=200|MODE_NAABU_PORTS=none|MODE_NAABU_HOSTS=0|MODE_GOWITNESS=0|MODE_CORSY_HOSTS=15" ;;
            aggressive) p="MODE_KATANA_DEPTH=5|MODE_NUCLEI_TAGS=cve,exposures,misconfig,takeover|MODE_NUCLEI_RL=80|MODE_NUCLEI_CONC=30|MODE_NUCLEI_S1_TIMEOUT=3600|MODE_FFUF_HOSTS=10|MODE_DALFOX_URLS=1500|MODE_JS_FILES=1500|MODE_NAABU_PORTS=1000|MODE_NAABU_HOSTS=40|MODE_GOWITNESS=25|MODE_CORSY_HOSTS=50" ;;
            *)          p="MODE_KATANA_DEPTH=3|MODE_NUCLEI_TAGS=cve,exposures,misconfig,takeover|MODE_NUCLEI_RL=120|MODE_NUCLEI_CONC=25|MODE_NUCLEI_S1_TIMEOUT=2400|MODE_FFUF_HOSTS=5|MODE_DALFOX_URLS=400|MODE_JS_FILES=600|MODE_NAABU_PORTS=100|MODE_NAABU_HOSTS=20|MODE_GOWITNESS=0|MODE_CORSY_HOSTS=30" ;;
          esac
          { echo "TARGET=$target"; echo "HUNTING_MODE=$HUNTING_MODE";
            echo "$p" | tr '|' '\n'; } > "$RD/meta/profile.env"
          echo "WEEKKEY=$(date -u +%G-W%V)" >> "$GITHUB_ENV"
          echo "✅ profile: $HUNTING_MODE"

      - name: "🧅 Tor Setup"
        id: tor
        uses: ./.github/actions/tor-setup
        continue-on-error: true

      - name: "📦 System Deps (minimal)"
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq dnsutils

      - name: "🗄️ Tool Cache"
        id: toolbin
        uses: actions/cache@v4
        with:
          path: /tmp/toolbin
          key: toolbin-recon-${{ env.WEEKKEY }}
          restore-keys: toolbin-recon-
      - name: "🗄️ Wordlist Cache"
        id: wordlists
        uses: actions/cache@v4
        with:
          path: /tmp/wordlists
          key: wordlists-v2-${{ env.WEEKKEY }}
          restore-keys: wordlists-v2-

      - name: "📦 Install Recon Tools"
        run: |
          mkdir -p /tmp/toolbin /tmp/wordlists
          export GOBIN=/tmp/toolbin PATH="/tmp/toolbin:/usr/local/bin:$PATH"
          echo "/tmp/toolbin" >> "$GITHUB_PATH"
          : > /tmp/tool_install.log
          pd () {  # prebuilt release binary, go-install fallback
            local bin="$1" repo="$2" ver="$3" mp="$4"
            [ -x "/tmp/toolbin/$bin" ] && return 0
            local f="${bin}_${ver#v}_linux_amd64.zip"
            if curl -sL --max-time 120 -o "/tmp/$f" "https://github.com/$repo/releases/download/$ver/$f" 2>>/tmp/tool_install.log \
               && unzip -oq "/tmp/$f" -d /tmp/pdtmp 2>>/tmp/tool_install.log \
               && mv "/tmp/pdtmp/$bin" "/tmp/toolbin/$bin" 2>>/tmp/tool_install.log; then
              chmod +x "/tmp/toolbin/$bin"; echo "✅ $bin $ver (binary)"
            else
              go install "$mp@$ver" 2>>/tmp/tool_install.log && echo "✅ $bin (go)" || echo "⚠️ $bin FAILED"
            fi
          }
          pd subfinder "projectdiscovery/subfinder" v2.6.6 "github.com/projectdiscovery/subfinder/v2/cmd/subfinder"
          pd httpx     "projectdiscovery/httpx"     v1.6.8 "github.com/projectdiscovery/httpx/cmd/httpx"
          pd katana    "projectdiscovery/katana"    v1.1.0 "github.com/projectdiscovery/katana/cmd/katana"
          pd dnsx      "projectdiscovery/dnsx"      v1.2.1 "github.com/projectdiscovery/dnsx/cmd/dnsx"
          pd alterx    "projectdiscovery/alterx"    v0.1.0 "github.com/projectdiscovery/alterx/cmd/alterx"
          ig () { command -v "$1" >/dev/null 2>&1 && return 0
                  go install "$2" 2>>/tmp/tool_install.log && echo "✅ $1" || echo "⚠️ $1 FAILED"; }
          ig assetfinder "github.com/tomnomnom/assetfinder@v0.1.1"
          ig waybackurls "github.com/tomnomnom/waybackurls@v0.1.0"
          ig gau         "github.com/lc/gau/v2/cmd/gau@v2.2.4"
          ig gf          "github.com/tomnomnom/gf@v0.0.0-20200618134122-dcd4c361f9f5"
          ig hakrawler   "github.com/hakluke/hakrawler@latest"
          ig asnmap      "github.com/projectdiscovery/asnmap/cmd/asnmap@latest"
          if ! command -v amass >/dev/null 2>&1; then
            curl -sL --max-time 150 -o /tmp/amass.zip "https://github.com/owasp-amass/amass/releases/download/v4.2.0/amass_linux_amd64.zip" 2>>/tmp/tool_install.log \
              && unzip -oq /tmp/amass.zip -d /tmp/amassx 2>>/tmp/tool_install.log \
              && find /tmp/amassx -name amass -type f -exec mv {} /tmp/toolbin/amass \; \
              && chmod +x /tmp/toolbin/amass && echo "✅ amass (binary)" \
              || go install -v github.com/owasp-amass/amass/v4/...@v4.2.0 2>>/tmp/tool_install.log || echo "⚠️ amass FAILED"
          fi
          if ! command -v trufflehog >/dev/null 2>&1; then
            curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
              | sh -s -- -b /tmp/toolbin 2>>/tmp/tool_install.log || echo "⚠️ trufflehog FAILED"
          fi
          pip3 install -q requests httpx uro pysocks arjun wafw00f 2>&1 | tail -2
          for d in LinkFinder:GerbenJavado/LinkFinder SecretFinder:m4ll0k/SecretFinder; do
            n="${d%%:*}"; r="${d##*:}"
            [ -d "/tmp/$n" ] || git clone --depth 1 "https://github.com/$r.git" "/tmp/$n" 2>/dev/null || true
            pip3 install -q -r "/tmp/$n/requirements.txt" 2>/dev/null || true
          done
          (cd /tmp/LinkFinder && pip3 install -q . 2>/dev/null) || true
          mkdir -p ~/.gf
          [ -d /tmp/gf-patterns ] || git clone --depth 1 https://github.com/1ndianl33t/Gf-Patterns.git /tmp/gf-patterns 2>/dev/null || true
          cp /tmp/gf-patterns/*.json ~/.gf/ 2>/dev/null || true
          [ -s /tmp/wordlists/dns_5k.txt ] || curl -sL --max-time 60 \
            "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/DNS/subdomains-top1million-5000.txt" \
            -o /tmp/wordlists/dns_5k.txt || true
          # hard gate
          miss=""
          for t in subfinder httpx dnsx katana; do command -v "$t" >/dev/null 2>&1 || miss="$miss $t"; done
          [ -n "$miss" ] && { echo "::error::Critical tools failed:$miss"; cat /tmp/tool_install.log | tail -20; exit 1; }
          echo "✅ recon toolchain ready"

      - name: "🗄️ Save Tool Cache"
        if: steps.toolbin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: /tmp/toolbin, key: toolbin-recon-${{ env.WEEKKEY }} }
      - name: "🗄️ Save Wordlist Cache"
        if: steps.wordlists.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: /tmp/wordlists, key: wordlists-v2-${{ env.WEEKKEY }} }

      - name: "🌐 Subdomain Enumeration"
        continue-on-error: true
        timeout-minutes: 20
        run: |
          export PATH="/tmp/toolbin:$PATH"
          RD="results/$TIMESTAMP"; target="$TARGET"
          mkdir -p ~/.config/subfinder
          { [ -n "$SUBFINDER_PROVIDER_CONFIG" ] && printf '%s\n' "$SUBFINDER_PROVIDER_CONFIG"
            [ -n "$CHAOS_API_KEY" ]  && printf 'chaos: ["%s"]\n' "$CHAOS_API_KEY"
            [ -n "$SHODAN_API_KEY" ] && printf 'shodan: ["%s"]\n' "$SHODAN_API_KEY"
          } > ~/.config/subfinder/provider-config.yaml 2>/dev/null || true
          SF=""; [ -s ~/.config/subfinder/provider-config.yaml ] && SF="-provider-config $HOME/.config/subfinder/provider-config.yaml"
          subfinder -d "$target" -silent -all $SF -o "$RD/subdomains/subfinder.txt" 2>>"$RD/logs/subfinder.log" || true
          assetfinder --subs-only "$target" > "$RD/subdomains/assetfinder.txt" 2>/dev/null || true
          got=0
          for i in 1 2; do
            curl -s --max-time 25 "https://crt.sh/?q=%25.${target}&output=json" | jq -r '.[].name_value' 2>/dev/null \
              | tr ',' '\n' | sed 's/^\*\.//' | tr '[:upper:]' '[:lower:]' | sort -u > "$RD/subdomains/crtsh.txt"
            [ -s "$RD/subdomains/crtsh.txt" ] && { got=1; break; }; sleep 4
          done
          [ "$got" = "1" ] || curl -s --max-time 25 "https://api.certspotter.com/v1/issuances?domain=${target}&include_subdomains=true&expand=dns_names" \
            | jq -r '.[].dns_names[]' 2>/dev/null | tr '[:upper:]' '[:lower:]' | sort -u > "$RD/subdomains/certspotter.txt" || true
          command -v amass >/dev/null 2>&1 && timeout 300 amass enum -passive -d "$target" -o "$RD/subdomains/amass.txt" 2>>"$RD/logs/amass.log" || touch "$RD/subdomains/amass.txt"
          WILD="wildcheck$RANDOM$RANDOM"
          WIP=$(dnsx -silent -a -resp-only <<< "${WILD}.${target}" 2>/dev/null | head -1)
          if [ -n "$WIP" ]; then
            echo "⚠️ Wildcard ($WIP) — content-based filtering..."
            : > "$RD/subdomains/wildcard_filtered.txt"
            BL=$(withtor curl -s -o /dev/null -w '%{size_download}' --max-time 10 -A "$SCAN_USER_AGENT" -H "Host: ${WILD}.${target}" "http://${WIP}/" 2>/dev/null || echo 0)
            chk () { local w="$1" h="$2" l d t
              l=$(withtor curl -s -o /dev/null -w '%{size_download}' --max-time 8 -A "$SCAN_USER_AGENT" -H "Host: $h" "http://$WIP/" 2>/dev/null || echo 0)
              [ "$l" = "0" ] || [ "$BL" = "0" ] && return
              if [ "$l" -ge "$BL" ]; then d=$((l - BL)); else d=$((BL - l)); fi
              t=$((BL / 10)); [ "$t" -lt 30 ] && t=30
              [ "$d" -ge "$t" ] && echo "$h"; }
            export -f chk; export SCAN_USER_AGENT
            head -400 /tmp/wordlists/dns_5k.txt 2>/dev/null | while IFS= read -r w; do
              [ -z "$w" ] && continue; chk "$w" "${w}.${target}" >> "$RD/subdomains/wildcard_filtered.txt" &
              done; wait
          else
            echo "🔍 DNS brute (capped 240s)..."
            [ -s /tmp/wordlists/dns_5k.txt ] && timeout 240 bash -c "sed \"s/\\\$/.${target}/\" /tmp/wordlists/dns_5k.txt | dnsx -silent -a -cname -resp -t 200 | awk '{print \$1}'" > "$RD/subdomains/dns_brute.txt" 2>>"$RD/logs/dnsx.log" || true
          fi
          cat "$RD"/subdomains/*.txt 2>/dev/null | tr -d '\r' | sed 's/^\*\.//' \
            | grep -iE "\.${target}\$|^${target}\$" | tr '[:upper:]' '[:lower:]' | sort -u > /tmp/raw_subs.txt
          [ -s /tmp/raw_subs.txt ] && timeout 240 bash -c 'cat /tmp/raw_subs.txt | dnsx -silent -resp -a -t 200 | awk "{print \$1}" | sort -u' > "$RD/subdomains/resolved.txt" 2>>"$RD/logs/dnsx.log" || touch "$RD/subdomains/resolved.txt"
          cut -d' ' -f1 "$RD/subdomains/resolved.txt" 2>/dev/null | sort -u -o "$RD/subdomains/resolved.txt"
          if [ -s "$RD/subdomains/resolved.txt" ] && command -v alterx >/dev/null 2>&1; then
            timeout 180 bash -c "alterx -l '$RD/subdomains/resolved.txt' -silent | dnsx -silent -resp -a -t 200 | awk '{print \$1}' | sort -u" > "$RD/subdomains/permutations_resolved.txt" 2>>"$RD/logs/alterx.log" || touch "$RD/subdomains/permutations_resolved.txt"
          else touch "$RD/subdomains/permutations_resolved.txt"; fi
          cat "$RD/subdomains/resolved.txt" "$RD/subdomains/permutations_resolved.txt" 2>/dev/null | grep -v '^\s*$' | sort -u > "$RD/subdomains/all_subs.txt" || true
          total=$(wc -l < "$RD/subdomains/all_subs.txt" 2>/dev/null || echo 0)
          echo "✅ DNS-confirmed subdomains: $total"
          if [ "$total" -eq 0 ]; then
            raw=$(wc -l < /tmp/raw_subs.txt 2>/dev/null || echo 0)
            echo "::warning::0 DNS-confirmed from $raw raw candidates — resolver failure, NOT a clean target."
            echo "0 subdomains were DNS-confirmed although $raw raw names existed. Do NOT read a clean report as 'secure'." > "$RD/meta/scan_health_warning.txt"
          fi

      - name: "🌐 ASN/CIDR Discovery"
        continue-on-error: true
        timeout-minutes: 5
        run: |
          export PATH="/tmp/toolbin:$PATH"; RD="results/$TIMESTAMP"
          : > "$RD/subdomains/asn_cidrs.txt"
          if [ -n "$PDCP_API_KEY" ] && command -v asnmap >/dev/null 2>&1; then
            export PDCP_API_KEY
            timeout 60 asnmap -d "$TARGET" -silent -o "$RD/subdomains/asn_cidrs.txt" 2>>"$RD/logs/asnmap.log" || true
            echo "✅ CIDR ranges: $(wc -l < "$RD/subdomains/asn_cidrs.txt")"
          else echo "ℹ️ asnmap skipped (no key)"; fi

      - name: "🌐 HTTP Probing (httpx)"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          export PATH="/tmp/toolbin:$PATH"; RD="results/$TIMESTAMP"
          [ -s "$RD/subdomains/all_subs.txt" ] || { echo "no subs — skip"; exit 0; }
          withtor httpx -l "$RD/subdomains/all_subs.txt" -json -silent -follow-redirects \
            -title -status-code -tech-detect -cdn -ip -cname -websocket \
            -threads 40 -rate-limit 60 -timeout 8 -retries 1 \
            -H "User-Agent: $SCAN_USER_AGENT" -o "$RD/live/live.json" 2>>"$RD/logs/httpx.log" || true
          [ -s "$RD/live/live.json" ] || {
            echo "httpx returned zero live hosts — check logs/httpx.log (likely egress or dead hosts)." >> "$RD/meta/scan_health_warning.txt"
            echo "::warning::0 live hosts"; exit 0; }
          jq -r '.url' "$RD/live/live.json" | sort -u > "$RD/live/urls.txt"
          jq -r '.host' "$RD/live/live.json" | sort -u > "$RD/live/hosts.txt"
          jq -r '.tech[]?' "$RD/live/live.json" 2>/dev/null | sort | uniq -c | sort -rn > "$RD/meta/tech.txt"
          jq -r 'select(.cdn==true) | .host' "$RD/live/live.json" 2>/dev/null | sort -u > "$RD/meta/cdn_hosts.txt"
          jq -r '[.url, (.status_code|tostring), (.title // "-"), ((.tech // [])|join(","))] | @tsv' "$RD/live/live.json" > "$RD/live/httpx.tsv"
          echo "✅ Live hosts: $(wc -l < "$RD/live/urls.txt")"; head -15 "$RD/meta/tech.txt"

      - name: "🛡️ WAF Detection"
        if: ${{ env.ENABLE_WAF_BYPASS == 'true' }}
        continue-on-error: true
        timeout-minutes: 6
        run: |
          RD="results/$TIMESTAMP"; [ -s "$RD/live/urls.txt" ] || exit 0
          : > "$RD/waf_bypass/waf.txt"
          head -"${MODE_CORSY_HOSTS:-30}" "$RD/live/urls.txt" | while IFS= read -r u; do
            wafw00f "$u" 2>/dev/null | grep -iE "is behind|waf" >> "$RD/waf_bypass/waf.txt" || true
          done
          [ -s "$RD/waf_bypass/waf.txt" ] && cat "$RD/waf_bypass/waf.txt" || echo "ℹ️ No WAF signatures"

      - name: "🔗 URL Collection"
        continue-on-error: true
        timeout-minutes: 20
        run: |
          export PATH="/tmp/toolbin:$PATH"; RD="results/$TIMESTAMP"; target="$TARGET"
          timeout 120 waybackurls "$target" > "$RD/urls/wayback.txt" 2>/dev/null || true
          timeout 150 gau --threads 5 "$target" > "$RD/urls/gau.txt" 2>/dev/null || true
          if [ -s "$RD/live/urls.txt" ]; then
            withtor timeout 300 katana -list "$RD/live/urls.txt" -d "${MODE_KATANA_DEPTH:-3}" -jc -c 20 -silent > "$RD/urls/katana.txt" 2>>"$RD/logs/katana.log" || true
          fi
          : > "$RD/urls/hakrawler.txt"
          head -20 "$RD/live/urls.txt" 2>/dev/null | while IFS= read -r u; do
            withtor timeout 60 hakrawler -u "$u" -depth "${MODE_KATANA_DEPTH:-3}" -insecure -plain 2>/dev/null | head -200 >> "$RD/urls/hakrawler.txt" || true
          done
          cat "$RD"/urls/*.txt 2>/dev/null | grep -oE 'https?://[^[:space:]"'"'"'<>]+' | sort -u > "$RD/urls/all_urls.txt"
          uro < "$RD/urls/all_urls.txt" > "$RD/urls/uro.txt" 2>/dev/null || cp "$RD/urls/all_urls.txt" "$RD/urls/uro.txt"
          for p in xss ssrf redirect takeovers potential sqli; do
            gf "$p" < "$RD/urls/all_urls.txt" > "$RD/urls/gf_${p}.txt" 2>/dev/null || : > "$RD/urls/gf_${p}.txt"
          done
          echo "✅ Unique URLs: $(wc -l < "$RD/urls/all_urls.txt")"

      - name: "📜 JS & Secrets Analysis"
        continue-on-error: true
        timeout-minutes: 25
        run: |
          export PATH="/tmp/toolbin:$PATH"; RD="results/$TIMESTAMP"
          mkdir -p "$RD/js/files"
          grep -iE '\.js($|\?)' "$RD/urls/all_urls.txt" 2>/dev/null | head -"${MODE_JS_FILES:-600}" | while IFS= read -r u; do
            fn="$RD/js/files/$(echo "$u" | md5sum | cut -d' ' -f1).js"
            withtor curl -s --max-time 15 -A "$SCAN_USER_AGENT" "$u" -o "$fn" 2>/dev/null || true
            [ -s "$fn" ] || rm -f "$fn"
          done
          echo "✅ JS files: $(ls "$RD/js/files" | wc -l)"
          python3 /tmp/LinkFinder/linkfinder.py -i "$RD/js/files" -o cli 2>/dev/null | sort -u > "$RD/js/endpoints_raw.txt" || true
          python3 /tmp/SecretFinder/SecretFinder.py -i "$RD/js/files" -o cli 2>/dev/null > "$RD/js/secrets.txt" || true
          trufflehog filesystem --directory "$RD/js/files" --only-verified 2>/dev/null | head -100 > "$RD/js/secrets_trufflehog.txt" || true
          grep -iE 'graphql|graphiql' "$RD/js/endpoints_raw.txt" 2>/dev/null | sort -u > "$RD/graphql/endpoints.txt" || true
          echo "✅ endpoints: $(wc -l < "$RD/js/endpoints_raw.txt") | secrets: $(wc -l < "$RD/js/secrets.txt")"

      - name: "🗺️ Source Map Analysis"
        if: ${{ env.ENABLE_SOURCE_MAPS == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          RD="results/$TIMESTAMP"
          python3 << 'PYEOF'
          import os, re, json, urllib.request
          RD = "results/" + os.environ["TIMESTAMP"]; UA = os.environ["SCAN_USER_AGENT"]
          js = os.path.join(RD, "js", "files")
          secret_re = re.compile(r'(api[_-]?key|secret|token|password|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z\-_]{35}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY)', re.I)
          maps, findings = [], []
          for fn in os.listdir(js) if os.path.isdir(js) else []:
              try: body = open(os.path.join(js, fn), encoding="utf-8", errors="ignore").read()
              except Exception: continue
              m = re.search(r'sourceMappingURL=(\S+\.map)', body[-2000:])
              if not m: continue
              maps.append(m.group(1))
              try:
                  req = urllib.request.Request(m.group(1), headers={"User-Agent": UA})
                  data = json.loads(urllib.request.urlopen(req, timeout=15).read().decode("utf-8", "replace"))
              except Exception: continue
              findings.append(f"EXPOSED MAP: {m.group(1)} sources={len(data.get('sources', []))}")
              for sc in data.get("sourcesContent", []) or []:
                  if sc:
                      mm = secret_re.search(sc)
                      if mm: findings.append(f"SECRET-IN-SOURCEMAP: {m.group(1)} :: {mm.group(0)[:40]}")
          open(os.path.join(RD, "source_maps", "exposed_maps.txt"), "w").write("\n".join(maps))
          open(os.path.join(RD, "source_maps", "findings.txt"), "w").write("\n".join(findings))
          print(f"maps: {len(maps)}, findings: {len(findings)}")
          PYEOF

      - name: "🔍 GraphQL Probe"
        continue-on-error: true
        timeout-minutes: 6
        run: |
          export PATH="/tmp/toolbin:$PATH"; RD="results/$TIMESTAMP"
          [ -s "$RD/live/hosts.txt" ] || exit 0
          : > /tmp/gql.txt
          head -30 "$RD/live/hosts.txt" | while IFS= read -r h; do
            for p in /graphql /graphiql /v1/graphql /api/graphql; do echo "https://${h}${p}" >> /tmp/gql.txt; done
          done
          cat "$RD/graphql/endpoints.txt" 2>/dev/null >> /tmp/gql.txt; sort -u /tmp/gql.txt -o /tmp/gql.txt
          withtor httpx -l /tmp/gql.txt -status-code -silent -mc 200,400,405 \
            -H "User-Agent: $SCAN_USER_AGENT" -o "$RD/graphql/live.txt" 2>>"$RD/logs/httpx.log" || true
          echo "✅ GraphQL candidates: $(wc -l < "$RD/graphql/live.txt" 2>/dev/null || echo 0)"

      - name: "📤 Upload Recon Artifact"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: zt-recon-${{ env.TIMESTAMP }}
          path: results/${{ env.TIMESTAMP }}
          retention-days: 7

  # ===========================================================================
  # LANE 2 — ATTACK (nuclei / dalfox / subzy / crlfuzz / corsy)
  # ===========================================================================
  scan_attack:
    name: "⚔️ Vuln Scan - ${{ inputs.target }}"
    runs-on: ubuntu-latest
    needs: [recon]
    timeout-minutes: 300
    steps:
      - name: "📥 Checkout (for local action)"
        uses: actions/checkout@v4
      - name: "⚡ Setup Go"
        uses: actions/setup-go@v5
        with: { go-version: "stable", cache: false }
      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: "⬇️ Download Recon Data"
        uses: actions/download-artifact@v4
        with: { name: zt-recon-${{ env.TIMESTAMP }}, path: dl }
      - name: "🧲 Bootstrap (profile + env)"
        run: |
          RD="results/$TIMESTAMP"; mkdir -p "$RD"
          cp -a dl/. "$RD"/ 2>/dev/null || cp -a "dl/$TIMESTAMP/." "$RD"/ 2>/dev/null || true
          [ -f "$RD/meta/profile.env" ] || { echo "::error::profile.env missing from recon artifact"; exit 1; }
          grep -E '^(TARGET|HUNTING_MODE|MODE_)' "$RD/meta/profile.env" | while IFS= read -r l; do
            echo "$l" >> "$GITHUB_ENV"
          done
          echo "WEEKKEY=$(date -u +%G-W%V)" >> "$GITHUB_ENV"
          echo "✅ TARGET=$TARGET | mode=$HUNTING_MODE"

      - name: "🧅 Tor Setup"
        uses: ./.github/actions/tor-setup
        continue-on-error: true

      - name: "📦 Deps"
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          pip3 install -q requests pysocks 2>&1 | tail -1
          [ -d /tmp/Corsy ] || git clone --depth 1 https://github.com/s0md3v/Corsy.git /tmp/Corsy 2>/dev/null || true
          pip3 install -q -r /tmp/Corsy/requirements.txt 2>/dev/null || true

      - name: "🗄️ Tool Cache"
        id: toolbin
        uses: actions/cache@v4
        with: { path: /tmp/toolbin, key: toolbin-attack-${{ env.WEEKKEY }}, restore-keys: toolbin-attack- }
      - name: "🗄️ Nuclei Templates Cache"
        id: ntpl
        uses: actions/cache@v4
        with: { path: ~/nuclei-templates, key: nuclei-tpl-v3-${{ env.WEEKKEY }}, restore-keys: nuclei-tpl-v3- }

      - name: "📦 Install Attack Tools"
        run: |
          mkdir -p /tmp/toolbin
          export GOBIN=/tmp/toolbin PATH="/tmp/toolbin:/usr/local/bin:$PATH"
          echo "/tmp/toolbin" >> "$GITHUB_PATH"
          : > /tmp/tool_install.log
          pd () { local bin="$1" repo="$2" ver="$3" mp="$4"
            [ -x "/tmp/toolbin/$bin" ] && return 0
            local f="${bin}_${ver#v}_linux_amd64.zip"
            if curl -sL --max-time 120 -o "/tmp/$f" "https://github.com/$repo/releases/download/$ver/$f" 2>>/tmp/tool_install.log \
               && unzip -oq "/tmp/$f" -d /tmp/pdtmp 2>>/tmp/tool_install.log \
               && mv "/tmp/pdtmp/$bin" "/tmp/toolbin/$bin" 2>>/tmp/tool_install.log; then
              chmod +x "/tmp/toolbin/$bin"; echo "✅ $bin (binary)"
            else go install "$mp@$ver" 2>>/tmp/tool_install.log && echo "✅ $bin (go)" || echo "⚠️ $bin FAILED"; fi; }
          pd nuclei "projectdiscovery/nuclei" v3.8.0 "github.com/projectdiscovery/nuclei/v3/cmd/nuclei"
          ig () { command -v "$1" >/dev/null 2>&1 && return 0
                  go install "$2" 2>>/tmp/tool_install.log && echo "✅ $1" || echo "⚠️ $1 FAILED"; }
          ig dalfox  "github.com/hahwul/dalfox/v2@latest"
          ig subzy   "github.com/PentestPad/subzy@latest"
          ig crlfuzz "github.com/dwisiswant0/crlfuzz/cmd/crlfuzz@latest"
          command -v nuclei >/dev/null 2>&1 || { echo "::error::nuclei is critical — aborting lane"; exit 1; }
          nuclei -update-templates 2>&1 | tail -1 || true
          echo "✅ attack toolchain ready"

      - name: "🗄️ Save Tool Cache"
        if: steps.toolbin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: /tmp/toolbin, key: toolbin-attack-${{ env.WEEKKEY }} }
      - name: "🗄️ Save Templates Cache"
        if: steps.ntpl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: ~/nuclei-templates, key: nuclei-tpl-v3-${{ env.WEEKKEY }} }

      - name: "☢️ Nuclei (staged by mode)"
        continue-on-error: true
        timeout-minutes: 200
        run: |
          export PATH="/tmp/toolbin:$PATH"; RD="results/$TIMESTAMP"
          [ -s "$RD/live/urls.txt" ] || { echo "no live hosts — nuclei skipped"; exit 0; }
          : "${MODE_NUCLEI_RL:=120}"; : "${MODE_NUCLEI_CONC:=25}"; : "${MODE_NUCLEI_TAGS:=cve,exposures,misconfig,takeover}"; : "${MODE_NUCLEI_S1_TIMEOUT:=2400}"
          COMMON=(-l "$RD/live/urls.txt" -j -silent -rl "$MODE_NUCLEI_RL" -c "$MODE_NUCLEI_CONC"
                  -timeout 8 -retries 1 -etags intrusive,destructive
                  -H "User-Agent: $SCAN_USER_AGENT" -stats -si 120)
          echo "🚀 Stage 1: tags=$MODE_NUCLEI_TAGS (${MODE_NUCLEI_S1_TIMEOUT}s cap)"
          withtor timeout "$MODE_NUCLEI_S1_TIMEOUT" nuclei "${COMMON[@]}" -tags "$MODE_NUCLEI_TAGS" \
            -o "$RD/nuclei/stage1.jsonl" 2>>"$RD/logs/nuclei.log" || true
          if [ "$HUNTING_MODE" = "aggressive" ]; then
            echo "🚀 Stage 2 (aggressive): full set, medium+"
            withtor timeout 5400 nuclei "${COMMON[@]}" -severity medium,high,critical \
              -o "$RD/nuclei/stage2.jsonl" 2>>"$RD/logs/nuclei.log" || true
          fi
          if [ -n "$AUTH_HEADER" ] || [ -n "$AUTH_COOKIE" ]; then
            echo "🚀 Stage 3: authenticated (exposures/misconfig, medium+)"
            AA=(); [ -n "$AUTH_HEADER" ] && AA+=(-H "$AUTH_HEADER")
            [ -n "$AUTH_COOKIE" ] && AA+=(-H "Cookie: $AUTH_COOKIE")
            withtor timeout 1200 nuclei "${COMMON[@]}" "${AA[@]}" \
              -tags exposures,misconfig,panel -severity medium,high,critical \
              -o "$RD/nuclei/stage_auth.jsonl" 2>>"$RD/logs/nuclei.log" || true
          fi
          cat "$RD"/nuclei/stage*.jsonl 2>/dev/null > "$RD/nuclei/results.jsonl" || true
          echo "✅ nuclei matches: $(wc -l < "$RD/nuclei/results.jsonl")"

      - name: "⚡ XSS (dalfox)"
        continue-on-error: true
        timeout-minutes: 25
        run: |
          export PATH="/tmp/toolbin:$PATH"; RD="results/$TIMESTAMP"
          [ -s "$RD/urls/gf_xss.txt" ] || { echo "no XSS candidates"; exit 0; }
          : "${MODE_DALFOX_URLS:=400}"
          head -"$MODE_DALFOX_URLS" "$RD/urls/gf_xss.txt" > /tmp/dalfox_targets.txt
          timeout 900 bash -c 'cat /tmp/dalfox_targets.txt | withtor dalfox pipe' \
            > "$RD/xss/dalfox_raw.txt" 2>"$RD/logs/dalfox.log" || true
          grep -E '^\[(V|G|F)\]|PoC|Vulnerable|Reflected' "$RD/xss/dalfox_raw.txt" 2>/dev/null | head -200 > "$RD/xss/dalfox.txt" || true
          echo "✅ XSS findings: $(wc -l < "$RD/xss/dalfox.txt")"

      - name: "💀 Takeover (subzy)"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          export PATH="/tmp/toolbin:$PATH"; RD="results/$TIMESTAMP"
          [ -s "$RD/live/urls.txt" ] || exit 0
          withtor timeout 420 subzy run --targets "$RD/live/urls.txt" 2>/dev/null \
            | grep -vi "not vulnerable" > "$RD/takeover/subzy.txt" || true
          echo "✅ takeover: $(wc -l < "$RD/takeover/subzy.txt")"

      - name: "↩️ CRLF (crlfuzz)"
        continue-on-error: true
        timeout-minutes: 8
        run: |
          export PATH="/tmp/toolbin:$PATH"; RD="results/$TIMESTAMP"
          [ -s "$RD/live/urls.txt" ] || exit 0
          withtor timeout 300 crlfuzz run -l "$RD/live/urls.txt" 2>/dev/null > "$RD/crlf/crlf.txt" || true
          echo "✅ crlf: $(grep -c . "$RD/crlf/crlf.txt")"

      - name: "🧭 CORS (Corsy)"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          RD="results/$TIMESTAMP"
          [ -d /tmp/Corsy ] && [ -s "$RD/live/urls.txt" ] || exit 0
          : "${MODE_CORSY_HOSTS:=30}"
          : > "$RD/cors/corsy.txt"
          head -"$MODE_CORSY_HOSTS" "$RD/live/urls.txt" | while IFS= read -r u; do
            timeout 60 python3 /tmp/Corsy/corsy.py -u "$u" 2>/dev/null >> "$RD/cors/corsy.txt" || true
          done
          echo "✅ cors: $(wc -l < "$RD/cors/corsy.txt")"

      - name: "📤 Upload Attack Artifact"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: zt-attack-${{ env.TIMESTAMP }}
          path: results/${{ env.TIMESTAMP }}
          retention-days: 7

  # ===========================================================================
  # LANE 3 — CONTENT (naabu / git exposure / ffuf / wpscan / gowitness)
  # ===========================================================================
  scan_content:
    name: "🧭 Content & Ports - ${{ inputs.target }}"
    runs-on: ubuntu-latest
    needs: [recon]
    timeout-minutes: 240
    steps:
      - name: "📥 Checkout (for local action)"
        uses: actions/checkout@v4
      - name: "⚡ Setup Go"
        uses: actions/setup-go@v5
        with: { go-version: "stable", cache: false }
      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: "⬇️ Download Recon Data"
        uses: actions/download-artifact@v4
        with: { name: zt-recon-${{ env.TIMESTAMP }}, path: dl }
      - name: "🧲 Bootstrap (profile + env)"
        run: |
          RD="results/$TIMESTAMP"; mkdir -p "$RD"
          cp -a dl/. "$RD"/ 2>/dev/null || cp -a "dl/$TIMESTAMP/." "$RD"/ 2>/dev/null || true
          [ -f "$RD/meta/profile.env" ] || { echo "::error::profile.env missing"; exit 1; }
          grep -E '^(TARGET|HUNTING_MODE|MODE_)' "$RD/meta/profile.env" | while IFS= read -r l; do
            echo "$l" >> "$GITHUB_ENV"
          done
          echo "WEEKKEY=$(date -u +%G-W%V)" >> "$GITHUB_ENV"
          echo "✅ TARGET=$TARGET | mode=$HUNTING_MODE"

      - name: "🧅 Tor Setup"
        uses: ./.github/actions/tor-setup
        continue-on-error: true

      - name: "📦 Deps"
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq libpcap-dev

      - name: "🗄️ Tool Cache"
        id: toolbin
        uses: actions/cache@v4
        with: { path: /tmp/toolbin, key: toolbin-content-${{ env.WEEKKEY }}, restore-keys: toolbin-content- }
      - name: "🗄️ Wordlist Cache"
        id: wordlists
        uses: actions/cache@v4
        with: { path: /tmp/wordlists, key: wordlists-v2-${{ env.WEEKKEY }}, restore-keys: wordlists-v2- }

      - name: "📦 Install Content Tools"
        run: |
          mkdir -p /tmp/toolbin /tmp/wordlists
          export GOBIN=/tmp/toolbin PATH="/tmp/toolbin:/usr/local/bin:$PATH"
          echo "/tmp/toolbin" >> "$GITHUB_PATH"
          : > /tmp/tool_install.log
          pd () { local bin="$1" repo="$2" ver="$3" mp="$4"
            [ -x "/tmp/toolbin/$bin" ] && return 0
            local f="${bin}_${ver#v}_linux_amd64.zip"
            if curl -sL --max-time 120 -o "/tmp/$f" "https://github.com/$repo/releases/download/$ver/$f" 2>>/tmp/tool_install.log \
               && unzip -oq "/tmp/$f" -d /tmp/pdtmp 2>>/tmp/tool_install.log \
               && mv "/tmp/pdtmp/$bin" "/tmp/toolbin/$bin" 2>>/tmp/tool_install.log; then
              chmod +x "/tmp/toolbin/$bin"; echo "✅ $bin (binary)"
            else go install "$mp@$ver" 2>>/tmp/tool_install.log && echo "✅ $bin (go)" || echo "⚠️ $bin FAILED"; fi; }
          pd httpx "projectdiscovery/httpx" v1.6.8 "github.com/projectdiscovery/httpx/cmd/httpx"
          pd naabu "projectdiscovery/naabu"  v2.6.1 "github.com/projectdiscovery/naabu/v2/cmd/naabu"
          command -v ffuf >/dev/null 2>&1 || go install github.com/ffuf/ffuf/v2@v2.1.0 2>>/tmp/tool_install.log || echo "⚠️ ffuf FAILED"
          if [ "${MODE_GOWITNESS:-0}" != "0" ] && ! command -v gowitness >/dev/null 2>&1; then
            curl -sL -o /tmp/toolbin/gowitness "https://github.com/sensepost/gowitness/releases/download/3.0.3/gowitness-3.0.3-linux-amd64" 2>>/tmp/tool_install.log \
              && chmod +x /tmp/toolbin/gowitness || echo "⚠️ gowitness FAILED (non-critical)"
          fi
          [ -s /tmp/wordlists/raft_medium.txt ] || curl -sL --max-time 60 \
            "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/raft-medium-directories.txt" \
            -o /tmp/wordlists/raft_medium.txt || true
          command -v httpx >/dev/null 2>&1 || { echo "::error::httpx critical — aborting lane"; exit 1; }
          echo "✅ content toolchain ready"

      - name: "🗄️ Save Tool Cache"
        if: steps.toolbin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: /tmp/toolbin, key: toolbin-content-${{ env.WEEKKEY }} }
      - name: "🗄️ Save Wordlist Cache"
        if: steps.wordlists.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: /tmp/wordlists, key: wordlists-v2-${{ env.WEEKKEY }} }

      - name: "🔌 Port Scan (naabu)"
        if: ${{ env.HUNTING_MODE != 'light' }}
        continue-on-error: true
        timeout-minutes: 12
        run: |
          export PATH="/tmp/toolbin:$PATH"; RD="results/$TIMESTAMP"
          : "${MODE_NAABU_PORTS:=100}"; : "${MODE_NAABU_HOSTS:=20}"
          [ "${MODE_NAABU_PORTS}" = "none" ] || [ "${MODE_NAABU_HOSTS}" = "0" ] && { echo "skipped by mode"; exit 0; }
          [ -s "$RD/live/hosts.txt" ] || exit 0
          head -"$MODE_NAABU_HOSTS" "$RD/live/hosts.txt" > /tmp/naabu_targets.txt
          sudo timeout 480 naabu -l /tmp/naabu_targets.txt -top-ports "$MODE_NAABU_PORTS" \
            -rate 1000 -c 25 -silent -o "$RD/ports/naabu.txt" 2>>"$RD/logs/naabu.log" || true
          echo "✅ open ports: $(grep -c ':' "$RD/ports/naabu.txt" 2>/dev/null || echo 0)"

      - name: "📂 Info Disclosure (git/env/backups)"
        if: ${{ env.ENABLE_GIT_EXPOSURE == 'true' }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          export PATH="/tmp/toolbin:$PATH"; RD="results/$TIMESTAMP"
          [ -s "$RD/live/urls.txt" ] || exit 0
          : > /tmp/id_probe.txt
          head -50 "$RD/live/urls.txt" | while IFS= read -r u; do
            for p in /.git/HEAD /.git/config /.env /.DS_Store /.svn/entries /backup.zip /db.sql /dump.sql /.htaccess /debug; do
              echo "${u}${p}" >> /tmp/id_probe.txt
            done
          done
          withtor httpx -l /tmp/id_probe.txt -status-code -content-length -silent -mc 200 \
            -H "User-Agent: $SCAN_USER_AGENT" -o "$RD/info_disclosure/hits.txt" 2>>"$RD/logs/httpx.log" || true
          : > "$RD/info_disclosure/git_exposure.txt"
          while IFS= read -r hit; do
            case "$hit" in
              *".git/HEAD"*) c=$(withtor curl -s --max-time 10 -A "$SCAN_USER_AGENT" "$hit" 2>/dev/null | head -2)
                echo "$c" | grep -q "ref:" && echo "CONFIRMED .git: $hit" >> "$RD/info_disclosure/git_exposure.txt" ;;
              *".git/config"*) c=$(withtor curl -s --max-time 10 -A "$SCAN_USER_AGENT" "$hit" 2>/dev/null | head -3)
                echo "$c" | grep -qE "\[core\]|\[remote" && echo "CONFIRMED git config: $hit" >> "$RD/info_disclosure/git_exposure.txt" ;;
            esac
          done < "$RD/info_disclosure/hits.txt" 2>/dev/null || true
          echo "✅ hits: $(wc -l < "$RD/info_disclosure/hits.txt") | confirmed: $(wc -l < "$RD/info_disclosure/git_exposure.txt")"

      - name: "🚀 Content Discovery (ffuf)"
        continue-on-error: true
        timeout-minutes: 40
        run: |
          export PATH="/tmp/toolbin:$PATH"; RD="results/$TIMESTAMP"
          [ -s "$RD/live/urls.txt" ] && [ -s /tmp/wordlists/raft_medium.txt ] || { echo "skip"; exit 0; }
          : "${MODE_FFUF_HOSTS:=5}"
          mkdir -p "$RD/files"
          head -"$MODE_FFUF_HOSTS" "$RD/live/urls.txt" | while IFS= read -r u; do
            host=$(echo "$u" | sed 's|https\?://||; s|/.*||; s|:.*||')
            out="$RD/files/ffuf_${host//./_}.json"
            withtor timeout 420 ffuf -w /tmp/wordlists/raft_medium.txt -u "${u}/FUZZ" \
              -ac -t 40 -mc 200,204,301,302,307,401,403 -of json -o "$out" \
              -H "User-Agent: $SCAN_USER_AGENT" 2>>"$RD/logs/ffuf.log" || true
            [ -s "$out" ] && { echo "✅ $host: $(jq '.results|length' "$out" 2>/dev/null) paths"
              jq -r '.results[] | "\(.status) \(.url)"' "$out" 2>/dev/null | sort -u > "${out%.json}.txt"; }
          done

      - name: "📂 WordPress (only if WP detected)"
        if: ${{ env.HUNTING_MODE != 'light' }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          RD="results/$TIMESTAMP"
          grep -qi wordpress "$RD/meta/tech.txt" 2>/dev/null || { echo "ℹ️ no WordPress — skip"; exit 0; }
          sudo apt-get install -y -qq ruby-full >/dev/null 2>&1
          sudo gem install wpscan --no-document >/dev/null 2>&1 || { echo "⚠️ wpscan gem failed"; exit 0; }
          : > "$RD/targeted/wpscan.txt"
          head -3 "$RD/live/urls.txt" | while IFS= read -r u; do
            timeout 240 wpscan --url "$u" --no-banner --random-user-agent --no-update 2>/dev/null | head -80 >> "$RD/targeted/wpscan.txt" || true
          done

      - name: "📸 Screenshots (aggressive only)"
        if: ${{ env.HUNTING_MODE == 'aggressive' }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          export PATH="/tmp/toolbin:$PATH"; RD="results/$TIMESTAMP"
          : "${MODE_GOWITNESS:=0}"; [ "$MODE_GOWITNESS" = "0" ] && exit 0
          command -v gowitness >/dev/null 2>&1 || { echo "gowitness missing"; exit 0; }
          command -v google-chrome >/dev/null 2>&1 || {
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb 2>/dev/null \
              && sudo dpkg -i /tmp/chrome.deb 2>/dev/null && sudo apt-get -f install -y -qq 2>/dev/null || true; }
          head -"$MODE_GOWITNESS" "$RD/live/urls.txt" > /tmp/gw.txt
          mkdir -p "$RD/files/screenshots"
          withtor gowitness screenshot file -f /tmp/gw.txt --screenshot-path "$RD/files/screenshots" \
            2>>"$RD/logs/gowitness.log" || echo "⚠️ gowitness failed (non-critical)"

      - name: "📤 Upload Content Artifact"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: zt-content-${{ env.TIMESTAMP }}
          path: results/${{ env.TIMESTAMP }}
          retention-days: 7

  # ===========================================================================
  # LANE 4 — REPORT (AI / SARIF / Discord / diff) — runs even if a scan lane failed
  # ===========================================================================
  report:
    name: "📊 Report - ${{ inputs.target }}"
    runs-on: ubuntu-latest
    needs: [recon, scan_attack, scan_content]
    if: ${{ !cancelled() && needs.recon.result == 'success' }}
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      security-events: write
    outputs:
      run_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      finding_count: ${{ steps.count_findings.outputs.finding_count }}
      artifact_name: "results-${{ env.TIMESTAMP }}-${{ env.TARGET }}"
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: "⬇️ Download All Lane Artifacts"
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: dl
          pattern: zt-
          merge-multiple: true

      - name: "🧲 Merge Results Tree"
        run: |
          RD="results/$TIMESTAMP"; mkdir -p "$RD" "$RD/logs" "$RD/meta"
          if [ -d dl/subdomains ]; then cp -a dl/. "$RD"/
          elif [ -d "dl/$TIMESTAMP/subdomains" ]; then cp -a "dl/$TIMESTAMP/." "$RD"/
          else echo "::error::No lane artifacts found — nothing to report"; exit 1; fi
          # defensive profile defaults
          [ -f "$RD/meta/profile.env" ] || { echo "TARGET=$TARGET"; echo "HUNTING_MODE=$HUNTING_MODE"; } > "$RD/meta/profile.env"
          echo "SNAPSHOT_KEY=snapshot-v3-${TARGET}-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "✅ merged tree: $(find "$RD" -type f | wc -l) files"

      - name: "🤖 AI Helper"
        run: |
          cat > /tmp/ai_helper.py <<'PYEOF'
          import argparse, json, os, sys, time, urllib.request, urllib.error
          MAX_CTX = 60000
          TIMEOUT = int(os.environ.get("AI_TIMEOUT_SECS", "120"))
          MAX_TOKENS = int(os.environ.get("AI_MAX_TOKENS", "4000"))
          def pref(env, *d):
              out = [os.environ[env]] if os.environ.get(env) else []
              out += [x for x in d if x]; return out
          PREFERRED = {
              "anthropic":  pref("ANTHROPIC_MODEL_NAME", "claude-sonnet-4-5", "claude-sonnet-4-20250514", "claude-3-5-sonnet-latest"),
              "openrouter": pref("OPENROUTER_MODEL_NAME", "openrouter/auto", os.environ.get("OPENROUTER_FREE_MODEL_NAME", "openrouter/free")),
              "groq":       pref("GROQ_MODEL_NAME", "llama-3.3-70b-versatile", "openai/gpt-oss-120b", "llama-3.1-8b-instant"),
              "gemini":     pref("GEMINI_MODEL_NAME", "gemini-2.5-flash", "gemini-2.0-flash"),
              "openai":     pref("OPENAI_MODEL_NAME", "gpt-4.1-mini", "gpt-4o-mini", "gpt-4o"),
              "cerebras":   pref("CEREBRAS_MODEL_NAME", "llama-3.3-70b", "gpt-oss-120b"),
              "tokenrouter":pref("TOKENROUTER_MODEL_NAME", "moonshotai/kimi-k2-instruct"),
          }
          KEYS = {"anthropic":"ANTHROPIC_API_KEY","openrouter":"OPENROUTER_API_KEY","groq":"GROQ_API_KEY",
                  "gemini":"GEMINI_API_KEY","openai":"OPENAI_API_KEY","cerebras":"CEREBRAS_API_KEY","tokenrouter":"TOKENROUTER_API_KEY"}
          BASES = {"openrouter":"https://openrouter.ai/api/v1","groq":"https://api.groq.com/openai/v1",
                   "openai":"https://api.openai.com/v1","cerebras":"https://api.cerebras.ai/v1",
                   "tokenrouter":os.environ.get("TOKENROUTER_BASE_URL","https://api.tokenrouter.com")}
          def req_json(url, headers, payload=None, timeout=TIMEOUT):
              data = json.dumps(payload).encode() if payload is not None else None
              r = urllib.request.Request(url, data=data, headers=headers, method="POST" if data else "GET")
              with urllib.request.urlopen(r, timeout=timeout) as resp:
                  return json.loads(resp.read().decode("utf-8", "replace"), strict=False)
          def discover(p):
              try:
                  if p == "anthropic":
                      d = req_json("https://api.anthropic.com/v1/models",
                                   {"x-api-key": os.environ[KEYS[p]], "anthropic-version": "2023-06-01"}, timeout=15)
                      return [m.get("id") for m in d.get("data", [])]
                  if p == "gemini":
                      d = req_json("https://generativelanguage.googleapis.com/v1beta/models",
                                   {"x-goog-api-key": os.environ[KEYS[p]]}, timeout=15)
                      return [m.get("name","").replace("models/","") for m in d.get("models", [])]
                  b = BASES[p].rstrip("/")
                  if not b.endswith("/v1"): b += "/v1"
                  d = req_json(b + "/models", {"Authorization": "Bearer " + os.environ[KEYS[p]]}, timeout=15)
                  return [m.get("id") for m in d.get("data", [])]
              except Exception as e:
                  print(f"[ai] {p} discovery failed ({e})"); return []
          def candidates(p):
              disc = discover(p); lst = list(PREFERRED[p])
              if p == "openrouter": lst += sorted(m for m in disc if ":free" in m)[:5]
              for m in disc:
                  if m not in lst: lst.append(m)
              seen, out = set(), []
              for m in lst:
                  if m and m not in seen: seen.add(m); out.append(m)
              return out[:12]
          def chat(p, model, prompt):
              if p == "anthropic":
                  d = req_json("https://api.anthropic.com/v1/messages",
                               {"x-api-key": os.environ[KEYS[p]], "anthropic-version": "2023-06-01", "content-type": "application/json"},
                               {"model": model, "max_tokens": MAX_TOKENS, "messages": [{"role": "user", "content": prompt}]})
                  return "".join(b.get("text","") for b in d.get("content", []) if b.get("type") == "text")
              if p == "gemini":
                  d = req_json(f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent",
                               {"x-goog-api-key": os.environ[KEYS[p]], "content-type": "application/json"},
                               {"contents": [{"parts": [{"text": prompt}]}],
                                "generationConfig": {"temperature": 0, "maxOutputTokens": MAX_TOKENS}})
                  return "".join(pp.get("text","") for c in d.get("candidates", []) for pp in c.get("content", {}).get("parts", []))
              b = BASES[p].rstrip("/")
              if not b.endswith("/v1"): b += "/v1"
              d = req_json(b + "/chat/completions",
                           {"Authorization": "Bearer " + os.environ[KEYS[p]], "content-type": "application/json"},
                           {"model": model, "messages": [{"role": "user", "content": prompt}], "temperature": 0, "max_tokens": MAX_TOKENS})
              return d["choices"][0]["message"]["content"]
          def main():
              a = argparse.ArgumentParser()
              a.add_argument("--phase", required=True); a.add_argument("--prompt-file", required=True)
              a.add_argument("--context-file"); a.add_argument("--out", required=True); a.add_argument("--json", action="store_true")
              args = a.parse_args()
              prompt = open(args.prompt_file, encoding="utf-8", errors="replace").read()
              if args.context_file and os.path.exists(args.context_file):
                  ctx = open(args.context_file, encoding="utf-8", errors="replace").read()
                  if len(ctx) > MAX_CTX: ctx = ctx[:MAX_CTX] + "\n...[TRUNCATED]"
                  prompt += "\n\n--- SCAN CONTEXT (automated output) ---\n" + ctx
              order = [p.strip() for p in os.environ.get("AI_PROVIDER_ORDER","").split(",") if p.strip()]
              for provider in order:
                  if not os.environ.get(KEYS.get(provider, "")): continue
                  for model in candidates(provider):
                      for attempt, backoff in ((1, 3), (2, 8)):
                          try:
                              print(f"[ai] {args.phase}: {provider}/{model} (attempt {attempt})")
                              text = chat(provider, model, prompt)
                              if text and text.strip():
                                  open(args.out, "w").write(text)
                                  if args.json:
                                      t = text.strip()
                                      if t.startswith("```"): t = t.split("```")[1].lstrip("json\n")
                                      dec = json.JSONDecoder()
                                      for i, ch in enumerate(t):
                                          if ch in "{[":
                                              try:
                                                  obj, _ = dec.raw_decode(t[i:])
                                                  json.dump(obj, open(args.out + ".json", "w"), indent=2)
                                              except ValueError: pass
                                              break
                                  print(f"[ai] {args.phase}: OK via {provider}/{model}")
                                  return
                          except urllib.error.HTTPError as e:
                              if e.code in (401, 403): print(f"[ai] {provider}: key rejected"); break
                              if e.code == 404: print(f"[ai] {provider}/{model}: model missing — next"); break
                              if e.code == 429: time.sleep(20); continue
                              print(f"[ai] {provider}/{model}: HTTP {e.code}")
                          except Exception as e:
                              print(f"[ai] {provider}/{model}: {e}")
                          time.sleep(backoff)
              open(args.out, "w").write("SKIPPED — all AI providers failed or no key configured.\n")
              print(f"[ai] {args.phase}: SKIPPED")
          main()
          PYEOF
          echo "✅ AI helper ready"

      - name: "🤖 AI Phases (1→6)"
        continue-on-error: true
        timeout-minutes: 40
        run: |
          RD="results/$TIMESTAMP"; AI="$RD/ai_agent"; mkdir -p "$AI"
          f () { [ -f "$RD/$1" ] || : > "$RD/$1"; }
          f live/httpx.tsv; f nuclei/results.jsonl; f info_disclosure/git_exposure.txt
          f takeover/subzy.txt; f crlf/crlf.txt; f xss/dalfox.txt; f cors/corsy.txt
          f js/endpoints_raw.txt; f js/secrets.txt; f js/secrets_trufflehog.txt
          f source_maps/findings.txt; f graphql/live.txt; f meta/tech.txt
          f subdomains/asn_cidrs.txt; f ports/naabu.txt; f waf_bypass/waf.txt
          f urls/all_urls.txt; f live/urls.txt; f subdomains/all_subs.txt
          {
            echo "== ASSETS =="; echo "target: $TARGET | mode: $HUNTING_MODE"
            echo "subs: $(wc -l < "$RD/subdomains/all_subs.txt") live: $(wc -l < "$RD/live/urls.txt")"
            echo "== TECH =="; head -25 "$RD/meta/tech.txt"
            echo "== LIVE (sample) =="; head -100 "$RD/live/httpx.tsv"
            echo "== ASN =="; head -20 "$RD/subdomains/asn_cidrs.txt"
            echo "== PORTS =="; head -60 "$RD/ports/naabu.txt"; echo "== WAF =="; cat "$RD/waf_bypass/waf.txt"
          } > /tmp/ctx1.txt
          {
            echo "== JS ENDPOINTS =="; head -600 "$RD/js/endpoints_raw.txt"
            echo "== SECRETS =="; head -150 "$RD/js/secrets.txt"
            echo "== TRUFFLEHOG =="; head -50 "$RD/js/secrets_trufflehog.txt"
            echo "== SOURCEMAPS =="; head -50 "$RD/source_maps/findings.txt"; echo "== GQL =="; head -30 "$RD/graphql/live.txt"
          } > /tmp/ctx2.txt
          {
            echo "== NUCLEI =="; head -c 20000 "$RD/nuclei/results.jsonl"
            echo; echo "== GIT EXPOSURE =="; cat "$RD/info_disclosure/git_exposure.txt"
            echo "== TAKEOVER =="; head -30 "$RD/takeover/subzy.txt"; echo "== CRLF =="; head -20 "$RD/crlf/crlf.txt"
            echo "== XSS =="; head -40 "$RD/xss/dalfox.txt"; echo "== CORS =="; head -60 "$RD/cors/corsy.txt"
          } > /tmp/ctx3.txt
          {
            echo "== ASN =="; cat "$RD/subdomains/asn_cidrs.txt"; echo "== CDN =="; head -50 "$RD/meta/cdn_hosts.txt" 2>/dev/null
            echo "== PORTS =="; cat "$RD/ports/naabu.txt"; echo "== TECH =="; head -25 "$RD/meta/tech.txt"
          } > /tmp/ctx4.txt
          printf '%s' "You are a senior bug bounty recon analyst. From this asset inventory identify: (1) highest-value attack-surface targets and why, (2) risky technology combinations, (3) likely weak spots for prioritized testing, (4) what recon is missing. Reference actual hostnames. Clean markdown." > /tmp/p1
          printf '%s' "You are a JS/secrets triage analyst. Classify each secret-looking string: real credential vs placeholder vs public key. List JS endpoints most worth active testing (auth, admin, debug, old versions). Never invent findings. Clean markdown." > /tmp/p2
          printf '%s' "You are a vulnerability triage analyst. From raw scanner output produce STRICT JSON only (no prose, no fences): an array of objects with keys title, severity (critical|high|medium|low), confidence (0-1), false_positive_risk (str), reasoning (str), next_step (str). Only real items. Deduplicate." > /tmp/p3
          printf '%s' "You are an infrastructure security analyst. Given ASN/CIDR, CDN, ports, tech: assess exposed services that should not be public, non-standard ports, CDN/WAF coverage gaps, possible origin-IP leaks. Concrete. Clean markdown." > /tmp/p4
          printf '%s' "You are a bug bounty strategist. Given prior analysis and raw context, produce a prioritized roadmap: next 5-10 concrete actions with expected impact and effort, doable by one operator today. Clean markdown." > /tmp/p5
          printf '%s' "You are an executive report writer. Produce: (1) 10-line plain-language executive summary, (2) top 5 actions by impact, (3) honest statement on scan completeness and visible tooling failures. Clean markdown." > /tmp/p6
          ctx5=/tmp/ctx5.txt; : > "$ctx5"
          for x in 01_attack_surface 02_js_secrets 04_infrastructure; do
            [ -s "$AI/$x.md" ] && { echo "== $x =="; head -c 7000 "$AI/$x.md"; echo; } >> "$ctx5"; done
          head -c 8000 /tmp/ctx3.txt >> "$ctx5"
          ctx6=/tmp/ctx6.txt; : > "$ctx6"
          for x in "$AI"/*.md; do [ -s "$x" ] && { echo "== $(basename "$x") =="; head -c 4000 "$x"; echo; } >> "$ctx6"; done 2>/dev/null || true
          python3 /tmp/ai_helper.py --phase 01_attack_surface --prompt-file /tmp/p1 --context-file /tmp/ctx1.txt --out "$AI/01_attack_surface.md"
          python3 /tmp/ai_helper.py --phase 02_js_secrets      --prompt-file /tmp/p2 --context-file /tmp/ctx2.txt --out "$AI/02_js_secrets.md"
          python3 /tmp/ai_helper.py --phase 03_vuln_triage     --prompt-file /tmp/p3 --context-file /tmp/ctx3.txt --out "$AI/03_vuln_triage.md" --json
          python3 /tmp/ai_helper.py --phase 04_infrastructure  --prompt-file /tmp/p4 --context-file /tmp/ctx4.txt --out "$AI/04_infrastructure.md"
          python3 /tmp/ai_helper.py --phase 05_roadmap         --prompt-file /tmp/p5 --context-file "$ctx5"      --out "$AI/05_roadmap.md"
          python3 /tmp/ai_helper.py --phase 06_executive       --prompt-file /tmp/p6 --context-file "$ctx6"      --out "$AI/06_executive.md"
          echo "✅ AI phases done"

      - name: "📊 Consolidate + SARIF"
        id: count_findings
        continue-on-error: true
        run: |
          RD="results/$TIMESTAMP"
          python3 << 'PYEOF'
          import json, os
          RD = "results/" + os.environ["TIMESTAMP"]
          order = {"critical":0,"high":1,"medium":2,"low":3,"info":4,"unknown":5}
          findings = []
          try:
              for line in open(os.path.join(RD,"nuclei","results.jsonl"), encoding="utf-8", errors="replace"):
                  try: d = json.loads(line)
                  except Exception: continue
                  findings.append({"rule": d.get("template-id") or d.get("templateID") or "?",
                                   "name": (d.get("info") or {}).get("name","?"),
                                   "severity": ((d.get("info") or {}).get("severity") or "unknown").lower(),
                                   "location": d.get("matched-at") or d.get("matchedAt") or d.get("host") or "?"})
          except FileNotFoundError: pass
          def cf(p):
              fp = os.path.join(RD, p)
              return sum(1 for _ in open(fp, encoding="utf-8", errors="replace")) if os.path.exists(fp) else 0
          extra = {"js_secrets": cf("js/secrets.txt"), "secrets_verified": cf("js/secrets_trufflehog.txt"),
                   "sourcemaps": cf("source_maps/findings.txt"), "git_exposure": cf("info_disclosure/git_exposure.txt"),
                   "takeover": cf("takeover/subzy.txt"), "crlf": cf("crlf/crlf.txt"),
                   "xss": cf("xss/dalfox.txt"), "cors": cf("cors/corsy.txt")}
          findings.sort(key=lambda x: order.get(x["severity"], 9))
          counts = {}
          for x in findings: counts[x["severity"]] = counts.get(x["severity"], 0) + 1
          total = len(findings) + sum(v for k, v in extra.items() if k != "cors")
          L = ["# ☢️ Nuclei Summary", "", f"**{len(findings)} findings** — " +
               "  ".join(f"{s}:{c}" for s,c in sorted(counts.items(), key=lambda kv: order.get(kv[0],9))), "",
               "| Severity | Name | Location |", "|---|---|---|"]
          for x in findings[:100]: L.append(f"| {x['severity']} | {x['name'][:70]} | {x['location'][:80]} |")
          if len(findings) > 100: L.append(f"| ... | (+{len(findings)-100} more in results.jsonl) | |")
          L += ["", "## Other Sources", ""] + [f"- {k}: {v}" for k, v in extra.items()]
          open(os.path.join(RD, "nuclei", "summary.md"), "w").write("\n".join(L))
          lvl = {"critical":"error","high":"error","medium":"warning","low":"warning","info":"note"}
          rules, results, seen = [], [], set()
          for x in findings[:1000]:
              if x["rule"] in seen: continue
              seen.add(x["rule"])
              rules.append({"id": x["rule"], "shortDescription": {"text": x["name"][:200]}})
              results.append({"ruleId": x["rule"], "ruleIndex": len(rules)-1, "level": lvl.get(x["severity"],"note"),
                              "message": {"text": f"[{x['severity']}] {x['name']}"},
                              "locations": [{"physicalLocation": {"artifactLocation": {"uri": x["location"]}}}]})
          sarif = {"$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
                   "version": "2.1.0",
                   "runs": [{"tool": {"driver": {"name": "nuclei", "informationUri": "https://github.com/projectdiscovery/nuclei", "rules": rules}}, "results": results}]}
          json.dump(sarif, open(os.path.join(RD, "nuclei", "results.sarif"), "w"), indent=1)
          with open("/tmp/zt.env", "w") as f:
              f.write(f"finding_count={total}\ncritical={counts.get('critical',0)+extra['git_exposure']}\n")
              f.write(f"sarif_ready={'true' if findings else 'false'}\nartifact_name=results-{os.environ['TIMESTAMP']}-{os.environ['TARGET']}\n")
          print(f"TOTAL: {total} | nuclei: {len(findings)} | extra: {extra}")
          PYEOF
          [ -s /tmp/zt.env ] && cat /tmp/zt.env >> "$GITHUB_OUTPUT"

      - name: "📤 Upload SARIF to Security Tab"
        if: ${{ steps.count_findings.outputs.sarif_ready == 'true' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results/${{ env.TIMESTAMP }}/nuclei/results.sarif
          category: nuclei

      - name: "🆕 Diff vs Previous Run"
        continue-on-error: true
        run: |
          RD="results/$TIMESTAMP"
          python3 << 'PYEOF'
          import hashlib, os
          RD = "results/" + os.environ["TIMESTAMP"]
          def sig(p, src):
              fp = os.path.join(RD, p)
              if not os.path.exists(fp): return []
              out = []
              for line in open(fp, encoding="utf-8", errors="replace"):
                  line = line.strip()
                  if line and "SKIPPED" not in line:
                      out.append(f"{src}|{hashlib.sha1(line.encode()).hexdigest()[:12]}|{line[:120]}")
              return out
          cur = sum((sig(p, s) for p, s in [("nuclei/results.jsonl","nuclei"),("js/secrets.txt","secret"),
              ("js/secrets_trufflehog.txt","secret"),("info_disclosure/git_exposure.txt","disclosure"),
              ("takeover/subzy.txt","takeover"),("xss/dalfox.txt","xss"),("crlf/crlf.txt","crlf")]), [])
          cur = sorted(set(cur))
          open(os.path.join(RD, "meta", "findings.sig"), "w").write("\n".join(cur))
          prev = os.path.join(".previous_snapshot", "findings.sig")
          new = cur
          if os.path.exists(prev):
              p = set(open(prev, encoding="utf-8", errors="replace").read().splitlines())
              new = [c for c in cur if c not in p]
          open(os.path.join(RD, "meta", "new_findings.txt"), "w").write("\n".join(c.split("|",2)[2] for c in new))
          print(f"signature: {len(cur)} total | {len(new)} NEW")
          PYEOF

      - name: "📄 Build Final Report + Job Summary"
        continue-on-error: true
        run: |
          RD="results/$TIMESTAMP"
          python3 << 'PYEOF'
          import os, datetime
          RD = "results/" + os.environ["TIMESTAMP"]; env = os.environ
          def wc(p):
              fp = os.path.join(RD, p)
              return sum(1 for _ in open(fp, encoding="utf-8", errors="replace")) if os.path.exists(fp) else 0
          def cat(p, cap=3000):
              fp = os.path.join(RD, p)
              if not os.path.exists(fp): return ""
              t = open(fp, encoding="utf-8", errors="replace").read()
              return (t[:cap] + "\n...[truncated]") if len(t) > cap else t
          L = [f"# 🎯 Zero Track Report — {env['TARGET']}",
               f"*run {env['TIMESTAMP']} · mode: {env['HUNTING_MODE']} · generated {datetime.datetime.utcnow():%Y-%m-%d %H:%M} UTC*", ""]
          hw = cat("meta/scan_health_warning.txt")
          if hw: L += ["## ⚠️ SCAN HEALTH WARNING", "", hw, ""]
          L += ["## 📊 Assets", "", "| Metric | Value |", "|---|---|",
                f"| Subdomains | {wc('subdomains/all_subs.txt')} |",
                f"| Live hosts | {wc('live/urls.txt')} |",
                f"| URLs | {wc('urls/all_urls.txt')} |",
                f"| Open ports | {wc('ports/naabu.txt')} |", ""]
          for title, path in [("☢️ Nuclei","nuclei/summary.md"),("📂 Disclosure","info_disclosure/git_exposure.txt"),
                              ("💀 Takeover","takeover/subzy.txt"),("⚡ XSS","xss/dalfox.txt"),("↩️ CRLF","crlf/crlf.txt"),
                              ("🧭 CORS","cors/corsy.txt"),("📜 Secrets","js/secrets.txt"),
                              ("🗺️ SourceMaps","source_maps/findings.txt"),("🔍 GraphQL","graphql/live.txt")]:
              b = cat(path)
              if b.strip(): L += [f"## {title}", "", "```", b, "```", ""]
          ai = os.path.join(RD, "ai_agent")
          if os.path.isdir(ai):
              for f in sorted(os.listdir(ai)):
                  if f.endswith(".md"):
                      b = cat(f"ai_agent/{f}", 6000)
                      if b and "SKIPPED" not in b[:60]: L += [f"## 🤖 {f[:-3].replace('_',' ').title()}", "", b, ""]
                      elif b: L += [f"## 🤖 {f[:-3]} — skipped (no AI provider)", ""]
          nf = cat("meta/new_findings.txt", 2000)
          if nf.strip(): L += ["## 🆕 New vs Previous Run", "", "```", nf, "```", ""]
          report = "\n".join(L)
          open(os.path.join(RD, "REPORT.md"), "w").write(report)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
              f.write(report[:45000])
          print("✅ REPORT.md + summary")
          PYEOF

      - name: "🔔 Discord"
        if: ${{ env.DISCORD_NOTIFY == 'true' }}
        continue-on-error: true
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || { echo "no webhook"; exit 0; }
          python3 << 'PYEOF'
          import json, os, urllib.request
          env = os.environ; RD = "results/" + env["TIMESTAMP"]
          def wc(p):
              fp = os.path.join(RD, p)
              return sum(1 for _ in open(fp, encoding="utf-8", errors="replace")) if os.path.exists(fp) else 0
          new = []
          nf = os.path.join(RD, "meta", "new_findings.txt")
          if os.path.exists(nf):
              new = [l.strip() for l in open(nf, encoding="utf-8", errors="replace") if l.strip()][:12]
          embed = {"title": f"🎯 Zero Track — {env['TARGET']}",
                   "url": f"https://github.com/{env.get('GITHUB_REPOSITORY','')}/actions/runs/{env.get('GITHUB_RUN_ID','')}",
                   "color": 0xe74c3c if new else 0x2ecc71,
                   "fields": [{"name": k, "value": str(v), "inline": True} for k, v in [
                       ("Mode", env["HUNTING_MODE"]), ("Subs", wc("subdomains/all_subs.txt")),
                       ("Live", wc("live/urls.txt")), ("Nuclei", wc("nuclei/results.jsonl")),
                       ("NEW", len(new))]],
                   "description": ("**🆕 New findings:**\n" + "\n".join(f"• {n[:150]}" for n in new)) if new else "No new findings vs previous run."}
          req = urllib.request.Request(env["DISCORD_WEBHOOK"], data=json.dumps({"embeds": [embed]}).encode(),
                                       headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=15)
          print("✅ Discord notified")
          PYEOF

      - name: "🚨 GitHub Issue (critical only)"
        if: ${{ env.CREATE_ISSUE == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RD="results/$TIMESTAMP"
          [ -s "$RD/nuclei/results.jsonl" ] || exit 0
          crit=$(grep -c '"severity":"critical"' "$RD/nuclei/results.jsonl" 2>/dev/null || echo 0)
          high=$(grep -c '"severity":"high"' "$RD/nuclei/results.jsonl" 2>/dev/null || echo 0)
          gitexp=$(wc -l < "$RD/info_disclosure/git_exposure.txt" 2>/dev/null || echo 0)
          [ "$crit" -eq 0 ] && [ "$high" -eq 0 ] && [ "$gitexp" -eq 0 ] && { echo "ℹ️ no critical/high"; exit 0; }
          { echo "## Zero Track — \`${TARGET}\` (run ${TIMESTAMP})"
            echo "- Critical: $crit | High: $high | .git exposure: $gitexp"
            echo; echo '```'; head -40 "$RD/meta/new_findings.txt" 2>/dev/null; echo '```'; } > /tmp/issue.md
          gh issue create --title "🚨 Critical findings — $TARGET ($(date -u +%F))" \
            --body-file /tmp/issue.md 2>/dev/null || echo "⚠️ issue failed"

      - name: "🗄️ Snapshot Restore"
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .previous_snapshot
          key: ${{ env.SNAPSHOT_KEY }}
          restore-keys: snapshot-v3-${{ env.TARGET }}-
      - name: "🗄️ Snapshot Save"
        continue-on-error: true
        run: |
          RD="results/$TIMESTAMP"
          [ -f "$RD/meta/findings.sig" ] && mkdir -p .previous_snapshot \
            && cp "$RD/meta/findings.sig" .previous_snapshot/findings.sig || true
      - name: "🗄️ Persist Snapshot Cache"
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .previous_snapshot
          key: ${{ env.SNAPSHOT_KEY }}

      - name: "📦 Upload Final Artifact"
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ env.TIMESTAMP }}-${{ env.TARGET }}
          path: results/${{ env.TIMESTAMP }}
          retention-days: 30
          if-no-files-found: warn

      - name: "🏁 Done"
        run: |
          RD="results/$TIMESTAMP"
          echo "========================================"
          echo "🎯 Zero Track v3 — $TARGET"
          echo "   findings: ${{ steps.count_findings.outputs.finding_count || '0' }}"
          echo "   lanes:    recon=${{ needs.recon.result }} attack=${{ needs.scan_attack.result }} content=${{ needs.scan_content.result }}"
          echo "========================================"
          cat "$RD/meta/scan_health_warning.txt" 2>/dev/null || true
