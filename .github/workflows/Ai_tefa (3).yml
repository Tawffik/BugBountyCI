                          f"scan's traffic likely never reached the real application. **A clean result below should "
                          f"NOT be read as \"this target is secure\"** - it may simply mean the scanner was blocked. "
                          f"Manual verification from a different network/IP is recommended before drawing conclusions.\n\n---\n\n")
          elif int(total_hosts or "0") > 0:
              disclaimer=(f"## ✅ Scan Reliability\n\n{blocked_hosts}/{total_hosts} hosts ({block_pct}%) were "
                          f"blocked/challenged during recon - most traffic reached the real application.\n\n---\n\n")
          if not has or not providers:
              rpt=f"# Security Report: {target}\n**{datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')}**\n\n{disclaimer}## No Confirmed Vulnerabilities\nClean scan."
              os.makedirs(os.path.join(rd,"ai"),exist_ok=True)
              with open(os.path.join(rd,"ai","security_report.md"),"w") as f: f.write(rpt)
              print("📄 Clean report"); sys.exit(0)
          prompt=f"""Senior bug bounty hunter writing FINAL report for {target}.
          INJECTIONS:{inj}|XXE:{xxe}|GRAPHQL:{gql}|IDOR:{idor}|CHAIN:{chain}
          NUCLEI:{nuc}|CORS:{cors}|SENSITIVE:{sens}|TAKEOVER:{tako}
          Write professional report: # Executive Summary\n# Findings (ONLY confirmed)\n## [Severity] Title | Type: | URL: | Severity: | Steps: | PoC: | Impact: | Remediation: |\n# Chaining\n# Statistics\n# Top 5 Recommendations"""
          ok=False
          for p in providers:
              try:
                  print(f"  -> {p['name']}...")
                  res=call_with_retry(p, prompt)
                  text=p["extract"](res)
                  os.makedirs(os.path.join(rd,"ai"),exist_ok=True)
                  with open(os.path.join(rd,"ai","security_report.md"),"w") as f: f.write(f"# AI Security Report: {target}\n\n{disclaimer}{text}")
                  print(f"✅ Report ({len(text)} chars) via {p['name']}"); ok=True; break
              except Exception as e: print(f"⚠️ {p['name']}: {e}"); continue
          if not ok: print("❌ All providers failed for report")
          PYEOF

      - name: "🔢 Count Total Findings"
        id: count_findings
        if: always()
        continue-on-error: true
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          # NOTE: "grep -c PATTERN file || echo 0" is broken when there are zero matches:
          # grep -c still prints "0" to stdout but exits with status 1 (its "no match"
          # convention), so the "|| echo 0" ALSO fires, producing two lines ("0\n0") and
          # breaking the arithmetic below. Using "|| true" (prints nothing) plus a
          # ${VAR:-0} default (only used when the file is genuinely missing) avoids this.
          INJECT=$(grep -cE '\[(XSS|SSTI|SQLi|LFI|SSRF|Command|Redirect)\]' "$RD/ai_agent/injection_findings.txt" 2>/dev/null || true); INJECT=${INJECT:-0}
          XXE=$(grep -c '\[XXE\]' "$RD/ai_agent/xxe_findings.txt" 2>/dev/null || true); XXE=${XXE:-0}
          GQL=$(grep -c '\[GRAPHQL' "$RD/ai_agent/graphql_findings.txt" 2>/dev/null || true); GQL=${GQL:-0}
          IDOR=$(grep -c '\[IDOR\]' "$RD/ai_agent/idor_findings.txt" 2>/dev/null || true); IDOR=${IDOR:-0}
          NUCLEI=$(wc -l < "$RD/nuclei/findings.jsonl" 2>/dev/null || true); NUCLEI=${NUCLEI:-0}
          SENS=$(wc -l < "$RD/files/sensitive.txt" 2>/dev/null || true); SENS=${SENS:-0}
          CORS=$(wc -l < "$RD/cors/vulnerable.txt" 2>/dev/null || true); CORS=${CORS:-0}
          TOTAL=$(( INJECT + XXE + GQL + IDOR + NUCLEI + SENS + CORS ))
          GH=$(wc -l < "$RD/js/github_recon.txt" 2>/dev/null || true); GH=${GH:-0}
          VH=$(wc -l < "$RD/live/vhosts.txt" 2>/dev/null || true); VH=${VH:-0}
          BUCKETS=$(wc -l < "$RD/live/cloud_buckets.txt" 2>/dev/null || true); BUCKETS=${BUCKETS:-0}
          FUZZ=$(wc -l < "$RD/fuzzing/discovered.txt" 2>/dev/null || true); FUZZ=${FUZZ:-0}
          LEADS=$(( GH + VH + BUCKETS + FUZZ ))
          echo "finding_count=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "🔢 Total confirmed findings: $TOTAL"
          echo "🔎 Additional recon leads for manual review (not confirmed vulns): $LEADS (GitHub:$GH, VHosts:$VH, Buckets:$BUCKETS, Fuzzing:$FUZZ)"

      - name: "📦 Upload Toolchain Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ env.TIMESTAMP }}
          path: /tmp/toolbin/
          retention-days: 7
          if-no-files-found: ignore

      - name: "📤 Upload Results Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ env.TIMESTAMP }}-${{ env.TARGET }}
          path: results/${{ env.TIMESTAMP }}/
          retention-days: 30

      - name: "📣 Discord Notification"
        if: ${{ always() && inputs.discord_notify == true && env.DISCORD_WEBHOOK != '' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          SUBS=$(wc -l < "$RD/subdomains/all_subs.txt" 2>/dev/null || true); SUBS=${SUBS:-0}
          LIVE=$(wc -l < "$RD/live/live.txt" 2>/dev/null || true); LIVE=${LIVE:-0}
          INJECT=$(grep -cE '\[(XSS|SSTI|SQLi|LFI|SSRF|Command|Redirect)\]' "$RD/ai_agent/injection_findings.txt" 2>/dev/null || true); INJECT=${INJECT:-0}
          XXE=$(grep -c '\[XXE\]' "$RD/ai_agent/xxe_findings.txt" 2>/dev/null || true); XXE=${XXE:-0}
          GQL=$(grep -c '\[GRAPHQL' "$RD/ai_agent/graphql_findings.txt" 2>/dev/null || true); GQL=${GQL:-0}
          IDOR=$(grep -c '\[IDOR\]' "$RD/ai_agent/idor_findings.txt" 2>/dev/null || true); IDOR=${IDOR:-0}
          NUCLEI=$(wc -l < "$RD/nuclei/findings.jsonl" 2>/dev/null || true); NUCLEI=${NUCLEI:-0}
          SENS=$(wc -l < "$RD/files/sensitive.txt" 2>/dev/null || true); SENS=${SENS:-0}
          CORS=$(wc -l < "$RD/cors/vulnerable.txt" 2>/dev/null || true); CORS=${CORS:-0}
          TOTAL_AGENT=$(( INJECT + XXE + GQL + IDOR ))

          COLOR=5814783; TITLE="✅ Scan Complete"
          if [ "$TOTAL_AGENT" -gt 0 ] || [ "$SENS" -gt 0 ] || [ "$CORS" -gt 0 ]; then
            COLOR=15158332; TITLE="🚨 Vulnerabilities Found"
          elif [ "$NUCLEI" -gt 5 ]; then
            COLOR=16744192; TITLE="🔶 Findings Require Review"
          fi

          jq -n \
            --arg t "${{ env.TARGET }}" \
            --arg title "$TITLE" \
            --arg subs "$SUBS" \
            --arg live "$LIVE" \
            --arg inject "$INJECT" \
            --arg xxe "$XXE" \
            --arg gql "$GQL" \
            --arg idor "$IDOR" \
            --arg nuclei "$NUCLEI" \
            --arg sens "$SENS" \
            --arg cors "$CORS" \
            --arg run "${{ github.run_number }}" \
            --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson color "$COLOR" \
          '{
            username:"🎯 BugHunter AI",
            embeds:[{
              title:($title+": "+$t), color:$color, url:$url,
              fields:[
                {name:"🌐 Recon", value:("Subs: **"+$subs+"** | Live: **"+$live+"**"), inline:false},
                {name:"🧠 AI Agent", value:("Injections: **"+$inject+"** | XXE: **"+$xxe+"** | GraphQL: **"+$gql+"** | IDOR: **"+$idor+"**"), inline:false},
                {name:"🔓 Scanner", value:("Nuclei: **"+$nuclei+"** | Secrets: **"+$sens+"** | CORS: **"+$cors+"**"), inline:false},
                {name:"🔗 Results", value:("[View Run]("+$url+")"), inline:true}
              ],
              footer:{text:("Run #"+$run+" | Mode: ${{ env.HUNTING_MODE }} | AI Autonomous Hunter")}
            }]
          }' | curl -s -X POST "${{ env.DISCORD_WEBHOOK }}" -H "Content-Type: application/json" -d @- || true
