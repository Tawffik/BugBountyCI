      - name: "📋 AI Final Security Report"
        continue-on-error: true
        timeout-minutes: 8
        run: |
          RD="results/${{ env.TIMESTAMP }}"
          # Figure out how much of the scan traffic actually got through vs got
          # blocked/challenged by a WAF - a "0 findings" result is meaningless if
          # most requests never reached the real application in the first place.
          TOTAL_HOSTS=$(wc -l < "$RD/live/live.json" 2>/dev/null || true); TOTAL_HOSTS=${TOTAL_HOSTS:-0}
          BLOCKED_HOSTS=$(grep -ciE '"status_code":(403|429)|"title":"(attention required|just a moment|access denied|checking your browser)' "$RD/live/live.json" 2>/dev/null || true); BLOCKED_HOSTS=${BLOCKED_HOSTS:-0}
          UNRESPONSIVE_COUNT=$(grep -c "found unresponsive" "$RD/logs/nuclei.log" 2>/dev/null || true); UNRESPONSIVE_COUNT=${UNRESPONSIVE_COUNT:-0}
          BLOCK_PCT=0
          if [ "$TOTAL_HOSTS" -gt 0 ]; then
            BLOCK_PCT=$(awk "BEGIN{printf \"%.0f\", ($BLOCKED_HOSTS/$TOTAL_HOSTS)*100}")
          fi
          echo "📡 Scan confidence: $BLOCKED_HOSTS/$TOTAL_HOSTS hosts ($BLOCK_PCT%) returned WAF-block/challenge responses; nuclei marked $UNRESPONSIVE_COUNT host(s) unresponsive"
          export SCAN_BLOCK_PCT="$BLOCK_PCT"
          export SCAN_BLOCKED_HOSTS="$BLOCKED_HOSTS"
          export SCAN_TOTAL_HOSTS="$TOTAL_HOSTS"
          export SCAN_UNRESPONSIVE_COUNT="$UNRESPONSIVE_COUNT"
          python3 << 'PYEOF'
          import json, os, sys, urllib.request, urllib.error, re, datetime, time
          rd="results/"+os.environ.get("TIMESTAMP",""); target=os.environ.get("TARGET","")
          def call_with_retry(p, prompt, attempts=2, timeout=120, backoff=4):
              # Capture the ACTUAL response body on failure, not just the generic
              # "HTTP Error 400: Bad Request" - the body almost always contains the
              # real reason (invalid model, low credit balance, bad API key, etc.)
              # and without it we're debugging blind.
              last_err=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(p["url"],data=p["body_tpl"](prompt),headers=p["headers"],method="POST")
                      with urllib.request.urlopen(req,timeout=timeout) as r: return json.loads(r.read())
                  except urllib.error.HTTPError as e:
                      try: body_preview=e.read(400).decode(errors="ignore")
                      except Exception: body_preview=""
                      last_err=Exception(f"HTTP {e.code} -> {body_preview}")
                      if i < attempts-1:
                          # Respect Retry-After on 429s instead of always using the
                          # same short backoff - rate limits often need real time to clear.
                          wait=backoff
                          if e.code==429:
                              try: wait=min(int(e.headers.get("Retry-After",backoff)),30)
                              except Exception: wait=backoff
                          time.sleep(wait)
                  except Exception as e:
                      last_err=e
                      if i < attempts-1: time.sleep(backoff)
              raise last_err
          providers=[]
          if os.environ.get("ANTHROPIC_API_KEY",""): providers.append({"name":"Anthropic","url":"https://api.anthropic.com/v1/messages","headers":{"x-api-key":os.environ["ANTHROPIC_API_KEY"],"anthropic-version":"2023-06-01","content-type":"application/json"},"body_tpl":lambda p:json.dumps({"model":os.environ.get("ANTHROPIC_MODEL_NAME","claude-sonnet-4-20250514"),"max_tokens":8192,"messages":[{"role":"user","content":p}]}).encode(),"extract":lambda r:r["content"][0]["text"]})
          if os.environ.get("OPENROUTER_API_KEY",""): providers.append({"name":"OpenRouter","url":"https://openrouter.ai/api/v1/chat/completions","headers":{"Authorization":f"Bearer {os.environ['OPENROUTER_API_KEY']}","content-type":"application/json"},"body_tpl":lambda p:json.dumps({"model":os.environ.get("OPENROUTER_MODEL_NAME","anthropic/claude-sonnet-4"),"max_tokens":8192,"messages":[{"role":"user","content":p}]}).encode(),"extract":lambda r:r["choices"][0]["message"]["content"]})
          if os.environ.get("OPENROUTER_API_KEY",""): providers.append({"name":"OpenRouter (free)","url":"https://openrouter.ai/api/v1/chat/completions","headers":{"Authorization":f"Bearer {os.environ['OPENROUTER_API_KEY']}","content-type":"application/json"},"body_tpl":lambda p:json.dumps({"model":os.environ.get("OPENROUTER_FREE_MODEL_NAME","meta-llama/llama-3.3-70b-instruct:free"),"max_tokens":8192,"messages":[{"role":"user","content":p}]}).encode(),"extract":lambda r:r["choices"][0]["message"]["content"]})
          if os.environ.get("GROQ_API_KEY",""): providers.append({"name":"Groq","url":"https://api.groq.com/openai/v1/chat/completions","headers":{"Authorization":f"Bearer {os.environ['GROQ_API_KEY']}","content-type":"application/json"},"body_tpl":lambda p:json.dumps({"model":os.environ.get("GROQ_MODEL_NAME","llama3-70b-8192"),"max_tokens":8192,"messages":[{"role":"user","content":p}]}).encode(),"extract":lambda r:r["choices"][0]["message"]["content"]})
          if os.environ.get("GEMINI_API_KEY",""): providers.append({"name":"Gemini","url":f"https://generativelanguage.googleapis.com/v1beta/models/{os.environ.get('GEMINI_MODEL_NAME','gemini-2.5-flash')}:generateContent?key={os.environ['GEMINI_API_KEY']}","headers":{"content-type":"application/json"},"body_tpl":lambda p:json.dumps({"contents":[{"parts":[{"text":p}]}],"generationConfig":{"maxOutputTokens":8192}}).encode(),"extract":lambda r:r["candidates"][0]["content"]["parts"][0]["text"]})
          if os.environ.get("OPENAI_API_KEY",""): providers.append({"name":"OpenAI","url":"https://api.openai.com/v1/chat/completions","headers":{"Authorization":f"Bearer {os.environ['OPENAI_API_KEY']}","content-type":"application/json"},"body_tpl":lambda p:json.dumps({"model":os.environ.get("OPENAI_MODEL_NAME","gpt-5.5"),"max_tokens":8192,"messages":[{"role":"user","content":p}]}).encode(),"extract":lambda r:r["choices"][0]["message"]["content"]})
          def rf(path,cap=3000):
              try:
                  with open(os.path.join(rd,path)) as f: return f.read()[:cap]
              except: return "N/A"
          inj=rf("ai_agent/injection_findings.json",3000); xxe=rf("ai_agent/xxe_findings.txt"); gql=rf("ai_agent/graphql_findings.txt"); idor=rf("ai_agent/idor_findings.txt"); chain=rf("ai_agent/chained_analysis.json",2000); nuc=rf("nuclei/findings.jsonl",2000); cors=rf("cors/vulnerable.txt"); sens=rf("files/sensitive.txt"); tako=rf("nuclei/takeover.jsonl",1000)
          core=[inj,xxe,gql,idor,nuc,cors,sens]
          empty_markers=("N/A","","[]","No XXE findings","No GraphQL findings","No IDOR findings")
          has=any(v.strip() not in empty_markers for v in core)
          # This is written regardless of what the AI does or doesn't say, so a high
          # block-rate warning can never be silently dropped by a provider ignoring
          # instructions - the previous version relied entirely on the AI including it.
          block_pct=int(os.environ.get("SCAN_BLOCK_PCT","0") or "0")
          blocked_hosts=os.environ.get("SCAN_BLOCKED_HOSTS","0")
          total_hosts=os.environ.get("SCAN_TOTAL_HOSTS","0")
          unresponsive=os.environ.get("SCAN_UNRESPONSIVE_COUNT","0")
          disclaimer=""
          if block_pct >= 30:
              disclaimer=(f"## ⚠️ Scan Reliability Warning\n\n"
