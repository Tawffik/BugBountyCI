name: "🎯 Zero Track - AI Autonomous Hunter v2"

# ---------------------------------------------------------------------------
# CHANGES vs v1 (summary):
#  1. withtor wrapper: Go tools (httpx/nuclei/katana/ffuf/dalfox...) now REALLY
#     route through Tor via HTTP(S)_PROXY=socks5h:// (proxychains/LD_PRELOAD
#     never intercepted Go's raw syscalls). Verified at runtime by a compiled
#     Go probe. Non-target traffic (GitHub/PyPI/AI APIs) stays direct (NO_PROXY).
#  2. Tor failure = graceful degradation (TOR_OK=false) instead of killing the
#     whole job. Report records the anonymity status honestly.
#  3. Scope gate is FAIL-CLOSED: no scope.txt + no explicit confirm_open_scope
#     input => job refuses to run active scans.
#  4. Boolean inputs: `|| 'true'` inverted user intent (false || 'true' = true).
#     Now `!= false` for default-on toggles. Bash checks use == "true".
#  5. Rolling cache keys (weekly for tools/templates/wordlists, per-run for the
#     diff snapshot) — @latest tools no longer frozen forever by a static key.
#  6. hunting_mode now actually drives tool parameters (depth/tags/rate/limits).
#  7. AI: model auto-discovery via /models endpoints + real model names +
#     direct connection (AI providers block most Tor exits) + retries.
#  8. Security: concurrency guard per target, secrets never interpolated into
#     script text, critical-tool hard gate, SARIF + step summary + optional
#     GitHub issue, new optional secrets: CHAOS_API_KEY, SHODAN_API_KEY,
#     SUBFINDER_PROVIDER_CONFIG (biggest free subdomain coverage win).
#  9. Everything after "ASN/CIDR Discovery" is a RECONSTRUCTION (your original
#     file was cut off there) — diff it against your tail and re-apply your
#     own logic where it differs.
#
# TODO (manual, 5 minutes): pin third-party actions to commit SHAs:
#   gh api repos/actions/checkout/git/ref/tags/v4 --jq .object.sha
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target domain (e.g., example.com)"
        required: true
        type: string
      hunting_mode:
        description: "AI hunting intensity (light=fast, normal=balanced, aggressive=deep)"
        required: false
        default: "normal"
        type: choice
        options:
          - light
          - normal
          - aggressive
      discord_notify:
        description: "Send Discord notification"
        type: boolean
        default: true
      create_github_issue:
        description: "Create a GitHub issue when critical/high findings exist"
        type: boolean
        default: false
      confirm_open_scope:
        description: "REQUIRED only when scope.txt is absent: explicitly confirm this exact target is authorized for active security testing"
        type: boolean
        default: false
      enable_waf_bypass:
        description: "Enable WAF detection & bypass recon (Tor handles IP rotation when available)"
        type: boolean
        default: false
      enable_git_exposure:
        description: "Enable information disclosure scan (git, backups, configs)"
        type: boolean
        default: true
      enable_source_maps:
        description: "Enable source map analysis for JS files"
        type: boolean
        default: true

  workflow_call:
    inputs:
      target:
        required: true
        type: string
      hunting_mode:
        required: false
        default: "normal"
        type: string
      discord_notify:
        required: false
        default: true
        type: boolean
      create_github_issue:
        required: false
        default: false
        type: boolean
      confirm_open_scope:
        required: false
        default: false
        type: boolean
      enable_waf_bypass:
        required: false
        default: false
        type: boolean
      enable_git_exposure:
        required: false
        default: true
        type: boolean
      enable_source_maps:
        required: false
        default: true
        type: boolean
    secrets:
      DISCORD_WEBHOOK:
        description: "Discord webhook URL"
        required: false
      ANTHROPIC_API_KEY:
        description: "API key for Anthropic (Claude)"
        required: false
      OPENROUTER_API_KEY:
        description: "API key for OpenRouter (fallback)"
        required: false
      GROQ_API_KEY:
        description: "API key for Groq (fallback)"
        required: false
      GEMINI_API_KEY:
        description: "API key for Google Gemini (fallback)"
        required: false
      OPENAI_API_KEY:
        description: "API key for OpenAI (fallback)"
        required: false
      CEREBRAS_API_KEY:
        description: "API key for Cerebras (fallback)"
        required: false
      TOKENROUTER_API_KEY:
        description: "API key for TokenRouter (last fallback — base URL unverified, see env note)"
        required: false
      TOR_BRIDGE_LINES:
        description: >
          Optional. Real obfs4 bridge lines from bridges.torproject.org,
          one per line. Used as fallback when direct Tor is blocked.
        required: false
      PDCP_API_KEY:
        description: "ProjectDiscovery Cloud Platform key (enables asnmap ASN/CIDR discovery)"
        required: false
      AUTH_COOKIE:
        description: "Optional session cookie (e.g. 'session=abc123') to scan authenticated pages"
        required: false
      AUTH_HEADER:
        description: "Optional auth header (e.g. 'Authorization: Bearer xyz')"
        required: false
      CHAOS_API_KEY:
        description: "NEW: ProjectDiscovery Chaos key — free, massively increases subfinder subdomain coverage"
        required: false
      SHODAN_API_KEY:
        description: "NEW: Shodan key for subfinder provider coverage"
        required: false
      SUBFINDER_PROVIDER_CONFIG:
        description: "NEW: raw subfinder provider-config.yaml content (full control over all OSINT providers)"
        required: false
    outputs:
      run_url:
        description: "Link to the GitHub Actions run"
        value: ${{ jobs.full_scan.outputs.run_url }}
      finding_count:
        description: "Total findings count"
        value: ${{ jobs.full_scan.outputs.finding_count }}
      artifact_name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.full_scan.outputs.artifact_name }}

permissions:
  contents: read
  issues: write          # optional auto-issue for critical findings
  security-events: write # nuclei SARIF -> repo Security tab

# Never run two scans against the same target in parallel (WAF hammering + noise)
concurrency:
  group: zerotrack-${{ inputs.target }}
  cancel-in-progress: false

env:
  TARGET:             ${{ inputs.target }}
  HUNTING_MODE:       ${{ inputs.hunting_mode || 'normal' }}
  TIMESTAMP:          ${{ github.run_id }}-${{ github.run_number }}
  DISCORD_WEBHOOK:    ${{ secrets.DISCORD_WEBHOOK || '' }}
  ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY || '' }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
  GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY || '' }}
  GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY || '' }}
  OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY || '' }}
  CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_API_KEY || '' }}
  TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY || '' }}
  TOR_BRIDGE_LINES:   ${{ secrets.TOR_BRIDGE_LINES || '' }}
  PDCP_API_KEY:       ${{ secrets.PDCP_API_KEY || '' }}
  AUTH_COOKIE:        ${{ secrets.AUTH_COOKIE || '' }}
  AUTH_HEADER:        ${{ secrets.AUTH_HEADER || '' }}
  CHAOS_API_KEY:      ${{ secrets.CHAOS_API_KEY || '' }}
  SHODAN_API_KEY:     ${{ secrets.SHODAN_API_KEY || '' }}
  SUBFINDER_PROVIDER_CONFIG: ${{ secrets.SUBFINDER_PROVIDER_CONFIG || '' }}
  PYTHONUNBUFFERED:   "1"
  # Model names: first-choice per provider. The AI helper ALSO auto-discovers
  # the live /models list per provider, so a stale name here degrades to the
  # next available model instead of hard-failing (v1's claude-sonnet-5 /
  # gpt-5.5 / kimi-k3-free were 404s).
  ANTHROPIC_MODEL_NAME:       "claude-sonnet-4-5"
  OPENROUTER_MODEL_NAME:      "openrouter/auto"
  OPENROUTER_FREE_MODEL_NAME: "openrouter/free"
  GROQ_MODEL_NAME:            "llama-3.3-70b-versatile"
  GEMINI_MODEL_NAME:          "gemini-2.5-flash"
  OPENAI_MODEL_NAME:          "gpt-4.1-mini"
  CEREBRAS_MODEL_NAME:        "llama-3.3-70b"
  TOKENROUTER_BASE_URL:       "https://api.tokenrouter.com"   # unverified — from your dashboard
  TOKENROUTER_MODEL_NAME:     "moonshotai/kimi-k2-instruct"  # unverified gateway, last fallback only
  AI_MAX_TOKENS:              "4000"
  AI_TIMEOUT_SECS:            "120"
  AI_PROVIDER_ORDER:          "anthropic,openrouter,groq,gemini,openai,cerebras,tokenrouter"
  SCAN_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  # Boolean inputs: `!= false` keeps "on by default" while honoring an explicit
  # un-check (v1's `|| 'true'` made un-checking IMPOSSIBLE — false || 'true').
  DISCORD_NOTIFY:      ${{ inputs.discord_notify != false }}
  CREATE_ISSUE:        ${{ inputs.create_github_issue }}
  CONFIRM_OPEN_SCOPE:  ${{ inputs.confirm_open_scope }}
  ENABLE_WAF_BYPASS:   ${{ inputs.enable_waf_bypass }}
  ENABLE_GIT_EXPOSURE: ${{ inputs.enable_git_exposure != false }}
  ENABLE_SOURCE_MAPS:  ${{ inputs.enable_source_maps != false }}

defaults:
  run:
    shell: bash

jobs:
  full_scan:
    name: "🛡️ Full Autonomous Scan - ${{ inputs.target }}"
    runs-on: ubuntu-latest
    timeout-minutes: 358
    # Optional fork-abuse guard — uncomment and put YOUR owner/repo:
    # if: ${{ github.repository == 'YOUR_USERNAME/YOUR_REPO' }}
    outputs:
      run_url:       "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      finding_count: ${{ steps.count_findings.outputs.finding_count }}
      artifact_name: ${{ steps.count_findings.outputs.artifact_name }}

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4   # TODO: pin to commit SHA (see header comment)

      - name: "⚡ Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================================
      # AUTHORIZATION — now FAIL-CLOSED.
      # =========================================================================
      - name: "🔒 Verify Target Is In Authorized Scope"
        env:
          TARGET_INPUT: ${{ inputs.target }}
          CONFIRM: ${{ env.CONFIRM_OPEN_SCOPE }}
        run: |
          target="$(echo "${TARGET_INPUT}" | xargs)"
          if [[ ! -f "scope.txt" ]]; then
            if [[ "$CONFIRM" != "true" ]]; then
              echo "::error::No scope.txt in repo AND confirm_open_scope was not set."
              echo "   This pipeline sends active exploit payloads. Refusing to run."
              echo "   Fix: add scope.txt (one domain or *.domain per line), OR set the"
              echo "   'confirm_open_scope' input to true to explicitly attest authorization."
              exit 1
            fi
            echo "⚠️ OPEN SCOPE MODE (explicitly confirmed by caller): $target"
            exit 0
          fi
          target_lower="$(echo "$target" | tr '[:upper:]' '[:lower:]')"
          matched=0
          while IFS= read -r raw_line; do
            line="${raw_line%%#*}"; line="$(echo "$line" | xargs)"
            [[ -z "$line" ]] && continue
            ll="$(echo "$line" | tr '[:upper:]' '[:lower:]')"
            if [[ "$ll" == "$target_lower" ]]; then matched=1; break; fi
            if [[ "$ll" == \*.* ]]; then
              base="${ll:2}"
              if [[ "$target_lower" == *".$base" || "$target_lower" == "$base" ]]; then matched=1; break; fi
            fi
          done < scope.txt
          if [[ "$matched" != "1" ]]; then
            echo "::error::'$target' NOT in scope.txt. Refusing active/exploit steps."
            exit 1
          fi
          echo "✅ Target authorized: $target (matched scope.txt)"

      - name: "✅ Environment Validation"
        env:
          # secrets/env passed via env: — NEVER interpolated into script text
          # (v1 interpolated raw secrets into bash source = syntax-bomb risk).
          AI_KEYS_COMBINED: "x${{ secrets.ANTHROPIC_API_KEY }}${{ secrets.OPENROUTER_API_KEY }}${{ secrets.GROQ_API_KEY }}${{ secrets.GEMINI_API_KEY }}${{ secrets.OPENAI_API_KEY }}${{ secrets.CEREBRAS_API_KEY }}${{ secrets.TOKENROUTER_API_KEY }}"
        run: |
          FAILED=0
          target="$(echo "${TARGET:-}" | xargs)"
          if [ -z "$target" ]; then
            echo "❌ CRITICAL: target input is empty."
            FAILED=1
          else
            target="$(echo "$target" | tr '[:upper:]' '[:lower:]')"
            if ! echo "$target" | grep -qE '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'; then
              echo "❌ CRITICAL: '$target' does not look like a plain domain (no scheme, no path, no metacharacters)."
              FAILED=1
            else
              echo "TARGET=$target" >> "$GITHUB_ENV"
              echo "✅ target (normalized) = $target"
            fi
          fi
          if [ -z "${AI_KEYS_COMBINED:-x}" ] || [ "$AI_KEYS_COMBINED" = "x" ]; then
            echo "⚠️ No AI provider key at all — all 6 AI phases will be skipped. Add GROQ_API_KEY or GEMINI_API_KEY (both free)."
          else
            echo "✅ At least one AI provider key configured"
          fi
          [ "$FAILED" = "1" ] && { echo "::error::Environment validation failed."; exit 1; }
          true

      - name: "🎚️ Apply Hunting Mode Profile"
        run: |
          case "$HUNTING_MODE" in
            light)
              p="MODE_KATANA_DEPTH=2
                  MODE_NUCLEI_TAGS=exposures,misconfig,takeover
                  MODE_NUCLEI_RL=150
                  MODE_NUCLEI_CONC=20
                  MODE_NUCLEI_S1_TIMEOUT=1200
                  MODE_FFUF_HOSTS=3
                  MODE_DALFOX_URLS=100
                  MODE_JS_FILES=200
                  MODE_NAABU_PORTS=none
                  MODE_NAABU_HOSTS=0
                  MODE_GOWITNESS=0
                  MODE_CORSY_HOSTS=15"
              ;;
            aggressive)
              p="MODE_KATANA_DEPTH=5
                  MODE_NUCLEI_TAGS=cve,exposures,misconfig,takeover
                  MODE_NUCLEI_RL=80
                  MODE_NUCLEI_CONC=30
                  MODE_NUCLEI_S1_TIMEOUT=3600
                  MODE_FFUF_HOSTS=10
                  MODE_DALFOX_URLS=1500
                  MODE_JS_FILES=1500
                  MODE_NAABU_PORTS=1000
                  MODE_NAABU_HOSTS=40
                  MODE_GOWITNESS=25
                  MODE_CORSY_HOSTS=50"
              ;;
            *)
              p="MODE_KATANA_DEPTH=3
                  MODE_NUCLEI_TAGS=cve,exposures,misconfig,takeover
                  MODE_NUCLEI_RL=120
                  MODE_NUCLEI_CONC=25
                  MODE_NUCLEI_S1_TIMEOUT=2400
                  MODE_FFUF_HOSTS=5
                  MODE_DALFOX_URLS=400
                  MODE_JS_FILES=600
                  MODE_NAABU_PORTS=100
                  MODE_NAABU_HOSTS=20
                  MODE_GOWITNESS=0
                  MODE_CORSY_HOSTS=30"
              ;;
          esac
          echo "$p" | grep -oE 'MODE_[A-Z0-9_]+=[A-Za-z0-9,]+' | while IFS= read -r line; do
            echo "$line" >> "$GITHUB_ENV"
          done
          echo "✅ Profile applied: $HUNTING_MODE"

      - name: "📂 Prepare Workspace"
        run: |
          mkdir -p "results/$TIMESTAMP"/{subdomains,live,urls,js,graphql,nuclei,cors,files,ai,ai_agent,logs,cloud,waf_bypass,info_disclosure,source_maps,js_deep,targeted,ai_infra,ports,xss,crlf,takeover,meta}
          mkdir -p .previous_snapshot
          cp /tmp/tool_install.log "results/$TIMESTAMP/logs/" 2>/dev/null || true

      # =========================================================================
      # TOR — best-effort anonymity layer. Never fatal (v1 killed whole runs).
      # =========================================================================
      - name: "🧅 Setup Tor Proxy (best-effort, graceful degradation)"
        id: tor
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -uo pipefail
          echo "TOR_OK=false" >> "$GITHUB_OUTPUT"
          echo "TOR_OK=false" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y -qq tor proxychains4 obfs4proxy libffi-dev gcc python3-dev
          sudo mkdir -p /var/log/tor && sudo chown debian-tor:debian-tor /var/log/tor 2>/dev/null || true
          sudo bash -c 'cat > /etc/proxychains4.conf << EOF
          strict_chain
          proxy_dns
          remote_dns_subnet 224
          tcp_read_time_out 15000
          tcp_connect_time_out 8000
          [ProxyList]
          socks5 127.0.0.1 9050
          EOF'
          REAL_IP=$(curl -s --max-time 10 https://api.ipify.org || echo "unknown")
          echo "🌍 Real runner IP: $REAL_IP"

          write_torrc () {
            local mode="$1"
            sudo service tor stop 2>/dev/null || true
            sudo bash -c 'cat > /etc/tor/torrc << EOF
          Log notice file /var/log/tor/notices.log
          SocksPort 127.0.0.1:9050
          MaxCircuitDirtiness 10
          UseEntryGuards 0
          NumEntryGuards 3
          CircuitBuildTimeout 20
          LearnCircuitBuildTimeout 0
          ReducedConnectionPadding 1
          EOF'
            if [ "$mode" = "bridges" ] && [ -n "${TOR_BRIDGE_LINES:-}" ]; then
              echo "🌉 Configuring obfs4 bridges..."
              sudo bash -c 'cat >> /etc/tor/torrc << EOF
          UseBridges 1
          ClientTransportPlugin obfs4 exec /usr/bin/obfs4proxy
          EOF'
              echo "$TOR_BRIDGE_LINES" | while IFS= read -r line; do
                [ -z "$line" ] && continue
                sudo bash -c "echo 'Bridge $line' >> /etc/tor/torrc"
              done
            fi
            sudo service tor start
          }
          wait_for_bootstrap () {
            local max_wait_s="$1" waited=0
            while [ "$waited" -lt "$max_wait_s" ]; do
              if sudo grep -q "Bootstrapped 100%" /var/log/tor/notices.log 2>/dev/null; then
                echo "✅ Tor bootstrapped after ~${waited}s"; return 0
              fi
              sleep 3; waited=$((waited + 3))
            done
            echo "⚠️ No bootstrap within ${max_wait_s}s"; return 1
          }
          verify_tor_ip () {
            local svc attempt candidate
            for svc in "https://api.ipify.org" "https://ifconfig.me/ip" "https://icanhazip.com"; do
              for attempt in 1 2; do
                candidate=$(proxychains4 -q curl -s --max-time 12 "$svc" 2>/dev/null | tr -d '[:space:]')
                if [ -n "$candidate" ] && [ "$candidate" != "$REAL_IP" ]; then echo "$candidate"; return 0; fi
                sudo pkill -HUP -x tor 2>/dev/null || true
                sleep 4
              done
            done
            return 1
          }

          TOR_IP="unknown"
          echo "⏳ [1/3] Direct Tor..."
          write_torrc "direct"; wait_for_bootstrap 90 || true
          TOR_IP=$(verify_tor_ip || echo unknown)
          if [ "$TOR_IP" = "unknown" ]; then
            echo "⏳ [2/3] Fresh restart..."
            write_torrc "direct"; wait_for_bootstrap 90 || true
            TOR_IP=$(verify_tor_ip || echo unknown)
          fi
          if [ "$TOR_IP" = "unknown" ] && [ -n "${TOR_BRIDGE_LINES:-}" ]; then
            echo "⏳ [3/3] obfs4 bridges fallback..."
            write_torrc "bridges"; wait_for_bootstrap 120 || true
            TOR_IP=$(verify_tor_ip || echo unknown)
          fi
          if [ "$TOR_IP" = "unknown" ] || [ "$TOR_IP" = "$REAL_IP" ]; then
            echo "::warning::Tor unavailable — continuing WITHOUT anonymization. Scan quality is unaffected; origin IP will be the runner's."
            exit 0
          fi
          echo "🧅 Tor exit IP: $TOR_IP"

          # --- withtor wrapper: the REAL routing fix -------------------------
          # proxychains/LD_PRELOAD never intercepted Go tools (raw syscalls).
          # Go net/http, curl and python-requests all honor these env vars,
          # and socks5h:// forces REMOTE DNS through Tor.
          sudo tee /usr/local/bin/withtor >/dev/null <<'EOF'
          #!/usr/bin/env bash
          if [ "${TOR_OK:-false}" = "true" ]; then
            export HTTP_PROXY=socks5h://127.0.0.1:9050
            export HTTPS_PROXY=socks5h://127.0.0.1:9050
            export http_proxy=socks5h://127.0.0.1:9050
            export https_proxy=socks5h://127.0.0.1:9050
            export NO_PROXY="localhost,127.0.0.1,::1,api.github.com,github.com,raw.githubusercontent.com,objects.githubusercontent.com,githubusercontent.com,proxy.golang.org,storage.googleapis.com,pypi.org,files.pythonhosted.org,api.anthropic.com,api.openai.com,api.groq.com,openrouter.ai,generativelanguage.googleapis.com,api.cerebras.ai,api.tokenrouter.com,crt.sh,api.certspotter.com"
            export no_proxy="$NO_PROXY"
          fi
          exec "$@"
          EOF
          sudo chmod +x /usr/local/bin/withtor

          # --- Runtime proof that GO tools actually route through Tor --------
          cat > /tmp/go_proxy_probe.go <<'EOF'
          package main
          import ("fmt"; "io"; "net/http"; "os")
          func main() {
            resp, err := http.Get("https://api.ipify.org")
            if err != nil { fmt.Println("ERROR"); os.Exit(0) }
            defer resp.Body.Close()
            b, _ := io.ReadAll(io.LimitReader(resp.Body, 64))
            fmt.Println(string(b))
          }
          EOF
          GO_IP=""
          for i in 1 2; do
            GO_IP=$(TOR_OK=true /usr/local/bin/withtor go run /tmp/go_proxy_probe.go 2>/dev/null | head -1 | tr -d '[:space:]')
            [ -n "$GO_IP" ] && [ "$GO_IP" != "ERROR" ] && break
            sleep 3
          done
          echo "🔬 Go-tool exit IP check: $GO_IP (real: $REAL_IP, tor: $TOR_IP)"
          if [ -z "$GO_IP" ] || [ "$GO_IP" = "$REAL_IP" ] || [ "$GO_IP" = "ERROR" ]; then
            echo "::warning::Go tools are NOT routing through Tor on this runner — degrading to direct scanning (consistent, honest behavior) instead of silently assuming anonymity."
            exit 0
          fi
          echo "TOR_OK=true" >> "$GITHUB_OUTPUT"
          echo "TOR_OK=true" >> "$GITHUB_ENV"
          echo "✅ Tor active for Go tools + curl + python-requests via 'withtor'"

      - name: "📦 Install System Dependencies"
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl wget unzip jq dnsutils build-essential ripgrep nikto libpcap-dev
          # wpscan moved OUT of here: it costs ~2min every run and is only
          # useful when the target is actually WordPress (gated later).

      - name: "🩺 Target Health Check"
        continue-on-error: true
        timeout-minutes: 2
        run: |
          if getent hosts "$TARGET" >/dev/null 2>&1; then
            echo "✅ DNS resolves for $TARGET"
          else
            echo "::warning::$TARGET does not resolve — most steps may return empty."
          fi
          code=$(withtor curl -sk -o /dev/null -w "%{http_code}" --max-time 10 -A "$SCAN_USER_AGENT" "https://$TARGET" 2>/dev/null || echo 000)
          code="${code: -3}"
          echo "ℹ️ HTTPS probe for https://$TARGET: $code"

      - name: "🧮 Compute Cache Keys"
        run: |
          week="$(date -u +%G-W%V)"
          echo "TOOLBIN_KEY=toolbin-v8-$week"     >> "$GITHUB_ENV"
          echo "NUCLEI_TPL_KEY=nuclei-tpl-v3-$week" >> "$GITHUB_ENV"
          echo "SECLISTS_KEY=seclists-v2-$week"   >> "$GITHUB_ENV"
          echo "SNAPSHOT_KEY=snapshot-v2-$TARGET-${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: "🗄️ Restore Previous Scan Snapshot (Diff Mode)"
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .previous_snapshot
          key: ${{ env.SNAPSHOT_KEY }}            # per-run: always misses...
          restore-keys: snapshot-v2-${{ env.TARGET }}-  # ...restores the LATEST previous run

      - name: "🗄️ Restore Go Tool Cache"
        id: toolbin_cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: /tmp/toolbin
          key: ${{ env.TOOLBIN_KEY }}
          # WEEKLY rotation (not a static key): @latest tools refresh once a
          # week instead of being frozen on the first-ever cached build.

      - name: "📦 Install Go Tools"
        continue-on-error: true
        timeout-minutes: 30
        run: |
          mkdir -p /tmp/toolbin
          export GOBIN=/tmp/toolbin
          export PATH="/tmp/toolbin:/usr/local/bin:$PATH"
          echo "/tmp/toolbin" >> "$GITHUB_PATH"
          : > /tmp/tool_install.log

          # ---- ProjectDiscovery tools: prebuilt release binaries (fast), go install fallback.
          # Binaries cut this step from ~22min to ~3min on 2-vCPU runners.
          pd_install () {
            local bin="$1" repo="$2" ver="$3" modpath="$4"
            if [ -x "/tmp/toolbin/$bin" ] || command -v "$bin" >/dev/null 2>&1; then return 0; fi
            local fname="${bin}_${ver#v}_linux_amd64.zip"
            if curl -sL --max-time 120 -o "/tmp/$fname" "https://github.com/$repo/releases/download/$ver/$fname" 2>>/tmp/tool_install.log \
               && unzip -oq "/tmp/$fname" -d /tmp/pdtmp 2>>/tmp/tool_install.log \
               && mv "/tmp/pdtmp/$bin" "/tmp/toolbin/$bin" 2>>/tmp/tool_install.log; then
              chmod +x "/tmp/toolbin/$bin"; echo "✅ $bin $ver (binary)"
            else
              echo "⬇️ $bin binary failed — go install fallback"
              go install "$modpath@$ver" 2>>/tmp/tool_install.log || echo "⚠️ $bin install FAILED"
            fi
          }
          pd_install subfinder "projectdiscovery/subfinder" v2.6.6 "github.com/projectdiscovery/subfinder/v2/cmd/subfinder"
          pd_install httpx     "projectdiscovery/httpx"     v1.6.8 "github.com/projectdiscovery/httpx/cmd/httpx"
          pd_install katana    "projectdiscovery/katana"    v1.1.0 "github.com/projectdiscovery/katana/cmd/katana"
          pd_install nuclei    "projectdiscovery/nuclei"    v3.8.0 "github.com/projectdiscovery/nuclei/v3/cmd/nuclei"
          pd_install dnsx      "projectdiscovery/dnsx"      v1.2.1 "github.com/projectdiscovery/dnsx/cmd/dnsx"
          pd_install alterx    "projectdiscovery/alterx"    v0.1.0 "github.com/projectdiscovery/alterx/cmd/alterx"
          pd_install naabu     "projectdiscovery/naabu"     v2.6.1 "github.com/projectdiscovery/naabu/v2/cmd/naabu"

          install_go () {
            local name="$1" path="$2"
            if command -v "$name" >/dev/null 2>&1; then return 0; fi
            go install "$path" 2>>/tmp/tool_install.log && echo "✅ $name" || echo "⚠️ $name install FAILED"
          }
          install_go assetfinder "github.com/tomnomnom/assetfinder@v0.1.1"
          install_go waybackurls "github.com/tomnomnom/waybackurls@v0.1.0"
          install_go gf          "github.com/tomnomnom/gf@v0.0.0-20200618134122-dcd4c361f9f5"
          install_go gau         "github.com/lc/gau/v2/cmd/gau@v2.2.4"
          install_go ffuf        "github.com/ffuf/ffuf/v2@v2.1.0"
          install_go hakrawler   "github.com/hakluke/hakrawler@latest"
          install_go dalfox      "github.com/hahwul/dalfox/v2@latest"
          install_go subzy       "github.com/PentestPad/subzy@latest"
          install_go crlfuzz     "github.com/dwisiswant0/crlfuzz/cmd/crlfuzz@latest"
          install_go cariddi     "github.com/edoardottt/cariddi/cmd/cariddi@latest"
          install_go gitleaks    "github.com/zricethezav/gitleaks/v8@latest"
          install_go mantra      "github.com/brosck/mantra@latest"
          install_go asnmap      "github.com/projectdiscovery/asnmap/cmd/asnmap@latest"

          # amass: prebuilt binary (building it from source costs ~6 min alone)
          if ! command -v amass >/dev/null 2>&1; then
            if curl -sL --max-time 150 -o /tmp/amass.zip \
                 "https://github.com/owasp-amass/amass/releases/download/v4.2.0/amass_linux_amd64.zip" 2>>/tmp/tool_install.log \
               && unzip -oq /tmp/amass.zip -d /tmp/amassx 2>>/tmp/tool_install.log \
               && find /tmp/amassx -name amass -type f -exec mv {} /tmp/toolbin/amass \; 2>>/tmp/tool_install.log; then
              chmod +x /tmp/toolbin/amass; echo "✅ amass v4.2.0 (binary)"
            else
              go install -v github.com/owasp-amass/amass/v4/...@v4.2.0 2>>/tmp/tool_install.log || echo "⚠️ amass install FAILED"
            fi
          fi

          if ! command -v gowitness >/dev/null 2>&1; then
            curl -sL -o /tmp/toolbin/gowitness \
              "https://github.com/sensepost/gowitness/releases/download/3.0.3/gowitness-3.0.3-linux-amd64" 2>>/tmp/tool_install.log \
              && chmod +x /tmp/toolbin/gowitness || echo "⚠️ gowitness download failed (aggressive-mode only, non-critical)"
          fi
          if ! command -v trufflehog >/dev/null 2>&1; then
            curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
              | sh -s -- -b /tmp/toolbin 2>>/tmp/tool_install.log || echo "⚠️ trufflehog install failed"
          fi

          mkdir -p ~/.gf
          if [ ! -d /tmp/gf-patterns ]; then
            git clone --depth 1 https://github.com/1ndianl33t/Gf-Patterns.git /tmp/gf-patterns 2>/dev/null || true
          fi
          cp /tmp/gf-patterns/*.json ~/.gf/ 2>/dev/null || true
          echo "✅ Go tools step finished"

      - name: "🗄️ Save Go Tool Cache"
        if: steps.toolbin_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/toolbin
          key: ${{ env.TOOLBIN_KEY }}

      - name: "📦 Install Python Packages"
        continue-on-error: true
        run: |
          pip3 install -q --upgrade pip
          pip3 install -q requests httpx uro markdown pysocks arjun wafw00f 2>&1 | tail -3
          # recon repos cloned lazily ONLY when their feature is enabled
          if [ ! -d /tmp/LinkFinder ]; then
            git clone --depth 1 https://github.com/GerbenJavado/LinkFinder.git /tmp/LinkFinder 2>/dev/null || true
          fi
          (cd /tmp/LinkFinder && pip3 install -q . 2>/dev/null) || true
          pip3 install -q -r /tmp/LinkFinder/requirements.txt 2>/dev/null || true
          if [ ! -d /tmp/SecretFinder ]; then
            git clone --depth 1 https://github.com/m4ll0k/SecretFinder.git /tmp/SecretFinder 2>/dev/null || true
          fi
          pip3 install -q -r /tmp/SecretFinder/requirements.txt 2>/dev/null || true
          if [ ! -d /tmp/Corsy ]; then
            git clone --depth 1 https://github.com/s0md3v/Corsy.git /tmp/Corsy 2>/dev/null || true
          fi
          pip3 install -q -r /tmp/Corsy/requirements.txt 2>/dev/null || true

      - name: "🗄️ Cache Wordlists"
        id: wordlists_cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: /tmp/wordlists
          key: ${{ env.SECLISTS_KEY }}
      - name: "⬇️ Download Wordlists"
        continue-on-error: true
        run: |
          mkdir -p /tmp/wordlists
          dl () { [ -s "/tmp/wordlists/$2" ] && return 0
                  curl -sL --max-time 60 "https://raw.githubusercontent.com/danielmiessler/SecLists/master/$1" -o "/tmp/wordlists/$2"; }
          dl "Discovery/DNS/subdomains-top1million-5000.txt" dns_5k.txt
          dl "Discovery/Web-Content/raft-medium-directories.txt" raft_medium.txt
          dl "Discovery/Web-Content/common.txt" common.txt
          ls -la /tmp/wordlists || true
      - name: "🗄️ Save Wordlists Cache"
        if: steps.wordlists_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/wordlists
          key: ${{ env.SECLISTS_KEY }}

      - name: "🗄️ Cache Nuclei Templates"
        id: nuclei_tpl_cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/nuclei-templates
          key: ${{ env.NUCLEI_TPL_KEY }}
      - name: "📦 Update Nuclei Templates"
        continue-on-error: true
        run: |
          export PATH="/tmp/toolbin:$PATH"
          nuclei -update-templates 2>&1 | tail -2 || true
      - name: "🗄️ Save Nuclei Templates Cache"
        if: steps.nuclei_tpl_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/nuclei-templates
          key: ${{ env.NUCLEI_TPL_KEY }}

      - name: "✅ Verify Tools (hard gate on critical tools)"
        continue-on-error: false
        run: |
          export PATH="/tmp/toolbin:/usr/local/bin:$PATH"
          : > /tmp/tools_verified.txt
          critical_missing=""
          for tool in subfinder httpx nuclei katana dnsx; do
            if ! command -v "$tool" >/dev/null 2>&1; then critical_missing="$critical_missing $tool"; fi
          done
          if [ -n "$critical_missing" ]; then
            echo "::error::CRITICAL tools failed to install:$critical_missing — see logs/tool_install.log in the artifact. Aborting: every later step would be dead weight."
            cp /tmp/tool_install.log "results/$TIMESTAMP/logs/" 2>/dev/null || true
            exit 1
          fi
          for tool in subfinder httpx katana nuclei dnsx assetfinder waybackurls gau gf uro alterx naabu ffuf gowitness asnmap nikto amass cariddi gitleaks trufflehog mantra dalfox subzy crlfuzz hakrawler wpscan; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "✅ $tool"; echo "✅ $tool" >> /tmp/tools_verified.txt
            else
              echo "⚠️ $tool missing (non-critical)"; echo "⚠️ $tool missing" >> /tmp/tools_verified.txt
            fi
          done
          cp /tmp/tools_verified.txt "results/$TIMESTAMP/meta/" 2>/dev/null || true

      - name: "🔄 Check For Newer Tool Versions"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "results/$TIMESTAMP/meta"
          python3 << 'PYEOF'
          import json, os, time, urllib.request
          TOOLS = [
              ("subfinder",  "projectdiscovery/subfinder",  "v2.6.6"),
              ("httpx",      "projectdiscovery/httpx",      "v1.6.8"),
              ("katana",     "projectdiscovery/katana",     "v1.1.0"),
              ("nuclei",     "projectdiscovery/nuclei",     "v3.8.0"),
              ("dnsx",       "projectdiscovery/dnsx",       "v1.2.1"),
              ("gau",        "lc/gau",                      "v2.2.4"),
              ("alterx",     "projectdiscovery/alterx",     "v0.1.0"),
              ("naabu",      "projectdiscovery/naabu",      "v2.6.1"),
              ("ffuf",       "ffuf/ffuf",                   "v2.1.0"),
              ("gowitness",  "sensepost/gowitness",         "v3.0.3"),
              ("amass",      "owasp-amass/amass",           "v4.2.0"),
          ]
          def norm(v):
              v = v.lstrip("vV"); out = []
              for part in v.split("."):
                  d = "".join(c for c in part if c.isdigit() if True)
                  d = ""
                  for ch in part:
                      if ch.isdigit(): d += ch
                      else: break
                  out.append(int(d) if d else 0)
              return tuple(out)
          token = os.environ.get("GH_TOKEN", "")
          rows = []
          for name, repo, pinned in TOOLS:
              try:
                  req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases/latest")
                  req.add_header("Accept", "application/vnd.github+json")
                  if token: req.add_header("Authorization", f"Bearer {token}")
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode("utf-8", "replace"), strict=False)
                  latest = data.get("tag_name")
                  if not latest:
                      rows.append((name, pinned, "?", "no tag_name"))
                  else:
                      outdated = norm(latest) > norm(pinned)
                      rows.append((name, pinned, latest, "OUTDATED" if outdated else "current"))
              except Exception as e:
                  rows.append((name, pinned, "?", f"check failed: {e}"))
              time.sleep(0.4)
          lines = ["# 🔄 Tool Version Check (informational — pins are updated by hand)", "",
                   "| Tool | Pinned | Latest | Status |", "|---|---|---|---|"]
          for name, pinned, latest, status in rows:
              lines.append(f"| {name} | {pinned} | {latest} | {status} |")
          rd = "results/" + os.environ.get("TIMESTAMP", "")
          os.makedirs(os.path.join(rd, "meta"), exist_ok=True)
          with open(os.path.join(rd, "meta", "tool_versions.md"), "w") as f:
              f.write("\n".join(lines))
          print("\n".join(lines))
          PYEOF

      # =========================================================================
      # RECON
      # =========================================================================
      - name: "🌐 Subdomain Enumeration"
        continue-on-error: true
        timeout-minutes: 20
        run: |
          export PATH="/tmp/toolbin:$PATH"
          RD="results/$TIMESTAMP"
          target="$TARGET"

          # NEW: provider keys — the single biggest free coverage upgrade.
          mkdir -p ~/.config/subfinder
          {
            [ -n "$SUBFINDER_PROVIDER_CONFIG" ] && printf '%s\n' "$SUBFINDER_PROVIDER_CONFIG"
            [ -n "$CHAOS_API_KEY" ] && printf 'chaos: ["%s"]\n' "$CHAOS_API_KEY"
            [ -n "$SHODAN_API_KEY" ] && printf 'shodan: ["%s"]\n' "$SHODAN_API_KEY"
          } > ~/.config/subfinder/provider-config.yaml 2>/dev/null || true
          SUBFINDER_FLAGS=""
          [ -s ~/.config/subfinder/provider-config.yaml ] && SUBFINDER_FLAGS="-provider-config $HOME/.config/subfinder/provider-config.yaml"

          echo "🔍 subfinder..."
          subfinder -d "$target" -silent -all $SUBFINDER_FLAGS -o "$RD/subdomains/subfinder.txt" 2>>"$RD/logs/subfinder.log" || true
          echo "🔍 assetfinder..."
          assetfinder --subs-only "$target" > "$RD/subdomains/assetfinder.txt" 2>>"$RD/logs/assetfinder.log" || true

          echo "🔍 crt.sh (retry + certspotter fallback)..."
          got_ct=0
          for i in 1 2; do
            curl -s --max-time 25 "https://crt.sh/?q=%25.${target}&output=json" \
              | jq -r '.[].name_value' 2>/dev/null | tr ',' '\n' | sed 's/^\*\.//' \
              | tr '[:upper:]' '[:lower:]' | sort -u > "$RD/subdomains/crtsh.txt"
            [ -s "$RD/subdomains/crtsh.txt" ] && { got_ct=1; break; }
            sleep 4
          done
          if [ "$got_ct" != "1" ]; then
            echo "   crt.sh empty/unreachable — certspotter fallback..."
            curl -s --max-time 25 "https://api.certspotter.com/v1/issuances?domain=${target}&include_subdomains=true&expand=dns_names" \
              | jq -r '.[].dns_names[]' 2>/dev/null | tr '[:upper:]' '[:lower:]' | sort -u > "$RD/subdomains/certspotter.txt" || true
          fi

          echo "🔍 amass passive (capped)..."
          if command -v amass >/dev/null 2>&1; then
            timeout 300 amass enum -passive -d "$target" -o "$RD/subdomains/amass.txt" 2>>"$RD/logs/amass.log" || true
          else
            touch "$RD/subdomains/amass.txt"
          fi

          echo "🩺 Wildcard DNS check..."
          WILD_TOKEN="wildcheck$RANDOM$RANDOM"
          WILDCARD_IP=$(dnsx -silent -a -resp-only <<< "${WILD_TOKEN}.${target}" 2>/dev/null | head -1)
          if [ -n "$WILDCARD_IP" ]; then
            echo "⚠️ Wildcard detected (${WILDCARD_IP}) — content-based filtering (not just DNS resolution)."
            : > "$RD/subdomains/wildcard_filtered.txt"
            if [ -s /tmp/wordlists/dns_5k.txt ]; then
              BASELINE_LEN=$(withtor curl -s -o /dev/null -w '%{size_download}' --max-time 10 -A "$SCAN_USER_AGENT" -H "Host: ${WILD_TOKEN}.${target}" "http://${WILDCARD_IP}/" 2>/dev/null || echo 0)
              check_wildcard_candidate () {
                local word="$1" host="$2" wip="$3" baseline="$4" len diff threshold
                len=$(withtor curl -s -o /dev/null -w '%{size_download}' --max-time 8 -A "$SCAN_USER_AGENT" -H "Host: $host" "http://${wip}/" 2>/dev/null || echo 0)
                [ -z "$len" ] && return
                if [ "$len" != "0" ] && [ "$baseline" != "0" ]; then
                  if [ "$len" -ge "$baseline" ]; then diff=$((len - baseline)); else diff=$((baseline - len)); fi
                  threshold=$((baseline / 10)); [ "$threshold" -lt 30 ] && threshold=30
                  if [ "$diff" -ge "$threshold" ]; then echo "$host"; fi
                fi
              }
              export -f check_wildcard_candidate
              export SCAN_USER_AGENT
              head -400 /tmp/wordlists/dns_5k.txt > /tmp/wildcard_sample.txt
              running=0; start_sec=$SECONDS
              while IFS= read -r word; do
                [ -z "$word" ] && continue
                if [ $((SECONDS - start_sec)) -ge 150 ]; then break; fi
                ( check_wildcard_candidate "$word" "${word}.${target}" "$WILDCARD_IP" "$BASELINE_LEN" ) >> "$RD/subdomains/wildcard_filtered.txt" &
                running=$((running + 1))
                if [ "$running" -ge 15 ]; then wait -n 2>/dev/null || wait; running=$((running - 1)); fi
              done < /tmp/wildcard_sample.txt
              wait
            fi
            echo "✅ wildcard-filtered candidates: $(wc -l < "$RD/subdomains/wildcard_filtered.txt" 2>/dev/null || echo 0)"
          else
            echo "🔍 DNS brute-force (capped 240s)..."
            [ -s /tmp/wordlists/dns_5k.txt ] && timeout 240 bash -c "sed \"s/\\\$/.${target}/\" /tmp/wordlists/dns_5k.txt | dnsx -silent -a -cname -resp -t 200 | awk '{print \$1}'" > "$RD/subdomains/dns_brute.txt" 2>>"$RD/logs/dnsx.log" || true
          fi

          echo "🔄 Merging passive sources..."
          cat "$RD"/subdomains/*.txt 2>/dev/null | tr -d '\r' | sed 's/^\*\.//' \
            | grep -iE "\.${target}\$|^${target}\$" | tr '[:upper:]' '[:lower:]' | sort -u > /tmp/raw_subs.txt
          echo "✅ Resolving..."
          [ -s /tmp/raw_subs.txt ] && timeout 240 bash -c 'cat /tmp/raw_subs.txt | dnsx -silent -resp -a -t 200 | awk "{print \$1}" | sort -u' > "$RD/subdomains/resolved.txt" 2>>"$RD/logs/dnsx.log" || touch "$RD/subdomains/resolved.txt"
          cut -d' ' -f1 "$RD/subdomains/resolved.txt" 2>/dev/null | sort -u -o "$RD/subdomains/resolved.txt"

          echo "🧬 alterx permutations..."
          if [ -s "$RD/subdomains/resolved.txt" ] && command -v alterx >/dev/null 2>&1; then
            timeout 180 bash -c "alterx -l '$RD/subdomains/resolved.txt' -silent | dnsx -silent -resp -a -t 200 | awk '{print \$1}' | sort -u" > "$RD/subdomains/permutations_resolved.txt" 2>>"$RD/logs/alterx.log" || touch "$RD/subdomains/permutations_resolved.txt"
          else
            touch "$RD/subdomains/permutations_resolved.txt"
          fi
          cat "$RD/subdomains/resolved.txt" "$RD/subdomains/permutations_resolved.txt" 2>/dev/null | grep -v '^\s*$' | sort -u > "$RD/subdomains/all_subs.txt" || true
          total=$(wc -l < "$RD/subdomains/all_subs.txt" 2>/dev/null || echo 0)
          echo "✅ Total DNS-confirmed subdomains: $total"
          if [ "$total" -eq 0 ]; then
            raw_count=$(wc -l < /tmp/raw_subs.txt 2>/dev/null || echo 0)
            echo "::warning::0 DNS-confirmed subdomains from $raw_count raw candidates — resolver/tooling failure, NOT a clean target. Every later '0' traces back here."
            echo "0 subdomains were DNS-confirmed although $raw_count raw names existed pre-resolution. Do NOT read a clean report below as 'target is secure'." > "$RD/meta/scan_health_warning.txt"
          fi

      - name: "🌐 ASN/CIDR Discovery"
        continue-on-error: true
        timeout-minutes: 5
        run: |
          export PATH="/tmp/toolbin:$PATH"
          RD="results/$TIMESTAMP"
          : > "$RD/subdomains/asn_ips.txt"
          mkdir -p "$RD/meta"
          if [ -n "$PDCP_API_KEY" ] && command -v asnmap >/dev/null 2>&1; then
            export PDCP_API_KEY
            attempt=1
            while [ ! -s /tmp/asn_cidrs.txt ] && [ "$attempt" -le 2 ]; do
              timeout 60 asnmap -d "$TARGET" -silent -o /tmp/asn_cidrs.txt 2>>"$RD/logs/asnmap.log" || true
              attempt=$((attempt + 1)); sleep 3
            done
            if [ -s /tmp/asn_cidrs.txt ]; then
              cp /tmp/asn_cidrs.txt "$RD/subdomains/asn_cidrs.txt"
              echo "✅ $(wc -l < /tmp/asn_cidrs.txt) CIDR range(s) owned by the target's org"
            else
              echo "ℹ️ asnmap returned no ranges (org not mapped / API limits)"
            fi
          else
            echo "ℹ️ PDCP_API_KEY not set or asnmap missing — ASN/CIDR discovery skipped"
          fi

      - name: "🌐 HTTP Probing (httpx)"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          export PATH="/tmp/toolbin:$PATH"
          RD="results/$TIMESTAMP"
          [ -s "$RD/subdomains/all_subs.txt" ] || { echo "no subdomains — skipping"; exit 0; }
          withtor httpx -l "$RD/subdomains/all_subs.txt" \
            -json -silent -follow-redirects -title -status-code -tech-detect -cdn -ip -cname -websocket \
            -threads 40 -rate-limit 60 -timeout 8 -retries 1 \
            -H "User-Agent: $SCAN_USER_AGENT" \
            -o "$RD/live/live.json" 2>>"$RD/logs/httpx.log" || true
          if [ ! -s "$RD/live/live.json" ]; then
            echo "::warning::httpx returned zero live hosts — appending health warning."
            echo "httpx probed all DNS-confirmed hosts and got zero HTTP(S) responses. Check logs/httpx.log — likely egress blocking or all-dead hosts." >> "$RD/meta/scan_health_warning.txt"
            exit 0
          fi
          jq -r '.url' "$RD/live/live.json" | sort -u > "$RD/live/urls.txt"
          jq -r '.host // (.url|sub("^https?://";"")|split("/")[0])' "$RD/live/live.json" | sort -u > "$RD/live/hosts.txt"
          jq -r '.tech[]?' "$RD/live/live.json" 2>/dev/null | sort | uniq -c | sort -rn > "$RD/meta/tech.txt"
          jq -r 'select(.cdn==true) | .host' "$RD/live/live.json" 2>/dev/null | sort -u > "$RD/meta/cdn_hosts.txt"
          jq -r '[.url, (.status_code|tostring), (.title // "-"), ((.tech // [])|join(","))] | @tsv' "$RD/live/live.json" > "$RD/live/httpx.tsv"
          echo "✅ Live hosts: $(wc -l < "$RD/live/urls.txt")"
          echo "🧰 Detected tech:"; head -20 "$RD/meta/tech.txt"

      - name: "🛡️ WAF Detection"
        if: ${{ env.ENABLE_WAF_BYPASS == 'true' }}
        continue-on-error: true
        timeout-minutes: 6
        run: |
          RD="results/$TIMESTAMP"
          [ -s "$RD/live/urls.txt" ] || exit 0
          : > "$RD/waf_bypass/waf.txt"
          head -"$MODE_CORSY_HOSTS" "$RD/live/urls.txt" | while IFS= read -r u; do
            wafw00f "$u" 2>/dev/null | grep -iE "is behind|waf" >> "$RD/waf_bypass/waf.txt" || true
          done
          [ -s "$RD/waf_bypass/waf.txt" ] && { echo "⚠️ WAF detected:"; cat "$RD/waf_bypass/waf.txt"; } || echo "ℹ️ No WAF signatures matched"

      - name: "🔌 Port Scan (naabu)"
        if: ${{ env.MODE_NAABU_PORTS != 'none' }}
        continue-on-error: true
        timeout-minutes: 12
        run: |
          export PATH="/tmp/toolbin:$PATH"
          RD="results/$TIMESTAMP"
          [ -s "$RD/live/hosts.txt" ] || exit 0
          head -"$MODE_NAABU_HOSTS" "$RD/live/hosts.txt" > /tmp/naabu_targets.txt
          [ -s /tmp/naabu_targets.txt ] || exit 0
          sudo timeout 480 naabu -l /tmp/naabu_targets.txt -top-ports "$MODE_NAABU_PORTS" \
            -rate 1000 -c 25 -silent -o "$RD/ports/naabu.txt" 2>>"$RD/logs/naabu.log" || true
          echo "✅ Open ports found: $(grep -c ':' "$RD/ports/naabu.txt" 2>/dev/null || echo 0)"

      - name: "🔗 URL Collection"
        continue-on-error: true
        timeout-minutes: 20
        run: |
          export PATH="/tmp/toolbin:$PATH"
          RD="results/$TIMESTAMP"
          target="$TARGET"
          echo "🔍 waybackurls (third-party archive — direct, no Tor)..."
          timeout 120 waybackurls "$target" > "$RD/urls/wayback.txt" 2>/dev/null || true
          echo "🔍 gau..."
          timeout 150 gau --threads 5 "$target" > "$RD/urls/gau.txt" 2>/dev/null || true
          echo "🔍 katana (target crawl — via Tor)..."
          if [ -s "$RD/live/urls.txt" ]; then
            withtor timeout 300 katana -list "$RD/live/urls.txt" -d "$MODE_KATANA_DEPTH" -jc -c 20 -silent > "$RD/urls/katana.txt" 2>>"$RD/logs/katana.log" || true
          fi
          echo "🔍 hakrawler (capped)..."
          : > "$RD/urls/hakrawler.txt"
          head -20 "$RD/live/urls.txt" 2>/dev/null | while IFS= read -r u; do
            withtor timeout 60 hakrawler -u "$u" -depth "$MODE_KATANA_DEPTH" -insecure -plain 2>/dev/null | head -200 >> "$RD/urls/hakrawler.txt" || true
          done
          cat "$RD"/urls/*.txt 2>/dev/null | grep -oE 'https?://[^[:space:]"'"'"'<>]+' | sort -u > "$RD/urls/all_urls.txt"
          cat "$RD/urls/all_urls.txt" 2>/dev/null | uro > "$RD/urls/uro.txt" 2>/dev/null || cp "$RD/urls/all_urls.txt" "$RD/urls/uro.txt" 2>/dev/null || true
          for pat in xss ssrf redirect takeovers potential sqli; do
            gf "$pat" < "$RD/urls/all_urls.txt" > "$RD/urls/gf_${pat}.txt" 2>/dev/null || : > "$RD/urls/gf_${pat}.txt"
          done
          echo "✅ Total unique URLs: $(wc -l < "$RD/urls/all_urls.txt" 2>/dev/null || echo 0)"

      - name: "📜 JavaScript & Secrets Analysis"
        continue-on-error: true
        timeout-minutes: 25
        run: |
          export PATH="/tmp/toolbin:$PATH"
          RD="results/$TIMESTAMP"
          mkdir -p "$RD/js/files"
          echo "⬇️ Downloading JS (cap: $MODE_JS_FILES)..."
          grep -iE '\.js($|\?)' "$RD/urls/all_urls.txt" 2>/dev/null | head -"$MODE_JS_FILES" | while IFS= read -r u; do
            fn="$RD/js/files/$(echo "$u" | md5sum | cut -d' ' -f1).js"
            withtor curl -s --max-time 15 -A "$SCAN_USER_AGENT" "$u" -o "$fn" 2>/dev/null || true
            [ -s "$fn" ] || rm -f "$fn"
          done
          echo "✅ JS files downloaded: $(ls "$RD/js/files" 2>/dev/null | wc -l)"
          echo "🔍 LinkFinder endpoints..."
          python3 /tmp/LinkFinder/linkfinder.py -i "$RD/js/files" -o cli 2>/dev/null | sort -u > "$RD/js/endpoints_raw.txt" || true
          echo "🔍 SecretFinder..."
          python3 /tmp/SecretFinder/SecretFinder.py -i "$RD/js/files" -o cli 2>/dev/null > "$RD/js/secrets.txt" || true
          echo "🔍 trufflehog (verified only)..."
          trufflehog filesystem --directory "$RD/js/files" --only-verified 2>/dev/null | head -100 > "$RD/js/secrets_trufflehog.txt" || true
          echo "🔍 cariddi (best-effort)..."
          : > "$RD/js/cariddi.txt"
          head -10 "$RD/live/urls.txt" 2>/dev/null | while IFS= read -r u; do
            withtor timeout 90 cariddi -d 1 "$u" 2>/dev/null | head -100 >> "$RD/js/cariddi.txt" || true
          done
          grep -iE 'graphql|graphiql' "$RD/js/endpoints_raw.txt" 2>/dev/null | sort -u > "$RD/graphql/endpoints.txt" || true
          echo "✅ endpoints: $(wc -l < "$RD/js/endpoints_raw.txt" 2>/dev/null || echo 0) | secrets: $(wc -l < "$RD/js/secrets.txt" 2>/dev/null || echo 0)"

      - name: "🗺️ Source Map Analysis"
        if: ${{ env.ENABLE_SOURCE_MAPS == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          RD="results/$TIMESTAMP"
          : > "$RD/source_maps/findings.txt"
          : > "$RD/source_maps/exposed_maps.txt"
          python3 << 'PYEOF'
          import os, re, json, urllib.request
          RD = "results/" + os.environ["TIMESTAMP"]
          UA = os.environ["SCAN_USER_AGENT"]
          js_dir = os.path.join(RD, "js", "files")
          secret_re = re.compile(r'(api[_-]?key|secret|token|password|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z\-_]{35}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY)', re.I)
          found_maps, findings = [], []
          for fn in os.listdir(js_dir) if os.path.isdir(js_dir) else []:
              p = os.path.join(js_dir, fn)
              try: body = open(p, encoding="utf-8", errors="ignore").read()
              except Exception: continue
              m = re.search(r'sourceMappingURL=(\S+\.map)', body[-2000:])
              if not m: continue
              map_url = m.group(1)
              if map_url.startswith("/"):
                  pass  # relative to unknown origin — note only
              found_maps.append(map_url)
              try:
                  req = urllib.request.Request(map_url, headers={"User-Agent": UA})
                  data = json.loads(urllib.request.urlopen(req, timeout=15).read().decode("utf-8", "replace"))
              except Exception:
                  continue
              findings.append(f"EXPOSED MAP: {map_url} sources={len(data.get('sources', []))}")
              for sc in data.get("sourcesContent", []) or []:
                  if sc and secret_re.search(sc):
                      findings.append(f"SECRET-IN-SOURCEMAP: {map_url} :: {secret_re.search(sc).group(0)[:40]}")
          with open(os.path.join(RD, "source_maps", "exposed_maps.txt"), "w") as f:
              f.write("\n".join(found_maps))
          with open(os.path.join(RD, "source_maps", "findings.txt"), "w") as f:
              f.write("\n".join(findings))
          print(f"source maps referenced: {len(found_maps)}, confirmed findings: {len(findings)}")
          PYEOF

      - name: "🔍 GraphQL Endpoint Probe"
        continue-on-error: true
        timeout-minutes: 6
        run: |
          export PATH="/tmp/toolbin:$PATH"
          RD="results/$TIMESTAMP"
          [ -s "$RD/live/hosts.txt" ] || exit 0
          : > /tmp/gql_probe.txt
          head -30 "$RD/live/hosts.txt" | while IFS= read -r h; do
            for p in /graphql /graphiql /v1/graphql /api/graphql; do
              echo "https://${h}${p}" >> /tmp/gql_probe.txt
            done
          done
          cat "$RD/graphql/endpoints.txt" 2>/dev/null >> /tmp/gql_probe.txt
          sort -u /tmp/gql_probe.txt -o /tmp/gql_probe.txt
          withtor httpx -l /tmp/gql_probe.txt -status-code -silent -mc 200,400,405 \
            -H "User-Agent: $SCAN_USER_AGENT" -o "$RD/graphql/live.txt" 2>>"$RD/logs/httpx.log" || true
          echo "✅ Live GraphQL candidates: $(wc -l < "$RD/graphql/live.txt" 2>/dev/null || echo 0)"

      - name: "🧭 CORS Scan (Corsy)"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          RD="results/$TIMESTAMP"
          [ -d /tmp/Corsy ] || { echo "Corsy not cloned — skipping"; exit 0; }
