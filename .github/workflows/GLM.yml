            timeout 60 python3 /tmp/Corsy/corsy.py -u "$u" 2>/dev/null >> "$RD/cors/corsy.txt" || true
          done
          echo "✅ CORS output lines: $(wc -l < "$RD/cors/corsy.txt" 2>/dev/null || echo 0)"

      - name: "💀 Subdomain Takeover (subzy)"
        continue-on-error: true
        timeout-minutes: 10
        run: |
          export PATH="/tmp/toolbin:$PATH"
          RD="results/$TIMESTAMP"
          [ -s "$RD/live/urls.txt" ] || exit 0
          withtor timeout 420 subzy run --targets "$RD/live/urls.txt" 2>/dev/null \
            | grep -vi "not vulnerable" > "$RD/takeover/subzy.txt" || true
          echo "✅ Takeover findings: $(wc -l < "$RD/takeover/subzy.txt" 2>/dev/null || echo 0)"

      - name: "↩️ CRLF Injection (crlfuzz)"
        continue-on-error: true
        timeout-minutes: 8
        run: |
          export PATH="/tmp/toolbin:$PATH"
          RD="results/$TIMESTAMP"
          [ -s "$RD/live/urls.txt" ] || exit 0
          withtor timeout 300 crlfuzz run -l "$RD/live/urls.txt" 2>/dev/null > "$RD/crlf/crlf.txt" || true
          echo "✅ CRLF findings: $(grep -c . "$RD/crlf/crlf.txt" 2>/dev/null || echo 0)"

      - name: "⚡ XSS Scan (dalfox)"
        continue-on-error: true
        timeout-minutes: 25
        run: |
          export PATH="/tmp/toolbin:$PATH"
          RD="results/$TIMESTAMP"
          [ -s "$RD/urls/gf_xss.txt" ] || { echo "no XSS candidate URLs"; exit 0; }
          head -"$MODE_DALFOX_URLS" "$RD/urls/gf_xss.txt" > /tmp/dalfox_targets.txt
          timeout 900 bash -c 'cat /tmp/dalfox_targets.txt | withtor dalfox pipe' > "$RD/xss/dalfox_raw.txt" 2>"$RD/logs/dalfox.log" || true
          grep -E '^\[(V|G|F)\]|PoC|Vulnerable|Reflected' "$RD/xss/dalfox_raw.txt" 2>/dev/null | head -200 > "$RD/xss/dalfox.txt" || true
          echo "✅ XSS findings: $(wc -l < "$RD/xss/dalfox.txt" 2>/dev/null || echo 0)"

      - name: "📂 Information Disclosure (git/env/backups)"
        if: ${{ env.ENABLE_GIT_EXPOSURE == 'true' }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          export PATH="/tmp/toolbin:$PATH"
          RD="results/$TIMESTAMP"
          [ -s "$RD/live/urls.txt" ] || exit 0
          : > /tmp/id_probe.txt
          head -50 "$RD/live/urls.txt" | while IFS= read -r u; do
            for p in /.git/HEAD /.git/config /.env /.DS_Store /.svn/entries /backup.zip /db.sql /dump.sql /.htaccess /debug; do
              echo "${u}${p}" >> /tmp/id_probe.txt
            done
          done
          withtor httpx -l /tmp/id_probe.txt -status-code -content-length -silent -mc 200 \
            -H "User-Agent: $SCAN_USER_AGENT" -o "$RD/info_disclosure/hits.txt" 2>>"$RD/logs/httpx.log" || true
          : > "$RD/info_disclosure/git_exposure.txt"
          while IFS= read -r hit; do
            case "$hit" in
              *".git/HEAD"*)
                content=$(withtor curl -s --max-time 10 -A "$SCAN_USER_AGENT" "$hit" 2>/dev/null | head -2)
                if echo "$content" | grep -q "ref:"; then
                  echo "CONFIRMED .git exposure: $hit (content: $(echo "$content" | head -1))" >> "$RD/info_disclosure/git_exposure.txt"
                fi ;;
              *".git/config"*)
                content=$(withtor curl -s --max-time 10 -A "$SCAN_USER_AGENT" "$hit" 2>/dev/null | head -3)
                if echo "$content" | grep -qE "\[core\]|\[remote"; then
                  echo "CONFIRMED .git config readable: $hit" >> "$RD/info_disclosure/git_exposure.txt"
                fi ;;
            esac
          done < "$RD/info_disclosure/hits.txt"
          echo "✅ Disclosure hits: $(wc -l < "$RD/info_disclosure/hits.txt" 2>/dev/null || echo 0) | confirmed: $(wc -l < "$RD/info_disclosure/git_exposure.txt" 2>/dev/null || echo 0)"

      - name: "📂 WordPress Scan (only if WordPress detected)"
        if: ${{ env.HUNTING_MODE != 'light' }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          RD="results/$TIMESTAMP"
          if ! grep -qi wordpress "$RD/meta/tech.txt" 2>/dev/null; then
            echo "ℹ️ No WordPress detected by httpx — skipping wpscan entirely (saves ~2min)."
            exit 0
          fi
          sudo gem install wpscan --no-document 2>/dev/null || { echo "⚠️ wpscan gem failed"; exit 0; }
          grep -i wordpress "$RD/meta/tech.txt" 2>/dev/null | head -3
          : > "$RD/targeted/wpscan.txt"
          head -3 "$RD/live/urls.txt" | while IFS= read -r u; do
            timeout 240 wpscan --url "$u" --no-banner --random-user-agent --no-update 2>/dev/null | head -80 >> "$RD/targeted/wpscan.txt" || true
          done

      - name: "🚀 Content Discovery (ffuf)"
        continue-on-error: true
        timeout-minutes: 40
        run: |
          export PATH="/tmp/toolbin:$PATH"
          RD="results/$TIMESTAMP"
          [ -s "$RD/live/urls.txt" ] || exit 0
          [ -s /tmp/wordlists/raft_medium.txt ] || { echo "wordlist missing"; exit 0; }
          mkdir -p "$RD/files"
          head -"$MODE_FFUF_HOSTS" "$RD/live/urls.txt" | while IFS= read -r u; do
            host=$(echo "$u" | sed 's|https\?://||; s|/.*||; s|:.*||')
            out="$RD/files/ffuf_${host//./_}.json"
            withtor timeout 420 ffuf -w /tmp/wordlists/raft_medium.txt -u "${u}/FUZZ" \
              -ac -t 40 -mc 200,204,301,302,307,401,403 -of json -o "$out" \
              -H "User-Agent: $SCAN_USER_AGENT" 2>>"$RD/logs/ffuf.log" || true
            if [ -s "$out" ]; then
              n=$(jq '.results | length' "$out" 2>/dev/null || echo 0)
              echo "✅ $host: $n discovered paths"
              jq -r '.results[] | "\(.status) \(.url)"' "$out" 2>/dev/null | sort -u > "${out%.json}.txt" || true
            fi
          done

      - name: "📸 Screenshots (gowitness, aggressive only)"
        if: ${{ env.MODE_GOWITNESS != '0' }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          export PATH="/tmp/toolbin:$PATH"
          RD="results/$TIMESTAMP"
          command -v gowitness >/dev/null 2>&1 || { echo "gowitness missing"; exit 0; }
          # NOTE: gowitness needs a chrome binary. Install attempt below is
          # best-effort; on failures this step self-degrades (non-critical).
          command -v google-chrome >/dev/null 2>&1 || {
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb 2>/dev/null \
              && sudo dpkg -i /tmp/chrome.deb 2>/dev/null && sudo apt-get -f install -y -qq 2>/dev/null || true
          }
          head -"$MODE_GOWITNESS" "$RD/live/urls.txt" > /tmp/gowitness_targets.txt
          mkdir -p "$RD/files/screenshots"
          withtor gowitness screenshot file -f /tmp/gowitness_targets.txt --screenshot-path "$RD/files/screenshots" 2>>"$RD/logs/gowitness.log" \
            || withtor timeout 300 gowitness --chrome --target-file /tmp/gowitness_targets.txt 2>>"$RD/logs/gowitness.log" \
            || echo "⚠️ gowitness failed (non-critical)"

      # =========================================================================
      # NUCLEI — staged by hunting mode, authenticated pass when AUTH secrets set
      # =========================================================================
      - name: "☢️ Nuclei Vulnerability Scan"
        continue-on-error: true
        timeout-minutes: 150
        run: |
          export PATH="/tmp/toolbin:$PATH"
          RD="results/$TIMESTAMP"
          [ -s "$RD/live/urls.txt" ] || { echo "no live hosts — nuclei skipped"; exit 0; }
          COMMON=(-l "$RD/live/urls.txt" -j -silent -rl "$MODE_NUCLEI_RL" -c "$MODE_NUCLEI_CONC"
                  -timeout 8 -retries 1 -etags intrusive,destructive
                  -H "User-Agent: $SCAN_USER_AGENT"
                  -stats -si 120)

          echo "🚀 Stage 1: mode-driven tags ($MODE_NUCLEI_TAGS), timeout ${MODE_NUCLEI_S1_TIMEOUT}s"
          timeout "$MODE_NUCLEI_S1_TIMEOUT" withtor nuclei "${COMMON[@]}" -tags "$MODE_NUCLEI_TAGS" \
            -o "$RD/nuclei/stage1.jsonl" 2>>"$RD/logs/nuclei.log" || true

          if [ "$HUNTING_MODE" = "aggressive" ]; then
            echo "🚀 Stage 2 (aggressive): full template set, medium+ severity"
            timeout 5400 withtor nuclei "${COMMON[@]}" -severity medium,high,critical \
              -o "$RD/nuclei/stage2.jsonl" 2>>"$RD/logs/nuclei.log" || true
          fi

          if [ -n "$AUTH_HEADER" ] || [ -n "$AUTH_COOKIE" ]; then
            echo "🚀 Stage 3: AUTHENTICATED scan (exposures/misconfig, medium+)"
            AUTH_ARGS=()
            [ -n "$AUTH_HEADER" ] && AUTH_ARGS+=(-H "$AUTH_HEADER")
            [ -n "$AUTH_COOKIE" ] && AUTH_ARGS+=(-H "Cookie: $AUTH_COOKIE")
            timeout 1200 withtor nuclei "${COMMON[@]}" "${AUTH_ARGS[@]}" \
              -tags exposures,misconfig,panel -severity medium,high,critical \
              -o "$RD/nuclei/stage_auth.jsonl" 2>>"$RD/logs/nuclei.log" || true
          fi

          cat "$RD"/nuclei/stage*.jsonl 2>/dev/null > "$RD/nuclei/results.jsonl" || true
          echo "✅ Total nuclei matches: $(wc -l < "$RD/nuclei/results.jsonl" 2>/dev/null || echo 0)"

      # =========================================================================
      # AI LAYER — model auto-discovery, provider chain, direct connection
      # =========================================================================
      - name: "🤖 Install AI Helper"
        run: |
          cat > /tmp/ai_helper.py <<'PYEOF'
          #!/usr/bin/env python3
          """Zero Track AI helper: 7-provider chain with live model discovery.
          Connects DIRECTLY (no Tor): AI provider APIs are Cloudflare-fronted and
          block most Tor exits; they are not the target of the assessment.
          Never fails the job: writes a skip note and exits 0 on total failure."""
          import argparse, json, os, sys, time, urllib.request, urllib.error

          MAX_CTX = 60000
          TIMEOUT = int(os.environ.get("AI_TIMEOUT_SECS", "120"))
          MAX_TOKENS = int(os.environ.get("AI_MAX_TOKENS", "4000"))

          def pref(env, *defaults):
              out = []
              if os.environ.get(env): out.append(os.environ[env])
              out.extend(d for d in defaults if d)
              return out

          PREFERRED = {
              "anthropic":  pref("ANTHROPIC_MODEL_NAME", "claude-sonnet-4-5", "claude-sonnet-4-20250514", "claude-3-7-sonnet-latest", "claude-3-5-sonnet-latest"),
              "openrouter": pref("OPENROUTER_MODEL_NAME", "openrouter/auto", "OPENROUTER_FREE_MODEL_NAME" and os.environ.get("OPENROUTER_FREE_MODEL_NAME", "openrouter/free")),
              "groq":       pref("GROQ_MODEL_NAME", "llama-3.3-70b-versatile", "openai/gpt-oss-120b", "llama-3.1-8b-instant"),
              "gemini":     pref("GEMINI_MODEL_NAME", "gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"),
              "openai":     pref("OPENAI_MODEL_NAME", "gpt-4.1-mini", "gpt-4o-mini", "gpt-4o"),
              "cerebras":   pref("CEREBRAS_MODEL_NAME", "llama-3.3-70b", "gpt-oss-120b"),
              "tokenrouter":pref("TOKENROUTER_MODEL_NAME", "moonshotai/kimi-k2-instruct"),
          }
          KEYS = {"anthropic":"ANTHROPIC_API_KEY","openrouter":"OPENROUTER_API_KEY","groq":"GROQ_API_KEY",
                  "gemini":"GEMINI_API_KEY","openai":"OPENAI_API_KEY","cerebras":"CEREBRAS_API_KEY",
                  "tokenrouter":"TOKENROUTER_API_KEY"}
          BASES = {"openrouter":"https://openrouter.ai/api/v1","groq":"https://api.groq.com/openai/v1",
                   "openai":"https://api.openai.com/v1","cerebras":"https://api.cerebras.ai/v1",
                   "tokenrouter":os.environ.get("TOKENROUTER_BASE_URL","https://api.tokenrouter.com")}

          def req_json(url, headers, payload=None, timeout=TIMEOUT):
              data = json.dumps(payload).encode() if payload is not None else None
              r = urllib.request.Request(url, data=data, headers=headers, method="POST" if data else "GET")
              with urllib.request.urlopen(r, timeout=timeout) as resp:
                  return json.loads(resp.read().decode("utf-8", "replace"), strict=False)

          def discover(provider):
              try:
                  if provider == "anthropic":
                      d = req_json("https://api.anthropic.com/v1/models",
                                   {"x-api-key": os.environ[KEYS[provider]], "anthropic-version": "2023-06-01"}, timeout=15)
                      return [m.get("id") for m in d.get("data", [])]
                  if provider == "gemini":
                      d = req_json("https://generativelanguage.googleapis.com/v1beta/models",
                                   {"x-goog-api-key": os.environ[KEYS[provider]]}, timeout=15)
                      return [m.get("name","").replace("models/","") for m in d.get("models", [])]
                  base = BASES[provider].rstrip("/")
                  if not base.endswith("/v1"): base += "/v1"   # tolerate base URLs with/without /v1
                  d = req_json(base + "/models", {"Authorization": "Bearer " + os.environ[KEYS[provider]]}, timeout=15)
                  return [m.get("id") for m in d.get("data", [])]
              except Exception as e:
                  print(f"[ai] {provider} model discovery failed ({e}) — using preferred list only")
                  return []

          def candidates(provider):
              disc = discover(provider)
              lst = list(PREFERRED[provider])
              if provider == "openrouter":
                  free = sorted(m for m in disc if ":free" in m)
                  lst += free[:5]
              for m in disc:
                  if m not in lst: lst.append(m)
              seen, out = set(), []
              for m in lst:
                  if m and m not in seen: seen.add(m); out.append(m)
              return out[:12]

          def chat(provider, model, prompt):
              if provider == "anthropic":
                  d = req_json("https://api.anthropic.com/v1/messages",
                               {"x-api-key": os.environ[KEYS[provider]], "anthropic-version": "2023-06-01",
                                "content-type": "application/json"},
                               {"model": model, "max_tokens": MAX_TOKENS, "messages": [{"role": "user", "content": prompt}]})
                  return "".join(b.get("text","") for b in d.get("content", []) if b.get("type") == "text")
              if provider == "gemini":
                  d = req_json(f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent",
                               {"x-goog-api-key": os.environ[KEYS[provider]], "content-type": "application/json"},
                               {"contents": [{"parts": [{"text": prompt}]}],
                                "generationConfig": {"temperature": 0, "maxOutputTokens": MAX_TOKENS}})
                  return "".join(p.get("text","") for c in d.get("candidates", []) for p in c.get("content", {}).get("parts", []))
              base = BASES[provider].rstrip("/")
              if not base.endswith("/v1"): base += "/v1"
              d = req_json(base + "/chat/completions",
                           {"Authorization": "Bearer " + os.environ[KEYS[provider]], "content-type": "application/json"},
                           {"model": model, "messages": [{"role": "user", "content": prompt}],
                            "temperature": 0, "max_tokens": MAX_TOKENS})
              return d["choices"][0]["message"]["content"]

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--phase", required=True)
              ap.add_argument("--prompt-file", required=True)
              ap.add_argument("--context-file")
              ap.add_argument("--out", required=True)
              ap.add_argument("--json", action="store_true")
              a = ap.parse_args()
              prompt = open(a.prompt_file, encoding="utf-8", errors="replace").read()
              if a.context_file and os.path.exists(a.context_file):
                  ctx = open(a.context_file, encoding="utf-8", errors="replace").read()
                  if len(ctx) > MAX_CTX: ctx = ctx[:MAX_CTX] + "\n...[TRUNCATED]"
                  prompt += "\n\n--- SCAN CONTEXT DATA (automated output, may contain noise) ---\n" + ctx
              order = [p.strip() for p in os.environ.get("AI_PROVIDER_ORDER","").split(",") if p.strip()]
              for provider in order:
                  if not os.environ.get(KEYS.get(provider, "")): continue
                  for model in candidates(provider):
                      for attempt, backoff in ((1, 3), (2, 8)):
                          try:
                              print(f"[ai] {a.phase}: trying {provider}/{model} (attempt {attempt})")
                              text = chat(provider, model, prompt)
                              if text and text.strip():
                                  with open(a.out, "w", encoding="utf-8") as f: f.write(text)
                                  if a.json:
                                      t = text.strip()
                                      if t.startswith("```"): t = t.split("```")[1].lstrip("json\n")
                                      dec = json.JSONDecoder()
                                      for i, ch in enumerate(t):
                                          if ch in "{[":
                                              try:
                                                  obj, _ = dec.raw_decode(t[i:])
                                                  with open(a.out + ".json", "w") as f: json.dump(obj, f, indent=2)
                                              except ValueError: pass
                                              break
                                  print(f"[ai] {a.phase}: OK via {provider}/{model} ({len(text)} chars)")
                                  return
                          except urllib.error.HTTPError as e:
                              if e.code in (401, 403): print(f"[ai] {provider}: key rejected ({e.code})"); break
                              if e.code == 404: print(f"[ai] {provider}/{model}: model unavailable — next model"); break
                              if e.code == 429: print(f"[ai] {provider}: rate-limited"); time.sleep(20); continue
                              print(f"[ai] {provider}/{model}: HTTP {e.code}")
                          except Exception as e:
                              print(f"[ai] {provider}/{model}: {e}")
                          time.sleep(backoff)
              with open(a.out, "w") as f:
                  f.write("SKIPPED — all AI providers failed or no key configured.\n")
              print(f"[ai] {a.phase}: SKIPPED (no working provider)")
          main()
          PYEOF
          echo "✅ AI helper ready"

      - name: "🤖 AI Analysis Phases (1→6)"
        continue-on-error: true
        timeout-minutes: 40
        run: |
          RD="results/$TIMESTAMP"
          AI="$RD/ai_agent"

          # ---------- context builders ----------
          {
            echo "== ASSET INVENTORY =="
            echo "target: $TARGET | mode: $HUNTING_MODE | tor: ${TOR_OK:-false}"
            echo "subdomains_dns_confirmed: $(wc -l < "$RD/subdomains/all_subs.txt" 2>/dev/null || echo 0)"
            echo "live_http_hosts: $(wc -l < "$RD/live/urls.txt" 2>/dev/null || echo 0)"
            echo "== TOP TECH =="; head -25 "$RD/meta/tech.txt" 2>/dev/null
            echo "== LIVE HOSTS (sample) =="; head -100 "$RD/live/httpx.tsv" 2>/dev/null
            echo "== ASN/CIDR =="; head -20 "$RD/subdomains/asn_cidrs.txt" 2>/dev/null
            echo "== OPEN PORTS =="; head -60 "$RD/ports/naabu.txt" 2>/dev/null
            echo "== WAF =="; cat "$RD/waf_bypass/waf.txt" 2>/dev/null
          } > /tmp/ctx1.txt

          {
            echo "== JS ENDPOINTS =="; head -600 "$RD/js/endpoints_raw.txt" 2>/dev/null
            echo "== SECRETS (SecretFinder) =="; head -150 "$RD/js/secrets.txt" 2>/dev/null
            echo "== SECRETS (trufflehog verified) =="; head -50 "$RD/js/secrets_trufflehog.txt" 2>/dev/null
            echo "== SOURCE MAP FINDINGS =="; head -50 "$RD/source_maps/findings.txt" 2>/dev/null
            echo "== GRAPHQL =="; head -30 "$RD/graphql/live.txt" 2>/dev/null
          } > /tmp/ctx2.txt

          {
            echo "== NUCLEI FINDINGS (jsonl, raw) =="; head -c 20000 "$RD/nuclei/results.jsonl" 2>/dev/null
            echo; echo "== CONFIRMED INFO DISCLOSURE =="; cat "$RD/info_disclosure/git_exposure.txt" 2>/dev/null
            echo "== TAKEOVER =="; head -30 "$RD/takeover/subzy.txt" 2>/dev/null
            echo "== CRLF =="; head -20 "$RD/crlf/crlf.txt" 2>/dev/null
            echo "== XSS (dalfox) =="; head -40 "$RD/xss/dalfox.txt" 2>/dev/null
            echo "== CORS =="; head -60 "$RD/cors/corsy.txt" 2>/dev/null
          } > /tmp/ctx3.txt

          {
            echo "== ASN/CIDR =="; cat "$RD/subdomains/asn_cidrs.txt" 2>/dev/null
            echo "== CDN FRONTED HOSTS =="; head -50 "$RD/meta/cdn_hosts.txt" 2>/dev/null
            echo "== OPEN PORTS =="; cat "$RD/ports/naabu.txt" 2>/dev/null
            echo "== TECH =="; head -25 "$RD/meta/tech.txt" 2>/dev/null
          } > /tmp/ctx4.txt

          # ---------- prompts ----------
          cat > /tmp/p1.prompt <<'EOF'
          You are a senior bug bounty recon analyst. Given this asset inventory,
          identify: (1) the highest-value attack-surface targets and WHY, (2) unusual
          or risky technology combinations, (3) likely weak spots worth prioritized
          testing, (4) anything missing from this recon that should be collected next.
          Be concrete and reference actual hostnames. Output clean markdown.
          EOF
          cat > /tmp/p2.prompt <<'EOF'
          You are a JS/secrets triage analyst. Classify each secret-looking string:
          real credential vs placeholder/test value vs public key. List the JS
          endpoints most worth active testing (auth, admin, debug, old versions).
          Never invent findings that are not in the data. Output clean markdown.
          EOF
          cat > /tmp/p3.prompt <<'EOF'
          You are a vulnerability triage analyst. Given raw scanner output, produce
          STRICT JSON only (no prose, no code fences): a JSON array where each item is
          {"title":str,"severity":"critical|high|medium|low","confidence":0-1,
          "false_positive_risk":str,"reasoning":str,"next_step":str}. Include ONLY
          real items supported by the data. Deduplicate near-identical findings.
          EOF
          cat > /tmp/p4.prompt <<'EOF'
          You are an infrastructure security analyst. Given ASN/CIDR, CDN, ports and
          tech data, assess infrastructure-level risks: exposed services that should
          not be public, non-standard ports, CDN/WAF coverage gaps, possible origin
          IP leaks. Be concrete. Output clean markdown.
          EOF
          cat > /tmp/p5.prompt <<'EOF'
          You are a bug bounty strategist. Given all prior analysis outputs and raw
          scan context, produce a prioritized exploitation/verification roadmap:
          ordered list of the next 5-10 concrete actions, each with expected impact
          and effort. Focus on actions a single operator can complete today.
          Output clean markdown.
          EOF
          cat > /tmp/p6.prompt <<'EOF'
          You are an executive report writer. Produce: (1) a 10-line executive summary
          of this scan in plain language, (2) the top 5 actions by impact, (3) an
          honest confidence statement about scan completeness and any tooling failures
          visible in the data. Output clean markdown, no fluff.
          EOF

          ctx5=/tmp/ctx5.txt; : > "$ctx5"
          for f in 01_attack_surface 02_js_secrets 04_infrastructure; do
            [ -s "$AI/$f.md" ] && { echo "== PHASE: $f =="; head -c 7000 "$AI/$f.md"; echo; } >> "$ctx5"
          done
          head -c 8000 /tmp/ctx3.txt >> "$ctx5"

          ctx6=/tmp/ctx6.txt; : > "$ctx6"
          for f in "$AI"/*.md; do [ -s "$f" ] && { echo "== $(basename "$f") =="; head -c 4000 "$f"; echo; } >> "$ctx6"; done

          # ---------- run phases ----------
          python3 /tmp/ai_helper.py --phase 01_attack_surface --prompt-file /tmp/p1.prompt --context-file /tmp/ctx1.txt --out "$AI/01_attack_surface.md"
          python3 /tmp/ai_helper.py --phase 02_js_secrets      --prompt-file /tmp/p2.prompt --context-file /tmp/ctx2.txt --out "$AI/02_js_secrets.md"
          python3 /tmp/ai_helper.py --phase 03_vuln_triage     --prompt-file /tmp/p3.prompt --context-file /tmp/ctx3.txt --out "$AI/03_vuln_triage.md" --json
          python3 /tmp/ai_helper.py --phase 04_infrastructure  --prompt-file /tmp/p4.prompt --context-file /tmp/ctx4.txt --out "$AI/04_infrastructure.md"
          python3 /tmp/ai_helper.py --phase 05_roadmap         --prompt-file /tmp/p5.prompt --context-file "$ctx5"      --out "$AI/05_roadmap.md"
          python3 /tmp/ai_helper.py --phase 06_executive       --prompt-file /tmp/p6.prompt --context-file "$ctx6"      --out "$AI/06_executive.md"
          echo "✅ AI phases complete"

      # =========================================================================
      # CONSOLIDATION / REPORTING
      # =========================================================================
      - name: "📊 Consolidate Findings, SARIF & Summary"
        id: count_findings
        continue-on-error: true
        run: |
          RD="results/$TIMESTAMP"
          python3 << 'PYEOF'
          import json, os
          RD = "results/" + os.environ["TIMESTAMP"]
          sev_order = {"critical":0, "high":1, "medium":2, "low":3, "info":4, "unknown":5}
          findings = []
          for line in open(os.path.join(RD, "nuclei", "results.jsonl"), encoding="utf-8", errors="replace"):
              try: d = json.loads(line)
              except Exception: continue
              findings.append({
                  "source": "nuclei",
                  "rule": d.get("template-id") or d.get("templateID") or "?",
                  "name": (d.get("info") or {}).get("name", "?"),
                  "severity": ((d.get("info") or {}).get("severity") or "unknown").lower(),
                  "location": d.get("matched-at") or d.get("matchedAt") or d.get("host") or "?",
              })
          def count_file(path):
              p = os.path.join(RD, path)
              return sum(1 for _ in open(p, encoding="utf-8", errors="replace")) if os.path.exists(p) else 0
          extra = {
              "js_secrets":          count_file("js/secrets.txt"),
              "js_secrets_verified": count_file("js/secrets_trufflehog.txt"),
              "sourcemap_findings":  count_file("source_maps/findings.txt"),
              "git_exposure":        count_file("info_disclosure/git_exposure.txt"),
              "takeover":            count_file("takeover/subzy.txt"),
              "crlf":                count_file("crlf/crlf.txt"),
              "xss":                 count_file("xss/dalfox.txt"),
              "cors":                count_file("cors/corsy.txt"),
          }
          findings.sort(key=lambda f: sev_order.get(f["severity"], 9))
          counts = {}
          for f in findings: counts[f["severity"]] = counts.get(f["severity"], 0) + 1
          total = len(findings) + sum(v for k, v in extra.items() if k != "cors")
          lines = ["# ☢️ Nuclei Findings Summary", "",
                   f"**Total nuclei findings: {len(findings)}**  " +
                   "  ".join(f"{s}: {c}" for s, c in sorted(counts.items(), key=lambda x: sev_order.get(x[0], 9))), ""]
          lines += [f"| Severity | Name | Location |", "|---|---|---|"]
          for f in findings[:100]:
              lines.append(f"| {f['severity']} | {f['name'][:70]} | {f['location'][:80]} |")
          if len(findings) > 100: lines.append(f"| ... | (+{len(findings)-100} more, see results.jsonl) | |")
          lines += ["", "## Other Sources", ""] + [f"- {k}: {v}" for k, v in extra.items()]
          with open(os.path.join(RD, "nuclei", "summary.md"), "w") as f: f.write("\n".join(lines))

          # ---- SARIF (capped at 1000 results) ----
          level = {"critical":"error","high":"error","medium":"warning","low":"warning","info":"note"}
          rules, results, seen = [], [], set()
          for f in findings[:1000]:
              if f["rule"] in seen: continue
              seen.add(f["rule"])
              rules.append({"id": f["rule"], "shortDescription": {"text": f["name"][:200]}})
              results.append({
                  "ruleId": f["rule"], "ruleIndex": len(rules)-1,
                  "level": level.get(f["severity"], "note"),
                  "message": {"text": f"[{f['severity']}] {f['name']}"},
                  "locations": [{"physicalLocation": {"artifactLocation": {"uri": f["location"]}}}],
              })
          sarif = {"$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
                   "version": "2.1.0",
                   "runs": [{"tool": {"driver": {"name": "nuclei", "informationUri": "https://github.com/projectdiscovery/nuclei", "rules": rules}}, "results": results}]}
          with open(os.path.join(RD, "nuclei", "results.sarif"), "w") as f: json.dump(sarif, f, indent=1)

          with open(os.path.gettempdir() + "/zt_counts.env", "w") as f:
              f.write(f"finding_count={total}\n")
              f.write(f"critical={counts.get('critical',0) + extra['git_exposure']}\n")
              f.write(f"sarif_ready={'true' if findings else 'false'}\n")
              f.write(f"artifact_name=results-{os.environ['TIMESTAMP']}-{os.environ['TARGET']}\n")
          print(f"TOTAL FINDINGS: {total} | nuclei: {len(findings)} | extra: {extra}")
          PYEOF
          if [ -s /tmp/zt_counts.env ]; then cat /tmp/zt_counts.env >> "$GITHUB_OUTPUT"; fi

      - name: "📤 Upload Nuclei SARIF to Security Tab"
        if: ${{ steps.count_findings.outputs.sarif_ready == 'true' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3   # TODO: pin SHA
        with:
          sarif_file: results/${{ env.TIMESTAMP }}/nuclei/results.sarif
          category: nuclei

      - name: "📄 Build Final Report & Job Summary"
        continue-on-error: true
        run: |
          RD="results/$TIMESTAMP"
          python3 << 'PYEOF'
          import os, datetime
          RD = "results/" + os.environ["TIMESTAMP"]
          env = os.environ
          def wc(p):
              fp = os.path.join(RD, p)
              return sum(1 for _ in open(fp, encoding="utf-8", errors="replace")) if os.path.exists(fp) else 0
          def cat(p, cap=3000):
              fp = os.path.join(RD, p)
              if not os.path.exists(fp): return ""
              t = open(fp, encoding="utf-8", errors="replace").read()
              return (t[:cap] + "\n...[truncated]") if len(t) > cap else t
          L = [f"# 🎯 Zero Track Report — {env['TARGET']}",
               f"*run {env['TIMESTAMP']} · mode: {env['HUNTING_MODE']} · tor: {env.get('TOR_OK','false')} · generated {datetime.datetime.utcnow():%Y-%m-%d %H:%M} UTC*", ""]
          hw = cat("meta/scan_health_warning.txt")
          if hw:
              L += ["## ⚠️ SCAN HEALTH WARNING", "", hw, ""]
          L += ["## 📊 Asset Overview", "",
                f"| Metric | Value |", "|---|---|",
                f"| DNS-confirmed subdomains | {wc('subdomains/all_subs.txt')} |",
                f"| Live HTTP(S) hosts | {wc('live/urls.txt')} |",
                f"| Unique URLs collected | {wc('urls/all_urls.txt')} |",
                f"| JS files analyzed | {len(os.listdir(os.path.join(RD,'js','files'))) if os.path.isdir(os.path.join(RD,'js','files')) else 0} |",
                f"| Open ports | {wc('ports/naabu.txt')} |", ""]
          for title, path in [("☢️ Nuclei Summary","nuclei/summary.md"),
                              ("📂 Info Disclosure","info_disclosure/git_exposure.txt"),
                              ("💀 Takeover","takeover/subzy.txt"),
                              ("⚡ XSS","xss/dalfox.txt"),
                              ("↩️ CRLF","crlf/crlf.txt"),
                              ("🧭 CORS","cors/corsy.txt"),
                              ("📜 JS Secrets","js/secrets.txt"),
                              ("🗺️ Source Maps","source_maps/findings.txt"),
                              ("🔍 GraphQL","graphql/live.txt")]:
              body = cat(path)
              if body.strip():
                  L += [f"## {title}", "", "```", body, "```", ""]
          for f in sorted(os.listdir(os.path.join(RD, "ai_agent"))):
              if f.endswith(".md"):
                  body = cat(f"ai_agent/{f}", 6000)
                  if body and "SKIPPED" not in body[:60]:
                      L += [f"## 🤖 {f.replace('.md','').replace('_',' ').title()}", "", body, ""]
                  elif "SKIPPED" in body[:60]:
                      L += [f"## 🤖 {f.replace('.md','')} — skipped (no AI provider available)", ""]
          nf = cat("meta/new_findings.txt", 2000)
          if nf.strip():
              L += ["## 🆕 New vs Previous Run", "", "```", nf, "```", ""]
          report = "\n".join(L)
          with open(os.path.join(RD, "REPORT.md"), "w") as f: f.write(report)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
              f.write(report[:45000])
          print("✅ REPORT.md + job summary written")
          PYEOF

      - name: "🆕 Diff Against Previous Scan"
        continue-on-error: true
        run: |
          RD="results/$TIMESTAMP"
          python3 << 'PYEOF'
          import hashlib, os
          RD = "results/" + os.environ["TIMESTAMP"]
          def sig_file(path, source):
              p = os.path.join(RD, path)
              if not os.path.exists(p): return []
              out = []
              for line in open(p, encoding="utf-8", errors="replace"):
                  line = line.strip()
                  if line and "SKIPPED" not in line:
                      out.append(f"{source}|{hashlib.sha1(line.encode()).hexdigest()[:12]}|{line[:120]}")
              return out
          cur = []
          cur += sig_file("nuclei/results.jsonl", "nuclei")
          cur += sig_file("js/secrets.txt", "secret")
          cur += sig_file("js/secrets_trufflehog.txt", "secret")
          cur += sig_file("info_disclosure/git_exposure.txt", "disclosure")
          cur += sig_file("takeover/subzy.txt", "takeover")
          cur += sig_file("xss/dalfox.txt", "xss")
          cur += sig_file("crlf/crlf.txt", "crlf")
          cur = sorted(set(cur))
          with open(os.path.join(RD, "meta", "findings.sig"), "w") as f: f.write("\n".join(cur))
          prev_path = os.path.join(".previous_snapshot", "findings.sig")
          new = cur
          if os.path.exists(prev_path):
              prev = set(open(prev_path, encoding="utf-8", errors="replace").read().splitlines())
              new = [c for c in cur if c not in prev]
          with open(os.path.join(RD, "meta", "new_findings.txt"), "w") as f:
              f.write("\n".join(c.split("|", 2)[2] for c in new))
          print(f"findings signature: {len(cur)} total, {len(new)} NEW vs previous run")
          PYEOF

      - name: "🔔 Discord Notification"
        if: ${{ env.DISCORD_NOTIFY == 'true' }}
        continue-on-error: true
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || { echo "no webhook — skip"; exit 0; }
          python3 << 'PYEOF'
          import json, os, urllib.request
          env = os.environ
          RD = "results/" + env["TIMESTAMP"]
          def wc(p):
              fp = os.path.join(RD, p)
              return sum(1 for _ in open(fp, encoding="utf-8", errors="replace")) if os.path.exists(fp) else 0
          new = []
          nf = os.path.join(RD, "meta", "new_findings.txt")
          if os.path.exists(nf):
              new = [l.strip() for l in open(nf, encoding="utf-8", errors="replace") if l.strip()][:12]
          critical = int(os.environ.get("ZT_CRITICAL", "0")) if os.environ.get("ZT_CRITICAL") else wc("nuclei/results.jsonl")
          embed = {
              "title": f"🎯 Zero Track — {env['TARGET']}",
              "url": f"https://github.com/{env.get('GITHUB_REPOSITORY','')}/actions/runs/{env.get('GITHUB_RUN_ID','')}",
              "color": 0xe74c3c if new else 0x2ecc71,
              "fields": [
                  {"name": "Mode", "value": env["HUNTING_MODE"], "inline": True},
                  {"name": "Tor", "value": env.get("TOR_OK", "false"), "inline": True},
                  {"name": "Subdomains", "value": str(wc("subdomains/all_subs.txt")), "inline": True},
                  {"name": "Live hosts", "value": str(wc("live/urls.txt")), "inline": True},
                  {"name": "Nuclei findings", "value": str(wc("nuclei/results.jsonl")), "inline": True},
                  {"name": "NEW this run", "value": str(len(new)), "inline": True},
              ],
              "description": ("**🆕 New findings:**\n" + "\n".join(f"• {n[:150]}" for n in new)) if new else "No new findings vs previous run.",
          }
          req = urllib.request.Request(env["DISCORD_WEBHOOK"], data=json.dumps({"embeds": [embed]}).encode(),
                                       headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=15)
          print("✅ Discord notified")
          PYEOF

      - name: "🚨 Create GitHub Issue for Critical Findings"
        if: ${{ env.CREATE_ISSUE == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RD="results/$TIMESTAMP"
          [ -s "$RD/nuclei/results.jsonl" ] || exit 0
          critical=$(grep -c '"severity":"critical"' "$RD/nuclei/results.jsonl" 2>/dev/null || echo 0)
          high=$(grep -c '"severity":"high"' "$RD/nuclei/results.jsonl" 2>/dev/null || echo 0)
          gitexp=$(wc -l < "$RD/info_disclosure/git_exposure.txt" 2>/dev/null || echo 0)
          total_new=$(grep -c . "$RD/meta/new_findings.txt" 2>/dev/null || echo 0)
          if [ "$critical" -eq 0 ] && [ "$gitexp" -eq 0 ] && [ "$high" -eq 0 ]; then
            echo "ℹ️ No critical/high findings — no issue created."
            exit 0
          fi
          {
            echo "## Zero Track findings for \`${TARGET}\` (run ${TIMESTAMP})"
            echo "- Critical: $critical | High: $high | Confirmed .git exposure: $gitexp | New this run: $total_new"
            echo
            echo "See the full REPORT.md in artifact \`results-${TIMESTAMP}-${TARGET}\`."
            echo
            echo '```'; head -40 "$RD/meta/new_findings.txt" 2>/dev/null; echo '```'
          } > /tmp/issue_body.md
          gh issue create --title "🚨 Critical findings — $TARGET ($(date -u +%F))" \
            --body-file /tmp/issue_body.md 2>/dev/null || echo "⚠️ issue creation failed (non-critical)"

      - name: "🗄️ Save Scan Snapshot (for next run's diff)"
        continue-on-error: true
        run: |
          RD="results/$TIMESTAMP"
          cp "$RD/meta/findings.sig" .previous_snapshot/findings.sig 2>/dev/null || true
      - name: "🗄️ Persist Snapshot Cache"
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .previous_snapshot
          key: ${{ env.SNAPSHOT_KEY }}

      - name: "📦 Upload Results Artifact"
        continue-on-error: true
        uses: actions/upload-artifact@v4   # TODO: pin SHA
        with:
          name: results-${{ env.TIMESTAMP }}-${{ env.TARGET }}
          path: results/${{ env.TIMESTAMP }}
          retention-days: 30
          if-no-files-found: warn

      - name: "🏁 Done"
        run: |
          RD="results/$TIMESTAMP"
          echo "=========================================="
          echo "🎯 Zero Track v2 — scan complete: $TARGET"
          echo "   findings:  ${{ steps.count_findings.outputs.finding_count || '0' }}"
          echo "   artifact:  results-$TIMESTAMP-$TARGET"
          echo "   tor:       ${TOR_OK:-false}"
          echo "=========================================="
          cat "$RD/meta/scan_health_warning.txt" 2>/dev/null || true
